<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봄날퀴즈 · 기기 점검</title>
<style>
body{font-family:-apple-system,"Malgun Gothic",sans-serif;background:#f5efe6;color:#2a2a2a;margin:0;padding:18px;line-height:1.6}
h1{font-size:1.1rem;margin:0 0 4px}
p.s{color:#7a7570;font-size:.85rem;margin:0 0 16px}
.box{background:#fff;border:2px solid #e6ddd4;border-radius:14px;padding:14px 16px;margin-bottom:12px;word-break:break-all}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #eee;font-size:.9rem}
.ok{color:#2e7d32;font-weight:700}.no{color:#c62828;font-weight:700}
.big{font-size:1.05rem;font-weight:800}
</style></head><body>
<h1>🌸 봄날퀴즈 기기 점검</h1>
<p class="s">이 화면을 캡처해서 선생님께 보내 주세요.</p>
<div class="box"><div class="big" id="verdict">확인 중…</div><div id="ver" style="font-size:.9rem;color:#555;margin-top:6px"></div></div>
<div class="box" id="list"></div>
<div class="box"><div style="font-size:.78rem;color:#7a7570" id="ua"></div></div>
<script>
var T = [];
function add(name, ok){ T.push([name, ok]); }
try { add("주소 저장(localStorage)", (function(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }catch(e){ return false; } })()); } catch(e){ add("주소 저장(localStorage)", false); }
add("최신 문법(화살표 함수)", (function(){ try{ eval("(()=>1)()"); return true; }catch(e){ return false; } })());
add("최신 문법(비동기 async)", (function(){ try{ eval("(async function(){})"); return true; }catch(e){ return false; } })());
add("최신 문법(모듈 import)", (function(){ var s=document.createElement('script'); return 'noModule' in s; })());
add("최신 문법(옵셔널 체이닝)", (function(){ try{ eval("({a:1})?.a"); return true; }catch(e){ return false; } })());
add("소리 재생(Audio)", typeof Audio !== 'undefined');
add("말하기(TTS)", typeof speechSynthesis !== 'undefined');
add("앱 설치(서비스워커)", 'serviceWorker' in navigator);
add("인터넷 연결", navigator.onLine !== false);
var m = (navigator.userAgent.match(/Chrome\/(\d+)/) || navigator.userAgent.match(/SamsungBrowser\/(\d+)/) || [])[1];
var name = /SamsungBrowser/.test(navigator.userAgent) ? '삼성 인터넷' : (/Chrome/.test(navigator.userAgent) ? '크롬' : '알 수 없는 브라우저');
var html = '';
for (var i=0;i<T.length;i++){ html += '<div class="row"><span>'+T[i][0]+'</span><span class="'+(T[i][1]?'ok':'no')+'">'+(T[i][1]?'O 됨':'X 안 됨')+'</span></div>'; }
document.getElementById('list').innerHTML = html;
document.getElementById('ver').textContent = name + ' ' + (m || '버전 확인 안 됨') + ' 버전';
var bad = 0; for (var j=0;j<T.length;j++){ if(!T[j][1]) bad++; }
var v = document.getElementById('verdict');
if (bad === 0) { v.textContent = '✅ 이 기기는 봄날퀴즈를 쓸 수 있어요'; v.style.color='#2e7d32'; }
else { v.textContent = '⚠️ 이 기기는 브라우저가 오래됐어요 ('+bad+'가지 안 됨)'; v.style.color='#c62828'; }
document.getElementById('ua').textContent = navigator.userAgent;
</script>
<div class="box"><div style="font-weight:800;margin-bottom:6px">첫 화면 오류 검사</div>
<div id="iferr" style="font-size:.85rem;color:#555">검사 중… (10초쯤 걸려요)</div></div>
<script>
(function(){
  var out=document.getElementById('iferr');
  var f=document.createElement('iframe');
  f.style.cssText='width:1px;height:1px;opacity:0;position:absolute;left:-9999px';
  f.src='index.html?probe=1';
  var msgs=[];
  f.onload=function(){
    try{
      f.contentWindow.onerror=function(m,u,l,c){ msgs.push(m+' (줄 '+l+')'); return false; };
      setTimeout(function(){
        var w=f.contentWindow, txt='';
        try{ txt = (typeof w.submitName==='function' ? '로그인 기능 있음' : '로그인 기능 없음(스크립트 중단)'); }catch(e){ txt='확인 불가'; }
        var mod='';
        try{ mod = w.window._fbReady ? '자료 서버 연결됨' : '자료 서버 연결 안 됨'; }catch(e){ mod='자료 서버 연결 안 됨'; }
        out.innerHTML = txt + '<br>' + mod + (msgs.length? '<br><span class="no">오류: '+msgs.join('<br>')+'</span>' : '<br>오류 메시지 없음');
      }, 6000);
    }catch(e){ out.textContent='검사 실패: '+e.message; }
  };
  document.body.appendChild(f);
})();
</script>
</body></html>

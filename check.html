<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봄날퀴즈 · 기기 점검</title>
<style>
body{font-family:-apple-system,"Malgun Gothic",sans-serif;background:#f5efe6;color:#2a2a2a;margin:0;padding:18px;line-height:1.6}
h1{font-size:1.1rem;margin:0 0 4px}
p.s{color:#7a7570;font-size:.85rem;margin:0 0 16px}
.box{background:#fff;border:2px solid #e6ddd4;border-radius:14px;padding:14px 16px;margin-bottom:12px;word-break:break-all}
.box h2{font-size:.92rem;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #eee;font-size:.9rem}
.ok{color:#2e7d32;font-weight:700}.no{color:#c62828;font-weight:700}
.big{font-size:1.05rem;font-weight:800}
.msg{font-size:.82rem;color:#555;margin-top:8px;white-space:pre-wrap}
</style></head><body>
<h1>🌸 봄날퀴즈 기기 점검</h1>
<p class="s">아래 <b>세 칸이 모두 채워질 때까지</b> (10초쯤) 기다린 뒤 이 화면을 캡처해서 선생님께 보내 주세요.</p>

<div class="box"><div class="big" id="verdict">확인 중…</div><div id="ver" style="font-size:.9rem;color:#555;margin-top:6px"></div></div>

<div class="box"><h2>1. 브라우저 기능</h2><div id="list"></div></div>

<div class="box"><h2>2. 자료 서버 연결</h2><div id="net">검사 중…</div></div>

<div class="box"><h2>3. 로그인 검사 (가장 중요)</h2><div id="probe">검사 중…</div></div>

<div class="box"><div style="font-size:.78rem;color:#7a7570" id="ua"></div></div>

<script>
/* ── 1. 브라우저 기능 ── */
var T = [];
function add(name, ok){ T.push([name, ok]); }
add("주소 저장(localStorage)", (function(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }catch(e){ return false; } })());
add("최신 문법(화살표 함수)", (function(){ try{ eval("(()=>1)()"); return true; }catch(e){ return false; } })());
add("최신 문법(비동기 async)", (function(){ try{ eval("(async function(){})"); return true; }catch(e){ return false; } })());
add("최신 문법(모듈 import)", (function(){ var s=document.createElement('script'); return 'noModule' in s; })());
add("최신 문법(옵셔널 체이닝)", (function(){ try{ eval("({a:1})?.a"); return true; }catch(e){ return false; } })());
add("최신 문법(펼치기 ...)", (function(){ try{ eval("var o={a:1}; var b={...o};"); return true; }catch(e){ return false; } })());
add("통신 기능(fetch)", typeof fetch !== 'undefined');
add("소리 재생(Audio)", typeof Audio !== 'undefined');
add("말하기(TTS)", typeof speechSynthesis !== 'undefined');
add("앱 설치(서비스워커)", 'serviceWorker' in navigator);
var html = '';
for (var i=0;i<T.length;i++){ html += '<div class="row"><span>'+T[i][0]+'</span><span class="'+(T[i][1]?'ok':'no')+'">'+(T[i][1]?'O 됨':'X 안 됨')+'</span></div>'; }
document.getElementById('list').innerHTML = html;

var m = (navigator.userAgent.match(/Chrome\/(\d+)/) || navigator.userAgent.match(/SamsungBrowser\/(\d+)/) || [])[1];
var bname = /SamsungBrowser/.test(navigator.userAgent) ? '삼성 인터넷' : (/Chrome/.test(navigator.userAgent) ? '크롬' : (/Firefox/.test(navigator.userAgent) ? '파이어폭스' : '알 수 없는 브라우저'));
document.getElementById('ver').textContent = bname + ' ' + (m || '버전 확인 안 됨') + ' 버전';
document.getElementById('ua').textContent = navigator.userAgent;

var bad = 0; for (var j=0;j<T.length;j++){ if(!T[j][1]) bad++; }
function verdict(txt, good){
  var v = document.getElementById('verdict');
  v.textContent = txt; v.style.color = good ? '#2e7d32' : '#c62828';
}
verdict(bad===0 ? '⏳ 브라우저는 괜찮아요 · 로그인 검사 중…' : '⚠️ 브라우저가 오래됐어요 ('+bad+'가지 안 됨)', bad===0);
</script>

<script>
/* ── 2. 자료 서버(Firestore) 연결 ── */
(function(){
  var out = document.getElementById('net');
  var lines = [];
  function draw(){ out.innerHTML = lines.join('<br>'); }
  lines.push('확인 중…'); draw();

  function done(label, ok, extra){
    lines = lines.filter(function(x){ return x !== '확인 중…'; });
    lines.push('<span class="'+(ok?'ok':'no')+'">'+(ok?'O':'X')+'</span> ' + label + (extra ? ' — ' + extra : ''));
    draw();
  }

  // (a) REST 연결
  if (typeof fetch === 'undefined') { done('학생 정보 조회(REST)', false, 'fetch 기능 없음'); }
  else {
    var url = 'https://firestore.googleapis.com/v1/projects/bomnalvaca/databases/(default)/documents:runQuery';
    var body = { structuredQuery: { from:[{collectionId:'students'}], limit:1 } };
    var t0 = Date.now();
    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
      .then(function(r){ done('학생 정보 조회(REST)', r.ok, 'HTTP ' + r.status + ' · ' + (Date.now()-t0) + 'ms'); })
      .catch(function(e){ done('학생 정보 조회(REST)', false, String(e.message || e)); });
  }

  // (b) Firebase 모듈 불러오기
  var s = document.createElement('script');
  if (!('noModule' in s)) { done('Firebase 모듈', false, '이 브라우저는 모듈을 못 써요'); }
  else {
    var code = 'import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js")'
             + '.then(function(){ window.__modOK = true; }).catch(function(e){ window.__modOK = String(e.message||e); });';
    var tag = document.createElement('script');
    tag.type = 'module';
    tag.textContent = code;
    document.head.appendChild(tag);
    setTimeout(function(){
      if (window.__modOK === true) done('Firebase 모듈', true);
      else done('Firebase 모듈', false, window.__modOK ? String(window.__modOK).slice(0,80) : '응답 없음(차단된 듯)');
    }, 6000);
  }
})();
</script>

<script>
/* ── 3. 로그인 검사 — 실제 첫 화면을 열어 이름 로그인을 눌러 본다 ── */
(function(){
  var out = document.getElementById('probe');
  var f = document.createElement('iframe');
  f.style.cssText = 'width:1px;height:1px;opacity:0;position:absolute;left:-9999px';
  f.src = 'index.html?probe=1';
  var loaded = false;

  f.onload = function(){ loaded = true; setTimeout(report, 3500); };
  setTimeout(function(){ if(!loaded){ out.innerHTML = '<span class="no">X 첫 화면이 열리지 않았어요 (인터넷 또는 파일 문제)</span>'; } }, 12000);

  function report(){
    var w, lines = [];
    try { w = f.contentWindow; } catch(e){ out.innerHTML = '<span class="no">X 검사 불가</span>'; return; }

    function mark(label, ok, extra){
      lines.push('<div class="row"><span>'+label+(extra?' <span style="color:#888">('+extra+')</span>':'')+'</span><span class="'+(ok?'ok':'no')+'">'+(ok?'O':'X')+'</span></div>');
    }

    var hasLogin = false, hasSdk = false, errs = [];
    try { hasLogin = (typeof w.submitName === 'function'); } catch(e){}
    try { hasSdk = (typeof w._lookupStudent === 'function'); } catch(e){}
    try { errs = (w.__bnErr || []).slice(0); } catch(e){}

    mark('로그인 기능 준비', hasLogin, hasLogin ? '' : '스크립트가 중단됨');
    mark('자료 서버 SDK', hasSdk, hasSdk ? '' : 'REST로 대신 시도함');

    // 실제로 이름 로그인을 눌러 본다
    var moved = false, why = '';
    try {
      var d = w.document;
      var ni = d.getElementById('nameInput');
      if (!hasLogin) why = '로그인 기능 없음';
      else if (!ni) why = '이름 입력란을 못 찾음';
      else {
        ni.value = '점검';
        w.submitName();
        var act = d.querySelector('.screen.active');
        moved = !!(act && act.id === 'screen-pick');
        if (!moved) why = '화면이 ' + (act ? act.id : '없음') + ' 에서 멈춤';
      }
    } catch(e){ why = String(e.message || e); }
    mark('이름 로그인 눌러보기', moved, moved ? '' : why);

    var head = '<div class="row" style="border:0"><b>결과</b><b class="'+(moved?'ok':'no')+'">'
             + (moved ? '로그인 됩니다' : '로그인 안 됩니다') + '</b></div>';
    var errHtml = errs.length
      ? '<div class="msg no">기기에서 생긴 오류:\n' + errs.join('\n') + '</div>'
      : '<div class="msg">오류 메시지 없음</div>';
    out.innerHTML = head + lines.join('') + errHtml;

    var v = document.getElementById('verdict');
    if (moved) { v.textContent = '✅ 이 기기는 봄날퀴즈를 쓸 수 있어요'; v.style.color = '#2e7d32'; }
    else { v.textContent = '⚠️ 이 기기에서는 로그인이 안 돼요'; v.style.color = '#c62828'; }
  }

  document.body.appendChild(f);
})();
</script>
</body></html>

<script>
// ── DATA ──────────────────────────────────────────
const PASS = {"20-a": "We can sometimes assume that the whole will be as good as each of its parts. Suppose, for example, you're in charge of a startup, and you know that everyone you've brought on board is productive and efficient. It might seem logical to assume that, as a result, the startup will be productive and efficient, too — but this isn't necessarily true. The fallacy of composition fails to allow for how the different \"parts\" interact with each other — if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem. Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center. When assembling a team with a common goal, always check the overall view as well as the individuals involved.", "21-a": "Humans excel at visual imagery. Our brains evolved this ability to create an internal mental picture or model of the world in which we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world. There are even hints from brain-imaging studies by Harvard University psychologist Steve Kosslyn showing that your brain uses the same regions to imagine a scene as when you actually view one. But evolution has seen to it that such internally generated representations are never as authentic as the real thing. This is a wise bit of self-restraint on your genes' part. If your internal model of the world were a perfect substitute, then anytime you felt hungry you could simply imagine yourself at a banquet, consuming a feast. You would have no incentive to find real food and would soon starve to death. As the Bard said, \"You cannot cloy the hungry edge of appetite by bare imagination of a feast.\"\n*cloy: 배부르게 하다", "22-a": "For each objective probability — from one percent to 100 percent — we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but aren't likely — low-probability events — can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should. That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate its likelihood. For example, people who play the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million.", "23-a": "Many of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies — not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into productive costs — with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from.", "24-a": "The light from even our nearest stellar neighbour takes four years to reach us. When we look at the stars, we are looking back in time. This is an incredible gift. We can see parts of space, parts of our universe, as they were many years ago. The further we can collect light from, the further back in time we can look. If you look at the bright star Betelgeuse, which glows in the Orion constellation, you wind time back more than six hundred years. Its reddish glow started its journey to Earth in the Middle Ages. The stars in Orion's belt are even further away. Their light, familiar to generations of humans, has travelled at least 1,000 years to reach us. This means we have a chance of understanding the history of the universe because we can see the more distant parts of it as they were in the past, thousands or millions or billions of years ago.\n*stellar: 별의 **constellation: 별자리", "26-a": "Jacob Lawrence was an American painter known for vivid scenes of African-American history and daily life. Born in Atlantic City in 1917, he moved to Harlem at 13 and studied art at Utopia Children's Center. He used bright colors and simplified shapes in his paintings. The Migration Series, widely regarded as Jacob Lawrence's masterpiece, brought him national recognition. During World War II, he served in the U.S. Coast Guard and produced many paintings, but most of them were lost. Later, he taught at the University of Washington for 16 years. Throughout his lifetime, he received honorary degrees from several universities, including Harvard. Until a few weeks before his death, he continued to explore the lives of African-Americans through his painting.", "29-a": "The renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that — because of a printing error — offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important — brain strain.", "30-a": "Usually, innovative high-tech products have low price elasticity. This means that high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. Additionally, at the first stage of the technology, buyers — either innovators or forerunners — are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set. At that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. Furthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer's confidence in the company.", "31-a": "One easily underappreciated feature of a city street or square is its \"future-proof\" nature. The ancient medieval squares in places like Marrakesh and Siena are still places where stuff is sold every day, even if the stuff itself has changed over the last five hundred years. The city square is a fairly future-proof technology, as is the shopping street, even in an age of online shopping. For example, the same physical store that once sold buggy whips and typewriters might now repair damaged phones and sell bubble tea. The same infrastructure supports evolving uses. Jane Jacobs, the great prophet of the city economy, made much of this fact in her books, including The Death and Life of Great American Cities and The Nature of Economies. As she pointed out, the great advantage of a city architecture is its ability to support change in uses, and Jacobs correctly predicted the persistence of the city itself, unlike those who predicted the rise of the Internet would mean the death of the city.", "32-a": "The genomics revolution made it possible to see just how impactful touch is to plants on a deeper level. Peering at the genes of Arabidopsis thaliana, a weedy plant in the mustard family and the lab rat of the plant biology world, researchers saw that touch quietly triggered such a dramatic response in their hormones and gene expression that it could substantially inhibit their growth. They stroked the arabidopsis with soft paintbrushes, and then analyzed the plants' genetic responses. Within thirty minutes of being touched, 10 percent of the plant's genome was altered. Clearly, the plant was reorganizing its priorities to deal with the disturbance, and rerouting energy away from the hard work of getting taller. Touched multiple times, arabidopsis cut its upward growth rate by as much as 30 percent.", "33-a": "Evolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of the area, a shift in the prevailing wind. Such changes do happen when we are dealing with a timescale as long as the evolutionary one. As a consequence, evolution normally does not come to a halt, but constantly tracks the changing environment. If there is a steady downward drift in the average temperature in the area, a drift that persists over centuries, successive generations of animals will be propelled by a steady selection 'pressure' in the direction, say, of growing longer coats of hair. If after a few thousand years of reduced temperature the trend reverses and average temperatures creep up again, the animals will come under the influence of a new selection pressure, and will be pushed towards growing shorter coats again.", "34-a": "The high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space.\n*entrepreneurial: 기업가의", "35-a": "The process we go through when we look at a work of art to determine if we recognize and can make sense of its content is not just a visual one. It is a mental process as well, largely based on the elements within and about the work we can identify and categorize. As we look and think, we may be given clues about what the work means by where it is, when it was made, what culture it came from, who created it, or why it was made. Any information we can gather helps us understand the work's context, that is, for what historical, social, personal, political, or scientific reasons the work of art was made. And then, using all the contextual information we have gathered, we interpret the work of art's content to discover what it means or symbolizes.", "36-a": "For most animals the struggle to survive takes up all their time. Finding food and drink, keeping warm and clean, avoiding predators, migrating and reproducing use up all their energies. If they do have any time to spare, they spend it resting or sleeping. Only very young animals, under the protection of their parents, have enough surplus energy to engage in lively bouts of play. This was also true for our early ancestors. The constant search for food would have put heavy demands upon them. But as they slowly evolved into more and more efficient hunters, the situation changed. The secret of their success was the development of much greater intelligence. They used brain not brawn to kill their prey. At the end of the long hunting era, before they turned to farming, they were already enjoying some degree of affluence. In certain regions, at particular times of year, the prey was sufficiently plentiful and their hunting techniques sufficiently advanced for them to experience a remarkable degree of prosperity. They had time on their hands.", "37-a": "Think about a time when you were startled. Did you come to a sudden stop, freeze all your movements, and hold your breath as you scanned the environment for a threat? All these responses maximize our ability to avoid detection, locate the source of possible danger, and prepare to fight or flee. As sophisticated as language has become, it is still the creation of sound that might give away our location to a potential predator. Because of this, the freeze response results in the inhibition of language in highly stressful and traumatic situations. Natural selection promoted the evolution of language but conserved the freeze rule. When the threat passes, we begin to relax and find our voices again, perhaps even to laugh at our own reactions. But what if we can never relax? What if our experiences shape our brain to be in a constant state of fear? This interference with the proper development and integration of neural networks can result in chronic stress and even mental illness.", "38-a": "Video gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events — such as what might happen when a person plays violent video games — this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people.", "39-a": "Realising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" — similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them.\n*charade: 뻔한 속임수", "40-a": "The brain needs to create a model of a constant pulse — a schema — so that we know when the musicians are not conforming to it. This is similar to variations of a melody: We need to have a mental representation of what the melody is in order to know — and appreciate — when the musician is taking liberties with it. Metrical extraction, knowing what the pulse is and when we expect it to occur, is a crucial part of musical emotion. Music communicates to us emotionally through systematic violations of expectations. These violations can occur in any domain — the domain of pitch, rhythm, tempo, and so on — but occur they must. Music is organized sound, but the organization has to involve some element of the unexpected or it is emotionally flat and robotic. Too much organization may technically still be music, but it would be music that no one wants to listen to.", "42-a": "The major consumer of oil is transport. But consider what has happened over the last 30 years or so to the technology involved in producing the internal combustion engine. Because oil is expensive, car engines today are far more efficient in their consumption of fuel (and far less polluting) than they were in 1972. The cars that Asia buys tomorrow will certainly not be anything like those Americans use today. Americans will not buy today's cars tomorrow either. In fact, if the price of oil does rise much further then fuel cell technology (which produces energy from water!) will receive yet another momentum. The big car multinationals have already produced the prototype motors — they are currently racing to try and get prices down and engine performances up. Their future profits depend upon it. Imagine now if there is a breakthrough in fuel cell technology. What would happen to oil prices? They would fall dramatically — signalling much less demand than supply — and oil companies and OPEC oil producers would stand to lose much income. The fact that this threat is real is driving the producers to look for alternative sources of income. The 'oil majors' have diversified and are now more energy companies than oil companies these days and the OPEC countries are urgently attempting to develop other industries."};
const QUESTIONS = [
{"no": 1, "school": "산동고 (구미시)", "pref": "20", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 모든 구성원이 생산적이고 효율적인 스타트업을 맡았다고 가정 ② 그 결과 스타트업도 생산적일 것이라 여기기 쉽지만 반드시 그렇지는 않음 ③ 'Therefore, the productivity of a startup can be reliably predicted by adding up the efficiency of each individual member.' ④ 구성의 오류는 부분들 간의 상호작용을 고려하지 못함 ⑤ 좋은 사람들로 구성된 조직도 실패할 프로젝트를 할 수 있음)", "p": "20-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 3, "exp": "③은 개인의 효율성을 더하면 전체 생산성을 예측할 수 있다는 내용으로, 전체가 부분의 합으로 결정되지 않는다는 글의 논지와 반대된다.", "b": 1, "bb": "[학교 변형 지문]\nWe can sometimes assume that the whole will be as good as each of its parts. ⓐ[Suppose, for example, you're in charge of a startup, and you know that everyone you've brought on board is productive and efficient]. ⓑ[It might seem logical to assume that, as a result, the startup will be productive and efficient, too ─ but this isn't necessarily true]. ⓒ[Therefore, the productivity of a startup can be reliably predicted by adding up the efficiency of each individual member]. ⓓ[The fallacy of composition fails to allow for how the different \"parts\" interact with each other ─ if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem]. ⓔ[Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center]. When assembling a team with a common goal, always check the overall view as well as the individuals involved."},
{"no": 2, "school": "문명고 (경산시)", "pref": "20", "type": "요약", "stem": "요약 - 'The fallacy of composition arises when people assume that a whole will share the qualities of its parts, overlooking (A)___ among those parts. Therefore, evaluating a team requires attention not only to individual strengths but also to its (B)___.'", "p": "20-a", "choices": ["(A) interactions — (B) overall structure", "(A) differences — (B) financial status", "(A) competition — (B) productivity", "(A) similarities — (B) leadership", "(A) conflicts — (B) diversity"], "ans": 1, "exp": "구성의 오류는 부분들 사이의 상호작용(interactions)을 간과하는 것이므로, 팀 평가 시 전체 구조(overall structure)도 살펴야 한다.", "b": 1, "bb": "[학교 변형 지문]\nWe can sometimes assume that the whole will be as good as each of its parts. Suppose, for example, you're in charge of a startup, and you know that everyone you've brought on board is productive and efficient. It might seem logical to assume that, as a result, the startup will be productive and efficient, too ─ but this isn't necessarily true. The fallacy of composition fails to allow for how the different \"parts\" interact with each other ─ if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem. Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center. When assembling a team with a common goal, always check the overall view as well as the individuals involved."},
{"no": 3, "school": "인일여고 (인천시)", "pref": "20", "type": "빈칸", "stem": "다음 빈칸 'When assembling a team with a common goal, ___.'에 들어갈 말로 가장 적절한 것은?", "p": "20-a", "choices": ["you must prioritize the overall view over individual actions", "the team needs to be inspired through fair and sufficient rewards", "how a team is assembled plays a critical role in the success of a project", "it is essential to focus on the details without losing sight of the bigger picture", "the ability of one great leader should be considered more than that of the team"], "ans": 4, "exp": "팀을 구성할 때 개별 요소를 살피되 전체적인 관점(bigger picture)을 놓치지 말아야 한다는 결론이다.", "b": 1, "bb": "[학교 변형 지문]\nWe can sometimes assume that the whole will be as good as each of its parts. Suppose, for example, you're in charge of a startup, and you know that everyone you've brought on board is productive and efficient. It might seem logical to assume that, as a result, the startup will be productive and efficient, too – but this isn't necessarily true. The fallacy of composition fails to allow for how the different \"parts\" interact with each other – if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem. Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center. When assembling a team with a common goal, [___________________________________________]."},

{"no": 5, "school": "선사고 (서울시)", "pref": "20", "type": "영영풀이", "stem": "다음 글의 밑줄 친 The fallacy of composition의 정의로 가장 적절한 것은?", "p": "20-a", "choices": ["a cognitive bias where people prefer options with known probabilities over those with unknown or missing information", "a logical fallacy where a person applies the outcome of a single, isolated event to all future situations, assuming that because something happened once, it will happen repeatedly", "the tendency to search for, interpret, favor and recall information in a way that confirms or supports one's prior beliefs, values, or decisions", "an informal logical error that occurs when you incorrectly assume that what is true for the individual parts must also be true for the whole", "the mistaken belief that if an independent, random event happens more frequently than normal during a given period, it is less likely to happen in the future"], "ans": 4, "exp": "구성의 오류는 부분에 참인 것이 전체에도 참이라고 잘못 가정하는 비형식적 논리 오류이다.", "b": 1, "bb": "[학교 변형 지문]\nWe can sometimes assume that the whole will be as good as each of its parts. Suppose, for example, you're in charge of a startup, and you know that everyone you've brought on board is productive and efficient. It might seem logical to assume that, as a result, the startup will be productive and efficient, too─but this isn't necessarily true. The fallacy of composition fails to allow for how the different \"parts\" interact with each other─if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem. Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center. When assembling a team with a common goal, always check the overall view as well as the individuals involved."},

{"no": 7, "school": "일신여고 (청주시)", "pref": "20", "type": "주장", "stem": "다음 글에서 필자가 주장하는 바로 가장 적절한 것은?", "p": "20-a", "choices": ["Prioritize hiring the most talented individuals, since a team's success is decided mainly by the ability of each member.", "Check not only how capable each member is but also how the members interact and how well the whole works together.", "Remember that the quality of a whole depends more on the individuals who make it up than on how well their roles fit together.", "Allocate every task and responsibility to one clearly designated person so that no member ever assumes someone else is responsible.", "Bring together people with a wide range of interests, and trust that their many ideas will naturally come together into a strong, well-working whole."], "ans": 2, "exp": "구성원 개개인의 능력뿐 아니라 구성원 간 상호작용과 전체의 기능까지 살펴야 한다는 것이 필자의 주장이다.", "b": 2, "bb": "[학교 변형 지문]\nWe can sometimes assume that the whole will be as good as each of its parts. Suppose, for example, you're in charge of a startup, and you know that everyone you've brought on board is productive and efficient. It might seem logical to assume that, as a result, the startup will be productive and efficient, too – but this isn't necessarily true. The fallacy of composition fails to allow for how the different \"parts\" interact with each other – if, for example, your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem. Equally, a unit composed of good people can still be working on a doomed project, and a project composed of good ideas may lack a stable center. Always check the overall view as well as the individuals involved."},
{"no": 8, "school": "봉명고 (청주시)", "pref": "20", "type": "밑줄의미", "stem": "다음 글의 밑줄 친 (A)~(E)의 의미를 풀어쓴 것 중 옳지 않은 것은? ((A) It might seem logical to assume that, as a result, the startup will be productive and efficient, too – but this isn't necessarily true (B) The fallacy of composition fails to allow for how the different \"parts\" interact with each other (C) If your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem (D) A unit composed of good people can still be working on a doomed project (E) When assembling a team with a common goal, always check the overall view as well as the individuals involved)", "p": "20-a", "choices": ["(A) Even though every member of the startup performs well individually, it does not guarantee that the startup itself will be equally productive and efficient", "(B) The fallacy of composition takes into full account how each individual component engages with and responds to each other", "(C) A problem can arise when both the administrator and the IT director each mistakenly assume that the other is handling the task of checking the prototype test results", "(D) A group consisting of capable individuals may still be involved in a project that is destined to fail", "(E) When building a team toward a shared objective, it is important to look at both the whole picture and each member individually"], "ans": 2, "exp": "(B)의 fails to allow for는 '~을 고려하지 못하다'라는 뜻이므로, 상호작용을 충분히 고려한다는 ②는 반대 의미이다.", "b": 2, "bb": "[학교 변형 지문]\nWe can sometimes assume that the whole will be as good as each of its parts. Suppose, for example, you're in charge of a startup, and you know that everyone you've brought on board is productive and efficient. (A)[It might seem logical to assume that, as a result, the startup will be productive and efficient, too – but this isn't necessarily true]. (B)[The fallacy of composition fails to allow for how the different \"parts\" interact with each other]. (C)[If your efficient administrator and your highly skilled head of IT each assumes the other is in charge of collating prototype test results, then you have a problem]. (D)[A unit composed of good people can still be working on a doomed project], and a project composed of good ideas may lack a stable center. (E)[When assembling a team with a common goal, always check the overall view as well as the individuals involved]."},
{"no": 9, "school": "인성여고 (인천시)", "pref": "21", "type": "문장삽입", "stem": "글의 흐름으로 보아, [주어진 문장]이 들어가기에 가장 적절한 곳은?", "p": "21-a", "choices": ["(A) 자리", "(B) 자리", "(C) 자리", "(D) 자리", "(E) 자리"], "ans": 2, "exp": "such internally generated representations는 뇌 영상 연구의 '상상한 장면'을 가리키고, This is a wise bit of self-restraint가 주어진 문장을 받는다.", "b": 1, "bb": "[학교 변형 지문]\n[주어진 문장] But evolution has seen to it that such internally generated representations are never as authentic as the real thing.\n\nHumans excel at visual imagery. Our brains evolved this ability to create an internal mental picture or model of the world in which we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world. (A) There are even hints from brain-imaging studies by Harvard University psychologist Steve Kosslyn showing that your brain uses the same regions to imagine a scene as when you actually view one. (B) This is a wise bit of self-restraint on your genes' part. (C) If your internal model of the world were a perfect substitute, then anytime you felt hungry you could simply imagine yourself at a banquet, consuming a feast. (D) You would have no incentive to find real food and would soon starve to death. (E) As the Bard said, \"You cannot cloy the hungry edge of appetite by bare imagination of a feast.\""},

{"no": 16, "school": "청주여고 (청주시)", "pref": "21", "type": "요약", "stem": "요약 - 'Evolution has imposed strict (A)___ on our visual imagery, ensuring that our mental simulations remain fundamentally (B)___ actual physical experiences.'", "p": "21-a", "choices": ["(A) enhancements — (B) isolated from", "(A) limitations — (B) distinct from", "(A) boundaries — (B) identical to", "(A) flexibilities — (B) disconnected from", "(A) regulations — (B) identical to"], "ans": 2, "exp": "진화는 시각적 상상에 제한(limitations)을 두어 머릿속 경험이 실제 경험과 구별되도록(distinct from) 했다.", "b": 2, "bb": "[학교 변형 지문]\nHumans possess highly evolved visual imagery. In other words, our brains evolved the ability to create an internal mental picture or model of the world in which we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world. A study showed that your brain uses the same regions to imagine a scene as when you actually view one. But evolution has seen to it that such evolved imagery is never as authentic as the real thing. This is a wise bit of self-control on your genes' part. If your internal model of the world were a perfect replacement, anytime you felt hungry, you would simply imagine yourself consuming a feast instead of finding real food - and would soon starve to death. As the Bard said, \"You cannot cloy the hungry edge of appetite by bare imagination of a feast.\"\nEvolution has imposed strict (A)[__________] on our visual imagery, ensuring that our mental simulations remain fundamentally (B)[__________] actual physical experiences."},

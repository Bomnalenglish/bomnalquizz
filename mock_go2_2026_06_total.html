{"no": 23, "school": "공주고 (공주시)", "pref": "21", "type": "문장삽입", "stem": "글의 흐름으로 보아, [주어진 문장]이 들어가기에 가장 적절한 곳은?", "p": "21-a", "choices": ["(A) 자리", "(B) 자리", "(C) 자리", "(D) 자리", "(E) 자리"], "ans": 3, "exp": "뇌가 상상을 실제처럼 처리한다는 내용 뒤에 But으로 '상상은 실제만큼 진짜 같지 않다'고 제한하고, 이를 This가 받아야 한다.", "b": 2, "bb": "[학교 변형 지문]\n[주어진 문장] But evolution has seen to it that such internally generated representations are never as authentic as the real thing.\n\nHumans excel at visual imagery. Our brains evolved this ability to create an internal mental picture or model of the world in which we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world. (A) There are even hints from brain-imaging studies by Harvard University psychologist Steve Kosslyn showing that your brain uses the same regions to imagine a scene as when you actually view one. (B) In other words, our brain reacts as if the imagined events are actually taking place in front of our eyes. (C) This is a wise bit of self-restraint on your genes' part. (D) If your internal model of the world were a perfect substitute, then anytime you felt hungry you could simply imagine yourself at a banquet, consuming a feast. (E) You would have no incentive to find real food and would soon starve to death. As the Bard said, \"You cannot cloy the hungry edge of appetite by bare imagination of a feast.\""},
{"no": 24, "school": "일신여고 (청주시)", "pref": "22", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "22-a", "choices": ["ⓐ likely", "ⓑ objective", "ⓒ overestimate", "ⓓ larger", "ⓔ optimistic"], "ans": 4, "exp": "ⓓ larger → smaller: 확률이 낮을수록 그 가능성을 더 과대평가한다.", "b": 1, "bb": "[학교 변형 지문]\nFor each objective probability ─ from one percent to 100 percent ─ we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but aren't ⓐlikely ─ low-probability events ─ can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should. That is, an event that has an ⓑobjective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We ⓒoverestimate the likelihood of these low-probability events. In general, the ⓓlarger the probability, the more we overestimate its likelihood. For example, people who play the lottery are often ⓔoptimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million."},
{"no": 25, "school": "충북여고 (청주시)", "pref": "22", "type": "요약", "stem": "요약 - 'When making decisions, people tend to (A)___ the likelihood of events with low objective probabilities, becoming overly (B)___ about rare outcomes like winning the lottery.'", "p": "22-a", "choices": ["(A) magnify — (B) hopeful", "(A) underestimate — (B) skeptical", "(A) disregard — (B) indifferent", "(A) exaggerate — (B) cautious", "(A) overlook — (B) anxious"], "ans": 1, "exp": "사람들은 낮은 확률 사건의 가능성을 크게 부풀리고(magnify), 복권 당첨 같은 희박한 결과에 지나치게 희망적(hopeful)이 된다.", "b": 1, "bb": "[학교 변형 지문]\nFor each objective probability – from one percent to 100 percent – we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but aren't likely – low-probability events – can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should. That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate its likelihood. For example, people who play the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million."},
{"no": 26, "school": "충북여고 (청주시)", "pref": "22", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (학교 지문 4단락: (A) That is, an event that has an objective one-percent chance… (B) Events that could happen but aren't likely… Low-probability events tend to factor more into decisions… (C) For example, people who play the lottery… (D) We overestimate the likelihood of these low-probability events…)", "p": "22-a", "choices": ["(A)-(D)-(B)-(C)", "(B)-(A)-(D)-(C)", "(B)-(D)-(A)-(C)", "(C)-(A)-(B)-(D)", "(C)-(B)-(D)-(A)"], "ans": 2, "exp": "(B) 저확률 사건 정의 → (A) That is로 1%/5% 설명 → (D) 과대평가로 일반화 → (C) 복권 사례 순이다.", "b": 1, "bb": "[학교 변형 지문]\nFor each objective probability – from one percent to 100 percent – we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else?\n(A) That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring.\n(B) Events that could happen but aren't likely – low-probability events – can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should.\n(C) For example, people who play the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million.\n(D) We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate its likelihood."},
{"no": 27, "school": "충북여고 (청주시)", "pref": "22", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "22-a", "choices": ["ⓐ subjectively", "ⓑ overestimate", "ⓒ close at hand", "ⓓ more common", "ⓔ smaller"], "ans": 5, "exp": "ⓔ smaller → larger: 희박한 가능성을 실제 수치보다 더 크게 느낀다는 것이 글의 핵심이다.", "b": 1, "bb": "[학교 변형 지문]\nFor each objective probability – from one percent to 100 percent – we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but aren't likely – low-probability events – can be defined as probabilities up to about 25 percent. Low-probability events tend to carry more weight in decisions than they should. That is, an event that has an objective one-percent chance of occurring could ⓐsubjectively seem like it has a five-percent chance of occurring. We ⓑoverestimate the likelihood of these low-probability events. In general, the less likely the event, the more we overestimate its probability. For example, some people pay extra for extended warranties or insurance against unlikely disasters, treating remote risks as if they were ⓒclose at hand. Others avoid swimming in the ocean because they overestimate the chance of a shark attack, though such attacks are extremely rare. In the same way, after a single dramatic news report, people often believe that events like kidnappings or terrorist attacks are far ⓓmore common than they really are. In every case, a rare possibility feels much ⓔsmaller in our minds than the real numbers say it should."},
{"no": 28, "school": "공주고 (공주시)", "pref": "22", "type": "빈칸연결어", "stem": "다음 빈칸 (A), (B), (C)에 들어갈 말로 가장 적절한 것은? '(A)___, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. … (B)___, people who play the lottery are often optimistic about winning. (C)___, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million.'", "p": "22-a", "choices": ["(A) Thus — (B) Nevertheless — (C) In fact", "(A) Nonetheless — (B) However — (C) Yet", "(A) Specifically — (B) Additionally — (C) Consequently", "(A) Namely — (B) For instance — (C) In reality", "(A) Besides — (B) For example — (C) Similarly"], "ans": 4, "exp": "(A)는 앞 진술을 수치로 재진술(Namely), (B)는 복권 사례(For instance), (C)는 낙관과 다른 실제 확률(In reality)이다.", "b": 1, "bb": "[학교 변형 지문]\nFor each objective probability - from one percent to 100 percent - we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but aren't likely - low-probability events - can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should. (A)[__________], an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate its likelihood. (B)[__________], people who play the lottery are often optimistic about winning. (C)[__________], the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million."},
{"no": 29, "school": "연송고 (인천시)", "pref": "22", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "22-a", "choices": ["ⓐ influence", "ⓑ exaggerate", "ⓒ underestimate", "ⓓ hopeful", "ⓔ chances"], "ans": 3, "exp": "ⓒ underestimate → overestimate: 확률이 작을수록 그 가능성을 더 과대평가한다는 문맥이다.", "b": 2, "bb": "[학교 변형 지문]\nFor each objective probability - from one percent to 100 percent - we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but are not likely, which we call low-probability events, can be defined as probabilities up to about 25 percent. Low-probability events tend to ⓐinfluence decisions more than they should. That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We ⓑexaggerate the likelihood of these low-probability events. In general, the smaller the probability, the more we ⓒunderestimate its likelihood. For example, people who play the lottery are often ⓓhopeful about winning. However, the ⓔchances of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million."},
{"no": 30, "school": "경산여고 (경산시)", "pref": "22", "type": "요약", "stem": "요약 - 'Probability weighting leads individuals to perceive small probabilities as (A)___ likely than they actually are, causing subjective evaluations to become less (B)___ with statistical reality.'", "p": "22-a", "choices": ["(A) more — (B) consistent", "(A) less — (B) compatible", "(A) equally — (B) aligned", "(A) more — (B) engaged", "(A) less — (B) concerned"], "ans": 1, "exp": "낮은 확률을 실제보다 더(more) 가능성 있게 인식하여 주관적 평가가 통계적 현실과 덜 일치하게(consistent) 된다.", "b": 2, "bb": "[학교 변형 지문]\nFor each objective probability – from one percent to 100 percent – we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but are not likely – low-probability events – can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should. That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate its likelihood. Psychologists refer to this tendency as probability weighting, in which subjective judgments diverge from objective statistics. For example, people who play the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million. As a result, people sometimes make decisions that appear irrational when judged solely by numerical probabilities."},
{"no": 31, "school": "신흥고 (청주시)", "pref": "22", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "22-a", "choices": ["The Secrets to Winning the Most Popular Lotteries", "Objective Probability: The Only Key to Better Choices", "Why Do We Overestimate Small Chances in Decision-Making?", "How Accurate Are Subjective Weights for High-Probability Events?", "The Reasons Why People Prefer Certainty Over Random Events"], "ans": 3, "exp": "낮은 확률의 사건이 의사결정에서 과대평가되며 확률이 작을수록 더 과대평가된다는 내용이다.", "b": 2, "bb": "[학교 변형 지문]\nFor each objective probability – from one percent to 100 percent – we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could happen but aren't likely – low-probability events – can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they should. That is, an event that has an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate its likelihood. For example, people who play the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest popular U.S. lotteries are on the order of one in 175 million."},
{"no": 32, "school": "충북대학교사범대학부설고 (청주시)", "pref": "22", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "22-a", "choices": ["ⓐ happen", "ⓑ are", "ⓒ has", "ⓓ its", "ⓔ playing"], "ans": 2, "exp": "ⓑ are → should: 앞의 동사구 factor into decisions를 대신하는 조동사가 와야 한다(than they should).", "b": 2, "bb": "[학교 변형 지문]\n-- ⓑ는 Low-probability events tend to factor more into decisions than they should라는 비교구문으로, '낮은 확률 사건들이 마땅히 반영되어야 하는 것보다 더 많이 의사결정에 반영된다'는 뜻이므로 are가 아니라 should가 와야 합니다.\n-- 비교 절에서는 앞에서 이미 나온 동사구의 반복을 피하기 위해 조동사 뒤의 동사구를 생략할 수 있으며, should는 '마땅히 ~해야 하는 정도'를 나타낼 수 있습니다.\nFor each objective probability – from one percent to 100 percent – we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could ⓐhappen but aren't likely – low-probability events – can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they ⓑare. That is, an event that ⓒhas an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate ⓓits likelihood. For example, people ⓔplaying the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million."},
{"no": 33, "school": "공주고 (공주시)", "pref": "23", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "23-a", "choices": ["ⓐ getting", "ⓑ means", "ⓒ be reinvested", "ⓓ unifying", "ⓔ are"], "ans": 5, "exp": "ⓔ are → would: 앞의 benefit and grow를 대신하는 가정적 비교이므로 조동사 would가 와야 한다.", "b": 1, "bb": "[학교 변형 지문]\n-- ⓔ의 they are as independents는 '통화가 통합되지 않고 각각 독립체로 존재한다면 그 경제들이 얻고 성장할 것보다'라는 가정적 비교를 나타내므로, 앞의 benefit and grow를 대신하는 조동사 would가 와서 they would as independents가 되어야 합니다.\n-- 비교 대상이 현실의 단순한 상태가 아니라 어떤 조건에서 일어날 가정적 결과를 나타낼 때는 <would + 동사원형>을 사용하며, 앞에서 나온 동사구가 문맥상 명확하면 조동사 뒤의 반복되는 동사구를 생략할 수 있습니다.\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to ⓐgetting products to market at competitive prices. Transaction costs are significant for companies ─ not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency ⓑmeans that many of those transaction costs disappear and the savings can ⓒ[be reinvested] back into firms' productivity and innovation. Basically, useless costs turn into productive costs ─ with longer-term benefits to the whole economy. By ⓓunifying some of the currencies, whole economies benefit and grow more than they ⓔare as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 34, "school": "충북여고 (청주시)", "pref": "23", "type": "요약", "stem": "요약 - 'Adopting a common currency helps businesses eliminate various transaction costs, allowing useless expenses to be transformed into (A)___ investments that ultimately (B)___ the overall economic growth.'", "p": "23-a", "choices": ["(A) productive — (B) get in the way of", "(A) commercial — (B) restrict", "(A) beneficial — (B) boost", "(A) innovative — (B) inhibit", "(A) temporary — (B) foster"], "ans": 3, "exp": "불필요한 비용이 유익한(beneficial) 투자로 바뀌어 경제 성장을 촉진(boost)한다.", "b": 1, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies – not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into productive costs – with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 35, "school": "공주고 (공주시)", "pref": "23", "type": "빈칸", "stem": "다음 빈칸 'Basically, ___ - with longer-term benefits to the whole economy.'에 들어갈 말로 가장 적절한 것은?", "p": "23-a", "choices": ["unnecessary expenses become valuable investments", "transaction costs become much higher than before", "customers stop buying products from other countries", "companies spend more money on international marketing", "companies have to pay more taxes to the government"], "ans": 1, "exp": "공통 통화로 거래 비용이 사라지고 절감액이 재투자되므로 불필요한 비용이 가치 있는 투자로 바뀐다.", "b": 1, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies - not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, [_____________________________] - with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 36, "school": "공주고 (공주시)", "pref": "23", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "23-a", "choices": ["Economic Benefits of a Common Currency System", "Ethical Conflicts in Globalized Financial Markets", "Reasons for Taking Financial Risks in Investment", "The Need for Strict Regulation of Cash Transactions", "The Role of Marketing Strategies in Multinational Firms"], "ans": 1, "exp": "공통 통화가 거래 비용을 없애고 경제 성장 기반을 강화한다는 내용이므로 '공통 통화 체제의 경제적 이점'이 적절하다.", "b": 1, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies - not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into productive costs - with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 37, "school": "인성여고 (인천시)", "pref": "23", "type": "요약", "stem": "요약 - 'A common currency transforms economic resources from (A)___ to (B)___ strengthening the foundation for long-term growth.'", "p": "23-a", "choices": ["(A) trade restrictions — (B) economic autonomy", "(A) financial uncertainty — (B) market expansion", "(A) transactional burdens — (B) productive investment", "(A) competitive pressures — (B) private consumption", "(A) exchange fluctuations — (B) government intervention"], "ans": 3, "exp": "공통 통화는 거래상의 부담(transactional burdens)을 생산적 투자(productive investment)로 전환한다.", "b": 1, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies-not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into productive costs ─ with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 38, "school": "봉명고 (청주시)", "pref": "23", "type": "빈칸", "stem": "다음 빈칸 'Basically, useless costs turn into productive costs – with longer-term benefits to the whole economy. ___. So a common currency provides for a strong economic foundation that all can benefit from.'에 들어갈 말로 가장 적절한 것은?", "p": "23-a", "choices": ["Integrating currencies temporarily lowers transaction costs, but it ultimately restricts the growth of the whole economy", "Operating economies independently yields more significant long-term benefits than adopting a unified currency system", "For some countries to benefit from currency unification, they must first develop a sufficiently strong independent economic foundation", "Integrating some currencies allows economies to gain greater benefits and achieve more growth than when each country operates independently", "The more currencies are unified, the more a handful of economically powerful nations monopolize the benefits, resulting in unbalanced overall growth"], "ans": 4, "exp": "결론(모두에게 이익이 되는 경제 기반)의 근거로, 통화 통합 시 독립적일 때보다 더 큰 이익과 성장을 얻는다는 내용이 와야 한다.", "b": 1, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies – not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into productive costs – with longer-term benefits to the whole economy. [_________________________________________]. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 39, "school": "서울대학교사범대학부설고 (서울시)", "pref": "23", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "23-a", "choices": ["ⓐ competitive", "ⓑ significant", "ⓒ disappear", "ⓓ productive", "ⓔ separating"], "ans": 5, "exp": "ⓔ separating → unifying: 통화를 통합함으로써 경제 전체가 이익을 얻는다는 문맥이다.", "b": 2, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at ⓐcompetitive prices. Transaction costs are ⓑsignificant for companies - not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs ⓒdisappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into ⓓproductive costs - with longer-term benefits to the whole economy. By ⓔseparating some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 40, "school": "인성여고 (인천시)", "pref": "23", "type": "요약", "stem": "요약 - 'A common currency transforms economic resources from (A)___ to (B)___ strengthening the foundation for long-term growth.'", "p": "23-a", "choices": ["(A) trade restrictions — (B) economic autonomy", "(A) financial uncertainty — (B) market expansion", "(A) transactional burdens — (B) productive investment", "(A) competitive pressures — (B) private consumption", "(A) exchange fluctuations — (B) government intervention"], "ans": 3, "exp": "공통 통화는 거래상의 부담(transactional burdens)을 없애고 절감액을 생산적 투자(productive investment)로 전환한다.", "b": 2, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies-not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into productive costs ─ with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 41, "school": "해원고 (인천시)", "pref": "23", "type": "요지", "stem": "다음 글의 요지로 가장 적절한 것은?", "p": "23-a", "choices": ["환율 위험 관리 능력이 기업 성패의 핵심이다.", "낙후된 유통망이 다국적기업의 시장 진입을 방해한다.", "국가 간 기업 규제의 차이가 무역 장벽으로 작용한다.", "개별 통화의 가치 안정이 기업의 거래 비용을 없애는 핵심이다.", "공동 통화는 기업의 거래 비용을 없애 전체 경제 성장과 발전을 이끈다."], "ans": 5, "exp": "공동 통화는 거래 비용을 줄이고 절감액을 생산성과 혁신에 재투자하게 하여 경제 전체의 성장 기반을 강화한다.", "b": 2, "bb": "[학교 변형 지문]\nMany of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to getting products to market at competitive prices. Transaction costs are significant for companies - not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency means that many of those transaction costs disappear and the savings can be reinvested back into firms' productivity and innovation. Basically, useless costs turn into productive costs - with longer-term benefits to the whole economy. By unifying some of the currencies, whole economies benefit and grow more than they would as independents. So a common currency provides for a strong economic foundation that all can benefit from."},
{"no": 42, "school": "공주고 (공주시)", "pref": "24", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 베텔게우스의 붉은 빛은 중세에 지구로 출발함 ② 'The brightness of a star like Betelgeuse is primarily determined by its chemical composition and surface temperature rather than its spatial distance from Earth.' ③ 오리온 벨트의 별들은 훨씬 더 멀리 있음 ④ 그 빛은 최소 1,000년을 이동해 옴 ⑤ 먼 부분을 과거의 모습으로 보므로 우주의 역사를 이해할 기회가 있음)", "p": "24-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "별빛의 이동 시간 때문에 먼 별일수록 더 먼 과거를 본다는 흐름에서, 별의 밝기 결정 요인을 다룬 ②는 무관하다.", "b": 1, "bb": "[학교 변형 지문]\nThe light from even our nearest stellar neighbour takes four years to reach us. When we look at the stars, we are looking back in time. This is an incredible gift. We can see parts of space, parts of our universe, as they were many years ago. As we collect light from a far distance, we can look further back in time. If you look at the bright star Betelgeuse, which glows in the Orion constellation, you wind time back more than six hundred years. ⓐIts reddish glow started its journey to Earth in the Middle Ages. ⓑThe brightness of a star like Betelgeuse is primarily determined by its chemical composition and surface temperature rather than its spatial distance from Earth. ⓒThe stars in Orion's belt are even further away. ⓓTheir light, familiar to generations of humans, has travelled at least 1,000 years to reach us. ⓔThis means we have a chance of understanding the history of the universe because we can see the more distant parts of it as they were in the past, thousands or millions or billions of years ago."},
{"no": 43, "school": "주성고 (청주시)", "pref": "24", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (학교 지문: (A) The stars in Orion's belt are even further away. … (B) The further we can collect light from, the further back in time we can look. If you look at the bright star Betelgeuse… (C) 'It is through this cosmic time travel that we can witness the very stages of cosmic evolution, mapping out the birth of galaxies that existed long before our own solar system was formed.')", "p": "24-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 2, "exp": "(B) 원리와 베텔게우스 사례 → (A) even further away로 오리온 벨트 확장 → (C) '우주적 시간 여행'의 의의 종합 순이다.", "b": 1, "bb": "[학교 변형 지문]\nThe light from even our nearest stellar neighbour takes four years to reach us. When we look at the stars, we are looking back in time. This is an incredible gift. We can see parts of space, parts of our universe, as they were many years ago.\n(A) The stars in Orion's belt are even further away. Their light, familiar to generations of humans, has travelled at least 1,000 years to reach us. This means we have a chance of understanding the history of the universe because we can see the more distant parts of it as they were in the past, thousands or millions or billions of years ago.\n(B) The further we can collect light from, the further back in time we can look. If you look at the bright star Betelgeuse, which glows in the Orion constellation, you wind time back more than six hundred years. Its reddish glow started its journey to Earth in the Middle Ages.\n(C) It is through this cosmic time travel that we can witness the very stages of cosmic evolution, mapping out the birth of galaxies that existed long before our own solar system was formed.\n*stellar: 별의 **constellation: 별자리"},
{"no": 44, "school": "이순신고 (아산시)", "pref": "26", "type": "내용일치", "stem": "다음 Jacob Lawrence에 관한 글을 읽고 답할 수 있는 질문은?", "p": "26-a", "choices": ["Why did Jacob Lawrence decide to become a painter?", "Why were most of his paintings during World War II lost?", "How much were Jacob Lawrence's paintings sold for?", "Where did Jacob Lawrence create The Migration Series?", "What kind of scenes was Jacob Lawrence known for painting?"], "ans": 5, "exp": "첫 문장에서 아프리카계 미국인의 역사와 일상생활의 생생한 장면으로 알려졌다고 밝히므로 ⑤에 답할 수 있다.", "b": 1, "bb": "[학교 변형 지문]\nJacob Lawrence was an American painter known for vivid scenes of African-American history and daily life. Born in Atlantic City in 1917, he moved to Harlem at 13 and studied art at Utopia Children's Center. He used bright colors and simplified shapes in his paintings. The Migration Series, widely regarded as Jacob Lawrence's masterpiece, brought him national recognition. During World War Ⅱ, he served in the U.S. Coast Guard and produced many paintings, but most of them were lost. Later, he taught at the University of Washington for 16 years. Throughout his lifetime, he received honorary degrees from several universities, including Harvard. Until a few weeks before his death, he continued to explore the lives of African-Americans through his painting."},
{"no": 45, "school": "일신여고 (청주시)", "pref": "26", "type": "내용불일치", "stem": "다음 ⓐ~ⓔ 중 Jacob Lawrence에 관한 글의 내용과 일치하지 않는 것을 모두 고른 것은?", "p": "26-a", "choices": ["ⓐ, ⓑ", "ⓐ, ⓒ, ⓔ", "ⓑ, ⓓ", "ⓑ, ⓒ, ⓔ", "ⓑ, ⓒ, ⓓ, ⓔ"], "ans": 4, "exp": "ⓑ 13세에 Harlem으로 이주해 미술 공부, ⓒ 단순화된 형태 사용, ⓔ 사망 직전까지 아프리카계 미국인의 삶을 그림으로 탐구했다.", "b": 1, "bb": "[학교 변형 지문]\nJacob Lawrence was an American painter known for vivid scenes of African-American history and daily life. Born in Atlantic City in 1917, he moved to Harlem at 13 and studied art at Utopia Children's Center. He used bright colors and simplified shapes in his paintings. The Migration Series, widely regarded as Jacob Lawrence's masterpiece, brought him national recognition. During World War II, he served in the U.S. Coast Guard and produced many paintings, but most of them were lost. Later, he taught at the University of Washington for 16 years. Throughout his lifetime, he received honorary degrees from several universities, including Harvard. Until a few weeks before his death, he continued to explore the lives of African-Americans through his painting.\nⓐ 아프리카계 미국인의 역사와 일상의 생생한 장면들로 알려진 화가다.\nⓑ 13세에 Harlem을 떠나면서 학업을 중단했다.\nⓒ 그림에 밝은 색채와 복잡한 형태를 사용했다.\nⓓ 2차 세계대전 동안 미국 해안 경비대에서 복무했다.\nⓔ 사망 몇 주 전 아프리카로 모험을 떠났다."},
{"no": 46, "school": "신흥고 (청주시)", "pref": "26", "type": "내용불일치", "stem": "다음 Jacob Lawrence에 관한 글의 내용과 일치하지 않는 것은?", "p": "26-a", "choices": ["아프리카계 미국인의 역사와 일상생활을 생생하게 담아낸 화가이다.", "13세에 Harlem으로 이주하여 Utopia Children's Center에서 미술을 공부했다.", "그의 대표작인 The Migration Series를 통해 전국적인 명성을 얻었다.", "Washington 대학교에서 16년 동안 그림을 배웠다.", "사망하기 불과 몇 주 전까지도 그림을 통해 아프리카계 미국인의 삶을 탐구했다."], "ans": 4, "exp": "Washington 대학교에서 16년 동안 그림을 배운 것이 아니라 가르쳤다(taught).", "b": 1, "bb": "[학교 변형 지문]\nJacob Lawrence was an American painter known for vivid scenes of African-American history and daily life. Born in Atlantic City in 1917, he moved to Harlem at 13 and studied art at Utopia Children's Center. He used bright colors and simplified shapes in his paintings. The Migration Series, widely regarded as Jacob Lawrence's masterpiece, brought him national recognition. During World War Ⅱ, he served in the U.S. Coast Guard and produced many paintings, but most of them were lost. Later, he taught at the University of Washington for 16 years. Throughout his lifetime, he received honorary degrees from several universities, including Harvard. Until a few weeks before his death, he continued to explore the lives of African-Americans through his painting."},
{"no": 47, "school": "원묵고 (서울시)", "pref": "29", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "29-a", "choices": ["ⓐ automatically", "ⓑ discounted", "ⓒ habitually", "ⓓ minimal", "ⓔ inherently"], "ans": 4, "exp": "ⓓ minimal → much: 할인 없는 오류 쿠폰도 정상 쿠폰만큼 많은 반응을 얻었다는 의미이다.", "b": 1, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform ⓐautomatically.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a ⓑdiscounted purchase price by presenting the coupon. The extent to which we have learned to operate ⓒhabitually on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that – because of a printing error – offered no savings to recipients produced just as ⓓminimal customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something ⓔinherently more important – brain strain."},
{"no": 48, "school": "인성여고 (인천시)", "pref": "29", "type": "요약", "stem": "요약 - 'Discount coupons are valued not only for their economic benefits but also for their ability to reduce (A)___, allowing people to rely on (B)___.'", "p": "29-a", "choices": ["(A) financial risk — (B) careful calculation", "(A) mental effort — (B) automatic thinking", "(A) purchasing costs — (B) market competition", "(A) consumer demand — (B) rational judgment", "(A) economic inequality — (B) strategic planning"], "ans": 2, "exp": "쿠폰은 정신적 노력(mental effort)을 줄여 주어 자동적 사고(automatic thinking)에 의존하게 한다.", "b": 1, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that─because of a printing error─offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important─brain strain."},
{"no": 49, "school": "창문여고 (서울시)", "pref": "29", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중 어법상 어색한 것은?", "p": "29-a", "choices": ["ⓐ offered to civilization by the discount coupon", "ⓑ with which we have learned to operate mechanically", "ⓒ as did error-free coupons that offered substantial savings", "ⓓ Not only do we expect them to save us money", "ⓔ to handle something potentially more important"], "ans": 2, "exp": "ⓑ with which → to which: the extent to which(~하는 정도) 구조이다.", "b": 1, "bb": "[학교 변형 지문]\n-- ⓑ는 '우리가 그러한 가정에 따라 기계적으로 행동하는 정도'라는 뜻이므로 the extent to which ~의 고정적인 관계사 구조를 사용해야 하며, 따라서 with which를 to which로 고쳐야 합니다.\n-- <the extent to which + 주어 + 동사>는 '~하는 정도'라는 의미를 나타내며, 관계대명사 앞의 전치사는 선행 명사와 결합하는 관용적 표현에 맞게 선택해야 합니다.\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" ⓐ[offered to civilization by the discount coupon], which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent ⓑ[with which we have learned to operate mechanically] on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that - because of a printing error - offered no savings to recipients produced just as much customer response ⓒ[as did error-free coupons that offered substantial savings]. The obvious but instructive point here is that we expect discount coupons to do double duty. ⓓ[Not only do we expect them to save us money], we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage ⓔ[to handle something potentially more important] - brain strain."},
{"no": 50, "school": "산동고 (구미시)", "pref": "29", "type": "문장삽입", "stem": "글의 흐름으로 보아, [주어진 문장]이 들어가기에 가장 적절한 곳은?", "p": "29-a", "choices": ["(A) 자리", "(B) 자리", "(C) 자리", "(D) 자리", "(E) 자리"], "ans": 4, "exp": "오류 쿠폰 사례를 종합해 쿠폰의 두 가지 기능을 제시하고, 이어지는 Not only … also …가 그 두 기능을 구체화한다.", "b": 1, "bb": "[학교 변형 지문]\n[주어진 문장] The obvious but instructive point here is that we expect discount coupons to do double duty.\n\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" (A) Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. (B) The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. (C) Mailed-out coupons that ─ because of a printing error ─ offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. (D) Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. (E) In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important─brain strain."},
{"no": 51, "school": "공주고 (공주시)", "pref": "29", "type": "요약", "stem": "요약 - 'According to the text, discount coupons function not only to save money but also to (A)___ the mental energy required for choices, which triggers (B)___ consumer behavior.'", "p": "29-a", "choices": ["(A) emphasize — (B) intentional", "(A) emphasize — (B) mechanical", "(A) restore — (B) deliberate", "(A) reduce — (B) intentional", "(A) reduce — (B) mechanical"], "ans": 5, "exp": "쿠폰은 선택에 필요한 정신적 에너지를 줄여(reduce) 기계적인(mechanical) 소비 행동을 유발한다.", "b": 1, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that - because of a printing error - offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. This means that coupons help lessen the mental effort of making decisions. The obvious but instructive point here is that we expect discount coupons to do double duty. We not only expect them to save us money, but we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important - brain strain.\nAccording to the text, discount coupons function not only to save money but also to (A)[__________] the mental energy required for choices, which triggers (B)[__________] consumer behavior."},
{"no": 52, "school": "연송고 (인천시)", "pref": "29", "type": "빈칸", "stem": "다음 빈칸 'The obvious but instructive point here is that ___.'에 들어갈 말로 가장 적절한 것은?", "p": "29-a", "choices": ["people frequently mistake the appearance of a cost-saving opportunity for proof that an actual saving has occurred", "the effectiveness of promotional devices depends largely on consumers' tendency to overestimate future financial benefits", "the real utility of coupons lies less in their economic value than in their ability to relieve consumers of the burden of deliberation", "modern marketing succeeds by encouraging consumers to replace emotional reactions with systematic economic calculations", "consumers often regard the possession of a coupon as evidence that a purchase decision has already been rationally justified"], "ans": 3, "exp": "쿠폰은 돈뿐 아니라 고민에 드는 시간과 정신적 에너지도 절약해 주므로, 숙고의 부담을 덜어 주는 것이 진정한 효용이다.", "b": 1, "bb": "[학교 변형 지문]\nAlfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that - because of a printing error - offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that [_____________________________]. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important - brain strain."},
{"no": 53, "school": "배문고 (서울시)", "pref": "29", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중 어법상 어색한 것은?", "p": "29-a", "choices": ["ⓐ them", "ⓑ allows", "ⓒ were", "ⓓ required", "ⓔ important"], "ans": 3, "exp": "ⓒ were → did: 앞의 일반동사 produced를 대신하는 대동사 did가 와야 한다(as did error-free coupons).", "b": 2, "bb": "[학교 변형 지문]\n-- ⓒ는 *Mailed-out coupons ... produced just as much customer response as did error-free coupons ...*라는 비교 구문으로, did가 앞의 일반동사 produced를 대신하므로 be-동사 were가 아니라 대동사 did를 써야 합니다.\n-- as/than이 이끄는 비교 절에서는 앞의 일반동사를 반복하지 않기 위해 do/does/did를 대동사로 사용할 수 있고, 문어체에서는 as/than + 대동사 + 주어의 도치도 자연스럽게 쓰입니다.\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about ⓐthem.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which ⓑallows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed out coupons that - because of a printing error - offered no savings to recipients produced just as much customer response as ⓒwere error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy ⓓrequired to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more ⓔimportant - brain strain."},
{"no": 54, "school": "인성여고 (인천시)", "pref": "29", "type": "요약", "stem": "요약 - 'Discount coupons are valued not only for their economic benefits but also for their ability to reduce (A)___, allowing people to rely on (B)___.'", "p": "29-a", "choices": ["(A) financial risk — (B) careful calculation", "(A) mental effort — (B) automatic thinking", "(A) purchasing costs — (B) market competition", "(A) consumer demand — (B) rational judgment", "(A) economic inequality — (B) strategic planning"], "ans": 2, "exp": "할인 쿠폰은 금전적 절약뿐 아니라 정신적 노력(mental effort)을 줄여 자동적 사고(automatic thinking)에 의존하게 한다.", "b": 2, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that─because of a printing error─offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important─brain strain."},
{"no": 55, "school": "한국교원대학교부설고 (청주시)", "pref": "29", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (학교 재구성 지문) [주어진 글] Philosopher Alfred North Whitehead said that civilization advances when people can act without thinking. A discount coupon is one such case, making consumers assume it will lower the price. (A) The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. (B) In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important – the strain on our brains. (C) The experience of one automobile-tire company shows how mechanically we act on that assumption. Even mailed coupons with a printing error and no actual savings drew as much customer response as error-free coupons offering substantial savings.", "p": "29-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 4, "exp": "(C) 타이어 회사 사례 → (A) 쿠폰의 두 가지 기능 정리 → (B) 두 이점을 pocketbook strain과 brain strain에 연결하는 순서이다.", "b": 2, "bb": "[학교 변형 지문]\nPhilosopher Alfred North Whitehead said that civilization advances when people can act without thinking. A discount coupon is one such case, making consumers assume it will lower the price.\n(A) The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it.\n(B) In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important ― the strain on our brains.\n(C) The experience of one automobile-tire company shows how mechanically we act on that assumption. Even mailed coupons with a printing error and no actual savings drew as much customer response as error-free coupons offering substantial savings."},
{"no": 56, "school": "문명고 (경산시)", "pref": "29", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "29-a", "choices": ["ⓐ allows", "ⓑ illustrates", "ⓒ produced", "ⓓ do", "ⓔ potentially"], "ans": 2, "exp": "ⓑ illustrates → illustrated: 주어가 예시되는 대상이므로 수동태(is illustrated)가 되어야 한다.", "b": 2, "bb": "[학교 변형 지문]\n-- ⓑ의 주어 The extent to which we have learned to operate mechanically on that assumption은 '그 경험 속에서 예시되는/드러나는' 대상이므로 수동태가 필요하여 is illustrates가 아니라 is illustrated가 되어야 합니다.\n-- 주어가 동작을 직접 하는 것이 아니라 동작을 받는 대상일 때에는 <be-동사 + 과거분사> 형태의 수동태를 사용합니다.\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which ⓐallows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is ⓑillustrates in the experience of one automobile-tire company. Mailed-out coupons that ― because of a printing error ― offered no savings to recipients ⓒproduced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only ⓓdo we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something ⓔpotentially more important ― brain strain."},
{"no": 57, "school": "인일여고 (인천시)", "pref": "29", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "29-a", "choices": ["Why Modern Civilization Fails to Save Financial Costs", "How Has Civilization Advanced Based on Human Thought?", "Blinded by the Coupon: The Price of Relieving Brain Strain", "The Smarter the Consumer, the More Coupons They Present", "Two Advantages of Coupons: Increasing Promotions and Reducing Strain"], "ans": 3, "exp": "쿠폰은 정신적 노력을 줄여 주지만 할인 혜택이 없는 쿠폰에도 자동적으로 반응할 만큼 사고를 기계화한다는 내용이다.", "b": 2, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that – because of a printing error – offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important – brain strain."},
{"no": 58, "school": "해원고 (인천시)", "pref": "29", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (학교 재구성 지문) [주어진 글] The renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" (A) Astonishingly, printed coupons that offered absolutely zero savings due to an error generated the exact same response rate as flawless coupons offering massive discounts. The obvious but instructive point here is that we expect discount coupons to do double duty. (B) Consider the discount coupon as a prime example of this 'advance.' It allows consumers to automatically assume they will pay less simply by presenting it. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. (C) We expect coupons not only to ease our wallets, but also to protect us from the mental effort and time required to calculate those savings. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important - brain strain.", "p": "29-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 2, "exp": "(B) 할인 쿠폰 사례와 타이어 회사 예고 → (A) 실제 결과와 쿠폰의 이중 기능 → (C) 두 기능을 금전적·정신적 부담에 연결하는 순서이다.", "b": 2, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\"\n(A) Astonishingly, printed coupons that offered absolutely zero savings due to an error generated the exact same response rate as flawless coupons offering massive discounts. The obvious but instructive point here is that we expect discount coupons to do double duty.\n(B) Consider the discount coupon as a prime example of this 'advance.' It allows consumers to automatically assume they will pay less simply by presenting it. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company.\n(C) We expect coupons not only to ease our wallets, but also to protect us from the mental effort and time required to calculate those savings. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important - brain strain."},
{"no": 59, "school": "해원고 (인천시)", "pref": "29", "type": "밑줄의미", "stem": "다음 글에서 밑줄 친 'handle brain strain'이 의미하는 바로 가장 적절한 것은? (학교 지문 마지막 문장: 'In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle brain strain.')", "p": "29-a", "choices": ["calculate the exact amounts of discount rates", "search for the best shops to purchase items", "reduce the mental effort of making decisions", "increase our interest in various shopping events", "avoid impulse buying triggered by advertisements"], "ans": 3, "exp": "할인 여부를 일일이 계산하고 판단하는 데 드는 시간과 정신적 에너지를 줄인다는 의미이다.", "b": 2, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that ─ because of a printing error ─ offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to [handle brain strain]."},
{"no": 60, "school": "충북여고 (청주시)", "pref": "29", "type": "빈칸", "stem": "다음 빈칸 'The renowned British philosopher Alfred North Whitehead asserted that \"___\"'에 들어갈 말로 가장 적절한 것은?", "p": "29-a", "choices": ["the evolution of civilization is characterized by the expansion of our capacity to execute functions with minimal cognitive load.", "societal development largely depends on how accurately and effectively we analyze financial data to prevent unexpected printing errors.", "technological advances primarily drive human progress forward by completely eliminating the heavy burden of manual physical labor.", "intellectual growth within a civilization occurs when individuals actively challenge their long-held assumptions instead of acting mechanically.", "consumers become highly susceptible to marketing manipulation when they rely on objective reasoning rather than automated cues."], "ans": 1, "exp": "문명은 의식적 사고 없이 수행할 수 있는 활동을 늘리며 발전한다는 주장이므로, 인지적 부담을 최소화하는 능력의 확대를 말하는 ①이 적절하다.", "b": 2, "bb": "[학교 변형 지문]\nThe renowned British philosopher Alfred North Whitehead asserted that \"[____________________________________]\" Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed-out coupons that – because of a printing error – offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important – brain strain."},
{"no": 61, "school": "청석고 (청주시)", "pref": "29", "type": "문장삽입", "stem": "글의 흐름으로 보아, [주어진 문장]이 들어가기에 가장 적절한 곳은?", "p": "29-a", "choices": ["(A) 자리", "(B) 자리", "(C) 자리", "(D) 자리", "(E) 자리"], "ans": 3, "exp": "오류 쿠폰 사례 뒤에 쿠폰의 이중 역할로 일반화하고, 이어지는 Not only ... also ...가 두 역할을 구체화한다.", "b": 2, "bb": "[학교 변형 지문]\n[주어진 문장] The obvious but instructive point here is that we expect discount coupons to do double duty.\n\nThe renowned British philosopher Alfred North Whitehead asserted that \"civilization advances by extending the number of operations we can perform without thinking about them.\" (A) Take, for example, the \"advance\" offered to civilization by the discount coupon, which allows consumers to assume that they will receive a reduced purchase price by presenting the coupon. (B) Mailed-out coupons that – because of a printing error – offered no savings to recipients produced just as much customer response as did error-free coupons that offered substantial savings. (C) Not only do we expect them to save us money, we also expect them to save us the time and mental energy required to think about how to do it. (D) In today's world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more important – brain strain. (E)"},
{"no": 62, "school": "신정고 (부산시)", "pref": "30", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 초기 구매자는 가격보다 추가 성능에 민감하고 돈을 많이 쓸 준비가 됨 ② 고급 휴대폰 제조사가 백만장자 가구를 겨냥함 ③ 경쟁사들도 가격을 크게 낮출 생각이 없음 ④ 'Successful high-tech companies also invest heavily in employee training programs to strengthen customer loyalty and maintain market share.' ⑤ 높은 가격은 품질의 표시로 인식되어 신뢰를 강화함)", "p": "30-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "혁신 제품의 낮은 가격 탄력성을 설명하는 글에서, 직원 교육과 고객 충성도를 다룬 ④는 무관하다.", "b": 1, "bb": "[학교 변형 지문]\nUsually, innovative high-tech products have low price elasticity. This means that high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. ⓐAdditionally, at the first stage of the technology, buyers - either innovators or forerunners - are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. ⓑFor instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set. ⓒAt that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. ⓓSuccessful high-tech companies also invest heavily in employee training programs to strengthen customer loyalty and maintain market share. ⓔFurthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer's confidence in the company."},
{"no": 63, "school": "이순신고 (아산시)", "pref": "30", "type": "내용불일치", "stem": "다음 글의 내용과 일치하지 않는 것은?", "p": "30-a", "choices": ["High prices can make customers believe the products are high quality.", "There are many alternative products available when a technology is new.", "Innovative high-tech products can maintain high prices without losing many customers.", "Demand for innovative high-tech products depends more on uniqueness and quality than on price.", "Customers who buy high-tech products are likely to have enough money to afford expensive items."], "ans": 2, "exp": "혁신적인 하이테크 제품은 대체재가 거의 없다(few substitutes)고 했으므로 ②는 일치하지 않는다.", "b": 1, "bb": "[학교 변형 지문]\nUsually, innovative high-tech products have low price elasticity. This means that high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. Additionally, at the first stage of the technology, buyers – either innovators or forerunners – are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than 2.5 million; those are customers who are ready to accept the price range the manufacturer has set. At that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. Furthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer's confidence in the company."},
{"no": 64, "school": "주성고 (청주시)", "pref": "30", "type": "요지", "stem": "다음 글의 요지로 가장 적절한 것은?", "p": "30-a", "choices": ["초기 하이테크 제품은 가격 탄력성이 낮아 고가격 중심의 마케팅이 효과적이다.", "기술적 결함을 보완하는 것이 하이테크 제품의 초기 시장 선점에 필수적이다.", "첨단 기술 제품의 무분별한 고가격 정책은 잠재적 소비자의 이탈을 초래한다.", "소비자의 신뢰를 얻기 위해서는 하이테크 제품의 전환 비용을 낮추어야 한다.", "하이테크 산업의 경쟁 심화는 결국 제품의 가격 인하와 품질 향상으로 이어진다."], "ans": 1, "exp": "초기 혁신 제품은 대체재가 적고 구매자가 가격에 둔감하며 고가격이 품질 신호가 되므로 고가격 전략이 효과적이다.", "b": 1, "bb": "[학교 변형 지문]\nUsually, innovative high-tech products have low price elasticity. This means that high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. Additionally, at the first stage of the technology, buyers - either innovators or forerunners - are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set. At that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. Furthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer's confidence in the company."},
{"no": 65, "school": "주성고 (청주시)", "pref": "30", "type": "요약", "stem": "요약 - 'Due to limited substitutes and the nature of early buyers, the demand for innovative high-tech products remains (A)___ to price changes: furthermore, high prices function as a sign of (B)___.'", "p": "30-a", "choices": ["(A) insensitive — (B) superiority", "(A) insensitive — (B) vulnerability", "(A) responsive — (B) quality", "(A) responsive — (B) excellence", "(A) indifferent — (B) unreliability"], "ans": 1, "exp": "수요는 가격 변화에 둔감(insensitive)하고, 높은 가격은 우수성(superiority)의 신호가 된다.", "b": 1, "bb": "[학교 변형 지문]\nUsually, innovative high-tech products have low price elasticity. This means that high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. Additionally, at the first stage of the technology, buyers - either innovators or forerunners - are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set. At that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. Furthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer's confidence in the company.\nDue to limited substitutes and the nature of early buyers, the demand for innovative high-tech products remains (A)[__________] to price changes: furthermore, high prices function as a sign of (B)[__________]."},

{"no": 71, "school": "경산여고 (경산시)", "pref": "30", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (학교 재구성 지문) [주어진 글] Usually, innovative high-tech products have low price elasticity. (A) Competitors are not interested in lowering their prices significantly, because they are targeting the same categories of customers, who are not sensitive to price. The high price of these products is often perceived as a sign of quality and reinforces customer confidence in the company. (B) High variation in price, whether upward or downward, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. (C) For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set. (D) At the first stage of the technology, buyers – either innovators or forerunners – are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product.", "p": "30-a", "choices": ["(A)-(B)-(D)-(C)", "(B)-(D)-(C)-(A)", "(C)-(A)-(B)-(D)", "(B)-(D)-(A)-(C)", "(C)-(D)-(B)-(A)"], "ans": 2, "exp": "(B) 낮은 가격 탄력성과 대체재 부족 → (D) 초기 구매자의 가격 비민감성 → (C) 고가 휴대전화 사례 → (A) 경쟁사 가격 전략과 품질 신호 순이다.", "b": 2, "bb": "[학교 변형 지문]\nUsually, innovative high-tech products have low price elasticity.\n(A) Competitors are not interested in lowering their prices significantly, because they are targeting the same categories of customers, who are not sensitive to price. The high price of these products is often perceived as a sign of quality and reinforces customer confidence in the company.\n(B) High variation in price, whether upward or downward, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high.\n(C) For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set.\n(D) At the first stage of the technology, buyers – either innovators or forerunners – are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product."},

{"no": 77, "school": "인성여고 (인천시)", "pref": "30", "type": "빈칸연결어", "stem": "다음 빈칸 (A), (B)에 들어갈 연결사로 가장 적절한 것은? ('These high-tech products have few substitutes, meaning that the costs to switch to another product are high. (A)___, at the first stage of the technology, buyers – either innovators or forerunners – are less sensitive to price than to additional performance; ... (B)___, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households ...')", "p": "30-a", "choices": ["(A) Yet — (B) Likewise", "(A) In fact — (B) Instead", "(A) Moreover — (B) For instance", "(A) Otherwise — (B) Therefore", "(A) Additionally — (B) Nevertheless"], "ans": 3, "exp": "(A)는 초기 구매자의 특성을 추가하므로 Moreover, (B)는 고가 휴대전화 고객 사례를 드므로 For instance가 적절하다.", "b": 2, "bb": "[학교 변형 지문]\nUsually, innovative high-tech products have low price elasticity. This means that high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have few substitutes, meaning that the costs to switch to another product are high. (A)[__________], at the first stage of the technology, buyers ─ either innovators or forerunners ─ are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. (B)[__________], with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers who are ready to accept the price range the manufacturer has set. At that stage, the competitors are not interested in lowering their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. Furthermore, the high price of these products is often perceived as a sign of quality and reinforces a customer's confidence in the company."},
{"no": 78, "school": "충북대학교사범대학부설고 (청주시)", "pref": "31", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "31-a", "choices": ["What Makes a City Square \"Future-Proof\"?", "The Irreversible Death of Great American Cities", "Why Medieval Squares Are Losing Their Charm", "How to Redesign Buggy Whips for the Modern Age", "The Unexpected Decline of the Online Shopping Era"], "ans": 1, "exp": "같은 도시 광장·거리 인프라가 변화하는 용도를 계속 수용하기 때문에 future-proof하다는 내용이다.", "b": 1, "bb": "[학교 변형 지문]\nOne easily underappreciated feature of a city street or square is its \"future-proof\" nature. The ancient medieval squares in places like Marrakesh and Siena are still places where stuff is sold every day, even if the stuff itself has changed over the last five hundred years. The city square is a fairly future-proof technology, as is the shopping street, even in an age of online shopping. For example, the same physical store that once sold buggy whips and typewriters might now repair damaged phones and sell bubble tea. The same infrastructure supports evolving uses. Jane Jacobs, the great prophet of the city economy, made much of this fact in her books. As she pointed out, the great advantage of a city architecture is its ability to support change in uses, and Jacobs correctly predicted the persistence of the city itself."},

ed the persistence of the city itself, unlike those who predicted the rise of the Internet would mean the death of the city."},

{"no": 82, "school": "봉명고 (청주시)", "pref": "31", "type": "빈칸", "stem": "다음 빈칸 'As she pointed out, the great advantage of a city architecture is its ability to support (A)___ in uses, and Jacobs correctly predicted the (B)___ of the city itself, unlike those who predicted the rise of the Internet would mean the death of the city.'에 들어갈 말로 가장 적절한 것은?", "p": "31-a", "choices": ["(A) change — (B) persistence", "(A) stability — (B) decline", "(A) uniformity — (B) weakness", "(A) permanence — (B) disappearance", "(A) limitation — (B) fragmentation"], "ans": 1, "exp": "도시 건축의 장점은 용도의 변화(change)를 지원하는 것이고, 그 덕분에 도시 자체가 지속(persistence)된다.", "b": 2, "bb": "[학교 변형 지문]\nOne easily underappreciated feature of a city street or square is its \"future-proof\" nature. The ancient medieval squares in places like Marrakesh and Siena are still places where stuff is sold every day, even if the stuff itself has changed over the last five hundred years. The city square is a fairly future-proof technology, as is the shopping street, even in an age of online shopping. For example, the same physical store that once sold buggy whips and typewriters might now repair damaged phones and sell bubble tea. The same infrastructure supports evolving uses. Jane Jacobs, the great prophet of the city economy, made much of this fact in her books, including The Death and Life of Great American Cities and The Nature of Economies. As she pointed out, the great advantage of a city architecture is its ability to support (A)[____________] in uses, and Jacobs correctly predicted the (B)[____________] of the city itself, unlike those who predicted the rise of the Internet would mean the death of the city."},
{"no": 83, "school": "별가람고 (남양주시)", "pref": "32", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "32-a", "choices": ["How Plants Defend Against Genetic Diseases", "Touch Reshapes a Plant's Genes and Growth", "Why Plants Grow Slowly in Undisturbed Spaces?", "A Plant's Survival Strategy: Spreading More Seeds", "The Surprising Benefits of Touching Plants Frequently"], "ans": 2, "exp": "접촉 후 30분 내 유전체의 10%가 변하고 위쪽 성장률이 최대 30% 감소하므로, 접촉이 식물의 유전자와 성장을 바꾼다는 제목이 적절하다.", "b": 1, "bb": "[학교 변형 지문]\nThe genomics revolution made it possible to see just how impactful touch is to plants on a deeper level. Peering at the genes of Arabidopsis thaliana, a weedy plant in the mustard family and the lab rat of the plant biology world, researchers saw that touch quietly triggered such a dramatic response in their hormones and gene expression that it could substantially inhibit their growth. They stroked the arabidopsis with soft paintbrushes, and then analyzed the plants' genetic responses. Within thirty minutes of being touched, 10 percent of the plant's genome was altered. Clearly, the plant was reorganizing its priorities to deal with the disturbance, and rerouting energy away from the hard work of getting taller. Touched multiple times, arabidopsis cut its upward growth rate by as much as 30 percent."},

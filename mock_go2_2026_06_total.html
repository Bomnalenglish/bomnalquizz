{"no": 139, "school": "선사고 (서울시)", "pref": "37", "type": "주제", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "37-a", "choices": ["The benefits of chronic stress for strengthening neural networks", "The survival benefits and psychological costs of the freeze response", "The importance of physical movement in overcoming fear and stress", "How language development eliminated primitive survival instincts", "The influence of predators on the growth of human social communication"], "ans": 2, "exp": "전반부는 동결 반응의 생존상 이점, 후반부는 지속적 공포 상태의 심리적 대가를 다루므로 ②가 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nThink about a time when you were startled. Did you come to a sudden stop, freeze all your movements, and hold your breath as you scanned the environment for a threat? All these responses maximize our ability to avoid detection, locate the source of possible danger, and prepare to fight or flee. As sophisticated as language has become, it is still the creation of sound that might give away our location to a potential predator. Because of this, the freeze response results in the inhibition of language in highly stressful and traumatic situations. Natural selection promoted the evolution of language but conserved the freeze rule. When the threat passes, we begin to relax and find our voices again, perhaps even to laugh at our own reactions. But what if we can never relax? What if our experiences shape our brain to be in a constant state of fear? This interference with the proper development and integration of neural networks can result in chronic stress and even mental illness."},
{"no": 140, "school": "원묵고 (서울시)", "pref": "38", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "38-a", "choices": ["ⓐ persistent", "ⓑ plausible", "ⓒ negative", "ⓓ intensified", "ⓔ weakened"], "ans": 4, "exp": "ⓓ intensified → blunted: 반복 노출로 정상 반응이 무뎌지는 것이 탈감작이다.", "b": 1, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been ⓐpersistent concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated ⓑplausible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel ⓒnegative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events – such as what might happen when a person plays violent video games – this normal reaction might become ⓓintensified, a phenomenon known as desensitization. The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to ⓔweakened empathy."},
{"no": 141, "school": "산동고 (구미시)", "pref": "38", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "38-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 2, "exp": "정상적 반응을 제시한 (B), this normal reaction이 둔화되는 (A), The next step으로 공감 감소를 말하는 (C) 순이다.", "b": 1, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy.\n(A) With repeated exposure to violent events ─ such as what might happen when a person plays violent video games ─ this normal reaction might become blunted, a phenomenon known as desensitization.\n(B) Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust.\n(C) The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people."},
{"no": 142, "school": "남산고 (창원시)", "pref": "38", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "38-a", "choices": ["ⓐ normal", "ⓑ faded", "ⓒ heightened", "ⓓ impaired", "ⓔ connection"], "ans": 3, "exp": "ⓒ heightened → diminished: 탈감작 다음 단계에서는 폭력에 대한 정서 반응이 감소한다.", "b": 1, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a ⓐnormal reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events, this typical reaction might become ⓑfaded, a phenomenon known as desensitization. The next step in this problematic process would be having ⓒheightened emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to ⓓimpaired empathy. A significant body of work shows a strong ⓔconnection between extensive violent video gaming and reduced empathy in people."},
{"no": 143, "school": "한국교원대학교부설고 (청주시)", "pref": "38", "type": "요약", "stem": "요약 - 'Repeated violent gaming may gradually (A)___ emotional responses to violence and eventually (B)___ empathy for others.'", "p": "38-a", "choices": ["(A) decrease — (B) expand", "(A) intensify — (B) cultivate", "(A) lessen — (B) weaken", "(A) regulate — (B) preserve", "(A) awaken — (B) measure"], "ans": 3, "exp": "폭력적 게임을 반복하면 정서 반응이 약해지고(lessen) 공감 능력도 약화된다(weaken).", "b": 1, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events ─ such as what might happen when a person plays violent video games ─ this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people."},
{"no": 144, "school": "공주고 (공주시)", "pref": "38", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "38-a", "choices": ["ⓐ articulated", "ⓑ arousal", "ⓒ sharpened", "ⓓ lessened", "ⓔ prolonged"], "ans": 3, "exp": "ⓒ sharpened → blunted: 반복 노출에 따른 탈감작은 반응이 무뎌지는 현상입니다.", "b": 2, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have ⓐarticulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological ⓑarousal that is connected to fear or disgust. With repeated exposure to violent events - such as what might happen when a person plays violent video games - this normal reaction might become ⓒsharpened, a phenomenon known as desensitization. The next step in this problematic process would be having ⓓlessened emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between ⓔprolonged violent video gaming and reduced empathy in people."},
{"no": 145, "school": "영남고 (대구시)", "pref": "38", "type": "요지", "stem": "다음 글의 요지로 가장 적절한 것은?", "p": "38-a", "choices": ["게임의 폭력성보다 몰입도가 미치는 긍정적 영향에 더 집중해야 한다.", "비디오 게임 기술의 발전은 청소년의 인지 능력 향상에 크게 기여한다.", "타인과 공감하는 능력은 반복적인 감정 훈련을 하더라도 기르기 어렵다.", "폭력적 비디오 게임에 자주 노출되면 감정이 무뎌져 공감 능력이 떨어질 수 있다.", "청소년기의 정서적 무기력증을 극복하기 위해서는 다양한 미디어 시청이 필수적이다."], "ans": 4, "exp": "폭력적 게임에 반복 노출되면 감정 반응이 무뎌지고 공감 능력까지 약화될 수 있다는 것이 요지이므로 ④가 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events ─ such as what might happen when a person plays violent video games ─ this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people."},
{"no": 146, "school": "청주여고 (청주시)", "pref": "38", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중 어법상 어색한 것은?", "p": "38-a", "choices": ["ⓐ conducted", "ⓑ experience", "ⓒ cause", "ⓓ occurs", "ⓔ leading"], "ans": 3, "exp": "ⓒ cause → causes: 주어 repeated exposure가 단수입니다.", "b": 2, "bb": "[학교 변형 지문]\n-- ⓒ의 주어는 단수 명사구 repeated exposure to violent events이므로 현재시제 동사도 단수형 causes가 되어야 합니다.\n-- 주어와 동사는 수가 일치해야 하므로 단수 주어에는 현재시제 일반동사의 -s/-es형을 사용하고, cause + 목적어 + to-부정사는 '목적어가 ~하게 만들다'의 의미를 나타냅니다.\nDue to concerns about the impact of violent video games on youth, much research has been ⓐconducted on video gaming with regard to empathy. Scientists have formulated credible explanations of how video gaming could affect empathy. When people witness violent events, a healthy reaction is to feel negative emotions and ⓑexperience physiological arousal that is connected to fear or disgust. However, repeated exposure to violent events - such as when playing video games - ⓒcause this healthy reaction in youth to become blunted. That is, a phenomenon known as desensitization ⓓoccurs. They will have diminished emotional responses to violence, which interferes with the ability to sympathize with others, ⓔleading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people."},
{"no": 147, "school": "해원고 (인천시)", "pref": "38", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "38-a", "choices": ["ⓐ reliable", "ⓑ blunted", "ⓒ diminished", "ⓓ enhance", "ⓔ reduced"], "ans": 4, "exp": "ⓓ enhance → interfere with: 정서 반응이 줄면 공감 능력은 방해받아 공감 감소로 이어집니다.", "b": 2, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated ⓐreliable explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events - such as what might happen when a person plays violent video games - this normal reaction might become ⓑblunted, a phenomenon known as desensitization. The next step in this problematic process would be having ⓒdiminished emotional responses to violence. This, in turn, could also ⓓenhance the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and ⓔreduced empathy in people."},
{"no": 148, "school": "충북고 (청주시)", "pref": "38", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "38-a", "choices": ["(B)-(A)-(D)-(C)", "(C)-(B)-(D)-(A)", "(C)-(D)-(B)-(A)", "(D)-(A)-(C)-(B)", "(D)-(C)-(B)-(A)"], "ans": 3, "exp": "연구 소개 (C), 폭력 목격 시 정상 반응 (D), 이를 this normal reaction으로 받는 탈감작 (B), The next step의 공감 감소 (A) 순서입니다.", "b": 2, "bb": "Video gaming is one of the most studied technologies with regard to empathy.\n\n(A) The next step in this problematic process would be having diminished emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people.\n\n(B) With repeated exposure to violent events — such as what might happen when a person plays violent video games — this normal reaction might become blunted, a phenomenon known as desensitization.\n\n(C) Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy.\n\n(D) Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust."},
{"no": 149, "school": "충북고 (청주시)", "pref": "38", "type": "어법(개수)", "stem": "밑줄 친 ⓐ~ⓕ 중 어법상 어색한 것의 개수는?", "p": "38-a", "choices": ["1개", "2개", "3개", "4개", "5개"], "ans": 2, "exp": "ⓑ that → which(콤마 뒤 계속적 용법), ⓓ has conducted → has been conducted(수동)로 2개입니다.", "b": 2, "bb": "[학교 변형 지문]\nⓑ that → which: 앞 절 전체 또는 바로 앞의 내용을 부연 설명하는 계속적 용법의 관계사절이므로, 콤마 뒤에는 that을 쓸 수 없고 which를 써야 합니다. -- 계속적 용법의 관계사절에서는 관계대명사 that을 사용할 수 없으며, 사물이나 앞 절의 내용을 받을 때는 which를 사용합니다.\nⓓ has conducted → has been conducted: 주어 much research는 연구를 '수행하는' 주체가 아니라 '수행되는' 대상이므로 현재완료 수동태 has been conducted가 되어야 합니다. -- 주어가 동작을 당하는 대상이면 「be동사 + 과거분사」의 수동태를 사용하며, 현재완료 수동태는 「have/has been + 과거분사」의 형태입니다.\n나머지 밑줄 검토:\nⓐ technologies: 「one of the + 최상급 + 복수명사」 구조이므로 복수형 technologies가 적절합니다. -- 「one of the + 최상급 + 복수명사」는 '가장 ~한 것들 중 하나'를 뜻하므로 명사는 복수형을 사용합니다.\nⓒ the things which might happen: 선행사 the things를 주격 관계대명사 which가 수식하고 있으므로 어법상 적절합니다. -- 주격 관계대명사는 뒤 절에서 주어 역할을 하며 선행사가 사물이면 which를 사용할 수 있습니다.\nⓔ have formulated: 주어 scientists가 복수이고 지난 수십 년간 이어진 연구의 결과를 나타내므로 현재완료 have formulated가 적절합니다. -- 현재완료는 과거에 시작된 행위의 결과나 현재까지의 경험·지속을 나타내며 주어의 수에 따라 have/has를 구별합니다.\nⓕ is connected: 선행사 physiological arousal이 단수이고 '두려움이나 혐오감과 연결되어 있는' 수동 관계이므로 is connected가 적절합니다. -- 관계사절의 동사는 선행사의 수에 일치해야 하며, 주어가 동작의 대상이면 수동태를 사용합니다."},
{"no": 150, "school": "대암고 (창원시)", "pref": "38", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "38-a", "choices": ["ⓐ conducted", "ⓑ how", "ⓒ experiencing", "ⓓ which", "ⓔ extensive"], "ans": 3, "exp": "ⓒ experiencing → to experience: to feel과 병렬인 주격보어 to부정사입니다.", "b": 2, "bb": "[학교 변형 지문]\n-- ⓒ는 Part of a normal, healthy reaction ... is to feel negative emotions, and to experience physiological arousal ...에서 두 개의 to-부정사구가 주격보어로 병렬 연결된 구조이므로, experiencing을 to experience로 고쳐야 합니다.\n-- 등위접속사 and로 같은 기능의 성분을 연결할 때에는 문법적 형태를 일치시키는 것이 원칙이며, to-부정사구끼리 병렬을 이루면 각각 <to + 동사원형> 형태를 사용할 수 있습니다.\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been ⓐconducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of ⓑhow video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and ⓒexperiencing physiological arousal that is connected to fear or disgust. With repeated exposure to violent events – such as what might happen when a person plays violent video games – this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be having diminished emotional responses to violence, ⓓwhich could also interfere with the ability to recognize and/or to sympathize with others, causing reduced empathy. A significant body of work shows an association between ⓔextensive violent video gaming and reduced empathy in people."},
{"no": 151, "school": "함월고 (울산시)", "pref": "38", "type": "빈칸", "stem": "다음 빈칸 (A)'this normal reaction might become (A)___, a phenomenon known as desensitization' (B)'would be having (B)___ emotional responses to violence' (C)'association between extensive violent video gaming and (C)___ empathy in people'에 들어갈 말로 가장 적절한 것은?", "p": "38-a", "choices": ["(A) intensified — (B) diminished — (C) greater", "(A) increased — (B) enhanced — (C) diminished", "(A) reduced — (B) blunted — (C) weakened", "(A) weakened — (B) lessened — (C) stronger", "(A) blunted — (B) decreased — (C) improved"], "ans": 3, "exp": "반복 노출로 정상 반응은 줄고(reduced), 정서 반응은 무뎌지며(blunted), 공감은 약해지므로(weakened) ③이 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events – such as what might happen when a person plays violent video games – this normal reaction might become (A)[___________], a phenomenon known as desensitization. The next step in this problematic process would be having (B)[___________] emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows association between extensive violent video gaming and (C)[___________] empathy in people."},
{"no": 152, "school": "봉명고 (청주시)", "pref": "38", "type": "빈칸", "stem": "다음 빈칸 'The next step in this problematic process would be ___, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy.'에 들어갈 말로 가장 적절한 것은?", "p": "38-a", "choices": ["utilizing highly sophisticated strategic neural processing", "acquiring an advanced capacity for multi-dimensional spatial tasks", "establishing stronger cooperative bonds among active peers", "fostering greater cognitive resilience through trial and error", "showing a weakened emotional response to violent situations"], "ans": 5, "exp": "탈감작 다음 단계는 폭력에 대한 정서 반응이 약해지는 것이고 이것이 공감 감소로 이어지므로 ⑤가 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nVideo gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been conducted over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With repeated exposure to violent events – such as what might happen when a person plays violent video games – this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be [______________________________________], which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people."},
{"no": 153, "school": "한국교원대학교부설고 (청주시)", "pref": "39", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "39-a", "choices": ["ⓐ differentiation", "ⓑ enhance", "ⓒ genuine", "ⓓ benefits", "ⓔ satisfied"], "ans": 5, "exp": "ⓔ satisfied → worse: 목적-세탁 브랜드는 직원들이 그 회사에서 일하는 것을 더 나쁘게 느끼게 할 수 있다.", "b": 1, "bb": "[학교 변형 지문]\nRealising the benefits of ⓐdifferentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to ⓑenhance the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from a ⓒgenuine, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" ― similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the ⓓbenefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel ⓔsatisfied about working for them."},
{"no": 154, "school": "창문여고 (서울시)", "pref": "39", "type": "요약", "stem": "요약 - 'A brand's engagement in social causes degenerates into a self-serving illusion unless it is rooted in (A)___ motives, eventually functioning as a(n) (B)___ force in shaping both its external market positioning and internal employee morale.'", "p": "39-a", "choices": ["(A) actual — (B) productive", "(A) authentic — (B) adverse", "(A) deceptive — (B) cooperative", "(A) temporary — (B) unfavorable", "(A) superficial — (B) destructive"], "ans": 2, "exp": "사회적 목적은 진정한(authentic) 동기에 뿌리를 두지 않으면 시장 위치와 직원 사기에 부정적인(adverse) 힘이 된다.", "b": 1, "bb": "[학교 변형 지문]\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" - similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them.\n*charade: 뻔한 속임수\nA brand's engagement in social causes degenerates into a self-serving illusion unless it is rooted in (A)[__________] motives, eventually functioning as a(n) (B)[__________] force in shaping both its external market positioning and internal employee morale."},
{"no": 155, "school": "인일여고 (인천시)", "pref": "39", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "39-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 3, "exp": "진정한 헌신의 필요성을 말한 (B), Otherwise로 목적-세탁을 설명하는 (C), As a result로 그 결과를 제시하는 (A) 순이다.", "b": 1, "bb": "[학교 변형 지문]\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good.\n(A) As a result, purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them.\n(B) Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose.\n(C) Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" – similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\"."},
{"no": 156, "school": "사동고 (경산시)", "pref": "39", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 마케터들이 목적 자체보다 브랜드 평판을 높이는 데 사회적 목적을 이용함 ② 'Because differentiation is increasingly important in competitive markets, firms often rely on advertising strategies that highlight their distinctive brand identity in order to strengthen market positioning.' ③ 실질적 변화는 회사 전체의 진정한 헌신에서 나와야 함 ④ 그렇지 않으면 사명은 겉치레, 즉 목적-세탁일 뿐임 ⑤ Giridhardas가 말한, 엘리트의 속임수를 조장하는 사회적 목적이 됨)", "p": "39-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "목적-세탁의 문제를 다루는 글에서 ②(ⓑ)는 차별화를 위한 광고 전략이라는 일반적 마케팅 설명이라 흐름과 무관하다.", "b": 1, "bb": "[학교 변형 지문]\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. ⓐ[Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself]. ⓑ[Because differentiation is increasingly important in competitive markets, firms often rely on advertising strategies that highlight their distinctive brand identity in order to strengthen market positioning]. ⓒ[Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose]. ⓓ[Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" ― similar to green-washing, where purpose-driven activities serve mainly for publicity purposes]. ⓔ[We end up with what Anand Giridhardas describes in Winners Take All : \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\"]. Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them."},
{"no": 157, "school": "대암고 (창원시)", "pref": "39", "type": "요약", "stem": "요약 - 'Even though purpose-washing brands can get a(an) (A)___ success in differentiation using social purpose, it might throw away the (B)___ for their long-term benefits.'", "p": "39-a", "choices": ["(A) immediate — (B) chance", "(A) immediate — (B) trend", "(A) sustained — (B) status", "(A) sustained — (B) position", "(A) practical — (B) change"], "ans": 1, "exp": "목적-세탁 브랜드는 단기적인(immediate) 차별화 효과를 얻지만 미래 시장에서 자리 잡을 기회(chance)를 잃는다.", "b": 1, "bb": "[학교 변형 지문]\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" – similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them."},
{"no": 158, "school": "일신여고 (청주시)", "pref": "39", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "39-a", "choices": ["ⓐ embracing", "ⓑ follow", "ⓒ where", "ⓓ further", "ⓔ feel"], "ans": 4, "exp": "ⓓ further → furthers: 주격 관계대명사 that의 선행사 social purpose가 단수이므로 단수 동사가 와야 한다.", "b": 1, "bb": "[학교 변형 지문]\n-- ⓓ에서 관계대명사 that의 선행사는 단수 명사구 social purpose이고, that이 관계사 절의 주어이므로 동사는 단수형 furthers가 되어야 합니다.\n-- 주격 관계대명사가 이끄는 관계사 절의 동사는 선행사의 수에 일치하며, 선행사가 단수이면 현재시제 일반동사에 –s/-es를 붙입니다.\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than ⓐembracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to ⓑfollow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" ― similar to green-washing, ⓒwhere purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: \"social purpose that just ⓓfurther the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees ⓔfeel worse about working for them."},
{"no": 159, "school": "인천여고 (인천시)", "pref": "39", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "39-a", "choices": ["ⓐ tool", "ⓑ dedication", "ⓒ publicity", "ⓓ disappear", "ⓔ worse"], "ans": 4, "exp": "ⓓ disappear → last: 차별화의 이점은 오래 지속되지 않고 브랜드는 얻는 것보다 더 많은 것을 잃습니다.", "b": 2, "bb": "[학교 변형 지문]\nRealizing the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. For their marketers, social purpose is not a cause they genuinely care about but merely a ⓐtool to boost the brand's image. Making a real difference with social problems is hard enough; real progress comes only when the purpose grows out of a sincere, company-wide ⓑdedication to it. Without that, the mission amounts to nothing more than window dressing – or what we call \"purpose-washing,\" the equivalent of greenwashing, in which purpose-driven activities serve mainly to generate ⓒpublicity. We end up with what Anand Giridharadas describes in Winners Take All: \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation. The benefit, however, doesn't ⓓdisappear, and in chasing it the brands end up sacrificing far more than they gain. They lose out on positioning for future markets, and they might even make employees feel ⓔworse about working for them. And eventually they'll lose the trust of consumers who find out."},
{"no": 160, "school": "신흥고 (청주시)", "pref": "39", "type": "빈칸", "stem": "다음 빈칸 'We end up with what Anand Giridharadas describes in Winners Take All: \"social purpose that ___.\"'에 들어갈 말로 가장 적절한 것은?", "p": "39-a", "choices": ["gradually replaces outdated business models with ones driven by genuine social innovation", "pressures wealthy elites to redistribute their profits toward underprivileged social groups", "earns public trust by transparently documenting the measurable outcomes of corporate initiatives", "merely reinforces the illusion of progress among the privileged while delivering little of real value", "aligns a company's long-term financial goals with the broader needs of the communities it serves"], "ans": 4, "exp": "인용문은 사회적 목적이 실질적 가치는 거의 돌려주지 않으면서 엘리트들의 진보 환상만 강화한다는 비판이므로 ④가 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from a genuine commitment to the cause that runs throughout the entire company, not just its messaging. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" – similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridharadas describes in Winners Take All: \"social purpose that [____________________________].\" Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them."},
{"no": 161, "school": "별가람고 (남양주시)", "pref": "39", "type": "내용불일치", "stem": "다음 글의 내용과 일치하지 않는 것은?", "p": "39-a", "choices": ["몇몇 브랜드들은 그들이 많은 실제적인 선을 행하기 전에 그들의 사회적 목적을 널리 알린다.", "일부 브랜드 마케터들은 목적 그 자체를 받아들이기보다 그 브랜드의 명성을 높이기 위해 사회적 목적을 이용하고 있다.", "사회적 문제에 실제적인 변화를 가져오기 위해서는 회사 전체의 진정한 헌신이 뒷받침되어야 한다.", "목적-세탁은 목적 주도 활동을 주로 홍보 수단으로 이용하는 그린-워싱과 유사하다.", "목적-세탁 브랜드들은 사회적 목적을 통해 얻은 차별화의 이점을 장기간 유지할 수 있다."], "ans": 5, "exp": "목적-세탁 브랜드가 얻는 차별화의 이점은 짧은 기간만 유지되므로 ⑤가 일치하지 않습니다.", "b": 2, "bb": "[학교 변형 지문]\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" – similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All: \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them."},
{"no": 162, "school": "연송고 (인천시)", "pref": "39", "type": "글비교", "stem": "다음 글 (A)(본문)와 아래 글 (B)를 읽고 이해한 내용으로 가장 적절한 것은? (B) 'Many critics argue that companies should not advertise a social purpose until they have achieved significant results. However, expecting immediate and measurable impact may overlook how social change often begins. Publicly announcing a commitment to a social cause can encourage companies to set goals, attract supporters, and create accountability. Even when early efforts are limited, communicating a purpose can raise public awareness and inspire further action both inside and outside the organization. In addition, consumers increasingly expect businesses to participate in addressing social issues. By sharing their intentions from the beginning, companies invite customers, employees, and investors to join the process. While some firms may exaggerate their achievements, not every public statement should be dismissed as \"purpose-washing.\" In many cases, visible commitments serve as a starting point that motivates organizations to make meaningful contributions over time.'", "p": "39-a", "choices": ["(A) argues that genuine commitment should come before public promotion, whereas (B) suggests that public promotion can help build commitment.", "Both (A) and (B) emphasize that the primary role of social purpose is to improve corporate reputation rather than solve social problems.", "Both (A) and (B) insist that companies should avoid communicating a social purpose until they achieve measurable social outcomes.", "(A) claims that social purpose has little influence on brand image, whereas (B) argues that social purpose is more important than product quality.", "While (A) views purpose-driven communication as beneficial for long-term growth, (B) considers such communication largely ineffective."], "ans": 1, "exp": "(A)는 진정한 헌신이 홍보보다 먼저라고 보고, (B)는 목적을 먼저 공개하는 것이 이후의 헌신을 촉진할 수 있다고 보므로 ①이 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\n(A)\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" - similar to green-washing, where purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridhardas describes in Winners Take All : \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them.\n(B)\nMany critics argue that companies should not advertise a social purpose until they have achieved significant results. However, expecting immediate and measurable impact may overlook how social change often begins. Publicly announcing a commitment to a social cause can encourage companies to set goals, attract supporters, and create accountability. Even when early efforts are limited, communicating a purpose can raise public awareness and inspire further action both inside and outside the organization. In addition, consumers increasingly expect businesses to participate in addressing social issues. By sharing their intentions from the beginning, companies invite customers, employees, and investors to join the process. While some firms may exaggerate their achievements, not every public statement should be dismissed as \"purpose-washing.\" In many cases, visible commitments serve as a starting point that motivates organizations to make meaningful contributions over time."},
{"no": 163, "school": "중앙고 (울산시)", "pref": "39", "type": "빈칸", "stem": "다음 빈칸 'Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" – similar to green-washing, in that ___.'에 들어갈 말로 가장 적절한 것은?", "p": "39-a", "choices": ["a genuine, organization-wide dedication to a cause guides every strategic business decision", "a company's internal ethics conflict with the external demands of the consumers", "companies disguise their core profit-seeking motives as socially responsible activities", "consumers become increasingly skeptical of brands that promote social causes without measurable action", "a brand's public commitment to sustainability forces other competitors to conform to the trend"], "ans": 3, "exp": "목적-세탁과 그린워싱은 진정한 헌신 없이 이익 추구 동기를 사회적 책임 활동으로 포장한다는 점에서 같으므로 ③이 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nRealising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand's reputation, rather than embracing the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to follow from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call \"purpose-washing\" – similar to green-washing, in that [_________________________________]. We end up with what Anand Giridhardas describes in Winners Take All : \"social purpose that just furthers the charade of elites disrupting the old order without giving much back\". Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees feel worse about working for them.\n*charade: 뻔한 속임수"},
{"no": 164, "school": "함월고 (울산시)", "pref": "40", "type": "무관문장", "stem": "다음 ⓐ~ⓔ 중 전체 흐름과 관계없는 문장은? (① 박자 추출(박이 무엇이고 언제 올지 아는 것)은 음악적 감정의 핵심임 ② 'Pulse refers to the rhythmic expansion of arteries caused by the heartbeat and is an essential indicator of cardiovascular health.' ③ 음악은 기대의 체계적 위반을 통해 감정을 전달함 ④ 위반은 음높이·리듬·템포 등 어느 영역에서든 반드시 일어나야 함 ⑤ 음악은 조직된 소리지만 예상 밖의 요소가 있어야 함)", "p": "40-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "음악적 기대와 감정에 관한 글에서 ②(ⓑ)는 심장박동에 따른 동맥의 맥박을 설명하므로 무관하다.", "b": 1, "bb": "[학교 변형 지문]\nThe brain needs to create a model of a constant pulse – a schema – so that we know when the musicians are not conforming to it. This is similar to variations of a melody: We need to have a mental representation of what the melody is in order to know – and appreciate – when the musician is taking liberties with it. ⓐ[Metrical extraction, knowing what the pulse is and when we expect it to occur, is a crucial part of musical emotion]. ⓑ[Pulse refers to the rhythmic expansion of arteries caused by the heartbeat and is an essential indicator of cardiovascular health]. ⓒ[Music communicates to us emotionally through systematic violations of expectations]. ⓓ[These violations can occur in any domain – the domain of pitch, rhythm, tempo, and so on – but occur they must]. ⓔ[Music is organized sound, but the organization has to involve some element of the unexpected or it is emotionally flat and robotic]. Too much organization may technically still be music, but it would be music that no one wants to listen to."},
{"no": 165, "school": "선사고 (서울시)", "pref": "40", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "40-a", "choices": ["How Repetition Creates Musical Excellence", "The Benefits of Predictability in Musical Composition", "The Emotional Power of Violated Expectations in Music", "The Relationship Between Music and Mathematical Accuracy", "The Importance of Technical Perfection in Musical Performance"], "ans": 3, "exp": "음악은 기대를 체계적으로 깨뜨릴 때 감정을 전달한다는 것이 핵심이다.", "b": 1, "bb": "[학교 변형 지문]\nThe brain needs to create a model of a constant pulse ─ a schema ─ so that we know when the musicians are not conforming to it. This is similar to variations of a melody: We need to have a mental representation of what the melody is in order to know ─ and appreciate ─ when the musician is taking liberties with it. Metrical extraction, knowing what the pulse is and when we expect it to occur, is a crucial part of musical emotion. Music communicates to us emotionally through systematic violations of expectations. These violations can occur in any domain ─ the domain of pitch, rhythm, tempo, and so on - but occur they must. Music is organized sound, but the organization has to involve some element of the unexpected or it is emotionally flat and robotic. Too much organization may technically still be music, but it would be music that no one wants to listen to."},
{"no": 166, "school": "일신여고 (청주시)", "pref": "40", "type": "밑줄의미", "stem": "다음 글에서 밑줄 친 'it would be music that no one wants to listen to'가 의미하는 바로 가장 적절한 것은?", "p": "40-a", "choices": ["People tend to listen only to music that matches their musical preferences.", "Excessive predictability can make music less emotionally compelling.", "Music becomes engaging when it completely follows predictable patterns.", "No one would want to listen to music with inaccurate pitch and rhythm.", "Music conveys emotion only when performers ignore musical rules."], "ans": 2, "exp": "지나치게 조직되어 예측 가능한 음악은 감정적으로 밋밋하고 기계적이라는 뜻이다.", "b": 1, "bb": "[학교 변형 지문]\nThe brain needs to create a model of a constant pulse ― a schema ― so that we know when the musicians are not conforming to it. This is similar to variations of a melody: We need to have a mental representation of what the melody is in order to know ― and appreciate ― when the musician is taking liberties with it. Metrical extraction, knowing what the pulse is and when we expect it to occur, is a crucial part of musical emotion. Music communicates to us emotionally through systematic violations of expectations. These violations can occur in any domain ― the domain of pitch, rhythm, tempo, and so on ― but occur they must. Music is organized sound, but the organization has to involve some element of the unexpected or it is emotionally flat and robotic. Too much organization may technically still be music, but [it would be music that no one wants to listen to]."},

const TYPE_OF={}; TYPE_GROUPS.forEach(([g,list])=>list.forEach(t=>TYPE_OF[t]=g));
QUESTIONS.forEach(q=>{q.tg=TYPE_OF[q.type]||'기타';});
let selectedTypes=new Set();   // 비어 있으면 전체 유형
function typeOk(q){return selectedTypes.size===0||selectedTypes.has(q.tg);}
function renderTypeRow(){
  const row=document.getElementById('typeRow'); if(!row) return;
  row.innerHTML='';
  const all=document.createElement('button');
  all.className='fb'+(selectedTypes.size===0?' on':'');
  all.innerHTML='전체 유형<small>'+QUESTIONS.length+'</small>';
  all.onclick=()=>{selectedTypes.clear();renderTypeRow();renderPassageGrid();};
  row.appendChild(all);
  const groups=[...TYPE_GROUPS.map(g=>g[0])]; if(QUESTIONS.some(q=>q.tg==='기타')) groups.push('기타');
  groups.forEach(g=>{
    const n=QUESTIONS.filter(q=>q.tg===g).length; if(!n) return;
    const b=document.createElement('button');
    b.className='fb'+(selectedTypes.has(g)?' on':'');
    b.innerHTML=g+'<small>'+n+'</small>';
    b.onclick=()=>{ if(selectedTypes.has(g)) selectedTypes.delete(g); else selectedTypes.add(g); renderTypeRow(); renderPassageGrid(); };
    row.appendChild(b);
  });
}
function setPerRef(n,btn){perRef=n;document.querySelectorAll('#cntRow .fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

// ── START ──────────────────────────────────────────
function goPassageSelect(){
  userSchool = document.getElementById('si').value;
  userName = document.getElementById('ni').value.trim();
  if(!userSchool){alert('학교를 선택해주세요!');return;}
  if(!userName){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bomnal_name',userName);localStorage.setItem('bomnal_school',userSchool);}catch(e){}
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('userInfo').textContent = userName + ' · ' + userSchool;
  _loadHist();
  renderTypeRow();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

// ── QUIZ ──────────────────────────────────────────
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 · ${q.b}차</span>
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(escHTML(q.body))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.textContent='💡 '+q.exp;fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID;
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 25년 6월 총괄 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고2_26년6월_총괄_학교기출',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>

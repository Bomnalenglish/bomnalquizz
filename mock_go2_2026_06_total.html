{"no": 96, "school": "함월고 (울산시)", "pref": "33", "type": "무관문장", "stem": "다음 ⓐ~ⓔ 중 전체 흐름과 관계없는 문장은? (① 진화적 시간 척도에서는 그러한 환경 변화가 실제로 일어남 ② 그래서 생물은 진화를 멈추지 않고 변화하는 환경에 보조를 맞춤 ③ 'Such surroundings, for example, can reshape an animal's coat color over generations, as a lighter coat helps it stay hidden against the snow.' ④ 기온이 꾸준히 내려가면 더 긴 털 쪽으로 선택 압력이 작용함 ⑤ 기온이 다시 오르면 다시 짧은 털 쪽으로 밀려남)", "p": "33-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 3, "exp": "털 길이 변화의 흐름 속에 눈 속 위장을 위한 털 색깔 변화라는 별개의 사례를 넣은 ③(ⓒ)이 흐름과 무관하다.", "b": 1, "bb": "[학교 변형 지문]\nEvolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of the area, a shift in the prevailing wind. ⓐ[Such changes do happen when we are dealing with a timescale as long as the evolutionary one]. ⓑ[Because of this, living things seldom stop evolving and instead keep pace with their ever-changing surroundings]. ⓒ[Such surroundings, for example, can reshape an animal's coat color over generations, as a lighter coat helps it stay hidden against the snow]. ⓓ[If there is a steady downward drift in the average temperature in the area, successive generations of animals will be propelled by a steady selection 'pressure' in the direction of growing longer coats of hair]. ⓔ[If after a few thousand years the trend reverses and average temperatures creep up again, the animals will be pushed towards growing shorter coats again]."},
{"no": 97, "school": "경산여고 (경산시)", "pref": "33", "type": "주제", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "33-a", "choices": ["role of competition in accelerating evolutionary change", "tendency of evolution to follow a predetermined direction", "process by which environmental change continually shapes evolution", "advantages of physical adaptations over behavioral adaptations", "reasons why animals eventually stop adapting to their environments"], "ans": 3, "exp": "환경 조건이 변할 때마다 진화가 이를 계속 따라간다는 내용이므로 ③이 주제이다.", "b": 1, "bb": "[학교 변형 지문]\nEvolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of an area, or a shift in the prevailing wind. Such changes do occur when we are dealing with an evolutionary timescale. As a consequence, evolution normally does not come to a halt but continues to respond to changing environmental conditions. If there is a steady downward drift in the average temperature in an area, one that persists over centuries, successive generations of animals will be propelled by a steady selection pressure in the direction of growing longer coats of hair. If, after a few thousand years of reduced temperature, the trend reverses and average temperatures begin to rise again, the animals will come under the influence of a new selection pressure and will be pushed toward growing shorter coats once more."},

{"no": 100, "school": "신흥고 (청주시)", "pref": "33", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은? (주어진 글: Evolution will come to a standstill ... a shift in the prevailing wind. / (A) If after a few thousand years of reduced temperature the trend reverses... / (B) Such changes do happen when we are dealing with a timescale as long as the evolutionary one... / (C) If there is a steady downward drift in the average temperature in the area...)", "p": "33-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 3, "exp": "환경 변화를 Such changes로 받는 (B), 기온 하강에 따른 긴 털의 진화 (C), 그 추세가 역전되는 (A) 순서가 자연스럽습니다.", "b": 2, "bb": "[학교 변형 지문]\nEvolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of the area, a shift in the prevailing wind.\n(A) If after a few thousand years of reduced temperature the trend reverses and average temperatures creep up again, the animals will come under the influence of a new selection pressure, and will be pushed towards growing shorter coats again.\n(B) Such changes do happen when we are dealing with a timescale as long as the evolutionary one. As a consequence, evolution normally does not come to a halt, but constantly tracks the changing environment.\n(C) If there is a steady downward drift in the average temperature in the area, a drift that persists over centuries, successive generations of animals will be propelled by a steady selection 'pressure' in the direction, say, of growing longer coats of hair."},
{"no": 101, "school": "대암고 (창원시)", "pref": "33", "type": "주제", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "33-a", "choices": ["unexpected results of a new selection pressure", "evolution responding to changes that occur in some situations", "negative effects of increasing average temperature on animals", "animals' physical characteristics without regard to natural environment", "disharmony between animals' developmental stages and evolutionary timescale"], "ans": 2, "exp": "환경 조건이 변하면 진화가 그 변화를 따라가며 기온 변화에 따라 털 길이도 달라진다는 내용이므로 ②가 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nEvolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of the area, a shift in the prevailing wind. Such changes do happen when we are dealing with a timescale as long as the evolutionary one. As a consequence, evolution normally does not come to a halt, but constantly tracks the changing environment. If there is a steady downward drift in the average temperature in the area, a drift that persists over centuries, successive generations of animals will be propelled by a steady selection 'pressure' in the direction, say, of growing longer coats of hair. If after a few thousand years of reduced temperature the trend reverses and average temperatures creep up again, the animals will come under the influence of a new selection pressure, and will be pushed towards growing shorter coats again."},
{"no": 102, "school": "주성고 (청주시)", "pref": "33", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 기온이 수 세기 동안 꾸준히 하강하면 여러 세대의 동물이 더 긴 털을 기르는 방향으로 선택압을 받음 ② 'Thick and well-developed coats of hair are generally more effective at repelling water and protecting the skin from heavy rainfall rather than blocking the cold.' ③ 수천 년 뒤 추세가 역전되어 기온이 오르면 동물들은 다시 짧은 털 쪽으로 밀려남 ④ 'This demonstrates that evolutionary traits are not permanent achievements but continuous adjustments to shifting baselines.' ⑤ 'As long as the planet's climate remains in flux, the biological features of its inhabitants will continue to shift alongside it.')", "p": "33-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "기온과 털 길이의 인과 흐름 속에서 긴 털이 비를 막는 데 효과적이라는 ⓑ는 흐름에서 벗어납니다.", "b": 2, "bb": "[학교 변형 지문]\nEvolution will come to a standstill until something in the conditions changes: the onset of an ice age, a change in the average rainfall of the area, a shift in the prevailing wind. Such changes do happen when we are dealing with a timescale as long as the evolutionary one. As a consequence, evolution normally does not come to a halt, but constantly tracks the changing environment. ⓐIf there is a steady downward drift in the average temperature in the area, a drift that persists over centuries, successive generations of animals will be propelled by a steady selection 'pressure' in the direction, say, of growing longer coats of hair. ⓑThick and well-developed coats of hair are generally more effective at repelling water and protecting the skin from heavy rainfall rather than blocking the cold. ⓒIf after a few thousand years of reduced temperature the trend reverses and average temperatures creep up again, the animals will come under the influence of a new selection pressure, and will be pushed towards growing shorter coats again. ⓓThis demonstrates that evolutionary traits are not permanent achievements but continuous adjustments to shifting baselines. ⓔAs long as the planet's climate remains in flux, the biological features of its inhabitants will continue to shift alongside it."},
{"no": 103, "school": "인일여고 (인천시)", "pref": "34", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "34-a", "choices": ["ⓐ has", "ⓑ popularly", "ⓒ supply", "ⓓ is", "ⓔ requires"], "ans": 2, "exp": "ⓑ popularly → popular: be동사의 주격보어 자리이므로 형용사가 와야 한다.", "b": 1, "bb": "[학교 변형 지문]\n-- ⓑ는 의문문 *Why are these carts so ~?*에서 주어 these carts의 상태를 설명하는 주격보어 자리이므로 부사 popularly가 아니라 형용사 popular를 써야 합니다.\n-- be-동사 뒤의 보어 자리에는 일반적으로 형용사가 와서 주어나 목적어의 상태·성질을 설명하며, 부사는 주로 동사·형용사·다른 부사 등을 수식합니다.\nThe high price of land in metropolitan areas ⓐhas implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so ⓑpopularly, with over 3,000 in New York City alone? Consider the resources used to ⓒsupply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose ⓓis most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart ⓔrequires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."},
{"no": 104, "school": "충북대학교사범대학부설고 (청주시)", "pref": "34", "type": "요약", "stem": "요약 - 'High urban land costs encourage vendors to substitute (A)___ resources for (B)___ ones, thereby maximizing profits.'", "p": "34-a", "choices": ["(A) scarce — (B) public", "(A) alternative — (B) costly", "(A) commercial — (B) available", "(A) productive — (B) limited", "(A) pricey — (B) reasonable"], "ans": 2, "exp": "노점상은 비싼(costly) 상업 공간 대신 무료 보행로라는 대체(alternative) 자원을 사용한다.", "b": 1, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."},
{"no": 105, "school": "인성여고 (인천시)", "pref": "34", "type": "요지", "stem": "다음 글의 요지로 가장 적절한 것은?", "p": "34-a", "choices": ["Commercial space rent is a vending cart's largest cost", "Street vendors maximize their profit on the public sidewalk", "Selling hot dogs is the most profitable activity in New York City", "High land prices increase the prices of goods sold by vending carts", "Vendors should be banned from using public sidewalks to keep streets clean"], "ans": 2, "exp": "이윤을 극대화하려는 노점상은 비싼 상업 공간 대신 무료인 공공 보행로를 이용한다는 것이 요지이다.", "b": 1, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."},
{"no": 106, "school": "산동고 (구미시)", "pref": "34", "type": "문장삽입", "stem": "글의 흐름으로 보아, [주어진 문장]이 들어가기에 가장 적절한 곳은?", "p": "34-a", "choices": ["(A) 자리", "(B) 자리", "(C) 자리", "(D) 자리", "(E) 자리"], "ans": 4, "exp": "상업 공간 임대료가 연 2만 달러에 이른다는 내용과 however로 대조되고, 노점상의 선택이라는 결론 앞에 와야 한다.", "b": 1, "bb": "[학교 변형 지문]\n[주어진 문장] Aside from the necessary public permits, however, space on the public sidewalk is free to vendors.\n\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. (A) For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? (B) Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? (C) Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. (D) Profit-maximizing street vendors substitute public sidewalks for costly commercial space. (E)\n*entrepreneurial: 기업가의"},
{"no": 107, "school": "중앙고 (울산시)", "pref": "34", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "34-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 5, "exp": "가장 비싼 자원을 묻는 (C), 상업 공간 임대료로 답하는 (B), however로 무료 보행로를 대조하며 결론짓는 (A) 순이다.", "b": 1, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone?\n(A) Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for  costly commercial space.\n(B) Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space.\n(C) Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City?"},
{"no": 108, "school": "청주여고 (청주시)", "pref": "34", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 뉴욕시에만 3,000대가 넘는 노점 카트가 왜 그렇게 인기 있는가? ② 뉴욕시에서 이 자원들 중 무엇이 가장 비싸다고 생각하는가? ③ 'Many tourists who visit New York City regard sidewalk vendors as part of the city's unique cultural identity and urban atmosphere.' ④ 매디슨 애비뉴의 소매 공간 임대료는 평방피트당 연평균 550달러임 ⑤ 필요한 공공 허가를 제외하면 공공 보도 공간은 노점상에게 무료임)", "p": "34-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 3, "exp": "비싼 상업 공간 대신 무료 보도를 택하는 자원 배분이 중심 흐름이므로, 관광객이 노점을 뉴욕의 문화적 정체성으로 본다는 ⓒ는 관계없습니다.", "b": 2, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. ⓐ[Why are these carts so popular, with over 3,000 in New York City alone]? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. ⓑ[Which of these do you suppose is most expensive in New York City]? ⓒ[Many tourists who visit New York City regard sidewalk vendors as part of the city's unique cultural identity and urban atmosphere]. ⓓ[Retail space along Madison Avenue rents for an average of $550 a year per square foot]. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. ⓔ[Aside from the necessary public permits, however, space on the public sidewalk is free to vendors]. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."},
{"no": 109, "school": "서울대학교사범대학부설고 (서울시)", "pref": "34", "type": "요약", "stem": "요약 - 'Because commercial space in cities is extremely (A)___, profit-seeking street vendors choose to use public sidewalks as a (B)___ alternative.'", "p": "34-a", "choices": ["(A) scarce — (B) temporary", "(A) costly — (B) complimentary", "(A) regulated — (B) convenient", "(A) competitive — (B) profitable", "(A) expensive — (B) flexible"], "ans": 2, "exp": "도시 상업 공간은 매우 비싸고(costly), 공공 보도는 허가 외에는 무료(complimentary) 대안이므로 ②가 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space.\nBecause commercial space in cities is extremely (A)[__________], profit-seeking street vendors choose to use public sidewalks as a (B)[__________] alternative."},
{"no": 110, "school": "원묵고 (서울시)", "pref": "34", "type": "빈칸", "stem": "다음 빈칸 'Profit-maximizing street vendors substitute (A)___ for (B)___.'에 들어갈 말로 가장 적절한 것은?", "p": "34-a", "choices": ["(A) free public sidewalks — (B) high-priced indoor locations", "(A) expensive retail space — (B) free public sidewalks", "(A) intermediate ingredients — (B) fixed capital resources", "(A) entrepreneurial abilities — (B) public physical space", "(A) costly commercial space — (B) free public sidewalks"], "ans": 1, "exp": "substitute A for B는 'B 대신 A를 쓰다'이므로, 비싼 실내 공간 대신 무료 공공 보도를 이용한다는 ①이 맞습니다.", "b": 2, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute (A)[______________] for (B)[______________].\n(A)(B)"},
{"no": 111, "school": "함월고 (울산시)", "pref": "34", "type": "어법", "stem": "다음 ⓐ~ⓔ 중 어법이 옳지 않은 것은?", "p": "34-a", "choices": ["ⓐ has", "ⓑ stands", "ⓒ used to", "ⓓ rents", "ⓔ operating"], "ans": 2, "exp": "ⓑ stands → stand: 장소 부사구가 문두에 온 도치 구문으로 실제 주어 over 3,000 vending carts가 복수입니다.", "b": 2, "bb": "[학교 변형 지문]\n-- ⓑ는 장소를 나타내는 전치사구 on the public sidewalks of New York City가 문두에 나오면서 주어와 동사가 도치된 구조이고, 실제 주어가 복수 명사구 over 3,000 vending carts이므로 동사도 복수형 stand가 되어야 합니다.\n-- 장소 부사구가 문두에 와서 주어와 동사가 도치되더라도 동사의 수는 뒤에 놓인 실제 주어의 수에 일치해야 합니다.\nThe high price of land in metropolitan areas ⓐhas implications for the efficient employment of resources. For example, on the public sidewalks of New York City ⓑstands over 3,000 vending carts selling everything from hot dogs to ice cream. Consider the resources ⓒ[used to] supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue ⓓrents for an average of $550 a year per square foot. Because ⓔoperating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."},
{"no": 112, "school": "이순신고 (아산시)", "pref": "34", "type": "어휘괄호", "stem": "괄호 (A)[wasteful/economical] (B)[consume/supply] (C)[utilize/overlook] - 문맥에 맞는 것은? ((A) the ___ employment of resources, (B) the resources used to ___ hot dogs, (C) 'Profit-maximizing street vendors ___ public sidewalks instead of costly commercial space.')", "p": "34-a", "choices": ["(A) wasteful — (B) consume — (C) overlook", "(A) economical — (B) supply — (C) utilize", "(A) economical — (B) supply — (C) overlook", "(A) economical — (B) consume — (C) overlook", "(A) wasteful — (B) supply — (C) utilize"], "ans": 2, "exp": "자원의 경제적(economical) 사용, 핫도그를 공급(supply)하는 자원, 비싼 상업 공간 대신 보도를 활용(utilize)하는 흐름이므로 ②가 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the (A)[wasteful / economical] employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular in New York City, where more than 3,000 of them can be found? Consider the resources used to (B)[consume / supply] hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of 550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as 20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors (C)[utilize / overlook] public sidewalks instead of costly commercial space."},
{"no": 113, "school": "배문고 (서울시)", "pref": "34", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "34-a", "choices": ["High Land Prices: A Major Impact on the Efficient Use of Resources", "The More Benefits of Expanding Urban Transportation Systems", "How Technological Advances Reduce Housing Costs Dramatically", "How Is Population Growth Closely Related to the Environment?", "Why People Prefer Living in Large Cities than Suburban Areas"], "ans": 1, "exp": "도시의 높은 땅값이 노점상이 비싼 상업 공간 대신 무료 보도를 쓰게 하여 자원을 효율적으로 배분하게 만든다는 내용이므로 ①이 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nThe high price of land in metropolitan areas has implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so popular, with over 3,000 in New York City alone? Consider the resources used to supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."},
{"no": 114, "school": "주성고 (청주시)", "pref": "35", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "35-a", "choices": ["Categorizing Art: A Guide to Art Classification", "Why Artists Create: The Personal Stories Behind Art", "From History to Science: How Art Reflects Society", "Context as a Key: How We Interpret Works of Art", "The Visual Elements That Define a Work of Art"], "ans": 4, "exp": "예술 작품은 맥락 정보를 바탕으로 의미를 해석하는 과정을 거쳐 이해된다는 내용이다.", "b": 1, "bb": "[학교 변형 지문]\nThe process we go through when we look at a work of art to determine if we recognize and can make sense of its content is not just a visual one. It is a mental process as well, largely based on the elements within and about the work we can identify and categorize. As we look and think, we may be given clues about what the work means by where it is, when it was made, what culture it came from, who created it, or why it was made. Any information we can gather helps us understand the work's context, that is, for what historical, social, personal, political, or scientific reasons the work of art was made. And then, using all the contextual information we have gathered, we interpret the work of art's content to discover what it means or symbolizes."},

{"no": 116, "school": "충북대학교사범대학부설고 (청주시)", "pref": "35", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "35-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 3, "exp": "'정신적 과정이기도 하다'는 (B), 구체적 맥락 단서의 (C), 이를 종합해 의미를 해석하는 (A) 순이다.", "b": 1, "bb": "[학교 변형 지문]\nThe process we go through when we look at a work of art to determine if we recognize and can make sense of its content is not just a visual one.\n(A) Any information we can gather helps us understand the work's context, that is, for what historical, social, personal, political, or scientific reasons the work of art was made. And then, using all the contextual information we have gathered, we interpret the work of art's content to discover what it means or symbolizes.\n(B) It is a mental process as well, largely based on the elements within and about the work we can identify and categorize.\n(C) As we look and think, we may be given clues about what the work means by where it is, when it was made, what culture it came from, who created it, or why it was made."},
{"no": 117, "school": "인성여고 (인천시)", "pref": "35", "type": "요지", "stem": "다음 글의 요지로 가장 적절한 것은?", "p": "35-a", "choices": ["예술 작품은 외부 요소를 배제한 채 감상해야 한다.", "예술 작품은 보이는 대로 분류하는 것이 바람직하다.", "예술 작품을 해석할 때 다양한 맥락적 정보가 사용된다.", "예술 작품을 감상할 때 시각적인 측면을 가장 고려해야 한다.", "예술 작품을 해석할 때 그것의 의미나 상징은 파악하기 어렵다."], "ans": 3, "exp": "예술 작품 이해는 시대·문화·창작자·목적 등 다양한 맥락 정보를 종합해 의미를 해석하는 과정이므로 ③이 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nThe process we go through when we look at a work of art to determine if we recognize and can make sense of its content is not just a visual one. It is a mental process as well, largely based on the elements within and about the work we can identify and categorize. As we look and think, we may be given clues about what the work means by where it is, when it was made, what culture it came from, who created it, or why it was made. Any information we can gather helps us understand the work's context, that is, for what historical, social, personal, political, or scientific reasons the work of art was made. And then, using all the contextual information we have gathered, we interpret the work of art's content to discover what it means or symbolizes."},
{"no": 118, "school": "한국교원대학교부설고 (청주시)", "pref": "36", "type": "문장삽입", "stem": "글의 흐름으로 보아, [주어진 문장]이 들어가기에 가장 적절한 곳은?", "p": "36-a", "choices": ["(A) 자리", "(B) 자리", "(C) 자리", "(D) 자리", "(E) 자리"], "ans": 2, "exp": "This는 동물들이 생존에 에너지를 다 쓰는 상황을 가리키고, 뒤 문장의 them이 our early ancestors를 받는다.", "b": 1, "bb": "[학교 변형 지문]\n[주어진 문장] This was also true for our early ancestors.\n\nFor most animals the struggle to survive takes up all their time. Finding food and drink, keeping warm and clean, avoiding predators, migrating and reproducing use up all their energies. If they do have any time to spare, they spend it resting or sleeping. (A) Only very young animals, under the protection of their parents, have enough surplus energy to engage in lively bouts of play. (B) The constant search for food would have put heavy demands upon them. (C) But as they slowly evolved into more and more efficient hunters, the situation changed. (D) Their success came from greater intelligence, as they used brains rather than brawn to kill their prey. (E) By the end of the long hunting era, before they turned to farming, plentiful prey and advanced hunting techniques had brought them enough prosperity to have time on their hands."},
{"no": 119, "school": "인일여고 (인천시)", "pref": "36", "type": "요지", "stem": "다음 글의 요지로 가장 적절한 것은?", "p": "36-a", "choices": ["For most animals, simply staying alive takes up nearly all of their time and energy.", "Young animals learn the skills they need to survive by playing with one another.", "Moving from hunting to farming gave humans a more stable and reliable food supply.", "Success in hunting came from working together as a group rather than from physical strength.", "Humans gained leisure time by developing intelligence to make their hunting more efficient."], "ans": 5, "exp": "초기 인류는 지능을 발달시켜 사냥 효율을 높임으로써 풍요와 여가 시간을 얻었다.", "b": 1, "bb": "[학교 변형 지문]\nFor most animals the struggle to survive takes up all their time. Finding food and drink, keeping warm and clean, avoiding predators, migrating and reproducing use up all their energies. If they do have any time to spare, they spend it resting or sleeping. Only very young animals, under the protection of their parents, have enough surplus energy to engage in lively bouts of play. This was also true for our early ancestors. The constant search for food would have put heavy demands upon them. But as they slowly evolved into more and more efficient hunters, the situation changed. The secret of their success was the development of much greater intelligence. They used brain, not brawn, to kill their prey. At the end of the long hunting era, before they turned to farming, they were already enjoying some degree of affluence. In certain regions, at particular times of year, the prey was sufficiently plentiful and their hunting techniques sufficiently advanced for them to experience a remarkable degree of prosperity. They had time on their hands."},
{"no": 120, "school": "금천고 (청주시)", "pref": "36", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "36-a", "choices": ["ⓐ demands", "ⓑ scarcity", "ⓒ efficient", "ⓓ affluence", "ⓔ favorable"], "ans": 2, "exp": "ⓑ scarcity → prosperity: 먹잇감이 풍부했으므로 결핍이 아니라 번영을 경험했다.", "b": 1, "bb": "[학교 변형 지문]\nFor most animals, the struggle to survive takes up all their time. They find food and avoid predators, using up all their energy in the process. If they have any time to spare, they spend it resting. The same was true for early humans, who faced heavy ⓐdemands in their daily search for food. However, in certain regions and seasons, the prey was sufficiently plentiful to allow them to experience a remarkable degree of ⓑscarcity. Because they had more time on their hands, they slowly evolved into more ⓒefficient hunters by developing greater intelligence. They eventually relied on their brains rather than brawn, and by the end of the long hunting era, they were already enjoying a significant level of ⓓaffluence. As a result, they could sustain their social and technological development, which was ⓔfavorable for the transition to farming."},

as sufficiently plentiful and their hunting techniques sufficiently advanced for them to experience a remarkable degree of prosperity. [___________________________________]."},

{"no": 125, "school": "충북고 (청주시)", "pref": "36", "type": "내용불일치", "stem": "다음 글의 내용과 일치하지 않는 것은?", "p": "36-a", "choices": ["For most adult animals in the wild, any spare time they have is spent resting or sleeping.", "Early ancestors were able to enjoy a degree of prosperity only after they transitioned to farming.", "The constant search for food was once a highly demanding task for our early ancestors as well.", "Advanced hunting techniques and abundant prey in certain regions provided early humans with free time.", "Early humans became successful hunters by relying on their intellectual development rather than muscle power."], "ans": 2, "exp": "초기 인류는 농경으로 전환하기 전인 수렵 시대 말기에 이미 어느 정도 풍요를 누렸으므로 ②가 일치하지 않습니다.", "b": 2},

{"no": 128, "school": "청석고 (청주시)", "pref": "36", "type": "밑줄의미", "stem": "밑줄 친 'They had time on their hands'가 의미하는 바로 가장 적절한 것은?", "p": "36-a", "choices": ["They had leisure in abundance.", "They were willing to assist other tribes' farming.", "They had sign of the times for prolonged hunting.", "They were free to take care of their hands neatly.", "They made a device to set the hands representing time."], "ans": 1, "exp": "have time on one's hands는 '여유 시간이 많다'는 뜻이므로 충분한 여가를 가졌다는 ①이 적절합니다.", "b": 2, "bb": "[학교 변형 지문]\nFor most animals the struggle to survive takes up all their time. Finding food and drink, keeping warm and clean, avoiding predators, migrating and reproducing use up all their energies. If they do have any time to spare, they spend it resting or sleeping. Only very young animals, under the protection of their parents, have enough surplus energy to engage in lively bouts of play. This was also true for our early ancestors. The constant search for food would have put heavy demands upon them. But as they slowly evolved into more and more efficient hunters, the situation changed. The secret of their success was the development of much greater intelligence. They used brain not brawn to kill their prey. At the end of the long hunting era, before they turned to farming, they were already enjoying some degree of affluence. In certain regions, at particular times of year, the prey was sufficiently plentiful and their hunting techniques sufficiently advanced for them to experience a remarkable degree of prosperity. [They had time on their hands]."},
{"no": 129, "school": "인성여고 (인천시)", "pref": "37", "type": "빈칸", "stem": "다음 빈칸 'Because of this, the freeze response results in the ___ in highly stressful and traumatic situations.'에 들어갈 말로 가장 적절한 것은?", "p": "37-a", "choices": ["integration of voices", "inhibition of language", "creation of self-control", "evolution of movement", "maximization of reaction"], "ans": 2, "exp": "소리를 내면 포식자에게 위치가 드러나므로 동결 반응은 언어를 억제한다.", "b": 1, "bb": "[학교 변형 지문]\nThink about a time when you were startled. Did you come to a sudden stop, freeze all your movements, and hold your breath as you scanned the environment for a threat? All these responses maximize our ability to avoid detection, locate the source of possible danger, and prepare to fight or flee. As sophisticated as language has become, it is still the creation of sound that might give away our location to a potential predator. Because of this, the freeze response results in the [______________________] in highly stressful and traumatic situations. Natural selection promoted the evolution of language but conserved the freeze rule. When the threat passes, we begin to relax and find our voices again, perhaps even to laugh at our own reactions. But what if we can never relax? What if our experiences shape our brain to be in a constant state of fear? This interference with the proper development and integration of neural networks can result in chronic stress and even mental illness."},

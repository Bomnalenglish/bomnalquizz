body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:#2a2a2a;}

/* START */
#startScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.s-card{background:var(--card);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;width:100%;box-shadow:0 8px 32px rgba(107,74,43,.15);}
.s-card h1{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--pri);margin-bottom:6px;}
.s-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.info-item{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--pri);font-weight:700;}
.ni{width:100%;padding:11px 14px;border:2px solid var(--bdr);border-radius:12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:10px;}

.ps-header{background:linear-gradient(135deg,#f7efe4,#ece0d2);color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:18px 22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}

.ps-sub{font-size:11px;opacity:.8;margin-top:3px;}

.fb.on{background:var(--pri);color:white;}
.passage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:20px;}
.p-card{background:white;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:2.5px solid #e6dccd;transition:all .18s;position:relative;}

.p-card.sel{border-color:var(--pri);background:#f3ebe0;}

.type-row{display:flex;gap:6px;flex-wrap:wrap;}
.type-row .fb{padding:6px 12px;font-size:12.5px;}
.type-row .fb small{font-weight:400;opacity:.75;margin-left:3px;}
.p-card.off{opacity:.35;pointer-events:none;}
.cnt-box{background:white;border-radius:12px;padding:12px 14px;margin-bottom:10px;border:2px solid #e6dccd;}
.cnt-lbl{font-size:13px;font-weight:800;color:var(--pri);margin-bottom:8px;}
.cnt-lbl span{font-weight:400;color:var(--muted);font-size:12px;}

.go-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}

.hb{background:#fff;color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700;}
.pw{height:4px;background:#e6dccd;}.pf{height:100%;background:linear-gradient(90deg,#6b4a2b,#b07a45);transition:width .4s;}

.qsrc{font-size:10px;color:var(--muted);margin-left:auto;}

.passage-box{background:#fbf7f1;border-left:4px solid var(--pri);border-radius:0 10px 10px 0;padding:14px 16px;font-size:13px;line-height:1.85;margin-bottom:14px;color:#3b2f25;white-space:pre-wrap;}
.q-prompt{font-size:13px;font-weight:700;color:#6b4a2b;margin-bottom:10px;padding:8px 12px;background:#f3ebe0;border-radius:8px;}
.choices{display:grid;gap:8px;}
.cb{background:#f7f1e8;border:2px solid #e6dccd;border-radius:11px;padding:12px 15px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:flex-start;gap:10px;line-height:1.5;}

.fb-msg{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:800;margin-top:10px;display:none;}
.fb-msg.ok{background:#e8f5e9;color:#1b5e20;display:block;}
.fb-msg.no{background:#ffebee;color:#b71c1c;display:block;}

.si{text-align:center;}.sn{font-family:'Black Han Sans',sans-serif;font-size:24px;}.sl{font-size:11px;color:var(--muted);margin-top:2px;}

.wie{font-weight:800;color:var(--pri);}.wid{font-size:10px;color:var(--muted);margin-top:2px;}

{"no": 17, "school": "", "pref": "19", "type": "", "diff": "", "stem": "여권 심사대의 상황에 대해 글이 말하는 것은?", "p": "19-17", "choices": ["줄이 길고 심사관들도 지쳐 있었다", "줄은 짧았고 심사관들은 느긋해 보였다", "줄은 짧았지만 모두 신경이 날카로웠다", "줄이 길어 심사가 빨리 진행되었다"], "ans": 2, "exp": "첫 문장에서 줄은 짧았고 심사관들은 느긋해 보였다고 했어요. 다만 내 창구 심사관만 달랐죠.\n📖 The passport control line was short and <b>the inspectors looked relaxed</b>; except the inspector at my window.\n   여권 심사 줄은 짧았고 심사관들은 느긋해 보였다, 내 창구의 심사관만 빼고는", "b": 1, "bb": "The passport control line was short and the inspectors looked relaxed; except the inspector at my window. He seemed to want to model the seriousness of the task at hand for the other inspectors. Maybe that’s why I felt uneasy when he studied my passport more carefully than I expected. “You were here in September,” he said. “Why are you back so soon?” “I came in September to prepare to return this month,” I replied with a trembling voice, considering if I missed any Italian regulations. “For how long?” he asked. “One month, this time,” I answered truthfully. I knew it was not against the rules to stay in Italy for three months. “Enjoy your stay,” he finally said, as he stamped my passport. Whew! As I walked away, the burden I had carried, even though I did nothing wrong, vanished into the air. My shoulders, once weighed down, now stretched out with comfort."},

{"no": 33, "school": "", "pref": "20", "type": "", "diff": "", "stem": "아이에게 걱정이 무의미하다고 설득하는 것만으로는 어떻게 되는가?", "p": "20-33", "choices": ["걱정을 숨기는 법을 배운다", "걱정을 부모에게 털어놓는다", "걱정을 멈추게 하지 못한다", "걱정을 금방 멈추게 된다"], "ans": 3, "exp": "첫 문장이 바로 답이에요. 그렇게 설득하는 것만으로는 아이들이 걱정을 멈추지 않는다고 했어요.\n📖 Merely convincing your children that worry is senseless and that they would be more content if they didn’t worry <b>isn’t going to stop them from worrying</b>.\n   걱정이 무의미하다고 설득하는 것만으로는 아이들이 걱정을 멈추게 되지 않는다", "b": 1, "bb": "Merely convincing your children that worry is senseless and that they would be more content if they didn’t worry isn’t going to stop them from worrying. For some reason, young people seem to believe that worry is a fact of life over which they have little or no control. Consequently, they don’t even try to stop. Therefore, you need to convince them that worry, like guilt and fear, is nothing more than an emotion, and like all emotions, is subject to the power of the will. Tell them that they can eliminate worry from their lives by simply refusing to attend to it. Explain to them that if they refuse to act worried regardless of how they feel, they will eventually stop feeling worried and will begin to experience the contentment that accompanies a worry‑free life."},

{"no": 65, "school": "", "pref": "22", "type": "", "diff": "", "stem": "재난이 일어났을 때 사람들 사이의 사회적 장벽에 대해 글이 말하는 것은?", "p": "22-65", "choices": ["평소보다 더 높아진다", "평소보다 낮아지는 일이 많다", "전혀 변하지 않는다", "소문 때문에 더 단단해진다"], "ans": 2, "exp": "두 번째 문장에서 재난 때는 소통이 너무 중요해서 평소의 사회적 장벽이 자주 낮아진다고 했어요.\n📖 So important is communication during a disaster that normal social barriers are often <b>lowered</b>\n   재난 때 소통이 너무 중요해서 평소의 사회적 장벽이 자주 낮아진다.", "b": 1, "bb": "Any new or threatening situation may require us to make decisions and this requires information. So important is communication during a disaster that normal social barriers are often lowered. We will talk to strangers in a way we would never consider normally. Even relatively low grade disruption of our life such as a fire drill or a very late train seems to give us the permission to break normal etiquette and talk to strangers. The more important an event to a particular public, the more detailed and urgent the requirement for news becomes. Without an authoritative source of facts, whether that is a newspaper or trusted broadcast station, rumours often run riot. Rumours start because people believe their group to be in danger and so, although the rumour is unproven, feel they should pass it on. For example, if a worker heard that their employer’s business was doing badly and people were going to be made redundant, they would pass that information on to colleagues."},

{"no": 80, "school": "", "pref": "22", "type": "", "diff": "", "stem": "글의 전개 방식으로 가장 적절한 것은?", "p": "22-80", "choices": ["두 이론을 끝까지 맞세워 비교한다", "시간 순서대로 사건을 나열한다", "통계 자료로 결론을 뒤집는다", "원리를 말한 뒤 구체적 예를 든다"], "ans": 4, "exp": "앞부분에서 소통과 소문에 관한 원리를 설명하고, 마지막에 직장인 사례로 구체화했어요.\n📖 <b>For example</b>, if a worker heard that their employer’s business was doing badly and people were going to be made redundant, they would pass that information on to colleagues.\n   예를 들어 직원은 회사가 어렵고 해고가 있을 것이라는 말을 동료들에게 전할 것이다.", "b": 1, "bb": "Any new or threatening situation may require us to make decisions and this requires information. So important is communication during a disaster that normal social barriers are often lowered. We will talk to strangers in a way we would never consider normally. Even relatively low grade disruption of our life such as a fire drill or a very late train seems to give us the permission to break normal etiquette and talk to strangers. The more important an event to a particular public, the more detailed and urgent the requirement for news becomes. Without an authoritative source of facts, whether that is a newspaper or trusted broadcast station, rumours often run riot. Rumours start because people believe their group to be in danger and so, although the rumour is unproven, feel they should pass it on. For example, if a worker heard that their employer’s business was doing badly and people were going to be made redundant, they would pass that information on to colleagues."},
{"no": 81, "school": "", "pref": "23", "type": "", "diff": "", "stem": "사람들이 예술에 대해 인정하는 것으로 글이 말하는 것은?", "p": "23-81", "choices": ["시대와 무관한 순수한 기술 활동", "오직 개인 재능에서 나오는 활동", "특정 문화 전통에 기대는 문화 활동", "과학과 완전히 같은 객관적 활동"], "ans": 3, "exp": "첫 문장에서 예술은 특정 문화 전통에 기대거나 반발하는 문화 활동이라고 했어요.\n📖 People seem to recognize that the arts are <b>cultural activities that draw on (or react against) certain cultural traditions</b>\n   사람들은 예술이 특정 문화 전통에 기대거나 반발하는 문화 활동임을 인정하는 듯하다.", "b": 1, "bb": "People seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place in which the art is created. In the case of science, however, opinions differ. Some scientists, like the great biologist J. B. S. Haldane, see science in a similar light—as a historical activity that occurs in a particular time and place, and that needs to be understood within that context. Others, however, see science as a purely “objective” pursuit, uninfluenced by the cultural viewpoint and values of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief that there is an underlying order of the world which is simply there to be discovered—the world of pure “fact” stripped of any link with value. The aim of science according to this view is to represent this world of pure “fact”, independently of any relationship it might bear contingently to human practices and experiences."},

{"no": 96, "school": "", "pref": "23", "type": "", "diff": "", "stem": "글의 전개 순서로 가장 적절한 것은?", "p": "23-96", "choices": ["과학의 정의 → 예술의 정의 → 결론", "예술의 성격 → 과학의 두 관점 소개", "실험 결과 → 반박 → 새 가설 제시", "통계 제시 → 해석 → 반론 소개"], "ans": 2, "exp": "먼저 예술의 성격을 말하고, 이어 과학을 보는 두 가지 관점을 차례로 소개했어요.\n📖 <b>People seem to recognize that the arts are cultural activities</b> that draw on (or react against) certain cultural traditions\n   사람들은 예술이 문화 활동임을 인정하는 듯하다.", "b": 1, "bb": "People seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place in which the art is created. In the case of science, however, opinions differ. Some scientists, like the great biologist J. B. S. Haldane, see science in a similar light—as a historical activity that occurs in a particular time and place, and that needs to be understood within that context. Others, however, see science as a purely “objective” pursuit, uninfluenced by the cultural viewpoint and values of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief that there is an underlying order of the world which is simply there to be discovered—the world of pure “fact” stripped of any link with value. The aim of science according to this view is to represent this world of pure “fact”, independently of any relationship it might bear contingently to human practices and experiences."},
{"no": 97, "school": "", "pref": "24", "type": "", "diff": "", "stem": "글에 따르면 사회적 코드와 신호를 익힐 수 있는 조건은?", "p": "24-97", "choices": ["더 유능한 어른의 도움이 있을 때", "혼자 조용히 공부할 때", "같은 나이끼리만 모일 때", "법으로 책임을 물을 때"], "ans": 1, "exp": "첫 문장에서 더 유능한 사람, 보통 어른의 도움을 받는 사회적 상황에서만 익힐 수 있다고 했어요.\n📖 which they can master <b>only in social situations with the support of more competent individuals</b>\n   더 유능한 사람들의 도움이 있는 사회적 상황에서만 익힐 수 있다.", "b": 1, "bb": "Mental development consists of individuals increasingly mastering social codes and signals themselves, which they can master only in social situations with the support of more competent individuals, typically adults. In this sense, mental development consists of internalizing social patterns and gradually becoming a responsible actor among other responsible actors. In Denmark, the age of criminal responsibility is 15 years, which means that we then say that people have developed sufficient mental maturity to be accountable for their actions at this point. And at the age of 18 people are given the right to vote and are thereby formally included in the basic democratic process. I do not know whether these age boundaries are optimal, but it is clear that mental development takes place at different rates for different individuals, and depends especially on the social and family environment they have been given. Therefore, having formal limits for responsibility from a specific age that apply to everyone is a somewhat questionable practice. But the question, of course, is whether it can be done any differently."},

{"no": 129, "school": "", "pref": "26", "type": "", "diff": "", "stem": "글에 따르면 Charles Elton이 모피 수집·거래 회사에서 맡은 역할은?", "p": "26-129", "choices": ["생물학 자문으로 일했다", "회사의 회계를 담당했다", "모피 판매원으로 일했다", "회사의 경영을 책임졌다"], "ans": 1, "exp": "헉슬리와 북극 탐사를 다녀온 뒤, 모피 회사에서 '생물학 자문(biological consultant)'으로 일했다고 나옵니다.\n📖 he worked with a fur‑collecting and trading company as a <b>biological consultant</b>\n   그는 모피 수집·거래 회사에서 생물학 자문으로 일했다", "b": 1, "bb": "Born in the English city of Liverpool, Charles Elton studied zoology under Julian Huxley at Oxford University from 1918 to 1922. After graduating, he began teaching as a part‑time instructor and had a long and distinguished teaching career at Oxford from 1922 to 1967. After a series of arctic expeditions with Huxley, he worked with a fur‑collecting and trading company as a biological consultant, and examined the company’s records to study animal populations. In 1927, he wrote his first and most important book, Animal Ecology, in which he demonstrated the nature of food chains and cycles. In 1932, he helped establish the Bureau of Animal Population at Oxford. In the same year he became the editor of the new Journal of Animal Ecology. Throughout his career, Elton wrote six books and played a major role in shaping the modern science of ecology."},

{"no": 177, "school": "", "pref": "29", "type": "", "diff": "", "stem": "글에서 '잘 알려진 관점의 변화'로 든 예는?", "p": "29-177", "choices": ["생물이 진화한다는 생각이 퍼진 일", "지구가 둥글다는 사실이 밝혀진 일", "원자의 구조가 처음 드러난 일", "지구 중심 우주관이 태양 중심으로 바뀐 일"], "ans": 4, "exp": "지구가 우주의 중심이라는 생각이, 태양을 도는 한 행성에 사는 주민일 뿐이라는 생각으로 바뀐 일을 예로 들었어요.\n📖 One well‑known shift took place when the accepted view—that the Earth was the center of the universe—changed to one where we understood that <b>we are only inhabitants on one planet orbiting the Sun</b>.\n   잘 알려진 한 변화는, 지구가 우주의 중심이라는 생각이 우리가 태양을 도는 한 행성의 주민일 뿐이라는 생각으로 바뀐 일이다", "b": 1, "bb": "One well‑known shift took place when the accepted view—that the Earth was the center of the universe—changed to one where we understood that we are only inhabitants on one planet orbiting the Sun. With each person who grasped the solar system view, it became easier for the next person to do so. So it is with the notion that the world revolves around the human economy. This is slowly being replaced by the view that the economy is a part of the larger system of material flows that connect all living things. When this perspective shifts into place, it will be obvious that our economic well‑being requires that we account for, and respond to, factors of ecological health. Unfortunately we do not have a century or two to make the change. By clarifying the nature of the old and new perspectives, and by identifying actions on which we might cooperate to move the process along, we can help accelerate the shift."},

{"no": 193, "school": "", "pref": "30", "type": "", "diff": "", "stem": "글에 따르면 최초의 인류가 옷 없이도 살 수 있었던 까닭은?", "p": "30-193", "choices": ["도구를 먼저 만들었기 때문", "동굴 속에서 생활했기 때문", "피부가 매우 두꺼웠기 때문", "열대 지역에서 진화했기 때문"], "ans": 4, "exp": "첫 문장에 답이 있어요. 옷 없이도 살 수 있는 열대 지역에서 진화했기 때문이라고 했습니다.\n📖 The first human beings probably evolved in <b>tropical regions where survival was possible without clothing</b>\n   최초의 인류는 옷 없이도 생존이 가능한 열대 지역에서 진화했을 것이다.", "b": 1, "bb": "The first human beings probably evolved in tropical regions where survival was possible without clothing. It is likely that they had very dark skin because light skin would have given little protection against the burning rays of the sun. There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, it is believed that in time they became capable of spreading out from Africa, eventually to most of the world. This was probably because their physical characteristics changed. For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently. More important, perhaps, was their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low‑energy vegetarian diet would have provided. Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually expand their territory."},

{"no": 209, "school": "", "pref": "31", "type": "", "diff": "", "stem": "글에 따르면 불리한 결과를 받은 사람이 가장 듣고 싶지 않은 말은?", "p": "31-209", "choices": ["결과를 바꿀 수 있다는 말", "남들도 똑같이 당했다는 말", "과정은 공정했다는 말", "과정은 불공정했다는 말"], "ans": 3, "exp": "첫 문장이 답입니다. 불리한 결과를 얻었을 때 가장 듣고 싶지 않은 말이 '과정은 공정했다'예요.\n📖 the last thing we want to hear is that <b>the process was fair</b>\n   우리가 가장 듣고 싶지 않은 말은 과정이 공정했다는 것이다.", "b": 1, "bb": "When we get an unfavorable outcome, in some ways the last thing we want to hear is that the process was fair. As outraging as the combination of an unfavorable outcome and an unfair process is, this combination also brings with it a consolation prize: the possibility of attributing the bad outcome to something other than ourselves. We may reassure ourselves by believing that our bad outcome had little to do with us and everything to do with the unfair process. If the process is fair, however, we cannot nearly as easily externalize the outcome; we got what we got “fair and square.” When the process is fair we believe that our outcome is deserved, which is another way of saying that there must have been something about ourselves (what we did or who we are) that caused the outcome."},

{"no": 225, "school": "", "pref": "32", "type": "", "diff": "", "stem": "글에 따르면 Kroeber가 연구 자료로 쓴 것은?", "p": "32-225", "choices": ["재단사들의 기록장", "판화를 복제한 그림들", "당시 신문의 광고들", "실제로 남은 옷들"], "ans": 2, "exp": "약 300년을 거슬러 올라가며 판화의 복제본을 사용했다고 했습니다.\n📖 stretching back about three centuries and <b>using reproductions of engravings</b>\n   약 세 세기를 거슬러 올라가며 판화의 복제본을 사용했다.", "b": 1, "bb": "The well‑known American ethnologist Alfred Louis Kroeber made a rich and in‑depth study of women’s evening dress in the West, stretching back about three centuries and using reproductions of engravings. Having adjusted the dimensions of these plates due to their diverse origins, he was able to analyse the constant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical. He reduced women’s clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. He demonstrated unambiguously that fashion is a profoundly regular phenomenon which is not located at the level of annual variations but on the scale of history. For practically 300 years, women’s dress was subject to a very precise periodic cycle: forms reach the furthest point in their variations every fifty years. If, at any one moment, skirts are at their longest, fifty years later they will be at their shortest; thus skirts become long again fifty years after being short and a hundred years after being long."},

{"no": 241, "school": "", "pref": "33", "type": "", "diff": "", "stem": "글에 따르면 지난 수백 년간 전체 번영이 치솟은 까닭은?", "p": "33-241", "choices": ["기술이 발전해 더 부유해져서", "인구가 크게 줄어들어서", "시장이 모두 사라져서", "불평등이 줄어들어서"], "ans": 1, "exp": "기술 발전이 우리를 그 어느 때보다 훨씬 부유하게 만들었다고 했습니다.\n📖 humanity’s collective prosperity has skyrocketed, as <b>technological progress has made us far wealthier than ever before</b>\n   기술 발전이 우리를 전보다 훨씬 부유하게 만들어, 인류 전체의 번영이 치솟았다.", "b": 1, "bb": "Over the last few centuries, humanity’s collective prosperity has skyrocketed, as technological progress has made us far wealthier than ever before. To share out those riches, almost all societies have settled upon the market mechanism, rewarding people in various ways for the work that they do and the things that they own. But rising inequality, itself often driven by technology, has started to put that mechanism under strain. Today, markets already provide immense rewards to some people but leave many others with very little. And now, technological unemployment threatens to become a more radical version of the same story, taking place in the particular market we rely upon the most: the labor market. As that market begins to break down, more and more people will be in danger of not receiving a share of society’s prosperity at all."},

{"no": 257, "school": "", "pref": "34", "type": "", "diff": "", "stem": "글에 따르면 숙달(mastery)에 가까워질수록 흔히 나타나는 일은?", "p": "34-257", "choices": ["기본기에 대한 의식적 인식이 줄어든다", "기본기를 더 또렷하게 설명하게 된다", "가르치는 일에 자신감이 더 커진다", "새 기술을 배우는 속도가 빨라진다"], "ans": 1, "exp": "숙달로 나아갈수록 기본기에 대한 '의식적 인식'은 오히려 줄어든다고 했어요.\n📖 The further you progress toward mastery, <b>the less conscious awareness you often have of the fundamentals</b>\n   숙달로 더 나아갈수록 기본기에 대한 의식적 인식은 오히려 줄어든다.", "b": 1, "bb": "It’s often said that those who can’t do, teach. It would be more accurate to say that those who can do, can’t teach the basics. A great deal of expert knowledge is implicit, not explicit. The further you progress toward mastery, the less conscious awareness you often have of the fundamentals. Experiments show that skilled golfers and wine aficionados have a hard time describing their putting and tasting techniques—even asking them to explain their approaches is enough to interfere with their performance, so they often stay on autopilot. When I first saw an elite diver do four and a half somersaults, I asked how he managed to spin so fast. His answer: “Just go up in a ball.” Experts often have an intuitive understanding of a route, but they struggle to clearly express all the steps to take. Their brain dump is partially filled with garbage."},

{"no": 272, "school": "", "pref": "34", "type": "", "diff": "", "stem": "윗글의 전개 방식에 대한 설명으로 가장 적절한 것은?", "p": "34-272", "choices": ["흔한 말을 바로잡은 뒤 실험과 사례로 뒷받침한다", "두 교육 방법의 장단점을 차례대로 비교한다", "연구를 반박하며 통념이 옳았음을 밝혀낸다", "시간 순서에 따라 한 사람의 성장을 그려낸다"], "ans": 1, "exp": "'흔히 이렇게 말한다'를 '이렇게 말하는 게 더 정확하다'로 고친 뒤 실험과 다이빙 사례를 들었어요.\n📖 It’s often said that those who can’t do, teach. <b>It would be more accurate to say</b> that those who can do, can’t teach the basics.\n   흔히 하는 말을 고쳐서, 할 수 있는 사람이 기본기를 못 가르친다고 말하는 편이 더 정확하다.", "b": 1, "bb": "It’s often said that those who can’t do, teach. It would be more accurate to say that those who can do, can’t teach the basics. A great deal of expert knowledge is implicit, not explicit. The further you progress toward mastery, the less conscious awareness you often have of the fundamentals. Experiments show that skilled golfers and wine aficionados have a hard time describing their putting and tasting techniques—even asking them to explain their approaches is enough to interfere with their performance, so they often stay on autopilot. When I first saw an elite diver do four and a half somersaults, I asked how he managed to spin so fast. His answer: “Just go up in a ball.” Experts often have an intuitive understanding of a route, but they struggle to clearly express all the steps to take. Their brain dump is partially filled with garbage."},
{"no": 273, "school": "", "pref": "35", "type": "", "diff": "", "stem": "글에 따르면 최소 가공(minimal processing)의 이점은?", "p": "35-273", "choices": ["인공 향미료 없이 본래 맛을 지킬 수 있다", "소금을 더 넣어 맛을 살릴 수 있다", "곡물의 보관 기간을 크게 늘려 준다", "영양소를 고르게 바꿔 놓을 수 있다"], "ans": 1, "exp": "인공 향미료나 첨가물, 많은 소금 없이도 본래 풍미와 맛을 지킬 수 있다고 했어요.\n📖 Minimal processing can be one of the best ways to <b>keep original flavors and taste, without any need to add artificial flavoring or additives</b>, or too much salt.\n   최소 가공은 인공 향미료나 첨가물 없이 본래 풍미와 맛을 지키는 가장 좋은 방법 중 하나다.", "b": 1, "bb": "Minimal processing can be one of the best ways to keep original flavors and taste, without any need to add artificial flavoring or additives, or too much salt. This would also be the efficient way to keep most nutrients, especially the most sensitive ones such as many vitamins and anti‑oxidants. Milling of cereals is one of the most harsh processes which dramatically affect nutrient content. While grains are naturally very rich in micronutrients, anti‑oxidants and fiber (i.e. in wholemeal flour or flakes), milling usually removes the vast majority of minerals, vitamins and fibers to raise white flour. Such a spoilage of key nutrients and fiber is no longer acceptable in the context of a sustainable diet aiming at an optimal nutrient density and health protection. In contrast, fermentation of various foodstuffs or germination of grains are traditional, locally accessible, low‑energy and highly nutritious processes of sounded interest."},

{"no": 289, "school": "", "pref": "36", "type": "", "diff": "", "stem": "문제 해결 집단에 대한 연구 결과로 글이 소개한 것은?", "p": "36-289", "choices": ["가장 유능한 사람이 가장 호감을 받지는 않았다", "유능한 사람이 언제나 큰 호감을 받았다", "능력과 호감 사이에는 관계가 없었다", "아이디어가 적은 사람이 더 미움을 받았다"], "ans": 1, "exp": "가장 유능하고 좋은 아이디어를 내는 사람이 가장 호감을 받는 사람은 아닌 경향이 있었어요.\n📖 the participants who are considered the most competent and have the best ideas <b>tend not to be the ones who are best liked</b>\n   가장 유능하고 좋은 아이디어를 가진 참가자가 가장 호감을 받는 사람은 아닌 경향이 있다.", "b": 1, "bb": "It would seem obvious that the more competent someone is, the more we will like that person. By “competence,” I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc. We stand a better chance of doing well at our life tasks if we surround ourselves with people who know what they’re doing and have a lot to teach us. But the research evidence is paradoxical: In problem‑solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are best liked. Why? One possibility is that, although we like to be around competent people, those who are too competent make us uncomfortable. They may seem unapproachable, distant, superhuman—and make us look bad (and feel worse) by comparison. If this were true, we might like people more if they reveal some evidence of fallibility. For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up."},

{"no": 305, "school": "", "pref": "37", "type": "", "diff": "", "stem": "계산 알고리즘에 대해 글이 말하는 것은?", "p": "37-305", "choices": ["의미라는 개념을 담고 있지 않다", "입력에 가치를 매겨 판단한다", "자기 생존을 목적으로 삼는다", "주변 환경과 정보를 비교한다"], "ans": 1, "exp": "입력을 받아 출력을 내는 계산은 의미라는 개념을 담지 않는다고 했어요.\n📖 A computational algorithm that takes input data and generates some output from it <b>doesn’t really embody any notion of meaning</b>.\n   입력을 받아 출력을 만드는 계산 알고리즘은 의미라는 개념을 전혀 담고 있지 않다.", "b": 1, "bb": "A computational algorithm that takes input data and generates some output from it doesn’t really embody any notion of meaning. Certainly, such a computation does not generally have as its purpose its own survival and well‑being. It does not, in general, assign value to the inputs. Compare, for example, a computer algorithm with the waggle dance of the honeybee, by which means a foraging bee conveys to others in the hive information about the source of food (such as nectar) it has located. The “dance”—a series of stylized movements on the comb—shows the bees how far away the food is and in which direction. But this input does not simply program other bees to go out and look for it. Rather, they evaluate this information, comparing it with their own knowledge of the surroundings. Some bees might not bother to make the journey, considering it not worthwhile. The input, such as it is, is processed in the light of the organism’s own internal states and history; there is nothing prescriptive about its effects."},

{"no": 320, "school": "", "pref": "37", "type": "", "diff": "", "stem": "윗글의 전개 방식에 대한 설명으로 가장 적절한 것은?", "p": "37-320", "choices": ["꿀벌 실험을 소개하고 수치로 정리해 보여 준다", "두 학자의 주장을 차례로 소개하고 반박해 본다", "시간 순서대로 연구의 발전 과정을 서술해 준다", "알고리즘의 한계를 말한 뒤 꿀벌과 견주어 설명한다"], "ans": 4, "exp": "알고리즘이 의미를 담지 않는다는 말로 시작해, 꿀벌의 춤과 비교하며 차이를 설명해요.\n📖 Compare, for example, a computer algorithm <b>with the waggle dance of the honeybee</b>\n   예를 들어 컴퓨터 알고리즘을 꿀벌의 흔들기 춤과 비교해 보라.", "b": 1, "bb": "A computational algorithm that takes input data and generates some output from it doesn’t really embody any notion of meaning. Certainly, such a computation does not generally have as its purpose its own survival and well‑being. It does not, in general, assign value to the inputs. Compare, for example, a computer algorithm with the waggle dance of the honeybee, by which means a foraging bee conveys to others in the hive information about the source of food (such as nectar) it has located. The “dance”—a series of stylized movements on the comb—shows the bees how far away the food is and in which direction. But this input does not simply program other bees to go out and look for it. Rather, they evaluate this information, comparing it with their own knowledge of the surroundings. Some bees might not bother to make the journey, considering it not worthwhile. The input, such as it is, is processed in the light of the organism’s own internal states and history; there is nothing prescriptive about its effects."},
{"no": 321, "school": "", "pref": "38", "type": "", "diff": "", "stem": "글에 따르면 가시성(visibility)은 두 전염에 각각 어떻게 작용하는가?", "p": "38-321", "choices": ["행동 전염은 북돋우고 감염병은 억제한다", "행동 전염과 감염병을 모두 퍼뜨린다", "행동 전염은 막고 감염병은 퍼뜨린다", "행동 전염과 감염병을 모두 억제한다"], "ans": 1, "exp": "가시성이 행동 전염은 '촉진'하고 감염병 확산은 '억제'한다고 한 문장이 그대로 근거입니다.\n📖 visibility promotes behavioral contagion but <b>inhibits the spread of infectious diseases</b>\n   가시성은 행동 전염을 촉진하지만 감염병의 확산은 억제한다.", "b": 1, "bb": "There are deep similarities between viral contagion and behavioral contagion. For example, people in close or extended proximity to others infected by a virus are themselves more likely to become infected, just as people are more likely to drink excessively when they spend more time in the company of heavy drinkers. But there are also important differences between the two types of contagion. One is that visibility promotes behavioral contagion but inhibits the spread of infectious diseases. Solar panels that are visible from the street, for instance, are more likely to stimulate neighboring installations. In contrast, we try to avoid others who are visibly ill. Another important difference is that whereas viral contagion is almost always a bad thing, behavioral contagion is sometimes negative—as in the case of smoking—but sometimes positive, as in the case of solar installations."},

{"no": 337, "school": "", "pref": "39", "type": "", "diff": "", "stem": "동면하는 동물의 잠에 대해 글이 말하는 것은?", "p": "39-337", "choices": ["동면 중에도 매일 몇 시간은 따로 잠을 잔다", "동면에 들어가면 잠을 전혀 자지 않는다", "동면 자체가 깊은 잠과 완전히 같은 것이다", "동면이 끝난 뒤에야 비로소 잠을 잔다"], "ans": 1, "exp": "동면이라는 큰 무의식 '속에서' 매일 몇 시간의 보통 잠이 필요하다고 했습니다.\n📖 So a hibernating animal needs to get <b>a few hours of conventional sleep each day</b> within the larger unconsciousness.\n   동면하는 동물은 더 큰 무의식 속에서 매일 몇 시간의 보통 잠을 자야 한다.", "b": 1, "bb": "Sleep is clearly about more than just resting. One curious fact is that animals that are hibernating also have periods of sleep. It comes as a surprise to most of us, but hibernation and sleep are not the same thing at all, at least not from a neurological and metabolic perspective. Hibernating is more like being anesthetized: the subject is unconscious but not actually asleep. So a hibernating animal needs to get a few hours of conventional sleep each day within the larger unconsciousness. A further surprise to most of us is that bears, the most famous of wintry sleepers, don’t actually hibernate. Real hibernation involves profound unconsciousness and a dramatic fall in body temperature—often to around 32 degrees Fahrenheit. By this definition, bears don’t hibernate, because their body temperature stays near normal and they are easily awakened. Their winter sleeps are more accurately called a state of torpor."},

{"no": 353, "school": "", "pref": "40", "type": "", "diff": "", "stem": "유치원~2학년 아이들이 연구에서 보인 반응은?", "p": "40-353", "choices": ["다른 아이와 함께일 때 더 많이 도왔다", "혼자 있을 때 더 적극적으로 도왔다", "함께 있을 때 도움을 아예 멈췄다", "어느 상황에서도 돕지 않으려 했다"], "ans": 1, "exp": "어린 아이들은 혼자일 때보다 다른 아이와 함께 있을 때 더 잘 도왔다고 했습니다.\n📖 young children (kindergarten through second grade) were <b>more likely to help the child in distress when with another child than when alone</b>\n   어린 아이들은 혼자일 때보다 다른 아이와 함께일 때 곤경에 빠진 아이를 더 잘 도왔다.", "b": 1, "bb": "The concern about how we appear to others can be seen in children, though work by the psychologist Ervin Staub suggests that the effect may vary with age. In a study where children heard another child in distress, young children (kindergarten through second grade) were more likely to help the child in distress when with another child than when alone. But for older children—in fourth and sixth grade—the effect reversed: they were less likely to help a child in distress when they were with a peer than when they were alone. Staub suggested that younger children might feel more comfortable acting when they have the company of a peer, whereas older children might feel more concern about being judged by their peers and fear feeling embarrassed by overreacting. Staub noted that “older children seemed to discuss the distress sounds less and to react to them less openly than younger children.” In other words, the older children were deliberately putting on a poker face in front of their peers. The study suggests that, contrary to younger children, older children are less likely to help those in distress in the presence of others because they care more about how they are evaluated."},

{"no": 369, "school": "", "pref": "41-42", "type": "", "diff": "", "stem": "글에 따르면 권위에 질문하기가 어려워지는 출발점은?", "p": "41-42-369", "choices": ["부모가 세상을 정해 주는 어린 시절", "학교에 들어가 시험을 보는 시기", "친구 관계가 복잡해지는 사춘기", "직장에서 상사를 만나는 때"], "ans": 1, "exp": "어려움은 어린 시절, 부모가 '세상은 이런 것'이라고 알려 줄 때 시작된다고 했습니다.\n📖 The difficulties start <b>in childhood</b>, when parents—the first and most powerful authority figures—show children “the way things are.”\n   그 어려움은 부모가 아이에게 세상이 돌아가는 방식을 보여 주는 어린 시절에 시작된다.", "b": 1, "bb": "What makes questioning authority so hard? The difficulties start in childhood, when parents—the first and most powerful authority figures—show children “the way things are.” This is a necessary element of learning language and socialization, and certainly most things learned in early childhood are noncontroversial: the English alphabet starts with A and ends with Z, the numbers 1 through 10 come before the numbers 11 through 20, and so on. Children, however, will spontaneously question things that are quite obvious to adults and even to older kids. The word “why?” becomes a challenge, as in, “Why is the sky blue?” Answers such as “because it just is” or “because I say so” tell children that they must unquestioningly accept what authorities say “just because,” and children who persist in their questioning are likely to find themselves dismissed or yelled at for “bothering” adults with “meaningless” or “unimportant” questions. But these questions are in fact perfectly reasonable. Why is the sky blue? Many adults do not themselves know the answer. And who says the sky’s color needs to be called “blue,” anyway? How do we know that what one person calls “blue” is the same color that another calls “blue”? The scientific answers come from physics, but those are not the answers that children are seeking. They are trying to understand the world, and no matter how irritating the repeated questions may become to stressed and time‑pressed parents, it is important to take them seriously to encourage kids to question authority to think for themselves."},

eriously to encourage kids to question authority to think for themselves."},

{"no": 382, "school": "", "pref": "41-42", "type": "", "diff": "", "stem": "글쓴이가 아이의 반복된 질문을 진지하게 받아 주라고 말하는 이유는?", "p": "41-42-382", "choices": ["스스로 생각하는 힘을 키워 주려고", "물리학 지식을 미리 가르치려고", "부모의 권위를 더 세우려고", "질문 횟수를 줄이게 하려고"], "ans": 1, "exp": "마지막 문장에서 아이가 스스로 생각하도록 권위에 질문하게 하려고 그렇게 하라고 합니다.\n📖 no matter how irritating the repeated questions may become to stressed and time‑pressed parents, <b>it is important to take them seriously</b>\n   스트레스받고 시간에 쫓기는 부모에게 짜증스러워도 그 질문을 진지하게 받아 주는 것이 중요하다.", "b": 1, "bb": "What makes questioning authority so hard? The difficulties start in childhood, when parents—the first and most powerful authority figures—show children “the way things are.” This is a necessary element of learning language and socialization, and certainly most things learned in early childhood are noncontroversial: the English alphabet starts with A and ends with Z, the numbers 1 through 10 come before the numbers 11 through 20, and so on. Children, however, will spontaneously question things that are quite obvious to adults and even to older kids. The word “why?” becomes a challenge, as in, “Why is the sky blue?” Answers such as “because it just is” or “because I say so” tell children that they must unquestioningly accept what authorities say “just because,” and children who persist in their questioning are likely to find themselves dismissed or yelled at for “bothering” adults with “meaningless” or “unimportant” questions. But these questions are in fact perfectly reasonable. Why is the sky blue? Many adults do not themselves know the answer. And who says the sky’s color needs to be called “blue,” anyway? How do we know that what one person calls “blue” is the same color that another calls “blue”? The scientific answers come from physics, but those are not the answers that children are seeking. They are trying to understand the world, and no matter how irritating the repeated questions may become to stressed and time‑pressed parents, it is important to take them seriously to encourage kids to question authority to think for themselves."},

{"no": 385, "school": "", "pref": "43-45", "type": "", "diff": "", "stem": "글쓴이의 두 딸에 대해 글이 말하는 것은?", "p": "43-45-385", "choices": ["발달과 사회적 상호작용에 어려움이 없었다", "오빠를 대신해 선생님과 자주 상담했다", "오빠보다 발달이 훨씬 더 느렸다", "학교에서 친구를 사귀지 못해 힘들었다"], "ans": 1, "exp": "첫 문장에서 두 딸은 발달과 사회적 상호작용에 아무 어려움 없이 자랐다고 했어요. 어려움을 겪은 쪽은 아들 Benjamin입니다.\n📖 My two girls grew up <b>without challenges with respect to development and social interaction</b>.\n   내 두 딸은 발달과 사회적 상호작용에 어려움 없이 자랐다.", "b": 1, "bb": "My two girls grew up without challenges with respect to development and social interaction. My son Benjamin, however, was quite delayed. He struggled through his childhood, not fitting in with the other children and wondering what he was doing wrong at every turn. He was teased by the other children and frowned upon by a number of unsympathetic adults. But his Grade 1 teacher was a wonderful, caring person who took the time to ask why Benjamin behaved the way he did. The teacher was determined to understand Benjamin and to accept him as he was. One day he came home with a note from his teacher. He suggested I go to the school library. They were having a sale, and he thought my son would like one of the books. I couldn’t go for a couple of days and was concerned I’d missed the opportunity. When I finally went to the school, his teacher told me that the sale had ended but that the library had saved the book for my little boy. I suspected the teacher had paid for it out of his own pocket. It was a story‑board book with a place for a photo. On each page there was an outline of an animal and a hole so that the face in the photo appeared to be the face of the animal. Wondering if Benjamin would really be interested in the book, I brought it home. Through that book, he saw that he could be anything he wanted to be: a cat, an octopus, a dinosaur—even a frog! Benjamin joyfully embarked on an imaginative journey through the book, and little did we know, it laid the groundwork for his future successes. And thankfully, his teacher had taken the time to observe and understand him and had discovered a way to help him reach out of his own world and join ours through a story‑board book. My son later became a child actor and performed for seven years with a Toronto casting agency. He is now a published author who writes fantasy and science‑fiction! Who would have guessed?"},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/([①②③④⑤])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){

  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`

      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v2';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고2 24년 9월 지문 깊이 풀기 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고224년9월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>

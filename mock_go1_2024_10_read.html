:root{--pri:#6b4a2b;--acc:#b07a45;--bg:#f5efe6;--card:#fdf8f2;--bdr:#d9c9b3;--muted:#757575;--green:#2e7d32;--red:#c62828;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:#2a2a2a;}
.hidden{display:none!important;}

/* START */
#startScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.s-card{background:var(--card);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;width:100%;box-shadow:0 8px 32px rgba(107,74,43,.15);}
.s-card h1{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--pri);margin-bottom:6px;}
.s-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.info-item{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--pri);font-weight:700;}
.ni{width:100%;padding:11px 14px;border:2px solid var(--bdr);border-radius:12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:10px;}

.start-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}

/* PASSAGE SELECT */
#passageScreen{padding:20px;max-width:680px;margin:0 auto;}
.ps-header{background:linear-gradient(135deg,#f7efe4,#ece0d2);color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:18px 22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.ps-title{font-family:'Black Han Sans',sans-serif;font-size:16px;}
.ps-sub{font-size:11px;opacity:.8;margin-top:3px;}
.user-info{background:rgba(255,255,255,.7);color:#5c3d1e;border-radius:10px;padding:6px 14px;font-size:12px;font-weight:700;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}

.fb.on{background:var(--pri);color:white;}
.passage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:20px;}
.p-card{background:white;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:2.5px solid #e6dccd;transition:all .18s;position:relative;}
.p-card:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 6px 18px rgba(107,74,43,.12);}
.p-card.sel{border-color:var(--pri);background:#f3ebe0;}
.p-card.done{border-color:#4caf50;background:#e8f5e9;}
.p-no{font-family:'Black Han Sans',sans-serif;font-size:18px;color:var(--pri);margin-bottom:2px;}
.p-count{font-size:10px;color:var(--muted);}

.type-box{background:white;border-radius:12px;padding:12px 14px;margin-bottom:14px;border:2px solid #e6dccd;}
.type-row{display:flex;gap:6px;flex-wrap:wrap;}
.type-row .fb{padding:6px 12px;font-size:12.5px;}
.type-row .fb small{font-weight:400;opacity:.75;margin-left:3px;}
.p-card.off{opacity:.35;pointer-events:none;}
.cnt-box{background:white;border-radius:12px;padding:12px 14px;margin-bottom:10px;border:2px solid #e6dccd;}
.cnt-lbl{font-size:13px;font-weight:800;color:var(--pri);margin-bottom:8px;}
.cnt-lbl span{font-weight:400;color:var(--muted);font-size:12px;}
.cnt-row{display:flex;gap:8px;flex-wrap:wrap;}
.p-solved{font-size:10px;color:var(--muted);margin-top:2px;}
.fb-exp{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15);font-weight:400;color:#37474f;line-height:1.6;}
.q-prompt{white-space:pre-line;}
.passage-box .mk{color:#8a4b1c;}

.go-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}

/* QUIZ HEADER */

.ht{font-family:'Black Han Sans',sans-serif;font-size:15px;}
.hs{font-size:10px;opacity:.7;margin-top:2px;}
.hb{background:#fff;color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700;}
.pw{height:4px;background:#e6dccd;}.pf{height:100%;background:linear-gradient(90deg,#6b4a2b,#b07a45);transition:width .4s;}

/* QUIZ AREA */
#quizArea{padding:20px;max-width:720px;margin:0 auto;}
.qc{background:white;border-radius:18px;padding:22px 20px;margin-bottom:16px;box-shadow:0 3px 16px rgba(107,74,43,.08);}
.q-no-badge{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.qno{font-family:'Black Han Sans',sans-serif;font-size:13px;color:white;background:var(--pri);padding:3px 12px;border-radius:12px;}
.qtype{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:#f6e7d6;color:#9a5b2b;}
.qsrc{font-size:10px;color:var(--muted);margin-left:auto;}
.passage-tag{font-size:10px;font-weight:700;color:#6b4a2b;background:#f3ebe0;padding:2px 8px;border-radius:8px;}
.passage-box{background:#fbf7f1;border-left:4px solid var(--pri);border-radius:0 10px 10px 0;padding:14px 16px;font-size:13px;line-height:1.85;margin-bottom:14px;color:#3b2f25;white-space:pre-wrap;}
.q-prompt{font-size:13px;font-weight:700;color:#6b4a2b;margin-bottom:10px;padding:8px 12px;background:#f3ebe0;border-radius:8px;}
.choices{display:grid;gap:8px;}
.cb{background:#f7f1e8;border:2px solid #e6dccd;border-radius:11px;padding:12px 15px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:flex-start;gap:10px;line-height:1.5;}
.cb:hover:not(:disabled){border-color:var(--pri);background:#f3ebe0;}
.cb.correct{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;}
.cb.wrong{background:#ffebee;border-color:#c62828;color:#b71c1c;}
.cb.reveal{background:#e8f5e9;border-color:#2e7d32;}
.cn{width:24px;height:24px;border-radius:50%;background:#d9c9b3;color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.fb-msg{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:800;margin-top:10px;display:none;}
.fb-msg.ok{background:#e8f5e9;color:#1b5e20;display:block;}
.fb-msg.no{background:#ffebee;color:#b71c1c;display:block;}

/* RESULT */
#resultScreen{padding:20px;max-width:600px;margin:0 auto;}
.rc{background:white;border-radius:24px;padding:30px 22px;box-shadow:0 8px 32px rgba(107,74,43,.1);text-align:center;}
.rs{font-family:'Black Han Sans',sans-serif;font-size:52px;color:var(--pri);line-height:1;}
.rsub{font-size:13px;color:var(--muted);margin-top:4px;}
.sr{display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap;}
.si{text-align:center;}.sn{font-family:'Black Han Sans',sans-serif;font-size:24px;}.sl{font-size:11px;color:var(--muted);margin-top:2px;}
.wl{background:var(--bg);border-radius:14px;padding:14px;text-align:left;margin-top:14px;max-height:300px;overflow-y:auto;}
.wl h3{font-size:12px;font-weight:800;color:var(--red);margin-bottom:8px;}
.wi{background:white;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:11px;border-left:3px solid #e91e63;}
.wie{font-weight:800;color:var(--pri);}.wid{font-size:10px;color:var(--muted);margin-top:2px;}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.rbtn{padding:12px 24px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.rbtn-p{background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;}
.rbtn-s{background:#f7f1e8;color:#6b4a2b;border:2px solid #d9c9b3;}

@media(max-width:480px){.passage-grid{grid-template-columns:repeat(3,1fr)}}
body{font-family:'Noto Sans KR',sans-serif;}
.s-sub,.ps-sub,.cnt-lbl span{font-family:'Gowun Dodum','Noto Sans KR',sans-serif;}
.p-card{background:#fdf8f2;}
.p-card.sel{background:#f0e6d8;}
</style>

{"no": 33, "school": "", "pref": "20", "type": "", "diff": "", "stem": "많은 사람이 운동 시간을 내기 어려운 까닭으로 글이 든 것은?", "p": "20-33", "choices": ["운동하는 방법을 제대로 몰라서", "집 근처에 운동 시설이 없어서", "일과 가족 일로 일정이 꽉 차서", "운동 비용이 너무 많이 들어서"], "ans": 3, "exp": "일과 가족에 대한 의무 사이에서 일정이 빽빽해 운동할 틈이 없다고 느낀다고 했어요.\n📖 <b>Between work commitments and family obligations</b>, it often feels like there’s no room in our packed schedules for a dedicated workout.\n   일과 가족에 대한 의무 사이에서 빽빽한 일정에 운동할 여유가 없게 느껴진다", "b": 1, "bb": "For many of us, making time for exercise is a continuing challenge. Between work commitments and family obligations, it often feels like there’s no room in our packed schedules for a dedicated workout. But what if the workout came to you, right in the midst of your daily routine? That’s where the beauty of integrating mini-exercises into household chores comes into play. Let’s be realistic; chores are inevitable. Whether it’s washing dishes or taking out the trash, these tasks are an essential part of daily life. But rather than viewing chores as purely obligatory activities, why not seize these moments as opportunities for physical activity? For instance, practice squats or engage in some wall push-ups as you wait for your morning kettle to boil. Incorporating quick exercises into your daily chores can improve your health."},

{"no": 49, "school": "", "pref": "21", "type": "", "diff": "", "stem": "기억에 대해 글이 말하는 것은?", "p": "21-49", "choices": ["녹화된 영상을 그대로 꺼내 본다", "한 번 저장되면 전혀 바뀌지 않는다", "교육을 받을수록 더 정확해진다", "꺼내 보는 것이 아니라 다시 짓는다"], "ans": 4, "exp": "우리는 기억 속 영상을 꺼내 오는 것이 아니라 기억을 '재구성한다'고 했어요.\n📖 <b>We reconstruct memories rather than retrieving the video from memory.</b>\n   우리는 기억에서 영상을 꺼내 오는 것이 아니라 기억을 재구성한다", "b": 1, "bb": "When we see something, we naturally and automatically break it up into shapes, colors, and concepts that we have learned through education. We recode what we see through the lens of everything we know. We reconstruct memories rather than retrieving the video from memory. This is a useful trait. It’s a more efficient way to store information — a bit like an optimal image compression algorithm such as JPG, rather than storing a raw bitmap image file. People who lack this ability and remember everything in perfect detail struggle to generalize, learn, and make connections between what they have learned. But representing the world as abstract ideas and features comes at a cost of seeing the world as it is. Instead, we see the world through our assumptions, motivations, and past experiences. The discovery that our memories are reconstructed through abstract representations rather than played back like a movie completely undermined the legal primacy of eyewitness testimony. Seeing is not believing."},

{"no": 65, "school": "", "pref": "22", "type": "", "diff": "", "stem": "던닝의 실험에서, 얼굴 특징을 꼼꼼히 따지고 선택 절차를 자세히 논의하는 목격자에 대해 글이 말하는 것은?", "p": "22-65", "choices": ["지목이 대체로 정확하다", "지목이 틀렸을 가능성이 높다", "기억을 더 오래 유지한다", "선택 절차를 잘 이해한다"], "ans": 2, "exp": "첫 문장에서 꼼꼼한 숙고와 자세한 논의가 오히려 '부정확한 지목의 신호'가 될 수 있다는 증거를 찾았다고 했어요.\n📖 a careful deliberation of facial features and a detailed discussion of selection procedures can actually be <b>a sign of an inaccurate identification</b>\n   얼굴 특징을 꼼꼼히 따지고 선택 절차를 자세히 논의하는 것은 실은 부정확한 지목의 신호일 수 있다.", "b": 1, "bb": "In his Cornell laboratory, David Dunning conducted experimental tests of eyewitness testimony and found evidence that a careful deliberation of facial features and a detailed discussion of selection procedures can actually be a sign of an inaccurate identification. It’s when people find themselves unable to explain why they recognize the person, saying things like “his face just popped out at me,” that they tend to be accurate more often. Sometimes our first, immediate, automatic reaction to a situation is the truest interpretation of what our mind is telling us. That very first impression can also be more accurate about the world than the deliberative, reasoned self-narrative can be. In his book Blink, Malcolm Gladwell describes a variety of studies in psychology and behavioral economics that demonstrate the superior performance of relatively unconscious first guesses compared to logical step-by-step justifications for a decision."},

{"no": 80, "school": "", "pref": "22", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "22-80", "choices": ["실험 결과를 들고 책 연구로 뒷받침한다", "두 학자의 주장을 차례로 반박한다", "역사적 사건을 시간 순서로 나열한다", "용어를 정의하고 반대 사례를 든다"], "ans": 1, "exp": "던닝의 목격자 실험 결과를 먼저 소개하고, 마지막에 글래드웰의 책에 실린 연구들로 그 주장을 뒷받침합니다.\n📖 <b>In his book Blink, Malcolm Gladwell describes a variety of studies</b> in psychology and behavioral economics\n   글래드웰은 자신의 책 블링크에서 여러 연구를 소개한다.", "b": 1, "bb": "In his Cornell laboratory, David Dunning conducted experimental tests of eyewitness testimony and found evidence that a careful deliberation of facial features and a detailed discussion of selection procedures can actually be a sign of an inaccurate identification. It’s when people find themselves unable to explain why they recognize the person, saying things like “his face just popped out at me,” that they tend to be accurate more often. Sometimes our first, immediate, automatic reaction to a situation is the truest interpretation of what our mind is telling us. That very first impression can also be more accurate about the world than the deliberative, reasoned self-narrative can be. In his book Blink, Malcolm Gladwell describes a variety of studies in psychology and behavioral economics that demonstrate the superior performance of relatively unconscious first guesses compared to logical step-by-step justifications for a decision."},
{"no": 81, "school": "", "pref": "23", "type": "", "diff": "", "stem": "행복 연구의 측정 예로 글이 든 것은?", "p": "23-81", "choices": ["상호작용 중 웃은 횟수", "하루 수면 시간의 길이", "친구와 만난 날의 수", "소득이 늘어난 비율"], "ans": 1, "exp": "행복 연구는 상호작용 동안 누군가가 웃는 횟수를 셀 수 있다고 했어요.\n📖 A study of happiness might measure <b>the number of times someone smiles during an interaction</b>\n   행복 연구는 상호작용 중에 어떤 사람이 웃는 횟수를 측정할 수 있다.", "b": 1, "bb": "Many forms of research lead naturally to quantitative data. A study of happiness might measure the number of times someone smiles during an interaction, and a study of memory might measure the number of items an individual can recall after one, five, and ten minutes. Asking people how many times in a year they are sad will also yield quantitative data, but it might not be reliable. Respondents’ recollections may be inaccurate, and their definitions of ‘sad’ could vary widely. But asking “How many times in the past year were you sad enough to call in sick to work?” prompts a concrete answer. Similarly, instead of asking people to rate how bad a procrastinator they are, ask, “How many of your utility bills are you currently late in paying, even though you can afford to pay them?” Questions that seek concrete responses help make abstract concepts clearer and ensure consistency from one study to the next."},

{"no": 97, "school": "", "pref": "24", "type": "", "diff": "", "stem": "글에서 말하는 '싱귤래리티(singularity)'는 무엇인가?", "p": "24-97", "choices": ["AI가 인간 지능을 넘어서는 지점", "AI가 처음 발명된 시점", "AI가 인간에게 복종하는 단계", "AI 연구가 중단되는 시기"], "ans": 1, "exp": "두 번째 문장에서 AI가 인간 지능을 넘어서는 그 지점을 가리킨다고 했어요.\n📖 Singularity refers to <b>the point at which AI exceeds human intelligence</b>\n   싱귤래리티는 AI가 인간의 지능을 넘어서는 지점을 가리킨다.", "b": 1, "bb": "The evolution of AI is often associated with the concept of singularity. Singularity refers to the point at which AI exceeds human intelligence. After that point, it is predicted that AI will repeatedly improve itself and evolve at an accelerated pace. When AI becomes self-aware and pursues its own goals, it will be a conscious being, not just a machine. AI and human consciousness will then begin to evolve together. Our consciousness will evolve to new dimensions through our interactions with AI, which will provide us with intellectual stimulation and inspire new insights and creativity. Conversely, our consciousness also has a significant impact on the evolution of AI. The direction of AI’s evolution will depend greatly on what values and ethics we incorporate into AI. We need to see our relationship with AI as a mutual coexistence of conscious beings, recognizing its rights and supporting the evolution of its consciousness."},

{"no": 145, "school": "", "pref": "30", "type": "", "diff": "", "stem": "Herbert Simon이 노벨상을 받은 이유로 글이 말한 것은?", "p": "30-145", "choices": ["인간의 정보·시간·인지 능력의 한계를 밝혀서", "컴퓨터의 계산 속도를 크게 끌어올려서", "사회적 학습을 처음으로 금지했기 때문에", "인간의 기억력이 무한함을 증명해서"], "ans": 1, "exp": "첫 문장 그대로입니다. 정보·시간·인지 능력에서 우리가 지닌 한계를 알아본 공로로 상을 받았다고 했어요.\n📖 Herbert Simon won his Nobel Prize for <b>recognizing our limitations in information, time, and cognitive capacity</b>.\n   허버트 사이먼은 정보·시간·인지 능력에서 우리의 한계를 인식한 공로로 노벨상을 받았다.", "b": 1, "bb": "Herbert Simon won his Nobel Prize for recognizing our limitations in information, time, and cognitive capacity. As we lack the resources to compute answers independently, we distribute the computation across the population and solve the answer slowly, generation by generation. Then all we have to do is socially learn the right answers. You don’t need to understand how your computer or toilet works; you just need to be able to use the interface and flush. All that needs to be transmitted is which button to push — essentially how to interact with technologies rather than how they work. And so instead of holding more information than we have mental capacity for and indeed need to know, we could dedicate our large brains to a small piece of a giant calculation. We understand things well enough to benefit from them, but all the while we are making small calculations that contribute to a larger whole. We are just doing our part in a larger computation for our societies’ collective brains."},

{"no": 161, "school": "", "pref": "31", "type": "", "diff": "", "stem": "대부분의 문어가 지닌 최선의 방어 수단으로 글이 말한 것은?", "p": "31-161", "choices": ["가능한 한 숨어 있고 밤에 사냥하기", "낮에 떼를 지어 함께 헤엄치기", "먹물을 뿜어 적을 놀라게 하기", "단단한 껍데기 속에 들어가기"], "ans": 1, "exp": "첫 문장에서 최선의 방어는 될 수 있는 대로 숨어 있고 사냥은 밤에 하는 것이라고 했어요.\n📖 The best defence most species of octopus have is to <b>stay hidden as much as possible and do their own hunting at night</b>.\n   대부분의 문어 종이 가진 최선의 방어는 가능한 한 숨어 있고 사냥은 밤에 하는 것이다.", "b": 1, "bb": "The best defence most species of octopus have is to stay hidden as much as possible and do their own hunting at night. So to find one in full view in the shallows in daylight was a surprise for two Australian underwater photographers. Actually, what they saw at first was a flounder. It was only when they looked again that they saw a medium-sized octopus, with all eight of its arms folded and its two eyes staring upwards to create the illusion. An octopus has a big brain, excellent eyesight and the ability to change colour and pattern, and this one was using these assets to turn itself into a completely different creature. Many more of this species have been found since then, and there are now photographs of octopuses that could be said to be transforming into sea snakes. And while they mimic, they hunt — producing the spectacle of, say, a flounder suddenly developing an octopodian arm, sticking it down a hole and grabbing whatever’s hiding there."},

{"no": 209, "school": "", "pref": "34", "type": "", "diff": "", "stem": "글에 따르면 기후 변화를 '소재로' 삼은 이야기를 할 수 있는 때는?", "p": "34-209", "choices": ["기후 재난이 화면에서 사라지고 난 뒤에", "기후 변화가 아직 삶의 주변 일로 보일 때", "기후 변화가 모두의 일상이 되어 버릴 때", "기온이 삼사 도 더 올라가 버린 다음에"], "ans": 2, "exp": "기후 변화가 아직 인간 삶의 변두리 문제처럼 보이는 동안에만 그것을 '소재로' 이야기할 수 있다고 했어요.\n📖 You can tell stories ‘about’ climate change while it still seems <b>a marginal feature of human life</b>\n   기후 변화가 아직 인간 삶의 주변적인 특징처럼 보이는 동안에는 그것에 '관한' 이야기를 할 수 있다.", "b": 1, "bb": "On-screen, climate disaster is everywhere you look, but the scope of the world’s climate transformation may just as quickly eliminate the climate-fiction genre — indeed eliminate any effort to tell the story of warming, which could grow too large and too obvious even for Hollywood. You can tell stories ‘about’ climate change while it still seems a marginal feature of human life. But when the temperature rises by three or four more degrees, hardly anyone will be able to feel isolated from its impacts. And so as climate change expands across the horizon, it may cease to be a story. Why watch or read climate fiction about the world you can see plainly out your own window? At the moment, stories illustrating global warming can still offer an escapist pleasure, even if that pleasure often comes in the form of horror. But when we can no longer pretend that climate suffering is distant — in time or in place — we will stop pretending about it and start pretending within it."},

{"no": 241, "school": "", "pref": "36", "type": "", "diff": "", "stem": "글에 따르면 개인이 잘 살아갈 수 있는지는 무엇에 달려 있었는가?", "p": "36-241", "choices": ["혼자서 먹을 것을 얼마나 많이 모으는지에 달렸다", "몸이 얼마나 튼튼하고 힘이 센지에 달려 있었다", "새로운 땅을 얼마나 멀리 찾아가는지에 달렸다", "집단 안의 관계를 얼마나 잘 다루는지에 달렸다"], "ans": 4, "exp": "첫 문장에서 개인으로서 잘 살아갈 능력은 집단 안의 관계를 얼마나 잘 헤쳐 나가는지에 달렸다고 했어요.\n📖 our ability to thrive depended on <b>how well we navigated relationships in a group</b>\n   잘 살아갈 수 있는 우리 능력은 집단 안의 관계를 얼마나 잘 헤쳐 나가는지에 달려 있었다.", "b": 1, "bb": "As individuals, our ability to thrive depended on how well we navigated relationships in a group. If the group valued us, we could count on support, resources, and probably a mate. If it didn’t, we might get none of these merits. It was a matter of survival, physically and genetically. Over millions of years, the pressure selected for people who are sensitive to and skilled at maximizing their standing. The result was the development of a tendency to unconsciously monitor how other people in our community perceive us. We process that information in the form of self-esteem and such related emotions as pride, shame, or insecurity. These emotions compel us to do more of what makes our community value us and less of what doesn’t. And, crucially, they are meant to make that motivation feel like it is coming from within. If we realized, on a conscious level, that we were responding to social pressure, our performance might come off as grudging or cynical, making it less persuasive."},

{"no": 256, "school": "", "pref": "36", "type": "", "diff": "", "stem": "윗글의 전개 방식에 대한 설명으로 가장 적절한 것은?", "p": "36-256", "choices": ["실험 과정을 단계별로 소개하고 결과를 밝힌다", "진화의 압력에서 시작해 오늘의 감정을 설명한다", "서로 반대되는 두 이론을 차례로 비판하며 고른다", "한 사람의 사례를 길게 들어 주장을 뒷받침한다"], "ans": 2, "exp": "옛 집단 생활에서 받은 생존 압력에서 출발해, 그 결과로 지금의 자존감과 감정이 생겼다는 순서로 풀어 가요.\n📖 <b>Over millions of years, the pressure selected for people</b> who are sensitive to and skilled at maximizing their standing\n   수백만 년에 걸쳐 그 압력은 자기 지위를 최대로 높이는 데 민감하고 능숙한 사람들을 선택했다.", "b": 1, "bb": "As individuals, our ability to thrive depended on how well we navigated relationships in a group. If the group valued us, we could count on support, resources, and probably a mate. If it didn’t, we might get none of these merits. It was a matter of survival, physically and genetically. Over millions of years, the pressure selected for people who are sensitive to and skilled at maximizing their standing. The result was the development of a tendency to unconsciously monitor how other people in our community perceive us. We process that information in the form of self-esteem and such related emotions as pride, shame, or insecurity. These emotions compel us to do more of what makes our community value us and less of what doesn’t. And, crucially, they are meant to make that motivation feel like it is coming from within. If we realized, on a conscious level, that we were responding to social pressure, our performance might come off as grudging or cynical, making it less persuasive."},
{"no": 257, "school": "", "pref": "37", "type": "", "diff": "", "stem": "기존(conventional) 의학이 오랫동안 믿어 온 우울증의 원인은?", "p": "37-257", "choices": ["뇌 신경전달물질의 불균형", "의식의 왜곡과 자아 상실", "삶의 의미를 잃은 상태", "뇌라는 기관 자체의 손상"], "ans": 1, "exp": "첫 문장에 바로 나옵니다. 전통 의학은 우울증이 뇌 신경전달물질의 불균형 때문에 생긴다고 오래 믿어 왔다고 했어요.\n📖 Conventional medicine has long believed that depression is caused by <b>an imbalance of neurotransmitters in the brain</b>\n   기존 의학은 우울증이 뇌 신경전달물질의 불균형 때문에 생긴다고 오랫동안 믿어 왔다", "b": 1, "bb": "Conventional medicine has long believed that depression is caused by an imbalance of neurotransmitters in the brain. However, there is a major problem with this explanation. This is because the imbalance of substances in the brain is a consequence of depression, not its cause. In other words, depression causes a decrease in brain substances such as serotonin and noradrenaline, not a decrease in brain substances causes depression. In this revised cause-and-effect, the key is to reframe depression as a problem of consciousness. Our consciousness is a more fundamental entity that goes beyond the functioning of the brain. The brain is no more than an organ of consciousness. If it is not consciousness itself, then the root cause of depression is also a distortion of our state of consciousness: a consciousness that has lost its sense of self and the meaning of life. Such a disease of consciousness may manifest itself in the form of depression."},

{"no": 273, "school": "", "pref": "38", "type": "", "diff": "", "stem": "사회에 떠도는 인간 본성에 대한 흔한 설명을 글은 어떻게 평가하는가?", "p": "38-273", "choices": ["짐작과 이야기, 허튼소리의 혼합이다", "오랜 관찰로 검증된 지식이다", "심리학과 사실상 같은 것이다", "깊은 사상가들의 결론이다"], "ans": 1, "exp": "첫 문장에서 그런 설명들은 대체로 가정과 이야기, 때로는 그저 어리석은 소리가 섞인 것이라고 했어요.\n📖 The common accounts of human nature that float around in society are generally <b>a mixture of assumptions, tales and sometimes plain silliness</b>\n   사회에 떠도는 인간 본성에 대한 흔한 설명은 대체로 가정과 이야기, 때로는 그저 허튼소리가 섞인 것이다", "b": 1, "bb": "The common accounts of human nature that float around in society are generally a mixture of assumptions, tales and sometimes plain silliness. However, psychology is different. It is the branch of science that is devoted to understanding people: how and why we act as we do; why we see things as we do; and how we interact with one another. The key word here is ‘science.’ Psychologists don’t depend on opinions and hearsay, or the generally accepted views of society at the time, or even the considered opinions of deep thinkers. Instead, they look for evidence, to make sure that psychological ideas are firmly based, and not just derived from generally held beliefs or assumptions. In addition to this evidence-based approach, psychology deals with fundamental processes and principles that generate our rich cultural and social diversity, as well as those shared by all human beings. These are what modern psychology is all about."},

{"no": 289, "school": "", "pref": "39", "type": "", "diff": "", "stem": "물리학자들이 생명을 '고차원 시스템'이라 부르는 까닭으로 글이 든 것은?", "p": "39-289", "choices": ["한꺼번에 아주 많은 일이 벌어져서", "생명이 눈에 보이지 않아서", "생명이 수학 공식으로 딱 떨어져서", "생명이 늘 똑같이 유지돼서"], "ans": 1, "exp": "'high-dimensional system'은 결국 '일이 아주 많이 벌어진다'는 말을 멋지게 표현한 것이라고 했어요.\n📖 which is their fancy way of saying that <b>there’s a lot going on</b>\n   그것은 '일이 아주 많이 벌어진다'는 말을 멋지게 표현한 방식이다", "b": 1, "bb": "Life is what physicists might call a ‘high-dimensional system,’ which is their fancy way of saying that there’s a lot going on. In just a single cell, the number of possible interactions between different molecules is enormous. Such a system can only hope to be stable if only a smaller number of collective ways of being may emerge. For example, it is only a limited number of tissues and body shapes that may result from the development of a human embryo. In 1942, the biologist Conrad Waddington called this drastic narrowing of outcomes canalization. The organism may switch between a small number of well-defined possible states, but can’t exist in random states in between them, rather as a ball in a rough landscape must roll to the bottom of one valley or another. We’ll see that this is true also of health and disease: there are many causes of illness, but their manifestations at the physiological and symptomatic levels are often strikingly similar."},

{"no": 304, "school": "", "pref": "39", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "39-304", "choices": ["서로 반대인 두 이론을 끝까지 겨룬다", "개념을 예시로 설명한 뒤 질병에 적용한다", "실험 결과를 수치로 자세히 제시한다", "학자의 생애를 시간 순서로 소개한다"], "ans": 2, "exp": "고차원 시스템 개념 → 배아 예시와 운하화라는 이름 → 공 비유 → 건강과 질병으로의 적용 순서로 이어집니다.\n📖 We’ll see that <b>this is true also of health and disease</b>\n   이것이 건강과 질병에도 똑같이 적용된다는 것을 보게 될 것이다", "b": 1, "bb": "Life is what physicists might call a ‘high-dimensional system,’ which is their fancy way of saying that there’s a lot going on. In just a single cell, the number of possible interactions between different molecules is enormous. Such a system can only hope to be stable if only a smaller number of collective ways of being may emerge. For example, it is only a limited number of tissues and body shapes that may result from the development of a human embryo. In 1942, the biologist Conrad Waddington called this drastic narrowing of outcomes canalization. The organism may switch between a small number of well-defined possible states, but can’t exist in random states in between them, rather as a ball in a rough landscape must roll to the bottom of one valley or another. We’ll see that this is true also of health and disease: there are many causes of illness, but their manifestations at the physiological and symptomatic levels are often strikingly similar."},
{"no": 305, "school": "", "pref": "40", "type": "", "diff": "", "stem": "Bilbao가 말한 'trick-punishment'에 해당하는 것으로 글이 든 것은?", "p": "40-305", "choices": ["야단, 화내는 순간, 전형적인 벌", "칭찬, 보상, 따뜻한 격려", "무관심, 침묵, 외면하기", "설명, 대화, 규칙 정하기"], "ans": 1, "exp": "trick-punishment는 꾸짖음, 화를 내는 순간, 가장 전형적인 의미의 벌이라고 정의했어요.\n📖 A trick-punishment is <b>a scolding, a moment of anger or a punishment</b> in the most classic sense of the word\n   trick-punishment란 꾸짖음, 화를 내는 순간, 또는 가장 전형적인 의미의 벌이다", "b": 1, "bb": "Punishing a child may not be effective due to what Alvaro Bilbao, a neuropsychologist, calls ‘trick-punishments.’ A trick-punishment is a scolding, a moment of anger or a punishment in the most classic sense of the word. Instead of discouraging the child from doing something, it encourages them to do it. For example, Hugh learns that when he hits his little brother, his mother scolds him. For a child who feels lonely, being scolded is much better than feeling invisible, so he will continue to hit his brother. In this case, his mother would be better adopting a different strategy. For instance, she could congratulate Hugh when he has not hit his brother for a certain length of time. The mother clearly cannot allow the child to hit his little brother, but instead of constantly pointing out the negatives, she can choose to reward the positives. In this way, any parent can avoid trick-punishments."},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}

  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`

      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>

        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v2';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 24년 10월 지문 깊이 풀기 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고124년10월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>

:root{

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.6}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(80,60,30,.05)}

.btn{border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:700;background:var(--pri);color:#fff;transition:transform .1s,opacity .15s}

.btn.sub{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.warn{background:var(--red)}
.btn.full{width:100%}
.muted{color:var(--soft);font-size:13px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 10px;background:var(--priBg);color:var(--pri)}

/* 시작 */
#startScreen .card{max-width:440px;margin:40px auto;text-align:center}
#startScreen h1{font-size:24px;color:var(--pri);margin-bottom:4px}
.inp{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;margin-bottom:10px;outline:none;background:#fff}
.inp:focus{border-color:var(--pri)}
.flow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0 20px}
.flow span{background:var(--priBg);color:var(--pri);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700}

/* 헤더 */
.top{position:sticky;top:0;z-index:20;background:rgba(245,239,230,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top .back{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.top .ttl{font-weight:900;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:12px;color:var(--soft);white-space:nowrap}
.steps{max-width:720px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px}
.steps div{flex:1;text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-radius:10px;background:#fff;color:#b8b0a5;border:1px solid var(--line)}
.steps div.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.steps div.done{background:var(--priBg);color:var(--pri);border-color:var(--priBg)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 12px;text-align:left;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--pri);transform:translateY(-2px)}
.pcard .no{font-family:'Black Han Sans',sans-serif;font-size:28px;color:var(--pri);line-height:1}
.pcard .kd{font-size:12px;color:var(--acc);font-weight:700;margin:4px 0 2px}
.pcard .tt{font-size:13px;font-weight:700;color:var(--ink);min-height:40px}
.pcard .pr{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.pcard .pr i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:8px;background:#f0ebe3;color:#b8b0a5;font-weight:700}
.pcard .pr i.ok{background:var(--greenBg);color:var(--green)}
.pcard.done{border-color:var(--pri2);background:#fbfdf9}

.wbox{text-align:center;padding:28px 18px}
.wen{font-size:30px;font-weight:900;letter-spacing:.3px;word-break:break-word}
.wcount{font-size:13px;color:var(--soft);margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.opt .n{font-weight:900;color:var(--pri);flex:none}

.opt.right{border-color:var(--green);background:var(--greenBg)}
.opt.wrong{border-color:var(--red);background:var(--redBg)}
.opt:disabled{cursor:default}
.tip{margin-top:14px;background:var(--accBg);border-radius:12px;padding:10px 14px;font-size:13.5px;text-align:left;color:#7a4a1a}
.say{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:15px;vertical-align:middle;flex:none;background:#fff}
.bar{height:6px;background:#ebe4d8;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri2);width:0;transition:width .3s}

.sent .en{font-size:16.5px;font-weight:500;line-height:1.65;flex:1}
.kw{border-bottom:2px solid #e3c79f;cursor:pointer;font-weight:700}
.sent .ko{margin:8px 0 0 36px;font-size:15px;color:#3f5a37;background:var(--priBg);border-radius:10px;padding:8px 12px;line-height:1.6}

.sent.ok .chk{border-color:var(--green);background:var(--greenBg);color:var(--green)}
.topic{background:linear-gradient(135deg,#4a6741,#6b8f60);color:#fff;border-radius:18px;padding:18px 20px;margin:16px 0}
.topic .lb{font-size:12px;font-weight:700;opacity:.85;margin-bottom:4px}
.topic .tx{font-size:16px;font-weight:700;line-height:1.55}

.qstem{font-size:16px;font-weight:700;line-height:1.55}

.rs button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink)}

.linkbtn{background:none;border:none;color:var(--blue);font-weight:700;font-size:13.5px;padding:4px 0;text-decoration:underline}

.big{font-family:'Black Han Sans',sans-serif;font-size:54px;color:var(--pri);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stats div{background:var(--priBg);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--pri)}

  .sent .en{font-size:16px}

  try{

}
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[–—]/g,'-').replace(/[^a-z0-9]/g,'');}
function fixWhy(why,order){
  // 선택지를 섞은 문제: 해설 속 ①~⑤ 번호를 학생 화면 번호로 바꾸고, '📌 해석' 목록은 번호순으로 다시 정렬
  if(!order || order.every((k,j)=>k===j)) return why;
  let w=String(why).replace(/[①②③④⑤]/g,c=>CIRC[order.indexOf(CIRC.indexOf(c))]);
  const at=w.indexOf('📌 해석:');
  if(at>=0){
    const head=w.slice(0,at+'📌 해석:'.length), tail=w.slice(at+'📌 해석:'.length);
    const items=tail.match(/[①②③④⑤][^①②③④⑤]*/g);
    if(items) w=head+' '+items.map(x=>x.trim()).sort((x,y)=>CIRC.indexOf(x[0])-CIRC.indexOf(y[0])).join(' ');
  }
  return w;
}

    wrongWords:S.wrongWords,wordFirst:S.wordFirst,notes:S.notes,results:S.results,
    wq:S.wq,wTotal:S.wTotal,wDone:S.wDone,wOk:S.wOk,
    readOk:S.readOk,cover:S.cover,
    round:S.round,qq:S.qq,qPos:S.qPos,firstOk:S.firstOk,roundWrong:S.roundWrong,nextQ:S.nextQ});
}
function clearS(pid){ try{localStorage.removeItem(stateKey(pid));}catch(e){} }
function agoText(t){
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return '방금 전';
  if(m<60) return m+'분 전';
  const h=Math.round(m/60); if(h<24) return h+'시간 전';
  return Math.round(h/24)+'일 전';
}

/* ═════════ 시작 ═════════ */
function init(){
  document.title='봄날 퀴즈 | '+EXAM.title;
  $('#stTitle').textContent=EXAM.title;
  $('#stSub').textContent=EXAM.sub;
  const n=lsRaw('bn_name'), sc=lsRaw('bn_school');
  if(n){USER={name:n,school:sc||'미입력'};enter();}
  else $('#startScreen').classList.remove('hidden');
}
function startApp(){
  const n=$('#nameInput').value.trim(), sc=$('#schoolInput').value;
  if(!n) return toast('이름을 입력하세요');
  if(!sc) return toast('학교를 선택하세요');
  USER={name:n,school:sc};
  try{localStorage.setItem('bn_name',n);localStorage.setItem('bn_school',sc);}catch(e){}
  $('#startScreen').classList.add('hidden');
  enter();
}
function enter(){
  $('#topBar').classList.remove('hidden');
  $('#who').textContent='👤 '+USER.name;
  goHome();
}
function setSteps(cur){
  const order=['word','read','quiz'];
  const ci=order.indexOf(cur);
  $('#steps').classList.toggle('hidden',ci<0);
  document.querySelectorAll('#steps div').forEach((d,i)=>{
    d.className=i===ci?'on':(i<ci?'done':'');
  });
}

/* ═════════ 지문 선택 ═════════ */
function goHome(){
  if(S.dirty) saveS();          // 하던 데까지 저장 (다시 들어오면 이어서)
  S={};P=null;
  $('#backBtn').classList.add('hidden');
  $('#topTitle').textContent=EXAM.title;
  setSteps('');
  const prog=lsGet(progKey(),{});
  let h=`<div class="card" style="text-align:center">
    <div class="bh" style="font-size:20px;color:var(--pri)">어떤 지문을 공부할까요?</div>
    <p class="muted" style="margin-top:4px">한 지문씩 <b>단어 → 한 줄 해석 → 문제</b> 순서로 완전정복! 틀리면 오답노트를 써야 넘어갈 수 있어요.</p>
  </div><div class="pgrid">`;
  PASSAGES.forEach(p=>{
    const g=prog[p.id]||{};
    const done=g.quiz;
    const sv=lsGet(stateKey(p.id),null);
    h+=`<button class="pcard${done?' done':''}" onclick="openPassage('${p.id}')">
      <div class="no">${p.id}번</div>
      <div class="kd">${esc(p.kind)}</div>
      <div class="tt">${esc(p.title)}</div>
      <div class="pr"><i class="${g.word?'ok':''}">단어</i><i class="${g.read?'ok':''}">해석</i><i class="${g.quiz?'ok':''}">${g.quiz?'문제 '+g.score+'점':'문제'}</i></div>
      ${sv&&sv.stage?`<div class="pr"><i style="background:#fbf0e3;color:#a3641f">▶ 이어하기</i></div>`:''}
    </button>`;
  });
  h+='</div>';
  $('#main').innerHTML=h;
  toTop();
}
function markProg(key,val){
  const prog=lsGet(progKey(),{});
  prog[P.id]=Object.assign(prog[P.id]||{},{[key]:val===undefined?true:val});
  lsSet(progKey(),prog);
}
function openPassage(id,mode){
  P=PASSAGES.find(p=>p.id===id);
  $('#backBtn').classList.remove('hidden');
  $('#topTitle').textContent=P.id+'번 · '+P.kind+' — '+P.title;
  const saved=mode==='fresh'?null:lsGet(stateKey(id),null);
  if(saved&&saved.stage) return askResume(saved);
  clearS(id);
  S={t0:Date.now(),wrongWords:[],wordFirst:{},notes:[],results:{},dirty:false};
  startWords();
}
// 끊긴 지점 안내 화면
function askResume(sv){
  setSteps('');
  const label={word:'① 단어 체크',read:'② 한 줄 해석',quiz:'③ 문제 풀기'}[sv.stage]||'';
  let detail='';
  if(sv.stage==='word') detail=`단어 ${(sv.wDone||0)}/${sv.wTotal||P.words.length}개까지 했어요`;
  else if(sv.stage==='read') detail=`문장 ${(sv.readOk||[]).filter(Boolean).length}/${P.sents.length}개까지 읽었어요`;
  else detail=`문제 ${Math.min((sv.qPos||0)+1,(sv.qq||P.qs).length)}/${(sv.qq||P.qs).length}번째${sv.round>1?' · 틀린 문제 다시 풀기':''}`;
  $('#main').innerHTML=`<div class="card" style="text-align:center">
    <div style="font-size:40px">🔖</div>
    <div class="bh" style="font-size:21px;color:var(--pri);margin:6px 0">하던 데부터 이어서 할까요?</div>
    <p class="muted">${P.id}번 · ${esc(label)}에서 멈췄어요 (${esc(agoText(sv.at||Date.now()))})<br><b style="color:var(--ink)">${esc(detail)}</b></p>
    ${(sv.notes&&sv.notes.length)?`<p class="muted" style="margin-top:6px">써 둔 오답노트 ${sv.notes.length}개도 그대로 있어요</p>`:''}
    <button class="btn full" style="margin-top:16px" onclick="resumeS()">이어서 하기 →</button>
    <button class="btn full sub" style="margin-top:8px" onclick="if(confirm('처음부터 다시 하면 지금까지 한 기록은 지워져요. 계속할까요?'))openPassage('${P.id}','fresh')">처음부터 다시</button>
  </div>`;
  toTop();
}
function resumeS(){
  const sv=lsGet(stateKey(P.id),null);
  if(!sv) return openPassage(P.id,'fresh');
  S=Object.assign({},sv);
  S.dirty=true; S.wCur=null; S.note=null;
  S.wrongWords=S.wrongWords||[]; S.wordFirst=S.wordFirst||{}; S.notes=S.notes||[]; S.results=S.results||{};
  S.wPool=[...new Set(PASSAGES.flatMap(p=>p.words.map(w=>w.ko)))];
  if(S.stage==='word'){ setSteps('word'); nextWord(); }
  else if(S.stage==='read'){ startRead(); }
  else { setSteps('quiz'); S.round=S.round||1; S.qq=S.qq||P.qs.map((q,i)=>i); S.qPos=S.qPos||0; S.roundWrong=S.roundWrong||[]; showQ(); }
}

/* ═════════ ① 단어 체크 ═════════ */
function startWords(){
  setSteps('word');
  S.dirty=true;
  S.wq=shuffle(P.words.map((w,i)=>i));
  S.wTotal=P.words.length; S.wDone=0; S.wOk=0;
  S.wPool=[...new Set(PASSAGES.flatMap(p=>p.words.map(w=>w.ko)))];
  saveS('word');
  nextWord();
}
function nextWord(){
  if(!S.wq.length) return wordsDone();
  saveS('word');
  const i=S.wq[0], w=P.words[i];
  const same=P.words.map(x=>x.ko).filter(k=>k!==w.ko);
  const others=S.wPool.filter(k=>k!==w.ko && !same.includes(k));
  const distract=shuffle(same).slice(0,2).concat(shuffle(others)).filter((v,j,a)=>a.indexOf(v)===j).slice(0,3);
  const opts=shuffle([w.ko,...distract]);
  S.wCur={i,opts};
  const retry=S.wordFirst[i]===false;
  $('#main').innerHTML=`
    <div class="bar"><i style="width:${Math.round(S.wDone/S.wTotal*100)}%"></i></div>
    <div class="card wbox">
      <div class="wcount">${retry?'<span class="qround">다시 도전</span> ':''}단어 ${S.wDone+1} / ${S.wTotal} · 알맞은 뜻을 고르세요</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px">
        <div class="wen">${esc(w.en)}</div><button class="say" onclick="speak(${esc(JSON.stringify(w.en))})">🔊</button>
      </div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" onclick="pickWord(${k})"><span class="n">${CIRC[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div id="wfb"></div>
    </div>`;
}
function pickWord(k){
  const {i,opts}=S.wCur, w=P.words[i];
  const ok=opts[k]===w.ko;
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,j)=>{b.disabled=true;if(opts[j]===w.ko)b.classList.add('right');});
  if(!ok) btns[k].classList.add('wrong');
  if(S.wordFirst[i]===undefined){
    S.wordFirst[i]=ok;
    if(ok) S.wOk++; else S.wrongWords.push(w.en+'('+w.ko+')');
  }
  S.wq.shift();
  if(ok){S.wDone++;}
  else {S.wq.push(i);}
  saveS('word');
  const tip=w.tip?`<div class="tip">💡 ${esc(w.tip)}</div>`:'';
  $('#wfb').innerHTML=(ok?`<div class="fb ok"><h4>⭕ 정답!</h4></div>`:`<div class="fb" style="background:var(--redBg);color:var(--red)"><h4>❌ 정답은 "${esc(w.ko)}"</h4><div style="font-size:13px">이 단어는 뒤에 한 번 더 나와요.</div></div>`)
    +tip+`<button class="btn full" style="margin-top:14px" onclick="nextWord()">다음 →</button>`;
  if(ok && !w.tip) setTimeout(()=>{if(S.wCur&&S.wCur.i===i&&document.getElementById('wfb'))nextWord();},650);
}
function wordsDone(){
  S.wCur=null;
  markProg('word');
  saveS('read');
  $('#main').innerHTML=`<div class="card" style="text-align:center">
    <div style="font-size:40px">📖</div>
    <div class="bh" style="font-size:22px;color:var(--pri);margin:6px 0">단어 체크 완료!</div>
    <p>처음에 바로 맞힌 단어 <b style="color:var(--pri)">${S.wOk} / ${S.wTotal}</b>개</p>
    ${S.wrongWords.length?`<div class="tip" style="margin-top:12px"><b>헷갈렸던 단어</b><br>${S.wrongWords.map(esc).join('<br>')}</div>`:'<p class="muted" style="margin-top:6px">완벽해요! 👏</p>'}
    <button class="btn full" style="margin-top:18px" onclick="startRead()">② 한 줄 해석 읽기 →</button>
  </div>`;
  toTop();
}

/* ═════════ ② 한 줄 해석 ═════════ */
function hlWords(en){
  let out=esc(en);
  const list=[];
  P.words.forEach(w=>(w.m||[]).forEach(f=>list.push({f,ko:w.ko})));
  list.sort((a,b)=>b.f.length-a.f.length);
  const used=[];
  list.forEach(({f,ko},n)=>{
    const re=new RegExp('\\b('+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"(?:'|&#39;)")+')\\b','i');
    if(re.test(out)&&!used.includes(f)){
      out=out.replace(re,m=>`\u0001${n}\u0002${m}\u0003`);used.push(f);
    }
  });
  return out.replace(/\u0001(\d+)\u0002(.*?)\u0003/g,(_,n,m)=>`<span class="kw" onclick="toast(${esc(JSON.stringify(list[n].f+' = '+list[n].ko))})">${m}</span>`);
}
function startRead(){
  setSteps('read');
  S.cover=S.cover||false;
  S.readOk=S.readOk||P.sents.map(()=>false);
  renderRead();
  toTop();
}
function renderRead(){
  saveS('read');
  const all=S.readOk.every(Boolean);
  const cnt=S.readOk.filter(Boolean).length;
  let h=`<div class="toolbar">
    <div class="tog"><button class="${S.cover?'':'on'}" onclick="setCover(false)">해석 보이기</button><button class="${S.cover?'on':''}" onclick="setCover(true)">해석 가리기</button></div>
    <div class="muted">밑줄 단어를 누르면 뜻이 나와요 · <b style="color:var(--pri)">${cnt}/${P.sents.length}</b></div>
  </div>`;
  P.sents.forEach((s,i)=>{
    h+=`<div class="sent${S.readOk[i]?' ok':''}" id="s${i}">
      <div class="row"><div class="num">${i+1}</div><div class="en">${hlWords(s.en)}</div><button class="say" onclick="speak(P.sents[${i}].en)">🔊</button></div>
      <div class="ko${S.cover&&!S.readOk[i]?' cover':''}" onclick="this.classList.remove('cover')">${esc(s.ko)}</div>
      ${s.g?`<div class="gp"><b>문법</b> ${esc(s.g)}</div>`:''}
      <button class="chk" onclick="toggleRead(${i})">${S.readOk[i]?'✔ 이해 완료':'☐ 이해했어요'}</button>
    </div>`;
  });
  if(P.note) h+=`<div class="muted" style="margin:4px 4px 0;white-space:pre-line">${esc(P.note)}</div>`;
  h+=`<div class="topic"><div class="lb">🎯 이 글의 주제</div><div class="tx">${esc(P.topic)}</div><div class="ez">🧸 쉽게 말하면… ${esc(P.easy)}</div></div>
    <button class="btn full" ${all?'':'disabled'} onclick="startQuiz()">${all?'③ 문제 풀러 가기 →':'모든 문장에 "이해했어요"를 눌러야 넘어가요 ('+cnt+'/'+P.sents.length+')'}</button>`;
  $('#main').innerHTML=h;
}
function setCover(v){S.cover=v;renderRead();}
function toggleRead(i){
  const y=window.scrollY;
  const ko=document.querySelector('#s'+i+' .ko');
  if(!S.readOk[i] && ko && ko.classList.contains('cover')){ko.classList.remove('cover');toast('해석을 확인하고 한 번 더 누르세요');return;}
  S.readOk[i]=!S.readOk[i];renderRead();window.scrollTo(0,y);
}

/* ═════════ ③ 문제 ═════════ */
function startQuiz(){
  markProg('read');
  setSteps('quiz');
  S.round=1;
  S.qq=P.qs.map((q,i)=>i);
  S.qPos=0;
  S.firstOk=0;
  S.roundWrong=[];
  saveS('quiz');
  showQ();
}
function showQ(){
  if(S.qPos>=S.qq.length) return roundEnd();
  saveS('quiz');
  const qi=S.qq[S.qPos], q=P.qs[qi];
  const order=q.shuffle?shuffle(q.o.map((_,k)=>k)):q.o.map((_,k)=>k);
  S.cur={qi,order,answered:false};
  $('#main').innerHTML=`
    <div class="bar"><i style="width:${Math.round(S.qPos/S.qq.length*100)}%"></i></div>
    <div class="card">
      <div class="qhead"><span class="qtype">${esc(q.t)}</span>${S.round>1?`<span class="qround">틀린 문제 다시 풀기 ${S.round-1}회차</span>`:''}<span class="muted">${S.qPos+1} / ${S.qq.length}</span></div>
      <div class="qstem">${q.q}</div>
      ${q.box?`<div class="qbox">${q.box}</div>`:''}
      <div class="opts">${order.map((k,j)=>`<button class="opt" onclick="pickQ(${j})"><span class="n">${CIRC[j]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div>
      <div id="qfb"></div>
    </div>`;
  toTop();
}
function pickQ(j){
  if(S.cur.answered) return;
  S.cur.answered=true;
  const {qi,order}=S.cur, q=P.qs[qi];
  const pickedK=order[j], ansK=q.a-1, ansJ=order.indexOf(ansK);
  const ok=pickedK===ansK;
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,x)=>{b.disabled=true;if(x===ansJ)b.classList.add('right');});
  if(!ok) btns[j].classList.add('wrong');
  if(S.round===1 && S.results[qi]===undefined){   // 끊겼다 이어서 다시 답해도 처음 결과가 그대로 남게
    S.results[qi]={ok,my:CIRC[j]+' '+strip(q.o[pickedK]),ans:CIRC[ansJ]+' '+strip(q.o[ansK])};
    if(ok) S.firstOk++;
  }
  saveS('quiz');
  if(ok){
    $('#qfb').innerHTML=`<div class="fb ok"><h4>⭕ 정답이에요!</h4>${fixWhy(q.why,order)}</div>
      <button class="btn full" style="margin-top:14px" onclick="S.qPos++;showQ()">다음 문제 →</button>`;
    return;
  }
  if(!S.roundWrong.includes(qi)) S.roundWrong.push(qi);
  S.note={qi,my:CIRC[j],myText:strip(q.o[pickedK]),ans:CIRC[ansJ],ansText:strip(q.o[ansK]),reasons:[],copyOk:false,memo:''};
  const tr=P.sents.map((s,i)=>`<p><b>${i+1}.</b> ${esc(s.en)}<span class="k">→ ${esc(s.ko)}</span></p>`).join('');
  $('#qfb').innerHTML=`
  <div class="note" id="noteBox">
    <div class="note-h"><span style="font-size:24px">🚨</span><span class="bh">오답노트 써!</span></div>
    <div class="note-b">
      <div class="nsec">
        <div class="lb">✅ 정답과 자세한 해설</div>
        <div class="expl">내 답 <b style="color:var(--red)">${CIRC[j]}</b> → 정답 <span class="ans">${CIRC[ansJ]} ${esc(strip(q.o[ansK]))}</span><br><br>${fixWhy(q.why,order)}</div>
      </div>
      <div class="nsec">
        <div class="lb">📌 근거 문장과 해석</div>
        <div class="ev"><div class="e">${esc(q.ev)}</div><div class="k">→ ${esc(q.evKo)}</div></div>
        <button class="linkbtn" onclick="const f=this.nextElementSibling;f.classList.toggle('hidden');this.textContent=f.classList.contains('hidden')?'📖 전체 해석 펼치기':'📖 전체 해석 접기'">📖 전체 해석 펼치기</button>
        <div class="full-tr hidden">${tr}</div>
      </div>
      <div class="nsec">
        <div class="lb">1️⃣ 왜 틀렸나요? (여러 개 골라도 돼요)</div>
        <div class="rs">${REASONS.map((r,k)=>`<button onclick="toggleReason(${k},this)">${r}</button>`).join('')}</div>
      </div>
      <div class="nsec">
        <div class="lb">2️⃣ 근거 문장을 그대로 따라 쓰세요 (복사·붙여넣기 금지)</div>
        <textarea class="copy" id="copyIn" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="위의 파란 영어 문장을 보고 직접 입력" oninput="checkCopy()" onpaste="event.preventDefault();toast('직접 써야 기억에 남아요 ✍️')" ondrop="event.preventDefault()"></textarea>
        <div class="cstat" id="copyStat">대소문자·문장부호는 조금 달라도 괜찮아요</div>
      </div>
      <div class="nsec">
        <div class="lb">3️⃣ 한 줄 정리 — 다음엔 어떻게 풀까?</div>
        <textarea class="copy" id="memoIn" rows="2" placeholder="예) miss 뒤에는 -ing! / While은 '~인 반면에' → 앞뒤가 반대 내용" oninput="checkNote()"></textarea>
        <div class="cstat" id="memoStat">8글자 이상 써 주세요</div>
      </div>
      <button class="btn full warn" id="noteSave" disabled onclick="saveNote()">오답노트 저장하고 다음 →</button>
    </div>
  </div>`;
  setTimeout(()=>{const nb=$('#noteBox');if(nb)nb.scrollIntoView({behavior:'smooth',block:'start'});},120);
}
function toggleReason(k,btn){
  const r=S.note.reasons, at=r.indexOf(REASONS[k]);
  if(at<0) r.push(REASONS[k]); else r.splice(at,1);
  btn.classList.toggle('on',at<0);
  checkNote();
}
function checkCopy(){
  const el=$('#copyIn'), st=$('#copyStat');
  const target=norm(P.qs[S.note.qi].ev), typed=norm(el.value);
  el.classList.remove('good','bad');st.classList.remove('good','bad');
  if(!typed){st.textContent='대소문자·문장부호는 조금 달라도 괜찮아요';S.note.copyOk=false;return checkNote();}
  if(typed===target){
    S.note.copyOk=true;el.classList.add('good');st.classList.add('good');st.textContent='✔ 완벽하게 따라 썼어요!';
  }else if(target.startsWith(typed)){
    S.note.copyOk=false;st.textContent='좋아요, 계속 쓰세요… ('+Math.round(typed.length/target.length*100)+'%)';
  }else{
    S.note.copyOk=false;el.classList.add('bad');st.classList.add('bad');
    let k=0;while(k<typed.length&&typed[k]===target[k])k++;
    st.textContent='✖ 철자가 다른 곳이 있어요 — 앞에서부터 '+Math.round(k/target.length*100)+'%까지 맞아요';
  }
  checkNote();
}
function checkNote(){
  const m=($('#memoIn')||{}).value||'';
  const mOk=m.replace(/\s/g,'').length>=8;
  const ms=$('#memoStat');
  if(ms){ms.classList.toggle('good',mOk);ms.textContent=mOk?'✔ 좋아요':'8글자 이상 써 주세요 ('+m.replace(/\s/g,'').length+'/8)';}
  S.note.memo=m.trim();
  const ready=S.note.reasons.length>0 && S.note.copyOk && mOk;
  const b=$('#noteSave');
  if(b){b.disabled=!ready;b.textContent=ready?'오답노트 저장하고 다음 →':'1️⃣ 이유 · 2️⃣ 따라쓰기 · 3️⃣ 한 줄 정리를 모두 해야 넘어가요';}
}
function saveNote(){
  const n=S.note, q=P.qs[n.qi];
  S.notes.push({pid:P.id,type:q.t,round:S.round,my:n.my+' '+n.myText,ans:n.ans+' '+n.ansText,reasons:n.reasons.slice(),memo:n.memo});
  S.note=null;
  S.qPos++;saveS('quiz');showQ();
}
function roundEnd(){
  if(S.roundWrong.length){
    const w=S.roundWrong.slice();
    $('#main').innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:40px">💪</div>
      <div class="bh" style="font-size:21px;color:var(--red);margin:6px 0">틀린 문제 ${w.length}개 다시 풀기</div>
      <p class="muted">오답노트에 쓴 내용을 떠올리면서 다시 풀어 보세요.<br>모두 맞혀야 이 지문이 끝나요!</p>
      <button class="btn full" style="margin-top:16px" onclick="startRetry()">다시 풀기 →</button>
    </div>`;
    S.nextQ=w;
    saveS('quiz');
    toTop();
    return;
  }
  finishPassage();
}
function startRetry(){
  S.round++;
  S.qq=shuffle(S.nextQ);S.qPos=0;S.roundWrong=[];
  saveS('quiz');
  showQ();
}

/* ═════════ 결과 · 저장 ═════════ */
function finishPassage(){
  const total=P.qs.length;
  const score=Math.round(S.firstOk/total*100);
  const el=Math.max(1,Math.round((Date.now()-S.t0)/60000));
  markProg('quiz');markProg('score',score);
  clearS(P.id);          // 다 끝났으니 이어하기 표시 없애기
  S.dirty=false;
  const lines=[];
  if(S.wrongWords.length) lines.push('[단어] '+S.wrongWords.join(', '));
  S.notes.forEach(n=>lines.push(`[${n.pid}번 ${n.type}${n.round>1?' 재도전':''}] 내답 ${n.my.slice(0,2)}→정답 ${n.ans.slice(0,2)} · ${n.reasons.map(r=>r.replace(/^\S+\s/,'')).join(', ')} · "${n.memo}"`));
  const payload={
    submittedAt:new Date().toISOString(),
    studentName:USER.name, school:USER.school,
    quizType:EXAM.quizType, file:EXAM.file, quizLabel:EXAM.title+' '+P.id+'번',
    passages:[P.id+'번'],
    score, correct:S.firstOk, wrong:total-S.firstOk, total,
    elapsedMin:el,
    wordTotal:S.wTotal, wordCorrect:S.wOk,
    rounds:S.round,
    details:P.qs.map((q,i)=>{const r=S.results[i]||{};return{문제:P.id+'-'+q.t,지문:P.id+'번',유형:q.t,결과:r.ok?'✅정답':'❌오답',내답:r.my||'',정답:r.ans||''};}),
    wrongNotes:S.notes,
    wrongSentences:lines.join(' / ')
  };
  let saveMsg='기록 저장 중…';
  (async()=>{
    let ok=false;
    try{ if(window._fbSave){ ok=(await window._fbSave(payload))!==false; } }catch(e){ok=false;}
    const s=document.getElementById('saveMsg');
    if(s) s.textContent=ok?'✔ 선생님께 기록이 전송됐어요':'⚠ 인터넷이 불안정해요 — 다음에 접속할 때 자동으로 다시 보내요';
  })();

  const nextP=PASSAGES[PASSAGES.findIndex(p=>p.id===P.id)+1];
  $('#main').innerHTML=`<div class="card" style="text-align:center">
      <div class="muted">${P.id}번 · ${esc(P.kind)} 완전정복 완료</div>
      <div class="big" style="margin-top:8px">${score}<span style="font-size:24px">점</span></div>
      <div class="muted">처음에 바로 맞힌 문제 기준</div>
      <div class="stats">
        <div><b>${S.wOk}/${S.wTotal}</b><span>단어</span></div>
        <div><b>${S.firstOk}/${total}</b><span>문제</span></div>
        <div><b>${S.notes.length}</b><span>오답노트</span></div>
      </div>
      <div class="muted" id="saveMsg">${saveMsg}</div>
    </div>
    ${S.notes.length?`<div class="card"><div class="bh" style="font-size:18px;color:var(--red);margin-bottom:10px">📝 내 오답노트</div><div class="nlist">${S.notes.map(n=>`
      <div class="ni"><div class="t">${n.pid}번 ${esc(n.type)}${n.round>1?' (재도전)':''}</div>
      <div>내 답 ${esc(n.my)}<br>정답 <b style="color:var(--green)">${esc(n.ans)}</b></div>
      <div class="muted">이유: ${n.reasons.map(esc).join(', ')}</div>
      <div style="margin-top:4px">✍️ ${esc(n.memo)}</div></div>`).join('')}</div></div>`:'<div class="card" style="text-align:center">🎉 한 번도 안 틀렸어요! 오답노트 없음</div>'}
    <div class="btnrow">
      ${nextP?`<button class="btn" onclick="openPassage('${nextP.id}')">다음: ${nextP.id}번 →</button>`:''}
      <button class="btn sub" onclick="goHome()">지문 목록</button>
      <button class="btn sub" onclick="openPassage('${P.id}')">이 지문 다시</button>
    </div>`;
  setSteps('');
  toTop();
}

window.addEventListener('beforeunload',()=>{ if(S.dirty) saveS(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && S.dirty) saveS(); });
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}
init();
</script>
</body>
</html>

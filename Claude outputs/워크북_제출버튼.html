<!doctype html><html lang="ko"><head><meta charset="utf-8">

<style>
:root{--bg:#faf7f2;--ink:#3b2f25;--muted:#8a8178;--line:#e4dcd1;--good:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",AppleGothic,-apple-system,sans-serif}
header{max-width:1000px;margin:0 auto;padding:22px 16px 4px}
h1{font-size:1.12rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.84rem;margin:0}
main{max-width:1000px;margin:0 auto;padding:10px 16px 40px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
figcaption{font-size:.79rem;line-height:1.6;padding:10px 12px;border-bottom:1px solid var(--line);color:#5a5048}
.tag{display:inline-block;font-size:.68rem;font-weight:800;border-radius:7px;padding:1px 8px;margin-right:7px;background:#e6f3ec;color:var(--good);border:1px solid #bcdfca}
img{display:block;width:100%;height:auto}
p.note{font-size:.86rem;line-height:1.75;color:#5a5048;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:18px 0 0}
@media (max-width:760px){.row{grid-template-columns:1fr}}
</style></head><body>

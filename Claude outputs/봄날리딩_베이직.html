<style>
:root{--bg:#faf7f2;--ink:#3b2f25;--muted:#8a8178;--line:#e4dcd1;--acc:#8a6a3e;--good:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",AppleGothic,-apple-system,sans-serif}
header{max-width:1100px;margin:0 auto;padding:22px 16px 4px}
h1{font-size:1.12rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.84rem;margin:0}
main{max-width:1100px;margin:0 auto;padding:10px 16px 44px}
section{margin-top:26px}
h2{font-size:.95rem;margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
figcaption{font-size:.78rem;line-height:1.55;padding:9px 11px;border-bottom:1px solid var(--line);color:#5a5048}
.tag{display:inline-block;font-size:.67rem;font-weight:800;border-radius:7px;padding:1px 8px;margin-right:6px;background:#e6f3ec;color:var(--good);border:1px solid #bcdfca}
img{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.84rem}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid #f0ebe4}
th{background:#f6f1e9;font-size:.74rem;color:#6b6054}
td.w{font-weight:700;color:var(--acc);width:34%}
td.k{color:var(--muted)}
p.note{font-size:.86rem;line-height:1.75;color:#5a5048;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0 0}
@media (max-width:860px){.row{grid-template-columns:1fr}}
</style></head><body>

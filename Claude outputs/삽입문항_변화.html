<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>삽입 문항 변화</title>
<style>
:root{--bg:#faf7f2;--ink:#3b2f25;--muted:#8a8178;--line:#e4dcd1;--good:#2e7d4f;--bad:#b4543a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",AppleGothic,-apple-system,BlinkMacSystemFont,sans-serif;}
header{padding:22px 16px 6px;max-width:1100px;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.84rem;margin:0}
main{max-width:1100px;margin:0 auto;padding:10px 16px 40px}
.cmp{margin-top:26px}
h2{font-size:.95rem;margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row.single{grid-template-columns:1fr;max-width:520px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
figcaption{font-size:.78rem;line-height:1.6;padding:10px 12px;border-bottom:1px solid var(--line);color:#5a5048}
.tag{display:inline-block;font-size:.68rem;font-weight:800;border-radius:7px;padding:1px 8px;margin-right:7px;vertical-align:1px}
.t-bad{background:#fbeae5;color:var(--bad);border:1px solid #edc7bb}
.t-good{background:#e6f3ec;color:var(--good);border:1px solid #bcdfca}
img{display:block;width:100%;height:auto}
.bad img{filter:saturate(.75)}
@media (max-width:760px){ .row{grid-template-columns:1fr} }
</style></head>

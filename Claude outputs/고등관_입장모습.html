<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>고등관 입장 모습</title>
<style>
:root{--bg:#faf7f2;--ink:#3b2f25;--muted:#8a8178;--line:#e4dcd1;--good:#2e7d4f;--acc:#8a6a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",AppleGothic,-apple-system,sans-serif}
header{max-width:1150px;margin:0 auto;padding:22px 16px 4px}
h1{font-size:1.12rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.84rem;margin:0}
main{max-width:1150px;margin:0 auto;padding:10px 16px 44px}
section{margin-top:26px}
h2{font-size:.95rem;margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.one{display:grid;grid-template-columns:1fr;gap:14px;max-width:330px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
figcaption{font-size:.78rem;line-height:1.55;padding:9px 11px;border-bottom:1px solid var(--line);color:#5a5048}
.tag{display:inline-block;font-size:.67rem;font-weight:800;border-radius:7px;padding:1px 8px;margin-right:6px;background:#fdf1e3;color:#8a5a22;border:1px solid #ecd4b4}
img{display:block;width:100%;height:auto}
p.note{font-size:.86rem;line-height:1.75;color:#5a5048;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0 0}
p.note b{color:var(--acc)}
@media (max-width:860px){.row{grid-template-columns:1fr}}
</style></head><body>

{"no": 195, "school": "연송고 (인천시)", "pref": "32", "type": "빈칸", "stem": "다음 빈칸 'If, at any one moment, skirts are at their shortest, a half century later they will be at their longest; thus skirts become short again a half century after being long and a century after being short. In other words, ___.'에 들어갈 말로 가장 적절한 것은?", "p": "32-a", "choices": ["the similar style will return every 150 years", "the similar style will return on a cycle of 50 years", "the similar style will return on a cycle of 100 years", "the style will reach its most dramatic point of variation on a 100-year cycle.", "the style will reach its most dramatic point of variation on a 150-year cycle."], "ans": 3, "exp": "치마는 짧아진 지 한 세기 후에 다시 짧아지므로, 비슷한 스타일이 100년 주기로 돌아온다.", "b": 2, "bb": "The well-known American ethnologist Alfred Louis Kroeber made a rich and in-depth study of women's evening dress in the West, stretching back about three centuries and using reproductions of engravings. Having adjusted the dimensions of these plates due to their diverse origins, he was able to analyse the constant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical. He reduced women's clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. He demonstrated unambiguously that fashion is a profoundly regular phenomenon which is not located at the level of annual variations but on the scale of history. For practically 300 years, women's dress was subject to a very precise periodic cycle: forms reach the furthest point in their variations every fifty years. If, at any one moment, skirts are at their shortest, a half century later they will be at their longest; thus skirts become short again a half century after being long and a century after being short. In other words, __________."},
{"no": 196, "school": "군산동고 (군산시)", "pref": "32", "type": "주제", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "32-a", "choices": ["using reproductions of engraving to make evening dress", "women's clothing reflects a practical and progressive trend", "the benefits of swiftly changing fashion trend", "evening dress as a value of acquiring social equality", "evening dress is subject to a very precise periodic cycle"], "ans": 5, "exp": "여성의 이브닝드레스가 매우 정확한 주기적 순환을 따른다는 연구 결과를 다룬 글이다.", "b": 2},
{"no": 197, "school": "제일고 (김포시)", "pref": "32", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "32-a", "choices": ["ⓐ tracing", "ⓑ constant", "ⓒ foreseeable", "ⓓ extreme", "ⓔ long"], "ans": 5, "exp": "ⓔ long → short: 짧았던 치마는 100년 뒤 다시 짧아지므로 'a hundred years after being short'가 되어야 한다.", "b": 3, "bb": "[학교 변형 지문]\nThe well-known American ethnologist Alfred Louis Kroeber conducted a comprehensive and detailed study of women's evening dress in the West, ⓐtracing its history over nearly 300 years and using reproductions of engravings. Having adjusted the dimensions of these plates due to their diverse origins, he was able to analyse the ⓑconstant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical. He reduced women's clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. He demonstrated unambiguously that fashion is a profoundly regular and ⓒforeseeable phenomenon, which is not based on annual fluctuations, but observed over the scale of history. For practically 300 years, women's dress was subject to a very precise periodic cycle: forms reach the ⓓextreme point in their variations every fifty years. If, at any one moment, skirts are at their shortest, fifty years later they will be at their longest; thus skirts become short again fifty years after being long and a hundred years after being ⓔlong."},
{"no": 198, "school": "송천고 (인천시)", "pref": "32", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "32-a", "choices": ["The Role of Fashion in Social Change", "Cyclical Patterns of Women's Clothing", "The Birth and Origin of Women's Clothing", "The Connection Between Fashion and Math", "Women's Clothing in The Era of Constant Change"], "ans": 2, "exp": "여성 의복이 50년 주기로 규칙적으로 반복된다는 내용이므로 ②가 적절하다.", "b": 3},
{"no": 199, "school": "논현고 (인천시)", "pref": "32", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 여성 의복을 몇 가지 특징으로 단순화함 ② 패션이 역사적 규모에서 규칙적인 현상임을 증명함 ③ 'Fashion tends to reflect the societal, economical, and cultural elements of an age.' ④ 300년 동안 여성 의복은 50년마다 극점에 이르는 주기를 따름 ⑤ 치마 길이가 50년마다 가장 길고 짧아지기를 반복함)", "p": "32-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 3, "exp": "글은 여성 의복의 주기적 변화를 다루므로, 패션이 시대의 사회·경제·문화적 요소를 반영한다는 ③은 흐름과 무관하다.", "b": 3},
{"no": 200, "school": "함월고 (울산시)", "pref": "32", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "32-a", "choices": ["ⓐ comprehensive", "ⓑ adjusting", "ⓒ intuition", "ⓓ regular", "ⓔ unpredictable"], "ans": 5, "exp": "ⓔ unpredictable → predictable: 50년마다 규칙적으로 반복되는 주기이므로 예측 가능하다.", "b": 3, "bb": "[학교 변형 지문]\nThe renowned American ethnologist Alfred Louis Kroeber conducted a ⓐcomprehensive analysis of women's evening dresses in the Western world, tracing their evolution over approximately three centuries using reproductions of engravings. By ⓑadjusting the dimensions of these illustrations, which came from various sources, he was able to accurately examine the consistent elements in fashion trends. His study was not based on ⓒintuition, but rather employed a precise, mathematical, and statistical approach. Kroeber broke down women's clothing into specific characteristics, such as skirt length and size, neckline depth, and waistline height. His findings clearly showed that fashion follows a remarkably ⓓregular pattern, not at the level of yearly changes but on the historical scale. For nearly 300 years, women's fashion has adhered to a ⓔ unpredictable periodic cycle, with styles reaching their most extreme variations every fifty years. For instance, if skirts are at their longest at one point in time, they will be at their shortest fifty years later; after another fifty years, the skirts will return to being long again, marking a hundred-year cycle of repetition."},
{"no": 201, "school": "효성여고 (대구시)", "pref": "32", "type": "무관문장", "stem": "다음 글의 전체 흐름과 관계없는 문장은? (① 그는 여성 의류를 치마 길이·크기, 네크라인 크기·깊이, 허리선 높이 등 몇 가지 특징으로 축소했다 ② 'He emphasized that the study of fashion trends is largely subjective and difficult to quantify.' ③ 300년 동안 여성 드레스는 50년마다 변화의 극점에 이르는 매우 정밀한 주기를 따랐다 ④ 예를 들어 치마가 가장 길었던 시점으로부터 50년 후에는 가장 짧아졌다가 다시 50년 후 가장 길어졌다 ⑤ 'This pattern of cyclical change continued consistently, revealing the periodic nature of fashion trends over time.')", "p": "32-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "Kroeber는 정밀하고 수학적·통계적인 연구를 했으므로 패션 연구가 주관적이고 정량화하기 어렵다는 ②는 흐름과 맞지 않다.", "b": 4, "bb": "[학교 변형 지문]\nThe well-known American ethnologist Alfred Louis Kroeber made a rich and in-depth study of women's evening dress in the West, stretching back about three centuries and using reproductions of engravings. Having adjusted the dimensions of these plates due to their diverse origins, he was able to analyse the constant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical. ⓐHe reduced women's clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. ⓑHe emphasized that the study of fashion trends is largely subjective and difficult to quantify. ⓒOver 300 years, women's dress was subject to a very precise periodic cycle: forms reach the furthest point in their variations every fifty years. ⓓFor example, if skirts were at their longest at one point in time, fifty years later, they would be at their shortest, only to return to maximum length another fifty years after that. ⓔThis pattern of cyclical change continued consistently, revealing the periodic nature of fashion trends over time."},
{"no": 202, "school": "능곡고 (시흥시)", "pref": "32", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] After that, he was able to analyse the constant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical.", "p": "32-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 1, "exp": "판화의 크기를 조정했다는 문장 뒤(After that), 여성 의류를 몇 가지 특징으로 축소했다는 문장 앞에 와야 한다.", "b": 4, "bb": "The well-known American ethnologist Alfred Louis Kroeber made a rich and in-depth study of women's evening dress in the West, stretching back about three centuries and using reproductions of engravings. ( ① ) He reduced women's clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. ( ② ) He demonstrated unambiguously that fashion is a profoundly regular phenomenon which is not located at the level of annual variations but on the scale of history. ( ③ ) For practically 300 years, women's dress was subject to a very precise periodic cycle: forms reach the furthest point in their variations every fifty years. ( ④ ) If, at any one moment, skirts are at their longest, fifty years later they will be at their shortest; thus skirts become long again fifty years after being short and a hundred years after being long. ( ⑤ )"},
{"no": 203, "school": "명일여고 (서울시)", "pref": "32", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "32-a", "choices": ["ⓐ modified", "ⓑ elements", "ⓒ shorter time span", "ⓓ regular", "ⓔ long"], "ans": 3, "exp": "ⓒ shorter time span → history: 연간 변화가 아닌 역사적 규모에서 나타나는 현상이다.", "b": 4, "bb": "[학교 변형 지문]\nThe well-known American ethnologist Alfred Louis Kroeber made a rich and in-depth study of women's evening dress in the West, stretching back about three centuries and using reproductions of engravings. Having ⓐmodified the dimensions of these plates due to their diverse origins, he was able to analyse the constant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical. He reduced women's clothing to a certain number of ⓑelements: length and size of the skirt, size and depth of the neckline, height of the waistline. He demonstrated unambiguously that fashion is a profoundly regular phenomenon which is not located at the level of annual variations but on the scale of ⓒshorter time span. For practically 300 years, women's dress was subject to a very precise ⓓregular cycle: forms reach the furthest point in their variations every fifty years. If, at any one moment, skirts are at their longest, fifty years later they will be at their shortest; thus skirts become ⓔlong again fifty years after being short."},
{"no": 204, "school": "선사고 (서울시)", "pref": "32", "type": "내용불일치", "stem": "윗글의 Alfred Louis Kroeber에 관한 내용과 일치하지 않는 것은?", "p": "32-a", "choices": ["서양의 여성 이브닝드레스에 대해 풍부하고 깊이 있는 연구를 수행했다.", "정확하고 수학적이며 통계적인 연구를 구상했다.", "여성 의류를 몇 가지 특징들로 정리했다.", "패션이 매우 규칙적인 현상임을 보여주었다.", "여성의 패션이 매년 주기적으로 변화한다고 결론지었다."], "ans": 5, "exp": "패션은 연간 변화가 아니라 역사적 규모(50년 주기)에서 규칙적으로 변한다고 했으므로 ⑤는 틀리다.", "b": 4},

{"no": 210, "school": "신흥고 (청주시)", "pref": "33", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "33-a", "choices": ["(A)-(B)-(C)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 3, "exp": "부의 분배 수단인 시장 메커니즘(B) → 불평등이 그 메커니즘을 압박하고 노동 시장까지 위협(C) → 그 시장 붕괴 시의 위험(A) 순서이다.", "b": 1, "bb": "Over the last few centuries, humanity's collective prosperity has skyrocketed, as technological progress has made us far wealthier than ever before.\n\n(A) And now, technological unemployment threatens to become a more radical version of the same story, taking place in the particular market we rely upon the most: the labor market. As that market begins to break down, more and more people will be in danger of not receiving a share of society's prosperity at all.\n\n(B) To share out those riches, almost all societies have settled upon the market mechanism, rewarding people in various ways for the work that they do and the things that they own. But rising inequality, itself often driven by technology, has started to put that mechanism under strain.\n\n(C) Today, markets already provide immense rewards to some people but leave many others with very little."},

{"no": 283, "school": "지산고 (파주시)", "pref": "35", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "35-a", "choices": ["ⓐ invaluable (way to keep most nutrients)", "ⓑ tough (processes)", "ⓒ abundant", "ⓓ acceptable", "ⓔ nutritious"], "ans": 4, "exp": "ⓓ acceptable → unacceptable: 핵심 영양소와 섬유질의 손실은 지속 가능한 식단에서 용납될 수 없다.", "b": 5, "bb": "[학교 변형 지문]\nMinimal processing can be one of the best ways to keep original flavors and taste, without any need to add artificial flavoring or additives, or too much salt. This would also be the ⓐinvaluable way to keep most nutrients, especially the most sensitive ones such as many vitamins and anti-oxidants. Milling of cereals is one of the most ⓑtough processes which dramatically affect nutrient content. While grains are naturally very ⓒabundant in micronutrients, anti-oxidants and fiber (i.e. in wholemeal flour or flakes), milling usually removes the vast majority of minerals, vitamins and fibers to raise white flour. Such a spoilage of key nutrients and fiber is ⓓacceptable in the context of a sustainable diet aiming at an optimal nutrient density and health protection. In contrast, fermentation of various foodstuffs or germination of grains are traditional, locally accessible, low-energy and highly ⓔnutritious processes of sounded interest."},

{"no": 286, "school": "남동고 (인천시)", "pref": "36", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] If this were true, we might like people more if they reveal some evidence of fallibility.", "p": "36-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 5, "exp": "너무 유능한 사람이 불편하다는 설명 뒤, 가끔 실수하는 친구를 더 좋아한다는 예시(For example…) 앞에 와야 한다.", "b": 1, "bb": "It would seem obvious that the more competent someone is, the more we will like that person. By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc. We stand a better chance of doing well at our life tasks if we surround ourselves with people who know what they're doing and have a lot to teach us. ( ① ) But the research evidence is paradoxical: In problem-solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are best liked. ( ② ) Why? ( ③ ) One possibility is that, although we like to be around competent people, those who are too competent make us uncomfortable. ( ④ ) They may seem unapproachable, distant, superhuman — and make us look bad (and feel worse) by comparison. ( ⑤ ) For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up."},

{"no": 303, "school": "경혜여고 (부산시)", "pref": "36", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] If this theory holds true, we might find people more likable if they display occasional imperfections.", "p": "36-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 5, "exp": "뛰어난 사람이 우리를 불편하게 한다는 설명 뒤, 가끔 실수하는 친구를 더 좋아할 수 있다는 예시(For instance…) 앞에 들어가야 한다.", "b": 4, "bb": "It would seem obvious that the more competent someone is, the more we will like that person. By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc. We stand a better chance of doing well at our life tasks if we surround ourselves with people who know what they're doing and have a lot to teach us. ( ① ) But the research evidence is paradoxical: In problem-solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are best liked. ( ② ) Why? ( ③ ) One possibility is that, although we like to be around competent people, those who are too competent make us uncomfortable. ( ④ ) They may seem unapproachable, distant, superhuman — and make us look bad (and feel worse) by comparison. ( ⑤ ) For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up."},
{"no": 304, "school": "청주고 (청주시)", "pref": "36", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "36-a", "choices": ["Why Competence Hurts More than Incompetence", "Confidence Is the Invisible Hand That Disrupts Likeability!", "Which Is More Important, Competence or Likeability?", "Excessive Competence: A Reason for Less Likeability", "Is Competence the Best Policy to Turn Enemies into Friends?"], "ans": 4, "exp": "지나치게 유능한 사람은 불편함을 주어 덜 호감을 얻는다는 내용이다.", "b": 4},
{"no": 305, "school": "공주고 (공주시)", "pref": "36", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "36-a", "choices": ["(B)-(D)-(C)", "(C)-(B)-(D)", "(C)-(D)-(B)", "(D)-(B)-(C)", "(D)-(C)-(B)"], "ans": 3, "exp": "(A) 고용주가 긍정적인 직원을 원함 → (C) 유능한 직원이 피곤한 이유 → (D) 실수하면 더 좋아하며 유능한 직원이 해고된 사례 → (B) 장기적으로는 해고가 혁신을 저해함.", "b": 4, "bb": "It would seem obvious that the more competent someone is, the more we will like that person. By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc.\n\n(B) If this were true, we might like people more if they reveal some evidence of fallibility. For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up.\n\n(C) We stand a better chance of doing well at our life tasks if we surround ourselves with people who know what they're doing and have a lot to teach us. But the research evidence is paradoxical: In problem-solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are best liked.\n\n(D) Why? One possibility is that, although we like to be around competent people, those who are too competent make us uncomfortable. They may seem unapproachable, distant, superhuman — and make us look bad (and feel worse) by comparison."},

{"no": 307, "school": "명일여고 (서울시)", "pref": "36", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "36-a", "choices": ["ⓐ well", "ⓑ inconsistent", "ⓒ most liked", "ⓓ bad", "ⓔ infallible"], "ans": 5, "exp": "ⓔ infallible → fallible: 가끔 실수하는 사람을 더 좋아한다는 문맥이다.", "b": 4, "bb": "[학교 변형 지문]\nIt would seem obvious that the more competent someone is, the more we will like that person. By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc. We stand a better chance of doing ⓐwell at our life tasks if we surround ourselves with people who know what they're doing and have a lot to teach us. But the research evidence is ⓑinconsistent: In problem-solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are ⓒ most liked. Why? One possibility is that, although we like to be around competent people, those who are too competent make us feel ⓓbad about ourselves. They may seem unapproachable, distant, superhuman and make us feel worse by comparison. If this were true, we might like people more if we find them ⓔinfallible. For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up."},

{"no": 312, "school": "효성여고 (대구시)", "pref": "36", "type": "빈칸", "stem": "다음 빈칸 'But the research evidence is ___: In problem-solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are best liked.'에 들어갈 말로 가장 적절한 것은?", "p": "36-a", "choices": ["cynical", "satirical", "humorous", "paradoxical", "metaphorical"], "ans": 4, "exp": "유능할수록 더 좋아할 것이라는 예상과 달리 가장 유능한 사람이 가장 호감을 얻지 못하므로 '역설적(paradoxical)'이다.", "b": 5, "bb": "It would seem obvious that the more competent someone is, the more we will like that person. By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc. We stand a better chance of doing well at our life tasks if we surround ourselves with people who know what they're doing and have a lot to teach us. But the research evidence is __________: In problem-solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are best liked. Why? One possibility is that, although we like to be around competent people, those who are too competent make us uncomfortable. They may seem unapproachable, distant, superhuman — and make us look bad (and feel worse) by comparison. If this were true, we might like people more if they reveal some evidence of fallibility. For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up."},

{"no": 315, "school": "백양고 (부산시)", "pref": "36", "type": "빈칸", "stem": "다음 빈칸 'In problem-solving groups, the participants who are considered the most competent and have the best ideas ___.'에 들어갈 말로 가장 적절한 것은?", "p": "36-a", "choices": ["do not enjoy high regard", "are likely to be perceived as brutal", "tend to be the ones who are best liked", "might find themselves more inclined to favor others", "often become the least effective contributors in the group"], "ans": 1, "exp": "뒤에서 너무 유능한 사람은 우리를 불편하게 만든다고 하므로, 가장 유능한 참가자가 높은 호감을 얻지 못한다는 내용이 적절하다.", "b": 5, "bb": "It would seem obvious that the more competent someone is, the more we will like that person. By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc. We stand a better chance of doing well at our life tasks if we surround ourselves with people who know what they're doing and have a lot to teach us. But the research evidence is paradoxical: In problem-solving groups, the participants who are considered the most competent and have the best ideas __________. Why? One possibility is that, although we like to be around competent people, those who are too competent make us uncomfortable. They may seem unapproachable, distant, superhuman — and make us look bad (and feel worse) by comparison. If this were true, we might like people more if they reveal some evidence of fallibility. For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up."},
{"no": 316, "school": "권선고 (수원시)", "pref": "36", "type": "요약", "stem": "요약 - 'Highly skilled individuals may be less (A)___ socially because their exceptional abilities can make others feel (B)___.'", "p": "36-a", "choices": ["(A) favored — (B) inadequate", "(A) favored — (B) untroubled", "(A) hated — (B) qualified", "(A) hated — (B) deficient", "(A) hated — (B) uneasy"], "ans": 1, "exp": "뛰어난 사람은 비교를 통해 남을 부족하게(inadequate) 느끼게 해 사회적으로 덜 호감을 얻는다(favored).", "b": 5},
{"no": 317, "school": "상당고 (청주시)", "pref": "36", "type": "요약", "stem": "요약 - 'Though competence is generally valued, we tend to like people more when they reveal (A)___, as those who seem too competent can make us feel (B)___.'", "p": "36-a", "choices": ["(A) perfections — (B) inadequate", "(A) perfections — (B) deficient", "(A) imperfections — (B) inadequate", "(A) imperfections — (B) sufficient", "(A) impeccability — (B) sufficient"], "ans": 3, "exp": "사람들은 불완전함(imperfections)을 드러낼 때 더 좋아하며, 너무 유능한 사람은 우리를 부족하게(inadequate) 느끼게 한다.", "b": 5},
{"no": 318, "school": "남동고 (인천시)", "pref": "37", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "37-a", "choices": ["ⓐ assign", "ⓑ informs", "ⓒ assess", "ⓓ bother", "ⓔ predetermined"], "ans": 5, "exp": "ⓔ predetermined → not predetermined: 입력은 내부 상태와 이력에 따라 처리되므로 그 효과가 미리 정해져 있지 않다.", "b": 1, "bb": "[학교 변형 지문]\nA computational algorithm that takes input data and generates some output from it doesn't really embody any notion of meaning. Certainly, such a computation does not generally have as its purpose its own survival and wellbeing. It does not, in general, ⓐassign value to the inputs. Compare, for example, a computer algorithm with the waggle dance of the honeybee, by which means a foraging bee ⓑinforms others members of the hive about the food source it has found. The \"dance\" ― a series of stylized movements on the comb ― shows the bees how far away the food is and in which direction. But this input does not simply program other bees to go out and look for it. Rather, they ⓒassess this information, comparing it with their own knowledge of the surroundings. Some bees may decide it's not worth the trip, so they won't ⓓbother. The input, such as it is, is processed in the light of the organism's own internal states and history; its effects are ⓔpredetermined."},
{"no": 319, "school": "산남고 (청주시)", "pref": "37", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] The \"dance\" — a series of stylized movements on the comb — shows the bees how far away the food is and in which direction.", "p": "37-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 2, "exp": "꿀벌의 춤을 소개한 문장 뒤, this input을 언급하는 But 문장 앞에 와야 한다.", "b": 1, "bb": "A computational algorithm that takes input data and generates some output from it doesn't really embody any notion of meaning. Certainly, such a computation does not generally have as its purpose its own survival and wellbeing. It does not, in general, assign value to the inputs. ( ① ) Compare, for example, a computer algorithm with the waggle dance of the honeybee, by which means a foraging bee conveys to others in the hive information about the source of food (such as nectar) it has located. ( ② ) But this input does not simply program other bees to go out and look for it. ( ③ ) Rather, they evaluate this information, comparing it with their own knowledge of the surroundings. ( ④ ) Some bees might not bother to make the journey, considering it not worthwhile. ( ⑤ ) The input, such as it is, is processed in the light of the organism's own internal states and history; there is nothing prescriptive about its effects."},
{"no": 320, "school": "연수여고 (인천시)", "pref": "37", "type": "주제", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "37-a", "choices": ["the collective life and hierarchy of bees", "the evolution of bee communication methods", "the reason honey bees perform the waggle dance", "the impact of environmental changes on bee foraging behavior", "the way bees assess the waggle dance based on their own experience"], "ans": 5, "exp": "꿀벌은 춤의 정보를 그대로 따르지 않고 자신의 지식과 내부 상태에 비추어 평가한다는 내용이다.", "b": 2},
{"no": 321, "school": "충북대부설고 (청주시)", "pref": "37", "type": "빈칸연결어", "stem": "다음 빈칸 (A) 'Compare, (A)___, a computer algorithm with the waggle dance of the honeybee' … (B) '(B)___, this input does not simply program other bees to go out and look for it.'에 들어갈 말로 가장 적절한 것은?", "p": "37-a", "choices": ["(A) on the other hand — (B) Instead", "(A) for example — (B) As a result", "(A) otherwise — (B) Still", "(A) for instance — (B) However", "(A) in consequence — (B) In addition"], "ans": 4, "exp": "(A)는 예시를 드는 for instance, (B)는 앞 내용과 상반되는 However가 적절하다.", "b": 2, "bb": "A computational algorithm that takes input data and generates some output from it doesn't really embody any notion of meaning. Certainly, such a computation does not generally have as its purpose its own survival and wellbeing. It does not, in general, assign value to the inputs. Compare, for example, a computer algorithm with the waggle dance of the honeybee, by which means a foraging bee conveys to others in the hive information about the source of food (such as nectar) it has located. The \"dance\" — a series of stylized movements on the comb — shows the bees how far away the food is and in which direction. Compare, (A)__________, a computer algorithm with the waggle dance of the honeybee'  (B) '(B)__________, this input does not simply program other bees to go out and look for it. Rather, they evaluate this information, comparing it with their own knowledge of the surroundings. Some bees might not bother to make the journey, considering it not worthwhile. The input, such as it is, is processed in the light of the organism's own internal states and history; there is nothing prescriptive about its effects."},

{"no": 339, "school": "지산고 (파주시)", "pref": "37", "type": "내용일치", "stem": "다음 글의 내용과 일치하는 것만을 <보기>에서 고르면? (ⓐ A computational algorithm cares about its own meaning and value. ⓑ The waggle dance of the honeybee is an example of the input interpreted with its value. ⓒ Bees in the hive perform a role of delivering the source of food to a foraging bee. ⓓ The waggle dance involves information about the distance and direction to food. ⓔ After evaluating the information the dance conveys, every bee in the comb starts to travel for the food. ⓕ The waggle dance is processed in consideration of the condition of bees.)", "p": "37-a", "choices": ["ⓐ, ⓒ, ⓓ", "ⓐ, ⓒ, ⓕ", "ⓑ, ⓓ, ⓔ", "ⓑ, ⓓ, ⓕ", "ⓒ, ⓔ, ⓕ"], "ans": 4, "exp": "ⓐ 알고리즘은 의미·가치를 부여하지 않고, ⓒ 정보를 전하는 것은 채집 벌이며, ⓔ 일부 벌은 가지 않으므로 틀리다.", "b": 5},
{"no": 340, "school": "영생고 (수원시)", "pref": "38", "type": "빈칸연결어", "stem": "다음 빈칸 (A)'(A)___, people in close or extended proximity to others infected by a virus are themselves more likely to become infected, just as people are more likely to drink excessively when they spend more time in the company of heavy drinkers.' (B)'(B)___, we try to avoid others who are visibly ill.'에 들어갈 말로 가장 적절한 것은?", "p": "38-a", "choices": ["(A) For example — (B) By contrast", "(A) However — (B) By contrast", "(A) However — (B) In conclusion", "(A) In brief — (B) Therefore", "(A) For instance — (B) In other words"], "ans": 1, "exp": "(A)는 유사성의 예시이므로 For example, (B)는 가시성이 행동 전염을 촉진하는 것과 대조되므로 By contrast가 알맞다.", "b": 1, "bb": "There are deep similarities between viral contagion and behavioral contagion. (A)__________, people in close or extended proximity to others infected by a virus are themselves more likely to become infected, just as people are more likely to drink excessively when they spend more time in the company of heavy drinkers.' (B)'(B)__________, we try to avoid others who are visibly ill. But there are also important differences between the two types of contagion. One is that visibility promotes behavioral contagion but inhibits the spread of infectious diseases. Solar panels that are visible from the street, for instance, are more likely to stimulate neighboring installations. In contrast, we try to avoid others who are visibly ill. Another important difference is that whereas viral contagion is almost always a bad thing, behavioral contagion is sometimes negative — as in the case of smoking — but sometimes positive, as in the case of solar installations."},

{"no": 342, "school": "혜화여고 (서울시)", "pref": "38", "type": "빈칸", "stem": "다음 빈칸 'One is that visibility (A)___ behavioral contagion but (B)___ the spread of infectious diseases.'에 들어갈 단어를 바르게 연결한 것은?", "p": "38-a", "choices": ["(A) help — (B) stop", "(A) reinforce — (B) bolster", "(A) hinder — (B) encourage", "(A) prevent — (B) inhibit", "(A) stimulate — (B) advance"], "ans": 1, "exp": "가시성은 행동 전염을 돕고(help) 감염병 확산은 막는다(stop).", "b": 1, "bb": "There are deep similarities between viral contagion and behavioral contagion. For example, people in close or extended proximity to others infected by a virus are themselves more likely to become infected, just as people are more likely to drink excessively when they spend more time in the company of heavy drinkers. But there are also important differences between the two types of contagion. One is that visibility (A)__________ behavioral contagion but (B)__________ the spread of infectious diseases. Solar panels that are visible from the street, for instance, are more likely to stimulate neighboring installations. In contrast, we try to avoid others who are visibly ill. Another important difference is that whereas viral contagion is almost always a bad thing, behavioral contagion is sometimes negative — as in the case of smoking — but sometimes positive, as in the case of solar installations.\n*contagion: 전염"},
{"no": 343, "school": "봉명고 (청주시)", "pref": "38", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "38-a", "choices": ["(A)-(C)-(B)", "(C)-(B)-(A)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(B)-(A)-(C)"], "ans": 2, "exp": "유사성의 예(C) → 차이점 중 첫째인 가시성(B) → 또 다른 차이점(Another important difference)(A) 순서이다.", "b": 1, "bb": "There are deep similarities between viral contagion and behavioral contagion.\n\n(A) In contrast, we try to avoid others who are visibly ill. Another important difference is that whereas viral contagion is almost always a bad thing, behavioral contagion is sometimes negative — as in the case of smoking — but sometimes positive, as in the case of solar installations.\n\n(B) But there are also important differences between the two types of contagion. One is that visibility promotes behavioral contagion but inhibits the spread of infectious diseases. Solar panels that are visible from the street, for instance, are more likely to stimulate neighboring installations.\n\n(C) For example, people in close or extended proximity to others infected by a virus are themselves more likely to become infected, just as people are more likely to drink excessively when they spend more time in the company of heavy drinkers."},

{"no": 347, "school": "산남고 (청주시)", "pref": "38", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "38-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 5, "exp": "유사점의 예시(C) → 차이점 1: 가시성(B) → 또 다른 차이점: 긍정/부정(A)의 순서이다.", "b": 2, "bb": "There are deep similarities between viral contagion and behavioral contagion.\n\n(A) In contrast, we try to avoid others who are visibly ill. Another important difference is that whereas viral contagion is almost always a bad thing, behavioral contagion is sometimes negative — as in the case of smoking — but sometimes positive, as in the case of solar installations.\n\n(B) But there are also important differences between the two types of contagion. One is that visibility promotes behavioral contagion but inhibits the spread of infectious diseases. Solar panels that are visible from the street, for instance, are more likely to stimulate neighboring installations.\n\n(C) For example, people in close or extended proximity to others infected by a virus are themselves more likely to become infected, just as people are more likely to drink excessively when they spend more time in the company of heavy drinkers."},

    b.className='fb'+(selectedTypes.has(g)?' on':'');
    b.innerHTML=g+'<small>'+n+'</small>';
    b.onclick=()=>{ if(selectedTypes.has(g)) selectedTypes.delete(g); else selectedTypes.add(g); renderTypeRow(); renderPassageGrid(); };
    row.appendChild(b);
  });
}
function setPerRef(n,btn){perRef=n;document.querySelectorAll('#cntRow .fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

// ── START ──────────────────────────────────────────
function goPassageSelect(){
  userSchool = document.getElementById('si').value;
  userName = document.getElementById('ni').value.trim();
  if(!userSchool){alert('학교를 선택해주세요!');return;}
  if(!userName){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bomnal_name',userName);localStorage.setItem('bomnal_school',userSchool);}catch(e){}
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('userInfo').textContent = userName + ' · ' + userSchool;
  _loadHist();
  renderTypeRow();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

// ── QUIZ ──────────────────────────────────────────
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 · ${q.b}차</span>
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(escHTML(q.body))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.textContent='💡 '+q.exp;fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID;
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 25년 6월 총괄 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고2_24년9월_총괄_학교기출',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>

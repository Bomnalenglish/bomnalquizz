// ── DATA ──────────────────────────────────────────
const PASS = {"19-a": "The passport control line was short and the inspectors looked relaxed; except the inspector at my window. He seemed to want to model the seriousness of the task at hand for the other inspectors. Maybe that's why I felt uneasy when he studied my passport more carefully than I expected. \"You were here in September,\" he said. \"Why are you back so soon?\" \"I came in September to prepare to return this month,\" I replied with a trembling voice, considering if I missed any Italian regulations. \"For how long?\" he asked. \"One month, this time,\" I answered truthfully. I knew it was not against the rules to stay in Italy for three months. \"Enjoy your stay,\" he finally said, as he stamped my passport. Whew! As I walked away, the burden I had carried, even though I did nothing wrong, vanished into the air. My shoulders, once weighed down, now stretched out with comfort.", "20-a": "Merely convincing your children that worry is senseless and that they would be more content if they didn't worry isn't going to stop them from worrying. For some reason, young people seem to believe that worry is a fact of life over which they have little or no control. Consequently, they don't even try to stop. Therefore, you need to convince them that worry, like guilt and fear, is nothing more than an emotion, and like all emotions, is subject to the power of the will. Tell them that they can eliminate worry from their lives by simply refusing to attend to it. Explain to them that if they refuse to act worried regardless of how they feel, they will eventually stop feeling worried and will begin to experience the contentment that accompanies a worry-free life.", "21-a": "In today's information age, in many companies and on many teams, the objective is no longer error prevention and replicability. On the contrary, it's creativity, speed, and keenness. In the industrial era, the goal was to minimize variation. But in creative companies today, maximizing variation is more essential. In these situations, the biggest risk isn't making a mistake or losing consistency; it's failing to attract top talent, to invent new products, or to change direction quickly when the environment shifts. Consistency and repeatability are more likely to suppress fresh thinking than to bring your company profit. A lot of little mistakes, while sometimes painful, help the organization learn quickly and are a critical part of the innovation cycle. In these situations, rules and process are no longer the best answer. A symphony isn't what you're going for. Leave the conductor and the sheet music behind. Build a jazz band instead.", "22-a": "Any new or threatening situation may require us to make decisions and this requires information. So important is communication during a disaster that normal social barriers are often lowered. We will talk to strangers in a way we would never consider normally. Even relatively low grade disruption of our life such as a fire drill or a very late train seems to give us the permission to break normal etiquette and talk to strangers. The more important an event to a particular public, the more detailed and urgent the requirement for news becomes. Without an authoritative source of facts, whether that is a newspaper or trusted broadcast station, rumours often run riot. Rumours start because people believe their group to be in danger and so, although the rumour is unproven, feel they should pass it on. For example, if a worker heard that their employer's business was doing badly and people were going to be made redundant, they would pass that information on to colleagues.", "23-a": "People seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place in which the art is created. In the case of science, however, opinions differ. Some scientists, like the great biologist J. B. S. Haldane, see science in a similar light — as a historical activity that occurs in a particular time and place, and that needs to be understood within that context. Others, however, see science as a purely \"objective\" pursuit, uninfluenced by the cultural viewpoint and values of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief that there is an underlying order of the world which is simply there to be discovered — the world of pure \"fact\" stripped of any link with value. The aim of science according to this view is to represent this world of pure \"fact\", independently of any relationship it might bear contingently to human practices and experiences.\n*contingently: 혹여라도", "24-a": "Mental development consists of individuals increasingly mastering social codes and signals themselves, which they can master only in social situations with the support of more competent individuals, typically adults. In this sense, mental development consists of internalizing social patterns and gradually becoming a responsible actor among other responsible actors. In Denmark, the age of criminal responsibility is 15 years, which means that we then say that people have developed sufficient mental maturity to be accountable for their actions at this point. And at the age of 18 people are given the right to vote and are thereby formally included in the basic democratic process. I do not know whether these age boundaries are optimal, but it is clear that mental development takes place at different rates for different individuals, and depends especially on the social and family environment they have been given. Therefore, having formal limits for responsibility from a specific age that apply to everyone is a somewhat questionable practice. But the question, of course, is whether it can be done any differently.", "25-a": "※ 25번 도표 문제는 문제에 적힌 수치와 문장을 보고 판단하세요.", "26-a": "Born in the English city of Liverpool, Charles Elton studied zoology under Julian Huxley at Oxford University from 1918 to 1922. After graduating, he began teaching as a part-time instructor and had a long and distinguished teaching career at Oxford from 1922 to 1967. After a series of arctic expeditions with Huxley, he worked with a fur-collecting and trading company as a biological consultant, and examined the company's records to study animal populations. In 1927, he wrote his first and most important book, Animal Ecology, in which he demonstrated the nature of food chains and cycles. In 1932, he helped establish the Bureau of Animal Population at Oxford. In the same year he became the editor of the new Journal of Animal Ecology. Throughout his career, Elton wrote six books and played a major role in shaping the modern science of ecology.", "29-a": "One well-known shift took place when the accepted view — that the Earth was the center of the universe — changed to one where we understood that we are only inhabitants on one planet orbiting the Sun. With each person who grasped the solar system view, it became easier for the next person to do so. So it is with the notion that the world revolves around the human economy. This is slowly being replaced by the view that the economy is a part of the larger system of material flows that connect all living things. When this perspective shifts into place, it will be obvious that our economic well-being requires that we account for, and respond to, factors of ecological health. Unfortunately we do not have a century or two to make the change. By clarifying the nature of the old and new perspectives, and by identifying actions on which we might cooperate to move the process along, we can help accelerate the shift.", "30-a": "The first human beings probably evolved in tropical regions where survival was possible without clothing. It is likely that they had very dark skin because light skin would have given little protection against the burning rays of the sun. There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, it is believed that in time they became capable of spreading out from Africa, eventually to most of the world. This was probably because their physical characteristics changed. For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently. More important, perhaps, was their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would have provided. Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually expand their territory.", "31-a": "When we get an unfavorable outcome, in some ways the last thing we want to hear is that the process was fair. As outraging as the combination of an unfavorable outcome and an unfair process is, this combination also brings with it a consolation prize: the possibility of attributing the bad outcome to something other than ourselves. We may reassure ourselves by believing that our bad outcome had little to do with us and everything to do with the unfair process. If the process is fair, however, we cannot nearly as easily externalize the outcome; we got what we got \"fair and square.\" When the process is fair we believe that our outcome is deserved, which is another way of saying that there must have been something about ourselves (what we did or who we are) that caused the outcome.", "32-a": "The well-known American ethnologist Alfred Louis Kroeber made a rich and in-depth study of women's evening dress in the West, stretching back about three centuries and using reproductions of engravings. Having adjusted the dimensions of these plates due to their diverse origins, he was able to analyse the constant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical. He reduced women's clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. He demonstrated unambiguously that fashion is a profoundly regular phenomenon which is not located at the level of annual variations but on the scale of history. For practically 300 years, women's dress was subject to a very precise periodic cycle: forms reach the furthest point in their variations every fifty years. If, at any one moment, skirts are at their longest, fifty years later they will be at their shortest; thus skirts become long again fifty years after being short and a hundred years after being long.", "33-a": "Over the last few centuries, humanity's collective prosperity has skyrocketed, as technological progress has made us far wealthier than ever before. To share out those riches, almost all societies have settled upon the market mechanism, rewarding people in various ways for the work that they do and the things that they own. But rising inequality, itself often driven by technology, has started to put that mechanism under strain. Today, markets already provide immense rewards to some people but leave many others with very little. And now, technological unemployment threatens to become a more radical version of the same story, taking place in the particular market we rely upon the most: the labor market. As that market begins to break down, more and more people will be in danger of not receiving a share of society's prosperity at all.", "34-a": "It's often said that those who can't do, teach. It would be more accurate to say that those who can do, can't teach the basics. A great deal of expert knowledge is implicit, not explicit. The further you progress toward mastery, the less conscious awareness you often have of the fundamentals. Experiments show that skilled golfers and wine aficionados have a hard time describing their putting and tasting techniques — even asking them to explain their approaches is enough to interfere with their performance, so they often stay on autopilot. When I first saw an elite diver do four and a half somersaults, I asked how he managed to spin so fast. His answer: \"Just go up in a ball.\" Experts often have an intuitive understanding of a route, but they struggle to clearly express all the steps to take. Their brain dump is partially filled with garbage.\n*aficionado: 애호가 **somersault: 공중제비", "35-a": "Minimal processing can be one of the best ways to keep original flavors and taste, without any need to add artificial flavoring or additives, or too much salt. This would also be the efficient way to keep most nutrients, especially the most sensitive ones such as many vitamins and anti-oxidants. Milling of cereals is one of the most harsh processes which dramatically affect nutrient content. While grains are naturally very rich in micronutrients, anti-oxidants and fiber (i.e. in wholemeal flour or flakes), milling usually removes the vast majority of minerals, vitamins and fibers to raise white flour. Such a spoilage of key nutrients and fiber is no longer acceptable in the context of a sustainable diet aiming at an optimal nutrient density and health protection. In contrast, fermentation of various foodstuffs or germination of grains are traditional, locally accessible, low-energy and highly nutritious processes of sounded interest.\n*fermentation: 발효 **germination: 발아", "36-a": "It would seem obvious that the more competent someone is, the more we will like that person. By \"competence,\" I mean a cluster of qualities: smartness, the ability to get things done, wise decisions, etc. We stand a better chance of doing well at our life tasks if we surround ourselves with people who know what they're doing and have a lot to teach us. But the research evidence is paradoxical: In problem-solving groups, the participants who are considered the most competent and have the best ideas tend not to be the ones who are best liked. Why? One possibility is that, although we like to be around competent people, those who are too competent make us uncomfortable. They may seem unapproachable, distant, superhuman — and make us look bad (and feel worse) by comparison. If this were true, we might like people more if they reveal some evidence of fallibility. For example, if your friend is a brilliant mathematician, superb athlete, and gourmet cook, you might like him or her better if, every once in a while, they screwed up.", "37-a": "A computational algorithm that takes input data and generates some output from it doesn't really embody any notion of meaning. Certainly, such a computation does not generally have as its purpose its own survival and wellbeing. It does not, in general, assign value to the inputs. Compare, for example, a computer algorithm with the waggle dance of the honeybee, by which means a foraging bee conveys to others in the hive information about the source of food (such as nectar) it has located. The \"dance\" — a series of stylized movements on the comb — shows the bees how far away the food is and in which direction. But this input does not simply program other bees to go out and look for it. Rather, they evaluate this information, comparing it with their own knowledge of the surroundings. Some bees might not bother to make the journey, considering it not worthwhile. The input, such as it is, is processed in the light of the organism's own internal states and history; there is nothing prescriptive about its effects.", "38-a": "There are deep similarities between viral contagion and behavioral contagion. For example, people in close or extended proximity to others infected by a virus are themselves more likely to become infected, just as people are more likely to drink excessively when they spend more time in the company of heavy drinkers. But there are also important differences between the two types of contagion. One is that visibility promotes behavioral contagion but inhibits the spread of infectious diseases. Solar panels that are visible from the street, for instance, are more likely to stimulate neighboring installations. In contrast, we try to avoid others who are visibly ill. Another important difference is that whereas viral contagion is almost always a bad thing, behavioral contagion is sometimes negative — as in the case of smoking — but sometimes positive, as in the case of solar installations.\n*contagion: 전염", "39-a": "Sleep is clearly about more than just resting. One curious fact is that animals that are hibernating also have periods of sleep. It comes as a surprise to most of us, but hibernation and sleep are not the same thing at all, at least not from a neurological and metabolic perspective. Hibernating is more like being anesthetized: the subject is unconscious but not actually asleep. So a hibernating animal needs to get a few hours of conventional sleep each day within the larger unconsciousness. A further surprise to most of us is that bears, the most famous of wintry sleepers, don't actually hibernate. Real hibernation involves profound unconsciousness and a dramatic fall in body temperature — often to around 32 degrees Fahrenheit. By this definition, bears don't hibernate, because their body temperature stays near normal and they are easily awakened. Their winter sleeps are more accurately called a state of torpor.", "40-a": "The concern about how we appear to others can be seen in children, though work by the psychologist Ervin Staub suggests that the effect may vary with age. In a study where children heard another child in distress, young children (kindergarten through second grade) were more likely to help the child in distress when with another child than when alone. But for older children — in fourth and sixth grade — the effect reversed: they were less likely to help a child in distress when they were with a peer than when they were alone. Staub suggested that younger children might feel more comfortable acting when they have the company of a peer, whereas older children might feel more concern about being judged by their peers and fear feeling embarrassed by overreacting. Staub noted that \"older children seemed to discuss the distress sounds less and to react to them less openly than younger children.\" In other words, the older children were deliberately putting on a poker face in front of their peers.", "42-a": "What makes questioning authority so hard? The difficulties start in childhood, when parents — the first and most powerful authority figures — show children \"the way things are.\" This is a necessary element of learning language and socialization, and certainly most things learned in early childhood are noncontroversial: the English alphabet starts with A and ends with Z, the numbers 1 through 10 come before the numbers 11 through 20, and so on. Children, however, will spontaneously question things that are quite obvious to adults and even to older kids. The word \"why?\" becomes a challenge, as in, \"Why is the sky blue?\" Answers such as \"because it just is\" or \"because I say so\" tell children that they must unquestioningly accept what authorities say \"just because,\" and children who persist in their questioning are likely to find themselves dismissed or yelled at for \"bothering\" adults with \"meaningless\" or \"unimportant\" questions. But these questions are in fact perfectly reasonable. Why is the sky blue? Many adults do not themselves know the answer. And who says the sky's color needs to be called \"blue,\" anyway? How do we know that what one person calls \"blue\" is the same color that another calls \"blue\"? The scientific answers come from physics, but those are not the answers that children are seeking. They are trying to understand the world, and no matter how irritating the repeated questions may become to stressed and time-pressed parents, it is important to take them seriously to encourage kids to question authority to think for themselves.", "45-a": "My two girls grew up without challenges with respect to development and social interaction. My son Benjamin, however, was quite delayed. He struggled through his childhood, not fitting in with the other children and wondering what he was doing wrong at every turn. He was teased by the other children and frowned upon by a number of unsympathetic adults. But his Grade 1 teacher was a wonderful, caring person who took the time to ask why Benjamin behaved the way he did.\n\nOne day he came home with a note from his teacher. He suggested I go to the school library. They were having a sale, and he thought my son would like one of the books. I couldn't go for a couple of days and was concerned I'd missed the opportunity. When I finally went to the school, his teacher told me that the sale had ended but that the library had saved the book for my little boy.\n\nIt was a storyboard book with a place for a photo. On each page there was an outline of an animal and a hole so that the face in the photo appeared to be the face of the animal. Wondering if Benjamin would really be interested in the book, I brought it home. He loved it! Through that book, he saw that he could be anything he wanted to be: a cat, an octopus, a dinosaur — even a frog!\n\nAnd thankfully, his teacher had taken the time to observe and understand him and had discovered a way to help him reach out of his own world and join ours through a storyboard book. My son later became a child actor and performed for seven years with a Toronto casting agency. He is now a published author who writes fantasy and science-fiction! Who would have guessed?"};

{"no": 3, "school": "성도고 (부산시)", "pref": "19", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "19-a", "choices": ["ⓐ model", "ⓑ carefree", "ⓒ prepare", "ⓓ long", "ⓔ comfort"], "ans": 2, "exp": "ⓑ carefree → uneasy: 심사관이 여권을 꼼꼼히 살펴 불안해진 상황이다.", "b": 4, "bb": "[학교 변형 지문]\nThe passport control line was short and the inspectors looked relaxed; except the inspector at my window. He seemed to want to ⓐmodel the seriousness of the task at hand for the other inspectors. Maybe that's why I felt ⓑ carefree when he studied my passport more carefully than I expected. \"You were here in September,\" he said. \"Why are you back so soon?\" \"I came in September to ⓒ prepare to return this month,\" I replied with a trembling voice, considering if I missed any Italian regulations. \"For how ⓓlong?\" he asked. \"One month, this time,\" I answered truthfully. I knew it was not against the rules to stay in Italy for three months. \"Enjoy your stay,\" he finally said, as he stamped my passport. Whew! As I walked away, the burden I had carried, even though I did nothing wrong, vanished into the air. My shoulders, once weighed down, now stretched out with ⓔcomfort."},

{"no": 5, "school": "인항고 (인천시)", "pref": "20", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 아이들은 걱정이 통제할 수 없는 삶의 일부라고 믿음 ② 그래서 걱정을 멈추려 하지도 않음 ③ 걱정은 의지의 힘에 따르는 감정일 뿐임을 납득시켜야 함 ④ 'Tell them that worry can be beneficial when it prompts them to prepare for potential challenges.' ⑤ 걱정하는 듯 행동하지 않으면 결국 걱정이 사라지고 만족을 경험하게 됨)", "p": "20-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "④는 걱정이 유익할 수 있다는 내용으로, 걱정을 의지로 없애야 한다는 글의 흐름과 맞지 않습니다.", "b": 1, "bb": "[학교 변형 지문]\nMerely convincing your children that worry is senseless and that they would be more content if they didn't worry isn't going to stop them from worrying. ⓐFor some reason, young people seem to believe that worry is a fact of life over which they have little or no control. ⓑConsequently, they don't even try to stop. ⓒTherefore, you need to convince them that worry, like guilt and fear, is nothing more than an emotion, and like all emotions, is subject to the power of the will. ⓓTell them that worry can be beneficial when it prompts them to prepare for potential challenges. ⓔExplain to them that if they refuse to act worried regardless of how they feel, they will eventually stop feeling worried and will begin to experience the contentment that accompanies a worry-free life."},
{"no": 6, "school": "남동고 (인천시)", "pref": "20", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "20-a", "choices": ["ⓐ to worry", "ⓑ which", "ⓒ is", "ⓓ it", "ⓔ experiencing"], "ans": 5, "exp": "ⓔ experiencing → will begin to experience: will eventually stop과 병렬 구조가 되어야 합니다.", "b": 1, "bb": "[학교 변형 지문]\nMerely convincing your children that worry is senseless and that they would be more content if they didn't worry does not forbid them ⓐto worry. For some reason, young people seem to believe that worry is a fact of life ⓑwhich they have little or no control over. Consequently, they don't even try to stop. Therefore, you need to convince them that worry, like guilt and fear, is nothing more than an emotion, and like all emotions, ⓒis subject to the power of the will. Tell them that they can eliminate worry from their lives by simply refusing to attend to ⓓit. Explain to them that if they refuse to act worried regardless of how they feel, they will eventually stop feeling worried and ⓔexperiencing the contentment that accompanies a worry-free life."},

{"no": 8, "school": "월계고 (서울시)", "pref": "20", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "20-a", "choices": ["ⓐ satisfied", "ⓑ controllable", "ⓒ subject", "ⓓ promote", "ⓔ comes along"], "ans": 4, "exp": "ⓓ promote → eliminate: 걱정에 신경 쓰지 않음으로써 걱정을 없앨 수 있다는 문맥입니다.", "b": 1, "bb": "[학교 변형 지문]\nMerely convincing your children that worry is senseless and that they would be more ⓐsatisfied if they didn't worry isn't going to stop them from worrying. For some reason, young people seem to believe that worry is anything but ⓑcontrollable. Consequently, they don't even try to stop. Therefore, you need to convince them that worry, like guilt and fear, is nothing more than an emotion, and like all emotions, is ⓒsubject to the power of the will. Tell them that they can ⓓpromote worry by simply refusing to attend to it. Explain to them that if they refuse to act worried regardless of how they feel, they will eventually stop feeling worried and will begin to experience the contentment that ⓔcomes along a worry-free life."},

{"no": 61, "school": "공주여고 (공주시)", "pref": "22", "type": "어휘", "stem": "밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "22-a", "choices": ["ⓐ crucial", "ⓑ inappropriate", "ⓒ spread", "ⓓ struggling", "ⓔ share"], "ans": 2, "exp": "ⓑ inappropriate → appropriate: 작은 혼란도 평소 예절을 깨고 낯선 이와 대화해도 된다고 느끼게 한다는 문맥이다.", "b": 5, "bb": "[학교 변형 지문]\nIn any new or threatening situation, making decisions often demands obtaining information. So ⓐcrucial is communication during a disaster that normal social barriers are often lowered. We will talk to strangers in a way we would never consider normally. Interestingly, even small disruptions can sometimes lead us to feel that it is entirely ⓑinappropriate to break usual etiquette and talk to strangers. The greater the significance of an event to a specific audience, the more detailed and urgent the requirement for news becomes. Without an authoritative source of facts, whether that is a newspaper or trusted broadcast station, rumours often ⓒspread quickly. Rumours emerge when individuals, fearing for their group's safety and so, although the rumour is unproven feel, they should pass it on. For instance, if an employee hears that their company is ⓓstruggling and people are going to be made redundant, they are likely to ⓔshare this news with their colleagues."},
{"no": 62, "school": "송천고 (인천시)", "pref": "22", "type": "빈칸", "stem": "다음 빈칸 'So, ___. We will talk to strangers in a way we would never consider normally.'에 들어갈 말로 가장 적절한 것은?", "p": "22-a", "choices": ["the use of trustworthy sources is essential", "it is important to make decisions based on facts", "information sharing can reduce decision-making quality", "information control and privacy are crucial in digital age", "the need for information drives people to communicate"], "ans": 5, "exp": "새로운 상황에서 정보가 필요하므로 정보에 대한 필요가 낯선 사람과도 소통하게 만든다는 흐름이다.", "b": 5, "bb": "Any new or threatening situation may require us to make decisions and this requires information. So, __________. We will talk to strangers in a way we would never consider normally. Even relatively low grade disruption of our life such as a fire drill or a very late train seems to give us the permission to break normal etiquette and talk to strangers. The more important an event to a particular public, the more detailed and urgent the requirement for news becomes. Without an authoritative source of facts, whether that is a newspaper or trusted broadcast station, rumours often run riot. Rumours start because people believe their group to be in danger and so, although the rumour is unproven, feel they should pass it on. For example, if a worker heard that their employer's business was doing badly and people were going to be made redundant, they would pass that information on to colleagues."},
{"no": 63, "school": "초은고 (인천시)", "pref": "23", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "23-a", "choices": ["ⓐ differ", "ⓑ similar", "ⓒ unaffected", "ⓓ related", "ⓔ regardless"], "ans": 4, "exp": "ⓓ related → unrelated: 순수한 '사실'의 세계는 가치와의 연결이 없는 세계입니다.", "b": 1, "bb": "[학교 변형 지문]\nPeople seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place in which the art is created. In the case of science, however, opinions ⓐdiffer. Some scientists, like the great biologist J. B. S. Haldane, see science in a ⓑsimilar light - as a historical activity that occurs in a particular time and place, and that needs to be understood within that context. Others, however, see science as a purely \"objective\" pursuit, ⓒunaffected by the cultural viewpoint and values of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief that there is an underlying order of the world which is simply there to be discovered - the world of pure \"fact\" ⓓrelated to any link with value. The aim of science according to this view is to represent this world of pure \"fact\", ⓔregardless of any relationship it might bear contingently to human practices and experiences."},
{"no": 64, "school": "해원고 (인천시)", "pref": "23", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "23-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 5, "exp": "과학에 대한 의견이 갈린다는 (C) 뒤에 반대 견해인 (B), 그 견해에 따른 과학의 목적인 (A)가 이어집니다.", "b": 1, "bb": "People seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place in which the art is created.\n\n(A) The aim of science according to this view is to represent this world of pure \"fact\", independently of any relationship it might bear contingently to human practices and experiences.\n\n(B) Others, however, see science as a purely \"objective\" pursuit, uninfluenced by the cultural viewpoint and values of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief that there is an underlying order of the world which is simply there to be discovered — the world of pure \"fact\" stripped of any link with value.\n\n(C) In the case of science, however, opinions differ. Some scientists, like the great biologist J. B. S. Haldane, see science in a similar light — as a historical activity that occurs in a particular time and place, and that needs to be understood within that context."},
{"no": 65, "school": "영생고 (수원시)", "pref": "23", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "23-a", "choices": ["ⓐ which the art is created in", "ⓑ uninfluenced by the cultural viewpoint and values", "ⓒ which there is an underlying order of the world", "ⓓ that is simply there to be discovered", "ⓔ stripped of any link with value"], "ans": 3, "exp": "ⓒ which → that: the belief와 동격인 완전한 절을 이끄는 동격 접속사 that이 필요합니다.", "b": 1, "bb": "[학교 변형 지문]\nPeople seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place ⓐ [which the art is created in]. In the case of science, however, opinions differ. Some scientists, like the great biologist J. B. S. Haldane, see science in a similar light – as a historical activity that occurs in a particular time and place, and that needs to be understood within that context. Others, however, see science as a purely \"objective\" pursuit, ⓑ[uninfluenced by the cultural viewpoint and values] of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief ⓒ[which there is an underlying order of the world] ⓓ[that is simply there to be discovered] – the world of pure \"fact\" ⓔ[stripped of any link with value]. The aim of science according to this view is to represent this world of pure \"fact\", independently of any relationship it might bear contingently to human practices and experiences.\n*contingently: 혹여라도"},

{"no": 79, "school": "삼문고 (김해시)", "pref": "23", "type": "어휘", "stem": "밑줄 친 표현이 가장 적절하지 못한 것은?", "p": "23-a", "choices": ["ⓐ perspective", "ⓑ affected", "ⓒ order", "ⓓ free", "ⓔ regardless"], "ans": 2, "exp": "ⓑ affected → unaffected: 과학을 순수하게 '객관적인' 활동으로 보는 관점이므로 문화의 영향을 받지 않는다고 해야 한다.", "b": 5, "bb": "[학교 변형 지문]\nPeople seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place in which the art is created. In the case of science, however, opinions differ. Some scientists, like the great biologist J. B. S. Haldane, see science in a similar ⓐperspective - as a historical activity that occurs in a particular time and place, and that needs to be understood within that context. Others, however, see science as a purely \"objective\" pursuit, ⓑaffected by the cultural viewpoint and values of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief that there is an underlying ⓒorder of the world which is simply there to be discovered - the world of pure \"fact\" ⓓfree from any link with value. The aim of science according to this view is to represent this world of pure \"fact\", ⓔregardless of any relationship it might bear contingently to human practices and experiences.\n*contingently: 혹여라도"},

{"no": 81, "school": "권선고 (수원시)", "pref": "23", "type": "빈칸", "stem": "다음 빈칸 'The aim of science according to this view is to represent this world of pure \"fact\", ___.'에 들어갈 말로 가장 적절한 것은?", "p": "23-a", "choices": ["describing the personal biases of the researchers", "shaped by the societal and historical conditions of the time", "reflecting the values and viewpoints of the culture in which it is conducted", "separate from any connections to human activities and experiences", "influenced by the cultural context and the subjective perspectives of the scientists involved"], "ans": 4, "exp": "이 관점에서 과학은 인간의 활동·경험과 무관한 순수한 사실의 세계를 표현하는 것을 목표로 한다.", "b": 5, "bb": "People seem to recognize that the arts are cultural activities that draw on (or react against) certain cultural traditions, certain shared understanding, and certain values and ideas that are characteristic of the time and place in which the art is created. In the case of science, however, opinions differ. Some scientists, like the great biologist J. B. S. Haldane, see science in a similar light — as a historical activity that occurs in a particular time and place, and that needs to be understood within that context. Others, however, see science as a purely \"objective\" pursuit, uninfluenced by the cultural viewpoint and values of those who create it. In describing this view of science, philosopher Hugh Lacey speaks of the belief that there is an underlying order of the world which is simply there to be discovered — the world of pure \"fact\" stripped of any link with value. The aim of science according to this view is to represent this world of pure \"fact\", __________.\n*contingently: 혹여라도"},
{"no": 82, "school": "남동고 (인천시)", "pref": "24", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "24-a", "choices": ["ⓐ mastering", "ⓑ where", "ⓒ granting", "ⓓ mentally", "ⓔ are"], "ans": 3, "exp": "ⓒ granting → granted: individuals가 투표권을 '부여받는' 수동 관계입니다.", "b": 1, "bb": "[학교 변형 지문]\nMental development consists of individuals increasingly ⓐ mastering social codes and signals themselves, which they can master only in social situations with the support of more competent individuals, typically adults. In this view, mental development entails internalizing societal patterns and gradually becoming one of many responsible players. Since the age of criminal responsibility in Denmark is fifteen, we can conclude that individuals have reached a stage of mental development ⓑwhere they can be held liable for their conduct. Additionally, individuals ⓒgranting the ability to vote at the age of 18 formally join the democratic process. I'm not sure if these age ranges are ideal, but it's undeniable that everyone develops ⓓ mentally at a different rate, with social and familial environments playing a major role. Therefore, setting explicit age restrictions on responsibility that ⓔare applicable to all people is a somewhat questionable practice. But the question, of course, is whether it can be done any differently."},
{"no": 83, "school": "군산동고 (군산시)", "pref": "24", "type": "내용불일치", "stem": "다음 글에 관한 내용으로 적절하지 않은 것은?", "p": "24-a", "choices": ["정신적 발달은 사회적 규범과 신호를 습득하는 것이다.", "더 유능한 개인들에 도움을 받아 정신적 발달을 할 수 있다.", "덴마크에서는 18살이 되면 민주적 과정에 공식적으로 포함된다.", "선천적으로 특정 연령경계에 따라 정신적 발달은 이루어진다.", "특정 연령부터 모든 사람에게 적용되는 책임에 대한 공식적인 제한을 두는 것은 다소 의심스러운 관행이다."], "ans": 4, "exp": "정신적 발달은 개인마다 속도가 다르고 사회적·가정 환경에 좌우된다고 했으므로 ④는 틀립니다.", "b": 1},
{"no": 84, "school": "봉명고 (청주시)", "pref": "24", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "24-a", "choices": ["(A)-(B)-(C)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 5, "exp": "사회적 패턴의 내면화와 덴마크의 15세 기준(C) → 18세 투표권과 발달 속도 차이(B) → 연령 제한의 문제 제기(A) 순입니다.", "b": 1, "bb": "Mental development consists of individuals increasingly mastering social codes and signals themselves, which they can master only in social situations with the support of more competent individuals, typically adults.\n\n(A) Therefore, having formal limits for responsibility from a specific age that apply to everyone is a somewhat questionable practice. But the question, of course, is whether it can be done any differently.\n\n(B) And at the age of 18 people are given the right to vote and are thereby formally included in the basic democratic process. I do not know whether these age boundaries are optimal, but it is clear that mental development takes place at different rates for different individuals, and depends especially on the social and family environment they have been given.\n\n(C) In this sense, mental development consists of internalizing social patterns and gradually becoming a responsible actor among other responsible actors. In Denmark, the age of criminal responsibility is 15 years, which means that we then say that people have developed sufficient mental maturity to be accountable for their actions at this point."},
{"no": 85, "school": "상일고 (군산시)", "pref": "24", "type": "어휘", "stem": "다음 글의 밑줄 친 ⓐ~ⓔ 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "24-a", "choices": ["ⓐ capable", "ⓑ enough", "ⓒ fundamental", "ⓓ similar", "ⓔ particular"], "ans": 4, "exp": "ⓓ similar → different: 정신적 발달은 개인마다 다른 속도로 진행된다.", "b": 2, "bb": "[학교 변형 지문]\nMental development consists of individuals increasingly mastering social codes and signals themselves, which they can master only in social situations with the support of more ⓐcapable individuals, typically adults. In this sense, mental development consists of internalizing social patterns and gradually becoming a responsible actor among other responsible actors. In Denmark, the age of criminal responsibility is 15 years, which means that we then say that people have developed ⓑenough mental maturity to be accountable for their actions at this point. And at the age of 18 people are given the right to vote and are thereby formally included in the ⓒfundamental democratic process. I do not know whether these age boundaries are optimal, but it is clear that mental development takes place at ⓓsimilar rates for different individuals, and depends especially on the social and family environment they have been given. Therefore, having formal limits for responsibility from a ⓔparticular age that apply to everyone is a somewhat questionable practice. But the question, of course, is whether it can be done any differently."},

{"no": 100, "school": "고촌고 (김포시)", "pref": "24", "type": "내용불일치(복수)", "stem": "다음 글과 일치하지 않는 것만을 있는 대로 고른 것은?", "p": "24-a", "choices": ["ⓐ, ⓓ", "ⓑ, ⓔ", "ⓐ, ⓓ, ⓕ", "ⓑ, ⓒ, ⓔ", "ⓒ, ⓓ, ⓕ"], "ans": 4, "exp": "ⓑ irresponsible → responsible, ⓒ immature → mature, ⓔ similar → different rates이어야 본문과 일치한다.", "b": 4, "bb": "[학교 변형 지문]\nMental development consists of individuals increasingly mastering social codes and signals themselves, which they can master only in social situations with the support of more competent individuals, typically adults. In this sense, mental development consists of internalizing social patterns and gradually becoming a responsible actor among other responsible actors. In Denmark, the age of criminal responsibility is 15 years, which means that we then say that people have developed sufficient mental maturity to be accountable for their actions at this point. And at the age of 18 people are given the right to vote and are thereby formally included in the basic democratic process. I do not know whether these age boundaries are optimal, but it is clear that mental development takes place at different rates for different individuals, and depends especially on the social and family environment they have been given. Therefore, having formal limits for responsibility from a specific age that apply to everyone is a somewhat questionable practice. But the question, of course, is whether it can be done any differently. ⓐ Mental development is the process by which individuals gradually acquire over social norms and signals, typically with guidance from more experienced people, usually adults, only within social contexts. ⓑ Mental development involves internalizing social patterns and evolving into a responsible member of society among other irresponsible individuals. ⓒ In Denmark, the criminal responsibility age is set at 15, indicating that individuals are considered mentally immature at that point to be accountable for their actions. ⓓ At 18, individuals are granted voting rights, formally integrating them into the democratic process in Denmark. ⓔ Whether these age limits are optimal remains unclear, yet it's evident that mental development progresses at similar rates for each person and is especially shaped by their social and family environment. ⓕ Imposing a specific age threshold for responsibility is somewhat debatable. The real question, however, is whether it's feasible to implement it differently."},

{"no": 132, "school": "성도고 (부산시)", "pref": "29", "type": "어법", "stem": "밑줄 친 부분 중 어법상 어색한 것은?", "p": "29-a", "choices": ["ⓐ where", "ⓑ doing so", "ⓒ being", "ⓓ requires", "ⓔ on which"], "ans": 2, "exp": "ⓑ doing so → to do so: 가주어 it의 진주어로 to부정사가 필요하다.", "b": 5, "bb": "[학교 변형 지문]\nOne well-known shift took place when the accepted view ― that the Earth was the center of the universe ― changed to one ⓐwhere we understood that we are only inhabitants on one planet orbiting the Sun. With each person who grasped the solar system view, it became easier for the next person ⓑdoing so. So it is with the notion that the world revolves around the human economy. This is slowly ⓒbeing replaced by the view that the economy is a part of the larger system of material flows that connect all living things. When this perspective shifts into place, it will be obvious that our economic well-being ⓓrequires that we account for, and respond to, factors of ecological health. Unfortunately we do not have a century or two to make the change. By clarifying the nature of the old and new perspectives, and by identifying actions ⓔon which we might cooperate to move the process along, we can help accelerate the shift."},
{"no": 133, "school": "권선고 (수원시)", "pref": "29", "type": "어휘", "stem": "밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "29-a", "choices": ["ⓐ perceived", "ⓑ revolves", "ⓒ solidified", "ⓓ obvious", "ⓔ facilitate"], "ans": 3, "exp": "ⓒ solidified → replaced: 인간 경제 중심의 관점이 새로운 관점으로 대체되고 있다는 문맥이다.", "b": 5, "bb": "[학교 변형 지문]\nOne well-known shift took place when the accepted view – that the Earth was the center of the universe – changed to one where we understood that we are only inhabitants on one planet orbiting the Sun. With each person who ⓐ perceived the solar system view, it became easier for the next person to do so. So it is with the notion that the world ⓑrevolves around the human economy. This is slowly being ⓒsolidified by the view that the economy is a part of the larger system of material flows that connect all living things. When this perspective shifts into place, it will be ⓓobvious that our economic well-being requires that we account for, and respond to, factors of ecological health. Unfortunately we do not have a century or two to make the change. By clarifying the nature of the old and new perspectives, and by identifying actions on which we might cooperate to move the process along, we can help ⓔfacilitate the shift."},
{"no": 134, "school": "백양고 (부산시)", "pref": "29", "type": "빈칸", "stem": "다음 빈칸 'This is slowly being replaced by the view that the economy is ___.'에 들어갈 말로 가장 적절한 것은?", "p": "29-a", "choices": ["independent of environmental limitations", "the driving force of planetary change", "inherently disconnected from nature", "an unstoppable machine of progress", "subordinate to ecological systems"], "ans": 5, "exp": "세상이 인간 경제를 중심으로 돈다는 관점이 경제가 생태계에 종속된다는 관점으로 대체되고 있다.", "b": 5, "bb": "One well-known shift took place when the accepted view — that the Earth was the center of the universe — changed to one where we understood that we are only inhabitants on one planet orbiting the Sun. With each person who grasped the solar system view, it became easier for the next person to do so. So it is with the notion that the world revolves around the human economy. This is slowly being replaced by the view that the economy is __________. When this perspective shifts into place, it will be obvious that our economic well-being requires that we account for, and respond to, factors of ecological health. Unfortunately we do not have a century or two to make the change. By clarifying the nature of the old and new perspectives, and by identifying actions on which we might cooperate to move the process along, we can help accelerate the shift."},
{"no": 135, "school": "칠보고 (수원시)", "pref": "29", "type": "어휘", "stem": "밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "29-a", "choices": ["ⓐ accepted", "ⓑ easier", "ⓒ connect", "ⓓ change", "ⓔ delay"], "ans": 5, "exp": "ⓔ delay → accelerate: 시간이 없으므로 변화를 가속화하도록 도울 수 있다는 문맥이다.", "b": 5, "bb": "[학교 변형 지문]\nOne well-known shift took place when the ⓐaccepted view ― that the Earth was the center of the universe ― changed to one where we understood that we are only inhabitants on one planet orbiting the Sun. With each person who grasped the solar system view, it became ⓑ easier for the next person to do so. So it is with the notion that the world revolves around the human economy. This is slowly being replaced by the view that the economy is a part of the larger system of material flows that ⓒconnect all living things. When this perspective shifts into place, it will be obvious that our economic well-being requires that we account for, and respond to, factors of ecological health. Unfortunately we do not have a century or two to make the ⓓchange. By clarifying the nature of the old and new perspectives, and by identifying actions on which we might cooperate to move the process along, we can help ⓔdelay the shift."},
{"no": 136, "school": "신흥고 (청주시)", "pref": "30", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "30-a", "choices": ["ⓐ dark", "ⓑ spreading", "ⓒ upright", "ⓓ consume", "ⓔ contract"], "ans": 5, "exp": "ⓔ contract → expand: 식단이 확대되면서 영역을 넓힐 수 있었다는 문맥입니다.", "b": 1, "bb": "[학교 변형 지문]\nThe first human beings probably evolved in tropical regions where survival was possible without clothing. It is likely that they had very ⓐdark skin because light skin would have given little protection against the burning rays of the sun. There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, it is believed that in time they became capable of ⓑspreading out from Africa, eventually to most of the world. This was probably because their physical characteristics changed. For instance, early hominids probably did not walk ⓒupright, but when they developed that ability, they could travel more efficiently. More important, perhaps, was their development of tool making. With tools, they could hunt other animals, so they could ⓓconsume more protein and fat than their low-energy vegetarian diet would have provided. Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually ⓔcontract their territory."},
{"no": 137, "school": "혜화여고 (서울시)", "pref": "30", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] This was probably because their physical characteristics changed.", "p": "30-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 4, "exp": "아프리카에서 퍼져 나갈 수 있게 된 이유(신체적 특징의 변화)를 밝힌 뒤 직립 보행이라는 예시(For instance)가 이어져야 합니다.", "b": 1, "bb": "The first human beings probably evolved in tropical regions where survival was possible without clothing. ( ① ) It is likely that they had very dark skin because light skin would have given little protection against the burning rays of the sun. ( ② ) There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. ( ③ ) Whichever the case, it is believed that in time they became capable of spreading out from Africa, eventually to most of the world. ( ④ ) For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently. ( ⑤ ) More important, perhaps, was their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would have provided. Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually expand their territory."},
{"no": 138, "school": "봉명고 (청주시)", "pref": "30", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "30-a", "choices": ["(A)-(B)-(C)", "(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)"], "ans": 2, "exp": "아프리카에서의 확산(A) → 그 원인인 신체 변화와 도구 제작(C) → 도구로 인한 식단·영역 확장(B) 순입니다.", "b": 1, "bb": "The first human beings probably evolved in tropical regions where survival was possible without clothing. It is likely that they had very dark skin because light skin would have given little protection against the burning rays of the sun.\n\n(A) There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, it is believed that in time they became capable of spreading out from Africa, eventually to most of the world.\n\n(B) With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would have provided. Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually expand their territory.\n\n(C) This was probably because their physical characteristics changed. For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently. More important, perhaps, was their development of tool making."},
{"no": 139, "school": "제일고 (군산시)", "pref": "30", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "30-a", "choices": ["ⓐ which", "ⓑ because", "ⓒ as", "ⓓ would have been changed", "ⓔ expanded"], "ans": 5, "exp": "ⓔ Their diet expanded → As their diet expanded: 주절과 연결하려면 부사절 접속사가 필요합니다.", "b": 1, "bb": "[학교 변형 지문]\nThe first human beings probably evolved in tropical regions ⓐwhich survival was possible without clothing in. It is likely that they had very dark skin because light skin would have given little protection against the burning rays of the sun. There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, it is believed that in time they became capable of spreading out from Africa, eventually to most of the world. This was probably ⓑbecause their physical characteristics changed. For instance, early hominids probably did not walk upright, but ⓒas they developed that ability, they could travel more efficiently. More important, perhaps, was their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would have provided. Not only their bodies but also their brains ⓓwould have been changed with more energy. The brain needs lots of energy to grow. Their diet ⓔexpanded, hominids could physically and intellectually expand their territory."},

{"no": 141, "school": "연수여고 (인천시)", "pref": "30", "type": "요약", "stem": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은? 요약 - 'Early humans likely (A)___ over time in tropical areas, establishing physical and intellectual traits that allowed them to (B)___ across the world.'", "p": "30-a", "choices": ["(A) developed — (B) disperse", "(A) evolved — (B) diminish", "(A) contracted — (B) survive", "(A) thrived — (B) perish", "(A) declined — (B) spread"], "ans": 1, "exp": "초기 인류는 열대 지역에서 발달(developed)하여 전 세계로 퍼질(disperse) 수 있는 특성을 갖추었습니다.", "b": 1},
{"no": 142, "school": "대암고 (창원시)", "pref": "30", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "30-a", "choices": ["(B)-(D)-(C)-(A)", "(B)-(C)-(A)-(D)", "(B)-(D)-(A)-(C)", "(C)-(D)-(A)-(B)", "(C)-(B)-(D)-(A)"], "ans": 1, "exp": "피부색과 확산 논쟁(B) → 확산과 신체 변화(D) → 도구 제작(C) → 뇌와 신체 변화, 영역 확장(A) 순입니다.", "b": 1, "bb": "The first human beings probably evolved in tropical regions where survival was possible without clothing. It is likely that they had very dark skin because light skin would have given little protection against the burning rays of the sun.\n\n(A) Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually expand their territory.\n\n(B) There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world.\n\n(C) More important, perhaps, was their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would have provided.\n\n(D) Whichever the case, it is believed that in time they became capable of spreading out from Africa, eventually to most of the world. This was probably because their physical characteristics changed. For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently."},

{"no": 144, "school": "논현고 (인천시)", "pref": "30", "type": "빈칸", "stem": "다음 빈칸 'As their diet expanded, hominids ___.'에 들어갈 말로 가장 적절한 것은?", "p": "30-a", "choices": ["had darker skin by their physiological changes", "were mentally ill due to anxiety about their diet", "had no need for tool making any more for hunting", "experienced serious health problems, such as obesity", "physically and intellectually expanded their territory"], "ans": 5, "exp": "식단 확대로 얻은 에너지로 신체와 뇌가 변해 신체적·지적으로 영역을 확장했다.", "b": 2, "bb": "The first human beings probably evolved in tropical regions where survival was possible without clothing. It is likely that they had very dark skin because light skin would have given little protection against the burning rays of the sun. There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, it is believed that in time they became capable of spreading out from Africa, eventually to most of the world. This was probably because their physical characteristics changed. For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently. More important, perhaps, was their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would have provided. Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids __________."},
{"no": 145, "school": "해원고 (인천시)", "pref": "30", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중 어법상 어색한 것은?", "p": "30-a", "choices": ["ⓐ in which", "ⓑ that", "ⓒ to become", "ⓓ was", "ⓔ have been changed"], "ans": 3, "exp": "ⓒ to become → to have become: 믿는 시점보다 앞선 과거의 일이므로 완료부정사를 쓴다.", "b": 2, "bb": "[학교 변형 지문]\nThe first human beings probably evolved in tropical regions ⓐin which survival was possible without clothing. It is likely ⓑthat they had very dark skin because light skin would have given little protection against the burning rays of the sun. There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, in time, they are believed ⓒto become capable of spreading out from Africa, eventually to most of the world. This was probably because their physical characteristics changed. For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently. More important, perhaps, ⓓwas their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would have provided. Not only their bodies but also their brains would ⓔhave been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually expand their territory."},

{"no": 165, "school": "영등포여고 (서울시)", "pref": "30", "type": "내용불일치", "stem": "다음 글을 읽고, 주어진 영어 질문에 대한 답으로 적절하지 않은 것은? (Q: What factors might have contributed to the first human beings expanding to other territories?)", "p": "30-a", "choices": ["Ability to walk upright – This allowed them to travel more efficiently and cover greater distances.", "Tool making – This enabled them to hunt animals, providing more protein and fat for their diet.", "Improved diet – Hunting allowed them to consume more energy-rich foods, fueling both physical and intellectual growth.", "Cognitive advancement – Improved brain capacity might have allowed early humans to explore and settle in new regions.", "Enhanced physical attraction – Appealing physical traits might have helped them form stronger social bonds and find mates in new environments."], "ans": 5, "exp": "신체적 매력이 초기 인류의 확산에 기여했다는 내용은 글에 없다.", "b": 5},
{"no": 166, "school": "월계고 (서울시)", "pref": "30", "type": "어법", "stem": "밑줄 친 부분 중 어법상 어색한 것은?", "p": "30-a", "choices": ["ⓐ in which", "ⓑ to have been", "ⓒ become", "ⓓ was", "ⓔ have provided"], "ans": 3, "exp": "ⓒ become → to become: 가목적어 it의 진목적어로 to부정사가 필요하다.", "b": 5, "bb": "[학교 변형 지문]\nThe first human beings probably evolved in tropical regions ⓐin which survival was possible without clothing. Their skin seems ⓑto have been very dark because light skin would have given little protection against the burning rays of the sun. There is a debate about whether these people spread into other parts of the world or, instead, whether people developed independently in various parts of the world. Whichever the case, scientists have found it possible for such human beings ⓒbecome capable of spreading out from Africa, eventually to most of the world. This was probably because their physical characteristics changed. For instance, early hominids probably did not walk upright, but when they developed that ability, they could travel more efficiently. More important, perhaps, ⓓ was their development of tool making. With tools, they could hunt other animals, so they could consume more protein and fat than their low-energy vegetarian diet would ⓔhave provided. Not only their bodies but also their brains would have been changed with more energy. The brain needs lots of energy to grow. As their diet expanded, hominids could physically and intellectually expand their territory."},
{"no": 167, "school": "연수여고 (인천시)", "pref": "31", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "31-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 4, "exp": "불공정한 과정이 주는 위안(C) → 결과를 외부로 돌리며 위안함/공정하면 어려움(A) → 공정하면 결과를 마땅하다고 여김(B) 순입니다.", "b": 1, "bb": "When we get an unfavorable outcome, in some ways the last thing we want to hear is that the process was fair.\n\n(A) We may reassure ourselves by believing that our bad outcome had little to do with us and everything to do with the unfair process. If the process is fair, however, we cannot nearly as easily externalize the outcome; we got what we got \"fair and square.\"\n\n(B) When the process is fair we believe that our outcome is deserved, which is another way of saying that there must have been something about ourselves (what we did or who we are) that caused the outcome.\n\n(C) As outraging as the combination of an unfavorable outcome and an unfair process is, this combination also brings with it a consolation prize: the possibility of attributing the bad outcome to something other than ourselves."},
{"no": 168, "school": "산남고 (청주시)", "pref": "31", "type": "요약", "stem": "다음 글의 내용을 요약한 것이다. 빈칸 (A)~(D)에 들어갈 말로 가장 적절한 것은? 요약 - 'When we encounter an unfavorable outcome, it's (A)___ to attribute the result to an unfair process rather than our own actions, which allows us to (B)___ the blame. However, if the process is fair, we are less able to (C)___ responsibility, recognizing that we received what we deserved. Thus, the perception of (D)___ in a process deeply influences whether we internalize or externalize the outcomes we face.'", "p": "31-a", "choices": ["(A) consoling — (B) externalize — (C) avoid — (D) fairness", "(A) unfair — (B) confront — (C) face — (D) preference", "(A) better — (B) generate — (C) deflect — (D) anticipation", "(A) comforting — (B) sidestep — (C) accept — (D) unfairness", "(A) favorable — (B) pass — (C) expect — (D) reason"], "ans": 1, "exp": "결과를 불공정한 과정 탓으로 돌리는 것은 위안이 되고(consoling) 비난을 외부로 돌리게(externalize) 하지만, 공정한 과정에서는 책임을 피하기(avoid) 어려우므로 공정성(fairness) 인식이 중요합니다.", "b": 1},
{"no": 169, "school": "혜화여고 (서울시)", "pref": "31", "type": "내용불일치", "stem": "다음 글에서 설명하는 내용과 일치하지 않는 것은?", "p": "31-a", "choices": ["We prefer not to hear that the process was fair if we get an unfavorable outcome.", "We may easily externalize the outcome if it is not what we wished for and the process was fair.", "It is more likely that we may think we deserved the outcome if the process was fair.", "When the process was fair, we may attribute the bad outcome to ourselves.", "If the process was fair, we may think that what you did affected the outcome."], "ans": 2, "exp": "과정이 공정하면 결과를 외부 요인으로 돌리기가 쉽지 않다고 했으므로 ②는 본문과 반대입니다.", "b": 1},

{"no": 176, "school": "연송고 (인천시)", "pref": "31", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "31-a", "choices": ["ⓐ last", "ⓑ comfort", "ⓒ vanishes", "ⓓ externalization", "ⓔ spares"], "ans": 4, "exp": "ⓓ externalization → internalization: 결과를 자신 탓으로 돌리는 것이 불편함과 자기 성찰을 낳는다.", "b": 2, "bb": "[학교 변형 지문]\nWhen we get an unfavorable outcome, in some ways the ⓐlast thing we want to hear is that the process was fair. As outraging as the combination of an unfavorable outcome and an unfair process is, this combination also brings with it a consolation prize: the possibility of attributing the bad outcome to something other than ourselves. We may ⓑcomfort ourselves by believing that our bad outcome had little to do with us and everything to do with the unfair process. If the process is fair, however, this protective barrier ⓒvanishes. When the process is fair, we believe that our outcome is deserved, which is another way of saying that there must have been something about ourselves (what we did or who we are) that caused the outcome. This ⓓexternalization can be uncomfortable, as it challenges our self-image and compels us to engage in self-reflection, leading to the realization that we may need to change or improve in certain areas. In conclusion, an unfair process offers an easy explanation for failure, one that ⓔspares us from self-reflection and the discomfort of accepting our limitations."},

{"no": 185, "school": "고촌고 (김포시)", "pref": "31", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "31-a", "choices": ["Easy Come Easy Go", "Don't Judge a Book by Its Cover", "Unfair Processes: Easy to Shift the Blame", "A Double-Edged Sword: Facing Their Own Demerits", "Look Before You Leap: Insights on Risk from Process"], "ans": 3, "exp": "과정이 불공정하면 나쁜 결과를 자신이 아닌 과정 탓으로 돌리기 쉽다는 내용이다.", "b": 4},
{"no": 186, "school": "산본고 (군포시)", "pref": "31", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 불공정한 과정은 나쁜 결과를 외부 요인 탓으로 돌릴 기회를 줌 ② 나쁜 결과가 불공정한 과정 때문이라고 믿으며 스스로를 안심시킴 ③ 과정이 공정하면 결과를 외부 탓으로 돌리기 어렵고 책임을 받아들여야 함 ④ 'People who achieve success through a fair process approach their tasks with confidence.' ⑤ 과정이 공정하면 결과가 자신의 무언가 때문이라고 믿게 됨)", "p": "31-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "공정한 과정으로 성공한 사람들의 자신감에 관한 ④는 나쁜 결과와 과정의 공정성에 관한 흐름과 무관하다.", "b": 5, "bb": "[학교 변형 지문]\nWhen we get an unfavorable outcome, in some ways the last thing we want to hear is that the process was fair. Although the combination of an unfavorable outcome and an unfair process is deeply outraging, it provides a form of consolation. ⓐThat is, it gives us the chance to blame the bad outcome on external factors, rather than on ourselves. ⓑWe may reassure ourselves by believing that our bad outcome had little to do with us and everything to do with the unfair process. ⓒIf the process is fair, however, we find it much harder to externalize the outcome; the result, being \"fair and square,\" forces us to accept that we are responsible for what we got. ⓓPeople who achieve success through a fair process approach their tasks with confidence. ⓔWhen the process is fair we believe that our outcome is deserved, which is another way of saying that there must have been something about ourselves that caused the outcome."},
{"no": 187, "school": "중앙여고 (청주시)", "pref": "31", "type": "어휘괄호", "stem": "괄호 (A)[favorable/unfavorable] (B)[something/little] (C)[internalize/externalize] - 문맥에 맞는 것은?", "p": "31-a", "choices": ["(A) favorable — (B) something — (C) internalize", "(A) unfavorable — (B) something — (C) internalize", "(A) favorable — (B) little — (C) internalize", "(A) unfavorable — (B) little — (C) externalize", "(A) favorable — (B) little — (C) externalize"], "ans": 4, "exp": "나쁜(unfavorable) 결과가 자신과 거의(little) 관계없다고 여기지만, 과정이 공정하면 결과를 외부 탓으로 돌리기(externalize) 어렵다.", "b": 5, "bb": "[학교 변형 지문]\nWhen we get an (A)[favorable / unfavorable] outcome, in some ways the last thing we want to hear is that the process was fair. As outraging as the combination of an unfavorable outcome and an unfair process is, this combination also brings with it a consolation prize: the possibility of attributing the bad outcome to something other than ourselves. We may reassure ourselves by believing that our bad outcome had (B)[something / little] to do with us and everything to do with the unfair process. If the process is fair, however, we cannot nearly as easily (C)[internalize / externalize] the outcome; we got what we got \"fair and square.\" When the process is fair we believe that our outcome is deserved, which is another way of saying that there must have been something about ourselves (what we did or who we are) that caused the outcome."},
{"no": 188, "school": "충북대부설고 (청주시)", "pref": "32", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중 어법상 어색한 것은?", "p": "32-a", "choices": ["ⓐ stretching", "ⓑ adjusted", "ⓒ to come up", "ⓓ unambiguously", "ⓔ its"], "ans": 5, "exp": "ⓔ its → their: 가리키는 대상이 복수인 forms입니다.", "b": 1, "bb": "[학교 변형 지문]\nThe well-known American ethnologist Alfred Louis Kroeber made a rich and in-depth study of women's evening dress in the West, ⓐstretching back about three centuries and using reproductions of engravings. Having ⓑadjusted the dimensions of these plates due to their diverse origins, he was able to analyse the constant elements in fashion features and ⓒto come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical. He reduced women's clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. He demonstrated ⓓunambiguously that fashion is a profoundly regular phenomenon which is not located at the level of annual variations but on the scale of history. For practically 300 years, women's dress was subject to a very precise periodic cycle: forms reach the furthest point in ⓔits variations every fifty years. If, at any one moment, skirts are at their longest, fifty years later they will be at their shortest; thus skirts become long again fifty years after being short and a hundred years after being long."},
{"no": 189, "school": "상일고 (군산시)", "pref": "32", "type": "내용불일치", "stem": "윗글의 Alfred Louis Kroeber에 관한 내용과 일치하지 않는 것은?", "p": "32-a", "choices": ["유명한 미국의 민족학자였다.", "서구 여성의 야회복에 관한 연구를 했다.", "똑같은 크기의 판화를 분석하여 연구에 활용했다.", "수학적이고 통계적인 연구 결과를 도출했다.", "패션이 매우 규칙적인 현상임을 입증했다."], "ans": 3, "exp": "출처가 다양한 판화들의 크기를 조정해서 분석했으므로, 똑같은 크기의 판화를 썼다는 ③은 틀립니다.", "b": 1},

{"no": 191, "school": "초은고 (인천시)", "pref": "32", "type": "내용불일치", "stem": "다음 글의 Alfred Louis Kroeber와 그의 연구 결과에 대한 내용과 일치하지 않는 것은?", "p": "32-a", "choices": ["He conducted a comprehensive study of women's evening dresses.", "He succeeded in analysing the consistent aspects of fashion trends and produced a study with precision.", "He demonstrated that fashion long-term historical patterns.", "Women's dress followed a highly specific recurring pattern.", "It took 50 years for the longest skirts to reach their maximum length again."], "ans": 5, "exp": "치마는 가장 길었다가 100년 후에 다시 길어지므로 '50년'은 본문과 다르다.", "b": 1},
{"no": 192, "school": "혜화여고 (서울시)", "pref": "32", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "32-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 4, "exp": "판화 자료를 조정해 분석한 (C) → 특징을 축소해 규칙성을 입증한 (A) → 50년 주기를 구체화한 (B) 순서가 자연스럽다.", "b": 1, "bb": "The well-known American ethnologist Alfred Louis Kroeber made a rich and in-depth study of women's evening dress in the West, stretching back about three centuries and using reproductions of engravings.\n\n(A) He reduced women's clothing to a certain number of features: length and size of the skirt, size and depth of the neckline, height of the waistline. He demonstrated unambiguously that fashion is a profoundly regular phenomenon which is not located at the level of annual variations but on the scale of history.\n\n(B) For practically 300 years, women's dress was subject to a very precise periodic cycle: forms reach the furthest point in their variations every fifty years. If, at any one moment, skirts are at their longest, fifty years later they will be at their shortest; thus skirts become long again fifty years after being short and a hundred years after being long.\n\n(C) Having adjusted the dimensions of these plates due to their diverse origins, he was able to analyse the constant elements in fashion features and to come up with a study that was neither intuitive nor approximate, but precise, mathematical and statistical."},

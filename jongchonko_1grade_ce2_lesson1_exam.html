onstrate the power of individual initiative."], "answer": 5}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-본문(all)", "passage": "There are a lot of things that fill us with hope for the future: technology, science, accountable leaders, and nonprofit organizations committed to doing good. However, few things give us more hope for the future than young people. Some young people are already working toward solutions for the problems their communities and the world are facing. Let’s look at three inspirational examples of these young people. Combating Online Hate with ReThink Trisha Prabhu, a young computer scientist from the U.S., is fighting cyberbullying with her innovative application ReThink. ReThink is a virtual keyboard that uses artificial intelligence to detect potentially hurtful text messages before they are sent and prompts young people to pause and reconsider their words. When a user types a message that contains potentially offensive language, such as “I hate you,” ReThink prompts: “Hold on! Are you sure you want to say that?” or “Remember. You are what you type!” In 2014, when Trisha was just thirteen years old, she read the tragic news of a twelve-year-old girl who had been cyberbullied for over a year and a half. Shocked at the story, she decided to prevent cyberbullying by using technology and created ReThink. ReThink has been used by schools and organizations worldwide and has successfully raised awareness on cyberbullying. It has helped young people make better decisions in digital space where people could easily be unkind toward each other. In fact, it has been found that when using ReThink, adolescents change their minds 93% of the time and decide not to post offensive messages. 11 - APEX", "opts": ["Why does Rethink use artificial intelligence?", "In what programming language did Trisha develop ReThink?", "What does ReThink do when harmful words are typed?", "What kind of news inspired Trisha to develop ReThink?", "How often do adolescents change their  text.", "Users are prevented from sending any message once ReThink identifies offensive language. (김은형) 1단원"], "answer": 4}]}, {"key": "blank", "no": 2, "title": "빈칸 추론", "emoji": "🔲", "desc": "문맥에 맞는 말을 고르세요", "questions": []}, {"key": "main", "no": 3, "title": "대의 파악", "emoji": "🎯", "desc": "주제·제목·요지·함축의미", "questions": []}, {"key": "gram", "no": 4, "title": "어법", "emoji": "📐", "desc": "어법상 알맞은 것을 고르세요", "questions": []}, {"key": "voca", "no": 5, "title": "어휘", "emoji": "🔤", "desc": "문맥상 알맞은 낱말을 고르세요", "questions": []}]};
let school='', name='', round=null, qs=[], idx=0, cor=0, wrongs=[], answered=false, t0=0, retry=false;

function el(id){return document.getElementById(id);}
function show(id){['scStart','scCount','scQuiz','scResult'].forEach(x=>el(x).classList.toggle('hidden',x!==id));
  ['top','bar'].forEach(x=>el(x).classList.toggle('hidden',id!=='scQuiz'));}

function renderRounds(){
  const box=el('rounds'); box.innerHTML='';
  EXAM.rounds.forEach(r=>{
    const n=r.questions.length;
    const b=document.createElement('button');
    b.className='rbtn'; b.disabled=n===0;
    b.innerHTML='<span class="rno">'+r.no+'</span><span><span class="rttl">'+r.emoji+' '+r.title+'</span>'
      +'<span class="rsub">'+r.desc+'</span></span>'
      +'<span class="rcnt'+(n?'':' soon')+'">'+(n?n+'문항':'준비 중')+'</span>';
    if(n) b.onclick=()=>pickRound(r);
    box.appendChild(b);
  });
}
function pickRound(r){
  school=el('school').value; name=el('name').value.trim();
  if(!school){alert('학교를 선택해주세요!');return;}
  if(!name){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bn_name',name);localStorage.setItem('bn_school',school);}catch(e){}
  round=r;
  el('cntTitle').textContent=r.emoji+' '+r.no+'라운드 '+r.title+' · 몇 문항 풀까요?';
  const box=el('cntBtns'); box.innerHTML='';
  const opts=[10,20,round.questions.length].filter((v,i,a)=>v<=round.questions.length&&a.indexOf(v)===i);
  opts.forEach(n=>{
    const b=document.createElement('button');
    b.className='rbtn';
    b.innerHTML='<span class="rno">'+(n===round.questions.length?'전체':n)+'</span><span><span class="rttl">'
      +n+'문항 풀기</span><span class="rsub">'+(n===round.questions.length?'이 라운드 전부':'무작위로 '+n+'문항')+'</span></span>';
    b.onclick=()=>start(n);
    box.appendChild(b);
  });
  show('scCount');
}
function backToRounds(){show('scStart');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(n){
  qs=shuffle(round.questions).slice(0,n);
  idx=0;cor=0;wrongs=[];retry=false;t0=Date.now();
  el('topT').textContent=round.emoji+' '+round.title;
  show('scQuiz'); draw();
}
function draw(){
  if(idx>=qs.length){result();return;}
  answered=false;
  const q=qs[idx];
  el('topC').textContent=(idx+1)+'/'+qs.length;
  el('fill').style.width=(idx/qs.length*100)+'%';
  const CIR='①②③④⑤';
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+q.tag+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +'<div class="psg">'+esc(q.passage)+'</div>'
    +'<div class="opts" id="opts"></div><div class="fb" id="fb"></div>';
  const box=el('opts');
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="on">'+CIR[i]+'</span><span>'+esc(o)+'</span>';
    b.onclick=()=>pick(b,i+1,q);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pick(btn,sel,q){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=el('fb'), CIR='①②③④⑤';
  if(sel===q.answer){btn.classList.add('ok');fb.className='fb y';fb.textContent='✅ 정답! '+CIR[q.answer-1];cor++;}
  else{
    btn.classList.add('no');
    document.querySelectorAll('.opt')[q.answer-1].classList.add('reveal');
    fb.className='fb n';fb.textContent='❌ 정답은 '+CIR[q.answer-1]+'번입니다.';
    wrongs.push({q:q,my:sel});
  }
  setTimeout(()=>{idx++;draw();},sel===q.answer?800:2200);
}
function result(){
  el('fill').style.width='100%';
  const total=qs.length, pct=total?Math.round(cor/total*100):0;
  const min=Math.max(1,Math.round((Date.now()-t0)/60000));
  const CIR='①②③④⑤';
  const wHtml=wrongs.length?'<div class="wrongbox"><div class="lbl">❌ 틀린 문제 '+wrongs.length+'개</div>'
    +wrongs.map(w=>'<div class="wi"><b>'+esc(w.q.q)+'</b><br>내 답 '+CIR[w.my-1]+' → 정답 '+CIR[w.q.answer-1]+'</div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:12px">🎉 전부 정답!</div>';
  el('scResult').innerHTML='<div class="card" style="text-align:center">'
    +'<div style="font-size:12px;color:#6b7280">'+EXAM.lesson+' · '+round.no+'라운드 '+round.title+'</div>'
    +'<div class="score">'+pct+'점</div>'
    +'<div class="stat"><div><b style="color:#2e7d32">'+cor+'</b><span>정답</span></div>'
    +'<div><b style="color:#c62828">'+(total-cor)+'</b><span>오답</span></div>'
    +'<div><b style="color:#1565c0">'+total+'</b><span>문항</span></div>'
    +'<div><b style="color:#f57f17">'+min+'분</b><span>소요</span></div></div>'
    +wHtml
    +'<div style="display:grid;gap:8px;margin-top:14px">'
    +(wrongs.length?'<button class="btn" onclick="retryWrong()">❌ 틀린 문제 다시 풀기 ('+wrongs.length+')</button>':'')
    +'<button class="btn sec" onclick="backToRounds()">← 라운드 다시 선택</button></div></div>';
  show('scResult');
  if(window._saveResult) window._saveResult({
    studentName:name, school:school, score:pct, correct:cor, wrong:total-cor, total:total,
    elapsedMin:min, round:retry?2:1, completed:wrongs.length===0,
    quizType:'종촌고1_공통영어2_'+EXAM.lesson+'_'+round.title+(retry?'_오답완료':''),
    lesson:EXAM.lesson, roundName:round.title,
    wrongWords:wrongs.map(w=>({eng:w.q.q.slice(0,40), kor:'정답 '+CIR[w.q.answer-1]}))
  });
}
function retryWrong(){
  qs=wrongs.map(w=>w.q); idx=0;cor=0;wrongs=[];retry=true;t0=Date.now();
  show('scQuiz'); draw();
}
window.backToRounds=backToRounds; window.retryWrong=retryWrong;
(function init(){
  try{
    const n=localStorage.getItem('bn_name'); if(n) el('name').value=n;
    const s=localStorage.getItem('bn_school')||'';
    for(const o of el('school').options){ if(o.value && s.indexOf(o.value.replace(/\d$/,''))===0){el('school').value=o.value;break;} }
  }catch(e){}
  renderRounds();
})();
</script>

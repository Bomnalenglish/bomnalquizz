 young people.", "opts": ["Many things make us feel hopeful when we think ahead.", "Tech, science, good leaders, and nonprofits all contribute to inspiring hope for the future.", "Few sources of hope are more inspiring than the younger generation.", "Certain youths are finding ways to solve their own problems.", "What follows are three inspiring examples of young people."], "answer": 4, "expl": "청년들이 자신의 문제가 아니라 지역사회와 세계의 문제 를 해결하려고 노력하고 있다고 언급되어 있으므로, 글의 내용과 일치 하지 않는 것은 ④ '일부 청년들은 자신들의 문제를 해결할 방법을 찾 고 있다.'이다. [오답] ① 미래를 생각하면 많은 것들이 우리에게 희망 을 준다. ② 기술, 과학, 훌륭한 리더들, 비영리 단체들이 모두 미래에 대한 희망을 고무시킨다. ③ 젊은이들보다 더 큰 희망을 주는 것은 거 의 없다. ③: 젊. ⑤ 다음 이어질 내용은 청년들의 영감을 주는 세 가 지 사례이다."}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-2", "passage": "Trisha Prabhu, a young computer scientist from the U.S., is fighting cyberbullying with her innovative application ReThink. ReThink is a virtual keyboard that uses artificial intelligence to detect potentially hurtful text messages before they are sent and prompts young people to pause and reconsider their words. When a user types a message that contains potentially offensive language, such as “I hate you,” ReThink prompts: “Hold on! Are you sure you want to say that?” or “Remember. You are what you type!” In 2014, when Trisha was just thirteen years old, she read the tragic news of a twelve-year-old girl who had been cyberbullied for over a year and a half. Shocked at the story, she decided to prevent cyberbullying by using technology and created ReThink. ReThink has been used by schools and organizations worldwide and has successfully raised awareness on cyberbullying. It has helped young people make better decisions in digital space where people could easily be unkind toward each other. In fact, it has been found that when using ReThink, adolescents change their minds 93% of the time and decide not to post offensive messages.", "opts": ["Trisha Prabhu, a young American computer scientist, developed ReThink as an innovative solution to combat cyberbullying among youth.", "ReThink functions by utilizing artificial intelligence to analyze messages before they are sent, encouraging users to reflect on their language.", "The application displays reminders such as “Hold on! Are you sure you want to say that?” when potentially harmful phrases are detected.", "Inspired by a distressing news story about a cyberbullying victim, Trisha created ReThink at the age of thirteen to intervene in digital conflicts.", "ReThink has been shown to completely eliminate all forms of cyberbullying in every school and organization where it has been implemented."], "answer": 5, "expl": "ReThink가 학교와 기관에서 널리 사용되며 인식을 높이 고, 청소년들이 93%의 확률로 공격적인 메시지를 올리지 않도록 결 정하게 만든다고 했지만, 모든 학교와 기관에서 모든 사이버 괴롭힘을 완전히 제거했다고는 하지 않았으므로, ⑤는 글의 내용과 일치하지 않 는다. [오답노트] ① 트리샤 프라부라는 젊은 미국 컴퓨터 과학자가 사이버 괴롭힘을 해결하기 위해 리싱크를 개발했다. ② 리싱크는 인공 지능을 사용해 메시지를 분석하고 사용자가 언어를 되돌아보도록 유 도한다. ③ 잠재적 해로운 문구가 감지되면 '잠깐! 정말 그렇게 말하고 싶나요?' 같은 알림을 보여준다. ④ 사이버 괴롭힘 피해자 관련 충격 적인 뉴스에서 영감을 받아 트리샤가 13살에 리싱크를 만들었다."}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-2", "passage": "Trisha Prabhu, a young computer scientist from the U.S., is fighting cyberbullying with her innovative application ReThink. ReThink is a virtual keyboard that uses artificial intelligence to detect potentially hurtful text messages before they are sent and prompts young people to pause and reconsider their words. When a user types a message that contains potentially offensive language, such as “I hate you,” ReThink prompts: “Hold on! Are you sure you want to say that?” or “Remember. You are what you type!” In 2014, when Trisha was just thirteen years old, she read the tragic news of a twelve-year-old girl who had been cyberbullied for over a year and a half. Shocked at the story, she decided to prevent cyberbullying by using technology and created ReThink. ReThink has been used by schools and organizations worldwide and has successfully raised awareness on cyberbullying. It has helped young people make better decisions in d lescents change their minds 93% of the time and decide not to post offensive messages.", "opts": ["ReThink is a virtual keyboard that detects hurtful messages.", "Trisha was motivated to create ReThink after hearing about a cyberbullying case.", "ReThink helps prevent cyberbullying by using artificial intelligence.", "ReThink guarantees that no one will ever send offensive messages online.", "Many schools and organizations use ReThink to raise awareness about cyberbullying."], "answer": 4, "expl": "그것은 사람들이 서로에게 쉽사리 불친절할 수 있는 디지 털 공간에서 젊은이들이 더 나은 결정을 내릴 수 있도록 도왔다고 하 였으므로, ④ 'ReThink는 온라인상에서 누구도 공격적인 메시지를 보내지 않도록 보장한다'는 글의 내용과 일치하지 않는다. [오답] ① ReThink는 상처주는 메시지를 감지하는 가상 키보드이다. ② Trisha는 사이버불링 사건을 듣고 ReThink를 만들게 되었다. ③ ReThink는 인공지능을 이용해 사이버불링을 예방한다. ⑤ 많은 학교 와 단체가 사이버불링 인식을 위해 ReThink를 사용한다."}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-2", "passage": "Trisha Prabhu, a young computer scientist from the U.S., is fighting cyberbullying with her innovative application ReThink. ReThink is a virtual keyboard that uses artificial intelligence to detect potentially hurtful text messages before they are sent and prompts young people to pause and reconsider their words. When a user types a message that contains potentially offensive language, such as “I hate you,” ReThink prompts: “Hold on! Are you sure you want to say that?” or “Remember. You are what you type!” In 2014, when Trisha was just thirteen years old, she read the tragic news of a twelve-year-old girl who had been cyberbullied for over a year and a half. Shocked at the story, she decided to prevent cyberbullying by using technology and created ReThink. ReThink has been used by schools and organizations worldwide and has successfully raised awareness on cyberbullying. It has helped young people make better decisions in digital space where people could easily be unkind toward each other. In fact, it has been found that when using ReThink, adolescents change their minds 93% of the time and decide not to post offensive m nd individuals transitioning from homelessness to stable housing. He says, “For people who have lived in their cars, in and out of shelters, and in the woods, to be home again is a triumph, a sense of peace, and something to be celebrated.” John’s journey began in 2015. At the age of twelve, he volunteered at a local shelter where people in need were staying. He learned that many of the shelter residents worked hard to rent houses and trailers but faced difficulties in furnishing their new homes upon moving in. This prompted John to decide to do something for those transitioning out of homelessness. Needing donations to gather essential items to help them, John reached out to his family, friends, and neighbors. As word of his efforts spread, donations began to rush in. So John was able to help more people get settled. He said, “I never knew the impact that a simple couch or a kitchen table could have. Furniture can restore the dignity of a family.”", "opts": ["John은 12살 때 지역 쉼터에서 자원봉사를 시작했다.", "John은 쉼터에서 생활한 경험을 바탕으로 Home Again을 시작 했다.", "John은 가족과 친구들이 아닌 정부의 도움을 받아 활동을 시작했 다.", "Home Again은 노숙인들에게 무료로 집을 제공하는 단체이다.", "John은 가구는 단순히 집을 꾸미는 역할만 한다고 말했다."], "answer": 1, "expl": "열두 살 때 그는 도움이 필요한 사람들이 머물고 있는 지역 쉼터에서 자원봉사를 했다고 하였으므로, ①은 글의 내용과 일치 한다."}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-4", "passage": "John Michael Stagliano is a young social activist from the U.S. who founded Home Again in 2016. It is a nonprofit organization that offers furniture and household essentials to families and individuals transitioning from homelessness to stable housing. He says, “For people who have lived in their cars, in and out of shelters, and in the woods, to be home again is a triumph, a sense of peace, and something to be celebrated.” John’s journey began in 2015. At the age of twelve, he volunteered at a local shelter where people in need were staying. He learned that many of the shelter residents worked hard to rent houses and trailers but faced difficulties in furnishin ullied for over a year and a half. Shocked at the story, she decided to prevent cyberbullying by using technology and created ReThink. ReThink has been used by schools and organizations worldwide and has successfully raised awareness on cyberbullying. It has helped young people make better decisions in digital space where people could easily be unkind toward each other. In fact, it has been found that when using ReThink, adolescents change their minds 93% of the time and decide not to post offensive messages.", "opts": ["Schools in the U.S. use ReThink as a punishment tool.", "The program replaces all negative words with positive ones.", "Harmful messages are removed automatically without the user being aware of it.", "ReThink warms users and encourages them to reconsider before sending harmful text.", "Users are prevented from sending any message once ReThink identifies offensive language."], "answer": 4, "expl": "[응용] 지문에서 \"보내기 전에 해로운 문구를 감지하고 (detect … hurtful text messages before they are sent), 잠 시 먼추고 생각하고(prompts young people to pause and reconsider their words), 그리고 경고 메세지를 띄운다고 했으므 로, 글의 내용과 일치하는 것은 ④ 'ReThink는 사용자에게 경고하고, 해로운 문자를 보내기 전에 다시 생각해 보도록 권장한다'이다."}]}, {"key": "blank", "no": 2, "title": "빈칸 추론", "emoji": "🔲", "desc": "문맥에 맞는 말을 고르세요", "questions": []}, {"key": "main", "no": 3, "title": "대의 파악", "emoji": "🎯", "desc": "주제·제목·요지·함축의미", "questions": []}, {"key": "gram", "no": 4, "title": "어법", "emoji": "📐", "desc": "어법상 알맞은 것을 고르세요", "questions": []}, {"key": "voca", "no": 5, "title": "어휘", "emoji": "🔤", "desc": "문맥상 알맞은 낱말을 고르세요", "questions": []}]};
let school='', name='', round=null, qs=[], idx=0, cor=0, wrongs=[], answered=false, t0=0, retry=false;

function el(id){return document.getElementById(id);}
function show(id){['scStart','scCount','scQuiz','scResult','scNote'].forEach(x=>el(x).classList.toggle('hidden',x!==id));
  ['top','bar'].forEach(x=>el(x).classList.toggle('hidden',id!=='scQuiz'));}

function renderRounds(){
  const box=el('rounds'); box.innerHTML='';
  EXAM.rounds.forEach(r=>{
    const n=r.questions.length;
    const b=document.createElement('button');
    b.className='rbtn'; b.disabled=n===0;
    b.innerHTML='<span class="rno">'+r.no+'</span><span><span class="rttl">'+r.emoji+' '+r.title+'</span>'
      +'<span class="rsub">'+r.desc+'</span></span>'
      +'<span class="rcnt'+(n?'':' soon')+'">'+(n?n+'문항':'준비 중')+'</span>';
    if(n) b.onclick=()=>pickRound(r);
    box.appendChild(b);
  });
}
function pickRound(r){
  school=el('school').value; name=el('name').value.trim();
  if(!school){alert('학교를 선택해주세요!');return;}
  if(!name){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bn_name',name);localStorage.setItem('bn_school',school);}catch(e){}
  round=r;
  el('cntTitle').textContent=r.emoji+' '+r.no+'라운드 '+r.title+' · 몇 문항 풀까요?';
  const box=el('cntBtns'); box.innerHTML='';
  const opts=[10,20,round.questions.length].filter((v,i,a)=>v<=round.questions.length&&a.indexOf(v)===i);
  opts.forEach(n=>{
    const b=document.createElement('button');
    b.className='rbtn';
    b.innerHTML='<span class="rno">'+(n===round.questions.length?'전체':n)+'</span><span><span class="rttl">'
      +n+'문항 풀기</span><span class="rsub">'+(n===round.questions.length?'이 라운드 전부':'무작위로 '+n+'문항')+'</span></span>';
    b.onclick=()=>start(n);
    box.appendChild(b);
  });
  show('scCount');
}
function backToRounds(){show('scStart');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(n){
  qs=shuffle(round.questions).slice(0,n);
  idx=0;cor=0;wrongs=[];retry=false;t0=Date.now();
  el('topT').textContent=round.emoji+' '+round.title;
  show('scQuiz'); draw();
}
function draw(){
  if(idx>=qs.length){result();return;}
  answered=false;
  const q=qs[idx];
  el('topC').textContent=(idx+1)+'/'+qs.length;
  el('fill').style.width=(idx/qs.length*100)+'%';
  const CIR='①②③④⑤';
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+q.tag+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +'<div class="psg">'+esc(q.passage)+'</div>'
    +'<div class="opts" id="opts"></div><div class="fb" id="fb"></div>';
  const box=el('opts');
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="on">'+CIR[i]+'</span><span>'+esc(o)+'</span>';
    b.onclick=()=>pick(b,i+1,q);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pick(btn,sel,q){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=el('fb'), CIR='①②③④⑤';
  if(sel===q.answer){
    btn.classList.add('ok');fb.className='fb y';
    fb.innerHTML='✅ 정답! <b>'+CIR[q.answer-1]+'</b>번'
      +(q.expl?'<div class="expl" style="border-top-color:#86efac">💡 '+esc(q.expl)+'</div>':'');
    cor++;
  }
  else{
    btn.classList.add('no');
    document.querySelectorAll('.opt')[q.answer-1].classList.add('reveal');
    fb.className='fb n';
    fb.innerHTML='❌ 정답은 <b>'+CIR[q.answer-1]+'</b>번입니다.'
      +(q.expl?'<div class="expl">💡 '+esc(q.expl)+'</div>':'');
    wrongs.push({q:q,my:sel});
  }
  // 해설이 있으면 버튼으로 넘긴다 (자동으로 넘어가면 해설을 못 읽음)
  if(q.expl){
    const nx=document.createElement('button'); nx.className='btn'; nx.style.marginTop='12px';
    nx.textContent=(idx+1>=qs.length?'해설을 읽었어요 · 결과 보기 →':'해설을 읽었어요 · 다음 문제 →');
    nx.onclick=()=>{idx++;draw();};
    el('qcard').appendChild(nx);
    if(nx.scrollIntoView) nx.scrollIntoView({block:'nearest'});
  } else {
    setTimeout(()=>{idx++;draw();},sel===q.answer?800:2000);
  }
}
let lastWrong=[];
function result(){
  el('fill').style.width='100%';
  if(!retry) lastWrong = wrongs.map(w=>({
    q:w.q.q, passage:w.q.passage, tag:w.q.tag||'', opts:w.q.opts,
    my:w.my, answer:w.q.answer, expl:w.q.expl||'', note:''
  }));
  const total=qs.length, pct=total?Math.round(cor/total*100):0;
  const min=Math.max(1,Math.round((Date.now()-t0)/60000));
  const CIR='①②③④⑤';
  const wHtml=wrongs.length?'<div class="wrongbox"><div class="lbl">❌ 틀린 문제 '+wrongs.length+'개</div>'
    +wrongs.map(w=>'<div class="wi"><b>'+esc(w.q.q)+'</b><br>내 답 '+CIR[w.my-1]+' → 정답 '+CIR[w.q.answer-1]+'</div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:12px">🎉 전부 정답!</div>';
  el('scResult').innerHTML='<div class="card" style="text-align:center">'
    +'<div style="font-size:12px;color:#6b7280">'+EXAM.lesson+' · '+round.no+'라운드 '+round.title+'</div>'
    +'<div class="score">'+pct+'점</div>'
    +'<div class="stat"><div><b style="color:#2e7d32">'+cor+'</b><span>정답</span></div>'
    +'<div><b style="color:#c62828">'+(total-cor)+'</b><span>오답</span></div>'
    +'<div><b style="color:#1565c0">'+total+'</b><span>문항</span></div>'
    +'<div><b style="color:#f57f17">'+min+'분</b><span>소요</span></div></div>'
    +wHtml
    +'<div style="display:grid;gap:8px;margin-top:14px">'
    +(lastWrong.length?'<button class="btn" onclick="openNote()">📝 오답노트 작성하기 ('+lastWrong.length+')</button>':'')
    +(wrongs.length?'<button class="btn sec" onclick="retryWrong()">❌ 틀린 문제 다시 풀기 ('+wrongs.length+')</button>':'')
    +'<button class="btn sec" onclick="backToRounds()">← 라운드 다시 선택</button></div></div>';
  show('scResult');
  if(window._saveResult) window._saveResult({
    studentName:name, school:school, score:pct, correct:cor, wrong:total-cor, total:total,
    elapsedMin:min, round:retry?2:1, completed:wrongs.length===0,
    quizType:'종촌고1_공통영어2_'+EXAM.lesson+'_'+round.title+(retry?'_오답완료':''),
    lesson:EXAM.lesson, roundName:round.title,
    wrongWords:wrongs.map(w=>({eng:w.q.q.slice(0,40), kor:'정답 '+CIR[w.q.answer-1]})),
    // 내 학습 기록에서 '내 답 / 정답 / 해설'을 볼 수 있도록 상세를 함께 저장
    wrongDetails:wrongs.map(w=>({
      q:w.q.q, my:w.my, answer:w.q.answer,
      myText:w.q.opts[w.my-1]||'', answerText:w.q.opts[w.q.answer-1]||'', expl:w.q.expl||''
    }))
  });
}
function retryWrong(){
  qs=wrongs.map(w=>w.q); idx=0;cor=0;wrongs=[];retry=true;t0=Date.now();
  show('scQuiz'); draw();
}

function openNote(){
  const CIR='①②③④⑤';
  el('scNote').innerHTML='<div class="card">'
    +'<div class="lbl">📝 오답노트 · '+EXAM.lesson+' '+round.title+'</div>'
    +'<div style="font-size:12px;color:#6b7280;line-height:1.7;margin-bottom:12px">'
    +'틀린 문제를 다시 보고, 왜 틀렸는지 한 줄로 적어 보세요. 저장하면 <b>내 학습 기록</b>에서 다시 볼 수 있어요.</div>'
    +lastWrong.map((w,i)=>'<div class="notecard">'
        +'<div class="noteq">'+(i+1)+'. '+esc(w.q)+(w.tag?' <span class="qtag">지문 '+esc(w.tag)+'</span>':'')+'</div>'
        +'<div class="psg" style="font-size:12.5px;max-height:150px;overflow:auto">'+esc(w.passage)+'</div>'
        +'<div class="noterow"><span class="bad">내 답 '+CIR[w.my-1]+'</span> '+esc(w.opts[w.my-1]||'')+'</div>'
        +'<div class="noterow"><span class="good">정답 '+CIR[w.answer-1]+'</span> '+esc(w.opts[w.answer-1]||'')+'</div>'
        +(w.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(w.expl)+'</div>':'')
        +'<textarea class="inp noteta" data-i="'+i+'" rows="2" placeholder="왜 틀렸나요? (예: 지문에 없는 내용을 골랐다)"></textarea>'
      +'</div>').join('')
    +'<button class="btn" id="noteSave" onclick="saveNote()">💾 오답노트 저장하기</button>'
    +'<div id="noteMsg" style="text-align:center;font-size:12.5px;font-weight:800;margin-top:10px"></div>'
    +'<button class="btn sec" style="margin-top:10px" onclick="backToResult()">← 결과로 돌아가기</button></div>';
  show('scNote'); window.scrollTo(0,0);
}
async function saveNote(){
  document.querySelectorAll('.noteta').forEach(t=>{ lastWrong[+t.dataset.i].note = t.value.trim(); });
  const btn=el('noteSave'), msg=el('noteMsg');
  btn.disabled=true; btn.textContent='저장 중...';
  const ok = window._saveNote ? await window._saveNote({
    studentName:name, school:school, lesson:EXAM.lesson, roundName:round.title,
    quizType:'종촌고1_공통영어2_'+EXAM.lesson+'_'+round.title+'_오답노트',
    wrongCount:lastWrong.length,
    items:lastWrong.map(w=>({q:w.q, my:w.my, answer:w.answer,
      myText:w.opts[w.my-1]||'', answerText:w.opts[w.answer-1]||'', expl:w.expl, note:w.note}))
  }) : false;
  btn.disabled=false; btn.textContent='💾 오답노트 저장하기';
  msg.style.color = ok ? '#2e7d32' : '#c62828';
  msg.textContent = ok ? '✅ 저장했어요! 내 학습 기록에서 볼 수 있어요.' : '⚠️ 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}
function backToResult(){ show('scResult'); window.scrollTo(0,0); }
window.openNote=openNote; window.saveNote=saveNote; window.backToResult=backToResult;
window.backToRounds=backToRounds; window.retryWrong=retryWrong;
(function init(){
  try{
    const n=localStorage.getItem('bn_name'); if(n) el('name').value=n;
    const s=localStorage.getItem('bn_school')||'';
    for(const o of el('school').options){ if(o.value && s.indexOf(o.value.replace(/\d$/,''))===0){el('school').value=o.value;break;} }
  }catch(e){}
  renderRounds();
})();
</script>

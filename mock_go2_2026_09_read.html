{"no": 33, "school": "", "pref": "20", "type": "", "diff": "", "stem": "글에 따르면 자기 글을 남에게 보여 주어야 할 때는?", "p": "20-33", "choices": ["초고를 쓰기 시작할 때", "제목을 정한 직후", "가족이 요청할 때", "스스로 최선을 다했다고 만족할 때"], "ans": 4, "exp": "첫 문장에서 자기 글에 할 수 있는 최선을 다해 만족할 때에만 남에게 보여 주라고 했어요.\n📖 <b>Only when you’re happy that you’ve done the best you can for your story</b> should you show it to someone else\n   자기 글에 할 수 있는 최선을 다했다고 만족할 때에만 남에게 보여 주어야 한다", "b": 1, "bb": "Only when you’re happy that you’ve done the best you can for your story should you show it to someone else. You may well want to show it to your nearest and dearest, and that’s fine, but in most cases you shouldn’t look to their reading for any great benefit to your work. The most valuable feedback is likely to come from other sources: you should choose readers for their critical insight, not their closeness to you. Fellow writers are ideal, but don’t imagine that any writer will do. If you are part of a writers’ circle or class, you’ll know whose writing you admire, and if you’ve had feedback in the past you’ll know whose opinions have been helpful ― and whose have not."},

{"no": 49, "school": "", "pref": "21", "type": "", "diff": "", "stem": "글에서 유연한 시간 문화의 회의를 무엇에 비유했는가?", "p": "21-49", "choices": ["늘 푸른 나무", "잘 닦인 철로", "정교한 시계", "곧은 사다리"], "ans": 1, "exp": "첫 문장에서 그런 문화의 회의는 '늘 푸른 나무'와 더 비슷하다고 했어요.\n📖 is more like an <b>evergreen tree</b>\n   늘 푸른 나무와 더 비슷하다", "b": 1, "bb": "A meeting in a flexible-time culture like those found in South America, parts of Europe, Africa, and the Middle East is more like an evergreen tree. An agenda with a meeting start time and a topic will probably be circulated before the meeting. This will serve as the trunk of the tree. But there’s no expectation that the meeting will progress in a linear manner. What seemed like a priority last week when the agenda was crafted is not necessarily the priority right now ― so discussion may branch off in a new direction. Other branches may sprout as some members have urgent phone calls that take them in and out of the meeting. Or sub-groups may form within the room to discuss timely subjects linked in some way to the main meeting trunk. In flexible-time cultures, it seems clear that the most productive meetings grow in unpredictable ways, and the effective manager is flexible and professional enough to capitalize on priorities and changing needs as they arise. Interruptions, agenda changes, and frequent shifts in direction are seen as natural and necessary."},

{"no": 81, "school": "", "pref": "23", "type": "", "diff": "", "stem": "음악이 편안한 리듬을 줄 때에 대해 글이 말하는 것은?", "p": "23-81", "choices": ["그 자체로는 아무 만족을 주지 못한다", "그 자체만으로도 만족을 줄 수 있다", "긴장이 전혀 생기지 않아 지루해진다", "언제나 더 큰 변화를 불러일으킨다"], "ans": 2, "exp": "첫 문장에 음악은 편안한 리듬으로 데려가 주고 그 자체로도 만족스러울 수 있다고 했어요.\n📖 Music can bring us into a very comfortable rhythm, and it can be <b>satisfying in and of itself</b>\n   음악은 우리를 아주 편안한 리듬으로 데려갈 수 있고, 그 자체만으로도 만족스러울 수 있다.", "b": 1, "bb": "Music can bring us into a very comfortable rhythm, and it can be satisfying in and of itself. Most of the time, however, we want something more to happen. There needs to be a process that creates tension and drives the movement towards something in particular. The excitement that arises in this process creates satisfaction and pleasure. This is seen in the measureless prelude as well. But there the tension might be caused by the ambiguity of the rhythm. Therefore, the fluid movement in the prelude usually creates a tension that can be released in the subsequent movement with a set rhythm. This, in turn, creates new and other types of tensions, where the rhythm is unambiguous and predictable, but where unexpected chords and modulations create drama and an experience of development in the piece."},

{"no": 97, "school": "", "pref": "24", "type": "", "diff": "", "stem": "'attention literacy'를 가르칠 때 학생들이 알아차리게 하려는 것은?", "p": "24-97", "choices": ["뉴스 기사를 빠르게 요약하는 방법", "소셜 미디어 계정을 늘리는 방법", "화면 구조가 주의를 흩트리려 설계된 점", "알고리즘을 직접 만들어 보는 방법"], "ans": 3, "exp": "소셜 미디어 피드나 뉴스 사이트의 구조가 일부러 주의를 흩트리거나 자극하도록 설계되었음을 알아보게 돕는 것이라고 했어요.\n📖 how the architecture of a social media feed or a news site is <b>deliberately designed to distract or provoke them</b>\n   소셜 미디어 피드나 뉴스 사이트의 구조가 그들의 주의를 흩트리거나 자극하도록 일부러 설계되어 있다는 점.", "b": 1, "bb": "Progressive educators and librarians are developing curricula to teach what we might call attention literacy. This means helping students recognize, for example, how the architecture of a social media feed or a news site is deliberately designed to distract or provoke them. Classes in media literacy traditionally cover how to evaluate the credibility of sources ― now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction. A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation. Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more critical users rather than passive consumers."},
{"no": 98, "school": "", "pref": "24", "type": "", "diff": "", "stem": "전통적인 미디어 리터러시 수업이 다루어 온 내용은?", "p": "24-98", "choices": ["출처의 신뢰도를 평가하는 방법", "낚시성 제목을 가려내는 방법", "자기 주의 분산을 살피는 방법", "앱의 디자인을 분석하는 방법"], "ans": 1, "exp": "전통적으로는 출처가 믿을 만한지 따지는 법을 다루었고, 나머지는 '이제' 새로 더해진 내용이에요.\n📖 Classes in media literacy traditionally cover how to <b>evaluate the credibility of sources</b>\n   미디어 리터러시 수업은 전통적으로 출처의 신뢰도를 평가하는 방법을 다룬다.", "b": 1, "bb": "Progressive educators and librarians are developing curricula to teach what we might call attention literacy. This means helping students recognize, for example, how the architecture of a social media feed or a news site is deliberately designed to distract or provoke them. Classes in media literacy traditionally cover how to evaluate the credibility of sources ― now they also include recognizing clickbait, understanding the role of algorithms in what content is served up, and observing one’s own patterns of distraction. A student might be tasked with tracking how many times they switch tasks or check their phone in an hour of homework, to raise self-awareness about fragmentation. Another lesson might involve unpacking the design of popular apps: Why does an app use infinite scrolling instead of pages? Why do notifications appear with specific colors and sounds? By treating these as deliberate design choices (often rooted in psychology and profit motives), young people become more critical users rather than passive consumers."},

{"no": 129, "school": "", "pref": "26", "type": "", "diff": "", "stem": "Olmsted가 Yale College에 입학하지 못한 이유로 가장 적절한 것은?", "p": "26-129", "choices": ["학비를 마련할 돈이 전혀 없어서", "심한 옻 중독으로 시력이 손상되어서", "아버지가 농사일을 물려주려 해서", "입학 시험 준비를 시작하지 않아서"], "ans": 2, "exp": "열네 살에 예일 대학 입학을 준비했지만, 심한 옻(sumac) 중독으로 시력이 상해 들어갈 수 없었다고 했어요.\n📖 he could not enter due to a <b>severe sumac poisoning that damaged his eyesight</b>\n   심한 옻 중독으로 시력이 손상되어 입학할 수 없었다.", "b": 1, "bb": "Frederick Law Olmsted, known as the father of American landscape architecture, was born in 1822. When Olmsted was young, he often went on trips to the countryside with his father, who loved scenery. At age 14, he was preparing himself to study at Yale College, but he could not enter due to a severe sumac poisoning that damaged his eyesight. Instead of attending a college, he gained experience working as a clerk, a sailor, and a farmer. In 1858, he worked with Calvert Vaux and won the design competition for New York City’s Central Park with the “Greensward Plan.” During the Civil War, Olmsted served as General Secretary of the United States Sanitary Commission. Although he passed away in 1903, his sons and successors continued his design philosophy. In 1979, the National Park Service designated his home and office in Brookline, Massachusetts, as a National Historic Site to honor his legacy."},

{"no": 145, "school": "", "pref": "29", "type": "", "diff": "", "stem": "자본주의에 대해 글이 말하는 것으로 가장 적절한 것은?", "p": "29-145", "choices": ["모든 곳에 현금 거래가 퍼져 있는 체제다", "값싼 자연에 둘러싸인 현금 거래의 섬들이다", "현금이 필요 없는 교환 방식을 뜻한다", "값싼 자연을 모두 없앤 뒤에 생긴다"], "ans": 2, "exp": "첫 문장이 답입니다. 현금 거래의 '섬들'이 값싼 자연의 '바다' 안에 있다고 비유했어요.\n📖 Capitalism is not a system where cash is everywhere but rather one in which <b>islands of cash exchange exist within oceans of cheap ― or potentially cheap ― natures</b>.\n   자본주의는 현금이 어디에나 있는 체제가 아니라, 값싼 자연의 바다 안에 현금 거래의 섬들이 있는 체제다.", "b": 1, "bb": "Capitalism is not a system where cash is everywhere but rather one in which islands of cash exchange exist within oceans of cheap ― or potentially cheap ― natures. Reproducing life within the cash nexus is expensive, and it grows more expensive over time. Workers’ wages can be frozen, even rolled back, but in the end inequality leads to crises of the kind we’ve recently seen bring about populist protests in the United States and the United Kingdom. Workers demand dignity, and their labor becomes expensive. Production processes burn through an island, and energy is no longer cheap. The climate changes, and crops can no longer grow as abundantly as they once did. Frontiers are so important in these processes because they offer places where the new cheap things can be seized ― and the cheap work of humans and other natures can be forcefully taken."},

{"no": 161, "school": "", "pref": "30", "type": "", "diff": "", "stem": "일부 사람들이 친환경 제품을 산 뒤 속이거나 훔치기도 하는 까닭은?", "p": "30-161", "choices": ["친환경 제품의 값이 너무 비싸기 때문에", "좋은 일을 했으니 그래도 된다고 느껴서", "환경 보호에 아무 관심이 없기 때문에", "주변 사람들의 권유를 그대로 따라서"], "ans": 2, "exp": "친환경 선택을 '착한 일'로 셈해 두고, 그만큼 해도 된다는 허락을 느낀다고 했어요.\n📖 probably because <b>they feel licensed to do so</b> since they morally account the “eco-friendly” choice as a “good” deed\n   친환경 선택을 착한 일로 여겨 그렇게 해도 된다는 허락을 느끼기 때문이다.", "b": 1, "bb": "Some people are more likely to cheat and steal after purchasing “eco-friendly” products, probably because they feel licensed to do so since they morally account the “eco-friendly” choice as a “good” deed. Moral licensing has also been observed in the context of cooperation for the good of the environment. When people are reminded of deeds they have done that they know were harmful to the environment, they might be left with a feeling of “eco-guilt.” People who experience eco-guilt seek pro-environmental actions to compensate for this guilt and restore balance. In their search for such a balance, people are inclined to believe in “quick-fixes,” because they want to re-establish the moral balance and escape the guilt as quickly and easily as possible. In the same way that people may change their attitudes to reduce inconsistencies between attitudes and behavior, people may also change their evaluation of past environmentally burdening behaviors and future environmentally friendly behaviors. For instance, people are more likely to sign a petition addressing environmental damage after viewing evidence of human-caused environmental damage."},

{"no": 209, "school": "", "pref": "33", "type": "", "diff": "", "stem": "여러 심리학 이론들이 한목소리로 중요하다고 말하는 것은?", "p": "33-209", "choices": ["우리의 상실을 애도하는 일", "감정을 빨리 잊는 훈련", "타인과 비교하지 않는 태도", "슬픔을 숨기는 기술"], "ans": 1, "exp": "첫 문장에서 분야를 가로질러 여러 이론이 '상실을 애도하는 일'의 중요성에 동의한다고 했어요.\n📖 Psychological theories across the field agree on the <b>importance of grieving our losses</b>\n   이 분야의 심리학 이론들은 우리의 상실을 애도하는 일의 중요성에 동의한다.", "b": 1, "bb": "Psychological theories across the field agree on the importance of grieving our losses, from the highly personal through to the broadly collective. Grief is a dynamic emotional process essential to consciousness. At a psychological level, it supports us to both face into our own and others’ vulnerability, transience and mortality, and to repair life energy after significant loss. Grief work honours the loss, the sadness and the experience of diminishment or absence, while also setting up the ground for self-transformation and the continuation of life. Psychotherapist Fran Weller describes grief work is “an act of devotion, rooted in love and compassion” that requires “an ongoing practice of deepening, attending and listening.” When we grieve for what is lost, it clears the way towards a strengthening of love and commitment for what remains. In time this may build a desire to make good from the loss by repairing as many damages as we can and/or compensating for them. Grief can make us both very sad and very motivated to act."},

{"no": 225, "school": "", "pref": "34", "type": "", "diff": "", "stem": "매체의 뚜렷한 면에만 집중할 때 놓치는 것으로 글이 든 것은?", "p": "34-225", "choices": ["기술의 가격이 바뀌는 추세", "매체의 겉모습이 바뀌는 일", "시간이 쌓이며 생기는 변화", "하루 만에 드러나는 변화"], "ans": 3, "exp": "첫 문장에서 하루하루로는 보이지 않지만 시간에 걸쳐 쌓이는 변화를 놓친다고 했어요.\n📖 we miss <b>the changes that accumulate over time but are not apparent day to day</b>\n   우리는 시간이 지나며 쌓이지만 하루하루로는 드러나지 않는 변화들을 놓친다.", "b": 1, "bb": "When we focus on the obvious aspects of media, we miss the changes that accumulate over time but are not apparent day to day. Most of us notice the obvious aspects of a new medium or technology while missing the more subtle aspects. Take, for example, the microwave oven. It was introduced in the early 1980s and revolutionized food preparation. Traditionally, one person spent the better part of an afternoon fixing an evening meal for a family. Now, it was possible to prepare foods very quickly, and this shortening of preparation time was liberating for the cooks in the family, most of whom tended to be women. But the short-term, obvious implications of greater convenience made it easy to overlook the long-term implications of no longer having one person fix food for the family to eat together at an evening meal. As time went on, fewer and fewer families sat down together to eat dinner. Meals that took a long time to prepare became a luxury of the past, except perhaps for special occasions. The effects of the microwave oven on family life were not anticipated and would have been difficult to foresee."},

{"no": 241, "school": "", "pref": "35", "type": "", "diff": "", "stem": "디지털 트윈에 대한 글의 설명으로 가장 적절한 것은?", "p": "35-241", "choices": ["공장을 자동으로 돌리는 프로그램", "3차원 인쇄로 만든 실물 모형", "모델링과 센서로 만든 디지털 복제물", "실제 기계를 대신 조작하는 장치"], "ans": 3, "exp": "첫 문장에 모델링과 센서를 써서 자산이나 활동을 디지털로 복제한 것이라고 나옵니다.\n📖 Digital twins are <b>digital replicas of assets or activities using modeling and sensors</b> to create digital representations.\n   디지털 트윈은 모델링과 센서를 이용해 자산이나 활동을 디지털로 복제한 것이다.", "b": 1, "bb": "Digital twins are digital replicas of assets or activities using modeling and sensors to create digital representations. Digital twins are not new; engineering teams in various industries have used 3D renderings of computer-aided design models, asset models, and process simulations for years. However, faster wireless networks and the resulting availability of real-time data enable much more detailed and dynamic digital representations. When sensors collect data from a connected device, the sensor data can be used to continuously update the digital twin. The digital twin becomes a real-time accurate copy of a physical object’s properties and states. For instance, digital twins of physical assets such as power-generation turbines, jet engines, and train engines are becoming common when the assets are very valuable and when downtime would be very costly."},

{"no": 288, "school": "", "pref": "37", "type": "", "diff": "", "stem": "윗글의 전개 방식에 대한 설명으로 가장 적절한 것은?", "p": "37-288", "choices": ["시간 순서대로 사건을 늘어놓는다", "질문을 던진 뒤 답을 미루어 둔다", "주장을 제시한 뒤 두 문화의 예를 든다", "통계 자료로 기존 주장을 뒤집는다"], "ans": 3, "exp": "언어가 문화의 표현이라는 주장을 먼저 내놓고, By contrast로 개인주의와 집단주의 문화를 맞세워 예를 듭니다.\n📖 <b>By contrast</b>, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words\n   반대로 상호의존과 조화라는 문화적 전제는 집단주의자가 암시적이고 모호한 말에 머물도록 요구한다", "b": 1, "bb": "Language is a manifestation of culture. At different language acquisition stages, children do not learn language per se; rather they learn the various patterns and styles of language interaction that enable them to function as competent communicators in different situational contexts. They develop a culture-specific communication style that is, for example, direct and explicit in individualistic cultures or indirect and implicit in collectivistic cultures. Examples of words linked with the direct style are categorical words like absolutely, certainly, or positively. By contrast, the cultural assumptions of interdependence and harmony require that collectivists limit themselves to implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably. The English language is the only language in the world that spells I with a capital letter. This phenomenon may reflect the fact that the roots of individualism are in England. There is no Japanese equivalent for the English I. Different words are used to refer to the self, depending on the social situation, the speaker’s gender, age, and the other social attributes relative to the listener."},
{"no": 289, "school": "", "pref": "38", "type": "", "diff": "", "stem": "글에 따르면 density와 crowding의 차이는 무엇인가?", "p": "38-289", "choices": ["앞은 심리적 느낌, 뒤는 사람 수 측정", "둘 다 공간의 넓이를 재는 단위다", "둘 다 사람의 감정을 재는 척도다", "앞은 사람 수의 측정, 뒤는 심리적 느낌"], "ans": 4, "exp": "density는 한 공간에 사람이 몇 명 있는지를 재는 물리적 측정이고, crowding은 공간이 부족하다고 느끼는 심리적 느낌이라고 구분했어요.\n📖 a distinction between the physical measurement of density (how many people are in a particular space) and <b>crowding (the psychological feeling of not having enough space)</b>\n   밀도의 물리적 측정과, 공간이 충분하지 않다는 심리적 느낌인 혼잡감을 구분한다", "b": 1, "bb": "Environmental psychologists make a distinction between the physical measurement of density (how many people are in a particular space) and crowding (the psychological feeling of not having enough space). Usually, high density is needed for the phenomenon of crowding, which makes people experience sensory overload, a lack of control, and rising stress and anxiety. However, some psychologists see crowding as neutral rather than invariably negative, and believe that people’s moods and behaviors intensify as density increases. So if an individual is looking forward to a concert, say, the feeling of crowding enhances their enjoyment of the performance. But if they are dreading an event, crowding will make the person’s experience of it even worse. Put into a community setting, crowding may accentuate the dominant behavior ― an aggressive group may turn violent as density rises. Conversely, creating positive social spaces such as parks and pedestrian areas in high-density urban environments may help to lift the general mood and defuse tension."},

{"no": 305, "school": "", "pref": "39", "type": "", "diff": "", "stem": "글에 따르면 배제(exclusion)에 대한 조직심리학자들의 태도는?", "p": "39-305", "choices": ["중요하게 다루지 않고 지나친다", "가장 먼저 연구하는 주제로 삼는다", "모든 기업에 경고를 보내고 있다", "직원 성과와 엮어 자주 측정한다"], "ans": 1, "exp": "첫 문장에서 배제는 조직심리학자들이 무시하는 상태라고 못 박았습니다.\n📖 <b>Exclusion is a state that is ignored by the organization psychologists.</b>\n   배제는 조직심리학자들이 무시하는 상태이다", "b": 1, "bb": "Exclusion is a state that is ignored by the organization psychologists. Therefore, it is possible that precautions regarding organizational exclusion are not taken. Individuals react to organizational exclusion by trying to strengthen their basic needs, which are threatened. Positive social behaviors develop belonging and self-respect. The likelihood that individuals who try to adapt to positive social behaviors will experience organizational exclusion decreases. However, individuals may be faced with more exclusion when they cannot adapt to a group. When excluded individuals grow away from communication and social activities, their contribution to the organization they are in may decrease. When this situation is not avoided, exclusion increases even more and strongly affects the performance of the employee in a negative way. Precautions need to be taken regarding organizational exclusion, which is very important for business."},

{"no": 321, "school": "", "pref": "40", "type": "", "diff": "", "stem": "과거의 선행을 적어 본 학생들의 기부액에 대해 글이 말하는 것은?", "p": "40-321", "choices": ["연구 보수의 절반이 넘는 돈을 기부했다", "연구 보수를 전혀 기부하지 않았다", "악행을 떠올린 학생의 절반만 기부했다", "기부 대신 봉사 활동을 선택했다"], "ans": 1, "exp": "선행 목록을 적은 학생들은 연구에서 받은 보수의 '절반이 넘는' 금액을 평균적으로 기부했다고 나와 있어요.\n📖 gave, on average, <b>over half the earnings</b> they’d made from the study\n   평균적으로 연구에서 받은 보수의 절반이 넘는 돈을 기부했다", "b": 1, "bb": "Our adult brains retain a preference for perpetuating good, fair behavior. Simply perceiving ourselves as people who do good deeds and behaving accordingly motivates us to do greater good in the future. In one paid study of one hundred college students, subjects who wrote down a list of past good deeds and were then asked to donate money to a charity gave, on average, over half the earnings they’d made from the study — almost twice as much as those who had been instructed to recall previous bad deeds. In addition, subjects who’d taken pains to describe not only how they’d been nice to others but how people responded were likely to donate significantly less than those who focused purely on the actions themselves. In other words, people who seemed concerned about appearances (e.g., the impact of their good deed, as much as the deed itself) were less generous than those who cared more about doing good for its own sake. → According to the study, the motivation to do good deeds was more evident in those who recalled their past virtues and those who focused purely on their good deeds than those who recalled their previous bad deeds and those who seemed highly conscious of the appearances of their deeds."},

{"no": 337, "school": "", "pref": "41-42", "type": "", "diff": "", "stem": "'choice architecture'라는 개념이 강조하는 바는?", "p": "41-42-337", "choices": ["선택 환경의 설계가 결정에 큰 영향을 준다", "선택은 환경과 전혀 무관하게 이루어진다", "선택지를 늘리면 늘 더 나은 결정이 된다", "경제학은 선택의 문제를 다루지 않는다"], "ans": 1, "exp": "첫 문장이 그대로 답이에요. 환경 '설계'가 결정을 크게 좌우한다고 했어요.\n📖 highlights how the design of the environment in which choices are made <b>can significantly influence the decisions people make</b>\n   선택이 이루어지는 환경의 설계가 사람들의 결정에 큰 영향을 줄 수 있음을 강조한다", "b": 1, "bb": "The concept of “choice architecture,” popularized in behavioral economics, highlights how the design of the environment in which choices are made can significantly influence the decisions people make. Algorithms are, in essence, sophisticated architects of our digital environments. By curating what we see, what we are recommended, and what options are presented to us, they subtly, and sometimes not so subtly, nudge us towards particular paths. While nudges can be used for beneficial purposes, such as encouraging healthier habits, they also carry the potential for manipulation, particularly when the underlying objectives of the architects are not aligned with the well-being or autonomy of the individual. The question then becomes: how can we cultivate and protect our human agency in an increasingly algorithmic world? It requires a conscious effort to maintain critical engagement with the technologies we use. It means actively seeking out diverse perspectives, challenging algorithmic recommendations, and making deliberate choices that go against the predicted grain. It involves cultivating a healthy skepticism towards the seemingly objective outputs of algorithms and remembering that these systems are designed by humans with specific goals, and that their data is a reflection of past realities, not necessarily a prescription for future flourishing."},

{"no": 353, "school": "", "pref": "43-45", "type": "", "diff": "", "stem": "Ridge가 남자의 노래에 대해 한 일은?", "p": "43-45-353", "choices": ["스스로 지어낸 가사를 붙여서 불렀다", "원래 가사를 그대로 외워서 불렀다", "노래를 녹음해 친구에게 보내 주었다", "기타 연주를 그대로 따라서 연주했다"], "ans": 1, "exp": "'made-up lyrics'는 스스로 만들어 낸 가사예요. 처음 듣는 노래에 자기 가사를 붙였어요.\n📖 he somehow managed to <b>attach his own made-up lyrics</b> to them\n   그는 어떻게든 자기가 지어낸 가사를 그 노래들에 붙였다", "b": 1, "bb": "Ridge was a high school student who wanted to major in music in college. For weeks, on his balcony, every night he listened to a man playing the guitar in the apartment across the courtyard. Although the songs the man played were all new to Ridge, he somehow managed to attach his own made-up lyrics to them. One night, Ridge slid open the balcony door and stepped outside. He told his mom he was going out to the balcony to do his homework. The man was playing the guitar on his balcony as usual and Ridge started to mindlessly follow the rhythm. While Ridge was singing along to the music, the man suddenly stopped playing. He had never stopped in the middle of a song, so naturally Ridge looked in his direction. The man held up his index finger as if to say, “Hold on.” He lifted one sheet of paper, and Ridge narrowed his eyes to get a good look at what was written on it. His phone number and “Text me” were written on the sheet. Then he flipped the paper over and wrote, “I have a question.” Curious about the man’s question, and wondering why he had asked for a text instead of a call, Ridge pulled out his phone and entered the number. He typed, “What’s your question?” The man texted, “I want to know how you’re singing lyrics to my songs when I haven’t even added lyrics to them yet.” Ridge was greatly surprised. Why hadn’t he thought the man could see him sitting out there? He had never thought the man had noticed him singing along to his music. The man sent another message asking, “Will you send them to me?” After reading the man’s message asking for his lyrics, Ridge hesitated. Ridge loved writing lyrics, but he had never shared anything he’d written with anyone. Eventually, he wrote down one of his favorite lyrics and sent it to him. A few days later, a new message came from the man. He wanted to use Ridge’s lyrics for his new album. It turned out he was a deaf guitarist and songwriter in a band called Brennan’s Band."},

const _DAY_KEY=(function(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
const _PROG_KEY='bn_prog_'+QUIZ_ID;
function _saveProg(){
  try{localStorage.setItem(_PROG_KEY, JSON.stringify({day:_DAY_KEY, doneRefs:Array.from(doneRefs)}));}catch(e){}
}
function _loadProg(){
  try{
    const raw=localStorage.getItem(_PROG_KEY); if(!raw) return;
    const data=JSON.parse(raw);
    if(data.day!==_DAY_KEY){localStorage.removeItem(_PROG_KEY); return;}
    if(Array.isArray(data.doneRefs)) doneRefs=new Set(data.doneRefs);
  }catch(e){}
}
function _cleanupOldProgress(){
  try{
    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i);
      if(k && (k.startsWith('bn_prog_') || k.startsWith('bn_session_'))){
        try{const v=JSON.parse(localStorage.getItem(k)); if(v.day!==_DAY_KEY) localStorage.removeItem(k);}
        catch(e){localStorage.removeItem(k);}
      }
    }
  }catch(e){}
}

// === 학생별 누적 풀이 기록 (이 기기) — 안 푼 문제 우선 출제용 ===
let perRef=0;   // 0 = 고른 번호의 문제를 전부 출제
let _solved=new Set(), _wrongSet=new Set();
function _histKey(){return 'bn_hist_'+QUIZ_ID+'_v2_'+(userSchool||'')+'_'+(userName||'');}
function _loadHist(){
  _solved=new Set(); _wrongSet=new Set();
  try{const h=JSON.parse(localStorage.getItem(_histKey())||'{}'); (h.solved||[]).forEach(n=>_solved.add(n)); (h.wrong||[]).forEach(n=>_wrongSet.add(n));}catch(e){}
}
function _saveHist(){
  try{localStorage.setItem(_histKey(), JSON.stringify({solved:[..._solved], wrong:[..._wrongSet]}));}catch(e){}
}
function _shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 유형 묶음 (세부 유형 → 선택 버튼)

  ['빈칸',['빈칸','빈칸(공통)','빈칸연결어','빈칸추론']],

  ['유의어',['유의어 고르기','반의어 고르기']],
  ['어휘',['어휘','어휘괄호','어휘(바꿔쓰기)','영영풀이','동의어','어휘(개수)','어휘(복수)','재진술']],
  ['어법',['어법','어법괄호','어법(복수)','어법·의미','어법(개수)','배열(영작)']],
  ['순서',['순서','순서(6단계)']],
  ['문장삽입',['문장삽입']],
  ['요약',['요약','요약(부적절)']],
  ['무관문장',['무관문장']],
  ['제목',['제목']],
  ['주제',['주제']],
  ['요지·주장',['요지','주장','목적','속담','심경','어조']],
  ['내용일치',['내용일치','내용불일치','내용일치(도표)','내용불일치(도표)','내용불일치(개수)','내용일치(수)','내용일치(개수)','내용적용','흐름도','종합','질문응답','세부내용','예시','표정리','답할 수 없는 질문','추론','이어질내용','내용불일치(복수)','내용일치(복수)','글비교']],

const TYPE_OF={}; TYPE_GROUPS.forEach(([g,list])=>list.forEach(t=>TYPE_OF[t]=g));
QUESTIONS.forEach(q=>{q.tg=TYPE_OF[q.type]||'기타';});
let selectedTypes=new Set();   // 비어 있으면 전체 유형
function typeOk(q){return selectedTypes.size===0||selectedTypes.has(q.tg);}
function renderTypeRow(){
  const row=document.getElementById('typeRow'); if(!row) return;
  row.innerHTML='';
  const all=document.createElement('button');
  all.className='fb'+(selectedTypes.size===0?' on':'');
  all.innerHTML='전체 유형<small>'+QUESTIONS.length+'</small>';
  all.onclick=()=>{selectedTypes.clear();renderTypeRow();renderPassageGrid();};
  row.appendChild(all);
  const groups=[...TYPE_GROUPS.map(g=>g[0])]; if(QUESTIONS.some(q=>q.tg==='기타')) groups.push('기타');
  groups.forEach(g=>{
    const n=QUESTIONS.filter(q=>q.tg===g).length; if(!n) return;
    const b=document.createElement('button');
    b.className='fb'+(selectedTypes.has(g)?' on':'');
    b.innerHTML=g+'<small>'+n+'</small>';
    b.onclick=()=>{ if(selectedTypes.has(g)) selectedTypes.delete(g); else selectedTypes.add(g); renderTypeRow(); renderPassageGrid(); };

}
function setPerRef(n,btn){perRef=0;}   // 문제 수 선택 없음 (항상 전부)

// ── START ──────────────────────────────────────────
function goPassageSelect(){
  userSchool = document.getElementById('si').value;
  userName = document.getElementById('ni').value.trim();
  if(!userSchool){alert('학교를 선택해주세요!');return;}
  if(!userName){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bomnal_name',userName);localStorage.setItem('bomnal_school',userSchool);}catch(e){}
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('userInfo').textContent = userName + ' · ' + userSchool;
  _loadHist();
  renderTypeRow();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

// ── QUIZ ──────────────────────────────────────────
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/([①②③④⑤])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v2';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고2 26년 9월 지문 깊이 풀기 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고226년9월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
<script src="bn_force.js"></script>
</body>
</html>

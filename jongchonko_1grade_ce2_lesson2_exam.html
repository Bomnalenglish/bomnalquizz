0s, lunch delivery to offices declined as more employees preferred bringing meals from home.", "As cities became densely populated, the need for delivery services increased, revitalizing the industry in the 1960s."], "answer": 5, "expl": "한국전쟁 이후 배달 시스템이 붕괴되었지만, 1960년대 도시 인구 증가로 인해 배달 수요 증가하고 배달 산업 회복되었다는 내용이 언급되므로, ⑤ \"도시가 인구 밀집 지역이 되면서 배달 서비스 에 대한 수요가 증가하였고, 1960년대에 이 산업이 다시 활기를 띠게 되었다.\"는 글의 내용과 일치한다. [오답노트] ① 한국이 해방 후 분 단되었지만, 배달 인프라는 시간이 지나면서 꾸준히 발전했다. (배달 산업이 무너짐) ② 한국전쟁으로 배달이 일시 둔화됐지만 1960년 이 전에 빠르게 회복됐다. (1960년대에 회복) ③ 산업화로 우유와 신문 배달이 줄어들었다. (증가함) ④ 1980~90년대 직장 도시락 배달이 줄었다. (배달 늘어남)", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "2-4", "passage": "In 1992, taekbae service, an express home delivery service through which a person receives an ordered item in at least a day or two was introduced. On the first day, there were just two deliveries. Now, millions of items are delivered daily. On average, a South Korean uses taekbae sixty-five times per year. It was the development of digital and information technology that enabled the remarkable growth of taekbae. Logistics automation, GPS maps, and mobile applications have extended the range and scale of delivery services while keeping prices reasonable. The phenomenal growth of e-commerce has driven the need for delivery services. A rule of thumb for taekbae is next-day delivery; if a person orders something today, it should arrive tomorrow. Taekbae is changing so rapidly that now more and more items are delivered on the same day they are ordered. It is also possible to choose a specific date and time for delivery.", "opts": ["택배 서비스는 1992년에 수백만 건의 배송과 함께 시작되었다.", "평균적으로 한국인은 택배를 연 1회 이용한다.", "택배 서비스에 GPS 지도가 사용되지 않았다.", "점점 더 많은 물품이 주문 다음 날 배송되고 있다.", "특정 배송 날짜와 시간을 선택하는 것이 가능하다."], "answer": 5, "expl": "1992년부터 시작된 택배 서비스는 디지털 기술 발전으 로 성장해 같은 날 배송 및 시간 지정이 가능해졌다고 했으므로, ⑤는 글의 내용과 일치한다. [오답] ① 첫날은 2건만 배송 ② 연 65회 이용 ③ GPS 사용함 ④ 같은 날 배송 증가  industry."], "answer": 1, "expl": "외국 물류 회사에서는 드론과 자동화 로봇들을 배달에 사용하고 있다고 했으므로, ① '다른 나라의 물류 회사들은 현재 신뢰 성과 비용 효율성 때문에 발로 움직이는 배송 방식을 사용하고 있 다'는 글의 내용과 일치하지 않는다. [오답] ② 한국 택배 업계는 서비 스 향상을 위해 드론과 자율 주행차 활용을 모색한다. ③ 기술 발전이 초창기 발송 배달에서 택배 서비스 성장에 크게 기여했다. ④ 한국 택 배는 현대 생활에 필수적이며 신속하고 안전하며 저렴한 배송에 집중 한다. ⑤ 배송 기술의 지속 발전이 한국 택배 산업 미래 발전의 핵심 요소가 될 것이다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "2-5", "passage": "Taekbae services, beginning from foot-powered delivery, have grown by leaps and bounds thanks to advancements in technology. Moreover, the services will likely be developed further due to continuing technological upheavals. Drones and autonomous robots are being used to deliver items by logistics companies in foreign countries. In Korea, companies are testing the possibility of using advanced equipment such as autonomous vehicles, delivery robots, and drones for deliveries. It is fair to say that modern Korean life cannot function as it does without its delivery services. To maintain trust with customers, the Korean delivery industry prioritizes rapid, safe, and affordable transportation. These persistent efforts for reliability and the adoption of advanced delivery technology will continue being the driving forces that will move Korean delivery forward well into the future.", "opts": ["Early Taekbae services initially depended on manual human effort for parcel delivery.", "Current technological breakthroughs have prompted logistics companies overseas to implement drones and autonomous robots.", "The Korean delivery sector has resisted adopting cutting-edge equipment such as autonomous vehicles and drones.", "Maintaining rapid and safe transportation is a critical priority to preserve customer confidence in Korea’s delivery industry.", "The fusion of persistent reliability initiatives and technological adoption will propel Korean delivery services into the future."], "answer": 3, "expl": "한국 기업들이 자율주행 차량, 배달 로봇, 드론 같은 첨 단 장비 사용 가능성을 시험하고 있다고 언급하였으므로, ③ '한국 배 달 업계는 자율주행차나 드론 같은 최첨단 장비 도입을 거부해왔다'는 글의 내용과 일치하지 않는다. [오답] ① 초기 택배 서비스는 사람이 직접 힘을 들이는 작업에 의존했다. ② 최근 기술적 혁신은 해외 물류 회사들이 드론과 자율 로봇을 도입하도록 촉진했다. ④ 신속하고 안전 한 운송을 유지하는 것은 한국 배달 산업에서 고객 신뢰를 지키기 위 한 중요한 우선 과제이다. ⑤ 끊임없는 신뢰 구축 노력과 기술 도입의 결합이 한국 배달 서비스를 미래로 이끌 것이다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "2-본문(all)", "passage": "In Korea, nearly anything can be delivered within twenty-four hours. Delivery is not limited to Korea; however, a unique culture has developed around the Korean delivery industry. People in Korea can order whatever they want whenever they want and have it delivered wherever they want. Delivery apps rank stores by various standards: review scores, popularity, price, delivery fee, and distance, to name a few. The speedy delivery of purchased items to your house is literally at the tips of your fingers. What is the history behind this culture? In 1768, Hwang Yun-seok, a scholar, made a diary entry after taking the gwageo, a public service entrance exam. He wrote that he and his friends had ordered a delivery of naengmyeon for lunch. Hwang’s diary is the first historical document indicating Koreans have been delivering food for at least two and a half centuries. During the Joseon period, specialized people called jeonin delivered letters for a fee. In the days before the modern address systems, letters were delivered by name and place of residence, so a jeonin had to know the local areas like the back of his hand. Service prices were determined by schedule and distance. During the Japanese colonial period, Seoul’s streets were filled with delivery professionals called “messengers,” most working for a company named Yongdalsa. Many used bikes to speed up delivery. When customers contacted Yongdalsa, a messenger went to pick up the item and then delivered it. Delivery mistakes were rare. Messengers were sometimes charged with carrying large bundles of cash, but they were unfailingly honest and accurate. Customers trusted the messengers so much that they often did not check the items they received. This messenger service was unique to Korea and was based on a culture of mutual trust and a hunger for speed. It is possible that this paved the way for modern motorcycle delivery.", "opts": ["The first document about delivery in Korea was written by Hwang Yun-seok who ordered food before the gwageo, a public service entrance exam.", "The price of jeonin service was fixed regardless of distance and schedule.", "Only jeonin who often delivered large bundles of cash had to be familiar with the local areas.", "Messengers in the colonial period were so reliable that even money was delivered by them.", "There are still some people in Korea who have limited access to delivery service through Internet."], "answer": 4, "expl": "④ 식민지 시대의 '메신저'은 신뢰가 높아서 심지어 현 금을 배달하기도 했다는 글의 내용과 일치한다. [오답 해석] 배달에 관한 최초의 문서는 과거 시험 전이 아니라 과거 시험 후의 내용을 기 록하고 있으므로 ① '한국 배달에 관한 최초의 문서는 공무원 시험인 과거를 치르기 전에 음식을 주문했던 황윤석에 의해 쓰여졌다'는 일치 하지 않는다. 서비스의 가격은 일정과 거리에 따라 결정되었으므로' 거리와 일정과는 관계없이 가격이 고정되었다'는 ②는 일치하지 않는 다. 현대식 주소 체계 전에는 메신저들이 지역을 상세하게 알고 있어 야만 했다고 했으므로 ③ '큰 현금을 배달하는 메신저만이 현지 지역 에 익숙해야 했다'는 일치하지 않는다. 현대 한국인들은 언제 어디서 나 어떤 것이든 배달 서비스 이용이 가능하다고 했으므로 ⑤ '인터넷 을 통한 배달 서비스 이용에 제한이 있는 사람들이 여전히 있다'는 일 치하지 않는다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글 (A), (B)의 내용과 일치하지 않는 것은?", "tag": "2-본문(all)", "passage": "A) During the Joseon period, specialized people called jeonin delivered letters for a fee. In the days before the modern address systems, letters were delivered by name and place of residence, so a jeonin had to know the local areas like the back of his hand. Service prices were determined by schedule and distance. (B) A rule of thumb for taekbae is next-day delivery; if a person orders something today, it should arrive tomorrow. Taekbae is changing so rapidly that now more and more items are delivered on the same day they are ordered. It is also possible to choose a specific date and time for delivery.", "opts": ["조선 시대에는 편지를 배달하는 전업 배달인이 존재했다.", "전인에게는 지역 정보를 매우 정확히 알고 있는 것이 필수였다.", "전인들의 배달료는 소포 무게와 배달 거리로 정해졌다.", "요즈음 택배는 빠르게 변화하여 주문 당일 받을 수도 있다.", "오늘날 특정 날짜나 특정 시간을 정하는 택배도 가능하다."], "answer": 3, "expl": "지문 (A)에서 배달료는 일정과 거리로 정해졌다고 했지 무게에 대한 언급은 없으므로, ‘소포 무게와 거리’라고 한 ③은 글의 내용과 일치하지 않는다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "2-본문(all)", "passage": "During the Japanese colonial period, Seoul’s streets were filled with delivery professionals called “messengers,” most working for a company named Yongdalsa. Many used bikes to speed up delivery. When customers contacted Yongdalsa, a messenger went to pick up the item and then delivered it. Delivery mistakes were rare. Messengers were sometimes charged with carrying large bundles of cash, but they were unfailingly honest and accurate. Customers trusted the messengers so much that they often did not check the items they received. This messenger service was unique to Korea and was based on a culture of mutual trust and a hunger for speed. It is possible that this paved the way for modern motorcycle delivery. After Korea’s liberation from colonial rule, it was divided into two. Then came the Korean War (1950- 1953). During this series of upheavals, Korea’s delivery system fell apart. It was during the 1960s that delivery services grew again thanks to urbanization. As economic development progressed, people flocked to urban areas, where labor became concentrated. This boosted the demand for delivery services. Deliveries of newspapers and milk quickly became popular. During lunchtime, city centers were filled with restaurant workers delivering trays full of food, stacked on top of each other. In the late 1980s and 1990s, caterers delivered homemade lunches in cloth bags to ur let school='', name='', round=null, qs=[], idx=0, cor=0, wrongs=[], answered=false, t0=0, retry=false;

function el(id){return document.getElementById(id);}
function show(id){['scStart','scCount','scQuiz','scResult','scNote'].forEach(x=>el(x).classList.toggle('hidden',x!==id));
  ['top','bar'].forEach(x=>el(x).classList.toggle('hidden',id!=='scQuiz'));}

function renderRounds(){
  const box=el('rounds'); box.innerHTML='';
  EXAM.rounds.forEach(r=>{
    const n=r.questions.length;
    const b=document.createElement('button');
    b.className='rbtn'; b.disabled=n===0;
    b.innerHTML='<span class="rno">'+r.no+'</span><span><span class="rttl">'+r.emoji+' '+r.title+'</span>'
      +'<span class="rsub">'+r.desc+'</span></span>'
      +'<span class="rcnt'+(n?'':' soon')+'">'+(n?n+'문항':'준비 중')+'</span>';
    if(n) b.onclick=()=>pickRound(r);
    box.appendChild(b);
  });
}
function pickRound(r){
  school=el('school').value; name=el('name').value.trim();
  if(!school){alert('학교를 선택해주세요!');return;}
  if(!name){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bn_name',name);localStorage.setItem('bn_school',school);}catch(e){}
  round=r;
  el('cntTitle').textContent=r.emoji+' '+r.no+'라운드 '+r.title+' · 몇 문항 풀까요?';
  const box=el('cntBtns'); box.innerHTML='';
  const opts=[10,20,round.questions.length].filter((v,i,a)=>v<=round.questions.length&&a.indexOf(v)===i);
  opts.forEach(n=>{
    const b=document.createElement('button');
    b.className='rbtn';
    b.innerHTML='<span class="rno">'+(n===round.questions.length?'전체':n)+'</span><span><span class="rttl">'
      +n+'문항 풀기</span><span class="rsub">'+(n===round.questions.length?'이 라운드 전부':'무작위로 '+n+'문항')+'</span></span>';
    b.onclick=()=>start(n);
    box.appendChild(b);
  });
  show('scCount');
}
function backToRounds(){show('scStart');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(n){
  qs=shuffle(round.questions).slice(0,n);
  idx=0;cor=0;wrongs=[];retry=false;t0=Date.now();
  el('topT').textContent=round.emoji+' '+round.title;
  show('scQuiz'); draw();
}
function draw(){
  if(idx>=qs.length){result();return;}
  answered=false;
  const q=qs[idx];
  el('topC').textContent=(idx+1)+'/'+qs.length;
  el('fill').style.width=(idx/qs.length*100)+'%';
  const CIR='①②③④⑤';
  if(q.short){ drawShort(q); return; }
  const inline = !q.opts || q.opts.length===0;
  let psg = esc(q.passage);
  if(inline) psg = psg.replace(/[①②③④⑤]/g, m=>'<b class="mk">'+m+'</b>');   // 밑줄형 표시 강조
  const blocks =
     (q.given?'<div class="givbox"><div class="sumlbl blue">📌 주어진 문장</div>'+esc(q.given)+'</div>':'')
    +(q.lead?'<div class="psg"><span class="plbl">주어진 글</span>'+esc(q.lead)+'</div>':'')
    +((q.parts&&q.parts.length)?'<div class="parts">'+q.parts.map(function(pt){
        return '<div class="part"><span class="plabel">'+esc(pt.label)+'</span>'+esc(pt.text)+'</div>';}).join('')+'</div>':'');
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+esc(q.tag)+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +blocks
    +(q.passage?'<div class="psg">'+psg+'</div>':'')
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +(inline?'<div class="hint">지문에서 번호가 붙은 부분을 보고 답을 고르세요</div>':'')
    +'<div class="'+(inline?'opts inline':'opts')+'" id="opts"></div><div class="fb" id="fb"></div>';
  const box=el('opts');
  if(inline){
    for(let i=0;i<5;i++){
      const b=document.createElement('button');
      b.className='opt num';
      b.innerHTML='<span class="on">'+CIR[i]+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    }
  } else {
    q.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML='<span class="on">'+CIR[i]+'</span><span>'+esc(o)+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    });
  }
  window.scrollTo(0,0);
}

function normalize(t){
  return String(t||'').toLowerCase()
    .replace(/[‘’“”]/g,"'")
    .replace(/[^a-z0-9가-힣]+/g,' ').trim();
}
function drawShort(q){
  const blocks =
     (q.given?'<div class="givbox"><div class="sumlbl blue">📌 주어진 문장</div>'+esc(q.given)+'</div>':'')
    +(q.lead?'<div class="psg"><span class="plbl">주어진 글</span>'+esc(q.lead)+'</div>':'')
    +((q.parts&&q.parts.length)?'<div class="parts">'+q.parts.map(function(pt){
        return '<div class="part"><span class="plabel">'+esc(pt.label)+'</span>'+esc(pt.text)+'</div>';}).join('')+'</div>':'');
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+q.tag+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +blocks
    +(q.passage?'<div class="psg">'+esc(q.passage)+'</div>':'')
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +'<div class="hint">답을 직접 입력한 뒤 [답 확인]을 누르세요</div>'
    +'<textarea class="inp" id="sans" rows="3" placeholder="여기에 답을 쓰세요"></textarea>'
    +'<button class="btn" style="margin-top:10px" id="schk">답 확인하기</button>'
    +'<div class="fb" id="fb"></div>';
  el('schk').onclick=()=>checkShort(q);
  el('sans').focus();
  window.scrollTo(0,0);
}
function checkShort(q){
  if(answered) return;
  const mine=el('sans').value.trim();
  if(!mine){ alert('답을 입력해 주세요!'); return; }
  answered=true;
  el('sans').disabled=true; el('schk').disabled=true;
  const ok = normalize(mine)===normalize(q.answer);
  const fb=el('fb');
  fb.className = ok?'fb y':'fb n';
  fb.innerHTML = (ok?'✅ 정답입니다!':'❌ 정답과 다릅니다.')
    +'<div class="sans-cmp"><b>내 답</b> '+esc(mine)+'</div>'
    +'<div class="sans-cmp good"><b>정답</b> '+esc(q.answer)+'</div>'
    +(q.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(q.expl)+'</div>':'');
  if(ok){ cor++; }
  else { wrongs.push({q:q,my:mine}); }
  const box=document.createElement('div'); box.style.display='grid'; box.style.gap='8px'; box.style.marginTop='12px';
  if(!ok){
    const self=document.createElement('button');
    self.className='btn sec'; self.textContent='🙆 사실상 맞았어요 (정답 처리)';
    self.onclick=()=>{ cor++; wrongs=wrongs.filter(w=>w.q!==q); self.disabled=true;
                       self.textContent='✔ 정답으로 처리했어요'; };
    box.appendChild(self);
  }
  const nx=document.createElement('button');
  nx.className='btn'; nx.textContent=(idx+1>=qs.length?'다음 · 결과 보기 →':'다음 문제 →');
  nx.onclick=()=>{idx++;draw();};
  box.appendChild(nx);
  el('qcard').appendChild(box);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pick(btn,sel,q){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=el('fb'), CIR='①②③④⑤';
  if(sel===q.answer){
    btn.classList.add('ok');fb.className='fb y';
    fb.innerHTML='✅ 정답! <b>'+CIR[q.answer-1]+'</b>번'
      +(q.expl?'<div class="expl" style="border-top-color:#86efac">💡 '+esc(q.expl)+'</div>':'');
    cor++;
  }
  else{
    btn.classList.add('no');
    document.querySelectorAll('.opt')[q.answer-1].classList.add('reveal');
    fb.className='fb n';
    fb.innerHTML='❌ 정답은 <b>'+CIR[q.answer-1]+'</b>번입니다.'
      +(q.expl?'<div class="expl">💡 '+esc(q.expl)+'</div>':'');
    wrongs.push({q:q,my:sel});
  }
  // 해설이 있으면 버튼으로 넘긴다 (자동으로 넘어가면 해설을 못 읽음)
  if(q.expl){
    const nx=document.createElement('button'); nx.className='btn'; nx.style.marginTop='12px';
    nx.textContent=(idx+1>=qs.length?'해설을 읽었어요 · 결과 보기 →':'해설을 읽었어요 · 다음 문제 →');
    nx.onclick=()=>{idx++;draw();};
    el('qcard').appendChild(nx);
    if(nx.scrollIntoView) nx.scrollIntoView({block:'nearest'});
  } else {
    setTimeout(()=>{idx++;draw();},sel===q.answer?800:2000);
  }
}

    lesson:EXAM.lesson, roundName:round.title,
    wrongWords:wrongs.map(w=>({eng:w.q.q.slice(0,40), kor:'정답 '+CIR[w.q.answer-1]})),
    // 내 학습 기록에서 '내 답 / 정답 / 해설'을 볼 수 있도록 상세를 함께 저장
    wrongDetails:wrongs.map(w=>({
      q:w.q.q, my:w.my, answer:w.q.answer,
      myText: w.q.short ? String(w.my) : (w.q.opts[w.my-1]||(CIR[w.my-1]+'번')),
      answerText: w.q.short ? String(w.q.answer) : (w.q.opts[w.q.answer-1]||(CIR[w.q.answer-1]+'번')),
      expl:w.q.expl||''
    }))
  });
}
function retryWrong(){
  qs=wrongs.map(w=>w.q); idx=0;cor=0;wrongs=[];retry=true;t0=Date.now();
  show('scQuiz'); draw();
}

function openNote(){
  const CIR='①②③④⑤';
  el('scNote').innerHTML='<div class="card">'
    +'<div class="lbl">📝 오답노트 · '+EXAM.lesson+' '+round.title+'</div>'
    +'<div style="font-size:12px;color:#6b7280;line-height:1.7;margin-bottom:12px">'
    +'틀린 문제를 다시 보고, 왜 틀렸는지 한 줄로 적어 보세요. 저장하면 <b>내 학습 기록</b>에서 다시 볼 수 있어요.</div>'
    +lastWrong.map((w,i)=>'<div class="notecard">'
        +'<div class="noteq">'+(i+1)+'. '+esc(w.q)+(w.tag?' <span class="qtag">지문 '+esc(w.tag)+'</span>':'')+'</div>'
        +'<div class="psg" style="font-size:12.5px;max-height:150px;overflow:auto">'+esc(w.passage)+'</div>'
        +'<div class="noterow"><span class="bad">내 답 '+(w.short?'':CIR[w.my-1])+'</span> '
          +esc(w.short?w.my:((w.opts||[])[w.my-1]||''))+'</div>'
        +'<div class="noterow"><span class="good">정답 '+(w.short?'':CIR[w.answer-1])+'</span> '
          +esc(w.short?w.answer:((w.opts||[])[w.answer-1]||''))+'</div>'
        +(w.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(w.expl)+'</div>':'')
        +'<textarea class="inp noteta" data-i="'+i+'" rows="2" placeholder="왜 틀렸나요? (예: 지문에 없는 내용을 골랐다)"></textarea>'
      +'</div>').join('')
    +'<button class="btn" id="noteSave" onclick="saveNote()">💾 오답노트 저장하기</button>'
    +'<div id="noteMsg" style="text-align:center;font-size:12.5px;font-weight:800;margin-top:10px"></div>'
    +'<button class="btn sec" style="margin-top:10px" onclick="backToResult()">← 결과로 돌아가기</button></div>';
  show('scNote'); window.scrollTo(0,0);
}
async function saveNote(){
  document.querySelectorAll('.noteta').forEach(t=>{ lastWrong[+t.dataset.i].note = t.value.trim(); });
  const btn=el('noteSave'), msg=el('noteMsg');
  btn.disabled=true; btn.textContent='저장 중...';
  const ok = window._saveNote ? await window._saveNote({
    studentName:name, school:school, lesson:EXAM.lesson, roundName:round.title,
    quizType:'종촌고1_공통영어2_'+EXAM.lesson+'_'+round.title+'_오답노트',
    wrongCount:lastWrong.length,
    items:lastWrong.map(w=>({q:w.q, my:w.my, answer:w.answer,
      myText: w.short ? String(w.my) : ((w.opts||[])[w.my-1]||(CIR[w.my-1]+'번')),
      answerText: w.short ? String(w.answer) : ((w.opts||[])[w.answer-1]||(CIR[w.answer-1]+'번')),
      expl:w.expl, note:w.note}))
  }) : false;
  btn.disabled=false; btn.textContent='💾 오답노트 저장하기';
  msg.style.color = ok ? '#2e7d32' : '#c62828';
  msg.textContent = ok ? '✅ 저장했어요! 내 학습 기록에서 볼 수 있어요.' : '⚠️ 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}
function backToResult(){ show('scResult'); window.scrollTo(0,0); }
window.openNote=openNote; window.saveNote=saveNote; window.backToResult=backToResult;
window.backToRounds=backToRounds; window.retryWrong=retryWrong;
(function init(){
  try{
    const n=localStorage.getItem('bn_name'); if(n) el('name').value=n;
    const s=localStorage.getItem('bn_school')||'';
    for(const o of el('school').options){ if(o.value && s.indexOf(o.value.replace(/\d$/,''))===0){el('school').value=o.value;break;} }
  }catch(e){}
  renderRounds();
})();
</script>
</body>
</html>

{"no": 49, "school": "", "pref": "21", "type": "", "diff": "", "stem": "상식적인 견해(commonsense view)에 따르면 색은 무엇인가?", "p": "21-49", "choices": ["보는 사람의 마음속 느낌일 뿐", "사물이나 빛이 가진 객관적 성질", "뇌가 만들어 낸 착각에 불과함", "문화마다 다르게 배우는 약속"], "ans": 2, "exp": "많은 사람이 색은 사물이나 사물에서 튕겨 나오는 빛이 지닌 객관적 성질이라고 본다고 했어요.\n📖 color is <b>an objective property of things</b>, or of the light that bounces off them\n   색은 사물, 또는 사물에서 반사되는 빛이 지닌 객관적 성질이다.", "b": 1, "bb": "Many people take the commonsense view that color is an objective property of things, or of the light that bounces off them. They say a tree‘s leaves are green because they reflect green light ― a greenness that is just as real as the leaves. Others argue that color doesn’t inhabit the physical world at all but exists only in the eye or mind of the viewer. They maintain that if a tree fell in a forest and no one was there to see it, its leaves would be colorless ― and so would everything else. They say there is no such thing as color; there are only the people who see it. Both positions are, in a way, correct. Color is objective and subjective ― “the place,” as Paul Cézanne put it, “where our brain and the universe meet.” Color is created when light from the world is registered by the eyes and interpreted by the brain."},

{"no": 81, "school": "", "pref": "23", "type": "", "diff": "", "stem": "입을 거쳐 몸으로 들어가는 것으로 글이 든 예는?", "p": "23-81", "choices": ["약과 주사, 혈액과 산소", "음식과 공기, 세균과 바이러스", "물과 소금, 비타민과 철분", "햇빛과 바람, 흙과 먼지"], "ans": 2, "exp": "첫 문장에 네 가지가 그대로 나열되어 있습니다.\n📖 Nearly everything has to go through your mouth to get to the rest of you, <b>from food and air to bacteria and viruses</b>\n   음식과 공기에서 세균과 바이러스까지, 거의 모든 것이 입을 거쳐 몸의 나머지로 간다", "b": 1, "bb": "Nearly everything has to go through your mouth to get to the rest of you, from food and air to bacteria and viruses. A healthy mouth can help your body get what it needs and prevent it from harm ― with adequate space for air to travel to your lungs, and healthy teeth and gums that prevent harmful microorganisms from entering your bloodstream. From the moment you are created, oral health affects every aspect of your life. What happens in the mouth is usually just the tip of the iceberg and a reflection of what is happening in other parts of the body. Poor oral health can be a cause of a disease that affects the entire body. The microorganisms in an unhealthy mouth can enter the bloodstream and travel anywhere in the body, posing serious health risks."},

{"no": 97, "school": "", "pref": "24", "type": "", "diff": "", "stem": "사람이 쉽게 지루해지는 까닭이 있는 곳으로 글이 지목한 것은?", "p": "24-97", "choices": ["음식과 환경의 변화 속", "우리 신경 세포 속 깊은 곳", "어린 시절의 경험 속", "사회가 만든 유행 속"], "ans": 2, "exp": "'답은 우리 신경 세포 깊숙이 묻혀 있다'고 바로 밝힙니다.\n📖 The answer lies <b>buried deep in our nerve cells</b>\n   그 답은 우리 신경 세포 깊숙한 곳에 묻혀 있다", "b": 1, "bb": "Kids tire of their toys, college students get sick of cafeteria food, and sooner or later most of us lose interest in our favorite TV shows. The bottom line is that we humans are easily bored. But why should this be true? The answer lies buried deep in our nerve cells, which are designed to reduce their initial excited response to stimuli each time they occur. At the same time, these neurons enhance their responses to things that change ― especially things that change quickly. We probably evolved this way because our ancestors got more survival value, for example, from attending to what was moving in a tree (such as a puma) than to the tree itself. Boredom in reaction to an unchanging environment turns down the level of neural excitation so that new stimuli (like our ancestor's hypothetical puma threat) stand out more. It‘s the neural equivalent of turning off a front door light to see the fireflies."},

{"no": 129, "school": "", "pref": "26", "type": "", "diff": "", "stem": "Frederick Douglass가 이름을 Frederick Douglass로 바꾼 시점은 언제인가?", "p": "26-129", "choices": ["메릴랜드 농장에서 태어난 직후", "노예 생활에서 탈출에 성공한 뒤", "자서전을 처음 출간한 다음", "부통령 후보로 지명된 뒤"], "ans": 2, "exp": "세 번째 문장에 1838년에 노예 신분에서 탈출에 성공한 뒤 이름을 바꿨다고 나와 있어요.\n📖 He changed his name to Frederick Douglass after he <b>successfully escaped from slavery in 1838</b>.\n   그는 1838년에 노예 신분에서 성공적으로 탈출한 뒤 이름을 프레더릭 더글러스로 바꿨다.", "b": 1, "bb": "Frederick Douglass was born into slavery at a farm in Maryland. His full name at birth was Frederick Augustus Washington Bailey. He changed his name to Frederick Douglass after he successfully escaped from slavery in 1838. He became a leader of the Underground Railroad ― a network of people, places, and routes that helped enslaved people escape to the north. He assisted other runaway slaves until they could safely get to other areas in the north. As a slave, he had taught himself to read and write and he spread that knowledge to other slaves as well. Once free, he became a well-known abolitionist and strong believer in equality for all people including Blacks, Native Americans, women, and recent immigrants. He wrote several autobiographies describing his experiences as a slave. In addition to all this, he became the first African-American candidate for vice president of the United States."},

{"no": 144, "school": "", "pref": "26", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "26-144", "choices": ["출생에서 시작해 활동과 업적을 차례로 소개한다", "같은 사건을 여러 사람의 시선으로 반복해 본다", "두 인물의 삶을 항목별로 비교해 대조한다", "주장을 먼저 내세운 뒤 통계로 반박한다"], "ans": 1, "exp": "태어난 이야기로 시작해 개명, 탈출, 조력 활동, 저술, 부통령 후보까지 시간 순서로 이어집니다.\n📖 <b>Frederick Douglass was born into slavery at a farm in Maryland</b>.\n   프레더릭 더글러스는 메릴랜드의 한 농장에서 노예로 태어났다.", "b": 1, "bb": "Frederick Douglass was born into slavery at a farm in Maryland. His full name at birth was Frederick Augustus Washington Bailey. He changed his name to Frederick Douglass after he successfully escaped from slavery in 1838. He became a leader of the Underground Railroad ― a network of people, places, and routes that helped enslaved people escape to the north. He assisted other runaway slaves until they could safely get to other areas in the north. As a slave, he had taught himself to read and write and he spread that knowledge to other slaves as well. Once free, he became a well-known abolitionist and strong believer in equality for all people including Blacks, Native Americans, women, and recent immigrants. He wrote several autobiographies describing his experiences as a slave. In addition to all this, he became the first African-American candidate for vice president of the United States."},
{"no": 145, "school": "", "pref": "29", "type": "", "diff": "", "stem": "일부 국가가 더 엄격한 뇌사 판정 지침을 제안한 상황은 언제인가?", "p": "29-145", "choices": ["장기 이식이 검토되고 있을 때", "환자가 치료를 거부했을 때", "병원이 환자 수를 줄일 때", "유족이 화장을 요구했을 때"], "ans": 1, "exp": "첫 문장에 장기를 다른 사람에게 옮기는 이식이 고려될 때라고 분명히 나와 있어요.\n📖 Some countries have proposed tougher guidelines for determining brain death when <b>transplantation ― transferring organs to others ― is under consideration</b>.\n   일부 국가는 장기를 남에게 옮기는 이식이 고려될 때 더 엄격한 뇌사 판정 지침을 제안했다.", "b": 1, "bb": "Some countries have proposed tougher guidelines for determining brain death when transplantation ― transferring organs to others ― is under consideration. In several European countries, there are legal requirements which specify that a whole team of doctors must agree over the diagnosis of death in the case of a potential donor. The reason for these strict regulations for diagnosing brain death in potential organ donors is, no doubt, to ease public fears of a premature diagnosis of brain death for the purpose of obtaining organs. But it is questionable whether these requirements reduce public suspicions as much as they create them. They certainly maintain mistaken beliefs that diagnosing brain death is an unreliable process lack precision. As a matter of consistency, at least, criteria for diagnosing the deaths of organ donors should be exactly the same as for those for whom immediate burial or cremation is intended."},

{"no": 161, "school": "", "pref": "30", "type": "", "diff": "", "stem": "글에 따르면 일부 사람들이 미니멀리즘에 부정적 인상을 받는 이유는?", "p": "30-161", "choices": ["소중한 물건을 버리는 일로 여기기 때문", "돈이 많이 드는 유행으로 보기 때문", "집을 넓혀야 한다고 생각하기 때문", "새 물건을 계속 사야 하기 때문"], "ans": 1, "exp": "첫 문장에 미니멀리즘이 값진 소유물을 희생하는 일이라고 생각하는 사람들이 있다고 했어요.\n📖 The term minimalism gives a negative impression to some people who think that it is <b>all about sacrificing valuable possessions</b>.\n   미니멀리즘이라는 말은 그것이 값진 소유물을 희생하는 일이라고 생각하는 사람들에게 부정적 인상을 준다.", "b": 1, "bb": "The term minimalism gives a negative impression to some people who think that it is all about sacrificing valuable possessions. This insecurity naturally stems from their attachment to their possessions. It is difficult to distance oneself from something that has been around for quite some time. Being an emotional animal, human beings give meaning to the things around them. So, the question arising here is that if minimalism will hurt one's emotions, why become a minimalist? The answer is very simple; the assumption of the question is fundamentally wrong. Minimalism does not hurt emotions. You might feel a bit sad while getting rid of a useless item but sooner than later, this feeling will be maintained by the joy of clarity. Minimalists never argue that you should leave every convenience of the modern era. They are of the view that you only need to eliminate stuff that is unused or not going to be used in the near future."},

{"no": 177, "school": "", "pref": "31", "type": "", "diff": "", "stem": "Stratton이 며칠 동안 한 일은 무엇인가?", "p": "31-177", "choices": ["거꾸로 보이는 안경을 며칠 썼다", "안경을 아예 쓰지 않고 지냈다", "매일 다른 안경을 바꿔 썼다", "한쪽 눈만 가린 채 생활했다"], "ans": 1, "exp": "그는 며칠 동안 역전 안경을 썼고, 그 때문에 세상이 말 그대로 뒤집혀 보였다고 했어요.\n📖 Stratton <b>wore reversing glasses for several days</b>, which literally turned the world upside down for him.\n   스트래튼은 며칠 동안 역전 안경을 썼고, 그것은 그에게 세상을 말 그대로 거꾸로 만들었다.", "b": 1, "bb": "A remarkable characteristic of the visual system is that it has the ability of (…). Psychologist George M. Stratton made this clear in an impressive self-experiment. Stratton wore reversing glasses for several days, which literally turned the world upside down for him. In the beginning, this caused him great difficulties: just putting food in his mouth with a fork was a challenge for him. With time, however, his visual system adjusted to the new stimuli from reality, and he was able to act normally in his environment again, even seeing it upright when he concentrated. As he took off his reversing glasses, he was again confronted with problems: he used the wrong hand when he wanted to reach for something, for example. Fortunately, Stratton could reverse the perception, and he did not have to wear reversing glasses for the rest of his life. For him, everything returned to normal after one day."},

{"no": 192, "school": "", "pref": "31", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "31-192", "choices": ["특징을 말한 뒤 실험으로 입증하고 결말을 전한다", "두 실험의 결과를 항목별로 나누어 비교한다", "통계를 먼저 제시하고 반대 의견을 반박한다", "여러 사람의 증언을 시간 순서로 나열한다"], "ans": 1, "exp": "시각 체계의 특징을 먼저 말하고, 스트래튼의 실험으로 보여 준 뒤, 하루 만에 정상이 되었다는 결말로 끝나요.\n📖 <b>Psychologist George M. Stratton made this clear in an impressive self-experiment.</b>\n   심리학자 조지 M. 스트래튼이 인상적인 자기 실험으로 이것을 분명히 보여 주었다.", "b": 1, "bb": "A remarkable characteristic of the visual system is that it has the ability of (…). Psychologist George M. Stratton made this clear in an impressive self-experiment. Stratton wore reversing glasses for several days, which literally turned the world upside down for him. In the beginning, this caused him great difficulties: just putting food in his mouth with a fork was a challenge for him. With time, however, his visual system adjusted to the new stimuli from reality, and he was able to act normally in his environment again, even seeing it upright when he concentrated. As he took off his reversing glasses, he was again confronted with problems: he used the wrong hand when he wanted to reach for something, for example. Fortunately, Stratton could reverse the perception, and he did not have to wear reversing glasses for the rest of his life. For him, everything returned to normal after one day."},

{"no": 289, "school": "", "pref": "38", "type": "", "diff": "", "stem": "글에 따르면 더 균일한 작물을 만드는 일의 위험은?", "p": "38-289", "choices": ["재난이 닥칠 때 더 위험해진다", "수확 시기가 매년 늦어진다", "맛이 점점 단순해져 버린다", "농부의 수입이 바로 줄어든다"], "ans": 1, "exp": "첫 문장에서 균일한 작물일수록 재난이 닥칠 때 더 위험하다고 했습니다.\n📖 the danger of creating more uniform crops is that they are <b>more at risk when it comes to disasters</b>\n   더 균일한 작물을 만드는 일의 위험은 재난이 닥칠 때 더 위험해진다는 점이다.", "b": 1, "bb": "Leaving the contribution of that strategy to one side, the danger of creating more uniform crops is that they are more at risk when it comes to disasters. The decline in the diversity of our food is an entirely human-made process. The biggest loss of crop diversity came in the decades that followed the Second World War. In an attempt to save millions from extreme hunger, crop scientists found ways to produce grains such as rice and wheat on an enormous scale. And thousands of traditional varieties were replaced by a small number of new super-productive ones. The strategy worked spectacularly well, at least to begin with. Because of it, grain production tripled, and between 1970 and 2020 the human population more than doubled. Specifically, a global food system that depends on just a narrow selection of plants has a greater chance of not being able to survive diseases, pests and climate extremes."},

{"no": 321, "school": "", "pref": "40", "type": "", "diff": "", "stem": "초기 문화진화 모형들이 문화와 유전자를 연결한 방식으로 가장 적절한 것은?", "p": "40-321", "choices": ["유전자 지도를 문화권별로 비교했다", "집단유전학의 개념을 문화에 적용했다", "문화 자료를 유전자 분석에 넣었다", "문화 전달을 수학에서 떼어 냈다"], "ans": 2, "exp": "첫 문장에 나와 있어요. 초기 모형들은 '이론적 집단유전학'의 개념을 가져다가 문화에 적용하는 방식으로 문화와 유전자를 이어 붙였습니다.\n📖 by using concepts from <b>theoretical population genetics</b> and applying them to culture\n   이론적 집단유전학의 개념을 사용해 그것을 문화에 적용함으로써", "b": 1, "bb": "Many of the first models of cultural evolution drew noticeable connections between culture and genes by using concepts from theoretical population genetics and applying them to culture. Cultural patterns of transmission, innovation, and selection are conceptually likened to genetic processes of transmission, mutation, and selection. However, these approaches had to be modified to account for the differences between genetic and cultural transmission. For example, we do not expect the cultural transmission to follow the rules of genetic transmission strictly. If two biological parents have different forms of a cultural trait, their child is not necessarily equally likely to acquire the mother's or father's form of that trait. Further, a child can acquire cultural traits not only from its parents but also from nonparental adults and peers; thus, the frequency of a cultural trait in the population is relevant beyond just the probability that an individual's parents had that trait."},

})();

function renderTypeRow(){

function goPassageSelect(){
  userSchool = document.getElementById('si').value;
  userName = document.getElementById('ni').value.trim();
  if(!userSchool){alert('학교를 선택해주세요!');return;}

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

// ── QUIZ ──────────────────────────────────────────
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v2';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 23년 12월 지문 깊이 풀기 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고123년12월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>

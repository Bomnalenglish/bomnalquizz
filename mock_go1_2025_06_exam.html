{"no": 4, "school": "부천고", "pref": "19", "type": "어법", "diff": "", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "19-4", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 3, "exp": "출처: 부천고 · 고1 25년 6월 19번 내신기출", "b": 1, "bb": "Maya waited in line to check in for her flight. Her expectations about her European backpacking trip ⓐwere really high. She had ⓑbeen looking forward to the trip for a year. She couldn't wait to visit museums in Madrid and see the Eiffel Tower at night in Paris. ⓒStood in line, she could feel those experiences were finally so close. When she approached the counter, the airline employee asked to see her passport. Maya reached into her pocket but felt nothing. She realized she had left her passport at home, meaning ⓓthat her plans were ruined. She was desperate, knowing she was forced ⓔto delay her dream trip unless she had her passport."},
{"no": 5, "school": "달천고", "pref": "20", "type": "내용 이해", "diff": "", "stem": "다음 글에서 밑줄 친 문장이 의미하는 바로 가장 적절한 것은?", "p": "20-5", "choices": ["habit formation through repetition alone", "the role of convenience in habit formation", "the minimal impact of ease on habit formation", "the influence of personal preference on habit formation", "the necessity of willpower and discipline in forming habits"], "ans": 2, "exp": "출처: 달천고 · 고1 25년 6월 20번 내신기출", "b": 1, "bb": "People often ask me, \"What surprises you most about habits?\" One thing that continually astonishes me is the degree to which we're influenced by sheer convenience. The amount of effort, time, or decision making required by an action has a huge influence on habit formation. To a truly remarkable extent, we're more likely to do something if it's convenient, and less likely if it's not. For this reason, we should pay close attention to the convenience of any activity we want to make into a habit. Putting a wastebasket next to our front door made mail sorting slightly more convenient, and I stopped procrastinating with this chore. Many people report that they do a much better job of staying close to distant family members now that tools like group chats make it easy to stay in touch."},

{"no": 67, "school": "강서고", "pref": "24", "type": "내용 이해", "diff": "", "stem": "다음 글의 괄호 (A)~(E)에 들어갈 단어의 영영풀이로 적절하지 않은 것은?", "p": "24-67", "choices": ["(A): to have the same opinion", "(B): an act of breaking a rule or law", "(C): the way in which someone understands or explains something", "(D): people who are responsible for making sure that the rules of a game are followed", "(E): showing an unreasonable like or dislike based on personal opinions"], "ans": 2, "exp": "출처: 강서고 · 고1 25년 6월 24번 내신기출", "b": 1, "bb": "We think we're being logical, objective, and rational ─ and therefore accurate in our analysis, judgment, and decisions. So we think that if other people are logical, objective, and rational, they will (A)________ with us and see what we see. But the opposite is the case. Every human brain is different. Everyone's life experience is different. Everyone's desires and knowledge are different. You might think you're being realistic ─ that is, that your ideas match (B)________, but that's impossible. It's only your (C)________ of reality, which will always be different from someone else's. When two nations play each other in the World Cup, the fans of each country criticize the (D)________ for missing all the infractions that the other team commits. Without fail, each fan base believes that the referees are (E)________ against their team."},

{"no": 69, "school": "연송고", "pref": "24", "type": "문장 삽입", "diff": "", "stem": "다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "p": "24-69", "choices": ["(A)", "(B)", "(C)", "(D)", "(E)"], "ans": 2, "exp": "정답 자리 (B) — 바로 뒤 문장: Everyone's life experience is different and everyone's desires and knowledge are different…  출처: 연송고 · 고1 25년 6월 24번 내신기출", "b": 1, "bb": "【주어진 문장】\nUnfortunately, what actually happens is completely different from what we might expect.\n\n【지문】\nWe think we're being logical, objective, and rational – and therefore accurate in our analysis, judgment, and decisions. (A) So we think that if other people are logical, objective, and rational, they will agree with us and see what we see. (B) Everyone's life experience is different and everyone's desires and knowledge are different. (C) This explains why what we call \"reality\" is really just our own interpretation of it, which will almost always differ from someone else's. (D) When two nations play each other in the World Cup, the fans of each country criticize the referees for missing all the infractions that the other team commits. (E) Without fail, each fan base believes that the referees are biased against their team."},

{"no": 78, "school": "부천고", "pref": "26", "type": "내용 일치", "diff": "", "stem": "다음 Edward O. Wilson에 관한 글의 내용과 일치하는 것은?", "p": "26-78", "choices": ["1929년에 Birmingham에서 태어났다.", "어린 시절에 사고로 인해 낚시에 관심을 갖게 되었다.", "Alabama와 Harvard 대학 교수로서 진화생물학을 가르쳤다.", "진화 생물학 분야에서 Nobel Prize를 수상했다.", "'현대의 다윈'이라는 책으로 유명하다."], "ans": 1, "exp": "출처: 부천고 · 고1 25년 6월 26번 내신기출", "b": 1, "bb": "Edward O. Wilson was born in Birmingham, Alabama, in 1929. In his early childhood, he became interested in nature and spent much time in the outdoors. At age seven, he was partially blinded in a fishing accident; his reduced sight led Wilson to the study of ants. He could not observe larger animals from a distance. Instead, he concentrated on smaller creatures he could study up close. After studying evolutionary biology at the University of Alabama, Wilson transferred to Harvard University, where he became a professor in 1956. He never received a Nobel Prize – the prize didn't recognize research in the field of evolutionary biology. However, he was awarded the Crafoord Prize in 1990. Wilson, known to some as the \"modern-day Darwin\", died at the age of 92 in Massachusetts."},

{"no": 93, "school": "함월고", "pref": "30", "type": "내용 이해", "diff": "", "stem": "다음 글 (A)를 다시 작성하여 (B)로 완성하고자 한다. 밑줄 친 ⓐ~ⓕ 중, 글 (A)의 의미를 적절하게 전달하지 못한 것의 개수는?", "p": "30-93", "choices": ["1개", "2개", "3개", "4개", "5개"], "ans": 2, "exp": "출처: 함월고 · 고1 25년 6월 30번 내신기출", "b": 1, "bb": "It is natural for people to observe happenings and then seek explanations for why those happenings occurred. But sometimes the reasoning is wrong because of one or more misconceptions. One of these is the ecological fallacy, where an argument claims that there is a causal relationship between two things merely because they occur together. For example, in the 1950s it was found that crime rates were the highest in neighborhoods where immigrants were most numerous. Some people used this \"co-occurrence\" to argue that immigrants were a cause of crime. But a careful analysis of this situation revealed that immigrants were forced to live in neighborhoods where crime rates were already high; they could not afford more expensive housing in safer neighborhoods. Immigrants themselves committed very few of the crimes. Unless you analyze the claim carefully, you would misinterpret the relationship and thereby construct a faulty belief."},
{"no": 94, "school": "영종고", "pref": "30", "type": "문장 삽입", "diff": "", "stem": "다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은? [25년 6월 21번 변형]", "p": "30-94", "choices": ["(A)", "(B)", "(C)", "(D)", "(E)"], "ans": 4, "exp": "정답 자리 (D)  출처: 영종고 · 고1 25년 6월 30번 내신기출", "b": 1, "bb": "【주어진 문장】\nStill, the connection between internal beliefs and external behaviors can be even more surprising.\n\n【지문】\nIt is natural for people ⓐto observe happenings and then seek explanations for why those happenings occurred. However, sometimes they make mistakes in their reasoning. One of these mistakes ⓑis called the ecological fallacy. It is a well-known concept, ⓒin which an argument claims that there is a causal relationship between two things merely because they occur together. For instance, imagine a study in the past ⓓhad shown that cities with more bicycle lanes also had higher accident rates. Even today, some people might argue that bike lanes cause accidents. But a deeper analysis might show that these cities already had high traffic volumes, ⓔthat led to both more accidents and the need for bike lanes. Such reasoning patterns, if left unchallenged, can last a long time and affect how we understand things today. If people (A)다른 원인들을 더 신중하게 분석했더라면 back then, we (B)그 인과 관계를 오해하지 않을 것이다 today. Failing to examine the claim closely could lead you to misinterpret the relationship and construct a faulty belief."},
{"no": 95, "school": "영생고", "pref": "30", "type": "문장 삽입", "diff": "", "stem": "다음 글의 흐름으로 보아 주어진 문장이 들어가기에 가장 적절한 곳은?", "p": "30-95", "choices": ["(A)", "(B)", "(C)", "(D)", "(E)"], "ans": 1, "exp": "정답 자리 (A) — 바로 뒤 문장: For example, in the 1950s it was found that crime rates were the highest in neighborhoods …  출처: 영생고 · 고1 25년 6월 30번 내신기출", "b": 1, "bb": "【주어진 문장】\nIt occurs when an argument claims that there is a causal relationship between two things merely because they occur together.\n\n【지문】\nIt is natural for people to observe happenings and then seek explanations for why those happenings occurred. But sometimes the reasoning is wrong because of one or more misconceptions. One of these is the ecological fallacy. (A) For example, in the 1950s it was found that crime rates were the highest in neighborhoods where immigrants were most numerous. (B) Some people used this \"co-occurrence\" to argue that immigrants were a cause of crime. (C) But a careful analysis of this situation revealed that immigrants were forced to live in neighborhoods where crime rates were already high; they could not afford more expensive housing in safer neighborhoods. (D) Immigrants themselves committed very few of the crimes. (E) Unless you analyze the claim carefully, you would misinterpret the relationship and thereby construct a faulty belief."},
{"no": 96, "school": "수택고", "pref": "30", "type": "문장 삽입", "diff": "", "stem": "다음 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?", "p": "30-96", "choices": ["(A)", "(B)", "(C)", "(D)", "(E)"], "ans": 4, "exp": "정답 자리 (D) — 바로 뒤 문장: In fact, the immigrants themselves committed very few crimes. (E) Unless we study the fact…  출처: 수택고 · 고1 25년 6월 30번 내신기출", "b": 1, "bb": "【주어진 문장】\nHowever, the truth was that immigrants lived there only because the housing was cheap; the crime was already there.\n\n【지문】\nPeople naturally try to understand why things happen, but sometimes they make mistakes. One specific mistake is called the \"ecological fallacy.\" (A) This happens when people think that because two things occur at the same time, one must cause the other. (B) For example, in the 1950s, neighborhoods with many immigrants also had a lot of crime. (C) People blamed the immigrants for the crime. (D) In fact, the immigrants themselves committed very few crimes. (E) Unless we study the facts carefully, we can easily misunderstand the situation and believe things that aren't true."},

{"no": 132, "school": "신송고", "pref": "32", "type": "내용 이해", "diff": "", "stem": "다음 글에서 밑줄 친 a common trap이 의미하는 바로 가장 적절한 것은?", "p": "32-132", "choices": ["a feeling of ownership that their products will monopolize the market", "strong conviction that setting a high price is necessary to appeal to consumers", "their firm belief that prices must be lowered to make a product more attractive", "reasonable judgments leading to pricing products appropriately based on the market research", "their strong emotional connection to the product making them think it is worth more than it actually is"], "ans": 5, "exp": "출처: 신송고 · 고1 25년 6월 32번 내신기출", "b": 1, "bb": "Most entrepreneurs put in tremendous amounts of time and effort in creating and launching new products and services and then fall into a common trap. They have created something they care deeply about, it's theirs, and this powerful sense of ownership distorts their perception of value which causes them to overprice their products. While many of them are quick to realize that their initial prices are too high, not all these people are happy or willing to drop their prices to make their products more attractive. And this can be a very costly mistake that may lead to the failure of their new business. When you launch a new product or service, your priority should be to get sufficient market adoption as soon as possible and you should be ready to sacrifice your initial prices and profits to achieve this aim. Once you have strong sales volumes, you can increase your prices to maximize your profits."},

{"no": 220, "school": "성모여고", "pref": "36", "type": "내용 일치", "diff": "", "stem": "다음 글의 내용과 일치하는 것은?", "p": "36-220", "choices": ["고대 로마는 내부적 분열로 멸망했다.", "대영 제국은 2차 세계대전 시기에 침략당하여 멸망했다.", "잉카 문명은 과도한 팽창 끝에 붕괴한 대표적인 사례이다.", "역사의 반복성은 고고학자들 사이에서 널리 입증된 사실이다.", "몇몇의 문명은 팽창할 기회도 얻지 못하고 몰락했다."], "ans": 5, "exp": "출처: 성모여고 · 고1 25년 6월 36번 내신기출", "b": 1, "bb": "History, people often say, repeats itself. And looking at the historical records of the ancient civilizations, some things do seem to happen again and again. Civilizations expand, get overextended, and then collapse as in the cases of Rome, which went under in 476 AD, and the British Empire, which fell apart more than a thousand years later in the post-World War Ⅱ era. But is this always the case? If so, archaeology would be pretty boring; one thing would happen again and again. But that's not what archaeologists see. Some civilizations end suddenly, like the Aztec and Inca, conquered by invaders in the 1520s AD. Those empires never had the chance to collapse as a result of overexpansion. So in the case of civilizations, \"history repeats itself\" seems to be an oversimplification."},

{"no": 234, "school": "자운고", "pref": "36", "type": "주제", "diff": "", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "36-234", "choices": ["the flawed belief that history always follows a repetitive pattern", "the similarities between ancient and modern civilizations", "the role of archaeology in studying ancient civilizations", "the main causes of the Roman Empire's rapid expansion and collapse", "the advantages from endless cycle of the rise and fall in the history of civilization"], "ans": 1, "exp": "출처: 자운고 · 고1 25년 6월 36번 내신기출", "b": 1, "bb": "People often claim that history repeats itself. When examining the records of ancient civilizations, it does appear that certain patterns happen again and again. Many civilizations expand, get overextended, and eventually fall apart – just like the Roman Empire, which collapsed in 476 AD, and the British Empire, which disintegrated over a thousand years later after World War Ⅱ. But does this pattern always hold true? If it did, archaeology would be rather boring, showing the same outcome time after time. However, that's not what archaeologists actually find. Some civilizations, such as the Aztec and Inca empires, came to end suddenly when they were conquered by invaders in the 1520s AD. These empires never reached the stage of collapse due to over-expansion. Therefore, when it comes to civilizations, the idea that \"history repeats itself\" seems to be an oversimplification."},
{"no": 235, "school": "영종고", "pref": "37", "type": "내용 불일치", "diff": "", "stem": "윗글의 내용과 일치하지 않는 것은?", "p": "37-235", "choices": ["The concept of \"growth mindset\" was first introduced by Dr. Carol Dweck.", "A child praised for being smart often avoids hard tasks to keep looking smart.", "Kids praised for effort believe that trying hard helps them succeed.", "A child with a growth mindset tries more difficult things and feels more confident.", "According to Dweck, focusing on effort provides children with something they cannot manage."], "ans": 5, "exp": "출처: 영종고 · 고1 25년 6월 37번 내신기출", "b": 1, "bb": "Stanford psychology professor Dr. Carol Dweck is the internationally recognized pioneer of the concept of \"growth mindset\" as a way to continually grow, learn, and persevere in our efforts. Dweck found that kids who are told they're \"smart\" actually underperform in future tasks, by choosing easier tasks to avoid evidence that they are not smart, which Dweck calls having a \"fixed mindset.\" In contrast, Dweck found, kids who are praised not for their smarts but for their effort develop what Dweck calls a \"growth mindset.\" They learn that their effort is what led to their success, and if they continue to try, over time they'll improve and achieve more things. These kids end up taking on tougher things, and feel better about themselves. \"Emphasizing effort gives a child a variable that they can control,\" Dweck has explained."},

{"no": 258, "school": "석정여고", "pref": "37", "type": "흐름", "diff": "", "stem": "다음 글에서 전체 흐름과 관계없는 문장은?", "p": "37-258", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 1, "exp": "출처: 석정여고 · 고1 25년 6월 37번 내신기출", "b": 1, "bb": "Stanford psychology professor Dr. Carol Dweck is the internationally recognized pioneer of the concept of \"growth mindset\" as a way to continually grow, learn, and persevere in our efforts. Dweck found that kids who are told they're \"smart\" actually underperform in future tasks, by choosing easier tasks to avoid evidence that they are not smart, which Dweck calls having a \"fixed mindset.\" ⓐSmart children may also feel lonely or experience conflicts with peers because they feel different from others. ⓑIn contrast, Dweck found, kids who are praised not for their smarts but for their effort develop what Dweck calls a \"growth mindset.\" ⓒThey learn that their effort is what led to their success, and if they continue to try, over time they'll improve and achieve more things. ⓓThese kids end up taking on tougher things, and feel better about themselves. ⓔ\"Emphasizing effort gives a child a variable that they can control,\" Dweck has explained."},

{"no": 276, "school": "", "pref": "39", "type": "내용 불일치", "diff": "", "stem": "다음 글의 Diving reflex에 관한 내용과 일치하지 않는 것은?", "p": "39-276", "choices": ["다른 해양 포유동물들도 잠수 반사를 한다.", "얼굴만 물에 담그고 나머지 몸이 공기 중에 있어도 잠수 반사는 작동한다.", "잠수 반사는 기도를 닫고 폐 속의 작은 기도들을 넓히는 작용을 한다.", "이 반사 작용은 심장 박동을 느리게 하고 혈액을 주요 장기로 보내는 데 도움을 준다.", "침팬지나 고릴라는 얼굴이 물에 잠기면 심장이 빨라져 익사 위험이 높아진다."], "ans": 3, "exp": "출처: 전국 고교 · 고1 25년 6월 39번 내신기출", "b": 1, "bb": "We have a 'diving reflex', like other marine mammals. This means that special nerve endings on our faces, around the mouth and nose, trigger this reflex only when the facial region goes under water. If we are in the water, with our head out in the air, there is no diving reflex. But if we sink just our face in a bowl of water, while the whole of the rest of our body is in the dry air, the diving reflex is triggered. It automatically closes down the airway, reducing the risk of swallowing water, and it narrows the small air-passages in the lungs. At the same time the heart rate is slowed down to half speed and blood is shunted to the vital organs, protecting them from the effects of the brief stop in breathing. By contrast, if a chimpanzee or a gorilla found itself in water with its face below the surface, it would panic, its heart would race and it would quickly drown."},

{"no": 293, "school": "청라고", "pref": "39", "type": "흐름", "diff": "", "stem": "다음 글에서 전체 흐름과 관계없는 문장은?", "p": "39-293", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 3, "exp": "출처: 청라고 · 고1 25년 6월 39번 내신기출", "b": 1, "bb": "Humans, like some marine mammals, have a 'diving reflex' that is triggered when water comes into contact with the face, especially around the mouth and nose. This reflex causes the airway to close, slows the heart rate, and directs blood to vital organs, thereby reducing the risk of drowning and protecting the body during brief periods without breathing. ⓐIf a person immerses only their face in water while the rest of the body remains in the air, the diving reflex is still activated. ⓑThis automatic response is not observed when the head is above water, even if the body is submerged. ⓒInterestingly, some people can voluntarily hold their breath for several minutes after training, which is a skill used in free diving competitions. ⓓIn contrast, apes such as chimpanzees and gorillas, when faced with water covering their faces, experience panic and an increased heart rate, making them more likely to drown. ⓔThus, the diving reflex in humans is a unique adaptation that increases survival chances in aquatic situations."},
{"no": 294, "school": "영생고", "pref": "39", "type": "흐름", "diff": "", "stem": "다음 글에서 전체 흐름과 관계없는 문장은?", "p": "39-294", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 4, "exp": "출처: 영생고 · 고1 25년 6월 39번 내신기출", "b": 1, "bb": "We have a 'diving reflex', like other marine mammals. This means that special nerve endings on our faces, around the mouth and nose, trigger this reflex only when the facial region goes under water. If we are in the water, with our head out in the air, there is no diving reflex. ⓐBut if we sink just our face in a bowl of water, while the whole of the rest of our body is in the dry air, the diving reflex is triggered. ⓑIt automatically closes down the airway, reducing the risk of swallowing water, and it narrows the small air-passages in the lungs. ⓒAt the same time the heart rate is slowed down to half speed and blood is shunted to the vital organs, protecting them from the effects of the brief stop in breathing. ⓓInfants especially tend to develop the diving reflex more quickly than adults. ⓔBy contrast, if a chimpanzee or a gorilla found itself in water with its face below the surface, it would panic, its heart would race and it would quickly drown."},
{"no": 295, "school": "인일여고", "pref": "40", "type": "내용 이해", "diff": "", "stem": "다음 글에서 밑줄 친 \"cognitive misers\"가 의미하는 바로 가장 적절한 것은?", "p": "40-295", "choices": ["People tend to use complex reasoning when facing problems.", "We are easily fooled by false information despite our efforts.", "Lying leads to errors in how we process information cognitively.", "Humans always analyze every piece of information before accepting it as true.", "We typically don't expend more mental effort than seems necessary in a given situation."], "ans": 5, "exp": "출처: 인일여고 · 고1 25년 6월 40번 내신기출", "b": 1, "bb": "There is a natural assumption of truth, or a truth bias when humans communicate with one another. In other words, when we're listening to others or reading their words, our automatic assumption is that the other person is telling the truth. This usually works out fine. If you ask someone where the restroom is located or if it's raining outside, you can safely assume that most people will not lie in their responses. Imagine how difficult it would be to converse with someone if you assumed that everything they were telling you was false! Indeed, questioning the truth of a statement and then choosing not to believe it requires additional mental steps. For the most part, humans are \"cognitive misers.\" It makes sense then, that when we see something online, even if it is fake, our default is to believe it, at least at first."},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

// ── QUIZ ──────────────────────────────────────────
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/([①②③④⑤])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}

function fmtIns(h, q){
  h = h.replace(/^\s*[\[【]\s*학교 변형 지문\s*[\]】]\s*\n?/, '<div class="pb-note">학교 변형 지문</div>');
  h = h.replace(/[\[【]\s*주어진 문장\s*[\]】]\s*\n?([\s\S]*?)\n\s*\n\s*[\[【]\s*지문\s*[\]】]\s*\n?/,
      function(_, g){ return '<div class="given-box"><div class="given-lbl">📌 주어진 문장</div>' + g.trim()
        + '</div><div class="pass-lbl">📖 지문 — 위 문장이 들어갈 자리를 고르세요</div>'; });
  if (q && /들어가기에 가장 적절/.test(q.stem||'')){
    h = h.replace(/\(\s*([①②③④⑤])\s*\)/g, '<span class="slot">$1</span>');
    h = h.replace(/\(([A-E])\)/g, '<span class="slot">$1</span>');
  }
  return h;
}

function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(fmtIns(escHTML(q.body), q), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.textContent='💡 '+q.exp;fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v3';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 25년 6월 전국기출 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고125년6월_전국기출',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>봄날 문제은행 — 오답노트</title>
<style>
:root{
  --ink:#1c1a17; --sub:#6f675c; --line:#ded7c9; --paper:#fbf9f4;
  --pick:#2f6f5a; --pickbg:#e3f0ea; --warn:#8c2f22;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.55;
}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
h1{font-size:20px;margin:0 0 2px}
.lead{color:var(--sub);font-size:13px;margin:0 0 18px}

.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel > h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}

/* students */
.students{display:flex;flex-wrap:wrap;gap:6px}
.stu{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 13px;font-size:14px;cursor:pointer;
}
.stu.on{background:var(--pick);border-color:var(--pick);color:#fff}
.stu .cnt{font-size:11px;opacity:.75;margin-left:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input[type=text]{
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit;font-size:14px;
  background:#fff;color:inherit;
}
button{
  border:1px solid var(--line);background:#fff;color:inherit;border-radius:7px;
  padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;
}
button:hover{border-color:#b9af9c}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
button.danger{color:var(--warn)}
button:disabled{opacity:.4;cursor:not-allowed}

/* sources + grid */
.srcbtns{margin-bottom:12px}
.src{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;font-size:13.5px;cursor:pointer;text-align:left}
.src.on{background:var(--pickbg);border-color:var(--pick);color:#1e4c3e;font-weight:600}
.src .n{color:var(--sub);font-weight:400;font-size:12px;margin-left:5px}
.grp{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
     padding:6px 8px;margin:8px 0 4px;border-radius:6px;font-size:13px;color:var(--ink)}
.grp:hover{background:#f2eee5}
.grp .arw{color:var(--sub);font-size:11px;width:10px}
.grp .gn{color:var(--sub);font-weight:400;font-size:12px}
.grp.has b{color:var(--pick)}
.grp .gsel{margin-left:6px;font-size:12px;color:var(--pick);background:var(--pickbg);
           border-radius:5px;padding:2px 7px}
.grpbody{display:flex;flex-wrap:wrap;gap:6px;padding-left:18px;margin-bottom:6px}
.grpbody.deep{padding-left:38px}
.grp.deep{margin-left:20px;font-size:12.5px}
.grp.deep b{font-weight:600;color:var(--sub)}
.grp.deep.has b{color:var(--pick)}
.emptyhint{color:var(--sub);font-size:13px;padding:8px 2px}
.warnbox{margin-top:8px;padding:7px 10px;border-radius:7px;font-size:12.5px;
         background:#f7e9e6;color:var(--warn);border:1px solid #e6cdc8}
.srcgrp{flex:0 0 100%;display:flex;align-items:center;gap:7px;margin:12px 0 0}
.fname{border:1px solid transparent;border-radius:6px;background:none;font-size:12px;
       font-weight:700;color:var(--sub);padding:3px 6px;font-family:inherit}
.fname:hover{border-color:var(--line);background:#fff}
.fname:focus{border-color:var(--pick);background:#fff;color:var(--ink);outline:none}
.fcnt{font-size:12px;color:var(--sub);font-weight:400}
.srcgrp.deep{margin-left:24px}
.srcgrp.deep .fname{font-weight:400}
.fdel{border:0;background:none;color:var(--warn);font-size:12px;cursor:pointer;padding:0 4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.cell{
  border:1px solid var(--line);background:#fff;border-radius:6px;
  padding:8px 0;text-align:center;font-size:13.5px;cursor:pointer;
}
.cell.on{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700}
.cell .t{display:block;font-size:9.5px;opacity:.6;line-height:1.1}
.cell.on .t{opacity:.85}

.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--sub)}
.opts label{display:flex;gap:5px;align-items:center;cursor:pointer}

textarea{
  width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;
  font:inherit;font-size:13px;line-height:1.5;background:#fff;color:inherit;resize:vertical;
  font-family:ui-monospace,"D2Coding",Menlo,monospace;
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.fld{font-size:12.5px;color:var(--sub);margin:0 0 4px}
.srclist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tagx{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;background:#fff}
.tagx b{font-weight:600}
.tagx button{border:0;background:none;padding:0 0 0 7px;color:var(--warn);cursor:pointer;font-size:13px}
.fsel{margin-left:8px;border:1px solid var(--line);border-radius:6px;background:#fff;
      font-size:12px;padding:2px 4px;color:var(--sub);cursor:pointer;max-width:130px}
.summary{font-size:13.5px;color:var(--sub);margin-top:10px}
.summary b{color:var(--ink)}
.bar{position:sticky;bottom:0;background:var(--paper);padding:12px 0 6px;margin-top:6px;
     border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--sub)}

/* ---------- print sheet ---------- */
#sheet{display:none}
@media screen{ #sheet.show{display:block;background:#fff;padding:24px;border:1px solid var(--line);border-radius:10px} }

#sheet{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:9pt;line-height:1.55;color:#1c1a17}
#sheet .head{border-bottom:2px solid #1c1a17;padding-bottom:9px;margin-bottom:20px}
#sheet .head h2{font-size:15pt;margin:0 0 3px}
#sheet .head .m{color:#6f675c;font-size:8pt}
#sheet .part{font-size:10.5pt;margin:26px 0 4px;padding:6px 10px;background:#1c1a17;color:#fff}
#sheet .part small{display:block;font-weight:400;font-size:8pt;opacity:.8;margin-top:2px}
#sheet .pas{background:#f6f3ec;border-left:3px solid #ded7c9;padding:10px 12px;margin:12px 0 9px;font-size:9pt;line-height:1.62}
#sheet .pas p{margin:0 0 7px}
#sheet .pas p:last-child{margin-bottom:0}
#sheet .q{margin:0 0 16px;page-break-inside:avoid}
#sheet .q .st{font-weight:700;margin:0 0 5px}
#sheet .q .no{display:inline-block;min-width:2.1em;color:#8c2f22;font-weight:700}
#sheet .q ul{list-style:none;margin:0;padding:0 0 0 2.1em}
#sheet .q li{margin:0 0 3px;text-indent:-1.4em;padding-left:1.4em}
#sheet .wr{border-bottom:1px solid #ded7c9;height:20px;margin:6px 0 0 2.1em}
#sheet .keys{margin-top:34px;border-top:2px solid #1c1a17;padding-top:12px;page-break-before:always}
#sheet .keys h3{font-size:11pt;margin:0 0 10px}
#sheet .kg{margin-bottom:14px;page-break-inside:avoid}
#sheet .kg h4{font-size:9.5pt;margin:0 0 5px;color:#8c2f22}
#sheet .kg dt{float:left;clear:left;width:5.6em;font-weight:700}
#sheet .kg dd{margin:0 0 5px 5.8em;font-size:8.6pt}
#sheet .kg dl{margin:0}

@media print{
  body{background:#fff}
  .noprint{display:none !important}
  .wrap{max-width:none;padding:0}
  #sheet{display:block !important;padding:0;border:0}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div id="gate" class="noprint" style="position:fixed;inset:0;z-index:9999;background:#fbf9f4;display:flex;align-items:center;justify-content:center">
  <div style="text-align:center;max-width:320px;padding:24px">
    <div style="font-size:34px;margin-bottom:6px">📚</div>
    <h2 style="margin:0 0 4px;font-size:18px;color:#1c1a17">봄날 문제은행</h2>
    <p style="margin:0 0 16px;font-size:12.5px;color:#6f675c">선생님용입니다. 코드를 입력하세요.</p>
    <input id="gatePw" type="password" placeholder="선생님 코드" autocomplete="off"
      style="width:100%;padding:9px 11px;border:1px solid #ded7c9;border-radius:8px;font-size:14px;text-align:center">
    <div id="gateMsg" style="height:16px;margin-top:6px;font-size:12px;color:#8c2f22"></div>
    <button id="gateGo" style="width:100%;padding:9px;border:0;border-radius:8px;background:#2f6f5a;color:#fff;font-size:14px;cursor:pointer">들어가기</button>
  </div>
</div>
<script>
(function(){
  var CODE = "bomnalvaca2025";   // 관리자 사이트와 같은 코드
  var K = "bn_bank_ok";
  function open_(){ document.getElementById("gate").style.display = "none"; }
  try{ if(localStorage.getItem(K) === CODE){ open_(); return; } }catch(e){}
  function go(){
    var v = document.getElementById("gatePw").value.trim();
    if(v === CODE){ try{ localStorage.setItem(K, CODE); }catch(e){} open_(); }
    else { document.getElementById("gateMsg").textContent = "코드가 맞지 않습니다."; }
  }
  document.getElementById("gateGo").onclick = go;
  document.getElementById("gatePw").onkeydown = function(e){ if(e.key === "Enter") go(); };
  document.getElementById("gatePw").focus();
})();
</script>
<div class="wrap">

<div class="noprint">
  <h1>봄날 문제은행 <span style="font-size:13px;font-weight:400;color:var(--sub)">오답노트</span></h1>
  <p class="lead">학생을 고르고 → 자료별로 틀린 번호를 누르면 → 오답노트가 만들어집니다. 저장은 이 브라우저에 남습니다.</p>
  <p class="lead" style="font-size:12px;color:var(--sub);margin-top:-4px">__BUILDSTAMP__</p>

<script>
/* ========= data ========= */
const BASE = __BANK__;
let BANK = BASE.slice();
const BYCODE = {};
function rebuild(){
  BANK = BASE.concat(store.custom || []).filter(f => !(store.hidden||[]).includes(f.code));
  if(!BANK.length) BANK = BASE.slice();
  Object.keys(BYCODE).forEach(k => delete BYCODE[k]);
  BANK.forEach(f => BYCODE[f.code] = f);
  if(!BYCODE[curSrc]) curSrc = BANK[0].code;
}

/* ========= storage ========= */
const KEY = 'bomnal_wrongnote_v1';
let store = { students: [], marks: {}, custom: [], hidden: [] };   // marks[student][code] = [nos]
// 예전 판에 들어 있던 예시 학생. 한 번만 걷어낸다.
const OLDSEED = ['주현우','학생2','학생3','학생4','학생5','학생6','학생7',
                 '학생8','학생9','학생10','학생11','학생12','학생13'];
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) store = JSON.parse(r); }catch(e){}
  if(!store.students) store.students = [];
  if(!store.marks)  store.marks  = {};
  if(!store.custom) store.custom = [];
  if(!store.hidden) store.hidden = [];
  if(!store.folder) store.folder = {};
  if(!store.folders) store.folders = [];
  if(!store.seedCleared){                       // 예시 학생 제거 (최초 1회)
    store.students = store.students.filter(n => !OLDSEED.includes(n));
    OLDSEED.forEach(n => delete store.marks[n]);
    store.seedCleared = true;
  }
  save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* ========= state ========= */
let cur = null, curSrc = BANK[0].code;

/* ========= ui ========= */
const $ = id => document.getElementById(id);

function marksOf(name, code){
  store.marks[name] = store.marks[name] || {};
  let a = store.marks[name][code] || [];
  a = [...new Set(a)].sort((x,y)=>x-y);
  store.marks[name][code] = a;
  return a;
}
function totalOf(name){
  const m = store.marks[name] || {};
  return Object.values(m).reduce((a,b)=>a+b.length,0);
}

function drawStudents(){
  $('students').innerHTML = '';
  if(!store.students.length){
    $('students').innerHTML = '<div class="emptyhint">아래 칸에 이름을 적고 <b>추가</b>를 누르세요.</div>';
    return;
  }
  store.students.forEach(n => {
    const b = document.createElement('button');
    b.className = 'stu' + (n===cur?' on':'');
    b.innerHTML = n + '<span class="cnt">' + totalOf(n) + '</span>';
    b.onclick = () => { cur = n; drawAll(); };
    $('students').appendChild(b);
  });
}
// 폴더 이름. store.folder 로 덮어쓸 수 있어서 기본 자료도 옮길 수 있다.
const topOf = g => (g || '').split('/')[0].trim();
const subOf = g => ((g || '').split('/')[1] || '').trim();
const showPath = g => subOf(g) ? topOf(g) + ' › ' + subOf(g) : topOf(g);

const allFolders = () => [...new Set(
  BASE.concat(store.custom||[]).map(groupOf).concat(store.folders||[])
)];

const groupOf = f => (((store.folder||{})[f.code] || f.group || '기타') + '').trim() || '기타';

function drawSources(){
  const box = $('srcbtns'); box.innerHTML = '';
  store.closed = store.closed || [];

  // 경로별 자료 (경로 = "종촌고1" 또는 "종촌고1/교과서")
  const paths = [], byPath = {};
  BANK.forEach(f => {
    const g = groupOf(f);
    if(!byPath[g]){ byPath[g] = []; paths.push(g); }
    byPath[g].push(f);
  });
  (store.folders||[]).forEach(g => { if(!byPath[g]){ byPath[g] = []; paths.push(g); } });

  // 상위 폴더별로 다시 묶는다. 하위 없는 경로가 먼저 오도록 정렬한다.
  const tops = [], byTop = {};
  paths.forEach(pth => {
    const t = topOf(pth);
    if(!byTop[t]){ byTop[t] = []; tops.push(t); }
    byTop[t].push(pth);
  });
  tops.forEach(t => byTop[t].sort((x,y) => (subOf(x) ? 1 : 0) - (subOf(y) ? 1 : 0)));

  const countOf = list => cur ? list.reduce((a,f) => a + marksOf(cur, f.code).length, 0) : 0;

  const drawItems = (list, indent) => {
    const wrap = document.createElement('div');
    wrap.className = 'grpbody' + (indent ? ' deep' : '');
    if(!list.length){
      wrap.innerHTML = '<span class="emptyhint">비어 있습니다. 이 폴더에 넣을 파일을 채팅으로 올려 주세요.</span>';
    }
    list.forEach(f => {
      const b = document.createElement('button');
      b.className = 'src' + (f.code===curSrc?' on':'');
      const c = cur ? marksOf(cur, f.code).length : 0;
      b.innerHTML = esc(f.title) + '<span class="n">' + f.questions.length + '문항' + (c?' · 체크 '+c:'') + '</span>';
      b.onclick = () => { curSrc = f.code; drawAll(); };
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  };

  const header = (key, label, list, opt) => {
    const shut = store.closed.includes(key);
    const picked = list.find(f => f.code === curSrc);
    const marked = countOf(list);
    const h = document.createElement('div');
    h.className = 'grp' + (opt.deep ? ' deep' : '') + (picked ? ' has' : '');
    h.innerHTML = '<span class="arw">' + (shut ? '▸' : '▾') + '</span>' +
                  '<b>' + esc(label) + '</b>' +
                  '<span class="gn">' + opt.note + '</span>' +
                  (shut && picked ? '<span class="gsel">' + esc(picked.title) + '</span>' : '');
    h.onclick = () => {
      store.closed = shut ? store.closed.filter(x => x !== key) : store.closed.concat([key]);
      save(); drawSources();
    };
    box.appendChild(h);
    return shut;
  };

  tops.forEach(t => {
    const under = byTop[t];
    const allIn = under.reduce((a,pth) => a.concat(byPath[pth]), []);
    const subs  = under.filter(pth => subOf(pth));
    const note  = '자료 ' + allIn.length + '개'
                + (subs.length ? ' · 하위 ' + subs.length + '개' : '')
                + (countOf(allIn) ? ' · 체크 ' + countOf(allIn) : '');
    if(header(t, t, allIn, {note, deep:false})) return;

    under.forEach(pth => {
      const sub = subOf(pth), list = byPath[pth];
      if(!sub){ if(list.length) drawItems(list, false); return; }
      const note2 = '자료 ' + list.length + '개' + (countOf(list) ? ' · 체크 ' + countOf(list) : '');
      if(header(pth, sub, list, {note: note2, deep:true})) return;
      drawItems(list, true);
    });
  });
}
function shortType(stem){
  if(/일치하지/.test(stem)) return '불일치';
  if(/일치/.test(stem)) return '일치';
  if(/어법/.test(stem)) return '어법';
  if(/요약/.test(stem)) return '요약';
  if(/빈칸/.test(stem)) return '빈칸';
  if(/제목/.test(stem)) return '제목';
  if(/주제/.test(stem)) return '주제';
  if(/순서/.test(stem)) return '순서';
  if(/삽입|들어가기/.test(stem)) return '삽입';
  if(/밑줄/.test(stem)) return '밑줄';
  if(/배열|영작|쓰시오|서술/.test(stem)) return '서술';
  return '';
}
function drawGrid(){
  const f = BYCODE[curSrc];
  const sel = cur ? marksOf(cur, curSrc) : [];
  $('grid').innerHTML = '';
  f.questions.forEach(q => {
    const b = document.createElement('button');
    b.className = 'cell' + (sel.includes(q.no)?' on':'');
    b.innerHTML = q.no + '<span class="t">' + shortType(q.stem) + '</span>';
    b.title = q.stem;
    b.onclick = () => {
      if(!cur){ $('stuMsg').textContent = '먼저 위에서 학생을 고르세요.'; return; }
      const arr = marksOf(cur, curSrc);
      const i = arr.indexOf(q.no);
      if(i>=0) arr.splice(i,1); else arr.push(q.no);
      arr.sort((x,y)=>x-y);
      save(); drawAll();
    };
    $('grid').appendChild(b);
  });
}
function drawSummary(){
  if(!cur){ $('summary').textContent = '학생을 선택하세요.'; return; }
  const parts = BANK.map(f => {
    const a = marksOf(cur, f.code);
    return a.length ? f.title.split(' — ')[0] + ': ' + a.join(', ') : null;
  }).filter(Boolean);
  // 체크한 문항 중 정답이 비어 있는 게 있으면 인쇄 전에 알린다.
  // (해설 없는 것은 알리지 않는다 — 해설이 원래 없는 자료가 있어서 잔소리가 된다)
  let noAns = 0;
  BANK.forEach(f => {
    const a = marksOf(cur, f.code);
    f.questions.forEach(q => {
      if(a.includes(q.no) && !(q.answer || '').trim()) noAns++;
    });
  });
  const warn = noAns
      ? '<div class="warnbox">이 중 <b>' + noAns + '문항</b>은 자료에 정답이 없어 오답노트에 "(정답 미입력)" 으로 나옵니다.</div>'
      : '';

  $('summary').innerHTML = '<b>' + cur + '</b> — 총 <b>' + totalOf(cur) + '문항</b>' +
    (parts.length ? '<br>' + parts.join('<br>') : ' (아직 체크된 번호가 없습니다)') + warn;
}
function drawAll(){ drawStudents(); drawSources(); drawGrid(); drawSummary(); }

/* ========= student buttons ========= */
$('addStu').onclick = () => {
  const v = $('newName').value.trim();
  if(!v) return;
  if(store.students.includes(v)){ $('stuMsg').textContent = '같은 이름이 이미 있습니다.'; return; }
  store.students.push(v); $('newName').value=''; cur = v; save(); drawAll();
  $('stuMsg').textContent = '"' + v + '" 추가됨';
};
// prompt() 가 막히는 환경이 있어, 위의 이름칸에 적은 값으로 바꾼다
$('renStu').onclick = () => {
  if(!cur){ $('stuMsg').textContent = '바꿀 학생을 먼저 고르세요.'; return; }
  const v = $('newName').value.trim();
  if(!v){ $('newName').focus(); $('stuMsg').textContent = '왼쪽 칸에 새 이름을 적고 다시 누르세요.'; return; }
  if(v === cur){ $('stuMsg').textContent = '같은 이름입니다.'; return; }
  if(store.students.includes(v)){ $('stuMsg').textContent = '"' + v + '" 은(는) 이미 있습니다.'; return; }
  const old = cur;
  store.students[store.students.indexOf(cur)] = v;
  store.marks[v] = store.marks[cur] || {}; delete store.marks[cur];
  cur = v; $('newName').value = ''; save(); drawAll();
  $('stuMsg').textContent = '"' + old + '" → "' + v + '" 으로 바꿨습니다.';
};
$('clearStu').onclick = () => {
  if(!cur){ $('stuMsg').textContent = '학생을 먼저 고르세요.'; return; }
  const b = $('clearStu');
  if(b.dataset.armed !== '1'){
    b.dataset.armed = '1'; b.textContent = '정말 지울까요? 한 번 더';
    clearTimeout(b._t);
    b._t = setTimeout(() => { b.dataset.armed=''; b.textContent='이 학생 오답 전체 지우기'; }, 4000);
    return;
  }
  b.dataset.armed = ''; b.textContent = '이 학생 오답 전체 지우기'; clearTimeout(b._t);
  store.marks[cur] = {}; save(); drawAll();
};

// 폴더 이름 바꾸기. 상위 폴더를 바꾸면 그 아래 하위 폴더 경로도 함께 따라간다.
function renameFolder(from, to){
  const name = (to || '').trim();                 // 완성된 경로가 들어온다
  if(!name || name === from) return false;
  const remap = g => g === from ? name
                   : (topOf(g) === from && subOf(g)) ? name + '/' + subOf(g)
                   : g;
  BASE.concat(store.custom || []).forEach(f => {
    const g = groupOf(f), n = remap(g);
    if(n !== g) store.folder[f.code] = n;
  });
  store.folders = [...new Set((store.folders || []).map(remap))];
  store.closed  = [...new Set((store.closed  || []).map(remap))];
  save(); rebuild(); drawAll(); drawSrcList();
  return true;
}

// 폴더 제목 줄 — 이름칸 + 개수 + (비었으면) 지우기
function folderHead(box, path, count, deep){
  const shown = deep ? subOf(path) : topOf(path);
  const h = document.createElement('div');
  h.className = 'srcgrp' + (deep ? ' deep' : '');

  const inp = document.createElement('input');
  inp.className = 'fname';
  inp.value = shown;
  inp.title = '폴더 이름을 고쳐 쓰고 Enter';
  // 한글은 size(글자수)로 잡으면 잘린다. em 으로 넉넉히 준다.
  const fit = el => { el.style.width = Math.max(6, el.value.length * 1.05 + 2) + 'em'; };
  fit(inp);
  inp.oninput = () => fit(inp);
  inp.onkeydown = e => {
    if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
    if(e.key === 'Escape'){ inp.value = shown; inp.blur(); }
  };
  inp.onblur = () => {
    const v = inp.value.trim().replace(/\//g, ' ');   // 이름에 / 는 못 쓴다
    if(!v){ inp.value = shown; return; }
    if(v === shown) return;
    const target = deep ? topOf(path) + '/' + v : v;   // 하위면 상위를 유지한다
    const merging = allFolders().includes(target);
    if(renameFolder(path, target)){
      $('srcMsg').textContent = merging
        ? '"' + shown + '" 를 "' + v + '" 에 합쳤습니다.'
        : '폴더 이름을 "' + v + '" 로 바꿨습니다.';
    }
  };
  h.appendChild(inp);

  const n = document.createElement('span');
  n.className = 'fcnt';
  n.textContent = '자료 ' + count + '개';
  h.appendChild(n);

  if(!count){
    const del = document.createElement('button');
    del.className = 'fdel';
    del.textContent = '폴더 지우기';
    del.onclick = () => {
      store.folders = (store.folders || []).filter(x => x !== path);
      save(); drawAll(); drawSrcList();
      $('srcMsg').textContent = '"' + showPath(path) + '" 폴더를 지웠습니다.';
    };
    h.appendChild(del);
  }
  box.appendChild(h);
}

function drawParentPicker(){
  const sel = $('parentFolder'), keep = sel.value;
  sel.innerHTML = '<option value="">맨 위에 만들기</option>';
  [...new Set(allFolders().map(topOf))].forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t + ' 안에';
    sel.appendChild(o);
  });
  if([...sel.options].some(o => o.value === keep)) sel.value = keep;
}

function drawSrcList(){
  drawParentPicker();
  const box = $('srclist'); box.innerHTML = '';
  const all = BASE.concat(store.custom || []);

  const paths = [], byPath = {};
  all.forEach(f => {
    const g = groupOf(f);
    if(!byPath[g]){ byPath[g] = []; paths.push(g); }
    byPath[g].push(f);
  });
  (store.folders || []).forEach(g => { if(!byPath[g]){ byPath[g] = []; paths.push(g); } });

  const tops = [], byTop = {};
  paths.forEach(pth => {
    const t = topOf(pth);
    if(!byTop[t]){ byTop[t] = []; tops.push(t); }
    byTop[t].push(pth);
  });
  tops.forEach(t => byTop[t].sort((x,y) => (subOf(x) ? 1 : 0) - (subOf(y) ? 1 : 0)));

  tops.forEach(t => {
    const under = byTop[t];
    const direct = under.find(pth => !subOf(pth));
    const total = under.reduce((a,pth) => a + byPath[pth].length, 0);
    folderHead(box, t, total, false);
    if(direct && byPath[direct].length) drawSrcRows(box, byPath[direct]);
    under.filter(pth => subOf(pth)).forEach(pth => {
      folderHead(box, pth, byPath[pth].length, true);
      drawSrcRows(box, byPath[pth]);
    });
  });
}

function drawSrcRows(box, list){
  list.forEach(f => {
    const hidden = (store.hidden||[]).includes(f.code);
    const mine = (store.custom||[]).some(c => c.code === f.code);
    const d = document.createElement('span');
    d.className = 'tagx';
    if(hidden) d.style.opacity = '.5';
    d.innerHTML = '<b>' + f.title + '</b> · ' + f.questions.length + '문항' +
                  (mine ? ' · 추가함' : '') + (hidden ? ' · 숨김' : '');
    // 폴더 이동은 드롭다운으로. prompt() 는 막히는 환경이 있어 쓰지 않는다.
    const now = groupOf(f);
    const mv = document.createElement('select');
    mv.className = 'fsel';
    mv.title = '이 자료를 다른 폴더로 옮깁니다';
    allFolders().sort().forEach(g => {
      const o = document.createElement('option');
      o.value = g; o.textContent = showPath(g);
      if(g === now) o.selected = true;
      mv.appendChild(o);
    });
    mv.onchange = () => {
      const name = mv.value;
      if(name === now) return;
      if(!store.folders.includes(now)) store.folders.push(now);   // 비게 되는 폴더도 남긴다
      store.folder[f.code] = name;
      store.closed = (store.closed||[]).filter(x => x !== name);
      save(); rebuild(); drawAll(); drawSrcList();
    };
    d.appendChild(mv);

    const b = document.createElement('button');
    b.textContent = hidden ? '되돌리기' : '삭제';
    if(hidden) b.style.color = 'var(--pick)';
    // confirm() 이 막히는 환경이 있어서, 한 번 더 누르게 하는 방식으로 확인받는다
    b.onclick = () => {
      if(!hidden && b.dataset.armed !== '1'){
        b.dataset.armed = '1';
        b.textContent = mine ? '정말 지울까요?' : '정말 뺄까요?';
        b.style.fontWeight = '700';
        clearTimeout(b._t);
        b._t = setTimeout(() => {
          b.dataset.armed = ''; b.textContent = '삭제'; b.style.fontWeight = '';
        }, 4000);
        return;
      }
      if(hidden){
        store.hidden = store.hidden.filter(c => c !== f.code);
      } else if(mine){
        store.custom = store.custom.filter(x => x.code !== f.code);
        Object.values(store.marks).forEach(m => delete m[f.code]);
      } else {
        store.hidden.push(f.code);
      }
      save(); rebuild(); drawAll(); drawSrcList();
    };
    d.appendChild(b); box.appendChild(d);
  });
}

/* ========= folders ========= */
$('addFolder').onclick = () => {
  const el = $('newFolder');
  const name = el.value.trim().replace(/\//g, ' ');       // 이름에 / 는 못 쓴다 (경로 구분자)
  if(!name){ el.focus(); return; }
  const parent = $('parentFolder').value;
  if(parent && subOf(parent)){ $('srcMsg').textContent = '폴더는 두 단계까지만 됩니다.'; return; }
  const path = parent ? parent + '/' + name : name;
  if(allFolders().includes(path)){ $('srcMsg').textContent = '"' + showPath(path) + '" 폴더는 이미 있습니다.'; return; }
  store.folders.push(path);
  store.closed = (store.closed||[]).filter(x => x !== path && x !== topOf(path));
  save(); drawAll(); drawSrcList();
  el.value = '';
  $('srcMsg').textContent = '"' + showPath(path) + '" 폴더를 만들었습니다.';
};
$('newFolder').onkeydown = e => { if(e.key === 'Enter') $('addFolder').click(); };

/* ========= backup ========= */
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(store,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '봄날_오답기록_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();

$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{ store = JSON.parse(r.result); if(!store.custom) store.custom=[];
         cur = store.students[0]; save(); rebuild(); drawAll(); drawSrcList(); $('printMsg').textContent = '백업을 불러왔습니다.'; }
    catch(err){ $('printMsg').textContent = '파일을 읽지 못했습니다.'; }
  };
  r.readAsText(f);
};

/* ========= sheet ========= */
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ROMAN = ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ'];

function buildSheet(){
  if(!cur){ $('printMsg').textContent = '학생을 먼저 고르세요.'; return false; }
  const withKey = $('optKey').checked, group = $('optGroup').checked, wr = $('optWrite').checked;
  const picked = BANK.map(f => ({f, list: f.questions.filter(q => marksOf(cur,f.code).includes(q.no))}))
                     .filter(x => x.list.length);
  if(!picked.length){ $('printMsg').textContent = '틀린 번호를 하나도 안 눌렀습니다.'; return false; }

  const total = picked.reduce((a,x)=>a+x.list.length,0);
  let h = '<div class="head"><h2>오답노트 — ' + esc(cur) + '</h2><div class="m">봄날영어수학학원 · 총 ' + total + '문항 · ' +
          new Date().toLocaleDateString('ko-KR') + '</div></div>';

  picked.forEach((x,pi) => {
    h += '<div class="part">' + ROMAN[pi] + '. ' + esc(x.f.title) +
         ' (' + x.list.length + '문항)<small>원 문항번호 ' + x.list.map(q=>q.no).join(', ') + '</small></div>';

    const keyOf = p => (p||'').replace(/\s+/g,' ').trim();
    let groups = [];
    if(group){
      const seen = {};
      x.list.forEach(q => {
        const k = keyOf(q.passage);
        if(seen[k] === undefined){ seen[k] = groups.length; groups.push({passage:q.passage, list:[q]}); }
        else groups[seen[k]].list.push(q);
      });
    } else {
      groups = x.list.map(q => ({passage:q.passage, list:[q]}));
    }

    groups.forEach(g => {
      if(g.passage){
        h += '<div class="pas">' + g.passage.split(/\n\n+/).map(p=>'<p>'+esc(p)+'</p>').join('') + '</div>';
      }
      g.list.forEach(q => {
        if(q.extra && keyOf(q.extra) !== keyOf(q.passage)){
          h += '<div class="pas">' + q.extra.split(/\n\n+/).map(p=>'<p>'+esc(p)+'</p>').join('') + '</div>';
        }
        h += '<div class="q"><p class="st"><span class="no">' + q.no + '.</span>' + esc(q.stem) + '</p>';
        if(q.options.length) h += '<ul>' + q.options.map(o=>'<li>'+esc(o)+'</li>').join('') + '</ul>';
        else if(wr || !q.options.length) h += '<div class="wr"></div><div class="wr"></div>';
        h += '</div>';
      });
    });
  });

  if(withKey){
    h += '<div class="keys"><h3>정답 및 해설</h3>';
    picked.forEach((x,pi) => {
      h += '<div class="kg"><h4>' + ROMAN[pi] + '. ' + esc(x.f.title) + '</h4><dl>';
      x.list.forEach(q => {
        const long = q.answer.length > 2;             // 서술형 답은 해설 자리에 넣는다
        h += '<dt>' + q.no + '. ' + esc(long ? '' : q.answer) + '</dt>';
        let body = q.explain || (long ? q.answer : '');
        if(!q.answer && !body) body = '(정답 미입력)';   // 빈칸으로 두지 않는다
        h += '<dd>' + (body ? esc(body) : '') + '</dd>';
      });
      h += '</dl></div>';
    });
    h += '</div>';
  }
  $('sheet').innerHTML = h;
  return true;
}

$('make').onclick = () => {
  if(!buildSheet()) return;
  $('sheet').classList.add('show');
  $('print').disabled = false; $('back').disabled = false; $('dl').disabled = false;
  $('sheet').scrollIntoView({behavior:'smooth'});
};

function noteHtml(){
  return '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">' +
    '<title>오답노트 — ' + esc(cur) + '</title><style>' + SHEETCSS + '</style></head><body>' +
    $('sheet').innerHTML +
    '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print()},400)}<\/scr'+'ipt>' +
    '</body></html>';
}

$('dl').onclick = () => {
  const blob = new Blob([noteHtml()], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '오답노트_' + cur + '_' + new Date().toISOString().slice(0,10) + '.html';
  document.body.appendChild(a); a.click(); a.remove();
};

$('print').onclick = () => {
  // 다른 앱 안에 끼어 있으면 인쇄 창이 막힌다. 묻지 말고 파일로 내려받는다.
  const framed = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
  if(framed){ $('printMsg').textContent = '인쇄 창이 막혀 있어 파일로 내려받았습니다. 그 파일을 열면 인쇄 창이 바로 뜹니다.'; $('dl').click(); return; }
  try{ window.print(); }
  catch(e){ $('printMsg').textContent = '인쇄 창을 열지 못했습니다. "오답노트 파일로 내려받기"를 눌러 주세요.'; }
};

$('quick').onclick = () => {
  if(!buildSheet()) return;
  $('dl').disabled = false; $('print').disabled = false; $('back').disabled = false;
  $('dl').click();
};

$('back').onclick = () => {
  $('sheet').classList.remove('show');
  $('print').disabled = true; $('back').disabled = true; $('dl').disabled = true;
  window.scrollTo({top:0,behavior:'smooth'});
};

/* ========= go ========= */
load();
rebuild();
cur = store.students[0];
drawAll();
drawSrcList();

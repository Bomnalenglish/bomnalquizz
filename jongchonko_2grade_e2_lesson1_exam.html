ders from all over the area ④ reject the treaty. Never again will they use violence to solve their disputes. This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants. The story of hip-hop, now one of the world’s ⑤ leading music genres, is a fascinating one. Let’s explore it.", "opts": [], "answer": 4, "expl": "Ghetto Brothers라는 갱단이 더 나은 공동체를 만들기 위해 평화 조약을 제안했고, '이러한 새로운 목소리 덕분에'라는 표현 이 뒤따르고 있으므로, 지역 갱단 지도자들이 조약에 찬성하고 동의했 다는 문맥이 자연스러우므로, ④ 'reject(거절하다)'를 'sign(서명하 다)' 등으로 고쳐야 한다. [변형] ① rapidly : fast ② gone : left ③ stay : remain ⑤ leading : dominant", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절 한 것은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of (A) [abandoned / occupied] buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner. One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to (B) [divide / unite] and create a better community. They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes. This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace (C) [created / destroyed] by African Americans and immigrants. The story of hip- hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it.", "opts": ["abandoned - divide - destroyed    ", "occupied - unite - created", "occupied - unite - destroyed", "occupied - divide - created", "abandoned - unite - created"], "answer": 5, "expl": "A) 경제 침체 이후 사업체들이 문을 닫고 건물주들이 떠 났으며, 그 지역이 슬럼화되고 있다는 흐름이 자연스러우므로 abandoned(버려진, 방치된)가 적절하다. occupied는 ‘사용 중인, 점유된’이라는 뜻이다. (B) Ghetto Brothers가 싸움을 멈추고 젊은 이들이 힘을 합쳐 더 나은 공동체를 만들도록 설득한다는 흐름이 자연 스러우므로 unite(단결하다)가 적절하다. divide는 ‘나누다, 분열시 키다’라는 뜻이다. (C) 힙합이 아프리카계 미국인들과 이민자들이 만 들어 낸 새로운 평화 문화의 중요한 일부로 탄생했다는 흐름이 자연스 러우므로 created(만들어진)가 적절하다. destroyed는 ‘파괴된’이 라는 뜻이다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of ① deserted buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and trust between young people becomes an ② everyday thing. ③ Hopelessness is on every street corner. One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to ④ cease fighting and instead persuade young people to unite and create a better community. They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use ⑤ violence to solve their disputes.", "opts": [], "answer": 2, "expl": "갱 폭력이 일상화된 상황에서 젊은이들 사이의 신뢰가 일 상적인 것이 되었다는 내용은 문맥과 반대이고, 매우 찾기 힘들고 드 문 것이어야 하므로, ② (an) everyday를 (a) rare(드문, 희귀한) 등으로 고쳐야 한다. [변형] ① deserted : abandoned, ② 주어를 'gang violence'에서 'trust'로 변경함 ③ Hopelessness : Despair, ④ cease : stop", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "tag": "1-2", "passage": "After the peace treaty, the gangs that had fought one another ① began partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is ② known as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to ③ shorten the drum section known as the break. No longer did people have to ④ quit dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the ⑤ growth of hip-hop music and breakdancing. 박", "opts": [], "answer": 3, "expl": "DJ Kool Herc는 두 대의 턴테이블을 동시에 사용하여 드럼 섹션을 연장하는 새로운 기술을 선보였으며, 이를 통해 사람들이 멈추지 않고 계속 춤을 출 수 있게 되었으므로, 이러한 맥락에서 드럼 섹션을 '연장한다'는 문맥이 자연스러우므로, ③ shorten(단축하 다)'을 extend(연장하다)' 등으로 고쳐야 한다. [변형] ① began : started ② known : regarded ④ quit : stop ⑤ growth : rise", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절 한 것은?", "tag": "1-2", "passage": "DJing, Breakdancing, and MCing After the peace treaty, the gangs that had (A) [fought / helped] one another started partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually (B) [disappeared / emerged] from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to (C) [extend / shorten] the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["fought - emerged - shorten", "fought - emerged - extend", "helped - emerged - shorten", "helped - disappeared - extend", "fought - disappeared - extend"], "answer": 2, "expl": "A) 평화 조약 이후 갱들이 함께 파티를 하기 시작했다는 흐름이므로, 그 전에는 서로 싸웠다는 의미의 fought(싸웠다)가 적절 하다. helped는 ‘도왔다’라는 뜻이다. (B) 블록 파티에서 DJing, breakdancing, MCing, graffiti를 바탕으로 한 활기찬 청년 문화인 힙합 문화가 등장했다는 흐름이므로 emerged(등장했다, 생겨났다) 가 적절하다. disappeared는 ‘사라졌다’라는 뜻이다. (C) DJ Kool Herc가 두 개의 턴테이블을 사용해 같은 레코드를 번갈아 틀면서 break라고 알려진 드럼 구간을 늘렸다는 흐름이므로 extend(늘리 다, 연장하다)가 적절하다. shorten은 ‘짧게 하다’라는 뜻이다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "tag": "1-2", "passage": "DJing, Breakdancing, and MCing After the peace treaty, the gangs that had fought one another started partying together. ① Deserted buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A ② lively youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables ③ simultaneously, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. People could just ④ stop dancing at the end of the record while the DJ changed the LP. Kool Herc’s style of DJing quickly became ⑤ influential in the rise of hip-hop music and breakdancing.", "opts": [], "answer": 4, "expl": "DJ가 LP 음반을 바꾸는 동안 끊김 없이 드럼 비트 구간 이 연장되어 사람들이 멈추지 않고 계속해서 춤을 출 수 있었다는 맥 락이므로, ④ stop(멈추다)을 keep(지속하다) 등으로 고쳐야 한다. [변형] ① Deserted : Abandoned, ② lively : vibrant, ③ simultaneously : at the same time, ④ People could just keep dancing : No longer did people have to stop dancing, ⑤ impactful : influential", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "tag": "1-3", "passage": "The break section became the most ① popular part of a song. People would form dancer circles and use the break to ② display their individual dancing skills. Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break-Girls. These people began to dance in groups in the streets and ③ create a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to ④ thrill the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of ⑤ ignoring the audience, that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing.", "opts": [], "answer": 5, "expl": "DJs가 디제잉과 리듬에 맞춘 함성을 동시에 할 수 없게 되었을 때, 친구에게 자신을 대신하여 관객을 상대하며 말을 거는 역 할을 부탁했고 이것이 나중에 MC가 되었다는 문맥이 자연스러우므 로, 관객을 '무시한다'는 맥락은 논리적으로 어색하다. 따라서, ⑤ 'ignoring(무시하는)'을 'addressing(말을 거는)' 등으로 고쳐야 한 다. [변형] ① popular : anticipated ② display : show off ③ create : build ④ thrill : excite", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절 한 것은?", "tag": "1-3", "passage": "The break section became the most (A) [anticipated / ignored] part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break-Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to (B) [excite / calm] the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This (C) [shared / separate] role became MCing.", "opts": ["anticipated - excite - separate", "anticipated - excite - shared", "anticipated - calm - shared", "ignored - calm - separate", "ignored - excite - shared"], "answer": 1, "expl": "A) 사람들이 dancer circles를 만들고 break 구간을 이용해 각자의 춤 실력을 보여 주었다는 흐름이 자연스러우므로 anticipated(기대되는)가 적절하다. ignored는 ‘무시된’이라는 뜻이 다. (B) DJs가 리듬과 라임에 맞춰 말하고 “To the beat,” “You don’t stop!”과 같은 구절을 외쳤다는 흐름이 자연스러우므로 excite(흥분시키다, 신나게 하다)가 적절하다. calm은 ‘진정시키다’ 라는 뜻이다. (C) DJs가 DJing과 rhythmic shouting을 동시에 하 기 어려워 친구에게 관객에게 말하는 역할을 맡겼고, 그 역할이 MCing이 되었다는 흐름이 자연스러우므로 separate(분리된, 별도 의)가 적절하다. shared는 ‘공유된, 공동의’라는 뜻이다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "tag": "1-3", "passage": "The break section became the most ① anticipated part of a song. People would form dancer circles and use the break to ② showcase their individual dancing skills. 박 Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to ③ energize the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting ④ separately, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This ⑤ distinct role became MCing.", "opts": [], "answer": 4, "expl": "DJ가 디제잉과 리드미컬한 구호를 외치는 역할을 혼자서 동시에 해낼 수 없어서 친구에게 MC 역할을 부탁했다는 맥락이므로, ④ separately(각각, 따로)를 simultaneously(동시에)로 고쳐야 한다. [원문] at the same time [변형] ② showcase : show off, ③ energize : excite, ⑤ distinct : separate", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않 은 것은?", "tag": "1-4", "passage": "Then where did the word hip-hop originate from? Nobody knows the ① real origin, but it is said that the word hip-hop was first used at a block party. A young man at the party was about to ② enter the army. His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.” The crowd loved it. After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an ③ instant success. The new music and dancing spread very ④ fast. There was a sharp unexplained ⑤ rise in violence during the 1980s in New York. One police officer asked a boy on the street if he knew why. The boy said, “It’s because they’re dancing.”", "opts": [], "answer": 5, "expl": "새로운 음악과 춤이 매우 빠르게 퍼져나갔고, 한 경찰 관이 폭력 변화의 이유를 묻자 거리의 소년이 \"사람들이 춤을 추고 있 기 때문\"이라고 답한 것은 춤이 폭력을 대체하여 줄어들게 했음을 시 사하므로, 1980년대 뉴욕에서 폭력이 '감소했다'는 맥락이 자연스럽 다. 따라서 ⑤ rise(상승)을 decline(감소) 등으로 고쳐야 한다. [변 형] ① real : exact ② enter : join ③ instant : immediate", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적 절한 것은?", "tag": "1-4", "passage": "The Origin of the Word Hip-Hop Then where did the word hip-hop originate from? Nobody knows the exact origin, but it is said that the word hip-hop was first (A) [discarded / employed] at a block party. A young man at the party was about to join the army. His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip- hop.” The crowd loved it. After that, MCs (B) [tested / abandoned] new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate (C) [hit / failure]. The new music and dancing spread very fast. There was a sharp unexplained decline in violence during the 1980s in New York. One police officer asked a boy on the street if he knew why. The boy said, “It’s because they’re dancing.”", "opts": ["employed - tested - failure", "discarded - tested - failure", "discarded - abandoned - hit", "employed - abandoned - hit", "employed - tested - hit"], "answer": 5, "expl": "A) 힙합이라는 단어의 정확한 기원은 아무도 모르지 만, 블록 파티에서 처음 사용되었다고 전해지는 흐름이 자연스러우므 로 employed(사용된)가 적절하다. discard는 ‘버리다’라는 뜻이다. [변형] employed urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left.", "parts": [{"label": "(A)", "text": "One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community. They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.”"}, {"label": "(B)", "text": "The area is full of abandoned buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner."}, {"label": "(C)", "text": "Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes. This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants. The story of hip-hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-1", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 4, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "Imagine an urban area that is fast becoming a slum after an economic recession.", "parts": [{"label": "(A)", "text": "One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community. They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes."}, {"label": "(B)", "text": "This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants. The story of hip-hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it."}, {"label": "(C)", "text": "Businesses close their doors and building owners have left. The area is full of abandoned buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-2", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 1, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "After the peace treaty, the gangs that had fought one another started partying together.", "parts": [{"label": "(A)", "text": "Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style."}, {"label": "(B)", "text": "No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing."}, {"label": "(C)", "text": "The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip- hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-3", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 3, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "The break section became the most anticipated part of a song.", "parts": [{"label": "(A)", "text": "This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing. 박"}, {"label": "(B)", "text": "People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break-Girls."}, {"label": "(C)", "text": "These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!”"}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-3", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 4, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills.", "parts": [{"label": "(A)", "text": "DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing."}, {"label": "(B)", "text": "When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing."}, {"label": "(C)", "text": "Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-4", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 4, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "Then where did the word hip-hop originate from?", "parts": [{"label": "(A)", "text": "The crowd loved it. After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop- bop,” “I said a hip-hop, a hibbit, hibby-dibby, hip-hip- hop and you don’t stop.” Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate success."}, {"label": "(B)", "text": "The new music and dancing spread very fast. There was a sharp unexplained decline in violence during the 1980s in New York. One police officer asked a boy on the street if he knew why. The boy said, “It’s because they’re dancing.”"}, {"label": "(C)", "text": "Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party. A young man at the party was about to join the army. His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.”"}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-4", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 4, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "Then where did the word hip-hop originate from? Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party.", "parts": [{"label": "(A)", "text": "After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip- hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate success."}, {"label": "(B)", "text": "The new music and dancing spread very fast. There was a sharp unexplained decline in violence during the 1980s in New York. One police officer asked a boy on the street if he knew why. The boy said, “It’s because they’re dancing.”"}, {"label": "(C)", "text": "A young man at the party was about to join the army. His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.” The crowd loved it."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-5", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 3, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper.", "parts": [{"label": "(A)", "text": "The Message 박 became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat."}, {"label": "(B)", "text": "However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking."}, {"label": "(C)", "text": "This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip-hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-5", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 5, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s.", "parts": [{"label": "(A)", "text": "The song was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat."}, {"label": "(B)", "text": "With this song, hip-hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time."}, {"label": "(C)", "text": "Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-6", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 4, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.” Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers. For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture.", "parts": [{"label": "(A)", "text": "Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers."}, {"label": "(B)", "text": "This is why the message of respect is about both self-worth and respect for others. The importance of the idea of respect in hip-hop cannot be emphasized strongly enough."}, {"label": "(C)", "text": "Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes. The phrase “something from nothing,” often used to summarize the genre’s history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-7", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C) 박", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 4, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "“The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace.", "parts": [{"label": "(A)", "text": "It meant that hip-hop, which started as underground music, had become a major art form like classical music."}, {"label": "(B)", "text": "If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others. With its unique and growing appeal, hip-hop continues to be a global phenomenon."}, {"label": "(C)", "text": "This document reminds us of hip-hop’s original mission to bring peace to the Bronx, implying global respect for hip-hop history. When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event."}]}]}, {"key": "insert", "no": 7, "title": "삽입 · 흐름", "emoji": "📌", "desc": "문장이 들어갈 곳 · 흐름과 무관한 문장", "questions": [{"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of abandoned buildings. ① There is no heating even in winter. ② Only those who can’t afford to move out remain. ③ Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. ④ Despair is on every street corner. ⑤ They suggest a peace treaty.", "opts": [], "answer": 5, "expl": "", "inline": true, "short": false, "summary": "", "given": "One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community.", "lead": "", "parts": []}, {"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of abandoned buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. ① Despair is on every street corner. ② One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community. ③ They suggest a peace treaty. ④ “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” ⑤ Never again will they use violence to solve their disputes.", "opts": [], "answer": 5, "expl": "", "inline": true, "short": false, "summary": "", "given": "Thanks to these new voices, gang leaders from all over the area sign the treaty.", "lead": "", "parts": []}, {"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-2", "passage": "After the peace treaty, the gangs that had fought one another started partying together. ① Abandoned buildings and parking lots were used for events called block parties. ② A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. ③ It replaced gang violence with music, dance, art, and style. ④ The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. ⑤ Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique.", "opts": [], "answer": 2, "expl": "", "inline": true, "short": false, "summary": "", "given": "What eventually emerged from these parties?", "lead": "", "parts": []}, {"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. ① People would form dancer circles and use the break to show off their individual dancing skills. ② Kool Herc named the people dancing to his music B-Boys and B-Girls, short for Break-Boys and Break-Girls. ③ DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. ④ They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. ⑤ When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties.", "opts": [], "answer": 3, "expl": "", "inline": true, "short": false, "summary": "", "given": "These people began to dance in groups in the streets and build a street dance battle culture.", "lead": "", "parts": []}, {"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. ① These people began to dance in groups in the streets and build a street dance battle culture. ② DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. ③ They would shout phrases like “To the beat” and “You don’t stop!” ④ When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. ⑤ This separate role became MCing. 박", "opts": [], "answer": 4, "expl": "", "inline": true, "short": false, "summary": "", "given": "This was the beginning of rapping or MCing.", "lead": "", "parts": []}, {"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-4", "passage": "The crowd loved it. Then where did the word hip-hop originate from? ① Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party. ② A young man at the party was about to join the army. ③ His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.” ④ After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” ⑤ Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate success.", "opts": [], "answer": 4, "expl": "", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-4", "passage": "Then where did the word hip-hop originate from? Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party. A young man at the party was about to join the army. His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.” The crowd loved it. ① After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” ② The new music and dancing spread very fast. ③ There was a sharp unexplained decline in violence during the 1980s in New York. ④ One police officer asked a boy on the street if he knew why. ⑤ The boy said, “It’s because they’re dancing.”", "opts": [], "answer": 2, "expl": "", "inline": true, "short": false, "summary": "", "given": "Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate success.", "lead": "", "parts": []}, {"q": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳 은?", "tag": "1-4", "passage": "“I said a hip-hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” T let school='', name='', round=null, qs=[], idx=0, cor=0, wrongs=[], answered=false, t0=0, retry=false;

function el(id){return document.getElementById(id);}
function show(id){['scStart','scCount','scQuiz','scResult','scNote'].forEach(x=>el(x).classList.toggle('hidden',x!==id));
  ['top','bar'].forEach(x=>el(x).classList.toggle('hidden',id!=='scQuiz'));}

function renderRounds(){
  const box=el('rounds'); box.innerHTML='';
  EXAM.rounds.forEach(r=>{
    const n=r.questions.length;
    const b=document.createElement('button');
    b.className='rbtn'; b.disabled=n===0;
    b.innerHTML='<span class="rno">'+r.no+'</span><span><span class="rttl">'+r.emoji+' '+r.title+'</span>'
      +'<span class="rsub">'+r.desc+'</span></span>'
      +'<span class="rcnt'+(n?'':' soon')+'">'+(n?n+'문항':'준비 중')+'</span>';
    if(n) b.onclick=()=>pickRound(r);
    box.appendChild(b);
  });
}
function pickRound(r){
  school=el('school').value; name=el('name').value.trim();
  if(!school){alert('학교를 선택해주세요!');return;}
  if(!name){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bn_name',name);localStorage.setItem('bn_school',school);}catch(e){}
  round=r;
  el('cntTitle').textContent=r.emoji+' '+r.no+'라운드 '+r.title+' · 몇 문항 풀까요?';
  const box=el('cntBtns'); box.innerHTML='';
  const opts=[10,20,round.questions.length].filter((v,i,a)=>v<=round.questions.length&&a.indexOf(v)===i);
  opts.forEach(n=>{
    const b=document.createElement('button');
    b.className='rbtn';
    b.innerHTML='<span class="rno">'+(n===round.questions.length?'전체':n)+'</span><span><span class="rttl">'
      +n+'문항 풀기</span><span class="rsub">'+(n===round.questions.length?'이 라운드 전부':'무작위로 '+n+'문항')+'</span></span>';
    b.onclick=()=>start(n);
    box.appendChild(b);
  });
  show('scCount');
}
function backToRounds(){show('scStart');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(n){
  qs=shuffle(round.questions).slice(0,n);
  idx=0;cor=0;wrongs=[];retry=false;t0=Date.now();
  el('topT').textContent=round.emoji+' '+round.title;
  show('scQuiz'); draw();
}
function draw(){
  if(idx>=qs.length){result();return;}
  answered=false;
  const q=qs[idx];
  el('topC').textContent=(idx+1)+'/'+qs.length;
  el('fill').style.width=(idx/qs.length*100)+'%';
  const CIR='①②③④⑤';
  if(q.short){ drawShort(q); return; }
  const inline = !q.opts || q.opts.length===0;
  let psg = psgHtml(q.passage);
  if(inline) psg = psg.replace(/[①②③④⑤]/g, m=>'<b class="mk">'+m+'</b>');   // 밑줄형 표시 강조
  const blocks =
     (q.given?'<div class="givbox"><div class="sumlbl blue">📌 주어진 문장</div>'+esc(q.given)+'</div>':'')
    +(q.lead?'<div class="psg"><span class="plbl">주어진 글</span>'+esc(q.lead)+'</div>':'')
    +((q.parts&&q.parts.length)?'<div class="parts">'+q.parts.map(function(pt){
        return '<div class="part"><span class="plabel">'+esc(pt.label)+'</span>'+esc(pt.text)+'</div>';}).join('')+'</div>':'');
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+esc(q.tag)+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +blocks
    +(q.passage?'<div class="psg">'+psg+'</div>':'')
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +(inline?'<div class="hint">지문에서 번호가 붙은 부분을 보고 답을 고르세요</div>':'')
    +'<div class="'+(inline?'opts inline':'opts')+'" id="opts"></div><div class="fb" id="fb"></div>';
  const box=el('opts');
  if(inline){
    for(let i=0;i<5;i++){
      const b=document.createElement('button');
      b.className='opt num';
      b.innerHTML='<span class="on">'+CIR[i]+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    }
  } else {
    q.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML='<span class="on">'+CIR[i]+'</span><span>'+esc(o)+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    });
  }
  window.scrollTo(0,0);
}

// ── 주관식(답 입력형) ──
function normalize(t){
  return String(t||'').toLowerCase()
    .replace(/[‘’“”]/g,"'")
    .replace(/[^a-z0-9가-힣]+/g,' ').trim();
}
function drawShort(q){
  const blocks =
     (q.given?'<div class="givbox"><div class="sumlbl blue">📌 주어진 문장</div>'+esc(q.given)+'</div>':'')
    +(q.lead?'<div class="psg"><span class="plbl">주어진 글</span>'+esc(q.lead)+'</div>':'')
    +((q.parts&&q.parts.length)?'<div class="parts">'+q.parts.map(function(pt){
        return '<div class="part"><span class="plabel">'+esc(pt.label)+'</span>'+esc(pt.text)+'</div>';}).join('')+'</div>':'');
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+q.tag+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +blocks
    +(q.passage?'<div class="psg">'+psgHtml(q.passage)+'</div>':'')
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +'<div class="hint">답을 직접 입력한 뒤 [답 확인]을 누르세요</div>'
    +'<textarea class="inp" id="sans" rows="3" placeholder="여기에 답을 쓰세요"></textarea>'
    +'<button class="btn" style="margin-top:10px" id="schk">답 확인하기</button>'
    +'<div class="fb" id="fb"></div>';
  el('schk').onclick=()=>checkShort(q);
  el('sans').focus();
  window.scrollTo(0,0);
}
function checkShort(q){
  if(answered) return;
  const mine=el('sans').value.trim();
  if(!mine){ alert('답을 입력해 주세요!'); return; }
  answered=true;
  el('sans').disabled=true; el('schk').disabled=true;
  const ok = normalize(mine)===normalize(q.answer);
  const fb=el('fb');
  fb.className = ok?'fb y':'fb n';
  fb.innerHTML = (ok?'✅ 정답입니다!':'❌ 정답과 다릅니다.')
    +'<div class="sans-cmp"><b>내 답</b> '+esc(mine)+'</div>'
    +'<div class="sans-cmp good"><b>정답</b> '+esc(q.answer)+'</div>'
    +(q.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(q.expl)+'</div>':'');
  if(ok){ cor++; }
  else { wrongs.push({q:q,my:mine}); }
  const box=document.createElement('div'); box.style.display='grid'; box.style.gap='8px'; box.style.marginTop='12px';
  if(!ok){
    const self=document.createElement('button');
    self.className='btn sec'; self.textContent='🙆 사실상 맞았어요 (정답 처리)';
    self.onclick=()=>{ cor++; wrongs=wrongs.filter(w=>w.q!==q); self.disabled=true;
                       self.textContent='✔ 정답으로 처리했어요'; };
    box.appendChild(self);
  }
  const nx=document.createElement('button');
  nx.className='btn'; nx.textContent=(idx+1>=qs.length?'다음 · 결과 보기 →':'다음 문제 →');
  nx.onclick=()=>{idx++;draw();};
  box.appendChild(nx);
  el('qcard').appendChild(box);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// 지문의 ⟪ ⟫ 표시를 밑줄로 (원본 PDF의 밑줄 친 부분)
function psgHtml(t){return esc(t).replace(/⟪/g,'<u class="ul">').replace(/⟫/g,'</u>');}
function pick(btn,sel,q){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=el('fb'), CIR='①②③④⑤';
  if(sel===q.answer){
    btn.classList.add('ok');fb.className='fb y';
    fb.innerHTML='✅ 정답! <b>'+CIR[q.answer-1]+'</b>번'
      +(q.expl?'<div class="expl" style="border-top-color:#86efac">💡 '+esc(q.expl)+'</div>':'');
    cor++;
  }
  else{
    btn.classList.add('no');
    document.querySelectorAll('.opt')[q.answer-1].classList.add('reveal');
    fb.className='fb n';
    fb.innerHTML='❌ 정답은 <b>'+CIR[q.answer-1]+'</b>번입니다.'
      +(q.expl?'<div class="expl">💡 '+esc(q.expl)+'</div>':'');
    wrongs.push({q:q,my:sel});
  }
  // 해설이 있으면 버튼으로 넘긴다 (자동으로 넘어가면 해설을 못 읽음)
  if(q.expl){
    const nx=document.createElement('button'); nx.className='btn'; nx.style.marginTop='12px';
    nx.textContent=(idx+1>=qs.length?'해설을 읽었어요 · 결과 보기 →':'해설을 읽었어요 · 다음 문제 →');
    nx.onclick=()=>{idx++;draw();};
    el('qcard').appendChild(nx);
    if(nx.scrollIntoView) nx.scrollIntoView({block:'nearest'});
  } else {
    setTimeout(()=>{idx++;draw();},sel===q.answer?800:2000);
  }
}
let lastWrong=[];
function result(){
  el('fill').style.width='100%';
  if(!retry) lastWrong = wrongs.map(w=>({
    q:w.q.q, passage:w.q.passage, tag:w.q.tag||'', opts:w.q.opts||[],
    my:w.my, answer:w.q.answer, expl:w.q.expl||'', note:'', short:!!w.q.short
  }));
  const total=qs.length, pct=total?Math.round(cor/total*100):0;
  const min=Math.max(1,Math.round((Date.now()-t0)/60000));
  const CIR='①②③④⑤';
  const wHtml=wrongs.length?'<div class="wrongbox"><div class="lbl">❌ 틀린 문제 '+wrongs.length+'개</div>'
    +wrongs.map(w=>'<div class="wi"><b>'+esc(w.q.q)+'</b><br>'
    +(w.q.short ? ('내 답 '+esc(String(w.my))+' → 정답 '+esc(String(w.q.answer)))
                : ('내 답 '+CIR[w.my-1]+' → 정답 '+CIR[w.q.answer-1]))+'</div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:12px">🎉 전부 정답!</div>';
  el('scResult').innerHTML='<div class="card" style="text-align:center">'
    +'<div style="font-size:12px;color:#6b7280">'+EXAM.lesson+' · '+round.no+'라운드 '+round.title+'</div>'
    +'<div class="score">'+pct+'점</div>'
    +'<div class="stat"><div><b style="color:#2e7d32">'+cor+'</b><span>정답</span></div>'
    +'<div><b style="color:#c62828">'+(total-cor)+'</b><span>오답</span></div>'
    +'<div><b style="color:#1565c0">'+total+'</b><span>문항</span></div>'
    +'<div><b style="color:#f57f17">'+min+'분</b><span>소요</span></div></div>'
    +wHtml
    +'<div style="display:grid;gap:8px;margin-top:14px">'
    +(lastWrong.length?'<button class="btn" onclick="openNote()">📝 오답노트 작성하기 ('+lastWrong.length+')</button>':'')
    +(wrongs.length?'<button class="btn sec" onclick="retryWrong()">❌ 틀린 문제 다시 풀기 ('+wrongs.length+')</button>':'')
    +'<button class="btn sec" onclick="backToRounds()">← 라운드 다시 선택</button></div></div>';
  show('scResult');
  if(window._saveResult) window._saveResult({
    studentName:name, school:school, score:pct, correct:cor, wrong:total-cor, total:total,
    elapsedMin:min, round:retry?2:1, completed:wrongs.length===0,
    quizType:'고2_영어2_'+EXAM.lesson+'_'+round.title+(retry?'_오답완료':''),
    lesson:EXAM.lesson, roundName:round.title,
    wrongWords:wrongs.map(w=>({eng:w.q.q.slice(0,40), kor:'정답 '+CIR[w.q.answer-1]})),
    // 내 학습 기록에서 '내 답 / 정답 / 해설'을 볼 수 있도록 상세를 함께 저장
    wrongDetails:wrongs.map(w=>({
      q:w.q.q, my:w.my, answer:w.q.answer,
      myText: w.q.short ? String(w.my) : (w.q.opts[w.my-1]||(CIR[w.my-1]+'번')),
      answerText: w.q.short ? String(w.q.answer) : (w.q.opts[w.q.answer-1]||(CIR[w.q.answer-1]+'번')),
      expl:w.q.expl||''
    }))
  });
}
function retryWrong(){
  qs=wrongs.map(w=>w.q); idx=0;cor=0;wrongs=[];retry=true;t0=Date.now();
  show('scQuiz'); draw();
}

function openNote(){
  const CIR='①②③④⑤';
  el('scNote').innerHTML='<div class="card">'
    +'<div class="lbl">📝 오답노트 · '+EXAM.lesson+' '+round.title+'</div>'
    +'<div style="font-size:12px;color:#6b7280;line-height:1.7;margin-bottom:12px">'
    +'틀린 문제를 다시 보고, 왜 틀렸는지 한 줄로 적어 보세요. 저장하면 <b>내 학습 기록</b>에서 다시 볼 수 있어요.</div>'
    +lastWrong.map((w,i)=>'<div class="notecard">'
        +'<div class="noteq">'+(i+1)+'. '+esc(w.q)+(w.tag?' <span class="qtag">지문 '+esc(w.tag)+'</span>':'')+'</div>'
        +'<div class="psg" style="font-size:12.5px;max-height:150px;overflow:auto">'+psgHtml(w.passage)+'</div>'
        +'<div class="noterow"><span class="bad">내 답 '+(w.short?'':CIR[w.my-1])+'</span> '
          +esc(w.short?w.my:((w.opts||[])[w.my-1]||''))+'</div>'
        +'<div class="noterow"><span class="good">정답 '+(w.short?'':CIR[w.answer-1])+'</span> '
          +esc(w.short?w.answer:((w.opts||[])[w.answer-1]||''))+'</div>'
        +(w.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(w.expl)+'</div>':'')
        +'<textarea class="inp noteta" data-i="'+i+'" rows="2" placeholder="왜 틀렸나요? (예: 지문에 없는 내용을 골랐다)"></textarea>'
      +'</div>').join('')
    +'<button class="btn" id="noteSave" onclick="saveNote()">💾 오답노트 저장하기</button>'
    +'<div id="noteMsg" style="text-align:center;font-size:12.5px;font-weight:800;margin-top:10px"></div>'
    +'<button class="btn sec" style="margin-top:10px" onclick="backToResult()">← 결과로 돌아가기</button></div>';
  show('scNote'); window.scrollTo(0,0);
}
async function saveNote(){
  document.querySelectorAll('.noteta').forEach(t=>{ lastWrong[+t.dataset.i].note = t.value.trim(); });
  const btn=el('noteSave'), msg=el('noteMsg');
  btn.disabled=true; btn.textContent='저장 중...';
  const ok = window._saveNote ? await window._saveNote({
    studentName:name, school:school, lesson:EXAM.lesson, roundName:round.title,
    quizType:'고2_영어2_'+EXAM.lesson+'_'+round.title+'_오답노트',
    wrongCount:lastWrong.length,
    items:lastWrong.map(w=>({q:w.q, my:w.my, answer:w.answer,
      myText: w.short ? String(w.my) : ((w.opts||[])[w.my-1]||(CIR[w.my-1]+'번')),
      answerText: w.short ? String(w.answer) : ((w.opts||[])[w.answer-1]||(CIR[w.answer-1]+'번')),
      expl:w.expl, note:w.note}))
  }) : false;
  btn.disabled=false; btn.textContent='💾 오답노트 저장하기';
  msg.style.color = ok ? '#2e7d32' : '#c62828';
  msg.textContent = ok ? '✅ 저장했어요! 내 학습 기록에서 볼 수 있어요.' : '⚠️ 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}

(function init(){
  try{
    const n=localStorage.getItem('bn_name'); if(n) el('name').value=n;
    const s=localStorage.getItem('bn_school')||'';
    for(const o of el('school').options){ if(o.value && s.indexOf(o.value.replace(/\d$/,''))===0){el('school').value=o.value;break;} }
  }catch(e){}
  renderRounds();
})();
</script>

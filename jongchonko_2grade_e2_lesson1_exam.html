: 5, "expl": "힙합은 1970년대 초 뉴욕 브롱크스에서 아프리카계 미 국인들과 이민자들이 만들어 낸 새로운 평화 문화의 중요한 일부로 탄 생했다고 하였으므로, ⑤ ‘힙합은 주로 부유한 사업주들에 의해 만들 어진 문화로 처음 등장했다’는 글의 내용과 일치하지 않는다. [오답] ① 경제 침체는 많은 지역 사업체들이 계속 운영할 수 없게 만들었다. ② 많은 주민들은 떠날 돈이 부족했기 때문에 그 지역에 남았다. ③ Ghetto Brothers는 음식과 의료 지원으로 사람들을 도왔기 때문에 부분적으로 존중받았다. ④ 갱 지도자들은 폭력이 더 이상 갈등을 해 결하는 데 사용되어서는 안 된다는 데 동의했다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of abandoned buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner. One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community. They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes. This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants. The story of hip-hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it.", "opts": ["An economic crisis caused severe urban decay and high unemployment rates in the city.", "Gang violence became a frequent occurrence among young residents in the decaying urban area.", "The Ghetto Brothers gained community respect solely by demonstrating superior physical force against rivals.", "Leaders of local gangs agreed to sign a peace treaty to prevent further violence.", "Hip-hop music originated in the Bronx as an integral component of a new peace culture."], "answer": 3, "expl": "게토 브라더스가 무료 급식 및 의료 지원 프로그램으로 지역 사회의 존경을 받았다고 했으므로, 경쟁 갱단을 상대로 우월한 물리력을 보여 주어 존경받았다는 ③ 'Ghetto Brothers는 오직 경쟁 자들에 대한 우월한 신체적 힘을 증명함으로써 공동체의 존경을 얻었 다'는 글의 내용과 일치하지 않는다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-2", "passage": "DJing, Breakdancing, and MCing After the peace treaty, the gangs that had fought one another started partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["Gangs continued to fight each other at block parties.", "Block parties were exclusively held in abandoned buildings.", "Hip-hop culture consisted of four main creative elements. 박", "DJ Kool Herc invented the turntable for his sister's birthday.", "People had to stop dancing frequently during Herc's DJ sets."], "answer": 3, "expl": "힙합 문화가 \"DJing, breakdancing, MCing, and graffiti\"에 기반을 둔 활기찬 청소년 운동이라고 명시하고 있으므로, ③ , "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-2", "passage": "DJing, Breakdancing, and MCing After the peace treaty, the gangs that had fought one another started partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["평화 조약 이후에도 갱들은 서로의 행사에 참여하지 않았다.", "블록 파티는 주로 고급 공연장에서 열린 공식 음악회였다.", "힙합 문화는 음악과 춤, 미술적 표현 등을 포함하는 청년 문화로 등장했다.", "DJ Kool Herc는 여동생의 생일 파티에서 기존 DJ 방식과 같은 방식만 사용했다.", "Kool Herc의 DJing 방식은 힙합 음악과 브레이크댄스의 발전에 별다른 영향을 주지 못했다."], "answer": 3, "expl": "블록 파티에서 DJing, breakdancing, MCing, graffiti를 바탕으로 한 활기찬 청년 운동인 힙합 문화가 등장했다고 하였으므로, ③ ‘힙합 문화는 음악과 춤, 미술적 표현 등을 포함하는 청년 문화로 등장했다’는 글의 내용과 일치한다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-2", "passage": "DJing, Breakdancing, and MCing After the peace treaty, the gangs that had fought one another started partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["Former rival gangs began gathering at the same parties after the treaty.", "Community events took place in neglected parts of the neighborhood.", "Hip-hop culture grew out of block parties and included several forms of artistic expression.", "A 1973 party hosted by DJ Kool Herc gained historical importance through his innovative DJing.", "Kool Herc’s technique forced dancers to stop whenever the record reached its break section."], "answer": 5, "expl": "DJ Kool Herc는 두 개의 턴테이블을 동시에 사용해 같 은 레코드의 드럼 구간인 break를 늘렸고, 그 결과 사람들이 DJ가 LP disc를 바꾸는 동안 춤을 멈출 필요가 없어졌다고 하였으므로, ⑤ ‘Kool Herc의 기법은 레코드가 break 구간에 이를 때마다 춤추는 사 람들이 멈추게 했다’는 글의 내용과 일치하지 않는다. [오답] ① 이전 에 서로 적대하던 갱들은 조약 이후 같은 파티에 모이기 시작했다. ② 공동체 행사는 동네의 방치된 공간에서 열렸다. ③ 힙합 문화는 블록 파티에서 생겨났고 여러 형태의 예술적 표현을 포함했다. ④ DJ Kool Herc가 주최한 1973년 파티는 그의 혁신적인 DJ 기법을 통해 역사 적 중요성을 얻게 되었다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-2", "passage": "DJing, Breakdancing, and MCing After the peace treaty, the gangs that had fought one another started partying together. 박 Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-h ful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["Early rap lyrics mainly focused on social problems and injustice.", "\"The Message\" was released by Grandmaster Flash and Furious Five.", "The boy in \"The Message\" was born into a wealthy and privileged family.", "Hip-hop songs in the 1990s stopped dealing with racial discrimination.", "People found it difficult to dance to hip-hop songs with social messages."], "answer": 2, "expl": "1982년 Grandmaster Flash와 Furious Five에 의 해 'The Message'가 발표되었고, 특히 이 곡이 힙합의 흐름을 바꾼 획기적인 사건이었다고 했으므로, 글의 내용과 일치하는 것은 ② ‘\"The Message\"는 Grandmaster Flash와 Furious Five에 의해 발표되었다’이다. [오답] ① 초기 랩 가사는 주로 사회 문제와 불의에 집중했다. (파티와 자랑에 집중) ③ \"The Message\"의 소년은 부유 하고 특권 있는 가정에서 태어났다. (게토에서 태어남) ④ 1990년대 힙합 노래들은 인종 차별을 다루는 것을 중단했다. (계속해서 맞섬) ⑤ 사람들은 사회적 메시지가 담긴 힙합 노래에 맞춰 춤추는 것이 어 렵다는 것을 알게 되었다. (춤추면서 메시지를 들음)", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-5", "passage": "Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed rn there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["In its infancy, hip-hop music primarily served as entertainment for partygoers and a platform for self- boasting. 박", "The landscape of the hip-hop genre underwent a profound and transformative evolution as it entered the 1980s.", "By depicting the ghetto as a place of endless wealth and luxury, The Message completely ignored severe social inequalities.", "The groundbreaking track allowed hip-hop to transition from party entertainment into a powerful tool for social commentary.", "The successful release was followed by subsequent songs that actively used their lyrics to challenge deeply rooted racial discrimination."], "answer": 3, "expl": "The Message는 빈민가 삶의 가혹한 현실과 그곳에서 태어나 2등 시민으로 살다 죽어야 했던 소년의 슬픈 이야기를 상세히 다루었다고 하였으므로, ③ ‘빈민가를 끝없는 부와 사치의 공간으로 묘사함으로써, The Message는 심각한 사회적 불평등을 완전히 무 시했다.’는 글의 내용과 일치하지 않는다. [오답] ① 초기 힙합은 주로 파티 참석자들을 위한 오락이자 자기 과시를 위한 수단(플랫폼) 역할 을 했다. ② 힙합 장르의 지형은 1980년대에 접어들면서 심대하고 변 혁적인 진화를 겪었다. ④ 그 획기적인 곡은 힙합이 파티 오락에서 강 력한 사회 비판의 수단으로 전환되는 계기가 되었다. ⑤ 그 성공적인 (음반) 발매는 깊이 뿌리내린 인종차별에 맞서기 위해 가사를 적극적 으로 활용한 후속 곡들로 이어졌다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-5", "passage": "The Messages of Hip-Hop Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["Early rap lyrics focused primarily on political resistance and fighting systemic injustice.", "A major shift in the themes of hip-hop music occurred during the 1980s.", "The song The Message depicted the luxurious lifestyle of successful first-class citizens.", "Many hip-hop songs in the 1980s and 1990s carefully avoided addressing racial issues.", "Incorporating heavy social commentary required rap music to abandon its rhythmic dance beats."], "answer": 2, "expl": "1980년대에 힙합의 중대한 변화, 전환이 발생했다고 하였으므로, ② '1980년대에 힙합 음악의 주제에 큰 변화가 일어났 다.'는 내용과 일치한다. [오답] ① 초기 랩 가사는 주로 정치적 저항 과 제도적 불의에 맞서 싸우는 것에 초점을 맞췄다. (초기에는 함께 즐거운 시간을 보내고 실력을 자랑하는 데 초점) ③ 노래 The Message는 성공한 1등 시민들의 호화로운 라이프스타일을 묘사했 다. (빈민가에서 태어나 2등 시민으로 살다 죽어야 하는 소년의 슬픈 현실을 다루었음) ④ 1980년대와 1990년대의 많은 힙합 곡들은 인 종 문제를 다루는 것을 신중하게 피했다. (인종 차별에 맞섰다) ⑤ 무 거운 사회적 비판을 포함하는 것은 랩 음악이 그것의 리드미컬한 댄스 비트를 포기할 것을 요구했다. (사람들은 리듬에 맞춰 몸을 흔들면서 사회적 메시지를 들었다고 했으므로 비트를 포기하지 않았음)", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-5", "passage": "The Messages of Hip-Hop Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["The ancestral form of rap lyrics can be traced back to party chants in early hip-hop.", "The original objective of early hip-hop was to foster peace through social gatherings.", "The Message is widely recognized as one of the most historically impactful rap singles.", "Subsequent rap tracks in the 1990s continued the newly established tradition of social critique.", "Listeners were forced to sit still and listen closely to decipher the lyrics of The Message."], "answer": 5, "expl": "사람들은 음악의 비트에 맞춰 몸을 움직이고 춤을 추면 서 사회적 메시지를 들었다고 했으므로, ⑤ '청취자들은 The Message의 가사를 해독하기 위해 가만히 앉아서 경청해야만 했 다.'는 내용과 일치하지 않는다. [오답] ① 랩 가사의 조상 격인 형태 는 초기 힙합의 파티 챈트(구호)로 거슬러 올라갈 수 있다. ② 초기 힙 합의 원래 목적은 파티를 통해 평화를 촉진하는 것이었다. ③ The Message는 역사적으로 가장 영향력 있는 랩 싱글 중 하나로 널리 인 정받는다. ④ 뒤이어 나온 1990년대의 랩 트랙들은 새로이 확립된 사 회 비판의 전통을 이어 나갔다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-6", "passage": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.” Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers. For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture. Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes. The phrase “something from nothing,” often used to summarize the genre’s history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources. Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers. This is why the message of respect is about both self-worth and respect for others. The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", "opts": ["A new form of attitude centered on respect began to appear in hip-hop lyrics.", "Hip-hop pioneers are admired for conquering difficulties to establish a new art form.", "The phrase \"something from nothing\" reflects the genre's history of commercial success.", "Rappers expressed that they and their listeners endured challenges similar to those of the pioneers.", "The concept of respect in hip-hop includes both personal self-regard and appreciation for others. 박"], "answer": 3, "expl": "글에서 'also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources' (극히 제한된 자원에도 불구하고 빈민가에서 새로운 문화를 발전시킨 초기 힙합 뮤지션들에 대한 경탄의 표현)라고 했다. 이는 상업적 성공의 역사가 아닌, 자원 부족 속 문화 창조에 대한 감탄을 나타낸다. 따라서 글의 내용과 일치 하지 않는 것은 ③ '장르의 상업적 성공의 역사를 반영한다'이다. [오 답] ① 경의를 중심으로 한 새로운 태도가 힙합 가사에 나타나기 시작 했다 ② 힙합 개척자들은 어려움을 극복하고 새로운 예술 형식을 만들 어낸 것으로 존경받는다 ④ 래퍼들은 자신과 청중이 개척자들과 유사 한 도전을 겪었다고 표현했다 ⑤ 힙합에서의 경의 개념은 개인의 자기 가치와 타인에 대한 존중을 모두 포함한다", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-6", "passage": "Also, a new attitude gradually emerged in hip ted to the United Nations in 2001.", "The document emphasized hip-hop's founding purpose of promoting peace in a specific city.", "Kendrick Lamar was nominated for an Oscar Award for his music in 2018.", "Hip-hop was originally created as a cultural force for peace during the 1970s.", "Hip-hop is now regarded as a means to fight injustice and bring about social change."], "answer": 3, "expl": "'When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018' (힙합 아티스트 켄 드릭 라마가 2018년 퓰리처 음악상을 수상했을 때)라고 했다. 그는 퓰리처상을 수상한 것이지 오스카상 후보에 오른 것이 아니다. 따라서 글의 내용과 일치하지 않는 것은 ③ '2018년에 켄드릭 라마는 그의 음악으로 오스카상 후보에 올랐다.'이다. [오답] ① 힙합 평화 선언은 2001년 유엔에 공식 제출되었다 ② 그 문서는 특정 도시에서의 평화 증진이라는 힙합의 창립 목적을 강조했다 ④ 힙합은 원래 1970년대 에 평화를 위한 문화적 힘으로 만들어졌다 ⑤ 힙합은 현재 부당함에 맞서 싸우고 사회 변화를 가져오는 수단으로 여겨진다", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-7", "passage": "Hip-Hop in the 21st Century “The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace. This document reminds us of hip-hop’s original mission to bring peace to the Bronx, implying global respect for hip-hop history. When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event. It meant that hip-hop, which started as underground music, had become a major art form like classical music. If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others. With its unique and growing appeal, hip-hop continues to be a global phenomenon.", "opts": ["The HipHop Declaration of Peace was introduced to the UN after hip-hop had already achieved mainstream success.", "Hip-hop's initial goal was to promote world peace b n of silence", "a decline in ethnic diversity", "a movement toward harmony", "a competition for political power"], "answer": 4, "expl": "빈칸 앞에서 경제 침체 이후 브롱크스에서 갱 폭력이 일 상화되었지만, Ghetto Brothers가 폭력을 멈추고 젊은이들이 힘을 합쳐 더 나은 공동체를 만들자고 제안했으며, 여러 갱 지도자들이 다 시는 폭력으로 분쟁을 해결하지 않겠다고 동의했다고 했으므로, 빈칸 에 들어갈 말로 가장 적절한 것은 ④ ‘화합을 향한 움직임’이다. [오 답] ① 이윤 추구 ② 침묵의 전통 ③ 민족적 다양성의 감소 ⑤ 정치적 권력을 위한 경쟁 [빈칸원문] a new culture of peace", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of abandoned buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner. One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to ______ . They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes. This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants. The story of hip-hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it.", "opts": ["work together for independence", "make laws to eradicate violence", "join forces to bring peace to their town", "resolve disputes through government intervention", "take part in public welfare programs to improve local services"], "answer": 3, "expl": "경제적 침체와 폭력으로 황폐해진 브롱스 지역에서 게토 브라더스라는 갱단이 싸움을 멈추고 평화 협정을 제안하며 마을을 더 살기 좋은 곳으로 만들자고 설득했다는 내용이 제시된다. 폭력을 종식 하고 힘을 합쳐 지역사회를 회복하자는 평화적 연대의 맥락이 성립해 야 하므로, 빈칸에 들어갈 말로 가장 적절한 것은 ③ '자신들의 마을에 평화를 가져오기 위해 힘을 합치도록'이다. [변형] unite and create a better community", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-2", "passage": "After the peace treaty, the gangs that had fought one another started partying together. Abandoned buildings and parking lots were used for events called block parties. 박 What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in ______ .", "opts": ["restarting the violent gang wars in the Bronx", "the spread of hip-hop music and breakdancing", "decreasing the number of people at block parties", "preventing people from dancing to his music", "selling the most LP records in the 1970s"], "answer": 2, "expl": "앞에서 평화 조약 이후 갱단 폭력이 음악과 춤이 있는 '블 록 파티'로 대체되었음을 설명한 뒤, DJ Kool Herc가 두 개의 턴테이 블을 이용해 드럼 섹션인 '브레이크'를 연장함으로써 사람들이 끊임없 이 춤출 수 있게 한 혁신적인 기술을 소개하고 있다. 이러한 기술적 혁 신이 힙합이라는 새로운 문화가 태동하고 확산되는 데 결정적인 역할 을 했다는 맥락이므로, 빈칸에 들어갈 말로 가장 적절한 것은 ② '힙합 음악과 브레이크댄스의 확산'이다. [원문] the rise of hip-hop music and breakdancing [오답] ① 브롱크스에서 폭력적인 갱단 전쟁을 다시 시작하는 것 ③ 블록 파티에 참석하는 사람들의 수를 줄 이는 것 ④ 사람들이 자신의 음악에 맞춰 춤추는 것을 방해하는 것 ⑤ 1970년대에 가장 많은 음반을 판매하는 것", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-2", "passage": "After the peace treaty, the gangs that had fought one another started partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on ______ . It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["public debates", "political campaigns", "commercial business plans", "professional sports competitions", "creative street arts and performances"], "answer": 5, "expl": "빈칸 뒤에서 힙합 문화가 갱 폭력을 음악, 춤, 예술, 스타 일로 대체했다고 했으므로, 빈칸에는 힙합 문화를 이루는 예술적·문화 적 활동들이 들어가야 한다. 따라서 빈칸에 들어갈 말로 가장 적절한 것은 ⑤ ‘창의적인 거리 예술과 공연(활동)’이다. [오답] ① 공개 토론 ② 정치 캠페인 ③ 상업적 사업 계획 ④ 전문 스포츠 경기 [원문] DJing, breakdancing, MCing, and graffiti", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-2", "passage": "DJing, Breakdancing, and MCing ______ ______ After the peace treaty, the gangs that had fought one another ______ started partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to ______ . Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["interrupt their dancing while the DJ changed records", "purchase multiple copies of records to enjoy music privately", "adjust their rhythm to accommodate shifting physical spaces", "rely on live instrumental bands to maintain continuous energy", "compete against rival crews to secure control over turntables"], "answer": 1, "expl": "DJ 쿨 허크는 두 개의 턴테이블을 동시에 활용하여 같은 음반 두 장을 교대로 재생함으로써 드럼 브레이크 구간을 연장하는 기 술을 선보였다. 이러한 기술적 혁신 덕분에 이전처럼 레코드를 바꾸는 동안 음악이 끊겨 춤을 멈춰야 하는 일이 없어졌음을 의미해야 하므 로, 빈칸에 들어갈 말로 가장 적절한 것은 ① 'DJ가 음반을 바꾸는 동 안 그들의 춤을 중단시키다'이다. [변형] stop dancing at the end of the record while the DJ changed the LP disc", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. ______ .", "opts": ["This eventually led to the decline of hip-hop culture", "This independent role evolved into what is known as MCing", "This discouraged people from forming dancer circles", "This prevented B-Boys from dancing in the streets 박", "This role was created to replace the DJ's turntables"], "answer": 2, "expl": "앞에서 곡의 '브레이크' 섹션이 댄스 배틀 문화를 형성하 며 인기를 끌었음을 설명한 뒤, DJ들이 관객의 흥을 돋우기 위해 리듬 에 맞춰 외치던 행위가 래핑의 시초가 되었음을 다루고 있다. 특히 DJ 가 음악 플레이와 관객 소통을 동시에 수행하기 어려워지면서 친구에 게 청중을 대하는 역할을 분담시켰고, 이러한 역할의 분리가 독자적인 영역으로 자리 잡게 되었다는 흐름이다. 따라서 빈칸에는 이 분리된 역할이 MCing으로 발전했다는 내용인 ② '이 독립적인 역할이 MCing으로 알려진 것으로 진화했다'가 가장 적절하다. [원문] This separate role became MCing [오답] ① 이것은 결국 힙합 문화의 쇠퇴로 이어졌다 ③ 이것은 사람들이 댄서 서클을 형성하는 것을 저해 했다 ④ 이것은 B-Boy들이 거리에서 춤추는 것을 막았다 ⑤ 이 역할 은 DJ의 턴테이블을 대체하기 위해 만들어졌다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of ______ , that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing.", "opts": ["writing lyrics alone", "recording songs privately", "calming dancers between songs", "speaking directly to the audience", "replacing the DJ’s musical performance"], "answer": 4, "expl": "빈칸 앞에서 DJs가 노래의 연주 구간 위에서 리듬과 라 임에 맞춰 말하며 관객을 흥분시켰고, DJing과 리듬 있는 외침을 동 시에 하기 어려워졌을 때 친구에게 그 역할을 맡겼다고 했으므로, 빈 칸에 들어갈 말로 가장 적절한 것은 ④ ‘관객에게 직접 말하는 것’이 다. [오답] ① 혼자 가사를 쓰는 것 ② 노래를 개인적으로 녹음하는 것 ③ 노래 사이에 춤추는 사람들을 진정시키는 것 ⑤ DJ의 음악 공연을 대체하는 것 [빈칸원문] addressing the audience", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to ______ at their parties. This person took the role of the Master of Ceremonies, or MC. This separate role became MCing.", "opts": ["prepare their own shout phrases to thrill the crowd", "manage technical equipment behind the main stage", "assume the duty of verbally engaging the audience", "heat up the atmosphere for upcoming dance battles", "calm down the audience for proper stage management"], "answer": 3, "expl": "디제이들이 디제잉과 리드미컬한 구호를 외치는 일을 동 시에 수행하기 힘들어지자 파티에서 관객을 흥분시키고 소통하는 역 할을 친구에게 맡기면서 MC라는 별도의 역할이 생겨났다고 설명한 다. 따라서 빈칸에는 관객을 언어적으로 이끄는 직무를 대신 수행한다 는 의미가 들어가야 하므로, 빈칸에 들어갈 말로 가장 적절한 것은 ③ '관객과 말로 소통하는 책무를 맡다'이다. [변형] take the role of addressing the audience", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-4", "passage": "The Origin of the Word Hip-Hop Then where did the word hip-hop originate from? Nobody knows the exact origin, but it is said that the ______ ______ word hip-hop was first used at a block party. A young man at the party was about to join the army. His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.” The crowd loved it. After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip- hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate success. The new music and dancing spread very fast. There was a sharp unexplained decline in violence during the 1980s in New York. One police officer asked a boy on the street if he knew why. The boy said, “ .”", "opts": ["It’s because everyone is joining the army", "It’s because they’ve found a more violent way to fight", "It’s because they are expressing themselves through movement", "It’s because the police have increased their patrol in the city", "It’s because people are no longer interested in block parties"], "answer": 3, "expl": "글에서 'hip-hop'이라는 단어가 입대를 앞둔 친구를 놀 리는 농담 섞인 구호에서 시작되어 랩의 표준으로 자리 잡고 대중적인 성공을 거두었음을 설명하고 있다. 이후 이러한 새로운 음악과 춤의 확산이 1980년대 뉴욕의 폭력성을 급격히 감소시켰다는 결과를 제시 하며, 경찰관의 질문에 소년이 그 이유를 '춤'에서 찾고 있다. 따라서 빈칸에 들어갈 말로 가장 적절한 것은 ③ '그들이 움직임을 통해 자신 을 표현하고 있기 때문이다'이다. [원문] It’s because they’re dancing [오답] ① 모든 사람이 군대에 입대하고 있기 때문이다 ② 그들이 싸울 더 폭력적인 방법을 찾았기 때문이다 ④ 경찰이 도시의 순찰을 강화했기 때문이다 ⑤ 사람들이 더 이상 블록 파티에 관심이 없기 때문이다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-4", "passage": "The Origin of the Word Hip-Hop Then where did the word hip-hop originate from? Nobody knows the exact origin, but it is said that the word hip-hop was first used at a block party. A young man at the party was about to join the army. His good friend, the MC of the party, reminded him in a jokey way that his days of freedom were over by moving across the stage like a military instructor to the beat, chanting, “Hip-hop-hip-hop-hip-hop.” The crowd loved it. After that, MCs tried out new lines at parties like “Hip, hop, hippy to the hippy hop-bop,” “I said a hip- hop, a hibbit, hibby-dibby, hip-hip-hop and you don’t stop.” Such lines became a standard part of rap and were included in the lyrics of the first recorded hip-hop album, Rapper’s Delight (1979), which was an immediate success. The new music and dancing spread very fast. In fact, the rapid expansion of this creative expression was so powerful that it ______ . One police officer asked a boy on the street if he knew why. The boy said, “It’s because they’re dancing.” 박", "opts": ["forced local youths to adhere to strict military rules", "coincided with a sharp decline in urban street violence", "maximized the financial profits of the major record labels", "led to a temporary increase in criminal activities among the public", "triggered legal conflicts between performers and law enforcement"], "answer": 2, "expl": "빈칸 뒤에서 경찰관이 폭력 감소의 원인을 묻고 소년이 '춤을 추고 있기 때문'이라고 답하는 부분을 통해서 빈칸에는 폭력이 감소했다는 결과에 해당하는 부분이 적절하므로, ② '도시의 거리 폭 력이 급격히 감소한 시기와 맞물렸다'가 적절하다. [오답] ① 지역 청 소년들이 엄격한 군대 규칙을 따르도록 강제했다 ③ 대형 음반사들의 재정적 이익을 극대화했다 ④ 대중 사이에서 범죄 활동이 일시적으로 증가하는 결과를 초래했다 ⑤ 공연자들과 법 집행 기관 사이에 법적 갈등을 촉발했다 [원문] There was a sharp unexplained decline in violence during the 1980s in New York", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-5", "passage": "Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, ______ . The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["remained strictly limited to lighthearted party themes", "focused more on the technical skills of the DJ than the lyrics", "completely stopped making music that people could dance to", "encouraged people to ignore the harsh realities of their lives", "began to serve as a medium for voicing social concerns and critiquing unfairness"], "answer": 5, "expl": "지문의 전반부에서 초기 힙합 가사가 주로 파티의 즐거 움이나 자기 과시에 집중했음을 언급한 뒤, 1980년대 Grandmaster Flash의 'The Message'라는 곡을 기점으로 큰 변화 가 일어났음을 설명하고 있다. 이 곡은 빈민가의 가혹한 현실을 담아 냄으로써 힙합이 단순한 유흥을 넘어 사회적 불의를 비판하는 도구로 변모했음을 보여준다. 따라서 빈칸에는 ⑤ '사회적 우려를 표명하고 불공정함을 비판하는 매체로서 역할을 하기 시작했다'가 가장 적절하 다. [원문] started a new tradition of social criticism against injustice. [오답] ① 엄격하게 가벼운 파티 주제에만 국한되어 남았 다 ② 가사보다는 DJ의 기술적 능력에 더 집중했다 ③ 사람들이 춤출 수 있는 음악을 만드는 것을 완전히 중단했다 ④ 사람들이 자신의 삶 의 가혹한 현실을 무시하도록 권장했다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-5", "passage": "The Messages of Hip-Hop Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started ______ . The Message ______ ______ became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["a commercial strategy to maximize album sales worldwide", "a standard format for writing poetic and beautiful lyrics", "a creative way to combine different styles of street dance", "a peaceful movement focused entirely on pure entertainment", "a fresh shift toward addressing social inequalities and systemic problems"], "answer": 5, "expl": "빈칸 앞에서 빈민가의 가혹한 현실과 2등 시민으로 살 아가는 소년의 비극적인 삶을 다룬 노래가 획기적인 전환점이 되었다 고 했고, 빈칸 뒤에서는 이 노래를 시작으로 인종 차별에 맞서는 수많 은 힙합 곡들이 뒤따랐다고 했으므로, 빈칸에 들어갈 말로 가장 적절 한 것은 ⑤ ‘사회적 불평등과 구조적 문제를 다루는 방향으로의 신선 한 전환’이다. [원문] a new tradition of social criticism against injustice [오답] ① 전 세계 앨범 판매를 극대화하기 위한 상업적 전략 ② 시적이고 아름다운 가사를 쓰는 표준 형식 ③ 서로 다 른 거리춤 스타일을 결합하는 창의적인 방법 ④ 순수한 오락에만 초점 을 맞춘 평화로운 운동 B", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-5", "passage": "The Messages of Hip-Hop Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. Ultimately, this new wave of hip-hop demonstrated that ______ .", "opts": ["musical genres must completely abandon their historical roots to evolve", "commercial profitability is the sole indicator of an artwork’s social impact", "the harsh realities of ghetto life could be resolved by learning traditional dances", "political protests are only effective when separated from popular cultural mediums", "a heavy social consciousness could seamlessly coexist with rhythmic entertainment 박"], "answer": 5, "expl": "빈칸 앞에서 힙합의 메시지가 진중하게 변화했지만, 여 전히 힙합의 리듬이 사람들을 춤추게 하였다고 하였으므로, 빈칸에는 힙합의 메시지와 오락성이 함께 할 수 있음을 표현한 ⑤ '무거운 사회 적 의식이 리드미컬한 오락성과 매끄럽게 공존할 수 있다'가 적절하 다. [오답] ① 음악 장르가 진화하기 위해서는 자신들의 역사적 뿌리 를 완전히 버려야 한다 ② 상업적 수익성이 예술 작품의 사회적 영향 력을 나타내는 유일한 지표이다 ③ 빈민가 삶의 혹독한 현실은 전통 무용을 배움으로써 해결될 수 있다 ④ 정치적 항의는 대중문화 매체와 분리될 때에만 오직 효과적이다 [원문] People heard the social message while moving to the beat", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-6", "passage": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.” Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers. For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture. Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes. The phrase “something from nothing,” often used to summarize the genre’s history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources. Rappers also proudly expressed their feeling that they, too, and perhaps the audience, ______ . This is why the message of respect is about both self-worth and respect for others. The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", "opts": ["shared a distinct musical heritage", "looked up to the pioneers as role models", "understood the pioneers' original creative vision", "carried the pioneers' legacy forward into the mainstream", "had gone through comparable ordeals and come out stronger"], "answer": 5, "expl": "'the pioneers are heroes who overcame hardship and injustice' (개척자들은 어려움과 부당함을 극복한 영 웅들이다)에서 개척자들의 핵심이 고난 극복임을 알 수 있고, 'the message of respect is about both self-worth and respect for others' (경의의 메시지는 자기 가치와 타인 존중 모두에 관한 것 이다)에서 래퍼들 자신의 경험 또한 경의의 근거임을 알 수 있다. 따 라서 빈칸에 들어갈 말로 가장 적절한 것은 ⑤ '비슷한 시련을 겪고 더 강해져서 나왔다'이다. [오답] ① 뚜렷한 음악적 유산을 공유했다 ② 개척자들을 역할 모델로 존경했다 ③ 개척자들의 독창적인 창의적 비 전을 이해했다 ④ 개척자들의 유산을 주류로 이어갔다 [빈칸원문] had suffered and survived in a similar way to the pioneers", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-6", "passage": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.” Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers. For rappers, ______ the ______ pioneers are ______ . Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes. The phrase “something from nothing,” often used to summarize the genre’s history, is also an expression of admiration for early hip- hoppers, who developed a new culture in the ghetto despite very limited resources. Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers. This is why the message of respect is about both self-worth and respect for others. The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", "opts": ["symbols of mainstream success", "role models for musical innovation", "figures who turned hardship into cultural creation", "artists who gave voice to urban communities' hardships", "individuals who built lasting cultural legacies without financial support    "], "answer": 3, "expl": "'who developed a new culture in the ghetto despite very limited resources' (극히 제한된 자원에도 불구하고 빈민가에서 새로운 문화를 발전시켰다)에서 개척자들이 어려움을 딛 고 문화를 창조해낸 인물들임을 알 수 있다. 따라서 빈칸에 들어갈 말 로 가장 적절한 것은 ③ '어려움을 문화적 창조로 전환시킨 인물들'이 다. [오답] ① 주류 성공의 상징들 ② 음악적 혁신을 위한 역할 모델 ④ 도시 공동체의 고통에 목소리를 부여한 예술가들 ⑤ 재정적 지원 없이 지속적인 문화적 유산을 쌓은 개인들 [빈칸원문] heroes who overcame hardship and injustice and went on to create new music and culture", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-6", "passage": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.” Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers. For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture. Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes. The phrase “something from nothing,” often used to summarize the genre’s history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources. Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers. This is why the message of respect is about ______ . The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", "opts": ["valuing commercial popularity over cultural memory", "both recognizing one’s own worth and honoring others", "replacing admiration for pioneers with personal fame", "separating musical creativity from social experience", "proving that suffering always produces artistic success"], "answer": 2, "expl": "앞에서 힙합의 존경은 고난과 불의를 극복한 선구자들 에 대한 존경을 의미하며, 동시에 래퍼 자신과 청중도 비슷한 방식으 로 고통을 겪고 살아남았다는 자부심과 연결된다고 하였다. 따라서 존 경의 메시지는 자기 자신의 가치 인식과 타인에 대한 존경을 모두 포 함한다는 내용이 되어야 하므로, 빈칸에 들어갈 말로 가장 적절한 것 은 ②이다. [오답] ① 문화적 기억보다 상업적 인기를 중시하는 것 ③ 선구자들에 대한 존경을 개인적 명성으로 대체하는 것 ④ 음악적 창의 성을 사회적 경험과 분리하는 것 ⑤ 고통이 항상 예술적 성공을 낳는 다는 것을 증명하는 것 [변형] 빈칸 원문 both self-worth and respect for others", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-7", "passage": "“The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace. This document reminds us of hip-hop’s original mission to bring peace to the Bronx, implying ______ . When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event. It meant that hip-hop, which started as underground music, had become a major art form like classical music. If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others. With its unique and growing appeal, hip-hop continues to be a global phenomenon.", "opts": ["its rebellious spirit", "its commercial success", "its global historical recognition", "its influence on dance culture 박", "its technical musical simplicity"], "answer": 3, "expl": "'officially recognized hip-hop as an international culture of peace' (힙합을 국제적인 평화 문화로 공 식 인정했다)에서 힙합이 UN이라는 국제기구에 의해 세계적으로 인 정받게 되었음을 알 수 있다. 이 선언이 전 세계에 전달하는 것은 힙합 의 음향적 특색이나 저항 정신이 아니라, 힙합 역사 전반에 대한 세계 적 경의, 즉 힙합이 지닌 문화적 의의임을 알 수 있다. 따라서 빈칸에 들어갈 말로 가장 적절한 것은 ③ '세계 역사적 인정'이다. [오답] ① 저항 정신 ② 상업적 성공 ④ 춤 문화에 미친 영향 ⑤ 기술적 음악적 단순 [빈칸원문] global respect for hip-hop history", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-7", "passage": "“The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace. This document reminds us of hip-hop’s original mission to bring peace to the Bronx, implying global respect for hip-hop history. When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event. It meant that hip-hop, which started as underground music, had become a major art form like classical music. If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as ______ . With its unique and growing appeal, hip-hop continues to be a global phenomenon.", "opts": ["a musical genre whose value depends chiefly on formal awards", "a purely local tradition preserved mainly by Bronx communities", "a temporary artistic trend separated from global cultural influence", "a historical movement that has replaced social messages with entertainment", "an influential channel for self-expression, resistance, social change, and connection"], "answer": 5, "expl": "힙합은 오늘날 자기표현, 불의에 맞서는 일, 사회적 메 시지를 통한 변화, 음악적 몰입과 타인과의 연결을 가능하게 하는 강 력한 수단으로 여겨진다고 했으므로, 빈칸에는 ⑤ ‘자기표현, 저항, 사 회 변화 및 유대를 위한 영향력 있는 수단’가 들어가는 것이 가장 적절 하다. [오답] ① 가치가 주로 공식적인 상에 의존하는 음악 장르 ② 주 로 브롱스 공동체에 의해 보존되는 순수한 지역 전통 ③ 세계적 문화 영향력과 분리된 일시적인 예술적 경향 ④ 사회적 메시지를 오락으로 대체한 역사적 운동 [원문] - a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-7", "passage": "“The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace. This document reminds us of hip-hop’s original mission to bring peace to the Bronx, implying global respect for hip-hop history. When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event. It meant that hip-hop, which started as underground music, had become a major art form like classical music. If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others. With its unique and growing appeal, hip-hop ______ .", "opts": ["strictly confines its artistic influence to its local birthplace in the Bronx", "experiences a complete disconnect from its founding sociopolitical ideals", "successfully replaces classical music by prioritizing pure commercial profit", "fails to sustain its global impact due to internal resistance from mainstream media    ", "continues to flourish as a global phenomenon while staying true to its original ethos"], "answer": 5, "expl": "빈칸 앞에서 1970년대 평화 운동으로 태어났으며, 오 늘날에도 여전히 사회적 변화와 연대의 수단으로 간주된다고 하였으 므로, 빈칸에는 속성을 잃지 않은 상태로 21세기까지 글로벌 영향력 을 확장하고 있다는 흐름이 자연스러우므로, ⑤ '원래의 본질에 충실 하면서도 글로벌 현상으로 계속해서 번창하고 있다'가 적절하다. [오 답] ① 그것의 예술적 영향력을 브롱크스라는 지역적 발상지에 엄격하 게 국한시키고 있다 ② 그것의 기반이 되는 사회정치적 이상으로부터 전적인 단절을 겪고 있다 ③ 순수한 상업적 이익을 우선시함으로써 클 래식 음악을 성공적으로 대체하고 있다 ④ 주류 매체의 내부적 저항 때문에 그것의 전 세계적인 영향력을 유지하는 데 실패하고 있다 [원 문] continues to be a global phenomenon", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}]}, {"key": "main", "no": 3, "title": "대의 파악", "emoji": "🎯", "desc": "주제·제목·요지·함축의미", "questions": [{"q": "다음 글의 주제로 가장 적절한 것은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of abandoned buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner. One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community. They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes. This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants. The story of hip-hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it.", "opts": ["the birth of hip-hop music in the Bronx", "the economic recession in the early 1970s", "the Ghetto Brothers' efforts for community peace", "the transformation of urban areas into slums", "the emergence of gangs and violence in the Bronx"], "answer": 1, "expl": "1970년대 초 브롱스의 황폐한 도시 환경과 갱단 폭력 속 에서 Ghetto Brothers가 평화 조약을 제안하며 폭력을 멈추고 공동 체를 개선하려 노력했고, 이러한 새로운 평화 문화의 중요한 부분으로 힙합 음악이 탄생했다고 설명하며, 특히 힙합 음악이 이러한 사회적 배경 속에서 어떻게 시작되었는지를 통해 힙합의 기원을 드러내고 있 으므로, 글의 주제로 가장 적절한 것은 ① ‘브롱스에서의 힙합 음악의 탄생’이다. [오답] ② 1970년대 초 경제 불황 ③ 게토 브라더스의 지 역 사회 평화를 위한 노력 ④ 도시 지역의 빈민가로의 변모 ⑤ 브롱스 에서 갱단과 폭력의 출현", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 제목으로 가장 적절한 것은?", "tag": "1-1", "passage": "Imagine an urban area that is fast becoming a slum after an economic recession. Businesses close their doors and building owners have left. The area is full of abandoned buildings. There is no heating even in winter. Only those who can’t afford to move out remain. Unemployment is high, many gangs emerge, and gang violence between young people becomes an everyday thing. Despair is on every street corner. One day, however, a gang called the Ghetto Brothers, which is respected because of its free meal and medical care programs, decides to stop fighting and instead persuade young people to unite and create a better community. They suggest a peace treaty. “This is for peace, men. The violence took away our brothers. We’re not gangsters anymore. We’ve got to make this town a better place to live.” Thanks to these new voices, gang leaders from all over the area sign the treaty. Never again will they use violence to solve their disputes. This is the Bronx in the New York of the early 1970s, where hip-hop music was born as a major part of a new culture of peace created by African Americans and immigrants. The story of hip-hop, now one of the world’s most dominant music genres, is a fascinating one. Let’s explore it.", "opts": ["The Bronx: A City of Despair and Violence", "The Ghetto Brothers: Pioneers of Peace in the Bronx", "The Economic Downturn and Its Impact on Urban Areas", "From Gang Violence to Global Music: The Birth of Hip- Hop", "Hip-Hop's Journey: From Local Culture to Global Phenomenon"], "answer": 4, "expl": "1970년대 초 브롱스의 황폐한 환경과 갱단 폭력 속에서 Ghetto Brothers가 평화 조약을 제안하며 폭력을 멈추고 공동체를 개선하려 노력했고, 이러한 새로운 평화 문화의 중요한 부분으로 힙합 음악이 탄생했다고 설명하고 있으므로, 글의 제목으로 가장 적절한 것 은 ④ ‘갱단 폭력에서 세계적인 음악으로: 힙합의 탄생’이다. [오답] ① 브롱스: 절망과 폭력의 도시 ② 게토 브라더스: 브롱스의 평화 선 구자들 ③ 경제 침체와 도시 지역에 미치는 그 ayed two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["Gangs continued to fight each other at block parties.", "Block parties were exclusively held in abandoned buildings.", "Hip-hop culture consisted of four main creative elements.", "DJ Kool Herc invented the turntable for his sister's birthday.", "People had to stop dancing frequently during Herc's DJ sets."], "answer": 3, "expl": "힙합 문화가 \"DJing, breakdancing, MCing, and graffiti\"에 기반을 둔 활기찬 청소년 운동이라고 명시하고 있으므로, ③ ‘힙합 문화는 네 가지 주요 창작 요소로 구성되었다’는 내용과 일치 한다. [오답] ① 갱단들은 블록 파티에서 계속 서로 싸웠다. ② 블록 파티는 오직 버려진 건물에서만 열렸다. ④ DJ Kool Herc는 여동생 의 생일을 위해 턴테이블을 발명했다. ⑤ 사람들은 Herc의 디제잉 시 간 동안 춤을 자주 멈춰야 했다. B", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-2", "passage": "After the peace treaty, the gangs that had fought one another started partying together. Abandoned buildings and parking lots were used for events called block parties. What eventually emerged from these parties? A vibrant youth movement called hip-hop culture, based on DJing, breakdancing, MCing, and graffiti. It replaced gang violence with music, dance, art, and style. The most popular block parties were those hosted by DJ Kool Herc, who is regarded as the founding father of hip-hop. Herc’s party for his sister’s birthday in August 1973 is now known as the birthplace of hip-hop music because of his new DJ technique. At this party, using two turntables at the same time, Herc played two copies of the same record and then switched between them to extend the drum section known as the break. No longer did people have to stop dancing at the end of the record while the DJ changed the LP disc. Kool Herc’s style of DJing quickly became influential in the rise of hip-hop music and breakdancing.", "opts": ["A peace treaty led former rival gangs to party together.", "Hip-hop culture provided an alternative to gang violence.", "DJ Kool Herc is considered the founder of hip-hop.", "Herc's famous party took place in the summer of 1973.", "Herc used a single turntable to create his new technique."], "answer": 5, "expl": "본문에서 DJ Kool Herc가 \"using two turntables at the same time\" 즉, 동시에 두 개의 턴테이블을 사용하여 새로 운 기술을 선보였다고 명확히 설명하고 있으므로, ⑤ ‘Herc는 그의 새 로운 기술을 만들기 위해 단일 턴테이블을 사용했다’는 글의 내용과 일치하지 않는다. [오답] ① 평화 조약으로 인해 이전의 경쟁 갱단들 이 함께 파티를 열게 되었다. ② 힙합 문화는 갱단 폭력에 대한 대안을 제공했다. ③ DJ Kool Herc는 힙합의 창시자로 여겨진다. ④ Herc 의 유명한 파티는 1973년 여름에 열렸다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 주제로 가장 적절한 것은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing.", "opts": ["the historical development of street dance battles", "the origins of B-Boying and MCing in hip-hop culture", "the significant influence of Kool Herc on modern music", "the technical evolution of DJing from the past to the present", "the cultural differences between B-Boys and Masters of Ceremonies 박"], "answer": 2, "exp e Master of Ceremonies or MC, at their parties. This separate role became MCing.", "opts": ["individual - dancing", "energetic - singing", "competitive - MCing", "structured - composing", "permanent - recording"], "answer": 3, "expl": "곡의 브레이크 섹션이 댄서들이 원을 만들어 개인의 기 술을 뽐내는 경쟁적인 거리 춤 배틀 문화를 형성하는 데 기여했으며, 비트에 맞춰 리듬감 있게 외치던 행위가 점차 DJ와 분리된 전문적인 MCing 역할로 발전하게 된 과정을 설명하고 있다. 따라서 '곡의 브레 이크 섹션이 (A)경쟁적인 댄스 문화를 조성함에 따라, 비트 위에서 리 듬감 있게 외치는 행위는 (B)MCing이라는 독자적인 역할로 진화했 다'와 같이 요약하는 것이 가장 적절하다.", "inline": false, "short": false, "summary": "While the break section of a song fostered a (A) dance culture, the practice of rhythmic shouting over the beat evolved into the distinct role of (B) . ______ 박", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing.", "opts": ["The term \"B-Boy\" was created by dancers themselves.", "DJs started rapping because they wanted to become singers.", "MCing originated as a role performed by the DJ.", "Street dance battles were primarily held in formal competitions.", "Kool Herc was the first person to be officially called an MC."], "answer": 3, "expl": "본문에서 \"DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd(Kool Herc와 같은 디제이들은 관중의 흥을 돋우 기 위해 노래의 악기 연주 구간 동안 박자와 라임을 넣은 말을 했 다.)\"라고 언급하며, 이것이 래핑 또는 MCing의 시작이었다고 설명 한다. 이는 MCing이 원래 DJ가 수행하던 역할에서 비롯되었음을 보 여주므로, ③ ‘MCing은 DJ에 의해 수행되던 역할로서 시작되었다’는 글의 내용과 일치한다. [오답] ① B-Boy라는 용어는 댄서들 스스로 가 만들었다. → Kool Herc가 만들었다. ② DJ들은 가수가 되고 싶 어서 랩을 시작했다. → 관중의 흥을 돋우기 위해 시작했다. ④ 스트 리트 댄스 배틀은 주로 공식적인 대회에서 열렸다. → 거리에서 열렸 다. ⑤ Kool Herc는 공식적으로 MC라고 불린 최초의 인물이었다. → 본문에 언급되지 않았다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-3", "passage": "The break section became the most anticipated part of a song. People would form dancer circles and use the break to show off their individual dancing skills. Kool Herc named the people dancing to his music B- Boys and B-Girls, short for Break-Boys and Break- Girls. These people began to dance in groups in the streets and build a street dance battle culture. DJs like Kool Herc would speak in rhythm and rhyme over instrumental parts of songs to excite the crowd. They would shout phrases like “To the beat” and “You don’t stop!” This was the beginning of rapping or MCing. When DJs couldn’t do both DJing and rhythmic shouting at the same time, they asked a friend to take the role of addressing the audience, that is, of the Master of Ceremonies or MC, at their parties. This separate role became MCing.", "opts": ["The break section of a song was popular among dancers.", "B-Boys and B-Girls are abbreviations for Break-Boys and Break-Girls.    ", "DJs used rhythmic shouting to energize the audience.", "The role of an MC was created to assist with both DJing and dancing.", "The culture of street dance battles was developed by B- Boys and B-Girls."], "answer": 4, "expl": "본문에서 DJ가 디제잉과 리듬감 있는 외침을 동시에 할 수 없을 때, 친구에게 관객을 상대하는 역할, 즉 MC의 역할을 맡겼다 고 설명한다. 이는 MC의 역할이 춤이 아닌, 관객과의 소통을 돕기 위 해 만들어졌음을 의미한다. 따라서 ④ ‘MC의 역할은 디제잉과 춤 둘 다를 돕기 위해 만들어졌다’는 글의 내용과 일치하지 않는다. [오답] ① 노래의 브레이크 부분은 댄서들 사이에서 인기가 있었다. ② iticism", "the influence of rhythmic beats on modern music", "the harsh living conditions in 1980s urban ghettos"], "answer": 3, "expl": "초기 힙합의 파티 찬트가 1982년 'The Message'의 등장으로 인해 사회적 불평등을 고발하는 가사로 변화했음을 설명하 며, 특히 음악적 즐거움과 사회적 메시지의 결합을 통해 힙합의 새로 운 전통이 확립되었음을 드러내고 있으므로, 글의 주제로 가장 적절한 것은 ③ ‘사회 비판으로의 랩 가사의 진화’이다. [오답] ① 힙합 댄스 스타일의 역사 ② 초기 힙합 음악에서 DJ의 역할 ④ 리듬감 있는 비트 가 현대 음악에 미치는 영향 ⑤ 1980년대 도시 빈민가의 가혹한 생활 조건", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 제목으로 가장 적절한 것은?", "tag": "1-5", "passage": "Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. 박 With this song, hip-hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["Hip-Hop: From Party Chants to Social Voices", "The Message: A Song That Changed Dance History", "Why 1980s Hip-Hop Failed to Address Inequality", "The Conflict Between Rhythmic Beats and Lyrics", "Racial Discrimination: The Only Theme of Rap Music"], "answer": 1, "expl": "즐거움을 추구하던 초기 랩이 'The Message'를 기점 으로 인종 차별과 빈민가의 현실을 다루는 강력한 도구로 변모했음을 설명하며, 특히 리듬에 맞춰 춤을 추면서도 사회적 메시지를 듣게 된 변화를 드러내고 있으므로, 글의 제목으 5", "passage": "The Messages of Hip-Hop Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["Early rap lyrics mainly focused on social problems and injustice.", "\"The Message\" was released by Grandmaster Flash and Furious Five.", "The boy in \"The Message\" was born into a wealthy and privileged family.", "Hip-hop songs in the 1990s stopped dealing with racial discrimination.", "People found it difficult to dance to hip-hop songs with social messages."], "answer": 2, "expl": "1982년 Grandmaster Flash와 Furious Five에 의 해 'The Message'가 발표되었고, 특히 이 곡이 힙합의 흐름을 바꾼 획기적인 사건이었다고 했으므로, 글의 내용과 일치하는 것은 ② ‘\"The Message\"는 Grandmaster Flash와 Furious Five에 의해 발표되었다’이다. [오답] ① 초기 랩 가사는 주로 사회 문제와 불의에 집중했다. (파티와 자랑에 집중) ③ \"The Message\"의 소년은 부유 하고 특권 있는 가정에서 태어났다. (게토에서 태어남) ④ 1990년대 힙합 노래들은 인종 차별을 다루는 것을 중단했다. (계속해서 맞섬) ⑤ 사람들은 사회적 메시지가 담긴 힙합 노래에 맞춰 춤추는 것이 어 렵다는 것을 알게 되었다. (춤추면서 메시지를 들음)", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-5", "passage": "Rap lyrics, which started as the party chants of early hip-hop, typically focused on having a good time together and boasting about the ability of the DJ or the rapper. However, a significant shift occurred during the rise of hip-hop music in the 1980s. Most importantly, the appearance of The Message by the group Grandmaster Flash and Furious Five in 1982 was groundbreaking. This song’s powerful lyrics detailed the harsh realities of life in the ghetto, including the sad story of a boy who was born there and had to live and die as a second-class citizen. With this song, hip- hop, whose original aim was creating peace through partying, started a new tradition of social criticism against injustice. The Message became one of the most influential rap singles of all time, and was followed by many hip-hop songs that confronted racial discrimination in the 1980s and 1990s. At the same time, their music with its rhythmic beat and rapping made people move or dance. People heard the social message while moving to the beat.", "opts": ["Early hip-hop lyrics often involved boasting about a rapper's skills.", "\"The Message\" is considered one of the most influential rap singles.", "The shift toward social criticism in hip-hop occurred in the 1980s.", "\"The Message\" focused on creating a peaceful party atmosphere only.", "Hip-hop music maintained its rhythmic beat even after adding social messages."], "answer": 4, "expl": "'The Message'가 게토의 가혹한 현실을 상세히 다루 며 사회 비판의 전통을 시작했음을 설명하며, 특히 이 곡이 단순한 파 티용 음악을 넘어섰다고 했으므로, 글의 내용과 일치하지 않는 것은 ④ ‘\"The Message\"는 오직 평화로운 파티 분위기를 조성하는 데만 집중했다’이다. [오답] ① 초기 힙합 가사는 종종 래퍼의 기술을 자랑 하는 것을 포함했다. ② \"The Message\"는 가장 영향력 있는 랩 싱 글 중 하나로 여겨진다. ③ 힙합에서 사회 비판으로의 전환은 1980년 대에 일어났다. ⑤ 힙합 음악은 사회적 메시지를 추가한 후에도 리듬 감 있는 비트를 유지했다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "tag": "1-6", "passage": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.” Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers. For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and culture. Therefore, many hip-hoppers agree that they cannot have too much respect for these heroes. The phrase “something from nothing,” often used to summarize the genre’s history, is also an expression of admiration for early hip-hoppers, who developed a new culture in the ghetto despite very limited resources. Rappers also proudly expressed their feeling that they, too, and perhaps the audience, had suffered and survived in a similar way to the pioneers. This is why the message of respect is about both self-worth and respect for others. The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", "opts": ["courage - talent", "achievement - dignity", "wisdom - passion", "influence - potential", "creativity - vision"], "answer": 2, "expl": "힙합에서 'respect(경의)'라는 새로운 태도가 등장하 여, 이것이 개척자들의 업적을 기리는 동시에 그들과 유사한 고난을 경험한 이들의 존엄성을 인정하는 이중의 의미를 담고 있다는 내용의 글이므로, '힙합에서 경의의 개념은 이중의 목적을 지닌다: 문화 개척 자들의 (A)업적을(achievement) 기리고, 그들의 투쟁을 함께한 이 들의 (B)존엄성을(dignity) 인정하는 것이다'와 같이 요약하는 것이 가장 적절하다. [오답] ① 용기 - 재능 ③ 지혜 - 열정 ④ 영향력 - 잠 재력 ⑤ 창의성 - 비전", "inline": false, "short": false, "summary": "In hip-hop, the concept of respect serves a dual purpose: it celebrates the ______ (A) of cultural pioneers and validates the ______ (B) of those who shared in their struggles. 박", "given": "", "lead": "", "parts": []}, {"q": "다음 글에서 밑줄 친 부분이 의미하는 바로 가장 적절한 것은?", "tag": "1-6", "passage": "Also, a new attitude gradually emerged in hip-hop lyrics, which can be summarized as “respect.” Hip-hop music began to be a way to express respect for one another, and particularly for hip-hop pioneers. For rappers, the pioneers are heroes who overcame hardship and injustice and went on to create new music and henomenon.", "opts": ["The HipHop Declaration of Peace was officially submitted to the United Nations in 2001.", "The document emphasized hip-hop's founding purpose of promoting peace in a specific city.    ", "Kendrick Lamar was nominated for an Oscar Award for his music in 2018.", "Hip-hop was originally created as a cultural force for peace during the 1970s.", "Hip-hop is now regarded as a means to fight injustice and bring about social change."], "answer": 3, "expl": "'When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018' (힙합 아티스트 켄 드릭 라마가 2018년 퓰리처 음악상을 수상했을 때)라고 했다. 그는 퓰리처상을 수상한 것이지 오스카상 후보에 오른 것이 아니다. 따라서 글의 내용과 일치하지 않는 것은 ③ '2018년에 켄드릭 라마는 그의 음악으로 오스카상 후보에 올랐다.'이다. [오답] ① 힙합 평화 선언은 2001년 유엔에 공식 제출되었다 ② 그 문서는 특정 도시에서의 평화 증진이라는 힙합의 창립 목적을 강조했다 ④ 힙합은 원래 1970년대 에 평화를 위한 문화적 힘으로 만들어졌다 ⑤ 힙합은 현재 부당함에 맞서 싸우고 사회 변화를 가져오는 수단으로 여겨진다", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-7", "passage": "Hip-Hop in the 21st Century “The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially recognized hip-hop as an international culture of peace. This document reminds us of hip-hop’s original mission to bring peace to the Bronx, implying global respect for hip-hop history. When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event. It meant that hip-hop, which started as underground music, had become a major art form like classical music. If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express oneself, fight against injustice, bring about change through social messages, and still be engaged with music and connected to others. With its unique and growing appeal, hip-hop continues to be a global phenomenon.", "opts": ["The HipHop Declaration of Peace was introduced to the UN after hip-hop had already ach hers. The importance of the idea of respect in hip-hop cannot be emphasized strongly enough.", "opts": ["go - is used - that", "go - used - what", "went - used - what", "went - is used - that", "went - used - that"], "answer": 5, "expl": "A) 관계절의 동사 overcame과 병렬 관계이므로, 과 거시제 went가 알맞다. (B) 주어 The phrase에 대한 동사는 뒤에 is로 제시되어 있으므로 (B)는 준동사 자리이며, 주어와의 관계가 수 동이므로 과거분사 used가 올바르다. (C) 동사 expressed의 목적 어 자리이며 완전한 절이 이어지므로 명사절 접속사 that이 알맞다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "1-7", "passage": "Hip-Hop in the 21st Century “The HipHop Declaration of Peace,” ① presenting to the UN on May 16th, 2001, officially recognized hip- hop as an international culture of peace. This document reminds us of hip-hop’s original mission ② to bring peace to the Bronx, implying global respect for hip-hop history. When hip-hop artist Kendrick Lamar was awarded a Pulitzer Prize for Music in 2018, it was another important event. It meant that hip-hop, ③ which started as underground music, had become a major art form like classical music. If hip-hop music was born as part of a cultural movement for peace in the 1970s, today more and more people regard it as a powerful means to express ④ oneself, fight against injustice, bring about change through social messages, and still be engaged with music and ⑤ connected to others. With its unique and growing appeal, hip-hop continues to be a global phenomenon.", "opts": [], "answer": 1, "expl": "'The HipHop Declaration of Peace'는 UN에 '제출 된' 대상(수동)이므로 수동 분사 'presented'가 와야 한다. 'presenting'(능동 분사)은 선언문 자체가 UN에 무언가를 '제출하 는' 주체가 된다는 의미여서 문맥에 어울리지 않는다. 따라서 ① 'presenting'을 'presented'로 고쳐야 한다.", "inline": true, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "1-7", "passage": "Hip-Hop in the 21st Century “The HipHop Declaration of Peace,” presented to the UN on May 16th, 2001, officially ① recognizing

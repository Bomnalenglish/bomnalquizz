body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:#2a2a2a;}

#startScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

.s-card h1{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--pri);margin-bottom:6px;}
.s-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.info-item{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--pri);font-weight:700;}
.ni{width:100%;padding:11px 14px;border:2px solid var(--bdr);border-radius:12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:10px;}

/* PASSAGE SELECT */
#passageScreen{padding:20px;max-width:680px;margin:0 auto;}
.ps-header{background:linear-gradient(135deg,#f7efe4,#ece0d2);color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:18px 22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}

.fb.on{background:var(--pri);color:white;}

.p-card{background:white;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:2.5px solid #e6dccd;transition:all .18s;position:relative;}

.p-card.sel{border-color:var(--pri);background:#f3ebe0;}

.type-row{display:flex;gap:6px;flex-wrap:wrap;}
.type-row .fb{padding:6px 12px;font-size:12.5px;}

.p-card.off{opacity:.35;pointer-events:none;}
.cnt-box{background:white;border-radius:12px;padding:12px 14px;margin-bottom:10px;border:2px solid #e6dccd;}
.cnt-lbl{font-size:13px;font-weight:800;color:var(--pri);margin-bottom:8px;}
.cnt-lbl span{font-weight:400;color:var(--muted);font-size:12px;}

.go-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}

.ht{font-family:'Black Han Sans',sans-serif;font-size:15px;}
.hs{font-size:10px;opacity:.7;margin-top:2px;}
.hb{background:#fff;color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700;}
.pw{height:4px;background:#e6dccd;}.pf{height:100%;background:linear-gradient(90deg,#6b4a2b,#b07a45);transition:width .4s;}

.qno{font-family:'Black Han Sans',sans-serif;font-size:13px;color:white;background:var(--pri);padding:3px 12px;border-radius:12px;}
.qtype{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:#f6e7d6;color:#9a5b2b;}
.qsrc{font-size:10px;color:var(--muted);margin-left:auto;}
.passage-tag{font-size:10px;font-weight:700;color:#6b4a2b;background:#f3ebe0;padding:2px 8px;border-radius:8px;}
.passage-box{background:#fbf7f1;border-left:4px solid var(--pri);border-radius:0 10px 10px 0;padding:14px 16px;font-size:13px;line-height:1.85;margin-bottom:14px;color:#3b2f25;white-space:pre-wrap;}
.q-prompt{font-size:13px;font-weight:700;color:#6b4a2b;margin-bottom:10px;padding:8px 12px;background:#f3ebe0;border-radius:8px;}
.choices{display:grid;gap:8px;}
.cb{background:#f7f1e8;border:2px solid #e6dccd;border-radius:11px;padding:12px 15px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:flex-start;gap:10px;line-height:1.5;}
.cb:hover:not(:disabled){border-color:var(--pri);background:#f3ebe0;}
.cb.correct{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;}
.cb.wrong{background:#ffebee;border-color:#c62828;color:#b71c1c;}

.cn{width:24px;height:24px;border-radius:50%;background:#d9c9b3;color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.fb-msg{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:800;margin-top:10px;display:none;}
.fb-msg.ok{background:#e8f5e9;color:#1b5e20;display:block;}
.fb-msg.no{background:#ffebee;color:#b71c1c;display:block;}

/* RESULT */
#resultScreen{padding:20px;max-width:600px;margin:0 auto;}
.rc{background:white;border-radius:24px;padding:30px 22px;box-shadow:0 8px 32px rgba(107,74,43,.1);text-align:center;}

.rsub{font-size:13px;color:var(--muted);margin-top:4px;}
.sr{display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap;}
.si{text-align:center;}.sn{font-family:'Black Han Sans',sans-serif;font-size:24px;}.sl{font-size:11px;color:var(--muted);margin-top:2px;}
.wl{background:var(--bg);border-radius:14px;padding:14px;text-align:left;margin-top:14px;max-height:300px;overflow-y:auto;}

.wi{background:white;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:11px;border-left:3px solid #e91e63;}
.wie{font-weight:800;color:var(--pri);}.wid{font-size:10px;color:var(--muted);margin-top:2px;}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.rbtn{padding:12px 24px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.rbtn-p{background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;}
.rbtn-s{background:#f7f1e8;color:#6b4a2b;border:2px solid #d9c9b3;}

.p-card{background:#fdf8f2;}
.p-card.sel{background:#f0e6d8;}
</style>

{"no": 33, "school": "", "pref": "20", "type": "", "diff": "", "stem": "습관에 대해 글쓴이를 계속 놀라게 하는 것은?", "p": "20-33", "choices": ["순전한 편리함이 주는 영향", "타고난 성격의 강한 힘", "주변 사람들의 칭찬 효과", "반복 횟수보다 중요한 보상"], "ans": 1, "exp": "글쓴이는 우리가 '순전한 편리함(sheer convenience)'에 얼마나 많이 좌우되는지가 늘 놀랍다고 했어요.\n📖 One thing that continually astonishes me is the degree to which we’re influenced by <b>sheer convenience</b>.\n   나를 계속 놀라게 하는 한 가지는 우리가 순전한 편리함에 영향을 받는 정도이다.", "b": 1, "bb": "People often ask me, “What surprises you most about habits?” One thing that continually astonishes me is the degree to which we’re influenced by sheer convenience. The amount of effort, time, or decision making required by an action has a huge influence on habit formation. To a truly remarkable extent, we’re more likely to do something if it’s convenient, and less likely if it’s not. For this reason, we should pay close attention to the convenience of any activity we want to make into a habit. Putting a wastebasket next to our front door made mail sorting slightly more convenient, and I stopped procrastinating with this chore. Many people report that they do a much better job of staying close to distant family members now that tools like group chats make it easy to stay in touch."},

{"no": 48, "school": "", "pref": "20", "type": "", "diff": "", "stem": "윗글의 전개 방식에 대한 설명으로 가장 적절한 것은?", "p": "20-48", "choices": ["질문 제시 뒤 원리와 예를 든다", "두 이론을 차례로 비교한다", "실험 결과를 수치로 보여 준다", "반대 주장을 끝까지 반박한다"], "ans": 1, "exp": "사람들이 자주 묻는 질문으로 시작해, 편리함의 원리를 말하고 쓰레기통과 단체 대화방 예를 들어요.\n📖 <b>People often ask me, “What surprises you most about habits?”</b>\n   사람들은 나에게 자주 \"습관에 대해 가장 놀라운 점이 무엇인가요?\"라고 묻는다.", "b": 1, "bb": "People often ask me, “What surprises you most about habits?” One thing that continually astonishes me is the degree to which we’re influenced by sheer convenience. The amount of effort, time, or decision making required by an action has a huge influence on habit formation. To a truly remarkable extent, we’re more likely to do something if it’s convenient, and less likely if it’s not. For this reason, we should pay close attention to the convenience of any activity we want to make into a habit. Putting a wastebasket next to our front door made mail sorting slightly more convenient, and I stopped procrastinating with this chore. Many people report that they do a much better job of staying close to distant family members now that tools like group chats make it easy to stay in touch."},
{"no": 49, "school": "", "pref": "21", "type": "", "diff": "", "stem": "상식적으로 알려진 내용으로 글이 소개하는 것은?", "p": "21-49", "choices": ["내면의 믿음이 행동을 이끈다", "행동이 믿음을 모두 만든다", "믿음과 행동은 서로 무관하다", "행동은 환경에만 좌우된다"], "ans": 1, "exp": "첫 문장에서 사람의 내면의 믿음이 겉으로 드러나는 행동을 이끈다는 것은 상식이라고 했어요.\n📖 It is common sense that <b>people’s inner beliefs may drive their external behavior</b>.\n   사람의 내면의 믿음이 겉으로 드러나는 행동을 이끌 수 있다는 것은 상식이다.", "b": 1, "bb": "It is common sense that people’s inner beliefs may drive their external behavior. If you’re attracted to a certain person, you should be more likely to socialize with that person. If you favor a brand of toothpaste, you’re more likely to buy it. Of course, our internal thoughts don’t always predict our public behavior, but, overall, what we do obviously reflects what we think. But beliefs and behaviors are also related in a more remarkable way. It turns out that the arrow is as likely to point in the reverse direction. As social psychologist David Myers observes, “If social psychology has taught us anything during the last 25 years, it is that we are likely not only to think ourselves into a way of acting but also to act ourselves into a way of thinking.”"},

{"no": 65, "school": "", "pref": "22", "type": "", "diff": "", "stem": "글에 따르면 우리가 대화 중에 상대의 말을 놓치는 이유는?", "p": "22-65", "choices": ["다음에 할 말을 머릿속으로 연습하고 있어서", "상대의 말이 너무 빠르게 이어져서", "말하는 사람이 핵심을 숨기고 있어서", "주변이 시끄러워 집중할 수 없어서"], "ans": 1, "exp": "우리가 들은 말을 놓치는 까닭은 머릿속으로 다음에 할 말을 미리 연습하기 때문이라고 했어요.\n📖 We miss what’s being said because we’re <b>mentally rehearsing our next utterance</b>.\n   우리는 다음에 할 말을 머릿속으로 연습하고 있기 때문에 지금 들리는 말을 놓친다.", "b": 1, "bb": "Imagine following the spirit of a silence vow into daily life. Challenge yourself to spend an entire day saying only what you absolutely must say. It’s been widely observed by behavioral psychology experts — and anyone who’s ever been on a first date — that we too often tend to treat “conversation” as a game of waiting for our own turn to speak. We miss what’s being said because we’re mentally rehearsing our next utterance. What if you could eliminate the idea that the next available mini-silence is your next opening to express whatever is in your head? What if you were limited to, say, fifty spoken words tomorrow? I think you’d listen quite differently. You’d attend quite carefully to every word you heard. You’d be attuned to what you must respond to. You might discover that the less you say, the more you hear."},

{"no": 81, "school": "", "pref": "23", "type": "", "diff": "", "stem": "글에 따르면 과학이 하는 일은?", "p": "23-81", "choices": ["사회의 여러 문제를 직접 해결하는 일", "물리적 세계의 관찰을 모으고 이해하는 일", "사람들의 행동을 직접 바꾸어 주는 일", "지식을 쉬운 말로 널리 알리는 일"], "ans": 2, "exp": "첫 문장에서 과학은 물리적 세계에 대한 관찰을 모으고 이해하는 일에 관심이 있다고 했어요.\n📖 <b>Science is concerned with accumulating and understanding observations of the physical world.</b>\n   과학은 물리적 세계에 대한 관찰을 모으고 이해하는 일에 관심이 있다.", "b": 1, "bb": "Science is concerned with accumulating and understanding observations of the physical world. That understanding alone solves no problems. Individual people have to act on that understanding for it to help solve problems. For instance, science has found that regular exercise can lower your risk of heart disease. Knowing this fact is interesting, but it will do nothing for your personal health unless you act on it and actually exercise. And that’s the hard part. Reading an article about exercise is easy. Getting into an actual routine of regular exercise is harder. In this sense, science really solves no problems at all. Problems are only solved when people take the knowledge provided by science and use it. In fact, many of humanity’s biggest problems are caused by lack of action, and not lack of knowledge."},

{"no": 145, "school": "", "pref": "29", "type": "", "diff": "", "stem": "글에 따르면 전문가의 지식이 지닌 특징은?", "p": "29-145", "choices": ["서로 무관한 사실의 목록에 가깝다", "분야를 가리지 않고 폭넓다", "사실들이 서로 긴밀히 연결되어 있다", "암기한 양이 많을수록 깊어진다"], "ans": 3, "exp": "전문가는 세상에 대해 깊고 풍부하게 서로 연결된 생각을 가진 사람이라고 했습니다.\n📖 Experts in a particular domain are people who have <b>deep, richly interconnected ideas about the world</b>\n   특정 분야의 전문가는 세상에 대해 깊고 풍부하게 연결된 생각을 가진 사람들이다.", "b": 1, "bb": "Studies of experts provide insight into what it means to have deep and flexible understanding. Experts in a particular domain are people who have deep, richly interconnected ideas about the world. They are not just good thinkers or people who are exceptionally smart. Rather, experts having knowledge in a specific domain — such as chess, chemistry, or tennis — and are not generalists. However, experts do not just know “a bunch of facts.” In fact, having expertise in a topic means that knowledge is organized into coherent frameworks, and the expert understands the inter- relationship between facts and can distinguish which ideas are most central. This kind of deep but organized understanding allows for greater flexibility in learning and facilitates application across multiple contexts."},

{"no": 161, "school": "", "pref": "30", "type": "", "diff": "", "stem": "글이 설명하는 '생태학적 오류'란?", "p": "30-161", "choices": ["통계 자료를 일부러 조작하는 것", "함께 나타난다는 이유로 인과를 단정하는 것", "원인을 여러 개로 나누어 보는 것", "결과를 원인보다 먼저 적는 것"], "ans": 2, "exp": "두 가지가 그냥 같이 일어났다는 이유만으로 인과 관계가 있다고 주장하는 것이라고 정의했습니다.\n📖 the ecological fallacy, where an argument claims that there is a <b>causal relationship between two things merely because they occur together</b>\n   두 가지가 함께 나타난다는 이유만으로 둘 사이에 인과 관계가 있다고 주장하는 것이다.", "b": 1, "bb": "It is natural for people to observe happenings and then seek explanations for why those happenings occurred. But sometimes the reasoning is wrong because of one or more misconceptions. One of these is the ecological fallacy, where an argument claims that there is a causal relationship between two things merely because they occur together. For example, in the 1950s it was found that crime rates were the highest in neighborhoods where immigrants were most numerous. Some people used this “co-occurrence” to argue that immigrants were a cause of crime. But a careful analysis of this situation revealed that immigrants were forced to live in neighborhoods where crime rates were already low; they could not afford more expensive housing in safer neighborhoods. Immigrants themselves committed very few of the crimes. Unless you analyze the claim carefully, you would misinterpret the relationship and thereby construct a faulty belief."},

{"no": 177, "school": "", "pref": "31", "type": "", "diff": "", "stem": "원주민들이 서양식 과제에서 성적이 낮은 것에 대해 글이 말하는 것은?", "p": "31-177", "choices": ["그들은 배우려는 뜻이 없었다", "그들이 결코 어리석은 것은 아니다", "그들은 글을 전혀 몰랐다", "그들의 기억력이 약했다"], "ans": 2, "exp": "성적이 낮다는 말 바로 뒤에 '그러나 그들은 결코 어리석지 않다'고 덧붙였습니다.\n📖 <b>But they are hardly stupid</b>\n   그러나 그들은 결코 어리석지 않다.", "b": 1, "bb": "In everyday life, we use (…) to predict where we should pay attention. Different environments create different expectations. This was profoundly illustrated by the scientist Jared Diamond in his book Guns, Germs, and Steel. He describes an adventure wandering through the New Guinea jungle with native New Guineans. He relates that these natives tend to perform poorly at tasks Westerners have been trained to do since childhood. But they are hardly stupid. They can detect the most subtle changes in the jungle, good for following the tracks of a predator or for finding the way back home. They know which insects to leave alone, know where food exists, can build and tear down shelters with ease. Diamond, who had never spent time in such places, has no ability to pay attention to these things. Were he to be tested on such tasks, he also would perform poorly."},

{"no": 209, "school": "", "pref": "33", "type": "", "diff": "", "stem": "인간이 유인원과 코끼리와 공유하는 번식 방식으로 글이 말하는 것은?", "p": "33-209", "choices": ["느긋하게 자라고 적게 낳아 잘 키운다", "빨리 자라고 많이 낳아 빨리 떠나보낸다", "몸집을 작게 유지하고 자주 낳는다", "새끼를 낳은 뒤 거의 돌보지 않는다"], "ans": 1, "exp": "둘째 문장에 그대로 나옵니다. 천천히 성숙하고, 몸이 크게 자라며, 새끼는 적게 낳지만 기르는 데 시간과 힘을 많이 쓴다고 했어요.\n📖 Like apes and elephants, we <b>mature at a leisurely pace, grow large bodies, and have few babies but devote much time and energy to raising them well</b>\n   유인원과 코끼리처럼 우리는 느긋하게 성숙하고 큰 몸으로 자라며 새끼는 적게 낳지만 잘 키우는 데 많은 시간과 힘을 쓴다", "b": 1, "bb": "In most respects, humans are one of a relatively small number of species that evolved a very different strategy of (…). Like apes and elephants, we mature at a leisurely pace, grow large bodies, and have few babies but devote much time and energy to raising them well. This unusual strategy succeeds because while apes and elephants produce fewer babies than mice, a larger percentage of their offspring survive to then reproduce. A house mouse can become a mother when she is just five weeks old, has four to ten pups per litter, and can have a new litter every two months over the course of her approximately twelve-month life. However, the vast majority of her pups die young. In contrast, a chimp or elephant mother does not reproduce until she is at least twelve years old, and she gives birth to only one infant every five or six years over the next thirty or so years. About half of these offspring make it to becoming parents."},

{"no": 240, "school": "", "pref": "34", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "34-240", "choices": ["사건 나열 → 원인 분석 → 통계 제시", "주장 → 반대 사례 → 양보 → 철회", "정의 → 분류 → 비유 → 반론", "하지 않는 일 → 하는 일 → 두 효과 → 전제"], "ans": 4, "exp": "과학자가 하지 않는 일을 먼저 말하고, Instead로 실제 하는 일을 밝힌 뒤, 두 가지 효과를 들고 마지막에 그 바탕에 깔린 가정을 설명합니다.\n📖 <b>When scientists make an important new discovery</b> or experimentally prove some hypothesis, they do not, in general, keep that information to themselves\n   과학자들이 중요한 새 발견을 하거나 어떤 가설을 실험으로 증명할 때, 그들은 보통 그 정보를 자기들만 갖고 있지는 않는다", "b": 1, "bb": "When scientists make an important new discovery or experimentally prove some hypothesis, they do not, in general, keep that information to themselves so that they alone can consider its meaning and derive additional theories from it. Instead, they publish their results and make their data available for inspection. This makes it possible for other scientists to reconsider their data and possibly refute their conclusions. More important, though, it makes it possible for other scientists to use that data to construct new hypotheses and perform new experiments. The assumption is that society as a whole will end up knowing more if information is spread as widely as possible, rather than being limited to a few people. In a strict sense, every scientist (…)."},
{"no": 241, "school": "", "pref": "35", "type": "", "diff": "", "stem": "Bartlett이 실험에서 사람들에게 시킨 일은?", "p": "35-241", "choices": ["다른 나라 민담을 듣고 나중에 떠올리기", "자기 나라 역사책을 베껴 쓰기", "낯선 언어의 단어를 외우기", "그림을 보고 똑같이 그리기"], "ans": 1, "exp": "첫 문장에 나옵니다. 다른 나라의 민담을 들려주고 나중에 그 이야기를 회상하게 했어요.\n📖 asked people to <b>listen to folktales from other countries and then recall these stories at a later date</b>\n   사람들에게 다른 나라의 민담을 듣고 나중에 그 이야기를 떠올려 보게 했다", "b": 1, "bb": "In the 1930s, the British psychologist Sir Frederic Bartlett asked people to listen to folktales from other countries and then recall these stories at a later date. As you might guess, unfamiliar stories were not remembered as well as familiar stories. Surprisingly, however, errors in memory were not random. Rather, subjects often rewrote similar parts of the stories in their own minds — particularly the parts that made the least sense to them. To attract a wide audience, stories should focus on topics that interest many people. Bartlett concluded that when facing problems, humans draw upon mental schemata, or shelves of stored knowledge in our brains, to fill in any minor gaps in our memories. Therefore, remembering is an imaginative process that involves building upon past experiences."},

{"no": 273, "school": "", "pref": "37", "type": "", "diff": "", "stem": "'smart'라고 들은 아이들이 더 쉬운 과제를 고르는 까닭은?", "p": "37-273", "choices": ["똑똑하지 않다는 증거를 피하려고", "어려운 과제가 아직 없었기 때문에", "친구들과 함께 풀고 싶었기 때문에", "선생님이 쉬운 것만 내주었기 때문에"], "ans": 1, "exp": "자기가 똑똑하지 않다는 증거가 나올까 봐 쉬운 과제를 골랐다고 했습니다. Dweck은 이것을 고정 마인드셋이라고 불러요.\n📖 kids who are told they’re “smart” actually underperform in future tasks, by <b>choosing easier tasks to avoid evidence that they are not smart</b>\n   똑똑하다고 들은 아이들은 자신이 똑똑하지 않다는 증거를 피하려고 더 쉬운 과제를 고른다", "b": 1, "bb": "Stanford psychology professor Dr. Carol Dweck is the internationally recognized pioneer of the concept of “growth mindset” as a way to continually grow, learn, and persevere in our efforts. (C) Dweck found that kids who are told they’re “smart” actually underperform in future tasks, by choosing easier tasks to avoid evidence that they are not smart, which Dweck calls having a “fixed mindset.” (B) In contrast, Dweck found, kids who are praised not for their smarts but for their effort develop what Dweck calls a “growth mindset.” They learn that their effort is what led to their success, and if they continue to try, over time they’ll improve and achieve more things. (A) These kids end up taking on tougher things, and feel better about themselves. “Emphasizing effort gives a child a variable that they can control,” Dweck has explained."},

{"no": 276, "school": "", "pref": "37", "type": "", "diff": "", "stem": "글에 따르면 Dweck이 '성장 마인드셋'을 어떤 것으로 보는가?", "p": "37-276", "choices": ["타고난 지능을 측정하는 검사", "경쟁을 줄이는 수업 운영 방식", "칭찬을 아끼는 훈육 원칙", "계속 성장하고 버티게 하는 방법"], "ans": 4, "exp": "첫 문장에서 계속 자라고 배우며 노력을 끈기 있게 이어 가는 '방법'으로 소개했습니다.\n📖 pioneer of the concept of “growth mindset” <b>as a way to continually grow, learn, and persevere in our efforts</b>\n   계속 성장하고 배우며 노력을 끈기 있게 이어 가는 방법으로서의 성장 마인드셋", "b": 1, "bb": "Stanford psychology professor Dr. Carol Dweck is the internationally recognized pioneer of the concept of “growth mindset” as a way to continually grow, learn, and persevere in our efforts. (C) Dweck found that kids who are told they’re “smart” actually underperform in future tasks, by choosing easier tasks to avoid evidence that they are not smart, which Dweck calls having a “fixed mindset.” (B) In contrast, Dweck found, kids who are praised not for their smarts but for their effort develop what Dweck calls a “growth mindset.” They learn that their effort is what led to their success, and if they continue to try, over time they’ll improve and achieve more things. (A) These kids end up taking on tougher things, and feel better about themselves. “Emphasizing effort gives a child a variable that they can control,” Dweck has explained."},

{"no": 288, "school": "", "pref": "37", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "37-288", "choices": ["여러 연구를 연도순으로 나열해 보여 준다", "한 사례를 들어 통계 수치를 반박한다", "문제의 원인을 셋으로 나누어 분석한다", "두 유형을 대조한 뒤 전문가 말로 맺는다"], "ans": 4, "exp": "고정 마인드셋 아이들과 성장 마인드셋 아이들을 'In contrast'로 맞세운 뒤, Dweck의 말을 인용해 끝맺습니다.\n📖 <b>In contrast</b>, Dweck found, kids who are praised not for their smarts but for their effort\n   반대로, 똑똑함이 아니라 노력을 칭찬받은 아이들은", "b": 1, "bb": "Stanford psychology professor Dr. Carol Dweck is the internationally recognized pioneer of the concept of “growth mindset” as a way to continually grow, learn, and persevere in our efforts. (C) Dweck found that kids who are told they’re “smart” actually underperform in future tasks, by choosing easier tasks to avoid evidence that they are not smart, which Dweck calls having a “fixed mindset.” (B) In contrast, Dweck found, kids who are praised not for their smarts but for their effort develop what Dweck calls a “growth mindset.” They learn that their effort is what led to their success, and if they continue to try, over time they’ll improve and achieve more things. (A) These kids end up taking on tougher things, and feel better about themselves. “Emphasizing effort gives a child a variable that they can control,” Dweck has explained."},
{"no": 289, "school": "", "pref": "38", "type": "", "diff": "", "stem": "많은 승객이 지하철 문 가까이 자리를 잡는 분명한 이유는?", "p": "38-289", "choices": ["자리를 먼저 차지할 수 있어서", "더 빨리 내릴 수 있어서", "바람이 들어와 시원해서", "안내 방송이 잘 들려서"], "ans": 2, "exp": "그 이유의 한 부분은 더 빨리 내릴 수 있다는 눈에 보이는 편리함이라고 했습니다.\n📖 Partly this was <b>the obvious convenience of being able to exit more quickly</b>.\n   그것은 부분적으로 더 빨리 나갈 수 있다는 분명한 편리함 때문이었다", "b": 1, "bb": "Partly this was the obvious convenience of being able to exit more quickly. To monitor our surroundings is to focus on what’s outside of ourselves: what we see, hear, smell, feel, and perhaps even taste. But sometimes what really marks a place is something less specific — a feeling within us. An interesting example emerged from a study of subway passenger behavior. Researchers trying to understand why people sit where they sit or stand where they stand in subway and metro trains examined the factors that shape the way riders used and navigated that space in different situations. One of their findings involved the reasons many riders like to plant themselves close to the train’s doors. But it was shaped partly by a more abstract sensation — the desire to avoid the sometimes uncomfortable feeling of accidentally making eye contact with seated passengers. We can’t see feelings — but they’re very real, and they influence our experience of the world."},

{"no": 303, "school": "", "pref": "38", "type": "", "diff": "", "stem": "윗글의 요지로 가장 적절한 것은?", "p": "38-303", "choices": ["장소는 눈에 보이는 것으로만 기억된다", "보이지 않는 느낌도 행동을 크게 바꾼다", "지하철은 가운데 자리가 가장 편안하다", "감각 훈련으로 관찰력을 기를 수 있다"], "ans": 2, "exp": "장소를 정말로 특징짓는 것은 우리 안의 느낌일 수 있고, 그 느낌이 어디에 서는지까지 바꾼다는 것이 글의 핵심입니다.\n📖 But sometimes what really marks a place is something less specific — <b>a feeling within us</b>.\n   어떤 장소를 정말로 특징짓는 것은 우리 안의 느낌일 때도 있다", "b": 1, "bb": "Partly this was the obvious convenience of being able to exit more quickly. To monitor our surroundings is to focus on what’s outside of ourselves: what we see, hear, smell, feel, and perhaps even taste. But sometimes what really marks a place is something less specific — a feeling within us. An interesting example emerged from a study of subway passenger behavior. Researchers trying to understand why people sit where they sit or stand where they stand in subway and metro trains examined the factors that shape the way riders used and navigated that space in different situations. One of their findings involved the reasons many riders like to plant themselves close to the train’s doors. But it was shaped partly by a more abstract sensation — the desire to avoid the sometimes uncomfortable feeling of accidentally making eye contact with seated passengers. We can’t see feelings — but they’re very real, and they influence our experience of the world."},
{"no": 304, "school": "", "pref": "38", "type": "", "diff": "", "stem": "윗글에서 지하철 연구가 하는 역할로 가장 적절한 것은?", "p": "38-304", "choices": ["앞의 주장을 뒤집는 반대 사례다", "연구 방법의 문제점을 지적한다", "글의 결론을 숫자로 요약해 준다", "앞서 말한 생각을 뒷받침하는 예다"], "ans": 4, "exp": "'흥미로운 예가 나왔다'고 말하며 장소를 느낌이 특징짓는다는 앞의 주장을 받쳐 줍니다.\n📖 <b>An interesting example emerged from a study of subway passenger behavior.</b>\n   지하철 승객 행동 연구에서 흥미로운 예가 나왔다", "b": 1, "bb": "Partly this was the obvious convenience of being able to exit more quickly. To monitor our surroundings is to focus on what’s outside of ourselves: what we see, hear, smell, feel, and perhaps even taste. But sometimes what really marks a place is something less specific — a feeling within us. An interesting example emerged from a study of subway passenger behavior. Researchers trying to understand why people sit where they sit or stand where they stand in subway and metro trains examined the factors that shape the way riders used and navigated that space in different situations. One of their findings involved the reasons many riders like to plant themselves close to the train’s doors. But it was shaped partly by a more abstract sensation — the desire to avoid the sometimes uncomfortable feeling of accidentally making eye contact with seated passengers. We can’t see feelings — but they’re very real, and they influence our experience of the world."},
{"no": 305, "school": "", "pref": "39", "type": "", "diff": "", "stem": "글에 따르면 잠수 반사가 켜지는 상황은?", "p": "39-305", "choices": ["얼굴 부위가 물속에 들어갈 때", "몸 전체가 물에 잠겼을 때", "숨을 오래 참고 있을 때", "찬 바람이 얼굴에 닿을 때"], "ans": 1, "exp": "몸은 공기 중에 있고 얼굴만 물에 담갔을 때 반사가 켜진다고 했습니다. 얼굴이 물에 들어가는 것이 열쇠예요.\n📖 But if we sink just our face in a bowl of water, while the whole of the rest of our body is in the dry air, <b>the diving reflex is triggered</b>.\n   몸의 나머지는 공기 중에 둔 채 얼굴만 물에 담그면 잠수 반사가 일어난다", "b": 1, "bb": "But if we sink just our face in a bowl of water, while the whole of the rest of our body is in the dry air, the diving reflex is triggered. We have a ‘diving reflex’, like other marine mammals. This means that special nerve endings on our faces, around the mouth and nose, trigger this reflex only when the facial region goes under water. If we are in the water, with our head out in the air, there is no diving reflex. It automatically closes down the airway, reducing the risk of swallowing water, and it narrows the small air-passages in the lungs. At the same time the heart rate is slowed down to half speed and blood is shunted to the vital organs, protecting them from the effects of the brief stop in breathing. By contrast, if a chimpanzee or a gorilla found itself in water with its face below the surface, it would panic, its heart would race and it would quickly drown."},

{"no": 337, "school": "", "pref": "41-42", "type": "", "diff": "", "stem": "글에 따르면 현금으로 물건을 살 때 일어나는 일은?", "p": "41-42-337", "choices": ["손실감이 전혀 없어진다", "뇌의 통증 반응이 멈춘다", "지갑이 실제로 가벼워진다", "구매가 추상적으로 느껴진다"], "ans": 3, "exp": "현금 구매에는 '실제 손실'이 따른다며, 지갑이 말 그대로 가벼워진다고 했어요.\n📖 When you buy something with cash, the purchase involves an actual loss — <b>your wallet is literally lighter</b>.\n   현금으로 무언가를 살 때 그 구매에는 실제 손실이 따른다 — 지갑이 말 그대로 가벼워진다.", "b": 1, "bb": "Paying with plastic fundamentally changes the way we spend money, altering the calculus of our financial decisions. When you buy something with cash, the purchase involves an actual loss — your wallet is literally lighter. Credit cards, however, make the purchase abstract, so that you don’t really feel the downside of spending money. Brain-imaging experiments suggest that paying with credit cards actually reduces activity in the insula, a brain region associated with negative feelings. As George Loewenstein, a neuroeconomist at Carnegie Mellon, says, “The nature of credit cards ensures that your brain is anesthetized against the pain of payment.” Spending money doesn’t feel bad, so you spend more money. Consider this experiment: Drazen Prelec and Duncan Simester, two business professors at MIT, organized a real-life, sealed-bid auction for tickets to a Boston Celtics game. Half the participants in the auction were informed that they had to pay with cash; the other half were told they had to pay with credit cards. Prelec and Simester then averaged the bids for the two different groups. It turns out that the average credit card bid was twice as high as the average cash bid. When people used their credit cards, their bids were much more careful. They no longer felt the need to limit their expenses."},

{"no": 353, "school": "", "pref": "43-45", "type": "", "diff": "", "stem": "Dana가 버스를 타고 박물관으로 향한 이유는?", "p": "43-45-353", "choices": ["우산을 사러 가려고", "Becky를 만나러 가려고", "일자리 면접을 보러 가려고", "전시를 구경하러 가려고"], "ans": 3, "exp": "둘째 문장에 'for a job interview'라고 나옵니다. 면접을 보러 가는 길이었어요.\n📖 Across town, Dana was riding a bus towards the museum <b>for a job interview</b>.\n   도시 반대편에서 다나는 면접을 보러 박물관으로 가는 버스를 타고 있었다.", "b": 1, "bb": "The sun shone in the cloudless sky as Becky, a retired teacher, walked to the fruit market. Across town, Dana was riding a bus towards the museum for a job interview. Just before reaching her stop, Dana noticed the sky had suddenly darkened. Her heart sank — she had no umbrella. As she stepped off the bus next to the market, where Becky had just finished shopping, raindrops began to fall. (D) Dana felt panic. She didn’t want to show up to her interview soaked. She looked around but couldn’t find any stores nearby to buy an umbrella, and she didn’t have time to search around. Just then, Becky approached her, holding an open umbrella in one hand and a closed one in the other. “Take this,” she said with a smile. Dana’s eyes widened. “Are you sure?” Becky nodded. “I always carry an extra on rainy days.” (B) Dana thanked her, took the umbrella, and opened it. She saw a small card tied to the handle. It read: “Cover each other.” She was touched by the message. She hurried to the museum, arriving dry and comfortable, and performed well in her interview. The Museum CEO was impressed by Dana and offered her the Event Manager position, her dream job. Throughout the years ahead, she often thought back to Becky’s kind gesture.(C) Inspired by the memory, Dana created a museum event called “Cover Each Other” with paintings of people supporting others. She donated half of the money from ticket sales to families who lost their homes to natural disasters. Dana kept Becky’s message framed in her office as a reminder that one kind gesture could change someone’s life. The   if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){

  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고125년6월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
<script src="bn_force.js"></script>
</body>
</html>

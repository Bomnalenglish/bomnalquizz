<script>
// ── DATA ──────────────────────────────────────────
const PASS = {"19-a": "All the actors on the stage were focused on their acting. Then, suddenly, Arthur fell into the corner of the stage. Jeevan immediately approached Arthur and found his heart wasn't beating. Jeevan began CPR. Jeevan worked silently, glancing sometimes at Arthur's face. He thought, \"Please, start breathing again, please.\" Arthur's eyes were closed. Moments later, an older man in a grey suit appeared, swiftly kneeling beside Arthur's chest. \"I'm Walter Jacobi. I'm a doctor.\" He announced with a calm voice. Jeevan wiped the sweat off his forehead. With combined efforts, Jeevan and Dr. Jacobi successfully revived Arthur. Arthur's eyes slowly opened. Finally, Jeevan was able to hear Arthur's breath again, thinking to himself, \"Thank goodness. You're back.\"", "20-a": "As the parent of a gifted child, you need to be aware of a certain common parent trap. Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important to limit your bragging behavior to your very close friends, or your parents. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a driven perfectionist child or perhaps a drop-out, or worse.", "21-a": "One valuable technique for getting out of helplessness, depression, and situations which are predominantly being run by the thought, \"I can't,\" is to choose to be with other persons who have resolved the problem with which we struggle. This is one of the great powers of self-help groups. When we are in a negative state, we have given a lot of energy to negative thought forms, and the positive thought forms are weak. Those who are in a higher vibration are free of the energy from their negative thoughts and have energized positive thought forms. Merely to be in their presence is beneficial. In some self-help groups, this is called \"hanging out with the winners.\" The benefit here is on the psychic level of consciousness, and there is a transfer of positive energy and relighting of one's own latent positive thought forms.\n*latent: 잠재적인", "22-a": "Our emotions are thought to exist because they have contributed to our survival as a species. Fear has helped us avoid dangers, expressing anger helps us scare off threats, and expressing positive emotions helps us bond with others. From an evolutionary perspective, an emotion is a kind of \"program\" that, when triggered, directs many of our activities (including attention, perception, memory, movement, expressions, etc.). For example, fear makes us very attentive, narrows our perceptual focus to threatening stimuli, will cause us either to face a situation (fight) or avoid it (flight), and may cause us to remember an experience more acutely (so that we avoid the threat in the future). Regardless of the specific ways in which they activate our systems, the specific emotions we possess are thought to exist because they have helped us (as a species) survive challenges within our environment long ago. If they had not helped us adapt and survive, they would not have evolved with us.", "23-a": "By improving accessibility of the workplace for workers that are typically at a disadvantage in the labour market, AI can improve inclusiveness in the workplace. AI-powered assistive devices to aid workers with visual, speech or hearing difficulties are becoming more widespread, improving the access to, and the quality of work for people with disabilities. For example, speech recognition solutions for people with dysarthric voices, or live captioning systems for deaf and hard of hearing people can facilitate communication with colleagues and access to jobs where inter-personal communication is necessary. AI can also enhance the capabilities of low-skilled workers, with potentially positive effects on their wages and career prospects. For example, AI's capacity to translate written and spoken word in real-time can improve the performance of non-native speakers in the workplace. Moreover, recent developments in AI-powered text generators can instantly improve the performance of lower-skilled individuals in domains such as writing, coding or customer service.\n*dysarthric: (신경 장애로 인한) 구음 장애의", "24-a": "Whales are highly efficient at carbon storage. When they die, each whale sequesters an average of 30 tons of carbon dioxide, taking that carbon out of the atmosphere for centuries. For comparison, the average tree absorbs only 48 pounds of CO2 a year. From a climate perspective, each whale is the marine equivalent of thousands of trees. Whales also help sequester carbon by fertilizing the ocean as they release nutrient-rich waste, in turn increasing phytoplankton populations, which also sequester carbon — leading some scientists to call them the \"engineers of marine ecosystems.\" In 2019, economists from the International Monetary Fund (IMF) estimated the value of the ecosystem services provided by each whale at over $2 million USD. They called for a new global program of economic incentives to return whale populations to preindustrial whaling levels as one example of a \"nature-based solution\" to climate change. Calls are now being made for a global whale restoration program, to slow down climate change.", "25-a": "※ 25번 도표 문제는 문제에 적힌 수치와 문장을 보고 판단하세요.", "29-a": "From an organizational viewpoint, one of the most fascinating examples of how any organization may contain many different types of culture is to recognize the functional operations of different departments within the organization. The varying departments and divisions within an organization will inevitably view any given situation from their own biased and prejudiced perspective. A department and its members will acquire \"tunnel vision\" which disallows them to see things as others see them. The very structure of organizations can create conflict. The choice of whether the structure is \"mechanistic\" or \"organic\" can have a profound influence on conflict management. A mechanistic structure has a vertical hierarchy with many rules, many procedures, and many levels of management involved in decision making. Organic structures are more horizontal in nature, where decision making is less centralized and spread across the plane of the organization.\n*hierarchy: 위계", "30-a": "An excellent alternative to calming traffic is removing it. Some cities reserve an extensive network of lanes and streets for bikes, pedestrians, and the occasional service vehicle. This motivates people to travel by bike rather than by car, making streets safer for everyone. As bicycles become more popular in a city, planners can convert more automobile lanes and entire streets to accommodate more of them. Nevertheless, even the most bikeable cities still require motor vehicle lanes for taxis, emergency vehicles, and delivery trucks. Delivery vehicles are frequently a target of animus, but they are actually an essential component to making cities greener. A tightly packed delivery truck is a far more efficient transporter of goods than several hybrids carrying a few shopping bags each. Distributing food and other goods to neighborhood vendors allows them to operate smaller stores close to homes so that residents can walk, rather than drive, to get their groceries.\n*animus: 반감, 미움", "31-a": "You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the \"host\" of this movie; he's depicted as one of the most famous non-great composers — he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn't a bad composer; in fact, he was a very good one. But he wasn't one of the world's great composers because his work wasn't original. What he wrote sounded just like what everyone else was composing at the time.", "32-a": "Every time a new medium comes along – whether it's the invention of the printed book, or TV, or SNS – and you start to use it, it's like you are putting on a new kind of goggles, with their own special colors and lenses. Each set of goggles you put on makes you see things differently. So when you start to watch television, before you absorb the message of any particular TV show – whether it's Wheel of Fortune or The Wire – you start to see the world as being shaped like television itself. That's why Marshall McLuhan said that every time a new medium comes along – a new way for humans to communicate – it has buried in it a message. It is gently guiding us to see the world according to a new set of codes. The way information gets to you, McLuhan argued, is more important than the information itself. TV teaches you that the world is fast; that it's about surfaces and appearances.", "33-a": "Concepts are vital to human survival, but we must also be careful with them because concepts open the door to essentialism. They encourage us to see things that aren't present. Stuart Firestein opens his book, Ignorance, with an old proverb, \"It is very difficult to find a black cat in a dark room, especially when there is no cat.\" This statement beautifully sums up the search for essences. History has many examples of scientists who searched fruitlessly for an essence because they used the wrong concept to guide their hypotheses. Firestein gives the example of luminiferous ether, a mysterious substance that was thought to fill the universe so that light would have a medium to move through. The ether was a black cat, writes Firestein, and physicists had been theorizing in a dark room, and then experimenting in it, looking for evidence of a cat that did not exist.", "34-a": "While social media attention is potentially an instrument to achieve ends like elite celebrity, some content creators desire ordinary fame as a social end in itself. Not unlike reality television stars, social media celebrities are often criticized for not having skills and talents associated with traditional, elite celebrity, such as acting or singing ability. This criticism highlights the fact that digital content creators face real barriers to crossing over to the sphere of elite celebrity. However, the criticism also misses the point that the phenomenon of ordinary celebrity reconstructs the meaning of fame. The elite celebrity is symbolized by the metaphor of the star, characterized by mystery and hierarchical distance and associated with naturalized qualities of talent and class. The ordinary celebrity attracts attention through regular and frequent interactions with other ordinary people. Achieving ordinary fame as a social media celebrity is like doing well at a game, because in this sphere, fame is nothing more nor less than relatively high scores on attention scales, the metrics of subscribers, followers, Likes, or clicks built into social media applications.", "35-a": "Why do we have the illusion that cramming for an exam is the best learning strategy? Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form. We feel as if we know it, because it is present in our short-term storage space... but this short-term section has nothing to do with the long-term memory that we will need in order to recall the same information a few days later. After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long-term memory, it is essential to study the material, then test yourself, rather than spend all your time studying.", "36-a": "The discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out theirs. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others.", "37-a": "Have you ever been surprised to hear a recording of your own voice? You might have thought, \"Is that really what my voice sounds like?\" Maybe your accent is more pronounced in the recording than you realized, or your voice is higher than it seems to your own ears. This is of course quite a common experience. The explanation is actually fairly simple. There are two pathways through which we perceive our own voice when we speak. One is the route through which we perceive most external sounds, like waves that travel from the air through the outer, middle and inner ear. But because our vocal cords vibrate when we speak, there is a second internal path. Vibrations are conducted through our bones and stimulate our inner ears directly. Lower frequencies are emphasized along this pathway. That makes your voice sound deeper and richer to yourself than it may sound to other people.\n*vocal cords: 성대 **frequency: 주파수", "38-a": "Biologists distinguish two kinds of similarity. \"Analogous\" traits are ones that have a common function but arose on different branches of the evolutionary tree and are in an important sense not \"the same\" organ. The wings of birds and the wings of bees are both used for flight and are similar in some ways because anything used for flight has to be built in those ways, but they arose independently in evolution and have nothing in common beyond their use in flight. \"Homologous\" traits, in contrast, may or may not have a common function, but they descended from a common ancestor and hence have some common structure that indicates their being \"the same\" organ. The wing of a bat and the front leg of a horse have very different functions, but they are all modifications of the forelimb of the ancestor of all mammals. As a result, they share nonfunctional traits like the number of bones and the ways they are connected. To distinguish analogy from homology, biologists usually look at the overall architecture of the organs and focus on their most useless properties.", "39-a": "Seawater contains an abundance of dissolved oxygen that all marine animals breathe to stay alive. It has long been established in physics that cold water holds more dissolved oxygen than warm water does – this is one reason that cold polar seas are full of life while tropical oceans are blue, clear, and relatively poorly populated with living creatures. Thus, as global warming raises the temperature of marine waters, it is self-evident that the amount of dissolved oxygen will decrease. This is a worrisome and potentially disastrous consequence if allowed to continue to an ecosystem-threatening level. Now scientists have analyzed data indicating that the amount of dissolved oxygen in the oceans has been declining for more than a half century. The data show that the ocean oxygen level has been falling more rapidly than the corresponding rise in water temperature. Falling oxygen levels in water have the potential to impact the habitat of marine organisms worldwide and in recent years this has led to more frequent anoxic events that killed or displaced populations of fish, crabs, and many other organisms.\n*dissolved: 용해된 **anoxic: 산소 결핍의", "40-a": "Capuchins – New World Monkeys that live in large social groups – will, in captivity, trade with people all day long, especially if food is involved. I give you this rock and you give me a treat to eat. If you put two monkeys in cages next to each other, and offer them both slices of cucumber for the rocks they already have, they will happily eat the cucumbers. If, however, you give one monkey grapes instead – grapes being universally preferred to cucumbers – the monkey that is still receiving cucumbers will begin to throw them back at the experimenter. Even though she is still getting \"paid\" the same amount for her effort of sourcing rocks, and so her particular situation has not changed, the comparison to another makes the situation unfair. Furthermore, she is now willing to abandon all gains – the cucumbers themselves – to communicate her displeasure to the experimenter.", "42-a": "Higher education has grown from an elite to a mass system across the world. In Europe and the USA, increased rates of participation occurred in the decades after the Second World War. Between 2000 and 2014, rates of participation in higher education almost doubled from 19% to 34% across the world among the members of the population in the school-leaving age category (typically 18-23). The dramatic expansion of higher education has been marked by a wider range of institutions of higher learning and a more diverse demographic of students. Changes from an elite system to a mass higher education system are associated with political needs to build a specialised workforce for the economy. In theory, the expansion of higher education to develop a highly skilled workforce should diminish the role of examinations in the selection and control of students, initiating approaches to assessment which enable lifelong learning: assessment for learning and a focus on feedback for development. In reality, socio-political changes to expand higher education have set up a 'field of contradictions' for assessment in higher education. Mass higher education requires efficient approaches to assessment, such as examinations and multiple-choice quizzes, with minimalist, impersonal, or standardised feedback, often causing students to focus more on grades than feedback. In contrast, the relatively small numbers of students in elite systems in the past allowed for closer relationships between students and their teachers, with formative feedback shaping the minds, academic skills, and even the characters of students.", "45-a": "Once upon a time in the Iranian city of Shiraz, there lived the famous poet Sheikh Saadi. Like most other poets and philosophers, he led a very simple life. A rich merchant of Shiraz was preparing for his daughter's wedding and invited him along with a lot of big businessmen of the town. The poet accepted the invitation and decided to attend.\n\nOn the day of the wedding, the rich merchant, the host of the wedding, was receiving the guests at the gate. Many rich people of the town attended the wedding. They had come out in their best clothes. The poet wore simple clothes which were neither grand nor expensive. He waited for someone to approach him but no one gave him as much as even a second glance. Even the host did not greet him and looked away.\n\nSeeing all this, the poet quietly left the party and went to a shop where he could rent clothes. There he chose a richly decorated coat, which made him look like a new person. With this coat, he entered the party and this time was welcomed with open arms. The host embraced him as he would do to an old friend and complimented him on the clothes he was wearing.\n\nThe poet did not say a word and allowed the host to lead him to the dining room. The host personally led the poet to his seat and served out chicken soup to him. After a moment, the poet suddenly dipped the corner of his coat in the soup as if he fed it. All the guests were now staring at him in surprise. The host said, \"Sir, what are you doing?\" The poet very calmly replied, \"Now that I have put on expensive clothes, I see a world of difference here. All that I can say now is that this feast is meant for my clothes, not for me.\""};

{"no": 3, "school": "인일여고 (인천시)", "pref": "20", "type": "빈칸", "stem": "다음 빈칸 'It is extremely important to ___ to your very close friends, or your parents.'에 들어갈 말로 가장 적절한 것은?", "p": "20-a", "choices": ["limit your bragging behavior", "show your belief in your child", "talk about how well your child does", "keep your child's weakness a secret", "give information on the way to study"], "ans": 1, "exp": "부모는 영재 자녀에 대한 자랑을 절제해야 한다는 내용이므로 '자랑하는 행동을 제한하다'가 적절하다.", "b": 1, "bb": "As the parent of a gifted child, you need to be aware of a certain common parent trap. Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important to __________ to your very close friends, or your parents. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a driven perfectionist child or perhaps a drop-out, or worse."},

{"no": 12, "school": "신송고 (인천시)", "pref": "20", "type": "빈칸", "stem": "다음 빈칸 'If not, you could end up with a(n) ___.'에 들어갈 말로 가장 적절한 것은?", "p": "20-a", "choices": ["self-made success", "highly-esteemed person", "voluntary perfectionist child", "immediate drop-out at school", "wrongfully self-evaluated child"], "ans": 5, "exp": "부모의 과시가 아이에게 거짓된 자아감(a false sense of self)을 만든다고 했으므로 '잘못된 자아 인식을 가진 아이'가 적절하다.", "b": 4, "bb": "As the parent of a gifted child, you need to be aware of a certain common parent trap. Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important to limit your bragging behavior to your very close friends, or your parents. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a(n) __________."},
{"no": 13, "school": "경희고 (서울시)", "pref": "20", "type": "빈칸", "stem": "다음 빈칸 'It is extremely important not to ___.'에 들어갈 말로 가장 적절한 것은?", "p": "20-a", "choices": ["limit how much you show off your child", "overwhelm the child with excessive praise", "support them in whatever they want to achieve", "suggest only easily reachable goals for your child", "avoid your intervention in how your child performs"], "ans": 2, "exp": "뒤 문장에서 자녀를 지나치게 자랑하는 것(show them off too much)이 문제로 지적되므로 '과도한 칭찬으로 압도하다'가 적절하다.", "b": 4, "bb": "As the parent of a gifted child, you need to be aware of a certain common parent trap. Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important not to __________. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a driven perfectionist child or perhaps a drop-out, or worse."},
{"no": 14, "school": "고색고 (수원시)", "pref": "20", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "20-a", "choices": ["Keep It Minimum: Showing off How Talented Your Child Is", "Parents' Bragging Sometimes Benefits Children's Development", "An Effective Way to Figure Out Whether Your Child Is Gifted", "Frequent Praise from Parents Enhances Children's Self-Esteem", "Not Giving Too Much Pressure on Your Child with Indifference"], "ans": 1, "exp": "자녀의 재능을 과시하는 것이 아이에게 해로울 수 있으니 자랑을 최소화하라는 글이다.", "b": 5},
{"no": 15, "school": "상록고 (안산시)", "pref": "20", "type": "빈칸", "stem": "다음 빈칸 'It is extremely important to ___.'에 들어갈 말로 가장 적절한 것은?", "p": "20-a", "choices": ["show off your child to others as much as possible", "share every detail of your child's success and failure", "constantly highlight your child's incredible accomplishments", "be mindful of how much you discuss your child's achievements", "take pride in discussing your parenting skills and discipline techniques"], "ans": 4, "exp": "자녀의 성취를 자랑하는 정도에 주의하라는 것이 글의 핵심이다.", "b": 5, "bb": "As the parent of a gifted child, you need to be aware of a certain common parent trap. Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important to __________. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a driven perfectionist child or perhaps a drop-out, or worse."},
{"no": 16, "school": "한영고 (서울시)", "pref": "21", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] This is one of the great powers of self-help groups.", "p": "21-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 1, "exp": "문제를 해결한 사람들과 함께하라는 첫 문장 바로 뒤에서, 그것이 자조 모임의 큰 힘이라고 이어져야 한다.", "b": 1, "bb": "One valuable technique for getting out of helplessness, depression, and situations which are predominantly being run by the thought, \"I can't,\" is to choose to be with other persons who have resolved the problem with which we struggle. ( ① ) When we are in a negative state, we have given a lot of energy to negative thought forms, and the positive thought forms are weak. ( ② ) Those who are in a higher vibration are free of the energy from their negative thoughts and have energized positive thought forms. ( ③ ) Merely to be in their presence is beneficial. ( ④ ) In some self-help groups, this is called \"hanging out with the winners.\" ( ⑤ ) The benefit here is on the psychic level of consciousness, and there is a transfer of positive energy and relighting of one's own latent positive thought forms."},

{"no": 32, "school": "상록고 (안산시)", "pref": "21", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "21-a", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 3, "exp": "ⓒ full → free: 높은 진동 상태의 사람들은 부정적 생각의 에너지에서 자유롭다.", "b": 5, "bb": "[학교 변형 지문]\nOne valuable technique for getting out of helplessness, depression, and situations which are predominantly being run by the thought, \"I can't,\" is to choose to be with other persons who have ⓐaddressed the problem with which we struggle. This is one of the great powers of self-help groups. When we are in a negative state, we have given a lot of energy to negative thought forms, and the positive thought forms are ⓑpowerless. Those who are in a higher vibration are ⓒfull of the energy from their negative thoughts and have energized positive thought forms. Merely to be in their presence is ⓓhelpful. In some self-help groups, this is called \"hanging out with the winners.\" The benefit here is on the psychic level of consciousness, and there is a transfer of positive energy and ⓔrestarting of one's own latent positive thought forms."},
{"no": 33, "school": "한국교원대부설고 (청주시)", "pref": "22", "type": "지칭", "stem": "다음 글의 밑줄 친 부분 중 문맥상 다른 넷과 성격이 다른 하나는?", "p": "22-a", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 5, "exp": "ⓔ our environment는 생존의 배경인 환경을 가리키며, 나머지와 성격이 다르다(정답표 기준).", "b": 1, "bb": "[학교 변형 지문]\nOur emotions are thought to exist because they have contributed to our survival as ⓐa species. Fear has helped us avoid dangers, expressing anger helps us scare off threats, and expressing positive emotions helps us bond with others. From an evolutionary perspective, ⓑan emotion is a kind of \"program\" that, when triggered, directs many of our activities (including attention, perception, memory, movement, expressions, etc.). For example, ⓒfear makes us very attentive, narrows our perceptual focus to threatening stimuli, will cause us either to face a situation (fight) or avoid it (flight), and may cause us to remember an experience more acutely (so that we avoid the threat in the future). Regardless of the specific ways in which they activate our systems, the specific emotions we possess are thought to exist because ⓓthey have helped us (as a species) survive challenges within ⓔour environment long ago. If they had not helped us adapt and survive, they would not have evolved with us."},

{"no": 100, "school": "학익여고 (인천시)", "pref": "24", "type": "내용불일치", "stem": "다음 글의 내용과 일치하지 않는 것은? (학교 지문: Whales are some of the largest and longest living animals on earth. This allows them to store greater quantities of carbon in their bodies for longer than smaller animals. Whales efficiently digest and store large quantities of carbon-rich prey and exhale very little carbon dioxide back into the atmosphere. This process allows whales to store more carbon in their bodies than trees. After whales die, their dead bodies often sink to the seafloor (called a \"whale fall\"), trapping the carbon stored in their bodies at the bottom of the ocean. Whale falls can sequester carbon for hundreds to thousands of years. Many deep-sea organisms have evolved to rely on nutrients from sinking dead bodies. Dead bodies of whales are responsible for a large portion of those nutrients due to their massive size. As the dead bodies of whales decompose and are eaten by deep sea animals, that carbon is sequestered in sediment and cycled through the deep-sea ecosystem. This prevents it from returning to the atmosphere as carbon dioxide.)", "p": "24-a", "choices": ["고래는 크고 오래 사는 특성 덕분에 작은 동물들 보다 더 많은 양의 탄소를 더 오랫동안 체내에 저장할 수 있다.", "고래는 나무보다 더 많은 탄소를 체내에 저장할 수 있다.", "죽은 고래는 탄소를 저장한 채 해저로 가라앉아 수백에서 수천 년 동안 탄소를 격리할 수 있다.", "고래 시체는 그 거대한 크기 덕에 심해 생물들에게 상당한 영향분을 제공한다.", "고래 시체 분해 과정에서 탄소가 이산화탄소 형태로 대기 중으로 돌아가게 된다."], "ans": 5, "exp": "고래 시체의 탄소는 퇴적물에 격리되어 대기로 돌아가는 것이 방지되므로 ⑤는 일치하지 않는다.", "b": 3},

{"no": 116, "school": "호산고 (대구시)", "pref": "29", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "29-a", "choices": ["ⓐ varying", "ⓑ unbiased", "ⓒ disallows", "ⓓ profound", "ⓔ horizontal"], "ans": 2, "exp": "ⓑ unbiased → biased: 각 부서는 편향되고 치우친 관점으로 상황을 본다.", "b": 1, "bb": "[학교 변형 지문]\nFrom an organizational viewpoint, one of the most fascinating examples of how any organization may contain many different types of culture is to recognize the functional operations of different departments within the organization. The ⓐvarying departments and divisions within an organization will inevitably view any given situation from their own ⓑunbiased and prejudiced perspective. A department and its members will acquire \"tunnel vision\" which ⓒdisallows them to see things as others see them. The very structure of organizations can create conflict. The choice of whether the structure is \"mechanistic\" or \"organic\" can have a ⓓprofound influence on conflict management. A mechanistic structure has a vertical hierarchy with many rules, many procedures, and many levels of management involved in decision making. Organic structures are more ⓔhorizontal in nature, where decision making is less centralized and spread across the plane of the organization."},

{"no": 130, "school": "학익여고 (인천시)", "pref": "29", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (부서들은 편향된 관점으로 상황을 보아 부서 간 오해와 충돌이 생긴다는 내용 뒤: ① 조직 구조가 갈등을 만들 수 있고 기계적/유기적 구조의 선택이 갈등 관리에 영향을 줌 ② 기계적 구조는 여러 관리 계층, 많은 규칙과 절차를 갖춤 ③ 'This structure, typically found in large-scale manufacturing companies and bureaucratic government agencies, prioritizes stability over change and fosters a uniform culture.' ④ 'Some argue that personal relationships outside of work have a greater impact on conflict than the organizational structure itself.' ⑤ 반면 유기적 구조는 더 평평한 위계와 분산된 의사결정 구조를 가짐)", "p": "29-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "④는 업무 외 개인적 관계가 갈등에 더 큰 영향을 준다는 내용으로, 조직 구조와 갈등이라는 흐름과 어긋난다.", "b": 4, "bb": "[학교 변형 지문]\nThe varying departments and divisions within an organization will inevitably view any given situation from their own biased and prejudiced perspective. This often results in misunderstandings and clashes between departments with conflicting objectives. ⓐAn organization's structure can create conflict, and choosing \"mechanistic\" or \"organic\" affects how it's managed. ⓑA mechanistic structure has a hierarchical setup with multiple layers of management, extensive rules, and numerous procedures guiding decision-making. ⓒThis structure, typically found in large-scale manufacturing companies and bureaucratic government agencies, prioritizes stability over change and fosters a uniform culture. ⓓSome argue that personal relationships outside of work have a greater impact on conflict than the organizational structure itself. ⓔIn contrast, a more flexible structure like an organic structure has a flatter hierarchy, with decision-making decentralized and distributed across the organization."},
{"no": 131, "school": "금천고 (청주시)", "pref": "29", "type": "어휘", "stem": "다음 글에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "29-a", "choices": ["ⓐ functional", "ⓑ prejudiced", "ⓒ permits", "ⓓ concentrated", "ⓔ distributed"], "ans": 3, "exp": "ⓒ permits → prevents(disallows): tunnel vision은 다른 사람처럼 보지 못하게 한다.", "b": 4, "bb": "[학교 변형 지문]\nFrom an organizational viewpoint, one of the most fascinating examples of how any organization may contain many different types of culture is to recognize the ⓐ functional operations of different departments within the organization. The varying departments and divisions within an organization will be inevitably ⓑprejudiced by viewing any given situation from their own perspective. A department and its members will acquire \"tunnel vision\" which ⓒpermits them to see things as others see them. The very structure of organizations can create conflict. The choice of whether the structure is \"mechanistic\" or \"organic\" can have a profound influence on conflict management. A mechanistic structure has a more ⓓ concentrated hierarchy with many rules, many procedures, and many vertical levels of management involved in decision making. Organic structures are more horizontal in nature, where decision making is ⓔdistributed across the plane of the organization."},
{"no": 132, "school": "주성고 (청주시)", "pref": "29", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (부서들은 편향된 관점으로 상황을 본다는 내용 뒤: ① 'As a result, a department and its members must require \"tunnel vision\" and have a more general understanding by blocking out everything around them.' ② 한편 조직 구조 자체가 갈등을 만들 수 있음 ③ 기계적/유기적 구조의 선택이 갈등 관리에 큰 영향을 줌 ④ 기계적 구조는 수직적 위계와 많은 규칙·절차·관리 단계를 가짐 ⑤ 유기적 구조는 수평적이며 의사결정이 덜 중앙집중적임)", "p": "29-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 1, "exp": "①은 tunnel vision을 갖춰야 한다고 하여, 편향된 시각이 문제라는 글의 흐름과 맞지 않는다.", "b": 4, "bb": "[학교 변형 지문]\nFrom an organizational viewpoint, one of the most fascinating examples of how any organization may contain many different types of culture is to recognize the functional operations of different departments within the organization. The varying departments and divisions within an organization will inevitably view any given situation from their own biased and prejudiced perspective. ⓐAs a result, a department and its members must require \"tunnel vision\" and have a more general understanding by blocking out everything around them. ⓑMeanwhile, the very structure of organizations can create conflict. ⓒThe choice of whether the structure is \"mechanistic\" or \"organic\" can have a profound influence on conflict management. ⓓA mechanistic structure has a vertical hierarchy with many rules, many procedures, and many levels of management involved in decision making. ⓔ Organic structures are more horizontal in nature, where decision making is less centralized and spread across the plane of the organization."},

{"no": 143, "school": "세광고 (청주시)", "pref": "30", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] Nevertheless, even the most bikeable cities still require motor vehicle lanes for taxis, emergency vehicles, and delivery trucks.", "p": "30-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 3, "exp": "자전거 차선 확대 내용 뒤에 '그럼에도 자동차 차선은 필요하다'가 오고, 이어서 배달 차량에 대한 설명이 와야 한다.", "b": 1, "bb": "An excellent alternative to calming traffic is removing it. Some cities reserve an extensive network of lanes and streets for bikes, pedestrians, and the occasional service vehicle. ( ① ) This motivates people to travel by bike rather than by car, making streets safer for everyone. ( ② ) As bicycles become more popular in a city, planners can convert more automobile lanes and entire streets to accommodate more of them. ( ③ ) Delivery vehicles are frequently a target of animus, but they are actually an essential component to making cities greener. ( ④ ) A tightly packed delivery truck is a far more efficient transporter of goods than several hybrids carrying a few shopping bags each. ( ⑤ ) Distributing food and other goods to neighborhood vendors allows them to operate smaller stores close to homes so that residents can walk, rather than drive, to get their groceries."},
{"no": 144, "school": "연송고 (인천시)", "pref": "30", "type": "요약", "stem": "요약 - 'According to the passage, (A)___ lanes and streets for bikes, pedestrians, and the occasional service vehicle makes streets safer for everyone while motor vehicle lanes are also required in order for cities to be more (B)___.'", "p": "30-a", "choices": ["(A) reserving — (B) inactive", "(A) reserving — (B) wealthy", "(A) removing — (B) convenient", "(A) removing — (B) sustainable", "(A) retaining — (B) eco-friendly"], "ans": 5, "exp": "자전거·보행자용 차선을 유지하면(retaining) 거리가 안전해지고, 배달 차량용 차선은 도시를 친환경적으로(eco-friendly) 만드는 데 필요하다.", "b": 1},

{"no": 183, "school": "대성고 (청주시)", "pref": "31", "type": "빈칸", "stem": "다음 빈칸 'Effective composers ___.'에 들어갈 말로 가장 적절한 것은?", "p": "31-a", "choices": ["pursue the easiest route", "strive solely for competition", "hold an independent viewpoint", "try to be famous by any means", "write as many songs as they can"], "ans": 3, "exp": "위대한 작곡가는 자신만의 아이디어를 가진다는 흐름이므로 '독자적인 관점을 지니다'가 적절하다.", "b": 4, "bb": "You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers __________. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the \"host\" of this movie; he's depicted as one of the most famous non-great composers — he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn't a bad composer; in fact, he was a very good one. But he wasn't one of the world's great composers because his work wasn't original. What he wrote sounded just like what everyone else was composing at the time."},

{"no": 190, "school": "백양고 (부산시)", "pref": "31", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "31-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 4, "exp": "낯섦의 이유인 새로운 음악 형식(C) → 영화 Amadeus의 Salieri 소개(A) → Salieri가 독창적이지 않아 위대하지 않았다는 설명(B) 순이다.", "b": 5, "bb": "You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day.\n\n(A) Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the \"host\" of this movie; he's depicted as one of the most famous non-great composers — he lived at the time of Mozart and was completely overshadowed by him.\n\n(B) Now, Salieri wasn't a bad composer; in fact, he was a very good one. But he wasn't one of the world's great composers because his work wasn't original. What he wrote sounded just like what everyone else was composing at the time.\n\n(C) The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas."},

{"no": 199, "school": "신흥고 (청주시)", "pref": "32", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중 어법상 어색한 것은?", "p": "32-a", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 5, "exp": "ⓔ that → what: 선행사가 없고 뒤에 주어가 빠진 불완전한 절이 오므로 what이 필요하다.", "b": 2, "bb": "[학교 변형 지문]\nEvery time a new medium comes along and you start to use it, it's like you are putting on a new kind of goggles, with their own special colors and lenses. It doesn't matter ⓐwhether it's the invention of the printed book, or TV, or SNS. Each set of goggles you put on ⓑmakes you see things differently. So when you start to watch television, before you absorb the message of any particular TV show, you get used ⓒto seeing the world as being shaped like television itself. That's why Marshall McLuhan said that every time a new medium comes along - a new way for humans to communicate - it has buried in ⓓit a message. It is gently guiding us to see the world according to a new set of codes. McLuhan argued ⓔthat is important is the way information gets to you than the information itself. TV teaches you that the world is fast; that it's about surfaces and appearances."},
{"no": 200, "school": "대성고 (청주시)", "pref": "32", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관련이 없는 문장은? (① 새 매체를 쓰는 것은 새로운 고글을 쓰는 것과 같다 ② 'This illustrates why it is essential to educate children and adolescents on selecting suitable TV programs.' ③ 고글마다 사물을 다르게 보게 한다 ④ 맥루한: 새 매체에는 메시지가 숨어 있다 ⑤ 그 메시지는 새로운 코드에 따라 세상을 보도록 이끈다)", "p": "32-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "매체가 세상을 인식하는 방식을 바꾼다는 흐름에서 TV 프로그램 선택 교육을 말하는 ②는 무관하다.", "b": 3, "bb": "[학교 변형 지문]\nⓐEvery time a new medium comes along – whether it's the invention of the printed book, or TV, or SNS – and you start to use it, it's like you are putting on a new kind of goggles, with their own special colors and lenses. ⓑThis illustrates why it is essential to educate children and adolescents on selecting suitable TV programs. ⓒEach set of goggles you put on makes you see things differently. So when you start to watch television, before you absorb the message of any particular TV show – whether it's Wheel of Fortune or The Wire – you start to see the world as being shaped like television itself. ⓓThat's why Marshall McLuhan said that every time a new medium comes along – a new way for humans to communicate – it has buried in it a message. ⓔIt is gently guiding us to see the world according to a new set of codes. The way information gets to you, McLuhan argued, is more important than the information itself. TV teaches you that the world is fast: that it's about surfaces and appearances."},

{"no": 241, "school": "초은고 (인천시)", "pref": "34", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] The ordinary celebrity attracts attention through regular and frequent interactions with other ordinary people.", "p": "34-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 5, "exp": "엘리트 유명인의 특성(별의 은유)을 설명한 뒤 대조적으로 평범한 유명인의 특성이 나오고, 이어서 평범한 명성을 게임에 비유하는 문장이 와야 한다.", "b": 1, "bb": "While social media attention is potentially an instrument to achieve ends like elite celebrity, some content creators desire ordinary fame as a social end in itself. ( ① ) Not unlike reality television stars, social media celebrities are often criticized for not having skills and talents associated with traditional, elite celebrity, such as acting or singing ability. ( ② ) This criticism highlights the fact that digital content creators face real barriers to crossing over to the sphere of elite celebrity. ( ③ ) However, the criticism also misses the point that the phenomenon of ordinary celebrity reconstructs the meaning of fame. ( ④ ) The elite celebrity is symbolized by the metaphor of the star, characterized by mystery and hierarchical distance and associated with naturalized qualities of talent and class. ( ⑤ ) Achieving ordinary fame as a social media celebrity is like doing well at a game, because in this sphere, fame is nothing more nor less than relatively high scores on attention scales, the metrics of subscribers, followers, Likes, or clicks built into social media applications."},
{"no": 242, "school": "고잔고 (인천시)", "pref": "34", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "34-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 5, "exp": "비판이 드러내는 장벽과 명성의 의미 재구성(C) → 엘리트 유명인과 평범한 유명인의 대조(B) → 평범한 명성을 게임에 비유(A)의 순서이다.", "b": 1, "bb": "While social media attention is potentially an instrument to achieve ends like elite celebrity, some content creators desire ordinary fame as a social end in itself.\n\n(A) The ordinary celebrity attracts attention through regular and frequent interactions with other ordinary people. Achieving ordinary fame as a social media celebrity is like doing well at a game, because in this sphere, fame is nothing more nor less than relatively high scores on attention scales, the metrics of subscribers, followers, Likes, or clicks built into social media applications.\n\n(B) However, the criticism also misses the point that the phenomenon of ordinary celebrity reconstructs the meaning of fame. The elite celebrity is symbolized by the metaphor of the star, characterized by mystery and hierarchical distance and associated with naturalized qualities of talent and class.\n\n(C) Not unlike reality television stars, social media celebrities are often criticized for not having skills and talents associated with traditional, elite celebrity, such as acting or singing ability. This criticism highlights the fact that digital content creators face real barriers to crossing over to the sphere of elite celebrity."},

{"no": 277, "school": "주성고 (청주시)", "pref": "35", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "35-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 4, "exp": "(C) 공부 직후 정보가 작업 기억에 있음 → (A) 그래서 안다고 느끼지만 장기 기억과 무관 → (B) 작업 기억은 곧 사라짐 순서가 자연스럽다.", "b": 2, "bb": "Why do we have the illusion that cramming for an exam is the best learning strategy?\n\n(A) We feel as if we know it, because it is present in our short-term storage space... but this short-term section has nothing to do with the long-term memory that we will need in order to recall the same information a few days later.\n\n(B) After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long-term memory, it is essential to study the material, then test yourself, rather than spend all your time studying.\n\n(C) Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form."},

{"no": 279, "school": "청주여고 (청주시)", "pref": "35", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "35-a", "choices": ["ⓐ occupies", "ⓑ fading", "ⓒ transfer", "ⓓ revisit", "ⓔ stopped"], "ans": 5, "exp": "ⓔ stopped → started(continued): 망각이 작용하기 시작한 시점에 카드가 다시 나타나야 한다.", "b": 2, "bb": "[학교 변형 지문]\nWhy do we have the illusion that cramming for an exam is the best learning strategy? Because we are unable to differentiate between the various sections of our memory. Immediately after reading our text book or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form. We feel as if we know it, because it ⓐoccupies our short-term storage space … but this short-term sections has nothing to do with the long-term memory that we will need in order to recall the same information a few days later. After a few seconds of minutes, working memory already starts ⓑfading, and after a few days, the effect becomes enormous: unless you reset your knowledge, memory vanishes. To ⓒtransfer information into long-term memory, it is essential to study the material, then test yourself, rather than spend all your time studying. It's easy to put these ideas into practice on your own. All you have to do is prepare flash cards: on one side, you write a question, and on the other, the answer. To test yourself, draw the cards one after the other, and for each card, try to remember the answer (prediction) before checking it by turning to the other side (error feedback). If you get the wrong answer, put the card back toward the top of the pile – this will force you to ⓓrevisit the same information soon. If you get the right answer, put the card at the bottom of the pile: there is no immediate need to study it again, but it will reappear sooner or later, at a time when forgetting will have ⓔstopped taking effect."},

{"no": 282, "school": "군산동고 (군산시)", "pref": "35", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "35-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 5, "exp": "(C) 단기 기억은 장기 기억과 무관 → (B) 작업 기억은 곧 사라짐 → (A) 장기 기억에 넣으려면 스스로 시험해야 함.", "b": 3, "bb": "Why do we have the illusion that cramming for an exam is the best learning strategy?\n\n(A) After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long-term memory, it is essential to study the material, then test yourself, rather than spend all your time studying.\n\n(B) We feel as if we know it, because it is present in our short-term storage space... but this short-term section has nothing to do with the long-term memory that we will need in order to recall the same information a few days later.\n\n(C) Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form."},

{"no": 288, "school": "고촌고 (김포시)", "pref": "35", "type": "빈칸", "stem": "다음 빈칸 'To get information into long-term memory, ___.'에 들어갈 말로 가장 적절한 것은?", "p": "35-a", "choices": ["you should start reviewing the materials a few days after learning it", "it's vital to study and self-test, rather than solely focusing on studying", "you need to read the same material over and over again until you memorize it", "it's important to make the best use of your working memory and short-term storage space", "it's necessary to find appropriate learning strategy that best fits you and helps increase memory limit"], "ans": 2, "exp": "재시험하지 않으면 기억이 사라지므로, 장기 기억을 위해서는 공부 후 자기 테스트가 필수적이다.", "b": 5, "bb": "Why do we have the illusion that cramming for an exam is the best learning strategy? Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form. We feel as if we know it, because it is present in our short-term storage space... but this short-term section has nothing to do with the long-term memory that we will need in order to recall the same information a few days later. After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long-term memory, __________."},
{"no": 289, "school": "연송고 (인천시)", "pref": "36", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "36-a", "choices": ["ⓐ watching", "ⓑ imperfect", "ⓒ fewer", "ⓓ copying", "ⓔ restricted"], "ans": 3, "exp": "ⓒ fewer → more(many): 여러 번 반복할수록 아기가 혀를 더 자주 내민다는 문맥이다.", "b": 1, "bb": "[학교 변형 지문]\nThe discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by ⓐ watching what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick our theirs. Such imitation is ⓑimperfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it ⓒfewer times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers ⓓ copying their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because we are not ⓔrestricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others."},
{"no": 290, "school": "칠보고 (수원시)", "pref": "36", "type": "어휘", "stem": "다음 글을 읽고 두 사람이 나눈 대화에서 밑줄 친 ⓐ~ⓔ 중 문맥상 적절하지 않은 것은?", "p": "36-a", "choices": ["ⓐ watching", "ⓑ less likely", "ⓒ mimicking", "ⓓ observation", "ⓔ limited"], "ans": 2, "exp": "ⓑ less likely → likely: 본문에서 생후 첫 주의 신생아도 부모가 혀를 내밀면 따라 내미는 타고난 경향이 있다고 했으므로, 아기가 따라 할 가능성이 '더 낮다(less likely)'는 말은 글의 내용과 맞지 않다.", "b": 1, "bb": "[학교 변형 지문]\nThe discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out theirs. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others.\n\n[두 사람의 대화]\nA: Have you heard how mirror neurons changed our understanding of learning by observation?\nB: Yeah, I know. It's amazing how we learn so much just by ⓐwatching others, especially as kids.\nA: Exactly! Even newborns imitate. If a parent sticks out their tongue, the baby is ⓑless likely to copy it perfectly every time.\nB: Oh, I've heard about that! It's so cool how even that early on, babies are already learning by ⓒmimicking.\nA: And it continues as they grow, babbling, imitating sounds, and actions like pretending to vacuum or hammer.\nB: True. Our whole culture, from talking to building spaceships, relies on learning by ⓓobservation.\nA: Exactly! We're not ⓔlimited to trial and error; we advance by watching others."},
{"no": 291, "school": "옥련여고 (인천시)", "pref": "36", "type": "빈칸", "stem": "다음 빈칸 'Our modern cultures, where we engage in activities like writing, speaking, reading, constructing spaceships, and attending school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can ___.'에 들어갈 말로 가장 적절한 것은?", "p": "36-a", "choices": ["learn a lot by observing and imitating others", "combine experience and reason or rationality", "construct language skills through social interactions", "tap into different learning methods for critical thinking", "acquire knowledge through complex cognitive processes"], "ans": 1, "exp": "글은 타인을 관찰하고 모방하며 배우는 과정을 설명하므로 'learn a lot by observing and imitating others'가 적절하다.", "b": 1, "bb": "The discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out theirs. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can __________."},
{"no": 292, "school": "봉명고 (청주시)", "pref": "36", "type": "요약", "stem": "요약 - 'The discovery of mirror neurons reshaped our understanding of learning through (A)___. From a young age, we learn by (B)___ our parents and peers, and this ability improves with repetition. This form of learning enables us to develop complex cultures and skills.'", "p": "36-a", "choices": ["(A) imagination — (B) manipulating", "(A) communication — (B) navigating", "(A) observation — (B) imitating", "(A) exploration — (B) integrating", "(A) celebration — (B) collaborating"], "ans": 3, "exp": "거울 뉴런의 발견은 관찰(observation)을 통한 학습에 대한 이해를 바꾸었고, 우리는 부모와 또래를 모방(imitating)하며 배운다.", "b": 1},
{"no": 293, "school": "불당고 (천안시)", "pref": "36", "type": "빈칸", "stem": "다음 빈칸 'Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because ___.'에 들어갈 말로 가장 적절한 것은?", "p": "36-a", "choices": ["we are not restricted to the behavior we observe and learn by attending school", "children live their own lives even though adults show them how to live theirs", "we are capable of learning through observation and imitation", "we have common sense most people accept and share in the society", "every part of our society works independently and organically at the same time"], "ans": 3, "exp": "현대 문화는 우리가 관찰과 모방을 통해 배울 수 있기 때문에 작동한다는 흐름이다.", "b": 1, "bb": "The discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out theirs. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because __________. We can learn a lot by simply watching others."},

{"no": 295, "school": "청주여고 (청주시)", "pref": "36", "type": "예시", "stem": "다음 글의 주제와 관련 있는 예시끼리 짝지어진 것은?", "p": "36-a", "choices": ["ⓐ, ⓑ", "ⓐ, ⓒ", "ⓑ, ⓓ", "ⓒ, ⓔ", "ⓓ, ⓔ"], "ans": 2, "exp": "관찰을 통한 학습이 주제이므로 숙련자를 따라 하는 ⓐ와 경험자를 모방하는 ⓒ가 해당한다.", "b": 2, "bb": "[학교 변형 지문]\nThe discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out theirs. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others. ⓐ Novice builders quickly develop their abilities by shadowing more skilled workers. ⓑ Young athletes improve their skills by relying on inborn abilities. ⓒ In Stone Age, people learned to make blades by copying what a more experienced person did. ⓓ An individual develops effective stress management techniques by reflecting on personal experiences and challenges. ⓔ Scientists discovery new principles by conducting experiments and analyzing the results."},

{"no": 312, "school": "동신여고 (광주시)", "pref": "37", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] But because our vocal cords vibrate when we speak, there is a second internal path.", "p": "37-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 5, "exp": "첫 번째 경로(외부 경로)를 설명한 뒤 두 번째 내부 경로를 소개하고, 이어서 뼈를 통한 진동 전달을 설명해야 한다.", "b": 1, "bb": "Have you ever been surprised to hear a recording of your own voice? You might have thought, \"Is that really what my voice sounds like?\" Maybe your accent is more pronounced in the recording than you realized, or your voice is higher than it seems to your own ears. ( ① ) This is of course quite a common experience. ( ② ) The explanation is actually fairly simple. ( ③ ) There are two pathways through which we perceive our own voice when we speak. ( ④ ) One is the route through which we perceive most external sounds, like waves that travel from the air through the outer, middle and inner ear. ( ⑤ ) Vibrations are conducted through our bones and stimulate our inner ears directly. Lower frequencies are emphasized along this pathway. That makes your voice sound deeper and richer to yourself than it may sound to other people."},

{"no": 317, "school": "온양용화고 (아산시)", "pref": "37", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] But because our vocal cords vibrate when we speak, there is a second internal path.", "p": "37-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 4, "exp": "첫 번째 경로(외부 소리) 설명 뒤, 뼈를 통한 진동 전달(두 번째 경로의 구체적 설명) 앞에 와야 한다.", "b": 2, "bb": "Have you ever been surprised to hear a recording of your own voice? You might have thought, \"Is that really what my voice sounds like?\" Maybe your accent is more pronounced in the recording than you realized, or your voice is higher than it seems to your own ears. This is of course quite a common experience. ( ① ) The explanation is actually fairly simple. ( ② ) There are two pathways through which we perceive our own voice when we speak. ( ③ ) One is the route through which we perceive most external sounds, like waves that travel from the air through the outer, middle and inner ear. ( ④ ) Vibrations are conducted through our bones and stimulate our inner ears directly. ( ⑤ ) Lower frequencies are emphasized along this pathway. That makes your voice sound deeper and richer to yourself than it may sound to other people."},
{"no": 318, "school": "가림고 (인천시)", "pref": "37", "type": "내용불일치", "stem": "다음 글을 요약하여 정리한 표에서 본문과 부합하지 않는 것은? (학교 지문에는 '사람마다 청각이 달라 변이가 생기며, 예를 들어 목소리의 진동이 뇌척수액(cerebrospinal fluid)을 만나 목소리 인식에 영향을 줄 수 있어, 자기 목소리는 늘 남에게와 다르게 들린다'는 내용이 추가됨)", "p": "37-a", "choices": ["ⓐ Title of the Text: Why Our Recorded Voices Sound So Different", "ⓑ Hearing Pathway: External sounds travel through the outer, middle, and inner ear.", "ⓒ Hearing Pathway: The vibration of our own voice is conducted through bones directly to the inner ear.", "ⓓ Frequency Emphasis: Internal pathway emphasizes higher frequencies, making voice sound deeper and richer to oneself.", "ⓔ Cerebrospinal Fluid: It can influence how vibrations of the voice are perceived, contributing to individual differences."], "ans": 4, "exp": "ⓓ higher → lower: 내부 경로에서는 낮은 주파수가 강조된다.", "b": 2, "bb": "[학교 변형 지문]\nHave you ever heard a recording of your voice and had a double take? You might have thought, \"Is that really what my voice sounds like?\" Maybe your accent is more pronounced in the recording than you realized, or your voice is higher than it seems to your own ears. Many of us have had that experience. Why is that? The explanation is actually fairly simple. There are two pathways through which we perceive our own voice when we speak. One is the route through which we perceive most external sounds, like waves that travel from the air through the outer, middle and inner ear. But because our vocal cords vibrate when we speak, there is a second internal path. Vibrations are conducted through our bones and stimulate our inner ears directly. Lower frequencies are emphasized along this pathway. That makes your voice sound deeper and richer to yourself than it may sound to other people. That explanation makes sense for many people, but it doesn't quite explain some variations in this phenomenon like people whose voices sound higher to themselves than it does to others. These variations occur simply because every person's hearing is different. There are more nuanced ways for sounds to be perceived by the inner ear, which creates different perceptions between ourselves and others. For example, vibrations of your voice may encounter cerebrospinal fluid, the clear liquid that sits within the brain and spine, which can influence how you perceive your voice. All these variations and many more make it so that your voice will always sound different to your own ears than it sounds to others. ↓ Title of the Text ⓐWhy Our Recorded Voices Sound So Different Factor Effect Hearing Pathway ⓑExternal sounds travel through the outer, middle, and inner car. ⓒThe vibration of our own voice is conducted through bones directly to the inner ear. Frequency Emphasis ⓓInternal pathway emphasizes higher frequencies, making voice sound deeper and richer to oneself. Cerebrospinal Fluid ⓔIt can influence how vibrations of the voice are perceived, contributing to individual differences."},

{"no": 325, "school": "고색고 (수원시)", "pref": "37", "type": "제목", "stem": "윗글의 제목으로 가장 적절한 것은?", "p": "37-a", "choices": ["Why We Tend to Feel Familiar with Our Own Voice in Recordings", "How Bone Vibrations Affect Our Perception of Our Own Voice", "The Role of the Middle and Outer Ear in Sound Transmission", "How Vibrations and External Sounds Influence Our Hearing", "Why Some People Have Higher-Pitched Voices Than Others"], "ans": 2, "exp": "뼈를 통한 진동이 자기 목소리를 다르게 인식하게 만든다는 내용이므로 ②가 적절하다.", "b": 5},
{"no": 326, "school": "고색고 (수원시)", "pref": "37", "type": "어법", "stem": "윗글의 밑줄 친 부분 중, 어법상 어색한 것은? (ⓐsurprised ⓑwhat (Is that really what my voice sounds like?) ⓒwhich (the route which we perceive most external sounds) ⓓare conducted ⓔsound (makes your voice sound deeper))", "p": "37-a", "choices": ["ⓐ surprised", "ⓑ what", "ⓒ which", "ⓓ are conducted", "ⓔ sound"], "ans": 3, "exp": "ⓒ which → through which: 뒤에 완전한 절이 오므로 전치사+관계대명사가 필요하다.", "b": 5},
{"no": 327, "school": "다사고 (대구시)", "pref": "38", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "38-a", "choices": ["ⓐ similar", "ⓑ something", "ⓒ common", "ⓓ modifications", "ⓔ nonfunctional"], "ans": 2, "exp": "ⓑ something → nothing: 상사 형질은 독립적으로 생겨나 비행이라는 용도 외에는 공통점이 없다.", "b": 1, "bb": "[학교 변형 지문]\nBiologists distinguish two kinds of similarity. \"Analogous\" traits are ones that have a common function but arose on different branches of the evolutionary tree and are in an important sense not \"the same\" organ. The wings of birds and the wings of bees are both used for flight and are ⓐ similar in some ways because anything used for flight has to be built in those ways. But they arose independently in evolution and have ⓑsomething in common beyond their use in flight. \"Homologous\" traits, in contrast, may or may not have a common function, but they descended from a common ancestor and hence have some ⓒcommon structure that indicates their being \"the same\" organ. The wing of a bat and the front leg of a horse have very different functions, but they are all ⓓmodifications of the forelimb of the ancestor of all mammals. As a result, they share ⓔnonfunctional traits like the number of bones and the ways they are connected. To distinguish analogy from homology, biologists usually look at the overall architecture of the organs and focus on their most useless properties."},

{"no": 351, "school": "한영고 (서울시)", "pref": "39", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "39-a", "choices": ["ⓐ is", "ⓑ raises", "ⓒ indicating", "ⓓ rapidly", "ⓔ has led to"], "ans": 1, "exp": "ⓐ is → does: 앞의 일반동사 holds를 대신하는 대동사가 필요하다.", "b": 1, "bb": "[학교 변형 지문]\nSeawater contains an abundance of dissolved oxygen that all marine animals breathe to stay alive. It has long been established in physics that cold water holds more dissolved oxygen than warm water ⓐis ─ this is one reason that cold polar seas are full of life while tropical oceans are blue, clear, and relatively poorly populated with living creatures. Thus, as global warming ⓑraises the temperature of marine waters, it is self-evident that the amount of dissolved oxygen will decrease. This is a worrisome and potentially disastrous consequence if allowed to continue to an ecosystem-threatening level. Now scientists have analyzed data ⓒindicating that the amount of dissolved oxygen in the oceans has been declining for more than a half century. The data show that the ocean oxygen level has been falling more ⓓrapidly than the corresponding rise in water temperature. Falling oxygen levels in water have the potential to impact the habitat of marine organisms worldwide and in recent years this ⓔhas led to more frequent anoxic events that killed or displaced populations of fish, crabs, and many other organisms."},

{"no": 390, "school": "호산고 (대구시)", "pref": "40", "type": "빈칸연결어", "stem": "다음 빈칸 (A) 'If, (A)___, you give one monkey grapes instead…' (B) '(B)___, she is now willing to abandon all gains ─ the cucumbers themselves ─ to communicate her displeasure to the experimenter.'에 들어갈 말로 가장 적절한 것은?", "p": "40-a", "choices": ["(A) however — (B) For instance", "(A) moreover — (B) On the other hand", "(A) for example — (B) By contrast", "(A) however — (B) Furthermore", "(A) therefore — (B) Nevertheless"], "ans": 4, "exp": "(A)는 앞 상황과 대조되므로 however, (B)는 불만 표출을 추가로 설명하므로 Furthermore가 적절하다.", "b": 1, "bb": "Capuchins – New World Monkeys that live in large social groups – will, in captivity, trade with people all day long, especially if food is involved. I give you this rock and you give me a treat to eat. If you put two monkeys in cages next to each other, and offer them both slices of cucumber for the rocks they already have, they will happily eat the cucumbers. If, however, you give one monkey grapes instead – grapes being universally preferred to cucumbers – the monkey that is still receiving cucumbers will begin to throw them back at the experimenter. Even though she is still getting \"paid\" the same amount for her effort of sourcing rocks, and so her particular situation has not changed, the comparison to another makes the situation unfair. If, (A)__________, you give one monkey grapes instead' (B) '(B)__________, she is now willing to abandon all gains ─ the cucumbers themselves ─ to communicate her displeasure to the experimenter."},

{"no": 403, "school": "학익여고 (인천시)", "pref": "40", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "40-a", "choices": ["ⓐ a treat", "ⓑ happily", "ⓒ preferred", "ⓓ the same", "ⓔ cherish"], "ans": 5, "exp": "ⓔ cherish → abandon: 불만을 전달하기 위해 오이마저 포기한다는 문맥이다.", "b": 5, "bb": "[학교 변형 지문]\nCapuchins―New World Monkeys that live in large social groups―will, in captivity, trade with people all day long, especially if food is involved. I give you this rock and you give me ⓐa treat to eat. If you put two monkeys in cages next to each other, and offer them both slices of cucumber for the rocks they already have, they will ⓑ happily eat the cucumbers. If, however, you give one monkey grapes instead―grapes being universally ⓒ preferred to cucumbers―the monkey that is still receiving cucumbers will begin to throw them back at the experimenter. Even though she is still getting \"paid\" ⓓthe same amount for her effort of sourcing rocks, and so her particular situation has not changed, the comparison to another makes the situation unfair. Furthermore, she is now willing to ⓔcherish all gains―the cucumbers themselves―to communicate her displeasure to the experimenter."},

{"no": 405, "school": "초은고 (인천시)", "pref": "42", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "42-a", "choices": ["ⓐ specialised", "ⓑ which", "ⓒ has set up", "ⓓ to focus", "ⓔ shaping"], "ans": 3, "exp": "ⓒ has set up → have set up: 주어가 복수 명사 socio-political changes이다.", "b": 1, "bb": "[학교 변형 지문]\nChanges from an elite system to a mass higher education system are associated with political needs to build a ⓐ specialised workforce for the economy. In theory, the expansion of higher education to develop a highly skilled workforce should diminish the role of examinations in the selection and control of students, initiating approaches to assessment ⓑwhich enable lifelong learning: assessment for learning and a focus on feedback for development. In reality, socio-political changes to expand higher education ⓒhas set up a 'field of contradictions' for assessment in higher education. Mass higher education requires efficient approaches to assessment, such as examinations and multiple-choice quizzes, with minimalist, impersonal, or standardised feedback, often causing students ⓓto focus more on grades than feedback. In contrast, the relatively small numbers of students in elite systems in the past allowed for closer relationships between students and their teachers, with formative feedback ⓔshaping the minds, academic skills, and even the characters of students."},
{"no": 406, "school": "봉명고 (청주시)", "pref": "42", "type": "빈칸", "stem": "다음 빈칸 'In contrast, the relatively small numbers of students in elite systems in the past allowed for ___ between students and their teachers, with formative feedback shaping the minds, academic skills, and even the characters of students.'에 들어갈 말로 가장 적절한 것은?", "p": "42-a", "choices": ["large classes", "personal feedback", "competitive exams", "student independence", "self-directed learning"], "ans": 2, "exp": "과거 엘리트 체제에서는 소수의 학생과 교사 간 밀접한 관계로 개인적인 피드백이 가능했다.", "b": 1, "bb": "Higher education has grown from an elite to a mass system across the world. In Europe and the USA, increased rates of participation occurred in the decades after the Second World War. Between 2000 and 2014, rates of participation in higher education almost doubled from 19% to 34% across the world among the members of the population in the school-leaving age category (typically 18-23). The dramatic expansion of higher education has been marked by a wider range of institutions of higher learning and a more diverse demographic of students. Changes from an elite system to a mass higher education system are associated with political needs to build a specialised workforce for the economy. In theory, the expansion of higher education to develop a highly skilled workforce should diminish the role of examinations in the selection and control of students, initiating approaches to assessment which enable lifelong learning: assessment for learning and a focus on feedback for development. In reality, socio-political changes to expand higher education have set up a 'field of contradictions' for assessment in higher education. Mass higher education requires efficient approaches to assessment, such as examinations and multiple-choice quizzes, with minimalist, impersonal, or standardised feedback, often causing students to focus more on grades than feedback. In contrast, the relatively small numbers of students in elite systems in the past allowed for __________ between students and their teachers, with formative feedback shaping the minds, academic skills, and even the characters of students."},
{"no": 407, "school": "청주여고 (청주시)", "pref": "42", "type": "요약", "stem": "요약 - 'Higher education has shifted from an elite to a mass system, nearly doubling participation rates. This expansion, aimed at developing a skilled workforce, has caused a(n) (A)___ on standardized exams and grades, (B)___ the personalized feedback once common in elite systems.'", "p": "42-a", "choices": ["(A) dependence — (B) retaining", "(A) resistance — (B) taking over", "(A) focus — (B) preserving", "(A) indifference — (B) changing", "(A) reliance — (B) replacing"], "ans": 5, "exp": "대중 교육 확대로 표준화된 시험과 성적에 대한 의존(reliance)이 생겨 개인화된 피드백을 대체(replacing)했다.", "b": 1},
{"no": 408, "school": "불당고 (천안시)", "pref": "42", "type": "요약", "stem": "요약 - 'Higher education has transformed from an elite to a mass system, with participation rates nearly doubling between 2000 and 2014. While this expansion was intended to create a highly skilled workforce and (A)___, the reality of mass education often emphasizes standardized assessment methods that (B)___ the personal feedback that was once common in elite education systems.'", "p": "42-a", "choices": ["(A) focus on student grades — (B) replace", "(A) support workforce training — (B) encourage", "(A) promote lifelong learning — (B) limit", "(A) diminish examination importance — (B) support", "(A) increase academic competition — (B) personalize"], "ans": 3, "exp": "고등 교육 확대는 평생 학습 촉진(promote lifelong learning)을 의도했지만, 대중 교육의 표준화된 평가는 개별 피드백을 제한한다(limit).", "b": 2},

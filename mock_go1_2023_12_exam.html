{"no": 16, "school": "동패고", "pref": "21", "type": "내용 이해", "diff": "", "stem": "다음 글의 괄호 (A), (B), (C) 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "p": "21-16", "choices": ["inherent — uncolored — dependently", "inherent — colored — dependently", "inherent — uncolored — independently", "incidental — colored — independently", "incidental — uncolored — independently"], "ans": 1, "exp": "출처: 동패고 · 고1 23년 12월 21번 내신기출", "b": 1, "bb": "Many people take the commonsense view that color is an (A)[incidental / inherent] property of things, or of the light that bounces off them. They say a tree's leaves are green because they reflect green light – a greenness that is just as real as the leaves. Others argue that color doesn't inhabit the physical world at all but exists only in the eye or mind of the viewer. They maintain that if a tree fell in a forest and no one was there to see it, its leaves would remain (B)[uncolored / colored] – and so would everything else. They say there is no such thing as color; there are only the people who see it. They claim that color exist (C)[independently / dependently]; it exists only when observed. Both positions are, in a way, correct. Color is objective and subjective – \"the place;\" as Paul Cézanne put it, \"where our brain and the universe meet.\" Color is created when light from the world is registered by the eyes and interpreted by the brain."},

{"no": 18, "school": "가림고", "pref": "21", "type": "문맥 어휘", "diff": "", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "21-18", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 5, "exp": "출처: 가림고 · 고1 23년 12월 21번 내신기출", "b": 1, "bb": "For a long time, people believed that colors were objective, physical properties of objects or of the light that bounced off them. Even today, science teachers educate their students with stories about Issac Newton and his prism experiment, telling them how different wavelengths of light produce the rainbow of colors around us. But this theory isn't really ⓐaccurate. Different wavelengths of light do exist independently of us but they only become colors inside our bodies. Color is ultimately a ⓑneurological process whereby photons are detected by light-sensitive cells in our eyes, transformed into electrical signals and sent to our brain, where, in a series of complex calculations, our visual cortex converts them into \"color\". Most experts now agree that color, as commonly understood, doesn't ⓒinhabit the physical world at all but exists in the eyes or minds of its beholders. They argue that if a tree fell in a forest and no one was there to see it, its leaves would be ⓓcolorless ─ and so would everything else. To put it another way: there is no such thing as color; there are only the people who perceive it. This is why no two people will ever see exactly the same colors. Every person's visual system is ⓔidentical and so, therefore, are their perceptions. About 8% of men are color-blind and see fewer colors than everyone else; a small number of lucky women might, thanks to a genetic duplication on the X chromosome, be able to distinguish many more than the rest of us."},

{"no": 97, "school": "산본고", "pref": "31", "type": "내용 불일치", "diff": "", "stem": "다음 George M. Stratton에 관한 글의 내용과 일치하지 않는 것은?", "p": "31-97", "choices": ["He performed the experiment with himself as the subject.", "His reversing glasses were special glasses that inverted the wearer's perception of the world.", "Wearing reversing glasses initially brought him difficulties with basic tasks like eating with a fork.", "His visual system with reversing glasses gradually adapted, allowing normal behavior.", "He still had difficulties adjusting, even a day after taking off the reversing glasses."], "ans": 5, "exp": "출처: 산본고 · 고1 23년 12월 31번 내신기출", "b": 1, "bb": "A remarkable characteristics of the visual system is that it has the ability of adapting itself. Psychologist George M. Stratton made this clear in an impressive self-experiment. Stratton wore reversing glasses for several days, which literally turned the world upside down for him. In the beginning, this caused him great difficulties: just putting food in his mouth with a fork was a challenge for him. With time, however, his visual system adjusted to the new stimuli from reality, and he was able to act normally in his environment again, even seeing it upright when he concentrated. As he took off his reversing glasses, he was again confronted with problems: he used the wrong hand when he wanted to reach for something, for example. Fortunately, Stratton could reverse the perception, and he did not have to wear reversing glasses for the rest of his life. For him, everything returned to normal after one day."},

{"no": 128, "school": "지산고", "pref": "34", "type": "내용 불일치", "diff": "", "stem": "다음 Plato's realism에 관한 글의 내용과 일치하지 않는 것은?", "p": "34-128", "choices": ["No physical circle in the sensory world is flawless.", "Plato's realism is best understood through mathematical concepts.", "Perfect objects become flawed due to change and decay over time.", "Our sensory world is an imperfect imitation of universals.", "Forms represent an unobservable yet true reality."], "ans": 3, "exp": "출처: 지산고 · 고1 23년 12월 34번 내신기출", "b": 1, "bb": "Plato's realism includes all aspects of experience but is most easily explained by considering the nature of mathematical and geometrical objects such as circles. He asked the question, what is a circle? You might indicate a particular example carved into stone or drawn in the sand. However, Plato would point out that, if you looked closely enough, you would see that neither it, nor indeed any physical circle, was perfect. They all possessed flaws, and all were subject to change and decayed with time. So how can we talk about perfect circles if we cannot actually see or touch them? Plato's extraordinary answer was that the world we see is a poor reflection of a deeper unseen reality of Forms, or universals, where perfect cats chase perfect mice in perfect circles around perfect rocks. Plato believed that the Forms or universals are the true reality that exists in an invisible but perfect world beyond our senses."},

{"no": 193, "school": "산본고", "pref": "40", "type": "내용 이해", "diff": "", "stem": "윗글 [A]에 밑줄 친 It didn't work의 이유로 가장 적절한 것은?", "p": "40-193", "choices": ["The organs of primates were available only for the rich.", "The organs of primates were anatomically similar to humans.", "The organs of primates were not fit with human immune systems.", "Primates were too intelligent to be used for organ transplantation.", "Primates were considered insufficiently big, costly, and objectionable for organ transplantation."], "ans": 5, "exp": "출처: 산본고 · 고1 23년 12월 40번 내신기출", "b": 1, "bb": "Many of the first models of cultural evolution drew noticeable connections between culture and genes by using concepts from theoretical population genetics and applying them to culture. Cultural patterns of transmission, innovation, and selection are conceptually likened to genetic processes of transmission, mutation, and selection. However, these approaches had to be modified to account for the differences between genetic and cultural transmission. For example, we do not expect the cultural transmission to follow the rules of genetic transmission strictly. If two biological parents have different forms of a cultural trait, their child is not necessarily equally likely to acquire the mother's or father's form of that trait. Further, a child can acquire cultural traits not only from its parents but also from nonparental adults and peers; thus, the frequency of a cultural trait in the population is relevant beyond just the probability that an individual's parents had that trait."},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

  try{localStorage.setItem('bomnal_name',userName);localStorage.setItem('bomnal_school',userSchool);}catch(e){}
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('userInfo').textContent = userName + ' · ' + userSchool;
  _loadHist();
  renderTypeRow();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

// ── QUIZ ──────────────────────────────────────────
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/([①②③④⑤])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.textContent='💡 '+q.exp;fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v3';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 23년 12월 전국기출 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고123년12월_전국기출',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

}

`While scrolling through her social media one day, Gina was astonished when she saw the news headline, “The Heundeulbawi in Seoraksan National Park Has Fallen.” Gina immediately shared the shocking story with her close friends. Later, during the morning news on TV, a reporter standing next to the undamaged Heundeulbawi said, “Today’s Internet stories of the Heundeulbawi being damaged were fake.” Gina was embarrassed by the fact that she had spread the fake news.

  It reminded her of another incident of fake news that had happened a while ago. The news that a famous athlete had died became the number one issue online, but it turned out to be fake. It had been made by content creators who sought people’s attention. They produced provocative false stories to make money by raising the number of views of their posts. At that time, Gina criticized those who had made and spread fake news because it had hurt the athlete and confused people. This time, however, Gina herself had accidentally contributed to the spread of fake news.`;

const P_1_3 =
`Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average.

  One explanation for this phenomenon is that people like new and provocative things. When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. Also, fake news goes viral because people in their daily lives tend to think simply and effortlessly. It is more likely for them to believe new information without any proof, instead of critically examining it.

  Moreover, people are inclined to believe information that fits their prejudices or experiences even when not true. In this process, people easily fall into the trap of “confirmation bias.” That is, they selectively accept news in a way that only confirms their beliefs and ignore news that doesn’t support them. During election season, for example, people tend to blindly believe any news describing their favored candidates in a positive way, while unconsciously believing news that reports something negative about other candidates.`;

const P_1_4 =
`With so much information on the Internet, how can you make sure that fake news does not mislead you? First, read beyond the provocative headlines. They can be so stimulating to get more clicks that you may click on them accidentally. So don’t just read the headlines, but read the text carefully. Second, don’t read the news at face value. Exercise critical thinking skills to judge the news. You should question, analyze, and evaluate what you read. Third, examine your biases. Consider if your own beliefs could affect your judgment. Ask yourself if you are only reading articles that suit your opinion, and look for articles that oppose your opinion as well. Finally, check the credibility of the source. You should examine who wrote the news story and what the intent was behind writing the news story. You also need to check whether the news story is from a reliable media source and the evidence is valid.

  In the digital age, it might be impossible to avoid or eliminate all false information that spreads online. However, if you have the ability to view information critically and objectively, you will be able to reduce the damage that fake news can cause. Don’t forget! Anyone can be the next person producing or spreading fake news!`;

const P_ALL =
`Gina criticized those who had made and spread fake news because it had hurt the athlete and confused people. This time, however, Gina herself had accidentally contributed to the spread of fake news. Unfortunately, becoming an accidental distributor of fake news like Gina is not unusual. Fake news is a deliberate attempt to manipulate people by spreading inaccurate information. It is made by certain groups with the intention of attracting people’s attention, making profits, or gaining political benefits. It can confuse people, disturb society, and even seriously harm the public as well as all individuals involved.`;

    "Checking the credibility of the source is important when evaluating news.",
    "Avoiding fake information entirely remains difficult, even in our digital society."],
  expl:"“Consider if <b>your own beliefs could affect your judgment</b>.” — 자신의 믿음(편견)이 판단에 <b>영향을 줄 수 있다</b>고 했다. 따라서 ‘개인적 편견은 아무런 영향을 미치지 않는다’는 ③은 일치하지 않는다." },

{ no:21, tag:"[1-본문(all)]", stem:"다음 글의 내용과 일치하지 않는 것은?", psg:P_ALL, ans:2,
  opts:[
    "지나는 가짜뉴스의 확산에 뜻하지 않게 기여했다.",
    "지나와 같이 가짜뉴스의 배포자가 되는 것은 흔하지 않다.",
    "가짜뉴스는 부정확한 정보를 퍼뜨림으로써 사람들을 속이는 고의적인 시도이다.",
    "가짜뉴스는 다양한 의도를 가진 집단에 의해서 만들어진다.",
    "가짜뉴스는 관련된 개인 뿐만 아니라 대중들에게도 해를 끼칠 수 있다."],
  expl:"“…becoming an accidental distributor of fake news like Gina <b>is not unusual</b>.” — 지나처럼 우발적으로 가짜 뉴스를 유포하는 것은 <b>드문 일이 아니다</b>라고 했으므로 ②는 일치하지 않는다." }
];

/* ── 학생 확인 ─────────────────────────────────────── */
const code = (localStorage.getItem("bn_id") || sessionStorage.getItem("bn_id") || "").trim();
const sName = (localStorage.getItem("bn_name") || sessionStorage.getItem("bn_name") || "").trim();
const sSchool = (localStorage.getItem("bn_school") || sessionStorage.getItem("bn_school") || "고운고1").trim();

/* ── 진행 상태 (기기 안에 저장) ─────────────────────── */
// remaining: 아직 못 맞힌 문제 번호 / cleared: 오답 0개 달성 / round: 몇 번째 라운드인지
const stateKey = LSKEY + "_" + (code || "guest");
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(stateKey) || "null");
    if(s && Array.isArray(s.remaining)) return s;
  }catch(e){}
  return { remaining: QUESTIONS.map(q=>q.no), cleared:false, round:0 };
}
function saveState(s){ try{ localStorage.setItem(stateKey, JSON.stringify(s)); }catch(e){} }
let ST = loadState();

/* ── 화면 전환 ─────────────────────────────────────── */
function show(id){
  ["scBlock","scStart","scQuiz","scResult"].forEach(s=>document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}

/* ── 라운드 진행 상태 ───────────────────────────────── */
let qs=[], idx=0, cor=0, wrongs=[], t0=0, answered=false;

function startRound(){
  qs = QUESTIONS.filter(q=>ST.remaining.includes(q.no));
  if(!qs.length){ finishAll(); return; }
  idx=0; cor=0; wrongs=[]; t0=Date.now();
  ST.round = (ST.round||0) + 1; saveState(ST);
  show("scQuiz"); draw();
}
window.startRound = startRound;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function draw(){
  answered=false;
  const q = qs[idx];
  document.getElementById("qTop").textContent = (idx+1) + " / " + qs.length;
  document.getElementById("qRound").textContent = ST.round + "라운드 · 남은 오답 " + ST.remaining.length + "개";
  document.getElementById("qFill").style.width = Math.round(idx/qs.length*100) + "%";
  document.getElementById("qNo").textContent = "시험지 " + q.no + "번 " + q.tag;
  document.getElementById("qStem").textContent = q.stem;
  document.getElementById("qPsg").innerHTML = q.psg.split("\n\n").map(p=>"<p>"+esc(p)+"</p>").join("");
  document.getElementById("qFb").innerHTML = "";
  document.getElementById("qNext").innerHTML = "";
  const box = document.getElementById("qOpts");
  box.innerHTML = "";
  q.opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="cir">'+CIR[i]+'</span><span>'+esc(o)+'</span>';
    b.onclick = ()=>pick(i+1);
    box.appendChild(b);
  });
}

function pick(my){
  if(answered) return;
  answered = true;
  const q = qs[idx];
  const btns = document.querySelectorAll("#qOpts .opt");
  btns.forEach((b,i)=>{
    b.disabled = true;
    if(i+1 === q.ans) b.classList.add("ok");
    else if(i+1 === my) b.classList.add("no");
  });
  const ok = (my === q.ans);
  if(ok) cor++; else wrongs.push({q, my});
  document.getElementById("qFb").innerHTML =
    '<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"⭕ 정답이에요!":"❌ 아쉬워요 — 정답은 "+CIR[q.ans-1]+"번")+'</b>'+q.expl+'</div>';
  document.getElementById("qNext").innerHTML =
    '<button class="btn" onclick="nextQ()">'+(idx===qs.length-1 ? "결과 보기 →" : "다음 문제 →")+'</button>';
}
window.pick = pick;

function nextQ(){
  if(idx < qs.length-1){ idx++; draw(); }
  else endRound();
}
window.nextQ = nextQ;

function endRound(){
  document.getElementById("qFill").style.width = "100%";
  const total = qs.length;
  const pct = Math.round(cor/total*100);
  const min = Math.max(1, Math.round((Date.now()-t0)/60000));
  const stillWrong = wrongs.map(w=>w.q.no);

  // 맞힌 문제는 남은 목록에서 빼고, 틀린 문제는 그대로 남긴다
  ST.remaining = ST.remaining.filter(n => stillWrong.includes(n));
  ST.cleared = ST.remaining.length === 0;
  saveState(ST);

  // 결과 저장 (오답 0개면 quizType에 _오답완료 → 관리자에서 🏆로 표시)
  if(window._saveResult) window._saveResult({
    studentName: sName || "이름없음",
    school: sSchool,
    studentCode: code || "",
    score: pct, correct: cor, wrong: total-cor, total: total,
    elapsedMin: min,
    round: ST.round,
    completed: ST.cleared,
    remainingWrong: ST.remaining.length,
    quizType: QUIZ_TYPE + (ST.cleared ? "_오답완료" : ""),
    lesson: "1과", roundName: "일치·불일치 개인 오답",
    wrongWords: wrongs.map(w=>({ eng: "시험지 "+w.q.no+"번", kor: "정답 "+CIR[w.q.ans-1] })),
    wrongDetails: wrongs.map(w=>({
      q: w.q.no + "번 " + w.q.tag + " " + w.q.stem,
      my: w.my, answer: w.q.ans,
      myText: CIR[w.my-1] + " " + w.q.opts[w.my-1],
      answerText: CIR[w.q.ans-1] + " " + w.q.opts[w.q.ans-1],
      expl: w.q.expl.replace(/<[^>]+>/g,"")
    }))
  });

  if(ST.cleared){ finishAll(); return; }

  document.getElementById("resCard").innerHTML =
    '<div style="text-align:center;font-size:13px;color:var(--muted);font-weight:800">'+ST.round+'라운드 결과</div>'
    +'<div class="score">'+pct+'점</div>'
    +'<div class="stat">'
    +'<div><b style="color:#2e7d32">'+cor+'</b><span>정답</span></div>'
    +'<div><b style="color:#c62828">'+(total-cor)+'</b><span>오답</span></div>'
    +'<div><b style="color:#1565c0">'+total+'</b><span>문항</span></div></div>'
    +'<div class="wlist"><b>아직 남은 오답 '+ST.remaining.length+'개</b><br>'
    + ST.remaining.map(n=>'<span class="chip">'+n+'번</span>').join('') + '</div>'
    +'<p class="note" style="text-align:center">오답이 <b style="color:#c62828">0개</b>가 될 때까지 다시 풀어요.<br>해설을 한 번 더 읽고 도전! 💪</p>'
    +'<div style="margin-top:14px"><button class="btn" onclick="startRound()">❌ 남은 오답 다시 풀기 ('+ST.remaining.length+')</button></div>'
    +'<div class="save">✅ 이번 라운드 결과가 선생님께 전송되었어요</div>';
  show("scResult");
}

function finishAll(){
  ST.cleared = true; ST.remaining = []; saveState(ST);
  document.getElementById("resCard").innerHTML =
    '<div class="trophy">🏆</div>'
    +'<div class="big">오답 0개 클리어!</div>'
    +'<p class="note" style="text-align:center">'
    + (sName ? '<b>'+esc(sName)+'</b> 학생, ' : '')
    + '틀렸던 <b>10문제</b>를 모두 맞혔어요.<br>'
    + '총 <b>'+ST.round+'라운드</b> 만에 끝냈습니다. 정말 잘했어요! 👏</p>'
    +'<div style="margin-top:16px"><button class="btn sec" onclick="reopen()">다시 한 번 복습하기</button></div>'
    +'<div style="margin-top:8px"><a class="btn" style="display:block;text-decoration:none;text-align:center;padding:13px" href="index.html">허브로 돌아가기 →</a></div>'
    +'<div class="save">✅ ‘오답 0개 완료’ 기록이 선생님께 전송되었어요</div>';
  show("scResult");
}

// 이미 클리어했어도 원하면 다시 복습 (완료 기록은 그대로 남는다)
function reopen(){
  ST.remaining = QUESTIONS.map(q=>q.no);
  saveState(ST);
  startRound();
}
window.reopen = reopen;

/* ── 진입 ─────────────────────────────────────────── */
(function boot(){
  if(!ALLOW.includes(code)){ show("scBlock"); return; }
  if(ST.cleared && ST.remaining.length === 0){ finishAll(); return; }
  document.getElementById("startTitle").innerHTML =
    (sName ? esc(sName)+' 학생,<br>' : '') + '다시 풀어야 할 오답이 <span style="color:#c62828">'+ST.remaining.length+'문제</span> 있어요';
  document.getElementById("startChips").innerHTML =
    ST.remaining.map(n=>'<span class="chip">'+n+'번</span>').join('');
  document.getElementById("startBtn").textContent =
    (ST.round>0 ? ST.round+1+'라운드 시작하기 ('+ST.remaining.length+'문제)' : '오답 '+ST.remaining.length+'문제 풀기 시작');
  show("scStart");
})();
</script>
</body>
</html>

{"no": 33, "school": "", "pref": "20", "type": "", "diff": "", "stem": "글이 말하는 '흔한 부모의 함정'은?", "p": "20-33", "choices": ["아이의 성적을 다른 집과 비교하는 것", "아이에게 공부를 전혀 시키지 않는 것", "아이의 뛰어남을 쉼 없이 자랑하는 것", "아이의 친구 관계를 대신 정해 주는 것"], "ans": 3, "exp": "'talk nonstop'은 쉼 없이 이야기한다는 뜻입니다. 아이의 뛰어난 점을 계속 자랑하는 것이 함정이에요.\n📖 While it is very easy to <b>talk nonstop about your little genius and his or her remarkable behavior</b>, this can be very stressful on your child.\n   당신의 작은 천재와 그 아이의 뛰어난 행동을 쉼 없이 이야기하기는 아주 쉽지만, 이것이 아이에게 큰 스트레스가 될 수 있다.", "b": 1, "bb": "As the parent of a gifted child, you need to be aware of a certain common parent trap. Of course you are a proud parent, and you should be. While it is very easy to talk nonstop about your little genius and his or her remarkable behavior, this can be very stressful on your child. It is extremely important to limit your bragging behavior to your very close friends, or your parents. Gifted children feel pressured when their parents show them off too much. This behavior creates expectations that they may not be able to live up to, and also creates a false sense of self for your child. You want your child to be who they are, not who they seem to be as defined by their incredible achievements. If not, you could end up with a driven perfectionist child or perhaps a drop‑out, or worse."},

{"no": 49, "school": "", "pref": "21", "type": "", "diff": "", "stem": "무력감에서 벗어나는 방법으로 글이 제시하는 것은?", "p": "21-49", "choices": ["혼자 조용히 지내며 생각을 정리하는 것", "부정적인 생각을 종이에 적어 보는 것", "더 어려운 문제에 먼저 도전해 보는 것", "같은 문제를 이겨 낸 사람들과 함께 있는 것"], "ans": 4, "exp": "우리가 힘들어하는 문제를 이미 해결한 사람들과 함께 있기를 '선택하라'고 합니다.\n📖 is to <b>choose to be with other persons who have resolved the problem with which we struggle</b>\n   우리가 힘들어하는 문제를 해결한 다른 사람들과 함께 있기를 선택하는 것이다.", "b": 1, "bb": "One valuable technique for getting out of helplessness, depression, and situations which are predominantly being run by the thought, “I can’t,” is to choose to be with other persons who have resolved the problem with which we struggle. This is one of the great powers of self‑help groups. When we are in a negative state, we have given a lot of energy to negative thought forms, and the positive thought forms are weak. Those who are in a higher vibration are free of the energy from their negative thoughts and have energized positive thought forms. Merely to be in their presence is beneficial. In some self‑help groups, this is called “hanging out with the winners.” The benefit here is on the psychic level of consciousness, and there is a transfer of positive energy and relighting of one’s own latent positive thought forms."},

{"no": 65, "school": "", "pref": "22", "type": "", "diff": "", "stem": "글에 따르면 우리에게 감정이 존재한다고 여겨지는 이유는?", "p": "22-65", "choices": ["종의 생존에 도움을 주었기 때문", "개인의 행복을 늘려 주기 때문", "사회의 규칙을 만들어 주기 때문", "언어의 발달을 이끌었기 때문"], "ans": 1, "exp": "첫 문장에서 감정이 '종으로서 우리의 생존에 기여했기 때문에' 존재한다고 여겨진다고 했어요.\n📖 Our emotions are thought to exist because they have <b>contributed to our survival as a species</b>.\n   우리의 감정은 종으로서 우리의 생존에 기여했기 때문에 존재한다고 여겨진다.", "b": 1, "bb": "Our emotions are thought to exist because they have contributed to our survival as a species. Fear has helped us avoid dangers, expressing anger helps us scare off threats, and expressing positive emotions helps us bond with others. From an evolutionary perspective, an emotion is a kind of “program” that, when triggered, directs many of our activities (including attention, perception, memory, movement, expressions, etc.). For example, fear makes us very attentive, narrows our perceptual focus to threatening stimuli, will cause us either to face a situation (fight) or avoid it (flight), and may cause us to remember an experience more acutely (so that we avoid the threat in the future). Regardless of the specific ways in which they activate our systems, the specific emotions we possess are thought to exist because they have helped us (as a species) survive challenges within our environment long ago. If they had not helped us adapt and survive, they would not have evolved with us."},

{"no": 97, "school": "", "pref": "24", "type": "", "diff": "", "stem": "고래 한 마리가 죽을 때 격리하는 이산화탄소의 양은?", "p": "24-97", "choices": ["평균 3톤", "평균 30톤", "평균 48톤", "평균 300톤"], "ans": 2, "exp": "고래가 죽으면 한 마리당 평균 30톤의 이산화탄소를 가두어 수백 년간 대기에서 빼낸다고 했어요.\n📖 each whale sequesters an average of <b>30 tons of carbon dioxide</b>, taking that carbon out of the atmosphere for centuries\n   고래 한 마리는 평균 30톤의 이산화탄소를 격리해 수백 년간 대기에서 빼낸다.", "b": 1, "bb": "Whales are highly efficient at carbon storage. When they die, each whale sequesters an average of 30 tons of carbon dioxide, taking that carbon out of the atmosphere for centuries. For comparison, the average tree absorbs only 48 pounds of CO a year. From a climate perspective, each whale is the marine equivalent of thousands of trees. Whales also help sequester carbon by fertilizing the ocean as they release nutrient‑rich waste, in turn increasing phytoplankton populations, which also sequester carbon—leading some scientists to call them the “engineers of marine ecosystems.” In 2019, economists from the International Monetary Fund (IMF) estimated the value of the ecosystem services provided by each whale at over $2 million USD. They called for a new global program of economic incentives to return whale populations to preindustrial whaling levels as one example of a “nature‑based solution” to climate change. Calls are now being made for a global whale restoration program, to slow down climate change."},

{"no": 177, "school": "", "pref": "29", "type": "", "diff": "", "stem": "글이 한 조직 안에 여러 문화가 있음을 보여 주는 예로 드는 것은?", "p": "29-177", "choices": ["부서마다 다르게 돌아가는 기능과 업무", "조직이 해마다 바꾸는 사업 목표", "구성원들이 함께 쓰는 사내 언어", "경영자가 세우는 장기 경영 계획"], "ans": 1, "exp": "첫 문장에서 조직 안 여러 부서의 '기능적 운영'을 알아보는 것이 가장 흥미로운 예라고 했습니다.\n📖 one of the most fascinating examples of how any organization may contain many different types of culture is to recognize <b>the functional operations of different departments within the organization</b>\n   조직 안 서로 다른 부서들의 기능적 운영을 살펴보는 것이 좋은 예다", "b": 1, "bb": "From an organizational viewpoint, one of the most fascinating examples of how any organization may contain many different types of culture is to recognize the functional operations of different departments within the organization. The varying departments and divisions within an organization will inevitably view any given situation from their own biased and prejudiced perspective. A department and its members will acquire “tunnel vision” which disallows them to see things as others see them. The very structure of organizations can create conflict. The choice of whether the structure is “mechanistic” or “organic” can have a profound influence on conflict management. A mechanistic structure has a vertical hierarchy with many rules, many procedures, and many levels of management involved in decision making. Organic structures are more horizontal in nature, where decision making is less centralized and spread across the plane of the organization."},

{"no": 193, "school": "", "pref": "30", "type": "", "diff": "", "stem": "글에 따르면 자전거와 보행자를 위한 길을 넓게 확보한 결과는?", "p": "30-193", "choices": ["사람들이 차 대신 자전거를 타게 되어 거리가 안전해진다", "자동차 통행량이 늘어 배달 차량이 사라지게 된다", "보행자가 줄어들어 동네 가게들이 문을 닫게 된다", "택시와 응급차까지 모두 거리에서 사라지게 된다"], "ans": 1, "exp": "세 번째 문장에 그대로 나옵니다. 자전거로 다니도록 사람들을 움직이게 하고, 그 결과 모두에게 거리가 더 안전해진다고 했어요.\n📖 This motivates people to travel by bike rather than by car, <b>making streets safer for everyone</b>.\n   이것은 사람들이 차보다 자전거로 이동하게 만들어, 모두에게 거리를 더 안전하게 한다.", "b": 1, "bb": "An excellent alternative to calming traffic is removing it. Some cities reserve an extensive network of lanes and streets for bikes, pedestrians, and the occasional service vehicle. This motivates people to travel by bike rather than by car, making streets safer for everyone. As bicycles become more popular in a city, planners can convert more automobile lanes and entire streets to accommodate more of them. Nevertheless, even the most bikeable cities still require motor vehicle lanes for taxis, emergency vehicles, and delivery trucks. Delivery vehicles are frequently a target of animus, but they are actually an essential component to making cities greener. A tightly packed delivery truck is a far more efficient transporter of goods than several hybrids carrying a few shopping bags each. Distributing food and other goods to neighborhood vendors allows them to operate smaller stores close to homes so that residents can walk, rather than drive, to get their groceries."},

{"no": 223, "school": "", "pref": "31", "type": "", "diff": "", "stem": "윗글의 요지로 가장 적절한 것은?", "p": "31-223", "choices": ["음악은 익숙할수록 좋은 평가를 받는다", "좋은 작곡가는 연주 실력도 뛰어나야 한다", "위대한 음악가를 가르는 기준은 독창성이다", "영화는 음악가의 삶을 사실대로 그려야 한다"], "ans": 3, "exp": "효과적인 작곡가는 자기만의 생각을 가진다고 했고, 살리에리는 독창성이 없어 위대해지지 못했다고 했습니다.\n📖 Effective composers <b>have their own ideas</b>.\n   뛰어난 작곡가는 자기만의 생각을 가지고 있다.", "b": 1, "bb": "You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the “host” of this movie; he’s depicted as one of the most famous non‑great composers—he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work wasn’t original. What he wrote sounded just like what everyone else was composing at the time."},
{"no": 224, "school": "", "pref": "31", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "31-224", "choices": ["두 작곡가의 작품을 나란히 분석해 비교한다", "시간 순서에 따라 음악사의 변화를 정리한다", "질문을 던지고 끝까지 답을 미루어 둔다", "일반적인 통념을 말한 뒤 구체적 인물로 뒷받침한다"], "ans": 4, "exp": "'위대한 작곡가는 당대에 오해받았다'는 익숙한 이야기를 꺼낸 뒤, 영화 아마데우스의 살리에리를 예로 들어 뒷받침합니다.\n📖 Have you ever seen <b>the classic movie Amadeus</b>?\n   고전 영화 아마데우스를 본 적이 있는가?", "b": 1, "bb": "You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the “host” of this movie; he’s depicted as one of the most famous non‑great composers—he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work wasn’t original. What he wrote sounded just like what everyone else was composing at the time."},
{"no": 225, "school": "", "pref": "32", "type": "", "diff": "", "stem": "글에서 새로운 매체를 사용하기 시작하는 일을 무엇에 비유하는가?", "p": "32-225", "choices": ["새 고글을 쓰는 일", "새 언어를 배우는 일", "새 집으로 이사하는 일", "새 친구를 사귀는 일"], "ans": 1, "exp": "새 매체를 쓰기 시작하는 것은 저마다 색과 렌즈가 다른 새 고글을 쓰는 것과 같다고 했습니다.\n📖 it’s like you are putting on a new kind of goggles, <b>with their own special colors and lenses</b>\n   그것은 저마다 특별한 색과 렌즈를 가진 새로운 고글을 쓰는 것과 같다.", "b": 1, "bb": "Every time a new medium comes along—whether it’s the invention of the printed book, or TV, or SNS—and you start to use it, it’s like you are putting on a new kind of goggles, with their own special colors and lenses. Each set of goggles you put on makes you see things differently. So when you start to watch television, before you absorb the message of any particular TV show—whether it’s Wheel of Fortune or The Wire—you start to see the world as being shaped like television itself. That’s why Marshall McLuhan said that every time a new medium comes along—a new way for humans to communicate—it has buried in it a message. It is gently guiding us to see the world according to a new set of codes. The way information gets to you, McLuhan argued, is more important than the information itself. TV teaches you that the world is fast; that it’s about surfaces and appearances."},

{"no": 241, "school": "", "pref": "33", "type": "", "diff": "", "stem": "글에 따르면 개념을 조심해야 하는 까닭은?", "p": "33-241", "choices": ["개념이 본질주의로 가는 문을 열기 때문", "개념이 기억력을 떨어뜨리기 때문", "개념을 배우는 데 시간이 많이 들기 때문", "개념이 사람마다 다르게 발음되기 때문"], "ans": 1, "exp": "개념은 생존에 꼭 필요하지만, 본질주의로 가는 문을 열기 때문에 조심해야 한다고 했습니다.\n📖 we must also be careful with them because <b>concepts open the door to essentialism</b>\n   개념은 본질주의로 가는 문을 열기 때문에 우리는 또한 개념을 조심해야 한다.", "b": 1, "bb": "Concepts are vital to human survival, but we must also be careful with them because concepts open the door to essentialism. They encourage us to see things that aren’t present. Stuart Firestein opens his book, Ignorance, with an old proverb, “It is very difficult to find a black cat in a dark room, especially when there is no cat.” This statement beautifully sums up the search for essences. History has many examples of scientists who searched fruitlessly for an essence because they used the wrong concept to guide their hypotheses. Firestein gives the example of luminiferous ether, a mysterious substance that was thought to fill the universe so that light would have a medium to move through. The ether was a black cat, writes Firestein, and physicists had been theorizing in a dark room, and then experimenting in it, looking for evidence of a cat that did not exist."},

{"no": 257, "school": "", "pref": "34", "type": "", "diff": "", "stem": "일부 콘텐츠 창작자가 원하는 '평범한 명성(ordinary fame)'에 대해 글이 말하는 것은?", "p": "34-257", "choices": ["엘리트 명성에 이르는 수단이다", "그 자체가 목적인 사회적 목표다", "경제적 이익을 노린 전략이다", "전통적 재능을 증명하는 길이다"], "ans": 2, "exp": "첫 문장에서 소셜 미디어 관심은 엘리트 명성 같은 목적을 위한 '수단'이 될 수도 있지만, 어떤 창작자들은 평범한 명성 자체를 목적으로 원한다고 했어요.\n📖 some content creators desire <b>ordinary fame as a social end in itself</b>\n   일부 콘텐츠 창작자들은 평범한 명성을 그 자체로 하나의 사회적 목적으로서 원한다.", "b": 1, "bb": "While social media attention is potentially an instrument to achieve ends like elite celebrity, some content creators desire ordinary fame as a social end in itself. Not unlike reality television stars, social media celebrities are often criticized for not having skills and talents associated with traditional, elite celebrity, such as acting or singing ability. This criticism highlights the fact that digital content creators face real barriers to crossing over to the sphere of elite celebrity. However, the criticism also misses the point that the phenomenon of ordinary celebrity reconstructs the meaning of fame. The elite celebrity is symbolized by the metaphor of the star, characterized by mystery and hierarchical distance and associated with naturalized qualities of talent and class. The ordinary celebrity attracts attention through regular and frequent interactions with other ordinary people. Achieving ordinary fame as a social media celebrity is like doing well at a game, because in this sphere, fame is nothing more nor less than relatively high scores on attention scales, the metrics of subscribers, followers, Likes, or clicks built into social media applications."},

{"no": 273, "school": "", "pref": "35", "type": "", "diff": "", "stem": "교과서나 필기를 읽은 직후, 정보가 어디에 있다고 글은 말하는가?", "p": "35-273", "choices": ["의식적인 작업기억 속", "장기 기억 저장고 속", "무의식의 깊은 곳", "이미 사라진 상태"], "ans": 1, "exp": "읽은 직후에는 정보가 활성 상태로 '의식적인 작업기억'에 앉아 있다고 했어요.\n📖 It sits in our <b>conscious working memory</b>, in an active form.\n   그 정보는 활성 상태로 우리의 의식적인 작업기억 안에 자리한다.", "b": 1, "bb": "Why do we have the illusion that cramming for an exam is the best learning strategy? Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form. We feel as if we know it, because it is present in our short‑term storage space... but this short‑term section has nothing to do with the long‑term memory that we will need in order to recall the same information a few days later. After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long‑term memory, it is essential to study the material, then test yourself, rather than spend all your time studying."},

{"no": 280, "school": "", "pref": "35", "type": "", "diff": "", "stem": "밑줄 친 'cramming for an exam'이 뜻하는 바로 가장 적절한 것은?", "p": "35-280", "choices": ["오랜 기간 조금씩 나눠 외우기", "시험 직전에 한꺼번에 몰아 외우기", "시험 문제를 미리 몰래 보기", "친구와 함께 소리 내어 읽기"], "ans": 2, "exp": "'cram'은 좁은 곳에 억지로 밀어 넣는다는 말이에요. 시험을 앞두고 한꺼번에 몰아서 외우는 벼락치기를 뜻해요.\n📖 the illusion that <b>cramming for an exam</b> is the best learning strategy\n   시험을 위한 벼락치기가 최고의 학습 전략이라는 착각.", "b": 1, "bb": "Why do we have the illusion that cramming for an exam is the best learning strategy? Because we are unable to differentiate between the various sections of our memory. Immediately after reading our textbook or our class notes, information is fully present in our mind. It sits in our conscious working memory, in an active form. We feel as if we know it, because it is present in our short‑term storage space... but this short‑term section has nothing to do with the long‑term memory that we will need in order to recall the same information a few days later. After a few seconds or minutes, working memory already starts disappearing, and after a few days, the effect becomes enormous: unless you retest your knowledge, memory vanishes. To get information into long‑term memory, it is essential to study the material, then test yourself, rather than spend all your time studying."},

{"no": 289, "school": "", "pref": "36", "type": "", "diff": "", "stem": "거울 뉴런의 발견이 크게 바꾸어 놓은 생각으로 글이 말한 것은?", "p": "36-289", "choices": ["타고난 본능의 범위", "관찰을 통한 학습", "시행착오의 중요성", "언어 습득의 순서"], "ans": 2, "exp": "첫 문장에서 거울 뉴런의 발견이 '관찰에 의한 학습'이라는 인간의 기본 능력에 대한 생각을 깊이 바꿔 놓았다고 했어요.\n📖 The discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, <b>learning by observation</b>\n   거울 뉴런의 발견은 관찰에 의한 학습이라는 인간의 기본 능력에 대한 생각을 깊이 바꿔 놓았다.", "b": 1, "bb": "The discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out theirs. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others."},

{"no": 292, "school": "", "pref": "36", "type": "", "diff": "", "stem": "아기가 조금 자란 뒤 보이는 모방의 모습으로 글이 든 것은?", "p": "36-292", "choices": ["글자를 먼저 읽어 보려 한다", "또래 친구만 흉내 내려 한다", "아무 소리도 내지 않고 지켜본다", "부모가 내는 소리를 따라 하기 시작한다"], "ans": 4, "exp": "아기들은 옹알이를 하고, 그 뒤에는 부모가 내는 소리를 따라 하기 시작한다고 했어요.\n📖 Babies babble and later start to <b>imitate the sounds their parents produce</b>.\n   아기들은 옹알이를 하고, 나중에는 부모가 내는 소리를 따라 하기 시작한다.", "b": 1, "bb": "The discovery of mirror neurons has profoundly changed the way we think of a fundamental human capacity, learning by observation. As children we learn a lot by observing what our parents and friends do. Newborns, in the first week of life, have an inborn tendency to stick out their tongue if their parents stick out theirs. Such imitation is not perfect. You may not see the tongue stick out each time you stick yours out at your newborn, but if you do it many times, the tongue will come out more often than if you do something different. Babies babble and later start to imitate the sounds their parents produce. Later still, they play with vacuum cleaners and hammers in imitation of their parents. Our modern cultures, in which we write, speak, read, build spaceships and go to school, can work only because we are not restricted to the behavior we are born with or learn by trial and error. We can learn a lot by simply watching others."},

{"no": 305, "school": "", "pref": "37", "type": "", "diff": "", "stem": "말할 때 자기 목소리를 지각하는 경로가 몇 개라고 글은 말하는가?", "p": "37-305", "choices": ["다섯 가지", "세 가지", "한 가지", "두 가지"], "ans": 4, "exp": "우리가 자기 목소리를 지각하는 경로는 두 가지라고 했어요. 공기를 지나는 길과 뼈를 지나는 길이지요.\n📖 There are <b>two pathways</b> through which we perceive our own voice when we speak.\n   우리가 말할 때 자기 목소리를 지각하는 경로는 두 가지가 있다.", "b": 1, "bb": "Have you ever been surprised to hear a recording of your own voice? You might have thought, “Is that really what my voice sounds like?” Maybe your accent is more pronounced in the recording than you realized, or your voice is higher than it seems to your own ears. This is of course quite a common experience. The explanation is actually fairly simple. There are two pathways through which we perceive our own voice when we speak. One is the route through which we perceive most external sounds, like waves that travel from the air through the outer, middle and inner ear. But because our vocal cords vibrate when we speak, there is a second internal path. Vibrations are conducted through our bones and stimulate our inner ears directly. Lower frequencies are emphasized along this pathway. That makes your voice sound deeper and richer to yourself than it may sound to other people."},

{"no": 321, "school": "", "pref": "38", "type": "", "diff": "", "stem": "글에 따르면 ‘Analogous’ 형질의 특징으로 가장 적절한 것은?", "p": "38-321", "choices": ["기능도 다르고 생겨난 가지도 서로 다르다", "기능은 다르지만 같은 조상에서 물려받았다", "기능은 같지만 진화 계통의 다른 가지에서 생겨났다", "기능이 같으면서 같은 조상에서 갈라져 나왔다"], "ans": 3, "exp": "유사 형질은 공통의 기능은 있지만 진화 나무의 서로 다른 가지에서 따로 생겨난 것이라고 했어요.\n📖 “Analogous” traits are ones that have a common function but <b>arose on different branches of the evolutionary tree</b>\n   '유사' 형질은 공통의 기능을 갖지만 진화 나무의 다른 가지에서 생겨난 것들이다.", "b": 1, "bb": "Biologists distinguish two kinds of similarity. “Analogous” traits are ones that have a common function but arose on different branches of the evolutionary tree and are in an important sense not “the same” organ. The wings of birds and the wings of bees are both used for flight and are similar in some ways because anything used for flight has to be built in those ways, but they arose independently in evolution and have nothing in common beyond their use in flight. “Homologous” traits, in contrast, may or may not have a common function, but they descended from a common ancestor and hence have some common structure that indicates their being “the same” organ. The wing of a bat and the front leg of a horse have very different functions, but they are all modifications of the forelimb of the ancestor of all mammals. As a result, they share nonfunctional traits like the number of bones and the ways they are connected. To distinguish analogy from homology, biologists usually look at the overall architecture of the organs and focus on their most useless properties."},

{"no": 337, "school": "", "pref": "39", "type": "", "diff": "", "stem": "물의 온도와 용존 산소량의 관계에 대해 글이 말하는 것은?", "p": "39-337", "choices": ["따뜻한 물이 찬물보다 더 많이 담는다", "찬물이 따뜻한 물보다 더 많이 담는다", "물 온도와는 아무 상관이 없다", "깊이에 따라서만 달라진다"], "ans": 2, "exp": "찬물이 따뜻한 물보다 녹은 산소를 더 많이 담는다는 것은 물리학에서 오래전에 밝혀졌다고 했어요.\n📖 <b>cold water holds more dissolved oxygen</b> than warm water does\n   찬물은 따뜻한 물보다 더 많은 용존 산소를 담는다.", "b": 1, "bb": "Seawater contains an abundance of dissolved oxygen that all marine animals breathe to stay alive. It has long been established in physics that cold water holds more dissolved oxygen than warm water does—this is one reason that cold polar seas are full of life while tropical oceans are blue, clear, and relatively poorly populated with living creatures. Thus, as global warming raises the temperature of marine waters, it is self‑evident that the amount of dissolved oxygen will decrease. This is a worrisome and potentially disastrous consequence if allowed to continue to an ecosystem‑threatening level. Now scientists have analyzed data indicating that the amount of dissolved oxygen in the oceans has been declining for more than a half century. The data show that the ocean oxygen level has been falling more rapidly than the corresponding rise in water temperature. Falling oxygen levels in water have the potential to impact the habitat of marine organisms worldwide and in recent years this has led to more frequent anoxic events that killed or displaced populations of fish, crabs, and many other organisms."},

{"no": 353, "school": "", "pref": "40", "type": "", "diff": "", "stem": "두 원숭이가 모두 오이를 받을 때의 반응으로 글이 든 것은?", "p": "40-353", "choices": ["둘 다 기쁘게 오이를 먹는다", "둘 다 돌을 던져 버린다", "서로 오이를 바꿔 먹는다", "오이를 먹지 않고 모아 둔다"], "ans": 1, "exp": "둘 모두 오이를 받을 때는 기분 좋게 오이를 먹는다고 했어요.\n📖 offer them both slices of cucumber for the rocks they already have, <b>they will happily eat the cucumbers</b>\n   이미 가진 돌에 대해 둘 모두에게 오이 조각을 주면, 그들은 기쁘게 오이를 먹는다.", "b": 1, "bb": "Capuchins—New World Monkeys that live in large social groups—will, in captivity, trade with people all day long, especially if food is involved. I give you this rock and you give me a treat to eat. If you put two monkeys in cages next to each other, and offer them both slices of cucumber for the rocks they already have, they will happily eat the cucumbers. If, however, you give one monkey grapes instead—grapes being universally preferred to cucumbers—the monkey that is still receiving cucumbers will begin to throw them back at the experimenter. Even though she is still getting ”paid“ the same amount for her effort of sourcing rocks, and so her particular situation has not changed, the comparison to another makes the situation unfair. Furthermore, she is now willing to abandon all gains—the cucumbers themselves—to communicate her displeasure to the experimenter. According to the passage, if the Capuchin monkey realizes the inequality in rewards compared to another monkey, she will reject her rewards to express her feelings about the treatment, despite getting exactly the same rewards as before."},

{"no": 385, "school": "", "pref": "43-45", "type": "", "diff": "", "stem": "결혼식에 온 다른 손님들의 옷차림에 대해 글이 말하는 것은?", "p": "43-45-385", "choices": ["모두 똑같은 옷을 맞춰 입고 왔다", "저마다 가장 좋은 옷을 입고 왔다", "대부분 수수한 옷차림으로 왔다", "주인이 준 옷으로 갈아입고 왔다"], "ans": 2, "exp": "마을의 부유한 사람들이 많이 왔는데, 그들은 '가장 좋은 옷'을 차려입고 나왔다고 했어요.\n📖 They had come out in their <b>best clothes</b>.\n   그들은 가장 좋은 옷을 차려입고 나왔다.", "b": 1, "bb": "Once upon a time in the Iranian city of Shiraz, there lived the famous poet Sheikh Saadi. Like most other poets and philosophers, he led a very simple life. A rich merchant of Shiraz was preparing for his daughter’s wedding and invited him along with a lot of big businessmen of the town. The poet accepted the invitation and decided to attend. On the day of the wedding, the rich merchant, the host of the wedding, was receiving the guests at the gate. Many rich people of the town attended the wedding. They had come out in their best clothes. The poet wore simple clothes which were neither grand nor expensive. He waited for someone to approach him but no one gave him as much as even a second glance. Even the host did not greet him and looked away. Seeing all this, the poet quietly left the party and went to a shop where he could rent clothes. There he chose a richly decorated coat, which made him look like a new person. With this coat, he entered the party and this time was welcomed with open arms. The host embraced him as he would do to an old friend and complimented him on the clothes he was wearing. The poet did not say a word and allowed the host to lead him to the dining room. The host personally led the poet to his seat and served out chicken soup to him. After a moment, the poet suddenly dipped the corner of his coat in the soup as if he fed it. All the guests were now staring at him in surprise. The host said, ”Sir, what are you doing?“ The poet very calmly replied, ”Now that I have put on expensive clothes, I see a world of difference here. All that I can say now is that this feast is meant for my clothes, not for me.“"},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

// ── QUIZ ──────────────────────────────────────────
function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v2';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 24년 9월 지문 깊이 풀기 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고124년9월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다

  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>

/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

{"no": 5, "school": "상계고", "pref": "19", "type": "제목", "diff": "", "stem": "다음 글의 제목으로 적절하지 않은 것은?", "p": "19-5", "choices": ["A Coach's Harsh Decision", "Hopeful Path to Leadership", "Shattered Hopes on the Court", "The Day My Basketball Dreams Ended", "A Sudden End to My Basketball Journey"], "ans": 2, "exp": "출처: 상계고 · 고1 24년 10월 19번 내신기출", "b": 1, "bb": "As I waited outside the locker room after a hard-fought basketball game, the coach called out to me, \"David, walk with me.\" I figured he was going to tell me something important. He was going to select me to be the captain of the team, the leader I had always wanted to be. My heart was racing with anticipation. But when his next words hit my ears, everything changed. \"We're going to have to send you home,\" he said coldly. \"I don't think you are going to make it.\" I couldn't believe his decision. I tried to hold it together, but inside I was falling apart. A car would be waiting tomorrow morning to take me home. And just like that, it was over."},

{"no": 16, "school": "상명고", "pref": "21", "type": "내용 이해", "diff": "", "stem": "다음 글의 밑줄 친 Seeing is not believing의 사례로 적절하지 않은 것은?", "p": "21-16", "choices": ["Several people described a suspect, but their accounts didn't match. Some said the suspect had a beard, while others he didn't. Their memories of the person were altered by stress or presumptions.", "Siblings often remember the same family trip differently. One may recall it was full of laughter, while the other recalls arguing and tears. Their memories are influenced by how they felt during the trip.", "Two people saw the same car accident. One says the car was red and speeding, but the other says it was blue and moving slowly. Their memories after because they were shaped by their own thoughts and feelings.", "A student saw his friend using a cheat sheet during an exam. Afterward, the teacher discovered the sheet, which contained the friend's handwriting. This confirms that he was indeed cheating, and what he saw is true.", "Many fans recalled a famous K-pop idol wearing a bright red jacket during a performance. However, upon reviewing the video, they discovered that the jacket was actually black. Their memories were likely influenced by the idol's stage lighting or their excitement during the event."], "ans": 4, "exp": "출처: 상명고 · 고1 24년 10월 21번 내신기출", "b": 1, "bb": "When we see something, we naturally and automatically break it up into shapes, colors, and concepts that we have learned through education. We recode what we see through the lens of everything we know. We reconstruct memories rather than retrieving the video from memory. This is a useful trait. It's a more efficient way to store information - a bit like an optimal image compression algorithm such as JPG, rather than storing a raw bitmap image file. People who lack this ability and remember everything in perfect detail struggle to generalize, learn, and make connections between what they have learned. But representing the world as abstract ideas and features comes at a cost of seeing the world as it is. Instead, we see the world through our assumptions, motivations, and past experiences. The discovery that our memories are reconstructed through abstract representations rather than played back like a movie completely undermined the legal primacy of eyewitness testimony. Seeing is not believing."},

{"no": 60, "school": "양곡고", "pref": "23", "type": "내용 이해", "diff": "", "stem": "다음 글의 밑줄 친 (A)에 해당하는 사례로 어울리지 않는 것은?", "p": "23-60", "choices": ["How many books have you read in the past year?", "How many times did you eat out at a restaurant last month?", "In the last week, how many hours of sleep did you get on average each night?", "In the past two month, how many times did you feel connected to the people around you?", "How many times in the past month have you exercised for at least 30 minutes or more?"], "ans": 4, "exp": "출처: 양곡고 · 고1 24년 10월 23번 내신기출", "b": 1, "bb": "Many forms of research lead naturally to quantitative data. A study of happiness might measure the number of times someone smiles during an interaction, and a study of memory might measure the number of items an individual can recall after 1, 5 and 10 minutes. Asking people how many times in a year they are sad will also yield quantitative data, but it might not be reliable. Respondents' recollections may be inaccurate, and their definitions of 'sad' could vary widely. But asking \"How many times in the past year were you sad enough to call in sick to work?\" prompts a concrete answer. Similarly, instead of asking people to rate how bad a procrastinator they are, ask, \"How many of your utility bills are you currently late in paying, even though you can afford to pay them?\" (A)Questions that seek concrete responses help make abstract concepts clearer and ensure consistency from one study to the next."},
{"no": 61, "school": "상계고", "pref": "23", "type": "내용 이해", "diff": "", "stem": "다음 글의 괄호 (A), (B), (C) 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "p": "23-61", "choices": ["reliable — similar — vague", "reliable — differing — vague", "unreliable — differing — specific", "unreliable — similar — specific", "unreliable — differing — vague"], "ans": 3, "exp": "출처: 상계고 · 고1 24년 10월 23번 내신기출", "b": 1, "bb": "Certain types of research naturally produce quantitative data. For example, a study on happiness might count how often a person smiles during a conversation, while a memory study could measure how many items someone recalls after different time intervals. However, some quantitative data may be (A)[reliable / unreliable]. Asking individuals how many times they felt sad in a year could lead to inaccurate responses due to memory lapses or (B)[similar / differing] interpretations of sadness. A more concrete question, like \"How many times in the past year were you sad enough to call in sick to work?\" provides clearer, more reliable answers. Likewise, instead of asking people to rate their level of procrastination, a more (C)[vague / specific] question – such as \"How many utility bills are you currently late in paying, despite having the means to pay them?\" – yields measurable results. Concrete questions help clarify abstract concepts and ensure consistency across studies."},

{"no": 121, "school": "옥련여고", "pref": "29", "type": "흐름", "diff": "", "stem": "다음 글에서 전체 흐름과 관계없는 문장은?", "p": "29-121", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 4, "exp": "출처: 옥련여고 · 고1 24년 10월 29번 내신기출", "b": 1, "bb": "Digital technologies are fundamentally tied to metaphors, but they differ significantly from linguistic metaphors. Linguistic metaphors are passive, requiring the audience to consciously engage with the proposed idea. ⓐFor example, in Shakespeare's metaphor \"time is a beggar,\" understanding it needs cognitive effort and deeper engagement with the text. ⓑConversely, technological metaphors are active and often forceful, as they are realized in digital artifacts that actively influence users' perceptions. ⓒCreators of technology cannot expect users to wonder how the metaphor operates; instead, the technology's appeal lies in its apparent usefulness. ⓓFor this reason, users have difficulty using technologies without cognitive effort or even awareness. ⓔIn contrast, Shakespeare is cherished partly because his works demand thoughtful consideration, making their meanings less immediately clear."},
{"no": 122, "school": "사우고", "pref": "30", "type": "내용 이해", "diff": "", "stem": "다음 글을 읽고 추론한 내용으로 옳은 것은?", "p": "30-122", "choices": ["Discovering how to efficiently analyze the human brain, Herbert Simon won the Novel Prize.", "We don't need to understand how things like computers or toilets work because we are discouraged from learning how to use them.", "By transmitting information through artificial intelligence, society solves complex problems.", "Everyone is directly involved in the giant calculation, holding more information than we have mental capacity for.", "Individuals make modest computations that add up to larger solutions."], "ans": 5, "exp": "출처: 사우고 · 고1 24년 10월 30번 내신기출", "b": 1, "bb": "Herbert Simon won his Nobel Prize for recognizing our limitations in information, time, and cognitive capacity. As we lack the resources to compute answers independently, we distribute the computation across the population and solve the answer slowly, generation by generation. Then all we have to do is socially learn the right answers. You don't need to understand how your computer or toilet works; you just need to be able to use the interface and flush. All that needs to be transmitted is which button to push ─ essentially how to interact with technologies rather than how they work. And so instead of holding more information than we have mental capacity for and indeed need to know, we could dedicate our large brains to a small piece of a giant calculation. We understand things well enough to benefit from them, but all the while we are making small calculations that contribute to a larger whole. We are just doing our part in a larger computation for our societies' collective brains."},

{"no": 141, "school": "한영고", "pref": "31", "type": "내용 이해", "diff": "", "stem": "윗글 (A), (B)의 내용으로 언급되지 않은 것은?", "p": "31-141", "choices": ["Most octopus species primarily rely on camouflage and tend to hunt during the night.", "Octopuses have excellent eyesight and the ability to change colors and patterns.", "Octopuses tend to use the flounder by transforming themselves into the shape of sea snakes.", "Octopuses are known to have quite high intelligence and have also been found to have the ability to navigate the maze.", "Octopuses are known to be able to distinguish shapes, patterns, and colors and to learn observations."], "ans": 3, "exp": "출처: 한영고 · 고1 24년 10월 31번 내신기출", "b": 1, "bb": "(B) It might seem unexpected for some people, but the octopus has long been regarded for its high intelligence. Studies have shown an ability to navigate mazes and excel in problem-solving experiments that test both long and short-term memory. They have a high capacity for learning and they have very few fixed, pre-programmed responses. Rather, they react to stimuli and problems in a variety of ways and can even discern what is necessary to learn in order to progress. When attempting to eat a clam, octopuses will pry them open, or use their beaks to either chip away at the shell or drill into the meat. When researchers actively blocked one of these methods, binding the calm shut, for instance, they observed young octopuses quickly adjust and try a more successful technique. How they learn these strategies is a mystery since they are not taught by their mothers after their eggs hatch. Octopuses have been recorded actively distinguishing between various shapes, patterns, and colors. Not only are they known to practice observational learning, but they have been seen participating in play."},
{"no": 142, "school": "청라고", "pref": "31", "type": "내용 이해", "diff": "", "stem": "다음 글에서 밑줄 친 to create the illusion이 의미하는 바로 가장 적절한 것은?", "p": "31-142", "choices": ["to hunt for the flounder nearby", "to hide behind the surrounding rocks", "to pose for the underwater photographers", "to camouflage itself into some other creatures", "to form a temporary elbow, bending to draw objects toward its mouth"], "ans": 4, "exp": "출처: 청라고 · 고1 24년 10월 31번 내신기출", "b": 1, "bb": "The best defence most species of octopus have is to stay hidden as much as possible and do their own hunting at night. So to find one in full view in the shallows in daylight was a surprise for two Australian underwater photographers. Actually, what they saw at first was a flounder. It was only when they looked again that they saw a medium-sized octopus, with all eight of its arms folded and its two eyes staring upwards to create the illusion. An octopus has a big brain, excellent eyesight and the ability to change colour and pattern, and this one was using these assets to turn itself into a completely different creature. Many more of this species have been found since then, and there are now photographs of octopuses that could be said to be transforming into sea snakes. And while they mimic, they hunt – producing the spectacle of, say, a flounder suddenly developing an octopodian arm, sticking it down a hole and grabbing whatever's hiding there."},

{"no": 158, "school": "한영고", "pref": "31", "type": "제목", "diff": "", "stem": "윗글 (B)의 제목으로 가장 적절한 것은?", "p": "31-158", "choices": ["Different Learning Methods by Octopuses", "Various Examples of High Intelligence Utilization of Octopuses", "The Process by Which Young Octopuses Grow Gradually", "Why Do Octopuses Have to Be Familiar with Various Learning Methods", "Why Octopus's Ability to Perceive Sight is The Top Priority"], "ans": 2, "exp": "출처: 한영고 · 고1 24년 10월 31번 내신기출", "b": 1, "bb": "(B) It might seem unexpected for some people, but the octopus has long been regarded for its high intelligence. Studies have shown an ability to navigate mazes and excel in problem-solving experiments that test both long and short-term memory. They have a high capacity for learning and they have very few fixed, pre-programmed responses. Rather, they react to stimuli and problems in a variety of ways and can even discern what is necessary to learn in order to progress. When attempting to eat a clam, octopuses will pry them open, or use their beaks to either chip away at the shell or drill into the meat. When researchers actively blocked one of these methods, binding the calm shut, for instance, they observed young octopuses quickly adjust and try a more successful technique. How they learn these strategies is a mystery since they are not taught by their mothers after their eggs hatch. Octopuses have been recorded actively distinguishing between various shapes, patterns, and colors. Not only are they known to practice observational learning, but they have been seen participating in play."},

{"no": 160, "school": "연수고", "pref": "31", "type": "제목", "diff": "", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "31-160", "choices": ["A Cunning Animal: Octopus Intelligence Sheds Light on Evolution of Complex Brains", "Octopus Vs Underwater Maze The Unusual Locomotion of Invertebrates", "Master of Disguise: The Octopus That Transforms to Hunt and Survive", "Super Powers: What Octopuses Utilize for Prediction", "How Does an Octopus Change Its Skin Textures?"], "ans": 3, "exp": "출처: 연수고 · 고1 24년 10월 31번 내신기출", "b": 1, "bb": "For most octopus species, the best defense is to remain as inconspicuous as possible, hunting under the cover of darkness. So, encountering one in broad daylight, fully visible in the shallows, was an extraordinary moment for two Australian underwater photographers. At first, they believed they were looking at a flounder. But upon closer inspection, the \"flounder\" revealed itself to be a medium-sized octopus, cleverly folded and posed, with its two eyes staring upward to create the illusion. This particular octopus was using its remarkable abilities to mimic a completely different creature, fooling unsuspecting prey into thinking the octopus was a different animal, developing an octopodian arm, sticking it down a hole and grabbing whatever's hiding there. Since this initial discovery, researchers have identified more of this species, known as the mimic octopus. They are renowned for their intelligence, exceptional eyesight, and unparalleled ability to change their color and pattern. Photographs now document octopuses transforming into sea snakes, a tactic likely meant to intimidate predators."},

{"no": 164, "school": "연수고", "pref": "32", "type": "내용 불일치", "diff": "", "stem": "다음 글의 내용과 일치하지 않는 것은?", "p": "32-164", "choices": ["The extent of our suffering depends on the way we perceive and interpret pain in our cognition.", "When 1500m athletes push their limits to win a race, they cannot avoid intense psychological pain and suffering.", "Ultra-marathon runners are individuals bold enough to push themselves past the usual limits of human perseverance.", "Ultra-marathon runners mention learning to embrace and coexist with their pain, considering it a friend.", "Patients consider intense pressure on painful back areas as good pain when they trust in the effectiveness of the therapy."], "ans": 2, "exp": "출처: 연수고 · 고1 24년 10월 32번 내신기출", "b": 1, "bb": "How much we suffer relates to how we frame the pain in our mind. When 1500m runners push themselves into extreme pain to win a race – their muscles screaming and their lungs exploding with oxygen deficit, they don't psychologically suffer much. In fact, ultra-marathon runners – those people who are crazy enough to push themselves beyond the normal boundaries of human endurance, covering distances of 50-100km or more over many hours, talk about making friends with their pain. When a patient has paid for, some form of passive back pain therapy and the practitioner pushes deeply into a painful part of a patient's back to mobilise it, the patient calls that good pain if he or she believes this type of deep pressure treatment will be of value, even though the practitioner is pushing right into the patient's sore tissues."},

{"no": 177, "school": "청원고", "pref": "33", "type": "내용 불일치", "diff": "", "stem": "다음 글의 내용과 일치하지 않는 것은?", "p": "33-177", "choices": ["It is difficult to fully capture consumers' willingness to pay with only one version of a product.", "Most consumers are sensitive to price and are likely to choose the cheaper basic version between two versions.", "When there are three versions, the sales of the mid-range model actually increase.", "Consumers admire the attractive features of the top-tier model but find its price burdensome.", "Consumers choose the mid-range model as a reasonable option, driven by the least expensive model."], "ans": 5, "exp": "출처: 청원고 · 고1 24년 10월 33번 내신기출", "b": 1, "bb": "When I worked for a large electronics company that manufactured laser and inkjet printers, I soon discovered why there are often three versions of many consumer goods. If the manufacturer makes only one version of its product, people who bought it might have been willing to spend more money, so the company is losing some income. If the company offers two versions, one with more features and more expensive than the other, people will compare the two models and still buy the less expensive one. But if the company introduces a third model with even more features and more expensive than the other two, sales of the second model go up; many people like the features of the most expensive model, but not the price. The middle item has more features than the least expensive one, and it is less expensive than the fanciest model. They buy the middle item, unaware that they have been manipulated by the presence of the higher-priced item."},

{"no": 214, "school": "매원고", "pref": "35", "type": "내용 불일치", "diff": "", "stem": "다음 글의 내용과 일치하지 않는 것은?", "p": "35-214", "choices": ["The current water crisis is political and thus not an unavoidable fate.", "A scarce resource like water has been turned into a sufficient commodity due to factors like government's lack of concern.", "A water crisis is unnecessary, yet it persists, and little action is being taken to resolve it.", "In certain urban areas, more water is wasted through leaks than is supplied to residents.", "Losses from leaks and theft are estimated at 16 percent of freshwater in the U.S."], "ans": 2, "exp": "출처: 매원고 · 고1 24년 10월 35번 내신기출", "b": 1, "bb": "Today, the water crisis is political – which is to say, not inevitable or beyond our capacity to fix – and, therefore, functionally elective. That is one reason it is nevertheless distressing: an abundant resource made scarce through governmental neglect and indifference, bad infrastructure and contamination, and careless urbanization. There is no need for a water crisis, in other words, but we have one anyway, and aren't doing much to address it. Some cities lose more water to leaks than they deliver to homes: even in the United States, leaks and theft account for an estimated loss of 16 percent of freshwater; in Brazil, the estimate is 40 percent. Seen in both cases, as everywhere, the selective scarcity clearly highlights have-and-have-not inequities, leaving 2.1 billion people without safe drinking water and 4.5 billion without proper sanitation worldwide."},

{"no": 219, "school": "월봉고", "pref": "35", "type": "문맥 어휘", "diff": "", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "35-219", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 5, "exp": "출처: 월봉고 · 고1 24년 10월 35번 내신기출", "b": 1, "bb": "Today, the water crisis, which is a political and therefore elective issue rather than an ⓐinevitable one, has turned what should be an abundant resource into a scarce commodity through governmental neglect, infrastructural decay, and reckless urbanization. This scarcity, which ⓑpersists even though there is no inherent need for such a crisis, is worsened in cities that lose more water through leaks than they deliver to households, with countries like the United States and Brazil losing an estimated 16 and 40 percent of freshwater, respectively. As this selectively created shortage continues, its consequences – felt most severely by those who lack economic and political power – ⓒhighlight global inequities, leaving 2.1 billion people without safe drinking water and 4.5 billion without adequate sanitation, a reality that few governments seem ⓓwilling to confront. And unless nations commit to repairing the systems that continue to fail their citizens, the gap between those who have clean water and those who do not will only ⓔnarrow, deepening the injustices that this crisis has already laid bare."},

{"no": 227, "school": "공항고", "pref": "36", "type": "내용 이해", "diff": "", "stem": "다음 글에서 밑줄 친 It was a matter of survival이 의미하는 바로 가장 적절한 것은?", "p": "36-227", "choices": ["The ability to manage emotions played a crucial role in human survival.", "We had to respond sensitively to the environment, maintaining a safe way of living.", "Developing one's personal strengths was a key requirement for achieving success.", "Managing relationships well within a group was essential for staying alive and reproducing.", "It is necessary to raise one's value by making use of the resources and support available around us."], "ans": 4, "exp": "출처: 공항고 · 고1 24년 10월 36번 내신기출", "b": 1, "bb": "As individuals, our ability to thrive depended on how well we navigated relationships in a group. If the group valued us, we could count on support, resources, and probably a mate. If it didn't, we might get none of these merits. It was a matter of survival, physically and genetically. Over millions of years, the pressure selected for people who are sensitive to and skilled at maximizing their standing. The result was the development of a tendency to unconsciously monitor how other people in our community perceive us. We process that information in the form of self-esteem and such related emotions as pride, shame, or insecurity. These emotions compel us to do more of what makes our community value us and less of what doesn't. And, crucially, they are meant to make that motivation feel like it is coming from within. If we realized, on a conscious level, that we were responding to social pressure, our performance might come off as grudging or cynical, making it less persuasive."},

{"no": 246, "school": "한영고", "pref": "37", "type": "내용 이해", "diff": "", "stem": "다음 글을 읽고 지문의 내용과 관련하여 생성형 인공지능(Artificial Intelligence)에게 추가적인 질문을 한다고 할 때, 질문의 내용으로 가장 어색한 것은?", "p": "37-246", "choices": ["What are the alternative theories explaining the causes of depression?", "How does consciousness influence our mental health?", "Can lifestyle changes help improve our state of consciousness?", "What are the reasons people fall into the alerting response and what kinds of pleasures do they experience as a result?", "What are some potential implications of viewing depression as a distortion of consciousness rather than a neurotransmitter imbalance?"], "ans": 4, "exp": "출처: 한영고 · 고1 24년 10월 37번 내신기출", "b": 1, "bb": "Conventional medicine has long believed that depression is caused by an imbalance of neurotransmitters in the brain. However, there is a major problem with this explanation. This is because the imbalance of substances in the brain is a consequence of depression, not its cause. In other words, depression causes a decrease in brain substances such as serotonin and noradrenaline, not a decrease in brain substances causes depression. In this revised cause-and-effect, the key is to reframe depression as a problem of consciousness. Our consciousness is a more fundamental entity that goes beyond the functioning of the brain. The brain is no more than an organ of consciousness. If it is not consciousness itself, then the root cause of depression is also a distortion of our state of consciousness: a consciousness that has lost its sense of self and the meaning of life. Such a disease of consciousness may manifest itself in the form of depression."},

{"no": 290, "school": "상명고", "pref": "40", "type": "내용 이해", "diff": "", "stem": "다음 글의 괄호 (A)~(C)에 들어갈 말로 바르게 짝지어진 것은?", "p": "40-290", "choices": ["effectual — compliment — perceptible", "effectual — rebuke — unseen", "effectual — rebuke — perceptible", "ignorant — compliment — unseen", "ignorant — rebuke — perceptible"], "ans": 2, "exp": "출처: 상명고 · 고1 24년 10월 40번 내신기출", "b": 1, "bb": "Punishing a child may not be (A)[effectual / ignorant] due to what Alvaro Bilbao, a neuropsychologist, calls 'trick-punishments.' A trick-punishment is a (B)[rebuke / compliment], a moment of anger or a punishment in the most classic sense of the word. Instead of discouraging the child from doing something, it encourages them to do it. For example, Hugh learns that when he hits his little brother, his mother scolds him. For a child who feels lonely, being scolded is much better than feeling (C)[perceptible / unseen], so he will continue to hit his brother. In this case, his mother would be better adopting a different strategy. For instance, she could congratulate Hugh when he has not hit his brother for a certain length of time. The mother clearly cannot allow the child to hit his little brother, but instead of constantly pointing out the negatives, she can choose to reward the positives. In this way, any parent can avoid trick-punishments."},

{"no": 304, "school": "계산고", "pref": "41", "type": "문장 삽입", "diff": "", "stem": "글의 흐름으로 보아, 아래 주어진 문장이 들어가기에 가장 적절한 곳은? [계산고]", "p": "41-304", "choices": ["ⓐ", "ⓑ", "ⓒ", "ⓓ", "ⓔ"], "ans": 1, "exp": "출처: 계산고 · 고1 24년 10월 41번 내신기출", "b": 1, "bb": "From an early age, we assign purpose to objects and events, preferring this reasoning to random chance. Children assume, for instance, that pointy rocks are that way because they don't want you to sit on them. When we encounter something, we first need to determine what sort of thing it is. Inanimate objects and plants generally do not move and can be evaluated from physics alone. ( ⓐ ) This was essential in our hunter-gatherer days to avoid being eaten by predators. The anthropologist Stewart Guthrie made the point that survival in our evolutionary past meant that we interpret ambiguous objects as agents with human mental characteristics, as those are the mental processes which we understand. ( ⓑ ) Ambiguous events are caused by such agents. This results in a perceptual system strongly biased towards anthropomorphism. ( ⓒ ) Therefore, we tend to assume intention even where there is none. ( ⓓ ) This would have arisen as a survival mechanism. If a lion is about to attack you, you need to react quickly, given its probable intention to kill you. ( ⓔ ) By the time you have realized that the design of its teeth and claws could kill you, you are dead. So, assuming intent, without detailed design analysis or understanding of the physics, has saved your life."},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/([①②③④⑤])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){

  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`

        ${typeBadge}

        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{

  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.textContent='💡 '+q.exp;fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v3';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 24년 10월 전국기출 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고124년10월_전국기출',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>

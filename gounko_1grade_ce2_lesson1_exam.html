 to believe me or not, but apparently Ambon is going to sink in the next few days.” Many displaced people were so anxious about aftershocks that the government had to announce that the information was fake.", "opts": ["Gina intentionally spread fake news about an earthquake to gain attention.", "Fake news is often created by governments to warn people during disasters.", "Fake news can confuse and harm both individuals and society.", "After the earthquake in Ambon, people returned to their homes immediately.", "The government confirmed that a tsunami was expected to hit after the quake."], "answer": 3, "expl": "가짜 뉴스는 사람들을 혼란스럽게 하고, 사회를 어지럽히 고, 심지어 관련된 모든 개인뿐만 아니라 대중에게 심각하게 해를 끼 칠 수 있다고 하였으므로, ③ '가짜 뉴스는 개인과 사회 모두를 혼란스 럽게 하고 해를 끼칠 수 있다'는 글의 내용과 일치한다. [오답] ① 지 나는 관심을 끌기 위해 지진에 관한 가짜 뉴스를 의도적으로 퍼뜨렸 다. ② 가짜 뉴스는 재난 시 사람들에게 경고하기 위해 정부가 자주 만 든다. ④ 암본 지진 후 사람들은 즉시 집으로 돌아갔다. ⑤ 정부는 지 진 후 쓰나미가 올 것이라고 확인했다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-2", "passage": "Unfortunately, becoming an accidental distributor of fake news like Gina is not unusual. Fake news is a deliberate attempt to manipulate people by spreading inaccurate information. It is made by certain groups with the intention of attracting people’s attention, making profits, or gaining political benefits. It can confuse people, disturb society, and even seriously harm the public as well as all individuals involved. It is very common for fake news to spread during states of emergency. For example, after an earthquake measuring 6.5 struck Ambon, Indonesia, in September 2019, thousands of residents did not return to their homes and were still in shelters for two weeks. This was because of fake news stories on social media that another earthquake followed by a tsunami was about to strike. One of those messages said, “It’s up to you if you want to believe me or not, but apparently Ambon is going to sink in the next few days.” Many displaced people were so anxious about aftershocks that the government had to announce that the information was fake.", "opts": ["Fake news intentionally deceives the public to serve the agendas of specific groups, such as financial gain or political advantage.", "During crises, misinformation tends to propagate quickly, often exacerbating public fear and social disruption.", "Following the 2019 Ambon earthquake, false reports about imminent natural disasters caused people to avoid returning to their homes for an extended period.", "The government confirmed that the circulating messages about Ambon sinking were verified warnings from official sources.", "Accidental involvement in spreading false information is a frequent occurrence, exemplified by individuals like Gina."], "answer": 4, "expl": "정부는 암본이 침몰한다는 메시지가 가짜 뉴스임을 밝 혔으며, 공식 경고가 아니었으므로, ④ '정부는 암본이 침몰할 것이라 는 메시지가 공식 출처의 검증된 경고임을 확인했다'는 본문의 내용과 일치하지 않는다. [오답노트] ① 가짜 뉴스는 특정 집단이 재정적 이 득이나 정치적 이익을 위해 대중을 속이려는 의도로 만든다. ② 위기 상황에서 잘못된 정보가 빠르게 퍼져 공포와 사회 혼란을 심화시킨다. ③ 2019년 암본 지진 후 임박한 자연재해에 대한 거짓 보도로 사람들 이 오랜 기간 집에 돌아가지 않았다. ⑤ 지나와 같은 개인이 가짜 뉴스 를 퍼뜨리는 데 우연히 연루되는 경우가 빈번히 발생한다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "1-3", "passage": "Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average. One explanation for this phenomenon is that people like new and provocative things. When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. Also, fake news goes viral because people in their daily lives tend to think simply and effortlessly. It is more likely for them to believe new information without any proof, instead of critically examining it. Moreover, people are inclined to believe information that fits their prejudices or experiences even when not true. In this process, people easily fall into the trap of “confirmation bias.” That is, they selectively accept news in a way that only confirms their beliefs and ignore news that doesn’t support them. During election season, for example, people tend to blindly believe any news describing their favored candidates in a positive way, while unconsciously believing news that reports something negative about other candidates.", "opts": ["A study showed that fake news spreads online at the same speed as true news.", "People tend to avoid surprising or provocative news on social media.", "Fake news spreads partly because people like to be the first to share unusual information.    ", "Most people critically examine new information before believing it.", "Confirmation bias helps people recognize the flaws in their own beliefs."], "answer": 3, "expl": "사람들은 아직 알려지지 않았지만 아마도 거짓일 수 있 는 정보를 게시한 첫 번째 사람이기 때문에 주목을 받을 수 있다고 하 였으므로, ③ '사람들이 특이한 정보를 가장 먼저 공유하기 좋아하기 때문에 가짜 뉴스가 퍼진다'는 글의 내용과 일치한다. [오답] ① 연구 결과 가짜 뉴스는 진짜 뉴스와 같은 속도로 퍼진다. ② 사람들은 소셜 미디어에서 놀랍거나 자극적인 뉴스를 피하는 경향이 있다. ④ 대부분 사람들은 새 정보를 믿기 전에 비판적으로 검토한다. ⑤ 확증 편향은 사람들이 자신의 믿음의 오류를 인식하는 데 도움을 준다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "1-3", "passage": "Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average. One explanation for this phenomenon is that people like new and provocative things. When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, th re the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. ______ ______ Also, fake news goes viral because people in their daily lives tend to think simply and effortlessly. It is more likely for them to believe new information without any proof, instead of critically examining it. Moreover, people are inclined to believe information that ______ . In this process, people easily fall into the trap of “confirmation bias.” That is, they selectively accept news in a way that only confirms their beliefs and ignore news that doesn’t support them. During election season, for example, people tend to blindly believe any news describing their favored candidates in a positive way, while unconsciously believing news that reports something negative about other candidates.", "opts": ["is confirmed by reliable sources", "is negative but true information", "has been widely believed for a long period of time", "tends to negatively affect them or their social relations", "confirms their biases or past experiences, regardless of its accuracy"], "answer": 5, "expl": "빈칸 앞과 뒤에서 가짜 뉴스여도 자신의 신념과 맞는 것 은 받아들이고 그렇지 않은 것은 무시한다고 하였으므로, 빈칸에 들어 갈 말로 가장 적절한 것은 ⑤ '그것들의 정확성과 상관없이 신념들이 나 과거의 경험들을 확증하는'이다. <변형> fits their prejudices or experiences even when not true", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-3", "passage": "Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average. One explanation for this phenomenon is that ______ . When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. Also, fake news goes viral because people in their daily lives tend to think simply and effortlessly. It is more likely for them to believe new information without any proof, instead of critically examining it.", "opts": ["readers prefer familiar facts over shocking news", "audiences only trust verified mainstream sources", "people are drawn to fresh and sensational content", "people hesitate to share controversial information", "users find ungrounded stories too risky to believe"], "answer": 3, "expl": "가짜 뉴스가 빠르게 퍼지는 이유 중 하나는 사람들이 놀랍고 자극적인 새 정보를 좋아하고 공유하고 싶어하기 때문이라고 언급되므로, 빈칸에 들어갈 말로 ③ '사람들은 신선하고 선동적인 내 용에 이끌린다'가 가장 적절하다. [빈칸 원문] people like new and provocative things", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-3", "passage": "Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average. One explanation for this phenomenon is that people like new and provocative things. When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. Also, fake news goes viral because people in their daily lives ______ . It is more likely for them to believe new information without any proof, instead of critically examining it.", "opts": ["prefer to ignore news that matches their beliefs", "avoid any content that seems exaggerated or false", "discuss conflicting opinions before they accept them", "are prone to process ideas in a quick and shallow manner", "make every effort to verify what they come across online"], "answer": 4, "expl": "가짜 뉴스가 쉽게 퍼지는 또 다른 이유는 사람들이 정 보를 비판적으로 따지기보다는 증거 없이 믿으려하기 때문이라는 맥 락이므로, 빈칸에 들어갈 말로 ④ '아이디어를 빠르고 피상적으로 처 리하는 경향이 있다'가 가장 적절하다. [빈칸 원문] tend to think simply and effortlessly", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-3", "passage": "Fake news on social media spreads significantly farther and faster than true stories. A study by the Massachusetts Institute of Technology in the US has shown that fake news spreads online 6 times faster than real news on average. One explanation for this phenomenon is that people like new and provocative things. When information is astonishing, people not only feel that it is surprising, but they also want to share the stimulating news with others. By passing it to others on social media, they can gain attention because they are the first to post previously unknown, but possibly false, information. Also, fake news goes viral because people in their daily lives tend to think simply and effortlessly. It is more likely for them ______ . Moreover, people are inclined to believe information that fits their prejudices or experiences even when not true. In this process, people easily fall into the trap of “confirmation bias.” That is, they selectively accept news in a way that only confirms their beliefs and ignore news that doesn’t support them. During election season, for example, people tend to blindly believe any news describing their favored candidates in a positive way, while unconsciously believing news that reports something negative about other candidates.", "opts": ["to ignore new information that is not provocative", "to distrust information that supports their existing beliefs", "to critically analyze all information regardless of its source", "to question everything they read, including true information    ", "to believe new information without any proof, instead of critically examining it"], "answer": 5, "expl": "빈칸 앞에서 “사람들은 일상생활에서 단순하고 수월하 게 생각하는 경향이 있기 때문에 가짜 뉴스가 더 빨리 퍼진다”라고 언 급되어 있으므로, 빈칸에 들어가기에 가장 적절한 것은 ⑤ ‘증거 없이 새로운 정보를 비판적으로 검토하지 않고 믿는 것’이다. [오답] ① 자 극적이지 않은 새로운 정보를 무시하는 것 ② 기존 신념을 지지하는 정보를 불신하는 것 ③ 출처와 상관없이 모든 정보를 비판적으로 분석 하는 것 ④ 진실인 정보도 포함해 읽는 모든 것을 의심하는 것", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "1-4", "passage": "With so much information on the Internet, how can you make sure that fake news does not mislead you? First, read beyond the provocative headlines. They can be so stimulating to get more clicks that you may click on them accidentally. So don’t just read the headlines, but read the text carefully. Second, don’t read the news at face value. Exercise ______ skills to judge the news. You should question, analyze, and evaluate what you read. Third, examine your biases. Consider if your own beliefs could affect your judgment. Ask yourself if you are only reading articles that suit your opinion, and look for articles that oppose your opinion as well. Finally, check the credibility of the source. You should examine who wrote the news story and what the intent was behind writing the news story. You also need to check whether the news story is from a reliable media source and the evidence is valid. In the digital age, it might be impossible to avoid or eliminate all false information that spreads online. However, if you have the ability to view information critically and objectively, you will be able to reduce the damage that fake news can cause. Don’t forget! Anyone can be the next person producing or spreading fake news!", "opts": ["media diversity", "critical thinking", "political neutrality", "intellectual property", "high-speed connectivity"], "answer": 2, "expl": "빈칸 뒤에서 비판적이고 객관적으로 정보를 바라보는 능력을 가지면 가짜 뉴스가 유발하는 피해를 줄일 수 있을 것이라고 하였으므로, 빈칸에 들어갈 말로 가장 적절한 것은 ② '비판적인 생 각'이다.", "inline": false, "short": false, "summary": "", "given": "", "lead": "", "parts": []}, {"q" ly believe any news describing their favored candidates in a positive way, while unconsciously believing news that reports something negative about other candidates."}]}, {"q": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "tag": "1-4", "passage": "", "opts": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "answer": 5, "expl": "", "inline": false, "short": false, "summary": "", "given": "", "lead": "With so much information on the Internet, how can you make sure that fake news does not mislead you? First, read beyond the provocative headlines. They can be so stimulating to get more clicks that you may click on them accidentally.", "parts": [{"label": "(A)", "text": "In the digital age, it might be impossible to avoid or eliminate all false information that spreads online. However, if you have the ability to view information critically and objectively, you will be able to reduce the damage that fake news can cause. Don’t forget! Anyone can be the next person producing or spreading fake news!"}, {"label": "(B)", "text": "Ask yourself if you are only reading articles that suit your opinion, and look for articles that oppose your opinion as well. Finally, check the credibility of the source. You should examine who wrote the news story and what the intent was behind writing the news story. You also need to check whether the news story is from a reliable media source and the evidence is valid."}, {"label": "(C)", "text": "So don’t just read the headlines, but read the text carefully. Second, don’t read the news at face value. Exercise critical thinking skills to judge the news. You should question, analyze, and evaluate what you read. Third, examine your biases. Consider if your own beliefs could affect your judgment."}]}, {"q": "주어진 두 글 사이에 제시된 (A)~(D)의 문장을 알맞은 순서로 배열한 것은?", "tag": "1-본문(all)", "passage": "", "opts": ["A) - (C) - (B) - (D)", "B) - (A) - (D) - (C)", "C) - (D) - (A) - (B)", "D) - (A) - (C) - (B)", "D) - (B) - (A) - (C) let school='', name='', round=null, qs=[], idx=0, cor=0, wrongs=[], answered=false, t0=0, retry=false;

function el(id){return document.getElementById(id);}

function renderRounds(){

function pickRound(r){

  const box=el('cntBtns'); box.innerHTML='';
  const opts=[10,20,round.questions.length].filter((v,i,a)=>v<=round.questions.length&&a.indexOf(v)===i);
  opts.forEach(n=>{
    const b=document.createElement('button');
    b.className='rbtn';
    b.innerHTML='<span class="rno">'+(n===round.questions.length?'전체':n)+'</span><span><span class="rttl">'
      +n+'문항 풀기</span><span class="rsub">'+(n===round.questions.length?'이 라운드 전부':'무작위로 '+n+'문항')+'</span></span>';

function backToRounds(){show('scStart');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(n){
  qs=shuffle(round.questions).slice(0,n);
  idx=0;cor=0;wrongs=[];retry=false;t0=Date.now();
  el('topT').textContent=round.emoji+' '+round.title;
  show('scQuiz'); draw();
}
function draw(){
  if(idx>=qs.length){result();return;}
  answered=false;
  const q=qs[idx];
  el('topC').textContent=(idx+1)+'/'+qs.length;
  el('fill').style.width=(idx/qs.length*100)+'%';
  const CIR='①②③④⑤';
  if(q.short){ drawShort(q); return; }
  const inline = !q.opts || q.opts.length===0;
  let psg = psgHtml(q.passage);
  if(inline) psg = psg.replace(/[①②③④⑤]/g, m=>'<b class="mk">'+m+'</b>');   // 밑줄형 표시 강조
  const blocks =
     (q.given?'<div class="givbox"><div class="sumlbl blue">📌 주어진 문장</div>'+esc(q.given)+'</div>':'')
    +(q.lead?'<div class="psg"><span class="plbl">주어진 글</span>'+esc(q.lead)+'</div>':'')
    +((q.parts&&q.parts.length)?'<div class="parts">'+q.parts.map(function(pt){
        return '<div class="part"><span class="plabel">'+esc(pt.label)+'</span>'+esc(pt.text)+'</div>';}).join('')+'</div>':'');
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+esc(q.tag)+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +blocks
    +(q.passage?'<div class="psg">'+psg+'</div>':'')
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +(inline?'<div class="hint">지문에서 번호가 붙은 부분을 보고 답을 고르세요</div>':'')
    +'<div class="'+(inline?'opts inline':'opts')+'" id="opts"></div><div class="fb" id="fb"></div>';
  const box=el('opts');
  if(inline){
    for(let i=0;i<5;i++){
      const b=document.createElement('button');
      b.className='opt num';
      b.innerHTML='<span class="on">'+CIR[i]+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    }
  } else {
    q.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML='<span class="on">'+CIR[i]+'</span><span>'+esc(o)+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    });
  }
  window.scrollTo(0,0);
}

function normalize(t){
  return String(t||'').toLowerCase()
    .replace(/[‘’“”]/g,"'")
    .replace(/[^a-z0-9가-힣]+/g,' ').trim();
}
function drawShort(q){
  const blocks =
     (q.given?'<div class="givbox"><div class="sumlbl blue">📌 주어진 문장</div>'+esc(q.given)+'</div>':'')
    +(q.lead?'<div class="psg"><span class="plbl">주어진 글</span>'+esc(q.lead)+'</div>':'')
    +((q.parts&&q.parts.length)?'<div class="parts">'+q.parts.map(function(pt){
        return '<div class="part"><span class="plabel">'+esc(pt.label)+'</span>'+esc(pt.text)+'</div>';}).join('')+'</div>':'');
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+q.tag+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +blocks
    +(q.passage?'<div class="psg">'+psgHtml(q.passage)+'</div>':'')
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +'<div class="hint">답을 직접 입력한 뒤 [답 확인]을 누르세요</div>'
    +'<textarea class="inp" id="sans" rows="3" placeholder="여기에 답을 쓰세요"></textarea>'
    +'<button class="btn" style="margin-top:10px" id="schk">답 확인하기</button>'
    +'<div class="fb" id="fb"></div>';
  el('schk').onclick=()=>checkShort(q);
  el('sans').focus();
  window.scrollTo(0,0);
}
function checkShort(q){
  if(answered) return;
  const mine=el('sans').value.trim();
  if(!mine){ alert('답을 입력해 주세요!'); return; }
  answered=true;
  el('sans').disabled=true; el('schk').disabled=true;
  const ok = normalize(mine)===normalize(q.answer);
  const fb=el('fb');
  fb.className = ok?'fb y':'fb n';
  fb.innerHTML = (ok?'✅ 정답입니다!':'❌ 정답과 다릅니다.')
    +'<div class="sans-cmp"><b>내 답</b> '+esc(mine)+'</div>'
    +'<div class="sans-cmp good"><b>정답</b> '+esc(q.answer)+'</div>'
    +(q.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(q.expl)+'</div>':'');
  if(ok){ cor++; }
  else { wrongs.push({q:q,my:mine}); }
  const box=document.createElement('div'); box.style.display='grid'; box.style.gap='8px'; box.style.marginTop='12px';
  if(!ok){
    const self=document.createElement('button');
    self.className='btn sec'; self.textContent='🙆 사실상 맞았어요 (정답 처리)';
    self.onclick=()=>{ cor++; wrongs=wrongs.filter(w=>w.q!==q); self.disabled=true;
                       self.textContent='✔ 정답으로 처리했어요'; };
    box.appendChild(self);
  }
  const nx=document.createElement('button');
  nx.className='btn'; nx.textContent=(idx+1>=qs.length?'다음 · 결과 보기 →':'다음 문제 →');
  nx.onclick=()=>{idx++;draw();};
  box.appendChild(nx);
  el('qcard').appendChild(box);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// 지문의 ⟪ ⟫ 표시를 밑줄로 (원본 PDF의 밑줄 친 부분)
function psgHtml(t){return esc(t).replace(/⟪/g,'<u class="ul">').replace(/⟫/g,'</u>');}
function pick(btn,sel,q){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=el('fb'), CIR='①②③④⑤';
  if(sel===q.answer){
    btn.classList.add('ok');fb.className='fb y';
    fb.innerHTML='✅ 정답! <b>'+CIR[q.answer-1]+'</b>번'
      +(q.expl?'<div class="expl" style="border-top-color:#86efac">💡 '+esc(q.expl)+'</div>':'');
    cor++;
  }
  else{
    btn.classList.add('no');
    document.querySelectorAll('.opt')[q.answer-1].classList.add('reveal');
    fb.className='fb n';
    fb.innerHTML='❌ 정답은 <b>'+CIR[q.answer-1]+'</b>번입니다.'
      +(q.expl?'<div class="expl">💡 '+esc(q.expl)+'</div>':'');
    wrongs.push({q:q,my:sel});
  }
  // 해설이 있으면 버튼으로 넘긴다 (자동으로 넘어가면 해설을 못 읽음)
  if(q.expl){
    const nx=document.createElement('button'); nx.className='btn'; nx.style.marginTop='12px';
    nx.textContent=(idx+1>=qs.length?'해설을 읽었어요 · 결과 보기 →':'해설을 읽었어요 · 다음 문제 →');
    nx.onclick=()=>{idx++;draw();};
    el('qcard').appendChild(nx);
    if(nx.scrollIntoView) nx.scrollIntoView({block:'nearest'});
  } else {
    setTimeout(()=>{idx++;draw();},sel===q.answer?800:2000);
  }
}

      myText: w.short ? String(w.my) : ((w.opts||[])[w.my-1]||(CIR[w.my-1]+'번')),
      answerText: w.short ? String(w.answer) : ((w.opts||[])[w.answer-1]||(CIR[w.answer-1]+'번')),
      expl:w.expl, note:w.note}))
  }) : false;
  btn.disabled=false; btn.textContent='💾 오답노트 저장하기';
  msg.style.color = ok ? '#2e7d32' : '#c62828';
  msg.textContent = ok ? '✅ 저장했어요! 내 학습 기록에서 볼 수 있어요.' : '⚠️ 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}
function backToResult(){ show('scResult'); window.scrollTo(0,0); }
window.openNote=openNote; window.saveNote=saveNote; window.backToResult=backToResult;
window.backToRounds=backToRounds; window.retryWrong=retryWrong;
(function init(){
  try{
    const n=localStorage.getItem('bn_name'); if(n) el('name').value=n;
    const s=localStorage.getItem('bn_school')||'';
    for(const o of el('school').options){ if(o.value && s.indexOf(o.value.replace(/\d$/,''))===0){el('school').value=o.value;break;} }
  }catch(e){}
  renderRounds();
})();
</script>
</body>

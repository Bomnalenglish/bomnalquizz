{"no": 164, "school": "경북예고 (대구시)", "pref": "32", "type": "빈칸연결어", "stem": "다음 빈칸 '…your body breaks down the adenosine. (A)___, this molecule may be what your body uses to keep track of lost sleep…' / '…you can't become accustomed to getting less sleep than your body needs. (B)___, a lack of sleep catches up with you.'에 들어갈 말로 가장 적절한 것은?", "p": "32-a", "choices": ["(A) Thus — (B) But", "(A) Hence — (B) In the end", "(A) Anyhow — (B) In contrast", "(A) However — (B) Nonetheless", "(A) Therefore — (B) Nevertheless"], "ans": 2, "exp": "(A)는 앞 내용의 결론이므로 Hence(따라서), (B)는 논지를 마무리하는 In the end(결국)가 적절하다.", "b": 3, "bb": "Although you may put off going to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. (A)__________, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. Because of such built-in molecular feedback, you can't become accustomed to getting less sleep than your body needs. (B)__________, a lack of sleep catches up with you.\n*compound: 화합물 **accumulation: 축적"},
{"no": 165, "school": "달서고 (대구시)", "pref": "32", "type": "빈칸", "stem": "다음 빈칸 'this molecule may be what your body uses to keep track of lost sleep and to (A)___ sleep when needed. … you build up a sleep debt that you must (B)___ by sleeping longer than normal.'에 들어갈 말로 가장 적절한 것은?", "p": "32-a", "choices": ["(A) cause — (B) reduce", "(A) eliminate — (B) make up", "(A) substitute — (B) disconnect", "(A) stimulate — (B) compensate", "(A) strengthen — (B) break down"], "ans": 4, "exp": "필요할 때 잠을 유발하고(stimulate), 수면 빚을 더 오래 자서 메운다(compensate).", "b": 4, "bb": "Although you may put off going to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to (A)__________ sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must (B)__________ by sleeping longer than normal. Because of such built-in molecular feedback, you can't become accustomed to getting less sleep than your body needs. Eventually, a lack of sleep catches up with you.\n*compound: 화합물 **accumulation: 축적"},
{"no": 166, "school": "청주고 (청주시)", "pref": "32", "type": "요약", "stem": "요약 - 'When you don't get (A)___ sleep, adenosine (B)___ and makes you sleepier until you eventually have to catch up on sleep.'", "p": "32-a", "choices": ["(A) particular — (B) discriminates", "(A) deficient — (B) distributes", "(A) identical — (B) expires", "(A) good — (B) distracts", "(A) enough — (B) gathers"], "ans": 5, "exp": "충분한(enough) 잠을 못 자면 아데노신이 쌓여(gathers) 졸음이 커진다.", "b": 4, "bb": "[학교 변형 지문]\nAlthough you may put off going to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. Because of such built-in molecular feedback, you can't become accustomed to getting less sleep than your body needs. Eventually, a lack of sleep catches up with you. When you don't get (A)[_________] sleep, adenosine (B)[_________] and makes you sleepier until you eventually have to catch up on sleep."},
{"no": 167, "school": "남동고 (인천시)", "pref": "32", "type": "밑줄의미", "stem": "밑줄 친 'a lack of sleep catches up with you'가 의미하는 바로 가장 적절한 것은?", "p": "32-a", "choices": ["you will experience your day and night being reversed", "you can't beat the insufficient sleep without going to sleep", "the deficient sleep can be resolved naturally as time goes by", "your will to be awaken is stronger than the power to sleep", "your life will be vigorous due to the imbalance of hormone"], "ans": 2, "exp": "수면 부족은 결국 잠으로 해소할 수밖에 없다는 의미이므로 ②가 적절.", "b": 4},
{"no": 168, "school": "성주여고 (성주군)", "pref": "32", "type": "요약", "stem": "요약 - 'The chemical adenosine accumulates in your body while you are (A)___, creating an (B)___ sleep debt that makes it impossible for you to become accustomed to getting less sleep than your body needs.'", "p": "32-a", "choices": ["(A) asleep — (B) manageable", "(A) awake — (B) unavoidable", "(A) stressed — (B) temporary", "(A) active — (B) psychological", "(A) exhausted — (B) accumulating"], "ans": 2, "exp": "아데노신은 깨어 있는(awake) 동안 쌓여 피할 수 없는(unavoidable) 수면 빚을 만든다.", "b": 4, "bb": "[학교 변형 지문]\nAlthough you may put off going to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. Because of such built-in molecular feedback, you can't become accustomed to getting less sleep than your body needs. Eventually, a lack of sleep catches up with you. ↓ The chemical adenosine accumulates in your body while you are (A)[___________], creating an (B)[___________] sleep debt that makes it impossible for you to become accustomed to getting less sleep than your body needs."},
{"no": 169, "school": "문수고 (울산시)", "pref": "32", "type": "밑줄의미", "stem": "밑줄 친 'a lack of sleep catches up with you'가 의미하는 바로 가장 적절한 것은?", "p": "32-a", "choices": ["A sound mind in a sound body.", "The more stress you have, the less you can sleep.", "The long-term damage from sleeping too much eventually showed up.", "You can't escape the effects of not sleeping enough and sooner or later you'll feel the consequences.", "The more nights you stay awake, the less strongly sleep loss will affect you."], "ans": 4, "exp": "충분히 자지 못한 영향에서 벗어날 수 없고 결국 그 결과를 겪게 된다는 뜻.", "b": 4},
{"no": 170, "school": "별가람고 (남양주시)", "pref": "33", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중 어법상 어색한 것은?", "p": "33-a", "choices": ["ⓐ to grasp", "ⓑ calculated", "ⓒ indicates", "ⓓ which", "ⓔ plan"], "ans": 4, "exp": "ⓓ which → that(this): 콤마 뒤 주절의 주어 자리이므로 관계대명사가 아닌 지시대명사가 와야 한다.", "b": 1, "bb": "[학교 변형 지문]\nOne of the things that makes uncertainty difficult for the public ⓐto grasp is that the significance of uncertainty is relative. For example, the distance between Earth and the sun: 1.49597 x 10⁸ km, as ⓑcalculated at one point during the year. This seems relatively precise; after all, using six significant digits ⓒindicates I know the distance to an accuracy of one part in a million or so. However, if the next digit is uncertain, ⓓwhich means the uncertainty in knowing the precise Earth-sun distance is larger than the distance between New York and Chicago! Whether or not the quoted number is \"precise\" therefore depends on what I'm intending to do with it. If I care only about what minute the sun will rise tomorrow, then the number quoted here is fine. If I ⓔplan to launch a satellite to orbit just above the sun, however, then I would need to know distances more accurately."},
{"no": 171, "school": "쌍용고 (천안시)", "pref": "33", "type": "빈칸", "stem": "다음 빈칸 'Whether or not the quoted number is \"precise\" therefore depends on (A)___.'에 들어갈 말로 가장 적절한 것은?", "p": "33-a", "choices": ["the accuracy of applying the number", "the purpose I want to use the number for", "the instrument used to measure the distance", "the exact distance between Earth and the sun", "the effectiveness of intending to use the number"], "ans": 2, "exp": "수치가 '정밀한지'는 그 수치를 어떤 목적에 쓰려는지에 달려 있으므로 ②가 적절하다.", "b": 1, "bb": "One of the things that makes uncertainty difficult for members of the public to appreciate is that the significance of uncertainty is relative. Take, for example, the distance between Earth and the sun: 1.49597 × 10⁸ km, as measured at one point during the year. This seems relatively precise; after all, using six significant digits means I know the distance to an accuracy of one part in a million or so. However, if the next digit is uncertain, that means the uncertainty in knowing the precise Earth-sun distance is larger than the distance between New York and Chicago! Whether or not the quoted number is \"precise\" therefore depends on __________. If I care only about what minute the sun will rise tomorrow, then the number quoted here is fine. If I want to send a satellite to orbit just above the sun, however, then I would need to know distances more accurately.\n*significant digit: 유효 숫자"},
{"no": 172, "school": "쌍용고 (천안시)", "pref": "33", "type": "영영풀이", "stem": "윗글에서 사용된 어휘(ⓐappreciate ⓑmeasured ⓒrelatively ⓓuncertain ⓔquoted)의 의미를 설명한 것으로 적절하지 않은 것은?", "p": "33-a", "choices": ["ⓐ to be grateful for something", "ⓑ to find the size, length, or amount of something, using standard units such as inches, meters, etc.", "ⓒ to a degree when compared with something else", "ⓓ not exactly known or decided", "ⓔ to copy out words or numbers from a text or speech"], "ans": 1, "exp": "ⓐ appreciate는 여기서 '이해하다, 진가를 알다'의 뜻이므로 '감사하다'라는 풀이는 부적절하다.", "b": 1},
{"no": 173, "school": "세광고 (청주시)", "pref": "33", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "33-a", "choices": ["ⓐ challenging", "ⓑ prevalent", "ⓒ error", "ⓓ depends", "ⓔ figure"], "ans": 2, "exp": "ⓑ prevalent → precise: 유효숫자 여섯 자리를 쓰니 비교적 '정밀해' 보인다는 문맥이다.", "b": 1, "bb": "[학교 변형 지문]\nOne of the factors that makes uncertainty ⓐchallenging for members of the public to appreciate is that the importance of uncertainty is relative. Consider, for instance, the distance between Earth and the sun: 1.49597 × 10  km, as measured at a certain point during the year. This appears relatively ⓑprevalent; after all, using six significant digits means I know the distance to an accuracy of one part in a million or so. However, if the next digit is unclear, that implies the ⓒerror in knowing the exact Earth-sun distance is greater than the distance between New York and Chicago! Whether the quoted number is \"precise\" or not, therefore, ⓓdepends on what I intend to do with it. If I only care about what minute the sun will rise tomorrow, then the ⓔfigure presented here is sufficient. If I want to send a satellite to orbit just above the sun, however, then I would need to know distances with far greater accuracy."},
{"no": 174, "school": "대륜고 (대구시)", "pref": "33", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 다음 자리가 불확실하면 오차가 뉴욕-시카고 거리보다 큼 ② 'The exact diameter of the sun has remained unchanged since ancient times.' ③ 수치의 정밀성은 사용 의도에 달려 있음 ④ 해 뜨는 시각만 알면 이 수치로 충분함 ⑤ 위성을 보내려면 더 정확한 거리가 필요함)", "p": "33-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "② '태양의 지름이 고대 이래 변함없다'는 불확실성의 상대성이라는 글의 흐름과 무관하다.", "b": 1, "bb": "[학교 변형 지문]\nOne of the things that makes uncertainty difficult for members of the public to appreciate is that the significance of uncertainty is relative. Take, for example, the distance between Earth and the sun: 1.49597 × 10  km, as measured at one point during the year. This seems relatively precise; after all, using six significant digits means I know the distance to an accuracy of one part in a million or so. ⓐHowever, if the next digit is uncertain, that means the uncertainty in knowing the precise Earth-sun distance is larger than the distance between New York and Chicago! ⓑThe exact diameter of the sun has remained unchanged since ancient times. ⓒWhether or not the quoted number is \"precise\" therefore depends on what I'm intending to do with it. ⓓIf I care only about what minute the sun will rise tomorrow, then the number quoted here is fine. ⓔIf I want to send a satellite to orbit just above the sun, however, then I would need to know distances more accurately.\n*significant digit: 유효 숫자"},

{"no": 176, "school": "충북대학교사범대학부설고 (청주시)", "pref": "33", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "33-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 2, "exp": "주장 → (B) 지구-태양 거리 예시 → (A) 다음 자리의 불확실성과 용도 의존 → (C) 용도별 적용 순서가 자연스럽다.", "b": 1, "bb": "One of the things that makes uncertainty difficult for members of the public to appreciate is that the significance of uncertainty is relative.\n\n(A) However, if the next digit is uncertain, that means the uncertainty in knowing the precise Earth-sun distance is larger than the distance between New York and Chicago! Whether or not the quoted number is \"precise\" therefore depends on what I'm intending to do with it.\n\n(B) Take, for example, the distance between Earth and the sun: 1.49597 × 10⁸ km, as measured at one point during the year. This seems relatively precise; after all, using six significant digits means I know the distance to an accuracy of one part in a million or so.\n\n(C) If I care only about what minute the sun will rise tomorrow, then the number quoted here is fine. If I want to send a satellite to orbit just above the sun, however, then I would need to know distances more accurately."},
{"no": 177, "school": "청주여고 (청주시)", "pref": "33", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] Whether or not the quoted number is \"precise\" therefore depends on what I'm intending to do with it.", "p": "33-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 4, "exp": "정밀함은 용도에 달렸다는 결론 뒤에 해돋이 시각과 위성 발사의 대조 사례가 이어져야 하므로 ④가 적절하다.", "b": 2, "bb": "One of the things that makes uncertainty difficult for members of the public to appreciate is that the significance of uncertainty is relative. ( ① ) Take, for example, the distance between Earth and the sun: 1.49597 × 10⁸ km, as measured at one point during the year. ( ② ) This seems relatively precise; after all, using six significant digits means I know the distance to an accuracy of one part in a million or so. ( ③ ) However, if the next digit is uncertain, that means the uncertainty in knowing the precise Earth-sun distance is larger than the distance between New York and Chicago! ( ④ ) If I care only about what minute the sun will rise tomorrow, then the number quoted here is fine. ( ⑤ ) If I want to send a satellite to orbit just above the sun, however, then I would need to know distances more accurately."},

{"no": 201, "school": "호산고 (대구시)", "pref": "34", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] This transformation cannot happen without fossil fuels.", "p": "34-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 2, "exp": "대체 인프라 구축(전환)을 언급한 직후, 화석연료가 필요한 구체적 예시(For instance) 앞에 와야 한다.", "b": 2, "bb": "Richard Heinberg, an American journalist, argues that in building the renewable energy infrastructure to stop global warming, we are actually involved in one of the greatest change projects in human history. ( ① ) In addition to solar panels and wind turbines, we have to build an alternative transport infrastructure, farming procedures and industrial processes. ( ② ) For instance, production of concrete structures and steel elements require amounts of energy that is only possible to produce with fossil energy. ( ③ ) Production of solar panels requires scarce and expensive minerals which must be excavated, again requiring the use of fossil fuels. ( ④ ) Thus, the harder we push towards a renewable energy system, the faster we have to use fossil energy for the construction process. ( ⑤ ) This is not only expensive, but also an undermining factor for our efforts to cut global emissions. Heinberg remarks that the cost of building this new energy infrastructure is seldom counted in transition proposals, which tend to focus just on energy supply requirements."},
{"no": 202, "school": "매탄고 (수원시)", "pref": "34", "type": "요약", "stem": "요약 - 'Richard Heinberg, an American journalist, emphasizes that the ambitious transition to renewable energy paradoxically (A)___ dependence on fossil fuels because the fabrication of steel, concrete, and solar panels necessitates immense energy, revealing concealed costs often (B)___ in policy.'", "p": "34-a", "choices": ["(A) intensifies — (B) disregarded", "(A) alleviates — (B) allocated", "(A) reduces — (B) valued", "(A) strengthens — (B) accepted", "(A) eliminates — (B) neglected"], "ans": 1, "exp": "재생에너지 전환이 화석연료 의존을 강화하고(intensifies), 그 비용이 전환 제안에서 거의 고려되지 않는다(disregarded).", "b": 2, "bb": "[학교 변형 지문]\nRichard Heinberg, an American journalist, argues that in building the renewable energy infrastructure to stop global warming, we are actually involved in one of the greatest change projects in human history. In addition to solar panels and wind turbines, we have to build an alternative transport infrastructure, farming procedures and industrial processes. This transformation cannot happen without fossil fuels. For instance, production of concrete structures and steel elements require amounts of energy that is only possible to produce with fossil energy. Production of solar panels requires scarce and expensive minerals which must be excavated, again requiring the use of fossil fuels. Thus, the harder we push towards a renewable energy system, the faster we have to use fossil energy for the construction process. This is not only expensive, but also an undermining factor for our efforts to cut global emissions. Heinberg remarks that the cost of building this new energy infrastructure is seldom counted in transition proposals, which tend to focus just on energy supply requirements. ↓ Richard Heinberg, an American journalist, emphasizes that the ambitious transition to renewable energy paradoxically (A)[__________] dependence on fossil fuels because the fabrication of steel, concrete, and solar panels necessitates immense energy, revealing concealed costs often (B)[___________] in policy."},

{"no": 230, "school": "청라고 (인천시)", "pref": "36", "type": "지칭", "stem": "다음 글의 밑줄 친 It(it)이 가리키는 대상이 나머지 넷과 다른 것은?", "p": "36-a", "choices": ["ⓐ It", "ⓑ it", "ⓒ it", "ⓓ it", "ⓔ it"], "ans": 4, "exp": "ⓓ는 거북의 방광(bladder)을 가리키고, 나머지는 모두 사막 거북을 가리킨다.", "b": 1, "bb": "[학교 변형 지문]\nThe desert tortoise has a simple solution for coping with Death Valley's extreme heat: ⓐIt avoids it. The slow-moving creature hibernates during the winter and stays in its tunnel for much of the summer, meaning that ⓑit spends more than 90 percent of its life immobile. In fact, the tortoise usually only surfaces after a good rain. Then, ⓒit gets to work. The tortoise stocks up on water by eating plants and digging holes to collect rain. But to stay supplied with water through its extended hibernation, the reptile relies on something else ─ its highly sophisticated bladder. Unlike most animals, the tortoise's bladder functions as a holding tank, which enables the tortoise to reabsorb water stored in ⓓit. Incredibly, a desert tortoise can go a full year without taking in any freshwater at all. And because its bladder is so important to a tortoise's survival, park rangers often remind visitors not to stop and help the slow-movers across the road. The tortoise becomes so terrified when people pick it up that ⓔit empties its bladders, losing its precious water reserves."},

{"no": 256, "school": "산동고 (구미시)", "pref": "36", "type": "빈칸", "stem": "다음 빈칸 'But to stay supplied with water through its extended hibernation, the reptile relies on something else – its ___ bladder.'에 들어갈 말로 가장 적절한 것은?", "p": "36-a", "choices": ["finely designed", "crudely formed", "roughly shaped", "ineptly structured", "defectively evolved"], "ans": 1, "exp": "방광은 고도로 정교하게 설계된(finely designed) 기관이다.", "b": 4, "bb": "The desert tortoise has a simple solution for coping with Death Valley's extreme heat: It avoids it. The slow-moving creature hibernates during the winter and stays in its tunnel for much of the summer, meaning that it spends more than 90 percent of its life immobile. In fact, the tortoise usually only surfaces after a good rain. Then, it gets to work. The tortoise stocks up on water by eating plants and digging holes to collect rain. But to stay supplied with water through its extended hibernation, the reptile relies on something else — its __________ bladder. Unlike most animals, the tortoise's bladder acts as a holding tank, allowing it to reabsorb water back into its body. Incredibly, a desert tortoise can go a full year without taking in any freshwater at all. And because its bladder is so important to a tortoise's survival, park rangers often remind visitors not to stop and help the slow-movers across the road. Tortoises become so terrified when people pick them up that they empty their bladders, losing their precious water reserves.\n*hibernation: 동면 **bladder: 방광"},
{"no": 257, "school": "해송고 (인천시)", "pref": "37", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 브레이크 없이도 다른 마찰력이 속도를 줄임 ② 바퀴와 축 사이의 마찰 ③ 뒤로 미는 공기 저항 ④ 'The power you gain when going downhill, which makes you faster, is called acceleration.' ⑤ 수레에 적용하면 축의 마찰이 주된 원인임을 알 수 있음)", "p": "37-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "④ 내리막에서 얻는 힘(가속도)에 관한 문장은 속도를 줄이는 마찰력을 설명하는 흐름과 무관하다.", "b": 1, "bb": "[학교 변형 지문]\nImagine pedaling a bicycle on a level road. You stop pedaling: no force moves you forward, so you gradually slow down. To slow down more suddenly over a short distance, you put on the brakes. The brakes apply a force on the wheels and you, called friction, which acts opposite to movement and slows things down. ⓐEven without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. ⓑOne of these is friction in the wheels rubbing on the axles. ⓒ Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. ⓓThe power you gain when going downhill, which makes you faster, is called acceleration. ⓔWhen you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate."},
{"no": 258, "school": "운호고 (청주시)", "pref": "37", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down.", "p": "37-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 4, "exp": "마찰력을 정의한 뒤, 주어진 문장이 '다른 마찰력'을 제시해야 One of these(축 마찰)와 Another(공기 저항)가 이어질 수 있으므로 ④가 적절하다.", "b": 1, "bb": "Imagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? You gradually slow down. How could you slow down more suddenly, in a shorter distance? ( ① ) By putting the brakes on. ( ② ) Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims. ( ③ ) This is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards. ( ④ ) One of these is friction in the wheels rubbing on the axles. ( ⑤ ) Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. When you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate."},
{"no": 259, "school": "세광고 (청주시)", "pref": "37", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 브레이크가 바퀴 테를 잡고 문질러 자전거와 사람에게 힘을 가함 ② 그 힘이 운동 반대 방향으로 작용하는 마찰력임 ③ 브레이크 없이도 축 마찰·공기 저항 같은 마찰력이 작용함 ④ 'Bicycle tires need to be inflated to the correct pressure for a smooth and efficient ride.' ⑤ 수레에 적용하면 주로 축의 마찰이 마찰을 만듦)", "p": "37-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "글은 마찰력의 작용을 설명하는데, ⓓ(④)의 타이어 공기압 이야기는 흐름과 무관하다.", "b": 2, "bb": "[학교 변형 지문]\nImagine you are pedalling your bicycle on a level road, but when you stop pedalling, no force acts to move you forward and you gradually slow down. To slow down more suddenly and in a shorter distance, you need to put the brakes on. ⓐBecause the brakes change your movement by gripping and rubbing on the wheel-rims, causing you to reduce speed more quickly, they must be exerting a force on both you and the bicycle. ⓑThis force, called friction, works to slow down moving objects by acting in the direction opposite to motion, that is, backwards. ⓒ Even without the brakes, other friction forces act on you and your bicycle and slow you down, such as the wheels rubbing against the axles or air resistance pushing you backwards as you and the bicycle move forwards. ⓓBicycle tires need to be inflated to the correct pressure for a smooth and efficient ride. ⓔWhen you apply these ideas to something near you, like a cart, you can figure out what might be creating friction: mainly the axles rubbing on the body as they rotate."},
{"no": 260, "school": "쌍용고 (천안시)", "pref": "37", "type": "요약", "stem": "요약 - 'When you stop pedalling a bicycle, it slowly loses speed because no force is moving it (A)___. Using the brakes produces an opposing force, which acts (B)___ the motion. This force works to (C)___ the movement and makes the bicycle slow down more quickly.'", "p": "37-a", "choices": ["(A) forward — (B) toward — (C) resist", "(A) forward — (B) against — (C) counteract", "(A) forward — (B) against — (C) accelerate", "(A) backward — (B) against — (C) initiate", "(A) backward — (B) toward — (C) speed up"], "ans": 2, "exp": "앞으로(forward) 미는 힘이 없고, 제동력은 운동과 반대로(against) 작용해 움직임을 상쇄한다(counteract).", "b": 2, "bb": "[학교 변형 지문]\nImagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? You gradually slow down. How could you slow down more suddenly, in a shorter distance? By putting the brakes on. Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims. This is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards. Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. One of these is friction in the wheels rubbing on the axles. Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. ↓ When you stop pedalling a bicycle, it slowly loses speed because no force is moving it (A)[____________]. Using the brakes produces an opposing force, which acts (B)[____________] the motion. This force works to (C)[____________] the movement and makes the bicycle slow down more quickly."},
{"no": 261, "school": "석정여고 (인천시)", "pref": "37", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] This is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards.", "p": "37-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 2, "exp": "브레이크가 힘을 가한다는 문장 뒤에 그 힘이 마찰력이라는 정의가 오고, 이어서 다른 마찰력(Even without the brakes on)이 소개되어야 한다.", "b": 2, "bb": "Imagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? You gradually slow down. How could you slow down more suddenly, in a shorter distance? By putting the brakes on. ( ① ) Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims. ( ② ) Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. ( ③ ) One of these is friction in the wheels rubbing on the axles. ( ④ ) Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. ( ⑤ ) When you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate."},
{"no": 262, "school": "인일여고 (인천시)", "pref": "37", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 브레이크가 바퀴 테를 잡고 문질러 자전거와 사람에게 힘을 가함 ② 'The braking system directly affects a rider's safety, so it's essential to understand how the brakes work before riding a bicycle.' ③ 이것이 운동 반대 방향으로 작용하는 마찰력임 ④ 브레이크 없이도 다른 마찰력들이 작용함 ⑤ 그중 하나가 바퀴와 축 사이의 마찰임)", "p": "37-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "ⓑ(②)의 브레이크 안전 교육 조언은 마찰력의 작용을 설명하는 흐름과 무관하다.", "b": 2},
{"no": 263, "school": "연송고 (인천시)", "pref": "37", "type": "요약", "stem": "요약 - 'Moving objects such as bicycles gradually slow without additional force because of resisting forces like friction and air, while applying braking devices (A)___ this resistance, producing quicker (B)___ as they press firmly against the wheel rims.'", "p": "37-a", "choices": ["(A) intensifies — (B) deceleration", "(A) diminishes — (B) slowdown", "(A) weakens — (B) recovery", "(A) balances — (B) momentum", "(A) amplifies — (B) acceleration"], "ans": 1, "exp": "브레이크는 바퀴 테를 눌러 저항을 강화하고(intensifies) 더 빠른 감속(deceleration)을 만든다.", "b": 2, "bb": "[학교 변형 지문]\nImagine riding a bicycle along a flat road. The moment you stop pedaling; no forward force drives you ahead, and you begin to lose speed. This is due to a force known as friction, which slows down objects in motion by working against their direction of travel, essentially pulling them backward. Even without using the brakes, several forms of friction act on both you and the bicycle, gradually reducing your speed. One form comes from the wheels rubbing against their axles. Another comes from the air, which you can sense pressing against you as you move forward. If you apply this principle to something nearby, such as a cart, you can identify the source of friction: primarily the axles scraping against the frame as they turn. Little by little, you slow down. But how can you stop more quickly, within a shorter distance? By pressing the brakes. Since the brakes alter your motion and cause you to reduce speed more abruptly, they must be applying a force on both you and the bicycle, gripping and rubbing against the rims of the wheels. ↓ Moving objects such as bicycles gradually slow without additional force because of resisting forces like friction and air, while applying braking devices (A)[___________] this resistance, producing quicker (B)[___________] as they press firmly against the wheel rims."},
{"no": 264, "school": "청주여고 (청주시)", "pref": "37", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 브레이크가 바퀴 테를 잡고 문질러 자전거와 사람에게 힘을 가함 ② 이것이 운동 반대 방향으로 작용하는 마찰력임 ③ 'Friction is of great importance in that it secures our safety in a variety of ways when we're living our daily lives.' ④ 브레이크 없이도 다른 마찰력들이 작용함 ⑤ 바퀴와 축의 마찰, 공기 저항이 그 예임)", "p": "37-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 3, "exp": "ⓒ(③)의 일상 속 마찰의 안전상 중요성은 자전거 감속의 원리를 설명하는 흐름에서 벗어난다.", "b": 2, "bb": "[학교 변형 지문]\nImagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? You gradually slow down. How could you slow down more suddenly, in a shorter distance? By putting the brakes on. ⓐBecause the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims. ⓑThis is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards. ⓒFriction is of great importance in that it secures our safety in a variety of ways when we're living our daily lives. ⓓEven without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. ⓔOne of these is friction in the wheels rubbing on the axles and another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. When you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate.\n*axle: (바퀴의) 축 **rim: 테두리"},
{"no": 265, "school": "매탄고 (수원시)", "pref": "37", "type": "어휘", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "37-a", "choices": ["ⓐ decelerate", "ⓑ aligned with", "ⓒ driving", "ⓓ resistance", "ⓔ spin"], "ans": 2, "exp": "ⓑ aligned with → opposite to: 마찰은 운동과 반대 방향(뒤쪽)으로 작용한다.", "b": 3, "bb": "[학교 변형 지문]\nImagine you are pedalling your bicycle on a flat road. You stop pedalling: no force is now acting to drive you ahead. What happens? You ⓐdecelerate gradually. How could you slow down more suddenly, in a shorter distance? By putting the brakes on. Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel rims. This is the force called friction, which tends to slow down moving things by acting in the direction ⓑ[aligned with] movement, that is backwards. Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. One of these is friction in the wheels rubbing on the axles. Another is air resistance, which you can feel, ⓒdriving you backwards as you and the bicycle move forwards. When you apply these ideas to something around you, like a cart, you can see what could be causing ⓓresistance. It mainly comes from the axles rubbing on the body as they ⓔspin."},
{"no": 266, "school": "별가람고 (남양주시)", "pref": "37", "type": "내용적용", "stem": "다음 <보기>의 밑줄 친 ⓐ~ⓔ 중 'cart'의 속도를 늦추는 것이 아닌 것은? <보기> Tom had just finished shopping and was pushing a loaded cart toward his car in the outdoor parking lot. From time to time, he pressed ⓐthe cart's handle brake, which disrupted the smooth turning of the wheels. The wheels never rolled entirely freely, for ⓑtheir joints rubbed slightly inside, causing a faint drag with each turn. ⓒThe uneven surface of the parking lot kept the tires in constant contact, never allowing them to glide. Afterward, he felt ⓓthe air pushing against him in the open lot. A little later, however, ⓔa steady following wind arose, giving the cart a gentle drive from behind. Finally, Tom made it to his car and unloaded the cart.", "p": "37-a", "choices": ["ⓐ the cart's handle brake", "ⓑ their joints rubbed slightly inside", "ⓒ The uneven surface of the parking lot", "ⓓ the air pushing against him", "ⓔ a steady following wind"], "ans": 5, "exp": "ⓐ~ⓓ는 마찰이나 저항 요인이지만 ⓔ 뒤에서 부는 바람은 카트를 밀어 준다.", "b": 3},
{"no": 267, "school": "달천고 (울산시)", "pref": "37", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] This is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards.", "p": "37-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 3, "exp": "브레이크가 바퀴 테를 잡고 문질러 힘을 가한다는 설명 뒤에 그 힘을 마찰로 정의하고, 이어 'other friction forces'가 와야 한다.", "b": 3, "bb": "Imagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? You gradually slow down. How could you slow down more suddenly, in a shorter distance? ( ① ) By putting the brakes on. ( ② ) Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims. ( ③ ) Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. ( ④ ) One of these is friction in the wheels rubbing on the axles. ( ⑤ ) Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. When you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate."},

{"no": 271, "school": "불당고 (천안시)", "pref": "38", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 디지털 비선형 시스템의 무작위 접근 장점 ② 'A digital nonlinear system often increases mistakes, making video editing more complicated than before.' ③ 장면을 쉽게 추가·삭제하고 길이는 자동 조정됨 ④ 비선형 편집은 워드프로세서 사용과 같음 ⑤ 실수를 몇 번의 키 입력으로 쉽게 수정함)", "p": "38-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "② '비선형 시스템이 실수를 늘려 편집을 복잡하게 한다'는 내용은 장점을 나열하는 글의 흐름과 정반대이다.", "b": 1, "bb": "[학교 변형 지문]\nAll editing systems are now nonlinear computer-based systems that allow random access to any video shot or scene ⓐ[without having to fast forward or fast reverse] to find it. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves. Another highlight of a digital nonlinear system is its random access process that ⓑ[makes it easy for an editor to find desired shots or scenes] without the need to spend time fast forwarding or rewinding videotape. With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length ⓒ[automatically]. Linear editing was like composing a paper on a typewriter. If a mistake was made or new information needed to be added the whole piece ⓓ[to be retyped]. (A)[Nonlinear editing, on the other hand, is like using a word processing program]. If a mistake is made, it is ⓔ[easily deleted and fixed] with a few keystrokes, and new information can be added easily."},
{"no": 272, "school": "쌍용고 (천안시)", "pref": "38", "type": "어법", "stem": "윗글의 밑줄 친 ⓐ~ⓔ 중, 어법상 어색한 것은? (ⓐwithout having to fast forward or fast reverse ⓑmakes it easy for an editor to find desired shots or scenes ⓒautomatically ⓓ(If a mistake was made …, the whole piece) to be retyped ⓔeasily deleted and fixed)", "p": "38-a", "choices": ["ⓐ without having to fast forward or fast reverse", "ⓑ makes it easy for an editor to find desired shots or scenes", "ⓒ automatically", "ⓓ to be retyped", "ⓔ easily deleted and fixed"], "ans": 4, "exp": "ⓓ to be retyped → had to be retyped: 주절에는 시제를 갖춘 동사가 필요하다.", "b": 1},

{"no": 274, "school": "충북여고 (청주시)", "pref": "38", "type": "빈칸", "stem": "다음 빈칸 'Nonlinear editing, on the other hand, is like using a word processing program. ___.'에 들어갈 말로 가장 적절한 것은?", "p": "38-a", "choices": ["Errors can be quickly corrected with simple commands, and additional content can be inserted effortlessly", "The quality of the final product depends entirely on the editor's technical skills and experience", "It requires expensive equipment and extensive training to operate effectively", "The editing process becomes more time-consuming but produces higher quality results", "It eliminates the need for creativity and artistic vision in video production"], "ans": 1, "exp": "워드프로세서처럼 간단한 명령으로 오류를 고치고 내용을 쉽게 추가할 수 있다는 ①이 이어져야 한다.", "b": 1, "bb": "All editing systems are now nonlinear computer-based systems that allow random access to any video shot or scene without having to fast forward or fast reverse to find it. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves. Another highlight of a digital nonlinear system is its random access process that makes it easy for an editor to find desired shots or scenes without having to spend time fast forwarding or rewinding videotape. With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length automatically. Linear editing was like composing a paper on a typewriter. If a mistake was made or new information needed to be added the whole piece had to be retyped. Nonlinear editing, on the other hand, is like using a word processing program. __________."},
{"no": 275, "school": "운호고 (청주시)", "pref": "38", "type": "빈칸", "stem": "다음 빈칸 'All editing systems are now nonlinear computer-based systems that ___.'에 들어갈 말로 가장 적절한 것은?", "p": "38-a", "choices": ["automatically delete unused video files", "prevent copying or backing up video files", "enable random access to any video segment", "require internet connection for basic editing", "process video files in predetermined sequence only"], "ans": 3, "exp": "비선형 편집의 핵심은 어떤 영상 구간에도 임의 접근(random access)이 가능하다는 점이다.", "b": 2, "bb": "All editing systems are now nonlinear computer-based systems that __________. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves. Another highlight of a digital nonlinear system is its random access process that makes it easy for an editor to find desired shots or scenes without having to spend time fast forwarding or rewinding videotape. With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length automatically. Linear editing was like composing a paper on a typewriter. If a mistake was made or new information needed to be added the whole piece had to be retyped. Nonlinear editing, on the other hand, is like using a word processing program. If a mistake is made, it is easily deleted and fixed with a few keystrokes, and new information can be added easily."},

{"no": 277, "school": "대암고 (창원시)", "pref": "38", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "38-a", "choices": ["(B)-(C)-(D)-(A)", "(C)-(D)-(B)-(A)", "(C)-(A)-(B)-(D)", "(D)-(B)-(A)-(C)", "(D)-(A)-(C)-(B)"], "ans": 4, "exp": "(D) 또 다른 장점인 임의 접근 → (B) 자유로운 추가·삭제 → (A) 선형 편집의 타자기 비유 → (C) 비선형 편집의 워드프로세서 비유 순이다.", "b": 2, "bb": "All editing systems are now nonlinear computer-based systems that allow random access to any video shot or scene without having to fast forward or fast reverse to find it. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves.\n\n(A) Linear editing was like composing a paper on a typewriter. If a mistake was made or new information needed to be added the whole piece had to be retyped.\n\n(B) With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length automatically.\n\n(C) Nonlinear editing, on the other hand, is like using a word processing program. If a mistake is made, it is easily deleted and fixed with a few keystrokes, and new information can be added easily.\n\n(D) Another highlight of a digital nonlinear system is its random access process that makes it easy for an editor to find desired shots or scenes without having to spend time fast forwarding or rewinding videotape."},
{"no": 278, "school": "성주여고 (성주군)", "pref": "38", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "38-a", "choices": ["ⓐ having", "ⓑ it", "ⓒ automatically", "ⓓ to retype", "ⓔ using"], "ans": 4, "exp": "ⓓ to retype → to be retyped: 전체 글이 다시 타이핑되는 수동 관계이다.", "b": 3, "bb": "[학교 변형 지문]\nAll editing systems are now nonlinear computer-based systems that allow random access to any video shot or scene without ⓐhaving to fast forward or fast reverse to find it. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves. Another highlight of a digital nonlinear system is its random access process that makes ⓑit easy for an editor to find desired shots or scenes without having to spend time fast forwarding or rewinding videotape. With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length ⓒautomatically. Linear editing was like composing a paper on a typewriter. If a mistake was made or new information needed to be added the whole piece had ⓓ [to retype]. Nonlinear editing, on the other hand, is like ⓔ using a word processing program. If a mistake is made, it is easily deleted and fixed with a few keystrokes, and new information can be added easily."},

{"no": 317, "school": "호산고 (대구시)", "pref": "40", "type": "빈칸", "stem": "다음 빈칸 'The functional relationship we have with objects creates visual expectations that ___.'에 들어갈 말로 가장 적절한 것은?", "p": "40-a", "choices": ["exactly match the way a camera records images", "depend entirely on the lighting and angle of a scene", "interrupt our ability to see objects as a camera does", "make photographs appear more realistic than real life", "allow us to see objects in perfect detail like a camera"], "ans": 3, "exp": "사물과의 기능적 관계가 만드는 시각적 기대가 카메라처럼 보는 능력을 방해한다.", "b": 2, "bb": "Vision is influenced by our preconceptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head. The functional relationship we have with objects creates visual expectations that __________.\" The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they don't interpret confusing details but simply serve them up to us with a mechanical indifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes."},

{"no": 321, "school": "영남고 (대구시)", "pref": "40", "type": "빈칸", "stem": "다음 빈칸 'When we look at them carefully, photographs are often surprising because they ___.'에 들어갈 말로 가장 적절한 것은?", "p": "40-a", "choices": ["adjust the image based on viewer's perspective", "isolate the main subject to reflect human visual priorities", "offer an unbiased portrayal that ignores functional relevance", "filter out irrelevant elements to make scenes more comprehensible", "highlight what we subconsciously consider the most useful features"], "ans": 3, "exp": "카메라는 기능적 관련성과 무관하게 대상을 편견 없이 기록한다.", "b": 3, "bb": "Vision is influenced by our preconceptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head. The functional relationship we have with objects creates visual expectations that interfere with our ability to see \"like a camera.\" The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they __________. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes."},
{"no": 322, "school": "청석고 (청주시)", "pref": "40", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 장면을 볼 때 대상과의 관계와 당장의 필요를 반영해 무의식적으로 우선순위를 정함 ② 망치를 떠올릴 때 옆면이나 '사용 준비' 각도로 떠올림 ③ 이런 기능적 연관이 시각적 기대를 만들어 '카메라처럼' 보는 것을 방해함 ④ 'Many professional photographers argue that a picture's real value comes more from the artist's creativity than from the camera itself.' ⑤ 카메라는 인간의 정신과 달리 형태와 색만 기록함)", "p": "40-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "인간 시각과 카메라를 비교하는 글에서 사진작가의 창의성에 관한 ④는 흐름에서 벗어난다.", "b": 3},
{"no": 323, "school": "중앙고 (울산시)", "pref": "40", "type": "어휘", "stem": "다음 글의 밑줄 친 ⓐ~ⓔ 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "40-a", "choices": ["ⓐ practical", "ⓑ concealed", "ⓒ hinder", "ⓓ subjectively", "ⓔ indifference"], "ans": 4, "exp": "ⓓ subjectively → impartially(objectively): 카메라는 세상을 기계적·중립적으로 기록한다.", "b": 4, "bb": "[학교 변형 지문]\nVision is influenced by our assumptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our ⓐpractical relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle. One would probably not visualize a hammer as seen from the top so that the handle is ⓑconcealed by the hammer's head. The functional relationship we have with objects creates visual expectations that ⓒhinder our ability to see \"like a camera.\" The camera, like the human eye, sees only shapes and colors and documents the world ⓓsubjectively through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they don't interpret confusing details but simply present them to us with a mechanical ⓔindifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes."},
{"no": 324, "school": "일신여고 (청주시)", "pref": "40", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "40-a", "choices": ["(A)-(B)-(C)", "(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)"], "ans": 2, "exp": "(A) 망치의 예 → (C) 기능적 관계가 카메라처럼 보는 능력을 방해함 → (B) 사진(them)의 특성 순서가 자연스럽다.", "b": 4, "bb": "Vision is influenced by our preconceptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities.\n\n(A) For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head.\n\n(B) When we look at them carefully, photographs are often surprising because they don't interpret confusing details but simply serve them up to us with a mechanical indifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes.\n\n(C) The functional relationship we have with objects creates visual expectations that interfere with our ability to see \"like a camera.\" The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is similar to the eye."},
{"no": 325, "school": "신일고 (서울시)", "pref": "40", "type": "어법", "stem": "다음 글의 밑줄 친 ⓐ~ⓔ 중, 어법상 어색한 것은?", "p": "40-a", "choices": ["ⓐ is influenced by", "ⓑ seeing", "ⓒ that", "ⓓ similar", "ⓔ bewildering"], "ans": 2, "exp": "ⓑ seeing → seen: 망치가 위에서 '보이는' 수동의 의미이다.", "b": 4, "bb": "[학교 변형 지문]\nVision ⓐ[is influenced by] our preconceptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle. One would probably not visualize a hammer as ⓑseeing from the top so that the handle is hidden by the hammer's head. The functional relationship we have with objects creates visual expectations ⓒthat interfere with our ability to see \"like a camera.\" The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is ⓓsimilar to the eye. When we look at them carefully, photographs are often surprising because they don't interpret ⓔbewildering details but simply serve them up to us with a mechanical indifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes."},
{"no": 326, "school": "성주여고 (성주군)", "pref": "40", "type": "빈칸", "stem": "다음 빈칸 'Vision is influenced by ___.'에 들어갈 말로 가장 적절한 것은?", "p": "40-a", "choices": ["our preconceptions about reality", "the biological structure of the human eye", "our immediate interests in a given situation", "our desire to interpret the world artistically", "the objective documentation of shapes and colors"], "ans": 1, "exp": "시각이 무의식적 위계와 기능적 기대에 영향을 받는다는 내용이므로 '현실에 대한 선입견'이 적절하다.", "b": 4, "bb": "Vision is influenced by __________. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head. The functional relationship we have with objects creates visual expectations that interfere with our ability to see \"like a camera.\" The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they don't interpret confusing details but simply serve them up to us with a mechanical indifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes."},

{"no": 328, "school": "달서고 (대구시)", "pref": "40", "type": "내용일치", "stem": "다음 글의 내용과 일치하는 것은?", "p": "40-a", "choices": ["시각은 선입견으로부터 영향을 받지 않고 객관적인 현실에 의해서만 결정된다.", "사람의 눈과 달리, 카메라는 장면을 더 깊게 이해하기 위해 형태와 색깔을 해석한다.", "사물과의 기능적 관계는 카메라처럼 방해 없이 정확하게 사물을 보도록 도와준다.", "사진은 혼란을 제거해서 보는 사람들이 더 잘 이해하게 하는 방식으로 세부 사항을 해석한다.", "시각에 대한 우리의 인식은 확립된 기능적 위계에 의해 형성되어 객관적인 관찰을 막는다."], "ans": 5, "exp": "선입견과 기능적 관계가 무의식적 위계를 만들어 '카메라처럼' 보는 것을 방해한다고 했으므로 ⑤가 일치한다.", "b": 4},
{"no": 329, "school": "신흥고 (청주시)", "pref": "42", "type": "빈칸", "stem": "다음 빈칸 '\"May I help you?\" are the worst four words that a retail salesperson can utter because they make the customer ___.'에 들어갈 말로 가장 적절한 것은?", "p": "42-a", "choices": ["relaxed and careless", "speechless and defensive", "confident and calm", "hesitant and cooperative", "confused and angry"], "ans": 2, "exp": "\"May I help you?\"는 고객을 곤경에 처한 사람으로 만들어 방어적으로 만들고 즉각 \"No, thank you\"를 유발한다.", "b": 2, "bb": "\"May I help you?\" are the worst four words that a retail salesperson can utter because they don't encourage the customer __________. The four words usually draw out a negative response that stops cold a sales transaction. Examples of better questions to use when approaching customers are \"Is there anything in particular that you are looking for?\" and \"Are you shopping for a gift?\" If a fashion salesperson approached you with \"May I help you?\" chances are you would feel the salesperson didn't care. This line is a rote approach that is so overused by untrained and uninterested salespeople. In fact, most of us shudder in horror on hearing these words. The very meaning of the question \"May I help you?\" implies that the customer is in trouble of some sort and needs rescuing. This almost always puts the customer on the defense. \"No, thank you\" is usually the immediate response, even if the customer is actually in need of assistance. The subconscious thought by the customer is often \"I'm smart enough to figure out what I want, and I don't need your help!\" If customers feel pressured or cornered, then salespeople won't make any sales. The approach has to promote a comfortable environment that makes customers feel there is no rush. Furthermore, if customers just want to look around, they should feel that it is all right to do so. In situations where customers really do want to look around on their own, salespeople should give customers their business cards and keep themselves accessible in case customers have questions or concerns.\n*shudder: 몸서리치다"},

o look around on their own, salespeople should give customers their business cards and keep themselves accessible in case customers have questions or concerns.\n*shudder: 몸서리치다"},
{"no": 331, "school": "심인고 (대구시)", "pref": "42", "type": "빈칸연결어", "stem": "다음 빈칸 '…This line is a rote approach that is so overused by untrained and uninterested salespeople. (A)___, most of us shudder in horror on hearing these words.' / 'If customers feel pressured or cornered, then salespeople won't make any sales. (B)___, the approach has to promote a comfortable environment…'에 들어갈 말로 가장 적절한 것은?", "p": "42-a", "choices": ["(A) However — (B) Therefore", "(A) In fact — (B) Therefore", "(A) Moreover — (B) However", "(A) Nevertheless — (B) In addition", "(A) For example — (B) On the contrary"], "ans": 2, "exp": "(A)는 앞 내용을 강조하는 In fact, (B)는 결론을 이끄는 Therefore가 적절하다.", "b": 3, "bb": "\"May I help you?\" are the worst four words that a retail salesperson can utter because they don't encourage the customer to talk and put them on the defensive. The four words usually draw out a negative response that stops cold a sales transaction. Examples of better questions to use when approaching customers are \"Is there anything in particular that you are looking for?\" and \"Are you shopping for a gift?\" If a fashion salesperson approached you with \"May I help you?\" chances are you would feel the salesperson didn't care. This line is a rote approach that is so overused by untrained and uninterested salespeople. In fact, most of us shudder in horror on hearing these words. The very meaning of the question \"May I help you?\" implies that the customer is in trouble of some sort and needs rescuing. This almost always puts the customer on the defense. \"No, thank you\" is usually the immediate response, even if the customer is actually in need of assistance. The subconscious thought by the customer is often \"I'm smart enough to figure out what I want, and I don't need your help!\" (A)__________, most of us shudder in horror on hearing these words.' / 'If customers feel pressured or cornered, then salespeople won't make any sales. (B)__________, the approach has to promote a comfortable environment Furthermore, if customers just want to look around, they should feel that it is all right to do so. In situations where customers really do want to look around on their own, salespeople should give customers their business cards and keep themselves accessible in case customers have questions or concerns."},

const QUIZ_ID='mock_go1_2025_09_total';

  try{

    if(data.day!==_DAY_KEY){localStorage.removeItem(_PROG_KEY); return;}
    if(Array.isArray(data.doneRefs)) doneRefs=new Set(data.doneRefs);
  }catch(e){}
}
function _cleanupOldProgress(){
  try{
    for(let i=localStorage.length-1;i>=0;i--){
      const k=localStorage.key(i);
      if(k && (k.startsWith('bn_prog_') || k.startsWith('bn_session_'))){
        try{const v=JSON.parse(localStorage.getItem(k)); if(v.day!==_DAY_KEY) localStorage.removeItem(k);}
        catch(e){localStorage.removeItem(k);}
      }
    }
  }catch(e){}
}

function _shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function goPassageSelect(){
  userSchool = document.getElementById('si').value;
  userName = document.getElementById('ni').value.trim();
  if(!userSchool){alert('학교를 선택해주세요!');return;}
  if(!userName){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bomnal_name',userName);localStorage.setItem('bomnal_school',userSchool);}catch(e){}
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('userInfo').textContent = userName + ' · ' + userSchool;
  _loadHist();
  renderTypeRow();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 · ${q.b}차</span>
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(escHTML(q.body))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.textContent='💡 '+q.exp;fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

const _SESSION_KEY = 'bn_session_' + QUIZ_ID;
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 25년 6월 총괄 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고1_25년9월_총괄_학교기출',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>

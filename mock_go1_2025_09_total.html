<script>
// ── DATA ──────────────────────────────────────────
const PASS = {"20-a": "Inefficient teachers overlook the potential power of the opening minutes of class. Often, if students are quiet enough and if there are many pressing demands on a teacher's time at that moment, more than ten minutes can disappear before class starts. It's no wonder that students are late for class; they have little reason to be on time. You can use the first ten minutes to get your class off to a great start, or you can choose to waste this time. The first minutes set the tone for the rest of the class. If you are prepared for class and have taught your students an opening routine, they can use this brief time to make mental and emotional transitions from the last class or subject and prepare to focus on learning new material. In summary, you should establish an opening routine to develop your class with an effective start.", "21-a": "Many atoms in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you inhale are exhaled in your next breath. The remaining atoms are taken into your body to become part of you, and they later leave your body by various means. You don't \"own\" the atoms that make up your body; you borrow them. We all share from the same atom pool because atoms forever travel around, within, and among us. Atoms cycle from person to person as we breathe and as our sweat is evaporated. We recycle atoms on a grand scale. The origin of the lightest atoms goes back to the origin of the universe, and most heavier atoms are older than the Sun and Earth. There are atoms in your body that have existed since the first moments of time, recycling throughout the universe among limitless forms, both nonliving and living. You're the present caretaker of the atoms in your body. There will be many who will follow you.", "22-a": "The act of gardening itself is a fantastic form of physical activity. It involves a range of motions, from digging and planting to watering and harvesting. These activities help improve strength, flexibility, and endurance. You might not realize it, but small tasks like weeding or turning compost can burn many calories. Gardening is particularly beneficial for those who find traditional exercise challenging. It's a low-impact way to stay active and fit, making it accessible for people of all ages and physical abilities. Besides physical health, gardening has profound mental health benefits. Tending to plants can be incredibly calming and meditative. It allows you to focus on the present moment, reducing stress and anxiety. The repetitive tasks involved in gardening can induce a state of mindfulness, similar to meditation. Studies have shown that spending time in nature, even in a small garden, can elevate mood, improve cognition, and reduce depression symptoms. The sense of accomplishment from watching your plants grow and thrive can also boost self-esteem and overall well-being.", "23-a": "For many centuries, humans have taken advantage of tools that translate and bring into our perception natural phenomena that we can't perceive with our senses. In some cases, this consists of simply amplifying signals that feed into our normal sensory inputs (e.g., telescopes can bring into clear view that which is too far away for our eyes to perceive on their own). Other instruments turn signals that we cannot perceive into ones that we can observe. Some of these take the form of expanding the reach of our current senses, such as creating visible images based on the ultraviolet spectrum of light or changing sounds that are normally outside the range of what human ears can hear into audible signals. Alternatively, some instruments measure properties for which we have no sensory capacity at all and change them into that which we can observe.", "24-a": "Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that animal experimentation led to medical advances. Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe.", "25-a": "※ 25번 도표 문제는 문제에 적힌 수치와 문장을 보고 판단하세요.", "26-a": "Roger Payne was born in Manhattan in 1935. He studied biology at Harvard University and eventually earned his Ph.D. from Cornell University in 1961. In 1967, he discovered that humpback whales make long and complex sounds. They're known as \"whale songs,\" and he showed that whales use them to communicate. Then in 1970, he released an album Songs of the Humpback Whale, which became a surprise hit and helped start the global \"Save the Whales\" movement. The following year, he founded Ocean Alliance to protect whales and the earth's oceans, and he used new, safe methods to study whales without harming them. Over his career, he led more than 100 research trips worldwide, including the Voyage of the Odyssey from 2000 to 2005, which studied ocean pollution. His work helped make laws that protect marine mammals, which finally led to the global ban on commercial whaling in 1986.\n*humpback whale: 혹등고래", "27-a": "Father-Daughter Sock Hop\nWe are excited to bring you the 5th annual Father-Daughter Sock Hop - an incredibly special evening for fathers and daughters to dance!\nWhen & Where\n• September 12th (Friday), from 6 p.m. to 9 p.m.\n• Maple Creek Community Center\nParticipation Fee\n• $25 per pair\n• $5 per each additional daughter\n• No refund for cancellations on the day of the event\nNotice\n• A pair of socks will be given out as a gift to every participant.\n• Take pictures at the photo zone.\nRegistration\n• Register online at www.maplecreekcity.org", "29-a": "Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don't run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That's true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!", "30-a": "For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain nomadic tribes don't have much, yet they are happy to share because it is in their interest to do so. If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. It's not just because they are nice people; it's because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. Ironically, the more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. Our desire for more, combined with our decreased physical interaction with the \"common folk,\" starts to create a disconnection or blindness to reality.", "31-a": "Whether we feel happy or sad, content or discontent, is not determined merely by each individual successive moment of life experience – a good thing happens and I'm happy, a bad thing happens and I'm sad. While our experiences affect our mood, we are not blown in a completely new direction by each gust of wind. As humans, we adjust – to new information and events both good and bad – and return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline – back up after bad news and back down after good. The euphoria of first love fades, and so does the despair of a break-up. This tendency is best seen with little kids and their toy joy: When they get what they've longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids – like adults – adapt.", "32-a": "Although you may put off going to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. Because of such built-in molecular feedback, you can't become accustomed to getting less sleep than your body needs. Eventually, a lack of sleep catches up with you.\n*compound: 화합물 **accumulation: 축적", "33-a": "One of the things that makes uncertainty difficult for members of the public to appreciate is that the significance of uncertainty is relative. Take, for example, the distance between Earth and the sun: 1.49597 × 10⁸ km, as measured at one point during the year. This seems relatively precise; after all, using six significant digits means I know the distance to an accuracy of one part in a million or so. However, if the next digit is uncertain, that means the uncertainty in knowing the precise Earth-sun distance is larger than the distance between New York and Chicago! Whether or not the quoted number is \"precise\" therefore depends on what I'm intending to do with it. If I care only about what minute the sun will rise tomorrow, then the number quoted here is fine. If I want to send a satellite to orbit just above the sun, however, then I would need to know distances more accurately.\n*significant digit: 유효 숫자", "34-a": "Richard Heinberg, an American journalist, argues that in building the renewable energy infrastructure to stop global warming, we are actually involved in one of the greatest change projects in human history. In addition to solar panels and wind turbines, we have to build an alternative transport infrastructure, farming procedures and industrial processes. This transformation cannot happen without fossil fuels. For instance, production of concrete structures and steel elements require amounts of energy that is only possible to produce with fossil energy. Production of solar panels requires scarce and expensive minerals which must be excavated, again requiring the use of fossil fuels. Thus, the harder we push towards a renewable energy system, the faster we have to use fossil energy for the construction process. This is not only expensive, but also an undermining factor for our efforts to cut global emissions. Heinberg remarks that the cost of building this new energy infrastructure is seldom counted in transition proposals, which tend to focus just on energy supply requirements.", "35-a": "Humans for centuries have dreamed of machines that could become intelligent and make human-like decisions. There have been myths about robots, automatons, and artificial beings since ancient Greece (e.g., the myth of Pandora, who released ills upon the world). Likewise, literature throughout history has dreamed of creating human-like creatures and thinking machines (e.g., Mary Shelley's Frankenstein). In 1950, British mathematician Alan Turing asked whether machines could think and reason like humans and then developed the Turing test to measure a machine's intelligence and whether the machines can think autonomously. A few years later, MIT professor John McCarthy coined \"artificial intelligence,\" replacing the previously used expression \"automata studies.\" Since then, artificial intelligence has become the study and practice of \"making intelligent machines\" that are programmed to think like humans — endowed by their creators with reasoning and learning.\n*automaton: 자동 장치 **endow: 부여하다", "36-a": "The desert tortoise has a simple solution for coping with Death Valley's extreme heat: It avoids it. The slow-moving creature hibernates during the winter and stays in its tunnel for much of the summer, meaning that it spends more than 90 percent of its life immobile. In fact, the tortoise usually only surfaces after a good rain. Then, it gets to work. The tortoise stocks up on water by eating plants and digging holes to collect rain. But to stay supplied with water through its extended hibernation, the reptile relies on something else — its highly sophisticated bladder. Unlike most animals, the tortoise's bladder acts as a holding tank, allowing it to reabsorb water back into its body. Incredibly, a desert tortoise can go a full year without taking in any freshwater at all. And because its bladder is so important to a tortoise's survival, park rangers often remind visitors not to stop and help the slow-movers across the road. Tortoises become so terrified when people pick them up that they empty their bladders, losing their precious water reserves.\n*hibernation: 동면 **bladder: 방광", "37-a": "Imagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? You gradually slow down. How could you slow down more suddenly, in a shorter distance? By putting the brakes on. Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims. This is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards. Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. One of these is friction in the wheels rubbing on the axles. Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. When you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate.", "38-a": "All editing systems are now nonlinear computer-based systems that allow random access to any video shot or scene without having to fast forward or fast reverse to find it. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves. Another highlight of a digital nonlinear system is its random access process that makes it easy for an editor to find desired shots or scenes without having to spend time fast forwarding or rewinding videotape. With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length automatically. Linear editing was like composing a paper on a typewriter. If a mistake was made or new information needed to be added the whole piece had to be retyped. Nonlinear editing, on the other hand, is like using a word processing program. If a mistake is made, it is easily deleted and fixed with a few keystrokes, and new information can be added easily.", "39-a": "A morally good person is one who does morally bad actions significantly less often than most and does morally good ones significantly more often than most. In judging a person not only her actions but also her intentions and motives are relevant. A morally good person must intend to do morally good actions and intend to avoid morally bad ones. A person who unintentionally prevents harm to others and does not harm them simply because things do not turn out as she intends is not morally good. Although this kind of situation generally occurs only in slapstick movies, it is worth mentioning to avoid the false impression that it is the actual consequences of a person's actions that count toward her being judged morally good or bad. But actual consequences are important. A person who always tries to prevent harm but never does, is not generally thought of as morally good. Of such a person, it may be said that she means well; but, contrary to Kant, some results are necessary before she is regarded as morally good.", "40-a": "Vision is influenced by our preconceptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind's eye, we tend to \"see\" it in profile or at some other \"ready for use\" angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer's head. The functional relationship we have with objects creates visual expectations that interfere with our ability to see \"like a camera.\" The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they don't interpret confusing details but simply serve them up to us with a mechanical indifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes.", "42-a": "\"May I help you?\" are the worst four words that a retail salesperson can utter because they don't encourage the customer to talk and put them on the defensive. The four words usually draw out a negative response that stops cold a sales transaction. Examples of better questions to use when approaching customers are \"Is there anything in particular that you are looking for?\" and \"Are you shopping for a gift?\" If a fashion salesperson approached you with \"May I help you?\" chances are you would feel the salesperson didn't care. This line is a rote approach that is so overused by untrained and uninterested salespeople. In fact, most of us shudder in horror on hearing these words. The very meaning of the question \"May I help you?\" implies that the customer is in trouble of some sort and needs rescuing. This almost always puts the customer on the defense. \"No, thank you\" is usually the immediate response, even if the customer is actually in need of assistance. The subconscious thought by the customer is often \"I'm smart enough to figure out what I want, and I don't need your help!\" If customers feel pressured or cornered, then salespeople won't make any sales. The approach has to promote a comfortable environment that makes customers feel there is no rush. Furthermore, if customers just want to look around, they should feel that it is all right to do so. In situations where customers really do want to look around on their own, salespeople should give customers their business cards and keep themselves accessible in case customers have questions or concerns.\n*shudder: 몸서리치다", "45-a": "While the cafeteria was full of high school students on that afternoon, Dave was thirsty. We sat near yet away from him, fixing our hair and worrying about the test next period we hadn't studied for. He was far away from our world, yet forced to be a part of it.\n\nHe stood at the drink machine with purpose, fumbling through his fake leather wallet for some change. He came up with a wrinkled dollar bill, and nervously glanced back at his table where other students in his class were sitting. Dave tried to make the machine accept his money. After he failed a few times, some students began to laugh at him. He started shaking, and tears began to form in his eyes. I saw him turn to sit down, looking like he had given up.\n\nBut for some reason, he decided against it. He wasn't leaving until he got a drink. With a determined expression, he kept aimlessly pushing the dollar bill into the machine. Just then a popular senior boy stood up from his seat, and walked over to the boy. He calmly explained how the machine often had trouble accepting dollar bills. After that, he pulled some coins from his pocket and put them into the machine. Dave gave him his dollar and chose a flavor of fruit juice. Then the two walked off in different directions.\n\nAlthough it was clear that they were from very different worlds, for one moment, they'd shared a real understanding. As I walked away from my lunch table that day, I looked at Dave. I thought he and the dollar were very much alike. They both weren't accepted where the world said they were supposed to be. But just as the dollar had found a place in a warm-hearted senior's pocket, I was sure he would eventually find his, too.\n*fumble: 더듬어 찾다"};

{"no": 2, "school": "달천고 (울산시)", "pref": "20", "type": "요약", "stem": "요약 - 'To sum up, to make your lesson (A)___, it is important to set a clear (B)___ at the beginning.'", "p": "20-a", "choices": ["(A) efficient — (B) review", "(A) effective — (B) routine", "(A) organized — (B) disorder", "(A) productive — (B) wrap-up", "(A) systematic — (B) distraction"], "ans": 2, "exp": "수업을 효과적(effective)으로 만들려면 시작 시 분명한 루틴(routine)을 정해야 한다는 내용이다.", "b": 2, "bb": "[학교 변형 지문]\nInefficient teachers overlook the potential power of the opening minutes of class. Often, if students are quiet enough and if there are many pressing demands on a teacher's time at that moment, more than ten minutes can disappear before class starts. It's no wonder that students are late for class; they have little reason to be on time. You can use the first ten minutes to get your class off to a great start, or you can choose to waste this time. The first minutes set the tone for the rest of the class. If you are prepared for class and have taught your students an opening routine, they can use this brief time to make mental and emotional transitions from the last class or subject and prepare to focus on learning new material. ↓ To sum up, to make your lesson (A)[___________], it is important to set a clear (B)[___________] at the beginning."},

{"no": 4, "school": "인천예고 (인천시)", "pref": "20", "type": "빈칸", "stem": "다음 빈칸 'In summary, you should ___ to develop your class with an effective start.'에 들어갈 말로 가장 적절한 것은?", "p": "20-a", "choices": ["establish an opening routine", "make students completely quiet", "lecture your students for arriving late", "demand students to study before class starts", "keep an eye on the potential power of your class"], "ans": 1, "exp": "수업 초 10분을 활용해 집중 환경을 만들라는 글이므로 '개시 루틴을 마련하라'가 적절하다.", "b": 3, "bb": "Inefficient teachers overlook the potential power of the opening minutes of class. Often, if students are quiet enough and if there are many pressing demands on a teacher's time at that moment, more than ten minutes can disappear before class starts. It's no wonder that students are late for class; they have little reason to be on time. You can use the first ten minutes to get your class off to a great start, or you can choose to waste this time. The first minutes set the tone for the rest of the class. If you are prepared for class and have taught your students an opening routine, they can use this brief time to make mental and emotional transitions from the last class or subject and prepare to focus on learning new material. In summary, you should __________ to develop your class with an effective start."},

{"no": 6, "school": "심인고 (대구시)", "pref": "20", "type": "종합", "stem": "다음 글(학교 변형본)에 대한 설명 중 옳지 않은 것은? [변형: 'Inefficient teachers ⓐneglect the potential power of the opening minutes of class.' / 'many ⓑpressing demands on a teacher's time' / 'more than ten minutes ⓒcan be disappeared before class starts' / 'It's no wonder that students are late for class. (A) You can use the first ten minutes ...' (원문의 'they have little reason to be on time' 삭제)]", "p": "20-a", "choices": ["밑줄 친 'ⓐneglect'는 'to not give enough attention to something or someone'을 의미한다.", "밑줄 친 'ⓑpressing'을 urgent, immediate, imperative로 바꿔 쓸 수 있다.", "밑줄 친 ⓒ[can be disappeared]는 문법적으로 틀렸으며, 올바른 형태는 능동형 can disappear이다.", "이 글의 제목으로는 'Why Students Should Value the First Ten Minutes of Class'가 알맞다.", "\"That's because nothing in the opening minutes convinces learners that punctuality matters.\" 문장은 (A)에 들어가는 것이 가장 적합하다."], "ans": 4, "exp": "글은 교사에게 수업 초 10분 운영 전략을 제시하므로 학생 대상 제목 ④는 부적절하다.", "b": 3},
{"no": 7, "school": "불당고 (천안시)", "pref": "21", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 원자는 끊임없이 이동하므로 우리는 같은 원자 풀을 공유함 ② 호흡과 땀 증발을 통해 원자가 사람 간에 순환함 ③ 'Atoms sometimes enjoy resting quietly in one place for millions of years, preferring stability over motion.' ④ 원자는 대규모로 재활용되며 일부는 태초부터 존재함 ⑤ 사후에 몸의 원자는 수많은 다른 존재들이 가져감)", "p": "21-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 3, "exp": "ⓒ는 원자가 수백만 년 동안 한곳에 머문다고 하여 원자의 순환·이동이라는 글의 흐름과 상충한다.", "b": 1, "bb": "[학교 변형 지문]\nMany atoms in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you inhale are exhaled in your next breath. The remaining atoms are taken into your body to become part of you, and they later leave your body by various means. You don't \"own\" the atoms that make up your body; you borrow them. ⓐWe all share from the same atom pool because atoms forever travel around, within, and among us. ⓑAtoms cycle from person to person as we breathe and as our sweat is evaporated. ⓒ Atoms sometimes enjoy resting quietly in one place for millions of years, preferring stability over motion. ⓓWe recycle atoms on a grand scale to the extent that some have existed since the first moments of time, recycling throughout the universe among limitless forms, both nonliving and living. ⓔThe atoms in your body will be taken up by numerous other entities after your lifetime."},
{"no": 8, "school": "별가람고 (남양주시)", "pref": "21", "type": "빈칸", "stem": "다음 빈칸 '___ that make up your body, and someday, those atoms will belong to many others after you.'에 들어갈 말로 가장 적절한 것은?", "p": "21-a", "choices": ["You are the temporary keeper of the atoms", "Your atoms are the immovable components", "You become the original forms of the atoms", "You have a dynamic system of renewing atoms", "Even your cough is made up of the exclusive atoms"], "ans": 1, "exp": "우리는 원자를 소유하는 것이 아니라 빌려 쓰므로 '원자의 일시적 보관자'가 적절하다.", "b": 1, "bb": "Many atoms in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you inhale are exhaled in your next breath. The remaining atoms are taken into your body to become part of you, and they later leave your body by various means. __________ that make up your body, and someday, those atoms will belong to many others after you. We all share from the same atom pool because atoms forever travel around, within, and among us. Atoms cycle from person to person as we breathe and as our sweat is evaporated. We recycle atoms on a grand scale. The origin of the lightest atoms goes back to the origin of the universe, and most heavier atoms are older than the Sun and Earth. There are atoms in your body that have existed since the first moments of time, recycling throughout the universe among limitless forms, both nonliving and living. You're the present caretaker of the atoms in your body. There will be many who will follow you."},
{"no": 9, "school": "인일여고 (인천시)", "pref": "21", "type": "주제", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "21-a", "choices": ["human responsibility for recycling in the universe", "the role of atoms in driving advances in medical research", "exploration of human life in the universe across time and space", "strategies for large-scale recycling of natural resources in modern society", "continuity of atoms that cycle through organisms, objects, and environments"], "ans": 5, "exp": "우주의 기원부터 이어진 원자들이 생물·무생물을 거쳐 순환한다는 연속성이 주제이다.", "b": 1},

{"no": 59, "school": "영남고 (대구시)", "pref": "23", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "23-a", "choices": ["Reaching Beyond Our Senses: How Instruments Help Us Perceive Better", "How Human Senses Inspired Scientific Invention", "The Price of Progress: Are We Losing Touch with Our Real Senses?", "Tools that Confuse Rather than Clarify Our Senses", "The Invisible Made Visible: The Evolution of Scientific Instruments"], "ans": 1, "exp": "도구가 감각의 한계를 넘어 자연 현상을 지각하게 해 준다는 내용이므로 ①이 적절.", "b": 4},
{"no": 60, "school": "삼문고 (김해시)", "pref": "23", "type": "요약", "stem": "요약 - 'Humans have consistently expanded their (A)___ world by employing instruments that either (B)___ the reach of vision and hearing or (C)___ phenomena beyond any innate sensory ability into observable forms.'", "p": "23-a", "choices": ["(A) intellectual — (B) extend — (C) stimulate", "(A) perceptual — (B) extend — (C) translate", "(A) perceptual — (B) extend — (C) stimulate", "(A) perceptual — (B) perceive — (C) translate", "(A) intellectual — (B) perceive — (C) translate"], "ans": 2, "exp": "지각의(perceptual) 세계를 넓히고, 시청각의 범위를 확장하거나(extend) 감각 밖 현상을 관찰 가능한 형태로 바꾼다(translate).", "b": 4, "bb": "[학교 변형 지문]\nFor many centuries, humans have taken advantage of tools that translate and bring into our perception natural phenomena that we can't perceive with our senses. In some cases, this consists of simply amplifying signals that feed into our normal sensory inputs (e.g., telescopes can bring into clear view that which is too far away for our eyes to perceive on their own). Other instruments turn signals that we cannot perceive into ones that we can observe. Some of these take the form of expanding the reach of our current senses, such as creating visible images based on the ultraviolet spectrum of light or changing sounds that are normally outside the range of what human ears can hear into audible signals. Alternatively, some instruments measure properties for which we have no sensory capacity at all and change them into that which we can observe. ↓ Humans have consistently expanded their (A)[_________] world by employing instruments that either (B)[_________] the reach of vision and hearing or (C)[_________] phenomena beyond any innate sensory ability into observable forms."},
{"no": 61, "school": "대성고 (청주시)", "pref": "24", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "24-a", "choices": ["ⓐ does", "ⓑ are", "ⓒ that", "ⓓ responsible", "ⓔ to believe"], "ans": 1, "exp": "ⓐ does → do(did): 선행사 many medical advances가 복수이다.", "b": 1, "bb": "[학교 변형 지문]\nMany opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that ⓐdoes contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they ⓑare used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence ⓒthat animal experimentation led to medical advances. Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as ⓓresponsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us ⓔto believe."},
{"no": 62, "school": "충북대학교사범대학부설고 (청주시)", "pref": "24", "type": "빈칸", "stem": "다음 빈칸 'Moreover, several influential physicians have offered historical evidence that ___.'에 들어갈 말로 가장 적절한 것은?", "p": "24-a", "choices": ["most medical techniques would not be accepted if it were not for animal experimentation", "the development of biomedicine has not primarily resulted from animal experimentation", "animal experimentation has benefits that cannot be produced in other ways", "the moral issues of animal experimentation have not been tackled seriously", "animal experimentation should be encouraged by laws regarding its effectiveness"], "ans": 2, "exp": "임상 발견이 더 큰 역할을 했다는 내용이 이어지므로 생의학 발전이 주로 동물실험의 결과가 아니라는 것이 적절하다.", "b": 1, "bb": "Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that animal experimentation led to medical advances. Moreover, several influential physicians have offered historical evidence that __________. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe."},
{"no": 63, "school": "신흥고 (청주시)", "pref": "24", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "24-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 4, "exp": "옹호자의 상관→인과 주장(C) → 반대자의 반박(A) → 역사적 근거 추가(B) 순이다.", "b": 1, "bb": "Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter.\n\n(A) Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that animal experimentation led to medical advances.\n\n(B) Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe.\n\n(C) Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals."},
{"no": 64, "school": "청주여고 (청주시)", "pref": "24", "type": "어법", "stem": "다음 글(24번 변형)에 관한 설명으로 옳지 않은 것은? (ⓐ argue that [not only modern medicine is] not the only cause for the decline in mortality, but also … ⓑ many medical advances that did contribute to human health were not the result … ⓒ Defenders of research have claimed that since there is a strong correlation … ⓓ the law prescribes that all new drugs … be tried on animals … ⓔ not evidence that animal experimentation led to medical advances ⓕ [___], several influential physicians have offered historical evidence … ⓖ than animal researchers have led us [to believe / believing])", "p": "24-a", "choices": ["There is a grammatical error in ⓐ.", "There is no grammatical error in ⓑ.", "ⓒ and ⓓ cannot be replaced with 'which', but ⓔ can.", "'Besides' is appropriate in ⓕ.", "ⓖ should contain 'to believe'."], "ans": 3, "exp": "ⓔ는 evidence의 내용을 설명하는 동격의 that이므로 which로 바꿀 수 없다.", "b": 2},
{"no": 65, "school": "청주여고 (청주시)", "pref": "24", "type": "요약", "stem": "요약 - 'Both supporters and opponents of animal experimentation exist. The former argues that medical advancement have been significantly (A)___ by animal experimentation, while the latter claims that the reason animal experimentation seems to be the (B)___ of medical advances is merely a result of legal necessity.'", "p": "24-a", "choices": ["(A) influenced — (B) cause", "(A) disturbed — (B) motive", "(A) advanced — (B) decision", "(A) aided — (B) fact", "(A) delayed — (B) necessity"], "ans": 1, "exp": "지지 측은 의학 발전이 동물실험의 영향(influenced)을 받았다고, 반대 측은 동물실험이 원인(cause)처럼 보이는 것은 법적 필요 때문이라고 주장한다.", "b": 2},
{"no": 66, "school": "해송고 (인천시)", "pref": "24", "type": "어법(복수)", "stem": "다음 밑줄 친 부분 중 어법상 어색한 부분이 있는 것의 개수는?", "p": "24-a", "choices": ["1개", "2개", "3개", "4개", "5개"], "ans": 3, "exp": "ⓐ 부정어 도치 → not only is modern medicine, ⓒ 요구 동사 뒤 → (should) be tried, ⓓ 단수 주어 → is로 고쳐야 하므로 3개이다.", "b": 2, "bb": "[학교 변형 지문]\nMany opponents of animal experimentation argue that ⓐ [not only modern medicine is not the only cause for the decline in mortality], but also many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed ⓑ[that since there is a strong correlation between the practice of animal experimentation and medical advancement], the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. ⓒ[Since the law requires that all new drugs, prosthetic devices, and surgical techniques are tried on animals before they are used in humans], we will subsequently find that all medical advances are correlated with prior experimentation on animals. Consequently, ⓓ [the correlation between animal experimentation and medical discovery are the result of legal necessity], not evidence that animal experimentation led to medical advances. Moreover, ⓔ[several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest]. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe."},
{"no": 67, "school": "청수고 (천안시)", "pref": "24", "type": "어휘", "stem": "다음 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "24-a", "choices": ["ⓐ decline", "ⓑ Defenders", "ⓒ prior", "ⓓ legal", "ⓔ less"], "ans": 5, "exp": "ⓔ less → more: 임상적 발견이 동물 연구자들이 믿게 한 것보다 더 큰 역할을 했다는 주장이다.", "b": 2, "bb": "[학교 변형 지문]\nMany opponents of animal experimentation argue that not only is modern medicine not the only cause for the ⓐdecline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. ⓑDefenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with ⓒprior experimentation on animals. Consequently, the correlation between animal experimentation and medical discovery is the result of ⓓ legal necessity, not evidence that animal experimentation led to medical advances. Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a ⓔless substantial role than animal researchers have led us to believe."},
{"no": 68, "school": "봉명고 (청주시)", "pref": "24", "type": "빈칸", "stem": "다음 빈칸 'Consequently, the correlation between animal experimentation and medical discovery is ___, not evidence that animal experimentation led to medical advances.'에 들어갈 말로 가장 적절한 것은?", "p": "24-a", "choices": ["due to emotional distress", "the result of legal necessity", "the grip of a lengthy drought", "upon the constitutional foundation", "the religious manuscripts of modern society"], "ans": 2, "exp": "법이 모든 신기술의 동물실험을 규정하므로 상관관계는 '법적 필요의 결과'이다.", "b": 3, "bb": "Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Consequently, the correlation between animal experimentation and medical discovery is __________, not evidence that animal experimentation led to medical advances. Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe."},
{"no": 69, "school": "봉명고 (청주시)", "pref": "24", "type": "내용일치(개수)", "stem": "윗글의 내용을 바르게 이해한 것은 모두 몇 개인가? <보기> (A) Many critics of animal testing argue that modern medicine is not the only reason death rates have gone down, and that many medical advances which truly improved human health were not the result of animal experiments. (B) Supporters of animal experimentation claim that because animal testing and medical progress often appear closely connected, animal testing must have been the cause of that medical progress. (C) Opponents of animal experimentation deny the conclusion that animal testing caused medical progress, explaining that there are distinct reasons why animal testing and medical progress can appear not to go together. (D) Because the law requires that every new drug, prosthetic device, and surgical method must be tested on animals before humans, all medical progress will naturally seem connected to earlier animal experiments. (E) Therefore, the relationship between experiments on animals and discoveries in medicine comes from legal obligations, not from proof that experiments on animals directly caused progress in medicine. (F) In addition, several influential physicians have presented historical evidence showing that animal testing played a smaller role in medical discovery than supporters of animal experimentation claim. (G) Influential physicians argue that discoveries from patients and hospitals played a more significant role in medical progress than animal researchers have made people believe.", "p": "24-a", "choices": ["7개", "6개", "5개", "4개", "3개"], "ans": 2, "exp": "(C)는 '함께 나타날(correlated) 독립적 이유'를 '함께 나타나지 않을'로 바꿔 틀리고, 나머지 6개가 옳다.", "b": 3},
{"no": 70, "school": "운호고 (청주시)", "pref": "24", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that animal experimentation led to medical advances.", "p": "24-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 4, "exp": "법이 동물실험을 요구해 상관관계가 생긴다는 근거 뒤, 새 증거를 더하는 Moreover 앞에 결론으로 온다.", "b": 3, "bb": "Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. ( ① ) Opponents of research reject this inference. ( ② ) After all, we have independent reasons to expect these phenomena to be correlated. ( ③ ) Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. ( ④ ) Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. ( ⑤ ) They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe."},
{"no": 71, "school": "청라고 (인천시)", "pref": "24", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 그러나 반대측은 독립적 이유가 있다며 이 추론을 거부 ② 법이 모든 신약·보철·수술법의 동물실험을 규정하므로 모든 의학 발전이 동물실험과 상관됨 ③ 따라서 상관관계는 법적 필요의 결과일 뿐 인과의 증거가 아님 ④ 'For example, experiments can include injecting substances, force-feeding, surgically altering animals, and exposing them to harmful conditions to observe effects like pain, fear, or lasting harm.'(학교 추가 문장) ⑤ 'Moreover, several influential physicians claim that clinical discoveries, such as the development of vaccines and the discovery of antibiotics, played a more substantial role than animal researchers have led us to believe.')", "p": "24-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "④는 동물실험의 구체적 방법 나열로, 상관관계와 법적 필요라는 논증 흐름에서 벗어난다.", "b": 3, "bb": "[학교 변형 지문]\nDefenders of animal experimentation have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. ⓐHowever, opponents of research reject this inference, arguing that we have independent reasons to expect these phenomena to be correlated. ⓑSince the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. ⓒConsequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that animal experimentation led to medical advances. ⓓFor example, experiments can include injecting substances, force-feeding, surgically altering animals, and exposing them to harmful conditions to observe effects like pain, fear, or lasting harm. ⓔMoreover, several influential physicians claim that clinical discoveries, such as the development of vaccines and the discovery of antibiotics, played a more substantial role than animal researchers have led us to believe."},
{"no": 72, "school": "인천예고 (인천시)", "pref": "24", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "24-a", "choices": ["ⓐ is", "ⓑ phenomena", "ⓒ be tried", "ⓓ which", "ⓔ as"], "ans": 4, "exp": "ⓓ which → that: 뒤에 완전한 절이 오는 evidence의 동격절이므로 접속사 that이 필요하다.", "b": 3, "bb": "[학교 변형 지문]\nMany opponents of animal experimentation argue that not only ⓐis modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these ⓑphenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques ⓒbe tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence ⓓwhich animal experimentation led to medical advances. Moreover, several influential physicians have offered historical proof that animal experimentation has not been as responsible for biomedical discovery ⓔas defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe."},
{"no": 73, "school": "석정여고 (인천시)", "pref": "24", "type": "요지", "stem": "다음 글의 요지로 가장 적절한 것은?", "p": "24-a", "choices": ["의료 기술 발전을 위해 더 많은 동물 실험이 필요하다.", "동물 실험은 의료 발전의 핵심 요소로 역사적으로 입증되어 왔다.", "동물 실험 임상 실험보다 의학 발전에 더 큰 기여를 해 왔다.", "동물 실험과 의학 발전 사이의 인과관계는 다양한 통계로 입증되었다.", "동물 실험과 의학 발전의 상관관계는 법적 이유에서 비롯되었으며 임상 연구가 중요한 역할을 했다."], "ans": 5, "exp": "상관관계는 법적 필요에서 비롯되었고 임상적 발견이 더 큰 역할을 했다는 것이 요지이다.", "b": 3},
{"no": 74, "school": "부개여고 (인천시)", "pref": "24", "type": "빈칸", "stem": "다음 빈칸 'Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that ___.'에 들어갈 말로 가장 적절한 것은?", "p": "24-a", "choices": ["clinical discoveries were more influential than expected", "animal experimentation is different from the clinical experimentation", "animal experimentation has often been misunderstood historically", "animal experimentation actually brought about medical advancement", "medical discoveries can occur without any animal experimentation"], "ans": 4, "exp": "상관관계가 법적 필요의 결과일 뿐 '동물실험이 의학 발전을 초래했다'는 증거는 아니라는 대조이다.", "b": 3, "bb": "Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter. Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals. Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that __________. Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe."},
{"no": 75, "school": "인일여고 (인천시)", "pref": "24", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "24-a", "choices": ["(A)-(C)-(B)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 2, "exp": "(B) 옹호자의 상관관계 주장과 반론 → (A) 법적 필요에 의한 상관관계 설명 → (C) Moreover로 추가 역사적 증거.", "b": 4, "bb": "Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation. Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter.\n\n(A) Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that animal experimentation led to medical advances.\n\n(B) Opponents of research reject this inference. After all, we have independent reasons to expect these phenomena to be correlated. Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals.\n\n(C) Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest. They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe."},
{"no": 76, "school": "살레시오고 (광주시)", "pref": "25", "type": "내용불일치(도표)", "stem": "다음 도표(2020년 6개국 온라인 뉴스 소비 선호 비율 %, 읽기/시청/청취: Philippines 36/52/12, Thailand 38/40/22, India 39/40/21, Germany 67/23/10, UK 78/15/7, Finland 82/12/6)에 대한 설명 중 일치하지 않는 것은?", "p": "25-a", "choices": ["ⓐ In Germany, the UK and Finland, reading was the most preferred way of consuming online news, with its percentage over 60 percent across the three countries.", "ⓑ The interesting point is that the Philippines, Thailand and India all strongly preferred to watch online news over any other form, with a clear majority choosing watching.", "ⓒ In terms of preference to watching online news, the Philippines showed the highest percentage and Finland showed the lowest preference among all six countries.", "ⓓ Four out of ten preferred to watch online news in both Thailand and India, and that percentage was more than three times as high as that of Finland.", "ⓔ For every country, the least preferred way of consuming online news is listening."], "ans": 2, "exp": "태국(시청 40%, 읽기 38%)과 인도(시청 40%, 읽기 39%)는 시청이 '명확한 다수'라고 볼 수 없다.", "b": 3},
{"no": 77, "school": "청주여고 (청주시)", "pref": "25", "type": "내용불일치(도표)", "stem": "다음 도표(2020년 6개국 온라인 뉴스 소비 선호 비율 %, 읽기/시청/청취: Philippines 36/52/12, Thailand 38/40/22, India 39/40/21, Germany 67/23/10, UK 78/15/7, Finland 82/12/6)에 대한 설명 중 일치하지 않는 것은?", "p": "25-a", "choices": ["ⓐ One out of ten preferred to listen to online news in Germany.", "ⓑ The percentage for the second most preferred way of consuming online news in the Philippines is six times as high as the percentage for the least preferred way in Finland.", "ⓒ In two thirds of all countries, the percentage for the most preferred way of consuming online news is over 50%.", "ⓓ In terms of preference to listening online news, Finland showed the lowest percentage and the Philippines showed the second highest percentage among the six countries.", "ⓔ Both the highest percentage in reading preference and the lowest percentage in listening preference belong to the same country."], "ans": 4, "exp": "청취 비율은 태국 22% > 인도 21% > 필리핀 12% 순이므로 두 번째로 높은 나라는 인도이다.", "b": 3},
{"no": 78, "school": "운호고 (청주시)", "pref": "26", "type": "어법", "stem": "다음 글의 밑줄 친 부분 중, 어법상 어색한 것은?", "p": "26-a", "choices": ["ⓐ use", "ⓑ which", "ⓒ themselves", "ⓓ including", "ⓔ protect"], "ans": 3, "exp": "ⓒ themselves → them: 주어(he)와 목적어(whales)가 다르므로 재귀대명사를 쓸 수 없다.", "b": 3, "bb": "[학교 변형 지문]\nRoger Payne was born in Manhattan in 1935. He studied biology at Harvard University and eventually earned his Ph.D. from Cornell University in 1961. In 1967, he discovered that humpback whales make long and complex sounds. They're known as \"whale songs,\" and he showed that whales ⓐuse them to communicate. Then in 1970, he released an album Songs of the Humpback Whale, ⓑwhich became a surprise hit and helped start the global \"Save the Whales\" movement. The following year, he founded Ocean Alliance to protect whales and the earth's oceans, and he used new, safe methods to study whales without harming ⓒthemselves. Over his career, he led more than 100 research trips worldwide, ⓓincluding the Voyage of the Odyssey from 2000 to 2005, which studied ocean pollution. His work helped make laws that ⓔprotect marine mammals, which finally led to the global ban on commercial whaling in 1986.\n*humpback whale: 혹등고래"},

{"no": 81, "school": "초은고 (인천시)", "pref": "27", "type": "내용불일치", "stem": "다음 Father-Daughter Sock Hop에 관한 안내문의 내용과 일치하지 않는 것은?", "p": "27-a", "choices": ["오후 6시부터 9시까지 열린다.", "딸이 추가로 참가할 경우 1인당 5달러가 추가된다.", "행사 당일 취소 시 환불이 불가능하다.", "참가자 전원에게는 기념품으로 티셔츠가 제공된다.", "포토존에서 사진을 찍을 수 있다."], "ans": 4, "exp": "참가자 전원에게 주는 선물은 양말 한 켤레(a pair of socks)이다.", "b": 2},

{"no": 83, "school": "인일여고 (인천시)", "pref": "29", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] Naturally, the nervous species are difficult to keep in captivity.", "p": "29-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 2, "exp": "두 유형의 대비 뒤, 우리에 가두었을 때의 결과(If put into an enclosure) 앞에 들어가야 한다.", "b": 1, "bb": "Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. ( ① ) Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don't run until necessary. ( ② ) If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. ( ③ ) That's true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. ( ④ ) There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. ( ⑤ ) But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"},
{"no": 84, "school": "불당고 (천안시)", "pref": "29", "type": "빈칸", "stem": "다음 빈칸 'Naturally, the nervous species ___. If put into an enclosure, they are likely to panic…'에 들어갈 말로 가장 적절한 것은?", "p": "29-a", "choices": ["can be trained to ignore predators", "rarely feel fear in new environments", "are the easiest species to domesticate", "prefer living alone rather than in herds", "are easily frightened and thus so hard to confine"], "ans": 5, "exp": "우리에 넣으면 공포에 빠진다는 뒤 내용으로 보아, 쉽게 겁을 먹어 가두기 어렵다는 것이 적절하다.", "b": 1, "bb": "Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don't run until necessary. Naturally, the nervous species __________. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That's true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"},
{"no": 85, "school": "대암고 (창원시)", "pref": "29", "type": "내용일치", "stem": "다음 <보기> 중 글의 내용과 일치하는 것은 모두 몇 개인가? (ⓐ All big mammalian herbivores are slow and rely on herds for protection. ⓑ Some big herbivores are naturally nervous and try to escape immediately when they sense danger. ⓒ Nervous species are very difficult to keep in captivity because they panic easily. ⓓ Gazelles were one of the most commonly hunted animals in the Fertile Crescent. ⓔ Gazelles have been successfully domesticated in some parts of the Fertile Crescent. ⓕ No species of gazelle has ever been successfully domesticated. ⓖ The domestication of gazelles is challenging due to their remarkable speed and their instinct to seek safety in the herd.)", "p": "29-a", "choices": ["2개", "3개", "4개", "5개", "6개"], "ans": 3, "exp": "ⓑ, ⓒ, ⓓ, ⓕ의 4개가 일치하며, ⓐ·ⓔ·ⓖ는 본문과 다르다.", "b": 1},
{"no": 86, "school": "대성고 (청주시)", "pref": "29", "type": "어법(복수)", "stem": "다음 글의 밑줄 친 ⓐ~ⓗ 중 어법상 어색한 것의 개수는?", "p": "29-a", "choices": ["1개", "2개", "3개", "4개", "5개"], "ans": 2, "exp": "ⓑ threatening → threatened(수동 의미), ⓗ what → that/which(선행사 an animal)의 2개가 어색하다.", "b": 1, "bb": "[학교 변형 지문]\nBig mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when ⓐ perceiving a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when ⓑ threatening, and don't run until necessary. Naturally, the nervous species are difficult to keep in captivity. If ⓒput into an enclosure, they are likely to panic, and either die of shock or hit ⓓthemselves repeatedly to death against the fence in their attempts to escape. That's true, for example, of gazelles, ⓔwhich for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species ⓕthat the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species ⓖhas ever been domesticated. Just imagine trying to herd an animal ⓗwhat runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"},

{"no": 88, "school": "별가람고 (남양주시)", "pref": "29", "type": "순서", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "p": "29-a", "choices": ["(A)-(B)-(C)", "(B)-(A)-(C)", "(B)-(C)-(A)", "(C)-(A)-(B)", "(C)-(B)-(A)"], "ans": 3, "exp": "유형 대비(B) → 우리 안에서의 반응과 가젤의 예(C) → 가젤 가축화 실패(A) 순이다.", "b": 1, "bb": "Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat.\n\n(A) There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!\n\n(B) Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don't run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape.\n\n(C) That's true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent."},
{"no": 89, "school": "석정여고 (인천시)", "pref": "29", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 우리에 넣으면 공황에 빠져 충격으로 죽거나 울타리에 부딪혀 죽음 ② 가젤이 그 예로, 수천 년간 비옥한 초승달 지대에서 가장 많이 사냥됨 ③ 초기 정착민들에게 가젤보다 가축화 기회가 많았던 포유류는 없음 ④ 'Humans' desire to domesticate animals began with survival and economic needs and later expanded to social, emotional, and cultural purposes.' ⑤ 그러나 어떤 가젤 종도 가축화된 적이 없음)", "p": "29-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "exp": "④ 인간의 가축화 욕구의 기원과 확장은 가젤이 가축화되지 못한 이유라는 흐름과 무관하다.", "b": 2, "bb": "[학교 변형 지문]\nBig mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, ⓐ[less / more] nervous, seek protection in herds, stand their ground when ⓑthreatened, and don't run until necessary. Naturally, the nervous species are difficult to keep in ⓒcaptivity. If put into an enclosure, they are likely to panic, and either die of shock or hit ⓓthemselves repeatedly to death against the fence in their attempts to escape. That's true, for example, of gazelles, which for thousands of years ⓔwere the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But ⓕ[어떤 가젤 종도 지금까지 길들여진 적이 없다]. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"},
{"no": 90, "school": "청주여고 (청주시)", "pref": "29", "type": "종합", "stem": "다음 글(29번)을 읽고 정리한 노트 중 바르게 적은 것의 개수는? [밑줄: ⓐ Other species are slower, [less / more] nervous ⓑ stand their ground when threatened ⓒ difficult to keep in captivity ⓓ hit themselves repeatedly ⓔ gazelles, which … were the most frequently hunted ⓕ But [어떤 가젤 종도 지금까지 길들여진 적이 없다]] 노트: ⓐ에는 맥락상 less가 맞다. / ⓑ를 어법에 맞게 threatening으로 고친다. / ⓒ의 영영 풀이는 the state of being free in a place다. / ⓓ가 가리키는 것은 맥락상 the nervous species다. / ⓔ는 어법상 고칠 게 없다. / ⓕ를 no gazelle species has ever been domesticating으로 영작한다.", "p": "29-a", "choices": ["1개", "2개", "3개", "4개", "5개"], "ans": 3, "exp": "바른 것은 ⓐ, ⓓ, ⓔ의 3개이다. ⓑ는 threatened가 맞고, captivity는 '갇힌 상태'이며, ⓕ는 has ever been domesticated가 맞다.", "b": 2},

{"no": 99, "school": "문수고 (울산시)", "pref": "29", "type": "내용불일치", "stem": "다음 글의 내용과 일치하지 않는 것은?", "p": "29-a", "choices": ["큰 포유류의 초식동물 종은 포식자나 인간으로부터의 위험에 대해 다른 방식으로 반응한다.", "긴장하는 동물 종은 갇힌 상태를 유지하기 어렵고 만약 우리 안에 넣어지면, 그들은 패닉에 빠지게 될 가능성이 있다.", "긴장하는 동물을 가두면 폭력적 성향으로 인해 자기 자신을 반복해서 울타리에 부딪혀 죽을 수 있다.", "Fertile Crescent의 일부 지역에서 가젤이 가장 빈번하게 사냥되는 사냥감이었다.", "가젤은 위협을 감지했을 때 긴장하는 동물 종으로서, 지금까지 길들여진 적이 없다."], "ans": 3, "exp": "울타리에 부딪혀 죽는 것은 탈출 시도 때문이지 '폭력적 성향' 때문이 아님.", "b": 4},
{"no": 100, "school": "화담고 (화성시)", "pref": "30", "type": "무관문장", "stem": "다음 글에서 전체 흐름과 관계없는 문장은? (① 여행 중 유목 부족을 만나면 집을 열고 음식과 환대를 제공함 ② 'The lamb dishes cooked by Mongolians are recognized as outstanding around the world.' ③ 친절해서가 아니라 생존이 나눔에 달려 있기 때문임 ④ 가질수록 사람을 막는 데 힘쓰고 나눔에 관심이 줄어드는 아이러니 ⑤ 더 많이 원하고 교류가 줄면 현실과의 단절이 생김)", "p": "30-a", "choices": ["①", "②", "③", "④", "⑤"], "ans": 2, "exp": "ⓑ 몽골 양고기 요리에 대한 평가는 결핍 속 나눔과 풍요 속 고립이라는 논지에서 벗어난다.", "b": 1, "bb": "[학교 변형 지문]\nFor a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain nomadic tribes don't have much, yet they are happy to share because it is in their interest to do so. ⓐIf you happen upon them in your travels, they will open up their homes and give you their food and hospitality. ⓑThe lamb dishes cooked by Mongolians are recognized as outstanding around the world. ⓒIt's not just because they are nice people; it's because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. ⓓIt is ironic that the more resources we gain, the more effort we put into keeping people out and the less interest we show in sharing. ⓔOur desire for more, combined with our decreased physical interaction with the \"common folk,\" starts to create a disconnection or blindness to reality."},
{"no": 101, "school": "불당고 (천안시)", "pref": "30", "type": "어조", "stem": "Which of the following reflects the writer's tone in the last line ('Our desire for more, combined with our decreased physical interaction with the \"common folk,\" starts to create a disconnection or blindness to reality.')?", "p": "30-a", "choices": ["Worried and critical", "Exciting and elated", "Optimistic and hopeful", "Teasing and humorous", "Encouraging and motivating"], "ans": 1, "exp": "더 많이 가질수록 현실과 단절된다는 마지막 문장은 우려와 비판의 어조를 띤다.", "b": 1},
{"no": 102, "school": "초은고 (인천시)", "pref": "30", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] Certain nomadic tribes don't have much, yet they are happy to share because it is in their interest to do so.", "p": "30-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 2, "exp": "유목 부족 사례 문장은 그들(them)을 여행 중 만나면 환대한다는 구체적 내용 앞에 와야 한다.", "b": 1, "bb": "For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. ( ① ) When we have less, we tend to be more open to sharing what we have. ( ② ) If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. ( ③ ) It's not just because they are nice people; it's because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. ( ④ ) Ironically, the more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. ( ⑤ ) Our desire for more, combined with our decreased physical interaction with the \"common folk,\" starts to create a disconnection or blindness to reality."},
{"no": 103, "school": "영동일고 (서울시)", "pref": "30", "type": "제목", "stem": "다음 글의 제목으로 가장 적절한 것은?", "p": "30-a", "choices": ["The Natural Desire for Unlimited Resources", "Sharing in Times of Scarcity vs. Abundance", "Hospitality as a Sign of Cultural Superiority", "Nomadic Tribes and Their Harsh Survival Strategies", "The Dangers of Abandoning Modern Security Systems"], "ans": 2, "exp": "결핍할수록 나누고 풍요로울수록 담을 쌓는다는 대비가 핵심이다.", "b": 1},
{"no": 104, "school": "세광고 (청주시)", "pref": "30", "type": "요약", "stem": "요약 - 'We have inborn inclination to share and cooperate when have (A)___ property; but as resources are bountiful, outside dangers are scarce, we don't (B)___ as before.'", "p": "30-a", "choices": ["(A) modest — (B) stick together", "(A) ample — (B) unite", "(A) limited — (B) withhold", "(A) meager — (B) monopolize", "(A) abundant — (B) co-use"], "ans": 1, "exp": "가진 것이 적을 때(modest) 나누지만, 풍요로워지면 예전처럼 함께하지(stick together) 않는다.", "b": 1, "bb": "[학교 변형 지문]\nAs a species born in a time when resources were limited and dangers were great, we have an innate tendency to share and cooperate. For example, certain nomadic tribes don't have much, yet they are happy to share because it is in their instinct to do so. If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. It's not just because they are nice people; it's because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. When we have less, we are likely to be more open to sharing what we have. But as technology advances, resources are plenty, and outside dangers are few, we begin to change. We abandon our natural tendency and adapt to new environmental and social conditions. With less physical interaction with the common folk, people start focusing on protecting their own property. The more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. ↓ We have inborn inclination to share and cooperate when have (A)[__________] property; but as resources are bountiful, outside dangers are scarce, we don't (B)[__________] as before."},
{"no": 105, "school": "인일여고 (인천시)", "pref": "30", "type": "주제", "stem": "다음 글의 주제로 가장 적절한 것은?", "p": "30-a", "choices": ["reasons why poor people want to disconnect from reality", "relationship between scarcity and willingness to pursue security", "importance of food and hospitality in sustaining human communities", "paradox that abundance often leads to isolation rather than generosity", "role of cooperation in ensuring survival within a particular nomadic tribe"], "ans": 4, "exp": "풍요가 관대함보다 오히려 고립을 낳는다는 역설이 주제이다.", "b": 1},

{"no": 151, "school": "해송고 (인천시)", "pref": "32", "type": "어휘", "stem": "다음 밑줄 친 부분 중 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "p": "32-a", "choices": ["ⓐ drive", "ⓑ accumulates", "ⓒ suppress", "ⓓ insufficient", "ⓔ less"], "ans": 3, "exp": "ⓒ suppress → trigger: 아데노신은 필요할 때 잠을 유도하는 신호 역할을 한다.", "b": 2, "bb": "[학교 변형 지문]\nEven if you delay going to bed to fit more activities into your day, the urge to sleep eventually becomes so strong that you can't resist it. This constant ⓐdrive for sleep seems to be partly caused by a substance called adenosine. As you remain awake, this chemical gradually ⓑaccumulates in your blood, and while you sleep, your body breaks down the adenosine. It likely acts as a signal your body uses to measure how much rest you've missed and to ⓒsuppress sleep when necessary. When adenosine and other factors build up over several nights of ⓓ insufficient rest, you develop a \"sleep debt\" that your body repays by sleeping longer than usual. Because of this natural feedback system, you cannot truly adjust to sleeping ⓔless than your body requires. In the end, the lack of proper sleep always catches up with you."},

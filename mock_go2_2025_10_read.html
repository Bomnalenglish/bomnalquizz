*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:#2a2a2a;}
.hidden{display:none!important;}

/* START */
#startScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.s-card{background:var(--card);border-radius:24px;padding:36px 28px;text-align:center;max-width:520px;width:100%;box-shadow:0 8px 32px rgba(107,74,43,.15);}
.s-card h1{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--pri);margin-bottom:6px;}
.s-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.info-item{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--pri);font-weight:700;}
.ni{width:100%;padding:11px 14px;border:2px solid var(--bdr);border-radius:12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:10px;}

.start-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}

/* PASSAGE SELECT */
#passageScreen{padding:20px;max-width:680px;margin:0 auto;}
.ps-header{background:linear-gradient(135deg,#f7efe4,#ece0d2);color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:18px 22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.ps-title{font-family:'Black Han Sans',sans-serif;font-size:16px;}
.ps-sub{font-size:11px;opacity:.8;margin-top:3px;}

.fb.on{background:var(--pri);color:white;}
.passage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:20px;}
.p-card{background:white;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:2.5px solid #e6dccd;transition:all .18s;position:relative;}
.p-card:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:0 6px 18px rgba(107,74,43,.12);}
.p-card.sel{border-color:var(--pri);background:#f3ebe0;}
.p-card.done{border-color:#4caf50;background:#e8f5e9;}
.p-no{font-family:'Black Han Sans',sans-serif;font-size:18px;color:var(--pri);margin-bottom:2px;}
.p-count{font-size:10px;color:var(--muted);}

.type-box{background:white;border-radius:12px;padding:12px 14px;margin-bottom:14px;border:2px solid #e6dccd;}
.type-row{display:flex;gap:6px;flex-wrap:wrap;}
.type-row .fb{padding:6px 12px;font-size:12.5px;}
.type-row .fb small{font-weight:400;opacity:.75;margin-left:3px;}
.p-card.off{opacity:.35;pointer-events:none;}
.cnt-box{background:white;border-radius:12px;padding:12px 14px;margin-bottom:10px;border:2px solid #e6dccd;}
.cnt-lbl{font-size:13px;font-weight:800;color:var(--pri);margin-bottom:8px;}
.cnt-lbl span{font-weight:400;color:var(--muted);font-size:12px;}
.cnt-row{display:flex;gap:8px;flex-wrap:wrap;}
.p-solved{font-size:10px;color:var(--muted);margin-top:2px;}

.passage-box .mk{color:#8a4b1c;}

.go-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;}

/* QUIZ HEADER */
.hdr{background:#f7efe4;color:#5c3d1e;border-bottom:1px solid #e8dccb;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.ht{font-family:'Black Han Sans',sans-serif;font-size:15px;}
.hs{font-size:10px;opacity:.7;margin-top:2px;}
.hb{background:#fff;color:#5c3d1e;border:1px solid #e8dccb;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700;}
.pw{height:4px;background:#e6dccd;}.pf{height:100%;background:linear-gradient(90deg,#6b4a2b,#b07a45);transition:width .4s;}

/* QUIZ AREA */
#quizArea{padding:20px;max-width:720px;margin:0 auto;}

.q-no-badge{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.qno{font-family:'Black Han Sans',sans-serif;font-size:13px;color:white;background:var(--pri);padding:3px 12px;border-radius:12px;}
.qtype{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;background:#f6e7d6;color:#9a5b2b;}
.qsrc{font-size:10px;color:var(--muted);margin-left:auto;}
.passage-tag{font-size:10px;font-weight:700;color:#6b4a2b;background:#f3ebe0;padding:2px 8px;border-radius:8px;}
.passage-box{background:#fbf7f1;border-left:4px solid var(--pri);border-radius:0 10px 10px 0;padding:14px 16px;font-size:13px;line-height:1.85;margin-bottom:14px;color:#3b2f25;white-space:pre-wrap;}
.q-prompt{font-size:13px;font-weight:700;color:#6b4a2b;margin-bottom:10px;padding:8px 12px;background:#f3ebe0;border-radius:8px;}
.choices{display:grid;gap:8px;}
.cb{background:#f7f1e8;border:2px solid #e6dccd;border-radius:11px;padding:12px 15px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:flex-start;gap:10px;line-height:1.5;}
.cb:hover:not(:disabled){border-color:var(--pri);background:#f3ebe0;}
.cb.correct{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;}
.cb.wrong{background:#ffebee;border-color:#c62828;color:#b71c1c;}
.cb.reveal{background:#e8f5e9;border-color:#2e7d32;}
.cn{width:24px;height:24px;border-radius:50%;background:#d9c9b3;color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.fb-msg{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:800;margin-top:10px;display:none;}
.fb-msg.ok{background:#e8f5e9;color:#1b5e20;display:block;}
.fb-msg.no{background:#ffebee;color:#b71c1c;display:block;}

/* RESULT */
#resultScreen{padding:20px;max-width:600px;margin:0 auto;}
.rc{background:white;border-radius:24px;padding:30px 22px;box-shadow:0 8px 32px rgba(107,74,43,.1);text-align:center;}
.rs{font-family:'Black Han Sans',sans-serif;font-size:52px;color:var(--pri);line-height:1;}
.rsub{font-size:13px;color:var(--muted);margin-top:4px;}
.sr{display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap;}
.si{text-align:center;}.sn{font-family:'Black Han Sans',sans-serif;font-size:24px;}.sl{font-size:11px;color:var(--muted);margin-top:2px;}
.wl{background:var(--bg);border-radius:14px;padding:14px;text-align:left;margin-top:14px;max-height:300px;overflow-y:auto;}
.wl h3{font-size:12px;font-weight:800;color:var(--red);margin-bottom:8px;}
.wi{background:white;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:11px;border-left:3px solid #e91e63;}
.wie{font-weight:800;color:var(--pri);}.wid{font-size:10px;color:var(--muted);margin-top:2px;}
.rbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.rbtn{padding:12px 24px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.rbtn-p{background:linear-gradient(135deg,#6b4a2b,#b07a45);color:white;}
.rbtn-s{background:#f7f1e8;color:#6b4a2b;border:2px solid #d9c9b3;}

@media(max-width:480px){.passage-grid{grid-template-columns:repeat(3,1fr)}}

.s-sub,.ps-sub,.cnt-lbl span{font-family:'Gowun Dodum','Noto Sans KR',sans-serif;}
.p-card{background:#fdf8f2;}
.p-card.sel{background:#f0e6d8;}
</style>

{"no": 33, "school": "", "pref": "20", "type": "", "diff": "", "stem": "글에 따르면 의료 분야에서 일할 때 중요한 것은?", "p": "20-33", "choices": ["환자와 사적인 친구가 되는 것", "환자와 든든한 전문적 관계를 만드는 것", "환자와의 대화를 최소한으로 줄이는 것", "환자의 요구를 모두 들어주는 것"], "ans": 2, "exp": "첫 문장이 그대로 답이에요. 의료 현장에서는 환자와 탄탄한 '전문적' 관계를 만드는 것이 중요하다고 했어요.\n📖 it is important to <b>develop a solid professional relationship with your patients</b>\n   환자와 탄탄한 전문적 관계를 발전시키는 것이 중요하다.", "b": 1, "bb": "When you are working in healthcare, it is important to develop a solid professional relationship with your patients. By establishing realistic self-boundaries, you can protect that relationship. It is important to keep the focus on the patient. When working with patients who are seen frequently, it is easy to start to think of them as friends. With a friend, you are likely to share personal information that is not appropriate with a patient. Patients may feel that they cannot share important health-related information because you are their friend, and it would be embarrassing to share that information. Self-boundaries can also be thought of as professional boundaries. You need to treat patients with respect and keep the relationship professional. Be friendly to patients and always keep the focus on the patient."},

{"no": 49, "school": "", "pref": "21", "type": "", "diff": "", "stem": "글이 안내하는 맛 실험에서 사용하는 물질의 순서는?", "p": "21-49", "choices": ["설탕 → 소금 → 커피 → 레몬즙", "레몬즙 → 커피 → 소금 → 설탕", "소금 → 설탕 → 레몬즙 → 커피", "커피 → 소금 → 설탕 → 레몬즙"], "ans": 3, "exp": "소금 묻힌 면봉 → 설탕 → 레몬즙 → 마지막에 커피 순서로 안내하고 있어요.\n📖 Gargle again, and then swab with <b>lemon juice</b>. After a final gargle, try coffee.\n   다시 가글한 뒤 레몬즙을 묻힌 면봉으로 시험하고, 마지막으로 가글한 뒤 커피를 시험해 보라.", "b": 1, "bb": "Coat a fresh, wet swab in salt, and gently touch various spots on your tongue, recording where your taste seems strongest. Then, gargle with water to thoroughly clean your tongue, use a swab coated with sugar on the same spots, and record those results. Gargle again, and then swab with lemon juice. After a final gargle, try coffee. Compare your reactions with your friends’. Your taste pattern may reveal more than just taste preferences. Recent studies suggest links between taster status and behavioral disorders. For example, “non-tasters” tend to have a higher incidence of alcoholism, perhaps because liquor seems less bitter to them. Conversely, “super-tasters” may avoid nutritious but mildly bitter foods such as broccoli, thus depriving themselves of a balanced diet. So, although taste is not nearly as glamorous as vision, hearing, or even touch, it makes sense for you to pay closer attention to it because chemistry, at least in your mouth, could be destiny."},

{"no": 65, "school": "", "pref": "22", "type": "", "diff": "", "stem": "글에 따르면 과학자가 할 수 있는 가장 나쁜 일은?", "p": "22-65", "choices": ["자신의 가설을 남에게 알리지 않는 것", "남이 한 실험을 똑같이 반복하는 것", "확인해 보지도 않고 어떤 일이 일어날지 안다고 가정하는 것", "실험이 실패했을 때 결과를 공개하지 않는 것"], "ans": 3, "exp": "두 번째 문장이 바로 답입니다. 주어진 상황에서 무슨 일이 일어날지 '확인하는 수고도 하지 않고' 안다고 생각하는 것이 과학자가 하는 최악의 일이라고 했어요.\n📖 Arguably the worst thing a scientist can do is to <b>suppose they know what will happen in a given scenario without bothering to check</b>\n   아마도 과학자가 할 수 있는 가장 나쁜 일은 확인해 보는 수고도 하지 않고 주어진 상황에서 무슨 일이 일어날지 안다고 가정하는 것이다.", "b": 1, "bb": "Experiments testify to science’s embrace of ignorance. Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check. The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute. For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (“state your hypothesis and then test it”), the fact is that, as philosopher of science Ian Hacking says, “One can conduct an experiment simply out of curiosity to see what will happen.” Indeed, in the view of Charles Darwin’s son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless. You never know until you try."},

{"no": 80, "school": "", "pref": "22", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "22-80", "choices": ["주장을 첫 문장에 내놓고 호기심의 역사와 두 인물의 말로 뒷받침한다", "두 가지 실험 방법을 차례로 비교한 뒤 더 나은 하나만 고른다", "한 실험의 과정을 시간 순서대로 따라가며 그 결과까지 정리한다", "통계 자료를 제시하고 그 수치를 해석한 뒤 반론까지 소개한다"], "ans": 1, "exp": "글은 '실험은 무지를 포용한다'는 주장으로 시작해, 실험 철학과 호기심의 관계, 해킹과 조지 다윈의 말을 근거로 들고, 마지막에 짧은 한 문장으로 끝맺습니다.\n📖 Indeed, in the view of Charles Darwin’s son, the astronomer George Darwin, <b>once in a while one should do a completely crazy experiment</b>\n   실제로 조지 다윈의 생각으로는 이따금 완전히 엉뚱한 실험을 해 보아야 한다.", "b": 1, "bb": "Experiments testify to science’s embrace of ignorance. Arguably the worst thing a scientist can do is to suppose they know what will happen in a given scenario without bothering to check. The rise of the experimental philosophy coincided with the liberation of curiosity as a valuable rather than a questionable attribute. For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (“state your hypothesis and then test it”), the fact is that, as philosopher of science Ian Hacking says, “One can conduct an experiment simply out of curiosity to see what will happen.” Indeed, in the view of Charles Darwin’s son, the astronomer George Darwin, once in a while one should do a completely crazy experiment, even if it is most likely to prove fruitless. You never know until you try."},
{"no": 81, "school": "", "pref": "23", "type": "", "diff": "", "stem": "글에 따르면 과학 이론을 버리거나 다른 것으로 바꿀 수 있는 조건은?", "p": "23-81", "choices": ["그 이론을 지지하는 증거가 하나라도 줄어들 때", "그 이론을 지지하는 증거를 더 잘 설명하는 방법이 있을 때", "많은 과학자가 그 이론에 흥미를 잃을 때", "새 이론이 더 간단한 수식으로 쓰일 때"], "ans": 2, "exp": "첫 문장이 그대로 답입니다. 기존 이론을 받쳐 주는 증거를 '더 잘 설명하는 방법'이 있을 때에만 그 이론을 버리거나 바꿀 수 있다고 했어요.\n📖 We can discard or replace a scientific theory <b>only if we have a better way of explaining the evidence that supports it</b>.\n   우리는 어떤 과학 이론을 지지하는 증거를 더 잘 설명할 방법이 있을 때에만 그 이론을 버리거나 대체할 수 있다.", "b": 1, "bb": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples. A vast body of evidence supports Newton’s theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations. Still, the many successes of Newton’s theory could not be ignored, and Einstein’s theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein’s theory as a broader theory of gravity than Newton’s theory. Some scientists today are seeking a theory of gravity that will go beyond Einstein’s. If any new theory ever gains acceptance, it will have to match all the successes of Einstein’s theory as well as work in new realms where Einstein’s theory does not."},
{"no": 82, "school": "", "pref": "23", "type": "", "diff": "", "stem": "19세기 후반에 뉴턴의 중력 이론에 대해 과학자들이 발견한 것은?", "p": "23-82", "choices": ["그 이론을 지지하는 증거가 전혀 없다는 사실", "그 이론이 실험으로 검증될 수 없다는 사실", "그 이론이 관측 자료를 전혀 설명하지 못한다는 사실", "예측이 관측과 완벽하게 맞지 않는 사례들"], "ans": 4, "exp": "방대한 증거가 뉴턴 이론을 지지했지만, 19세기 후반에 예측이 관측과 '완벽히 일치하지 않는' 경우들이 발견되기 시작했다고 했어요.\n📖 by the late nineteenth century scientists had begun to discover cases where <b>its predictions did not perfectly match observations</b>\n   19세기 후반에 과학자들은 뉴턴 이론의 예측이 관측과 완벽히 맞지 않는 사례들을 발견하기 시작했다.", "b": 1, "bb": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples. A vast body of evidence supports Newton’s theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations. Still, the many successes of Newton’s theory could not be ignored, and Einstein’s theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein’s theory as a broader theory of gravity than Newton’s theory. Some scientists today are seeking a theory of gravity that will go beyond Einstein’s. If any new theory ever gains acceptance, it will have to match all the successes of Einstein’s theory as well as work in new realms where Einstein’s theory does not."},
{"no": 83, "school": "", "pref": "23", "type": "", "diff": "", "stem": "글에 따르면 아인슈타인의 이론이 받아들여질 수 있었던 까닭은?", "p": "23-83", "choices": ["관측과의 불일치를 설명하면서 뉴턴 이론의 성공들까지 똑같이 잘 설명했기 때문", "뉴턴 이론이 거둔 성공을 모두 잘못된 것으로 밝혀냈기 때문", "당대 과학자 대다수가 뉴턴 이론을 포기했기 때문", "뉴턴 이론과 전혀 다른 새로운 증거만 다루었기 때문"], "ans": 1, "exp": "아인슈타인 이론은 어긋난 관측을 설명했을 뿐 아니라, 뉴턴 이론의 많은 성공도 '똑같이 잘' 설명할 수 있었기 때문에 인정받았다고 했어요.\n📖 Einstein’s theory would not have gained acceptance if it had not been able to <b>explain these successes equally well</b>\n   아인슈타인의 이론이 그 성공들을 똑같이 잘 설명할 수 없었다면 받아들여지지 못했을 것이다.", "b": 1, "bb": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples. A vast body of evidence supports Newton’s theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations. Still, the many successes of Newton’s theory could not be ignored, and Einstein’s theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein’s theory as a broader theory of gravity than Newton’s theory. Some scientists today are seeking a theory of gravity that will go beyond Einstein’s. If any new theory ever gains acceptance, it will have to match all the successes of Einstein’s theory as well as work in new realms where Einstein’s theory does not."},

{"no": 95, "school": "", "pref": "23", "type": "", "diff": "", "stem": "윗글의 요지로 가장 적절한 것은?", "p": "23-95", "choices": ["과학 이론은 오래 살아남은 것일수록 더 믿을 만한 것이 된다", "관측과 어긋나는 점이 발견된 이론은 지체 없이 곧바로 버려야 한다", "과학은 증거보다 수학이 더 아름다운 이론을 먼저 선택한다", "새 이론은 기존 이론의 성공을 다 설명하고 더 설명할 때 대체한다"], "ans": 4, "exp": "첫 문장의 원칙을 뉴턴-아인슈타인 사례로 보이고, 미래의 새 이론에도 같은 기준이 적용된다고 마무리합니다.\n📖 If any new theory ever gains acceptance, it will have to <b>match all the successes of Einstein’s theory</b> as well as work in new realms where Einstein’s theory does not\n   어떤 새 이론이 인정받으려면 아인슈타인 이론의 모든 성공을 맞추는 것은 물론 새로운 영역에서도 작동해야 한다.", "b": 1, "bb": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples. A vast body of evidence supports Newton’s theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations. Still, the many successes of Newton’s theory could not be ignored, and Einstein’s theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein’s theory as a broader theory of gravity than Newton’s theory. Some scientists today are seeking a theory of gravity that will go beyond Einstein’s. If any new theory ever gains acceptance, it will have to match all the successes of Einstein’s theory as well as work in new realms where Einstein’s theory does not."},
{"no": 96, "school": "", "pref": "23", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "23-96", "choices": ["여러 학자의 상반된 주장을 나열한 뒤 판단은 모두 독자에게 맡긴다", "한 이론을 검증한 실험 과정을 단계별로 나누어 차례로 설명한다", "원칙을 제시한 뒤 뉴턴-아인슈타인 사례로 뒷받침하고 미래에 적용한다", "여러 통계 자료를 제시한 뒤 수치를 비교해 경향을 읽어 낸다"], "ans": 3, "exp": "첫 문장에서 원칙 → 뉴턴과 아인슈타인의 실제 사례 → 앞으로 나올 이론에도 같은 기준 적용, 이 순서로 전개됩니다.\n📖 <b>The theories of Newton and Einstein offer great examples.</b>\n   뉴턴과 아인슈타인의 이론은 훌륭한 예가 된다.", "b": 1, "bb": "We can discard or replace a scientific theory only if we have a better way of explaining the evidence that supports it. The theories of Newton and Einstein offer great examples. A vast body of evidence supports Newton’s theory of gravity, but by the late nineteenth century scientists had begun to discover cases where its predictions did not perfectly match observations. These discrepancies were explained only when Einstein developed his general theory of relativity, which was able to match the observations. Still, the many successes of Newton’s theory could not be ignored, and Einstein’s theory would not have gained acceptance if it had not been able to explain these successes equally well. It did, and that is why we now view Einstein’s theory as a broader theory of gravity than Newton’s theory. Some scientists today are seeking a theory of gravity that will go beyond Einstein’s. If any new theory ever gains acceptance, it will have to match all the successes of Einstein’s theory as well as work in new realms where Einstein’s theory does not."},
{"no": 97, "school": "", "pref": "24", "type": "", "diff": "", "stem": "글에 따르면 일상에서 벗어나 뇌를 자극하는 활동을 하면 얻게 되는 것은?", "p": "24-97", "choices": ["하루 전체의 업무 시간을 눈에 띄게 줄여 주는 효과를 얻는다", "오후에 더 긴 휴식 시간을 쓸 수 있는 권리를 보장받게 된다", "인지적 피로를 막고 남은 하루의 생산성을 더 높이게 된다", "밤에 더 빨리 깊이 잠들어 수면의 질이 좋아지는 효과를 얻는다"], "ans": 3, "exp": "세 번째 문장이 그대로 답입니다. 일상에서 벗어나 뇌를 자극하는 활동을 하면 인지적 피로를 막고 남은 하루의 생산성을 높인다고 했어요.\n📖 When you break away from routine, especially with activities designed to stimulate your brain, you <b>prevent cognitive tiredness and enhance productivity for the rest of the day</b>.\n   특히 뇌를 자극하도록 만들어진 활동으로 일상에서 벗어나면 인지적 피로를 막고 남은 하루의 생산성을 높인다.", "b": 1, "bb": "Imagine pausing in the middle of a busy day, taking a moment to refresh your mind and recharge your energy. This power of a midday break is often underestimated. When you break away from routine, especially with activities designed to stimulate your brain, you prevent cognitive tiredness and enhance productivity for the rest of the day. Neurobic exercises ― simple yet effective ― are perfect for such breaks. They target different areas of your brain, keeping it agile and alert. These exercises create a mental oasis that refreshes and prepares you for the afternoon’s challenges. This strategic pause is not just a break; it boosts your cognitive capabilities, ensuring your mind remains sharp and focused. Even briefly experimenting with neurobic exercises can work wonders for your cognitive state during lunch. Start with using your non-dominant hand for routine tasks like writing or eating. This simple switch challenges your brain, activating pathways that aren’t typically engaged and promoting greater flexibility in thinking."},

{"no": 113, "school": "", "pref": "25", "type": "", "diff": "", "stem": "위 그래프가 보여 주는 내용은?", "p": "25-113", "choices": ["2022년 OECD 전체 회원국 25~34세 청년의 대학 진학률 순위", "2022년 OECD 5개국 25~34세 청년의 학사·석사 최종 학력 비율", "2022년 OECD 5개국 대학원생 수가 해마다 달라진 변화의 추이", "2022년 OECD 5개국 25~34세 청년의 전공별 취업률 비교 결과"], "ans": 2, "exp": "첫 문장에 그대로 나와 있어요. 2022년 기준으로 고른 OECD 5개국에서 25~34세 청년 중 최종 학력이 학사 또는 석사인 사람의 비율입니다.\n📖 The graph above illustrates the percentage of 25- to 34-year-olds (young adults) who attained either a bachelor’s or a master’s degree as their highest degree in <b>five selected OECD countries as of 2022</b>\n   위 그래프는 2022년 기준 선정된 OECD 5개국에서 최종 학력이 학사 또는 석사인 25~34세 청년의 비율을 보여 준다.", "b": 1, "bb": "The graph above illustrates the percentage of 25- to 34-year-olds (young adults) who attained either a bachelor’s or a master’s degree as their highest degree in five selected OECD countries as of 2022. The Republic of Korea had the highest percentage of young adults with a bachelor’s as their highest degree, but the lowest percentage of those with a master’s as their highest degree. New Zealand had the second-highest percentage of young adults with a bachelor’s as their highest degree, followed by the United States. In Luxembourg and France, the percentage of young adults with a master’s as their highest degree exceeded that of those with a bachelor’s as their highest degree, unlike the other three countries. In Luxembourg, the percentage of young adults with a master’s as their highest degree was less than double that of those with a bachelor’s as their highest degree. France showed the smallest gap of 9 percentage points between the percentages of young adults with a bachelor’s and a master’s as their highest degree."},

{"no": 145, "school": "", "pref": "29", "type": "", "diff": "", "stem": "세포가 분열할 때 두 딸세포의 유전체에 대해 글이 말하는 것은?", "p": "29-145", "choices": ["모세포와 언제나 똑같다", "유전체의 절반만 모세포에서 물려받는다", "서로, 또 모세포와 완전히 같지는 않은 경우가 많다", "분열할 때마다 유전체의 양이 두 배로 늘어난다"], "ans": 3, "exp": "첫 문장이 그대로 답입니다. 분열한 두 딸세포의 유전체는 서로도, 모세포와도 '완전히 같지는 않은' 경우가 많다고 했어요.\n📖 the genomes of its two daughters are often <b>not quite identical</b> to each other or to that of the parent cell\n   두 딸세포의 유전체는 서로, 또 모세포와 완전히 같지는 않은 경우가 많다.", "b": 1, "bb": "When a cell divides, the genomes of its two daughters are often not quite identical to each other or to that of the parent cell. On rare occasions, the error may represent a change for the better; more probably, it will cause no significant difference in the cell’s prospects. But in some cases, the error will cause serious damage; for example, by disrupting the coding sequence for a key protein. Changes due to mistakes of the first type will tend to be perpetuated, because the altered cell has an increased likelihood of reproducing itself. Changes due to mistakes of the second type ― neutral changes ― may be perpetuated or not: it is a matter of chance whether the altered cell or its cousins will succeed. But changes that cause serious damage lead nowhere: the cell that suffers them dies, leaving no progeny. Through endless repetition of this cycle of mutation and natural selection organisms evolve: their genetic specifications change, sometimes giving organisms new ways to exploit the environment more effectively, to survive in competition with others, and to reproduce successfully."},

{"no": 161, "school": "", "pref": "30", "type": "", "diff": "", "stem": "자유주의 문화에 대해 글이 말하는 것은?", "p": "30-161", "choices": ["개인의 공정한 기회균등이 가족의 통합성 유지보다 더 중요하다", "가족의 통합성 유지가 개인의 기회보다 더 중요하다", "기회균등과 가족 유지를 똑같이 중요하게 본다", "개인의 기회균등이라는 생각 자체를 거부한다"], "ans": 1, "exp": "첫 문장에서 자유주의 문화에서는 개인의 공정한 기회균등의 가치가 가족의 통합성 보존보다 '더 무겁다(outweighs)'고 했어요.\n📖 Within liberal culture, <b>the value of fair equality of opportunity for individuals outweighs the preservation of the family’s integrity</b>\n   자유주의 문화에서는 개인의 공정한 기회균등의 가치가 가족의 통합성 보존보다 더 중요하다.", "b": 1, "bb": "Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family’s integrity. In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life. Individuals are primarily understood as family members before they are regarded as state citizens. Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities. Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity. On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, tolerating inequalities stemming from the existence of the family as long as everyone’s basic freedoms and rights are safeguarded in the state."},

{"no": 174, "school": "", "pref": "30", "type": "", "diff": "", "stem": "글에 따르면 유교적 관점이 어느 정도의 사회적 불평등을 받아들이는 이유는?", "p": "30-174", "choices": ["가족이 결코 버려서는 안 될 고유한 가치를 지닌다고 보기 때문이다", "불평등이 사회의 경제 성장에 도움이 된다고 보기 때문이다", "국가가 복지를 맡을 능력이 전혀 없다고 보기 때문이다", "기회균등이라는 가치를 인정하지 않기 때문이다"], "ans": 1, "exp": "'Therefore'로 시작하는 문장에서, 가족이 고유한 가치를 지녀 결코 버릴 수 없기 때문에 어느 정도의 불평등이 생겨도 괜찮다고 했어요.\n📖 for Confucians, <b>the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities</b>\n   유교적 관점에서 가족은 어느 정도의 사회적 불평등을 낳더라도 결코 버려서는 안 될 고유한 가치를 지닌다.", "b": 1, "bb": "Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family’s integrity. In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life. Individuals are primarily understood as family members before they are regarded as state citizens. Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities. Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity. On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, tolerating inequalities stemming from the existence of the family as long as everyone’s basic freedoms and rights are safeguarded in the state."},

{"no": 176, "school": "", "pref": "30", "type": "", "diff": "", "stem": "윗글의 전개 방식에 대한 설명으로 가장 적절한 것은?", "p": "30-176", "choices": ["유교 문화가 동아시아에 자리 잡은 과정을 시대 순서대로 아주 차근차근 서술한다", "여러 나라의 복지 지출과 가족 구조 통계 자료를 제시해 자신의 주장을 증명한다", "두 문화의 가치 우선순위를 대조하고, 그 차이가 어떤 정책 선택으로 이어지는지 보인다", "가족 해체라는 사회 문제를 제기하고 전문가들이 제안한 해결책을 차례로 소개한다"], "ans": 3, "exp": "'In contrast', 'On the other hand' 같은 표현으로 자유주의와 유교 문화를 계속 맞세우고, 마지막에 각각의 정책 선택으로 이어 보여 줍니다.\n📖 <b>In contrast, for Confucian culture</b>, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing\n   그에 반해 유교 문화에서는 개인의 기회균등 추구가 중요하기는 하지만 가족이 인간의 번영에 근본적인 역할을 한다.", "b": 1, "bb": "Within liberal culture, the value of fair equality of opportunity for individuals outweighs the preservation of the family’s integrity. In contrast, for Confucian culture, while seeking fair equality of opportunity for individuals is important, the family assumes a fundamental role in human flourishing, and living within a family institution is considered the essential way of life. Individuals are primarily understood as family members before they are regarded as state citizens. Therefore, for Confucians, the family possesses inherent value that should never be abandoned, even if it results in certain societal inequalities. Some cultures, like the liberal one, may choose to impose increasing restrictions on the role of families and implement more egalitarian government programs for education, healthcare, and other positive rights in society in the pursuit of fair equality of opportunity. On the other hand, other cultures, like the Confucian one, may prefer to primarily assign welfare responsibilities to the family, tolerating inequalities stemming from the existence of the family as long as everyone’s basic freedoms and rights are safeguarded in the state."},
{"no": 177, "school": "", "pref": "31", "type": "", "diff": "", "stem": "20세기의 통계에 대해 글이 말하는 것은?", "p": "31-177", "choices": ["개인의 호기심을 채우기 위한 취미 활동이 되었다", "학교 수학 교육의 한 단원으로만 남았다", "기업의 광고 전략을 위한 도구가 되었다", "국가가 필요로 하는 양적 정보를 체계적으로 모으는 일이 되었다"], "ans": 4, "exp": "첫 문장에서 20세기의 통계는 국가가 필요로 하는 양적 정보를 체계적으로 수집하는 일이 되었다고 했어요.\n📖 Statistics in the twentieth century became <b>the systematic collection of quantitative information needed by the state</b>\n   20세기에 통계는 국가가 필요로 하는 양적 정보를 체계적으로 수집하는 일이 되었다.", "b": 1, "bb": "Statistics in the twentieth century became the systematic collection of quantitative information needed by the state. This process occurred in all the industrialised countries as a key part of their becoming modern states. Desrosières writes: “It is difficult to think simultaneously that the objects being measured really do exist and that this is only a convention”. Yet this is the case. Phenomena such as prices being charged and products being sold exist, but the categories and classification frameworks supporting the collection, aggregation, and organisation of official statistics are devised to serve the purposes of the state, for macroeconomic or for social policies. Theodore Porter described the use of statistics to create state authority: “Quantification is a way of making decisions without seeming to decide”, characterising it as a “social technology” intended to build trust in authority."},

{"no": 193, "school": "", "pref": "32", "type": "", "diff": "", "stem": "신체를 바라보는 여러 관점들에 대해 글이 말하는 것은?", "p": "32-193", "choices": ["하나의 관점이 다른 관점들을 완전히 대체해야 한다", "각 관점이 다른 관점들을 더 풍부하게 해 줄 수 있다", "관점들이 서로 충돌하므로 함께 쓸 수 없다", "화학적 관점만이 믿을 만하다"], "ans": 2, "exp": "첫 문장 뒷부분이 그대로 근거예요. 와인 전문가가 화학을 알면 얻는 게 많듯, 신체를 보는 각 관점도 다른 관점들을 더 좋게 만들어 줄 수 있다고 했어요.\n📖 so each perspective on the body can <b>potentially enhance the others</b>\n   신체에 대한 각 관점은 다른 관점들을 더 풍부하게 해 줄 가능성이 있다", "b": 1, "bb": "Just as an expert in the taste and colour of wine will gain much by being aware of the chemistry that underlies those qualities, so each perspective on the body can potentially enhance the others. And yet every scientific tool, from microscopes to mathematics, and every aspect of the body, from the brain to the microorganism, requires such depth of expertise that this tends not to happen: we tend to study the human body in silos, each community sectioned from the others by its own specialised vocabulary. Research communities may be dedicated to one type of scientific tool or a specific component of the body, such as one type of cell. How different types of cell communicate with one another becomes its own specialist topic. Even simple forms of life on Earth are now rarely studied as a whole, and the human body is evidently much more complex. As long ago as 1890, The Times newspaper commented that knowledge ‘had already become too vast to be manageable’. Today, nobody is an expert in the whole of anything."},

{"no": 209, "school": "", "pref": "33", "type": "", "diff": "", "stem": "역사적으로 궁전이 어떤 곳이었다고 글은 말하는가?", "p": "33-209", "choices": ["통치자가 백성과 어울리던 열린 광장", "방어에만 집중한 군사 시설", "감탄과 위압을 주도록 치밀하게 꾸며진 무대", "예술가들이 자유롭게 실험한 작업장"], "ans": 3, "exp": "첫 문장이 근거예요. 궁전은 그냥 집이 아니라, 보는 사람을 감탄시키고 동시에 주눅 들게 하려고 '설계된 무대'였다고 했어요.\n📖 palaces weren’t just homes; they were <b>carefully constructed stages designed to impress and intimidate</b>\n   궁전은 단지 집이 아니라, 감탄과 위압을 주도록 치밀하게 구성된 무대였다", "b": 1, "bb": "Historically, palaces weren’t just homes; they were carefully constructed stages designed to impress and intimidate. While stone symbolized permanence and strength, glass offered something equally powerful: visibility. The introduction of large windows in palaces allowed rulers to literally look down upon their subjects, emphasizing their elevated position. Conversely, it also allowed subjects to gaze up at their leaders, creating a sense of awe and distance. Consider the Palace of Versailles: its Hall of Mirrors, lined with reflective surfaces, not only magnified the grandeur of the space but also placed the king at the center of a dazzling display, reinforcing his absolute authority. The use of glass in palaces wasn’t merely aesthetic; it was strategic. Open sightlines allowed for better surveillance and control, ensuring the safety and security of the ruling family. Courtiers and visitors were constantly aware of being observed, contributing to an atmosphere of careful obedience and respect. The very architecture dictated social behavior, with glass acting as a silent enforcer of the power dynamic."},

{"no": 225, "school": "", "pref": "34", "type": "", "diff": "", "stem": "Noelle-Neumann이 선거운동 기간에 관찰한 것은?", "p": "34-225", "choices": ["자기 의견이 인기 없다고 느껴지면 사람들은 그 의견을 말하지 않고 눌러 두었다", "선거운동 기간에는 어떤 의견이든 사람들 사이에서 똑같은 비중으로 다루어졌다", "인기 없는 의견일수록 사람들이 오히려 더 크게 소리 내어 외치고 다녔다", "사람들은 선거에 관한 이야기를 아예 꺼내지 않고 내내 입을 닫고 있었다"], "ans": 1, "exp": "첫 문장이 근거예요. 어떤 견해는 더 많이 거론되었고, 자기 의견이 인기 없다고 느껴지면 사람들은 말하는 대신 그 의견을 눌렀다고 했어요.\n📖 sometimes people <b>muted their opinions rather than talking about them</b>, especially if those opinions were perceived to be unpopular\n   사람들은 때때로 자기 의견을 말하기보다 눌러 두었는데, 특히 그 의견이 인기 없다고 여겨질 때 그랬다", "b": 1, "bb": "As a political researcher in Germany, Noelle-Neumann observed that during election campaigns, certain views seemed to get more play than others, and sometimes people muted their opinions rather than talking about them, especially if those opinions were perceived to be unpopular. Noelle-Neumann calls this the spiral of silence. The spiral of silence occurs when individuals who perceive that their opinions are popular express them, whereas those who do not think their opinions are popular remain quiet. This process occurs in a spiral, so that one side of an issue ends up with considerable publicity and the other side with very little. In everyday life, people express their opinions in a variety of ways: they talk about them, they wear buttons, they put bumper stickers on their cars, and they post their views on social media. According to this theory, people are more apt to do these kinds of things when they perceive that others share their opinions."},

{"no": 241, "school": "", "pref": "35", "type": "", "diff": "", "stem": "길이의 단위에 대해 물리학이 어떤 태도를 보인다고 글은 말하는가?", "p": "35-241", "choices": ["미터를 다른 단위보다 더 정확한 것으로 본다", "단위를 쓰지 않는 서술만 인정한다", "단위마다 서로 다른 법칙을 적용한다", "어떤 길이 단위도 다른 단위보다 선호하지 않는다"], "ans": 4, "exp": "거리를 피트로 주든 미터로 주든 물리학은 같다고 했고, 그래서 물리학은 어떤 길이 단위도 더 좋아하지 않는다는 결론을 내려요.\n📖 physics does not prefer <b>one unit of length over any other</b>\n   물리학은 어떤 길이 단위도 다른 단위보다 선호하지 않는다", "b": 1, "bb": "Consider units of measure, one kind of descriptive device we are familiar with using in physics. Spatial distances can be given in terms of feet or meters or some other unit, and the physics will be the same regardless. We conclude from this that physics does not prefer one unit of length over any other, and we may choose any one we like for reasons of convenience. We further conclude that any feature depending on that choice, such as the particular numerical value assigned to the spatial separation between two locations, is not out there in the world apart from a choice of unit. Temperatures can likewise be given in terms of the Fahrenheit or Celsius or Kelvin scale, and nothing in the physics changes when we switch from one scale to another. We conclude that the choice of scale is an arbitrary choice in description, and that any feature that depends on that choice is scale-dependent."},

{"no": 273, "school": "", "pref": "37", "type": "", "diff": "", "stem": "글에 따르면 나방의 더듬이(antennae) 모양에 대한 설명으로 가장 적절한 것은?", "p": "37-273", "choices": ["끝이 작은 곤봉처럼 부풀어 있다", "깃털 모양이거나 끝이 가늘어진다", "언제나 몸길이보다 길다", "날개와 하나로 이어져 있다"], "ans": 2, "exp": "곤봉처럼 부푼 끝은 대부분의 '나비' 쪽이고, 나방은 깃털 같거나 끝이 가늘어진다고 했습니다.\n📖 in moths they are usually <b>feathery or narrow to a fine tip</b>\n   나방의 더듬이는 보통 깃털 같거나 끝이 가늘어진다", "b": 1, "bb": "Distinguishing moths from butterflies on outward appearance is not always easy, but there are a few rules of thumb that can help. In most butterflies the antennae end with a small club-shaped swelling, whereas in moths they are usually feathery or narrow to a fine tip. Butterflies tend to rest with their wings held shut above their body, whereas moths more usually rest with the upper sides of the wings on full view. Further distinctions can be made by looking for a tiny hook that joins fore- and hindwings, a feature only present in moths. The stereotypical differences, with moths cast as the gloomy, nocturnal cousins of colourful sun-loving butterflies are simply wrong. There are many brightly coloured moths and many which are active throughout the day. Equally, there are a few nocturnal butterflies and plenty that come clothed in shades of brown and grey. It’s more sensible to think of them together; both butterflies and moths are beautiful and fascinating insects."},

{"no": 289, "school": "", "pref": "38", "type": "", "diff": "", "stem": "글에 따르면 야생동물 관리 방식은 크게 어떤 두 범주로 나뉘는가?", "p": "38-289", "choices": ["합법 관리와 불법 관리", "적극적 관리와 비적극적 관리", "국가 관리와 민간 관리", "단기 관리와 장기 관리"], "ans": 2, "exp": "첫 문장이 그대로 답입니다. 방식은 많지만 크게 active management와 inactive management로 묶인다고 했어요.\n📖 can be classified into two broad categories: <b>active management and inactive management</b>\n   관리는 적극적 관리와 비적극적 관리라는 두 큰 범주로 분류될 수 있다", "b": 1, "bb": "There are numerous ways wildlife is managed, but they all imply stewardship and can be classified into two broad categories: active management and inactive management. Active management does something to the population ― such as increasing or decreasing its size ― in a direct manner through strategies like translocations or hunting, respectively. Populations can also be actively managed by altering the habitat to the benefit or disadvantage of a population. If population numbers are too low for the goal of management agencies, other active management can be incorporated, such as predator control to minimize neonatal deaths or habitat improvement to provide required cover for neonates from predators. These efforts represent active approaches to management. Other populations may not be actively managed, like those in national parks. In such situations, management activities minimize external influences on populations and habitat, which often involves management of humans and not animals."},

{"no": 305, "school": "", "pref": "39", "type": "", "diff": "", "stem": "글에 따르면 제품의 판매량은 결국 무엇에 직접 좌우되는가?", "p": "39-305", "choices": ["생산 공장의 규모", "정부의 규제", "재료의 종류", "그 제품에 대한 수요"], "ans": 4, "exp": "판매는 공급량과 연결되고, 그 공급량은 그 제품에 대한 수요에 직접 달려 있다고 했습니다.\n📖 Sales are tied to the amount of a product supplied, which is <b>directly dependent on the demand for that product</b>\n   판매는 공급된 제품의 양과 연결되어 있고, 그 양은 그 제품에 대한 수요에 직접 달려 있다", "b": 1, "bb": "Waste has historically been seen as a necessary driver of the economy. Sales are tied to the amount of a product supplied, which is directly dependent on the demand for that product. Therefore, if you design the product to eventually be wasted, you can ensure that the demand for more products will be sustained. Many strategies have been incorporated into product design and use to ensure that waste is inevitable, such as planned obsolescence, limited access to tools for repairs, and use of cheap materials. All these strategies ensure that the consumer will have limited access to the product in use and will eventually require a replacement. Those who supported the idea that waste is necessary to drive demand failed to realize that prioritizing the elimination of waste via repair and remanufacturing creates a different kind of demand: products as a service. Through this setup, companies simply lease out products that were once sold directly to the customer. With this transition of ownership, companies maintain profit by offering maintenance and repair services and are encouraged to develop long-lasting products."},

{"no": 321, "school": "", "pref": "40", "type": "", "diff": "", "stem": "지난 50년 동안 스물여섯 번에 걸쳐 일어난 일로 글이 언급하는 것은?", "p": "40-321", "choices": ["하루에서 1초를 덜어 냈다", "모든 사람의 하루에 1초가 더해졌다", "표준 시간대를 한 시간씩 옮겼다", "시계를 모두 새로 교체했다"], "ans": 2, "exp": "두 번째 문장에 지난 50년간 스물여섯 번 '1초가 더해졌다'고 나와 있어요. 지구의 흔들림과 자전 속도 변화를 맞추기 위한 조정이었습니다.\n📖 On twenty-six occasions in the last fifty years, <b>a second has been added to everyone’s day</b> to adjust for the Earth wobbling and the rate of its spin changing.\n   지난 50년 동안 스물여섯 번, 지구의 흔들림과 자전 속도 변화를 맞추기 위해 모든 사람의 하루에 1초가 더해졌다.", "b": 1, "bb": "Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche, but every now and again we are forced to acknowledge this mistake. On twenty-six occasions in the last fifty years, a second has been added to everyone’s day to adjust for the Earth wobbling and the rate of its spin changing. For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly. Indeed, the Earth’s spin is generally slowing because the moon’s gravity is acting as a drag, so days are getting longer by about 1.7 milliseconds per century. Such events disturb the similarity between man-made time and more flexible time based on the Earth’s naturally occurring rotation. When events like this happen, a bunch of humans make the decision to add a small slice of time to your day, without your knowledge. We try to force our fixed, man-made view of time on to nature in the false hope that it will yield. It doesn’t. → Humans, who have long viewed that time is stable, have continuously made modifications, sticking to their belief that their efforts can eliminate the gap between man-made time and natural time."},
{"no": 322, "school": "", "pref": "40", "type": "", "diff": "", "stem": "글에 따르면 엘니뇨가 시간과 관련되는 방식은?", "p": "40-322", "choices": ["바닷물 온도를 높여 달의 중력을 약화시킨다", "지구의 공전 궤도를 바꿔 1년의 길이를 늘린다", "풍속을 급격히 바꿔 지구의 자전을 약간 느리게 할 수 있다", "하루의 길이를 1.7밀리초 줄인다"], "ans": 3, "exp": "엘니뇨는 태평양의 기후 체계로, 풍속을 크게 바꿔 지구의 자전을 '약간' 느리게 할 수 있다고 했어요.\n📖 For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, <b>it can slow the rotation of the Earth slightly</b>.\n   예를 들어 태평양의 기후 체계인 엘니뇨가 풍속을 급격히 바꾸면 지구의 자전을 약간 느리게 할 수 있다.", "b": 1, "bb": "Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche, but every now and again we are forced to acknowledge this mistake. On twenty-six occasions in the last fifty years, a second has been added to everyone’s day to adjust for the Earth wobbling and the rate of its spin changing. For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly. Indeed, the Earth’s spin is generally slowing because the moon’s gravity is acting as a drag, so days are getting longer by about 1.7 milliseconds per century. Such events disturb the similarity between man-made time and more flexible time based on the Earth’s naturally occurring rotation. When events like this happen, a bunch of humans make the decision to add a small slice of time to your day, without your knowledge. We try to force our fixed, man-made view of time on to nature in the false hope that it will yield. It doesn’t. → Humans, who have long viewed that time is stable, have continuously made modifications, sticking to their belief that their efforts can eliminate the gap between man-made time and natural time."},

{"no": 336, "school": "", "pref": "40", "type": "", "diff": "", "stem": "윗글의 전개 방식에 대한 설명으로 가장 적절한 것은?", "p": "40-336", "choices": ["주장을 먼저 제시하고 윤초·엘니뇨·달의 중력 같은 사례로 뒷받침한 뒤 결론을 다시 못 박는다", "두 학자의 상반된 시간 이론을 차례로 소개하고 둘 사이의 절충안을 낸다", "시간을 재는 기술의 역사를 연대순으로 나열하고 연표로 정리해 보여 준다", "자전 속도를 재는 실험 과정을 단계별로 설명하고 수치 결과를 표로 정리한다"], "ans": 1, "exp": "먼저 인위적 시간관이 굳어졌다는 주장을 내놓고, 1초 추가·엘니뇨·달의 중력이라는 구체적 사례를 든 다음, 자연은 양보하지 않는다며 결론을 되짚습니다.\n📖 <b>For instance</b>, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly.\n   예를 들어 태평양의 기후 체계인 엘니뇨가 풍속을 급격히 바꾸면 지구의 자전을 약간 느리게 할 수 있다.", "b": 1, "bb": "Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche, but every now and again we are forced to acknowledge this mistake. On twenty-six occasions in the last fifty years, a second has been added to everyone’s day to adjust for the Earth wobbling and the rate of its spin changing. For instance, when El Niño, a climatic system in the Pacific, causes wind speed to change dramatically, it can slow the rotation of the Earth slightly. Indeed, the Earth’s spin is generally slowing because the moon’s gravity is acting as a drag, so days are getting longer by about 1.7 milliseconds per century. Such events disturb the similarity between man-made time and more flexible time based on the Earth’s naturally occurring rotation. When events like this happen, a bunch of humans make the decision to add a small slice of time to your day, without your knowledge. We try to force our fixed, man-made view of time on to nature in the false hope that it will yield. It doesn’t. → Humans, who have long viewed that time is stable, have continuously made modifications, sticking to their belief that their efforts can eliminate the gap between man-made time and natural time."},
{"no": 337, "school": "", "pref": "41-42", "type": "", "diff": "", "stem": "옆으로 늘어뜨린 손을 들어 올릴 때 일어나는 일로 글이 설명하는 것은?", "p": "41-42-337", "choices": ["이두와 삼두가 동시에 수축한다", "이두와 삼두가 동시에 이완한다", "이두는 수축하고 삼두는 이완한다", "삼두는 수축하고 이두는 이완한다"], "ans": 3, "exp": "손을 들어 올릴 때는 'Biceps contract, and triceps relax.'라고 했어요. 이두가 수축하고 삼두가 이완합니다.\n📖 <b>Biceps contract, and triceps relax.</b>\n   이두근은 수축하고 삼두근은 이완한다.", "b": 1, "bb": "When your hand is hanging at your side and then you lift it, opposing muscles on your upper arm shorten and lengthen ― contract and relax ― to bend the elbow. Biceps contract, and triceps relax. Reversing the motion, when you drop your hand back down, muscles reverse roles. Triceps contract, and biceps relax. Lift your hand or drop it, and muscle shows what it is: a system of coordination, managed by orchestrated tension. As arms and legs rotate around joints, muscles activate and deactivate, contract and relax. All physical activity is paradoxical, in this sense: Movement depends on what muscles don’t do, as much as it depends on what they do. Both are necessary, each in its time ― and the same is true of each side of the pairs of concepts shaping how we talk of muscles. Start with nature versus nurture: Some people are stronger or more muscular than others; is the difference inborn, or does it depend on what people do? To the latter question: What do you do? Do you have to lift weights, or is walking enough exercise? How should you do the exercise? Should you move fast or slowly? Lift heavy weights or lighter ones? Put like that, basic questions about muscle may sound like they have one right answer. Oppositions can polarize. But where muscle is concerned, few oppositions are true polarities. Look closely, and most prove to be paradoxes. Born and made, heavy and light, fast and slow: Those opposites actually need each other."},

k closely, and most prove to be paradoxes. Born and made, heavy and light, fast and slow: Those opposites actually need each other."},
{"no": 353, "school": "", "pref": "43-45", "type": "", "diff": "", "stem": "Sam에 대해 글이 말하는 것은?", "p": "43-45-353", "choices": ["달리기 선수가 되는 것이 꿈인 쾌활한 중학교 2학년생이다", "Jason의 사촌 동생으로 같은 고등학교에 다니는 친구다", "그림에는 전혀 관심이 없고 달리기만 좋아하는 아이다", "그림 그리기를 좋아하고 화가를 꿈꾸며 희귀 심장병을 앓는 일곱 살 아이다"], "ans": 4, "exp": "Sam은 그림 그리기를 좋아하고 화가가 되기를 꿈꾸는 밝은 일곱 살 아이이며 희귀 심장 질환이 있다고 소개됩니다.\n📖 Sam, a cheerful seven-year-old <b>who loved to draw and dreamed of being an artist, had a rare heart condition</b>.\n   그림 그리기를 좋아하고 화가가 되기를 꿈꾸던 밝은 일곱 살 Sam은 희귀 심장 질환을 갖고 있었다.", "b": 1, "bb": "Jason stared at the banner across the high school gym wall: “Annual Charity Marathon ― Run for Sam.” The slogan stirred something in him. Sam, a cheerful seven-year-old who loved to draw and dreamed of being an artist, had a rare heart condition. Sam wasn’t just anyone — he was the little boy living next door that Jason had babysat every summer break. He had played in the park and spent summer afternoons chasing ice cream trucks with Sam. Seeing Sam’s name on the banner made everything feel personal. Jason had always been the fastest runner in school, known among his friends as “The Speedster.” But since his knee injury, he hadn’t been able to run for quite a long time. Still, when Jason thought about Sam and the hope this marathon represented, he knew he had to try. Jason did everything he could to recover, following his doctor’s advice. A day before registration deadline, his doctor said a 3-mile run would be fine. Jason signed up for the 3-mile beginner route, hoping to run for Sam. On marathon morning, Jason stood among the runners, heart pounding. In the crowd, Sam was holding a sign: “Thank you, Runners!” Jason smiled. He was all the motivation needed. When the whistle blew, Jason started strong, but since he hadn’t run for so long, his energy faded quickly. Every step was a struggle, but he pushed forward, encouraged by the thought of how happy Sam would be. Finally, he crossed the finish line. As he was sitting to catch his breath, Sam came over and handed him bottled water. He felt pride, relief, and gratitude. He finally finished ― for Sam."},

{"no": 357, "school": "", "pref": "43-45", "type": "", "diff": "", "stem": "윗글의 내용과 일치하는 것은?", "p": "43-45-357", "choices": ["Jason은 결승선을 끝내 통과하지 못했다", "Sam은 관중 속에서 응원 문구가 적힌 팻말을 들고 있었다", "Jason은 무릎을 다친 뒤에도 계속 달려 왔다", "Jason은 의사의 말을 무시하고 가장 긴 코스에 등록했다"], "ans": 2, "exp": "관중 속 Sam이 'Thank you, Runners!'라고 적힌 팻말을 들고 있었다고 했습니다.\n📖 In the crowd, <b>Sam was holding a sign: “Thank you, Runners!”</b>\n   관중 속에서 Sam은 '달리는 분들 고마워요!'라고 적힌 팻말을 들고 있었다.", "b": 1, "bb": "Jason stared at the banner across the high school gym wall: “Annual Charity Marathon ― Run for Sam.” The slogan stirred something in him. Sam, a cheerful seven-year-old who loved to draw and dreamed of being an artist, had a rare heart condition. Sam wasn’t just anyone — he was the little boy living next door that Jason had babysat every summer break. He had played in the park and spent summer afternoons chasing ice cream trucks with Sam. Seeing Sam’s name on the banner made everything feel personal. Jason had always been the fastest runner in school, known among his friends as “The Speedster.” But since his knee injury, he hadn’t been able to run for quite a long time. Still, when Jason thought about Sam and the hope this marathon represented, he knew he had to try. Jason did everything he could to recover, following his doctor’s advice. A day before registration deadline, his doctor said a 3-mile run would be fine. Jason signed up for the 3-mile beginner route, hoping to run for Sam. On marathon morning, Jason stood among the runners, heart pounding. In the crowd, Sam was holding a sign: “Thank you, Runners!” Jason smiled. He was all the motivation needed. When the whistle blew, Jason started strong, but since he hadn’t run for so long, his energy faded quickly. Every step was a struggle, but he pushed forward, encouraged by the thought of how happy Sam would be. Finally, he crossed the finish line. As he was sitting to catch his breath, Sam came over and handed him bottled water. He felt pride, relief, and gratitude. He finally finished ― for Sam."},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){

  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/([①②③④⑤])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){

  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v2';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고2 25년 10월 지문 깊이 풀기 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고2_25년10월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>

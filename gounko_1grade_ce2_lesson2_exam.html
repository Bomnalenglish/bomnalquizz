ught.” Now the crisis is entering a new stage. We have no running water out of the tap. “To the mall!” says Uncle Basil. My little brother Garrett and I jump in Uncle’s truck. As we pull into the parking lot, we can see the crowd. “You two go in. I’ll meet you inside,” Uncle Basil says. Inside it’s like Black Friday at its worst ― but today it’s not televisions and video games people are after. What I see in the carts in the checkout line are mostly water bottles. The essentials of life.", "opts": ["부엌 수도꼭지에서는 이상한 소리가 나더니 결국 물이 나오지 않았 다.", "엄마는 TV에서 가뭄 관련 뉴스를 시청하고 있었다.", "삼촌은 쇼핑몰에서 주인공에게 물을 사 오라고 지시했다.", "쇼핑몰 안에서는 물을 사려는 사람들로 북적이고 있었다.", "사람들은 TV나 게임기가 아닌 생수를 장바구니에 담았다."], "answer": 3, "expl": "삼촌이 주인공과 동생을 쇼핑몰에 데려가 안으로 들어가 라고 말한 뒤 안에서 만나자고 했으므로, 삼촌이 주인공에게 물을 사 오라고 지시했다고 진술하는 ③은 글의 내용과 일치하지 않는다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "2-1", "passage": "The kitchen tap makes strange sounds. It coughs. It spits once, and then goes silent. “Mom,” I shout out into the living room, “water is not coming out.” “Alyssa, shush!” Mom says. She is watching the TV, where a news anchor is talking about the “flow crisis.” This is what the media has been calling the drought ever since people got tired of hearing the word “drought.” Now the crisis is entering a new stage. We have no running water out of the tap. “To the mall!” says Uncle Basil. My little brother Garrett and I jump in Uncle’s truck. As we pull into the parking lot, we can see the crowd. “You two go in. I’ll meet you inside,” Uncle Basil says. Inside it’s like Black Friday at its worst ― but today it’s not televisions and video games people are after. What I see in the carts in the checkout line are mostly water bottles. The essentials of life.", "opts": ["The kitchen tap makes strange sounds and eventually stops working.", "Alyssa's mother is concerned about the water issue and immediately addresses it.", "The news is reporting on a \"flow crisis,\" which is a term used to describe the current drought.", "Uncle Basil takes Alyssa and Garrett to the mall to buy water.", "The scene in the store resembles a frantic shopping event, but people are buying water bottles instead of electronics."], "answer": 2, "expl": "주방 수도꼭지가 물이 안 나오는 상황이지만 엄마는 물 공급 위기에 대한 뉴스를 시청하고 있다고 언급하고 있으므로, ② '알 리사의 어머니는 물 문제에 대해 걱정하고 즉시 해결한다'는 글의 내 용과 일치하지 않는다. [오답] ① 주방 수도꼭지에서 이상한 소리가 나다가 결국 작동을 멈춘다. ③ 뉴스에서는 현재 가뭄을 설명하는 데 사용되는 용어인 \"물 공급 위기\"에 대해 보도하고 있다.④ 바실 아저 씨는 알리사와 가렛을 데리고 물을 사러 쇼핑몰에 간다.⑤ 매장의 풍 경은 열광적인 쇼핑 이벤트와 비슷하지만, 사람들은 전자 제품 대신 물병을 사고 있다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "2-1", "passage": "The kitchen tap makes strange sounds. It coughs. It spits once, and then goes silent. “Mom,” I shout out into the living room, “water is not coming out.” “Alyssa, shush!” Mom says. She is watching the TV, where a news anchor is talking about the “flow crisis.” This is what the media has been calling the drought ever since people got tired of hearing the word “drought.” Now the crisis is entering a new stage. We have no running water out of the tap. “To the mall!” says Uncle Basil. My little brother Garrett and I jump in Uncle’s truck. As we pull into the parking lot, we can see the crowd. “You two go in. I’ll meet you inside,” Uncle Basil says. Inside it’s like Black Friday at its worst ― but today it’s not televisions and video games people are after. What I see in the carts in the checkout line are mostly water bottles. The essentials of life.", "opts": ["가뭄으로 인해 수도꼭지가 제대로 작동하지 않는다.", "필자의 엄마는 그녀에게 큰 소리로 말하라고 말한다.", "가족은 모두 함께 쇼핑몰에 간다.", "쇼핑몰에 도착했을 때는 그다지 붐비지 않는다.", "사람들은 텔레비전과 비디오 게임을 찾고 있다."], "answer": 1, "expl": "가뭄으로 인한 물 부족 때문에 수도꼭지에서 물이 나오지 않는다고 했으므로, ①은 글의 내용과 일치한다. [오답] ② 조용히 하 라고 함 ③ 가족 전부는 아님 ④ 매우 붐빔 ⑤ 생수를 찾음", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 내용과 일치하는 것은?", "tag": "2-1", "passage": "The kitchen tap makes strange sounds. It coughs. It spits once, and then goes silent. “Mom,” I shout out into the living room, “water is not coming out.” “Alyssa, shush!” Mom says. She is watching the TV, where a news anchor is talking about the “flow crisis.” This is what the media has been calling the drought ever since people got tired of hearing the word “drought.” Now the crisis is entering a new stage. We have no running water out of the tap. “To the mall!” says Uncle Basil. My little brother Garrett and I jump in Uncle’s truck. As we pull into the parking lot, we can see the crowd. “You two go in. I’ll meet you inside,” Uncle Basil says. Inside it’s like Black Friday at its worst ― but today it’s not televisions and video games people are after. What I see in the carts in the checkout line are mostly water bottles. The essentials of life.", "opts": ["The kitchen faucet has been leaking continuously for several days before finally stopping.", "The mother asks the family to leave the house quickly after hearing about the water problem on TV.", "The media started using the term ‘flow crisis’ instead of ‘drought’ due to public fatigue with the original term.", "Uncle Basil tells the children to wait outside the mall while he shops.", "The mall is peaceful, with shoppers mostly purchasing electronics despite the crisis."], "answer": 3, "expl": "사람들이 “가뭄”이라는 단어에 지쳐서 언론이 그 대신 'flow crisis'라는 표현을 쓰기 시작했다고 하였으므로, ③ '사람들이 원래 용어인 가뭄에 대해 피로감을 느끼게 되면서, 언론은 ‘가뭄’ 대신 유량 위기(flow crisis)라는 표현을 사용하기 시작했다'는 글의 내용 과 일치한다. [오답노트] ① 주방 수도꼭지가 며칠간 계속 새다가 결 국 멈췄다. ② 어머니가 물 문제 소식을 듣고 가족에게 집을 빨리 나가 라고 한다. ④ Basil 삼촌이 아이들에게 쇼핑하는 동안 밖에서 기다리 라고 한다. ⑤ 쇼핑몰은 평화롭고 쇼핑객들은 위기에도 전자제품을 주 로 산다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "2-1", "passage": "The kitchen tap makes strange sounds. It coughs. It spits once, and then goes silent. “Mom,” I shout out into the living room, “water is not coming out.” “Alyssa, shush!” Mom says. She is watching the TV, where a news anchor is talking about the “flow crisis.” This is what the media has been , and I’ll keep the rest.”", "opts": ["The cart was extremely heavy, making it nearly impossible to push.", "A man dressed in a business suit approached and immediately started helping without hesitation.", "The narrator appreciates the help and believes tough situations reveal people’s best qualities.", "The man’s offer to share the ice showed genuine generosity without expecting anything in return.", "Although polite and smiling, the man insisted on retaining the majority of the ice."], "answer": 4, "expl": "남자가 얼음의 거의 전부를 자신이 가져가겠다는 탐욕 을 보여줬으므로, ④ \"그 남자가 얼음을 나누겠다고 한 제안은 아무런 대가를 바라지 않는 진정한 관대함을 보여주었다.\"는 글의 내용과 일 치하지 않는다. [오답노트] ① 수레가 매우 무거워 거의 밀기 어려웠 다. ② 정장 차림 남자가 주저 없이 다가와 도와주기 시작했다. ③ 화 자는 도움을 고맙게 여기고 어려움이 사람의 선함을 드러낸다고 생각 한다. ⑤ 남자는 공손하게 미소 짓지만 대부분의 아이스를 자신이 가 지려 했다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "2-4", "passage": "The cart is ridiculously heavy now, and almost impossible to push. Then, a man in a business suit comes up behind us. He smiles. “Looks like you could use some help.” He doesn’t wait for us to answer before grabbing the cart’s handle. “Thank you for helping us,” I tell him. “Not a problem. We all need to help one another.” He smiles again, and I return the smile. It is good to know that difficult times can bring out the best in people. I decide that one favor deserves another. “Why don’t you take a bag of ice for yourself,” I suggest. His smile does not fade. “I have a better idea,” he says. “Why don’t you take a bag of ice for yourselves, and I’ll keep the rest.”", "opts": ["수레는 너무 무거워서 혼자 힘으로는 움직이기 어려웠다.", "도움을 주겠다고 말한 남자는 대답을 기다리지 않고 수레를 잡았 다.", "화자는 남자의 미소에 응답하며 웃음으로 감사를 표현했다.", "글쓴이는 남자의 친절에 감동해 얼음을 모두 주려고 했다.", "남자는 친절한 제스처를 하며, 나머지 얼음을 모두 자신이 가지겠 다고 말했다."], "answer": 4, "expl": "글쓴이는 얼음 한 봉지를 제안했고 남자는 한봉지를 제 외한 나머지 모두를 본인이 가져갈 것을 제안했으므로 ④는 글의 내용 과 일치하지 않는다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "2-4", "passage": "The cart is ridiculo  leave before it becomes a deep flush. I look for Garrett, whom I find in the frozen aisle. Then I see something. Just past the frozen vegetables and ice cream, there is a case packed with ice. I open the door and reach for a bag. “What are you doing? We need water, not ice,” he reminds me. “Ice is water. Just help me,” I tell him. Garrett and I put one bag of ice after another into our cart, until it is piled as high as it can get. By now other people have taken notice and begin to empty the ice case.", "opts": ["As Alyssa and Garrett add ice, the rest of the shoppers follow suit and take some for themselves.", "Alyssa discovers a case of water on the wrong shelf, but a woman snatches it away.", "The woman who claimed the water adds it to her cart and maintains she had priority.", "Alyssa recalls for Hali the moment she let her use her ball during training.", "The woman's daughter, Hali Hartling, offers an apology to Alyssa for what occurred."], "answer": 4, "expl": "Alyssa가 자신이 지난 주 훈련에서 Hali에게 물을 나 눠준 것을 상겨시켜주었다고 하였으므로, ④ 'Alyssa는 훈련 중 Hali 에게 공을 빌려줬던 그 순간을 Hali에게 다시 상기시킨다'는 글의 내 용과 일치하지 않는다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 내용과 일치하지 않는 것은?", "tag": "2-본문(all)", "passage": "“I’m sorry, but we were here first,” she says. And then her daughter steps forward ― a girl I recognize from soccer ― Hali Hartling. As her mother pulls their cart away, Hali leans closer to me. “I’m sorry about that, Alyssa.” “Didn’t I share my water with you at the practice last week?” I point out to her. “Maybe you could return the favor and share a few bottles with me.” She looks back to her mother, who’s already moving down the aisle, then turns back to me shaking her head. And then she gets a little bit red in the face, and turns to leave before it becomes a deep flush. I look for Garrett, whom I find in the frozen aisle. Then I see something. Just past the frozen vegetables and ice cream, there is a case packed with ice. I open the door and reach for a bag. “What are you doing? We need water, not ice,” he reminds me. “Ice is water. Just help me,” I tell him. Garrett and I put one bag of ice after another into our cart, until it is piled as high as it can get. By now other people have taken notice and begin to empty the ice case. The cart is ridiculously heavy now, and almost impossible to push. Then, a man in a business suit comes up behind us. He smiles. “Looks like you could use some help.” He doesn’t wait for us to answer before grabbing the cart’s handle. “Thank you for helping us,” I tell him. “Not a problem. We all need to help one another.” He smiles again, and I return the smile. It is good to know that difficult times can bring out the best in people. I decide that one favor deserves another. “Why don’t you take a bag of ice for yourself,” I suggest. His smile does not fade. “I have a better idea,” he says. “Why don’t you take a bag of ice for yourselves, and I’ll keep the rest.” For a moment I think he is joking, but then realize he is serious. “Excuse me?” He is still smiling, but his eyes scare me.", "opts": ["Alyssa는 Hali에게 축구 연습 시간에 그녀의 물을 나누어 주었다.", "Alyssa는 물 대신 얼음 봉지를 카트에 가득 담았다.", "Alyssa의 카트가 무거워 밀기 힘들 때 한 남자가 도와주겠다는 제 안을 했다.", "Alyssa는 친절의 대가로 고마움에 남자에게 얼음 한 봉지를 가져 가라고 제안했다.", "남자의 선행은 결국 어려운 상황일수록 선한 마음이 드러난다는 것 을 증명했다."], "answer": 5, "expl": "무거운 카트를 미는 것을 대가로 한 봉지의 얼음만 빼 고 전부를 가져가겠다는 남자의 말에서 그의 행동이 선의가 아니라는 것을 알 수 있으므로 ⑤는 글의 내용에 일치하지 않는다.", "inline": false, "short": false, "summary": ""}]}, {"key": "blank", "no": 2, "title": "빈칸 추론", "emoji": "🔲", "desc": "문맥에 맞는 말을 고르세요", "questions": [{"q": "다음 빈칸에 들어갈 말로 가장 적절한 것은?", "tag": "2-1", "passage": "The kitchen tap makes strange sounds. It coughs. It spits once, and then goes silent. “Mom,” I shout out into the living room, “water is not coming out.” “Alyssa, shush!” Mom says. She is watching the TV, where a news anchor is talking about the “ .” This is what the media has been calling the drought ever since people got tired of hearing the word “dr ": "뚜렷한 과거를 나타내는 부사 yesterday가 있으므로 현 재완료 has abandoned를 과거 형태인 abandoned로 고쳐야 한 다.", "inline": true, "short": false, "summary": ""}, {"q": "A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적 절한 것은?", "tag": "2-2", "passage": "There is a look of impatience on the faces of the people in line. There is even hostility, hidden by a thin layer of politeness. Even that politeness is stretched thin. (A) [Approaching / Approached] the back of the store for water bottles, I realize I am too late. The shelves are already empty. I manage my way to the side aisle, trying my luck. Sometimes people (B) [place / are placed] unwanted items in the wrong shelves. Lucky! I find a single case of water that someone abandoned there maybe yesterday, when it wasn’t such a precious commodity. I reach for it, only to find it (C) [pulled / pulling] away at the last second by a woman. She stacks it on top of her cart like a crown on top of her canned goods.", "opts": ["Approaching - are placed - pulled", "Approaching - are placed - pulling", "Approached - place - pulling", "Approaching - place - pulled", "Approached - are placed - pulled"], "answer": 4, "expl": "A) 의미상 주어인 \"I\"를 부연설명하는 분사구문으로, 주어와 능동관계이므로, 현재분사인 Approaching이 적절하다. (B) 주어인 people은 동사의 행위를 직접하며, 목적어 또한 취하고 있으 므로, 능동태인 place가 적절하다. (C) 목적어인 it(a single case of water)를 부연설명하는 목적격 보어의 형태로, 목적어와 수동관계 이므로, 과거분사인 pulled가 적절하다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "2-3", "passage": "“I’m sorry, but we were here first,” she says. And then her daughter steps forward ― a girl I recognize from soccer ― Hali Hartling. As her mother pulls their cart away, Hali leans closer to me. “I’m sorry about that, Alyssa.” “Didn’t I share my water with you at the practice last week?” I point out to her. “Maybe you could return the favor and share a few bottles with me.” She looks back to her mother, ① who’s already moving down the aisle, then turns back to me shaking her head. And then she gets a little bit red in the face, ② turning to leave before it becomes a deep flush. I look for Garrett, ③ whom I find in the frozen aisle. Then I see something. Just past the frozen vegetables and ice cream, there is a case ④ packed with ice. I open the door and reach for a bag. “What are you doing? We need water, not ice,” he reminds me. “Ice is water. Just help me,” I tell him. Garrett and I put one bag of ice after another into our cart, until it is piled as ⑤ highly as it can get. By now other people have taken notice and begin to empty the ice case.", "opts": [], "answer": 5, "expl": "문장의 의미상 '그것이 도달할 수 있을 만큼 높이 쌓일 때 까지'이므로, ⑤ highly를 high로 고쳐야 한다. 'highly'는 '매우'라 는 뜻이다.", "inline": true, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "2-3", "passage": "“I’m sorry, but we were here first,” she says. And then her daughter steps forward ― a girl I ① recognize from soccer ― Hali Hartling. As her mother pulls their cart away, Hali leans closer to me. “I’m sorry about that, Alyssa.” “Didn’t I share my water with you at the practice last week?” I point out to her. “Maybe you could return the favor and ② share a few bottles with me.” She looks back to her mother, who’s already moving down the aisle, then turns back to me ③ shaking her head. And then she gets a little bit red in the face, and turns to leave before it becomes a deep flush. I look for Garrett, ④ that I find in the frozen aisle. Then I see something. Just past the frozen vegetables and ice cream, there is a case ⑤ packed with ice. I open the door and reach for a bag. “What are you doing? We need water, not ice,” he reminds me. “Ice is water. Just help me,” I tell him. Garrett and I put one bag of ice after another into our cart, until it is piled as high as it can get. By now other people have taken notice and begin to empty the ice case.", "opts": [], "answer": 4, "expl": "콤마 뒤에 계속적 용법 자리에 관계대명사 that을 사용 할 수 없으므로 that을 whom으로 고쳐야 한다.", "inline": true, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "2-4", "passage": "The cart is ① ridiculously heavy now, and almost impossible to push. Then, a man in a business suit comes up behind us. He smiles. “It seems ② that you could use some help.” He doesn’t wait for us to answer before ③ grabbing the cart’s handle. “Thank you for helping us,” I tell him. “Not a problem. We all need to help one another.” He smiles again, and I return the smile. It is good to know ④ what difficult times can bring out the best in people. I decide that one favor deserves another. “Why don’t you take a bag of ice for yourself,” I suggest. His smile does not fade. “I have a better idea,” he says. “Why don’t you ⑤ take a bag of ice for yourselves, and I’ll keep the rest.”", "opts": [], "answer": 4, "expl": "뒤에 완전한 형태의 문장이 나오므로, 접속사 that으로 고쳐야 한다. (변형) ② looks like -> It seems that~", "inline": true, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "2-5", "passage": "For a moment I think he is joking, but then realize he is serious. “Excuse me?” He is still smiling, but his eyes scare me. As long as his hands are firmly locked on the handle of our cart, there is nothing to prove ① that it’s ours and not his. “Is there a problem here?” It is Uncle Basil. He ② has arrived just in time. “Not at all.” The man looks at the ice with a bitter face, then leaves. *The above is a ③ shortening version of the opening of the novel Dry (2018). It tells the story of a girl who has to make tough choices for her family ④ during a disastrous California drought. Her unwanted adventure ends when the water supply resumes and life is back to normal. ⑤ Provided that the factors contributing to water shortages worldwide are not addressed, including climate change, population growth, and using too much water for agriculture, it is possible that this story can become a reality.", "opts": [], "answer": 3, "expl": "짧아진 버전이라는 의미를 담으면서 수동의 과거분사가 명사를 수식하는 자리이므로, ③ shortening을 shortened로 고쳐 야 한다.", "inline": true, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "2-5", "passage": "For a moment I think he is joking, but then realize he is serious. “Excuse me?” He is still smiling, but his eyes scare me. As long as his hands are firmly locked on the handle of our cart, there is nothing to prove that it’s ours and not ① his. “Is there a problem here?” It is Uncle Basil. He has arrived just in time. “Not at all.” The man looks at the ice with a bitter face, then leaves. *The above is a shortened version of the opening of the novel Dry (2018). It tells the story of a girl who ② has to make tough choices for her family during a disastrous California drought. Her ③ unwanted adventure ends when the water supply resumes and life is back to normal. Provided that the factors ④ contributing to water shortages worldwide are not addressed, including climate change, population growth, and using too much water for agriculture, it is possible ⑤ what this story can become a reality.", "opts": [], "answer": 5, "expl": "뒤에 완전한 절이 이어지고 있으므로 ⑤ what은 that(접속사)로 고쳐야 한다. 가주어(it) 진주어(that절)가 사용되었 다.", "inline": true, "short": false, "summary": ""}, {"q": "A), (B), (C)의 각 네모 안에서 어법에 맞는 표현으로 가장 적절한 것은?", "tag": "2-5", "passage": "What you've just read is a (A) [shortened / shortening] version of the opening of the novel Dry (2018). It tells the story of a girl who has to make tough choices for her family during a disastrous California drought. Her unwanted adventure ends when the water supply (B) [resumes / resumed] and life is back to normal. (C) [Given that / Unless] the factors contributing to water shortages worldwide are addressed, including climate change, population growth; and using too much water for agriculture, it is possible that the story can become a terrible reality.", "opts": ["shortening - resumed - Unless", "shortened - resumes - Given that", "shortened - resumed - Unless", "shortened - resumes - Unless", "shortening - resumes - Given that"], "answer": 4, "expl": "A) version은 축약되는 대상이므로 과거분사 shortened가 적절하다. (B) 소설 내용의 요약본으로, 작품에 대한 설명은 현재형으로 진행한다. 또한 주어가 the water supply 이기 때문에 재개된다는 의미의 동사를 사용할 때, 단수형태를 사용하는 것 이 적절하다. (C) Given that ~(~를 전제로 할 때) 는 문맥 상 적절 하지 않다. \"해결되지 않는다면\" 이라는 의미의 부정조건을 언급하는 것이 적절하기 때문에, Unless를 사용하는 것이 적절하다.", "inline": false, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?", "tag": "2-본문(all)", "passage": "The kitchen tap makes strange sounds. It coughs. It spits once, and then goes silent. “Mom,” I shout out into the living room, “water is not coming out.” “Alyssa, shush!” Mom says. She is watching the TV, ① where a news anchor is talking about the “flow crisis.” This is what the media has been calling the drought ever since people got tired of hearing the word “drought.” Now the crisis is entering a new stage. We have no running water out of the tap. “To the mall!” says Uncle Basil. My little brother Garrett and I jump in Uncle’s truck. As we pull into the parking lot, we can see the crowd. “You two go in. I’ll meet you inside,” Uncle Basil says. Inside it’s like Black Friday at its worst ― but today it’s not televisions and video games people are after. ② What I see in the carts in the checkout line are mostly water bottles. The essentials of life. There is a look of impatience on the faces of the people in line. There is even hostility, ③ hidden by a thin layer of politeness. Even that politeness is stretched thin. As I approach the back of the store for water bottles, I realize I am too late. The shelves are already empty. I manage my way to the side aisle, ④ trying my luck. Sometimes people place unwanted items in the wrong shelves. Lucky! I find a single case of water that someone abandoned there maybe yesterday, when it wasn’t such a precious commodity. I reach for it, only to find it ⑤ pull away at the last second by a woman. She stacks it on top of her cart like a crown on top of her canned goods.", "opts": [], "answer": 5, "expl": "5형식 구조로 find + O+O.C에서 O가 \"끌어 aces of the people in line. There is even hostility, hidden by a thin layer of politeness. Even that politeness is ① stretched thin. As I approach the back of the store for water bottles, I realize I am too late. The shelves are already ② empty. I manage my way to the side aisle, trying my luck. Sometimes people place ③ unwanted items in the wrong shelves. Lucky! I find a single case of water that someone ④ hid there maybe yesterday, when it wasn’t such a precious commodity. I reach for it, only to find it ⑤ pulled away at the last second by a woman. She stacks it on top of her cart like a crown on top of her canned goods.", "opts": [], "answer": 4, "expl": "사람들이 물을 구하려 긴 줄을 서고 있으며, 주인공은 물 병이 다 팔려 빈 선반에서 우연히 버려진 물병을 발견하지만 다른 사 람이 먼저 가져간다는 흐름이 자연스러우므로, ④의 'hid(숨겼다)를' 'abandoned(버렸다)' 등의 어휘로 고쳐야 한다.", "inline": true, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "tag": "2-2", "passage": "There is a look of ① annoyance on the faces of the people in line. There is even hostility, hidden by a thin layer of politeness. Even that politeness is stretched thin. As I ② head to the back of the store for water bottles, I realize I am too late. The shelves are already ③ cleared out. I manage my way to the side aisle, trying my luck. Sometimes people place unwanted items in the wrong shelves. Lucky! I find a single case of water that someone abandoned there maybe yesterday, when it was still just a ④ precious commodity. I reach for it, only to find it ⑤ taken at the last second by a woman. She stacks it on top of her cart like a crown on top of her canned goods.", "opts": [], "answer": 4, "expl": "문맥상 어제까지만 해도 흔했을 물이 오늘은 희귀해져서 경쟁 대상이 되었다는 흐름이므로, ④ precious(귀중한)을 common(평범한) 등으로 고쳐야 한다. [본문 변형] ① impatience / ② approach / ③ empty / ④ ..., when it wasn’t such a precious commodity / ⑤ pulled away", "inline": true, "short": false, "summary": ""}, {"q": "A), (B), (C)의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절 한 것은?", "tag": "2-2", "passage": "There is a look of imp  Then, a man in a business suit comes up behind us. He smiles. “Looks like you could use some help.” He doesn’t wait for us to answer before grabbing the cart’s handle. “Thank you for helping us,” I tell him. “Not a problem. We all need to help one another.” He smiles again, and I ② return the smile. It is good to know that ③ difficult times can bring out the best in people. I decide that one favor ④ dismisses another. “Why don’t you take a bag of ice for yourself,” I suggest. His smile does not fade. “I have a better idea,” he says. “Why don’t you take a bag of ice for yourselves, and I’ll keep ⑤ the others.”", "opts": [], "answer": 4, "expl": "글쓴이는 '받은 호의에는 또 다른 호의로 보답해야 한 다'는 생각에 남자에게 얼음 한봉지를 제안하게 된다. 따라서 ④ dismisses(쫓아내다, 묵살하다)는 deserves 또는 invites등의 어 휘로 고쳐야 한다.", "inline": true, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않 은 것은?", "tag": "2-4", "passage": "The cart is ① absurdly heavy now, and almost impossible to push. Then, a man in a business suit comes up behind us. He smiles. “Looks like you could ② use some help.” He doesn’t wait for us to answer before grabbing the cart’s handle. “Thank you for helping us,” I tell him. “Not a problem. We all need to help one another.” He smiles again, and I return the smile. It is good to know that ③ tough times can bring out the best in people. I decide that one favor ④ calls for another. “Why don’t you take a bag of ice for yourself,” I suggest. His smile ⑤ fades. “I have a better idea,” he says, still smiling. “Why don’t you take a bag of ice for yourselves, and I’ll keep the rest.”", "opts": [], "answer": 5, "expl": "'fades'는 (미소가) 사라졌다는 의미인데, 이어지는 문 장에서 \"he says, still smiling\"이라고 하므로 앞의 내용과 모순된 다. 문맥상 미소가 유지되고 있다는 흐름이므로, ⑤ 'fades'(사라지 다)를 remains(유지되다) 등으로 고쳐야 한다. [본문 변형] ① ridiculously / ③ difficult / ④ deserves / ⑤ His smile does not fade. 또한 다음 문장에서 'still smiling' 추가함", "inline": true, "short": false, "summary": ""}, {"q": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않 은 것은?", "tag": "2-5 let school='', name='', round=null, qs=[], idx=0, cor=0, wrongs=[], answered=false, t0=0, retry=false;

function el(id){return document.getElementById(id);}
function show(id){['scStart','scCount','scQuiz','scResult','scNote'].forEach(x=>el(x).classList.toggle('hidden',x!==id));
  ['top','bar'].forEach(x=>el(x).classList.toggle('hidden',id!=='scQuiz'));}

function renderRounds(){
  const box=el('rounds'); box.innerHTML='';
  EXAM.rounds.forEach(r=>{
    const n=r.questions.length;
    const b=document.createElement('button');
    b.className='rbtn'; b.disabled=n===0;
    b.innerHTML='<span class="rno">'+r.no+'</span><span><span class="rttl">'+r.emoji+' '+r.title+'</span>'
      +'<span class="rsub">'+r.desc+'</span></span>'
      +'<span class="rcnt'+(n?'':' soon')+'">'+(n?n+'문항':'준비 중')+'</span>';
    if(n) b.onclick=()=>pickRound(r);
    box.appendChild(b);
  });
}
function pickRound(r){
  school=el('school').value; name=el('name').value.trim();
  if(!school){alert('학교를 선택해주세요!');return;}
  if(!name){alert('이름을 입력해주세요!');return;}
  try{localStorage.setItem('bn_name',name);localStorage.setItem('bn_school',school);}catch(e){}
  round=r;
  el('cntTitle').textContent=r.emoji+' '+r.no+'라운드 '+r.title+' · 몇 문항 풀까요?';
  const box=el('cntBtns'); box.innerHTML='';
  const opts=[10,20,round.questions.length].filter((v,i,a)=>v<=round.questions.length&&a.indexOf(v)===i);
  opts.forEach(n=>{
    const b=document.createElement('button');
    b.className='rbtn';
    b.innerHTML='<span class="rno">'+(n===round.questions.length?'전체':n)+'</span><span><span class="rttl">'
      +n+'문항 풀기</span><span class="rsub">'+(n===round.questions.length?'이 라운드 전부':'무작위로 '+n+'문항')+'</span></span>';
    b.onclick=()=>start(n);
    box.appendChild(b);
  });
  show('scCount');
}
function backToRounds(){show('scStart');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(n){
  qs=shuffle(round.questions).slice(0,n);
  idx=0;cor=0;wrongs=[];retry=false;t0=Date.now();
  el('topT').textContent=round.emoji+' '+round.title;
  show('scQuiz'); draw();
}
function draw(){
  if(idx>=qs.length){result();return;}
  answered=false;
  const q=qs[idx];
  el('topC').textContent=(idx+1)+'/'+qs.length;
  el('fill').style.width=(idx/qs.length*100)+'%';
  const CIR='①②③④⑤';
  if(q.short){ drawShort(q); return; }
  const inline = !q.opts || q.opts.length===0;
  let psg = esc(q.passage);
  if(inline) psg = psg.replace(/[①②③④⑤]/g, m=>'<b class="mk">'+m+'</b>');   // 밑줄형 표시 강조
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+esc(q.tag)+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +'<div class="psg">'+psg+'</div>'
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +(inline?'<div class="hint">지문에서 번호가 붙은 부분을 보고 답을 고르세요</div>':'')
    +'<div class="'+(inline?'opts inline':'opts')+'" id="opts"></div><div class="fb" id="fb"></div>';
  const box=el('opts');
  if(inline){
    for(let i=0;i<5;i++){
      const b=document.createElement('button');
      b.className='opt num';
      b.innerHTML='<span class="on">'+CIR[i]+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    }
  } else {
    q.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML='<span class="on">'+CIR[i]+'</span><span>'+esc(o)+'</span>';
      b.onclick=()=>pick(b,i+1,q);
      box.appendChild(b);
    });
  }
  window.scrollTo(0,0);
}

// ── 주관식(답 입력형) ──
function normalize(t){
  return String(t||'').toLowerCase()
    .replace(/[‘’“”]/g,"'")
    .replace(/[^a-z0-9가-힣]+/g,' ').trim();
}
function drawShort(q){
  el('qcard').innerHTML=(q.tag?'<span class="qtag">지문 '+q.tag+'</span>':'')
    +'<div class="stem">'+(idx+1)+'. '+esc(q.q)+'</div>'
    +'<div class="psg">'+esc(q.passage)+'</div>'
    +(q.summary?'<div class="sumbox"><div class="sumlbl">📝 요약문</div>'+esc(q.summary)+'</div>':'')
    +'<div class="hint">답을 직접 입력한 뒤 [답 확인]을 누르세요</div>'
    +'<textarea class="inp" id="sans" rows="3" placeholder="여기에 답을 쓰세요"></textarea>'
    +'<button class="btn" style="margin-top:10px" id="schk">답 확인하기</button>'
    +'<div class="fb" id="fb"></div>';
  el('schk').onclick=()=>checkShort(q);
  el('sans').focus();
  window.scrollTo(0,0);
}
function checkShort(q){
  if(answered) return;
  const mine=el('sans').value.trim();
  if(!mine){ alert('답을 입력해 주세요!'); return; }
  answered=true;
  el('sans').disabled=true; el('schk').disabled=true;
  const ok = normalize(mine)===normalize(q.answer);
  const fb=el('fb');
  fb.className = ok?'fb y':'fb n';
  fb.innerHTML = (ok?'✅ 정답입니다!':'❌ 정답과 다릅니다.')
    +'<div class="sans-cmp"><b>내 답</b> '+esc(mine)+'</div>'
    +'<div class="sans-cmp good"><b>정답</b> '+esc(q.answer)+'</div>'
    +(q.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(q.expl)+'</div>':'');
  if(ok){ cor++; }
  else { wrongs.push({q:q,my:mine}); }
  const box=document.createElement('div'); box.style.display='grid'; box.style.gap='8px'; box.style.marginTop='12px';
  if(!ok){
    const self=document.createElement('button');
    self.className='btn sec'; self.textContent='🙆 사실상 맞았어요 (정답 처리)';
    self.onclick=()=>{ cor++; wrongs=wrongs.filter(w=>w.q!==q); self.disabled=true;
                       self.textContent='✔ 정답으로 처리했어요'; };
    box.appendChild(self);
  }
  const nx=document.createElement('button');
  nx.className='btn'; nx.textContent=(idx+1>=qs.length?'다음 · 결과 보기 →':'다음 문제 →');
  nx.onclick=()=>{idx++;draw();};
  box.appendChild(nx);
  el('qcard').appendChild(box);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pick(btn,sel,q){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const fb=el('fb'), CIR='①②③④⑤';
  if(sel===q.answer){
    btn.classList.add('ok');fb.className='fb y';
    fb.innerHTML='✅ 정답! <b>'+CIR[q.answer-1]+'</b>번'
      +(q.expl?'<div class="expl" style="border-top-color:#86efac">💡 '+esc(q.expl)+'</div>':'');
    cor++;
  }
  else{
    btn.classList.add('no');
    document.querySelectorAll('.opt')[q.answer-1].classList.add('reveal');
    fb.className='fb n';
    fb.innerHTML='❌ 정답은 <b>'+CIR[q.answer-1]+'</b>번입니다.'
      +(q.expl?'<div class="expl">💡 '+esc(q.expl)+'</div>':'');
    wrongs.push({q:q,my:sel});
  }
  // 해설이 있으면 버튼으로 넘긴다 (자동으로 넘어가면 해설을 못 읽음)
  if(q.expl){
    const nx=document.createElement('button'); nx.className='btn'; nx.style.marginTop='12px';
    nx.textContent=(idx+1>=qs.length?'해설을 읽었어요 · 결과 보기 →':'해설을 읽었어요 · 다음 문제 →');
    nx.onclick=()=>{idx++;draw();};
    el('qcard').appendChild(nx);
    if(nx.scrollIntoView) nx.scrollIntoView({block:'nearest'});
  } else {
    setTimeout(()=>{idx++;draw();},sel===q.answer?800:2000);
  }
}
let lastWrong=[];
function result(){
  el('fill').style.width='100%';
  if(!retry) lastWrong = wrongs.map(w=>({
    q:w.q.q, passage:w.q.passage, tag:w.q.tag||'', opts:w.q.opts||[],
    my:w.my, answer:w.q.answer, expl:w.q.expl||'', note:'', short:!!w.q.short
  }));
  const total=qs.length, pct=total?Math.round(cor/total*100):0;
  const min=Math.max(1,Math.round((Date.now()-t0)/60000));
  const CIR='①②③④⑤';
  const wHtml=wrongs.length?'<div class="wrongbox"><div class="lbl">❌ 틀린 문제 '+wrongs.length+'개</div>'
    +wrongs.map(w=>'<div class="wi"><b>'+esc(w.q.q)+'</b><br>'
    +(w.q.short ? ('내 답 '+esc(String(w.my))+' → 정답 '+esc(String(w.q.answer)))
                : ('내 답 '+CIR[w.my-1]+' → 정답 '+CIR[w.q.answer-1]))+'</div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:12px">🎉 전부 정답!</div>';
  el('scResult').innerHTML='<div class="card" style="text-align:center">'
    +'<div style="font-size:12px;color:#6b7280">'+EXAM.lesson+' · '+round.no+'라운드 '+round.title+'</div>'
    +'<div class="score">'+pct+'점</div>'
    +'<div class="stat"><div><b style="color:#2e7d32">'+cor+'</b><span>정답</span></div>'
    +'<div><b style="color:#c62828">'+(total-cor)+'</b><span>오답</span></div>'
    +'<div><b style="color:#1565c0">'+total+'</b><span>문항</span></div>'
    +'<div><b style="color:#f57f17">'+min+'분</b><span>소요</span></div></div>'
    +wHtml
    +'<div style="display:grid;gap:8px;margin-top:14px">'
    +(lastWrong.length?'<button class="btn" onclick="openNote()">📝 오답노트 작성하기 ('+lastWrong.length+')</button>':'')
    +(wrongs.length?'<button class="btn sec" onclick="retryWrong()">❌ 틀린 문제 다시 풀기 ('+wrongs.length+')</button>':'')
    +'<button class="btn sec" onclick="backToRounds()">← 라운드 다시 선택</button></div></div>';
  show('scResult');
  if(window._saveResult) window._saveResult({
    studentName:name, school:school, score:pct, correct:cor, wrong:total-cor, total:total,
    elapsedMin:min, round:retry?2:1, completed:wrongs.length===0,
    quizType:'고운고1_공통영어2_'+EXAM.lesson+'_'+round.title+(retry?'_오답완료':''),
    lesson:EXAM.lesson, roundName:round.title,
    wrongWords:wrongs.map(w=>({eng:w.q.q.slice(0,40), kor:'정답 '+CIR[w.q.answer-1]})),
    // 내 학습 기록에서 '내 답 / 정답 / 해설'을 볼 수 있도록 상세를 함께 저장
    wrongDetails:wrongs.map(w=>({
      q:w.q.q, my:w.my, answer:w.q.answer,
      myText: w.q.short ? String(w.my) : (w.q.opts[w.my-1]||(CIR[w.my-1]+'번')),
      answerText: w.q.short ? String(w.q.answer) : (w.q.opts[w.q.answer-1]||(CIR[w.q.answer-1]+'번')),
      expl:w.q.expl||''
    }))
  });
}
function retryWrong(){
  qs=wrongs.map(w=>w.q); idx=0;cor=0;wrongs=[];retry=true;t0=Date.now();
  show('scQuiz'); draw();
}

function openNote(){
  const CIR='①②③④⑤';
  el('scNote').innerHTML='<div class="card">'
    +'<div class="lbl">📝 오답노트 · '+EXAM.lesson+' '+round.title+'</div>'
    +'<div style="font-size:12px;color:#6b7280;line-height:1.7;margin-bottom:12px">'
    +'틀린 문제를 다시 보고, 왜 틀렸는지 한 줄로 적어 보세요. 저장하면 <b>내 학습 기록</b>에서 다시 볼 수 있어요.</div>'
    +lastWrong.map((w,i)=>'<div class="notecard">'
        +'<div class="noteq">'+(i+1)+'. '+esc(w.q)+(w.tag?' <span class="qtag">지문 '+esc(w.tag)+'</span>':'')+'</div>'
        +'<div class="psg" style="font-size:12.5px;max-height:150px;overflow:auto">'+esc(w.passage)+'</div>'
        +'<div class="noterow"><span class="bad">내 답 '+(w.short?'':CIR[w.my-1])+'</span> '
          +esc(w.short?w.my:((w.opts||[])[w.my-1]||''))+'</div>'
        +'<div class="noterow"><span class="good">정답 '+(w.short?'':CIR[w.answer-1])+'</span> '
          +esc(w.short?w.answer:((w.opts||[])[w.answer-1]||''))+'</div>'
        +(w.expl?'<div class="expl" style="border-top-color:#cbd5e1">💡 '+esc(w.expl)+'</div>':'')
        +'<textarea class="inp noteta" data-i="'+i+'" rows="2" placeholder="왜 틀렸나요? (예: 지문에 없는 내용을 골랐다)"></textarea>'
      +'</div>').join('')
    +'<button class="btn" id="noteSave" onclick="saveNote()">💾 오답노트 저장하기</button>'
    +'<div id="noteMsg" style="text-align:center;font-size:12.5px;font-weight:800;margin-top:10px"></div>'
    +'<button class="btn sec" style="margin-top:10px" onclick="backToResult()">← 결과로 돌아가기</button></div>';
  show('scNote'); window.scrollTo(0,0);
}
async function saveNote(){
  document.querySelectorAll('.noteta').forEach(t=>{ lastWrong[+t.dataset.i].note = t.value.trim(); });
  const btn=el('noteSave'), msg=el('noteMsg');
  btn.disabled=true; btn.textContent='저장 중...';
  const ok = window._saveNote ? await window._saveNote({
    studentName:name, school:school, lesson:EXAM.lesson, roundName:round.title,
    quizType:'고운고1_공통영어2_'+EXAM.lesson+'_'+round.title+'_오답노트',
    wrongCount:lastWrong.length,
    items:lastWrong.map(w=>({q:w.q, my:w.my, answer:w.answer,
      myText: w.short ? String(w.my) : ((w.opts||[])[w.my-1]||(CIR[w.my-1]+'번')),
      answerText: w.short ? String(w.answer) : ((w.opts||[])[w.answer-1]||(CIR[w.answer-1]+'번')),
      expl:w.expl, note:w.note}))
  }) : false;
  btn.disabled=false; btn.textContent='💾 오답노트 저장하기';
  msg.style.color = ok ? '#2e7d32' : '#c62828';
  msg.textContent = ok ? '✅ 저장했어요! 내 학습 기록에서 볼 수 있어요.' : '⚠️ 저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}
function backToResult(){ show('scResult'); window.scrollTo(0,0); }
window.openNote=openNote; window.saveNote=saveNote; window.backToResult=backToResult;
window.backToRounds=backToRounds; window.retryWrong=retryWrong;
(function init(){
  try{
    const n=localStorage.getItem('bn_name'); if(n) el('name').value=n;
    const s=localStorage.getItem('bn_school')||'';
    for(const o of el('school').options){ if(o.value && s.indexOf(o.value.replace(/\d$/,''))===0){el('school').value=o.value;break;} }
  }catch(e){}
  renderRounds();
})();
</script>
</body>

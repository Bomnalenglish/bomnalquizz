.choices{display:grid;gap:8px;}
.cb{background:#f7f1e8;border:2px solid #e6dccd;border-radius:11px;padding:12px 15px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:flex-start;gap:10px;line-height:1.5;}

{"no": 33, "school": "", "pref": "20", "type": "", "diff": "", "stem": "비효율적인 교사가 놓치는 것으로 글이 지적한 것은?", "p": "20-33", "choices": ["학생 평가의 공정성", "수업 시작 몇 분의 힘", "교실 좌석의 배치 방식", "학부모 상담의 중요성"], "ans": 2, "exp": "첫 문장에서 비효율적인 교사는 수업 시작 몇 분이 가진 힘을 놓친다고 했어요.\n📖 Inefficient teachers <b>overlook the potential power of the opening minutes of class</b>.\n   비효율적인 교사들은 수업 시작 몇 분이 가진 잠재적인 힘을 못 보고 지나친다.", "b": 1, "bb": "Inefficient teachers overlook the potential power of the opening minutes of class. Often, if students are quiet enough and if there are many pressing demands on a teacher’s time at that moment, more than ten minutes can disappear before class starts. It’s no wonder that students are late for class; they have little reason to be on time. You can use the first ten minutes to get your class off to a great start, or you can choose to waste this time. The first minutes set the tone for the rest of the class. If you are prepared for class and have taught your students an opening routine, they can use this brief time to make mental and emotional transitions from the last class or subject and prepare to focus on learning new material. In summary, you should establish an opening routine to develop your class with an effective start."},

{"no": 49, "school": "", "pref": "21", "type": "", "diff": "", "stem": "숨을 들이쉰 원자에 대해 글이 말하는 것은?", "p": "21-49", "choices": ["일부만 다음 숨에 나간다", "전부 다음 숨에 다시 나간다", "모두 몸속에 영원히 남는다", "몸속에서 완전히 사라진다"], "ans": 1, "exp": "들이쉰 원자 가운데 '일부만' 다음 숨에 내쉬어진다고 했어요.\n📖 When you breathe, for example, <b>only some of the atoms that you inhale are exhaled in your next breath</b>.\n   예를 들어 숨을 쉴 때, 들이쉰 원자 중 일부만 다음 숨에 내쉬어진다.", "b": 1, "bb": "Many atoms in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you inhale are exhaled in your next breath. The remaining atoms are taken into your body to become part of you, and they later leave your body by various means. You don’t “own” the atoms that make up your body; you borrow them. We all share from the same atom pool because atoms forever travel around, within, and among us. Atoms cycle from person to person as we breathe and as our sweat is evaporated. We recycle atoms on a grand scale. The origin of the lightest atoms goes back to the origin of the universe, and most heavier atoms are older than the Sun and Earth. There are atoms in your body that have existed since the first moments of time, recycling throughout the universe among limitless forms, both nonliving and living. You’re the present caretaker of the atoms in your body. There will be many who will follow you."},

{"no": 65, "school": "", "pref": "22", "type": "", "diff": "", "stem": "글에 따르면 정원 가꾸기가 전통적인 운동을 힘들어하는 사람에게 특히 좋은 이유는?", "p": "22-65", "choices": ["몸에 충격이 적은 방식으로 활동할 수 있어서", "짧은 시간에 많은 칼로리를 태울 수 있어서", "전문 장비 없이 근력만 집중해 키울 수 있어서", "여러 사람과 어울려 함께 할 수 있는 일이어서"], "ans": 1, "exp": "정원 일은 '저충격(low-impact)' 활동이라서 몸에 부담이 적고, 그래서 나이와 체력에 상관없이 누구나 할 수 있다고 했어요.\n📖 Gardening is particularly beneficial for those who find traditional exercise challenging. <b>It’s a low-impact way to stay active and fit</b>, making it accessible for people of all ages and physical abilities.\n   정원 가꾸기는 전통적 운동을 어렵게 느끼는 사람에게 특히 좋은데, 몸에 충격이 적게 활동하고 건강을 유지하는 방법이기 때문이다.", "b": 1, "bb": "The act of gardening itself is a fantastic form of physical activity. It involves a range of motions, from digging and planting to watering and harvesting. These activities help improve strength, flexibility, and endurance. You might not realize it, but small tasks like weeding or turning compost can burn many calories. Gardening is particularly beneficial for those who find traditional exercise challenging. It’s a low-impact way to stay active and fit, making it accessible for people of all ages and physical abilities. Besides physical health, gardening has profound mental health benefits. Tending to plants can be incredibly calming and meditative. It allows you to focus on the present moment, reducing stress and anxiety. The repetitive tasks involved in gardening can induce a state of mindfulness, similar to meditation. Studies have shown that spending time in nature, even in a small garden, can elevate mood, improve cognition, and reduce depression symptoms. The sense of accomplishment from watching your plants grow and thrive can also boost self-esteem and overall well-being."},

{"no": 81, "school": "", "pref": "23", "type": "", "diff": "", "stem": "글에 따르면 인간이 오랫동안 도구를 이용해 온 목적은?", "p": "23-81", "choices": ["감각으로 느낄 수 없는 현상을 알아차리게 하려고", "사람의 감각 기관 수를 실제로 늘리려고", "자연 현상이 생기는 것을 막으려고", "도구끼리 신호를 주고받게 하려고"], "ans": 1, "exp": "첫 문장이 그대로 답이에요. 우리 감각으로는 느낄 수 없는 자연 현상을 옮겨서 알아차릴 수 있게 해 주는 도구를 써 왔다고 했어요.\n📖 humans have taken advantage of tools that <b>translate and bring into our perception natural phenomena that we can’t perceive with our senses</b>\n   인간은 우리 감각으로는 느낄 수 없는 자연 현상을 옮겨서 우리가 알아차릴 수 있게 해 주는 도구를 이용해 왔다.", "b": 1, "bb": "For many centuries, humans have taken advantage of tools that translate and bring into our perception natural phenomena that we can’t perceive with our senses. In some cases, this consists of simply amplifying signals that feed into our normal sensory inputs (e.g., telescopes can bring into clear view that which is too far away for our eyes to perceive on their own). Other instruments turn signals that we cannot perceive into ones that we can observe. Some of these take the form of expanding the reach of our current senses, such as creating visible images based on the ultraviolet spectrum of light or changing sounds that are normally outside the range of what human ears can hear into audible signals. Alternatively, some instruments measure properties for which we have no sensory capacity at all and change them into that which we can observe."},

{"no": 144, "school": "", "pref": "26", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "26-144", "choices": ["여러 학자의 주장을 차례로 비교한다", "고래의 몸 구조를 부위별로 설명한다", "한 가지 실험을 단계별로 소개한다", "한 인물의 삶을 시간 순서로 소개한다"], "ans": 4, "exp": "출생에서 시작해 1961년, 1967년, 1970년, 1986년으로 연도를 따라가며 한 사람의 삶을 보여 줘요.\n📖 <b>Roger Payne was born in Manhattan in 1935.</b> He studied biology at Harvard University and eventually earned his Ph.D. from Cornell University in 1961.\n   로저 페인은 1935년 맨해튼에서 태어나 하버드에서 공부하고 1961년에 박사 학위를 받았다.", "b": 1, "bb": "Roger Payne was born in Manhattan in 1935. He studied biology at Harvard University and eventually earned his Ph.D. from Cornell University in 1961. In 1967, he discovered that humpback whales make long and complex sounds. They’re known as “whale songs,” and he showed that whales use them to communicate. Then in 1970, he released an album Songs of the Humpback Whale, which became a surprise hit and helped start the global “Save the Whales” movement. The following year, he founded Ocean Alliance to protect whales and the earth’s oceans, and he used new, safe methods to study whales without harming them. Over his career, he led more than 100 research trips worldwide, including the Voyage of the Odyssey from 2000 to 2005, which studied ocean pollution. His work helped make laws that protect marine mammals, which finally led to the global ban on commercial whaling in 1986."},
{"no": 145, "school": "", "pref": "29", "type": "", "diff": "", "stem": "글에 따르면 예민한 종이 위협을 느꼈을 때 하는 행동은?", "p": "29-145", "choices": ["위협을 느끼면 무리로 모여든다", "위협을 느끼면 곧바로 달아난다", "위협을 느껴도 자리를 지킨다", "위협을 느끼면 천천히 움직인다"], "ans": 2, "exp": "어떤 종은 예민하고 빠르며, 위협을 알아채면 '즉시 도망'하도록 되어 있다고 했어요.\n📖 Some species are nervous, fast, and <b>programmed for instant flight when they perceive a threat</b>.\n   어떤 종들은 예민하고 빠르며, 위협을 느끼면 즉시 달아나도록 되어 있다.", "b": 1, "bb": "Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If putting into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!"},

{"no": 161, "school": "", "pref": "30", "type": "", "diff": "", "stem": "글에 따르면 가진 것이 적을 때 사람들은 어떻게 되는가?", "p": "30-161", "choices": ["가진 것을 나누는 데 더 열린 태도가 된다", "가진 것을 더 꼭꼭 숨기려 한다", "남의 도움을 아예 받지 않으려 한다", "경쟁을 피해 혼자 지내려 한다"], "ans": 1, "exp": "가진 것이 적을 때 우리는 가진 것을 나누는 데 더 열려 있는 편이라고 했어요.\n📖 <b>When we have less, we tend to be more open to sharing what we have.</b>\n   가진 것이 적을 때 우리는 가진 것을 나누는 데 더 열려 있는 편이다.", "b": 1, "bb": "For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain nomadic tribes don’t have much, yet they are happy to share because it is in their interest to do so. If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. It’s not just because they are nice people; it’s because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. Ironically, the more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. Our desire for more, combined with our increased physical interaction with the “common folk,” starts to create a disconnection or blindness to reality."},

{"no": 176, "school": "", "pref": "30", "type": "", "diff": "", "stem": "윗글의 전개 방식으로 가장 적절한 것은?", "p": "30-176", "choices": ["여러 부족의 풍습을 차례로 나열해 비교한다", "한 사람의 경험을 시간 순서로 따라간다", "통계 자료를 제시해 주장을 숫자로 증명한다", "일반 원리를 말한 뒤 반대 상황을 대비한다"], "ans": 4, "exp": "먼저 나눔의 원리를 말하고 유목 부족을 예로 든 뒤, 'Ironically'로 많이 가진 경우를 대비시켜요.\n📖 <b>Ironically, the more we have, the bigger our fences</b>, the more sophisticated our security to keep people away and the less we want to share.\n   역설적으로 많이 가질수록 우리의 담은 더 커진다.", "b": 1, "bb": "For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain nomadic tribes don’t have much, yet they are happy to share because it is in their interest to do so. If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. It’s not just because they are nice people; it’s because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. Ironically, the more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. Our desire for more, combined with our increased physical interaction with the “common folk,” starts to create a disconnection or blindness to reality."},
{"no": 177, "school": "", "pref": "31", "type": "", "diff": "", "stem": "글에 따르면 우리가 행복한지 슬픈지는 무엇만으로 정해지지 않는가?", "p": "31-177", "choices": ["타고난 성격 하나만으로", "순간순간의 경험 하나만으로", "주변 사람들의 평가만으로", "지난 기억의 양만으로"], "ans": 2, "exp": "삶의 매 순간 경험 하나하나만으로 정해지는 것은 아니라고 첫 문장이 말해요.\n📖 Whether we feel happy or sad, content or discontent, <b>is not determined merely by each individual successive moment of life experience</b>\n   우리가 행복한지 슬픈지는 삶의 매 순간 경험만으로 정해지는 것은 아니다.", "b": 1, "bb": "Whether we feel happy or sad, content or discontent, is not determined merely by each individual successive moment of life experience ― a good thing happens and I’m happy, a bad thing happens and I’m sad. While our experiences affect our mood, we are not blown in a completely new direction by each gust of wind. As humans, we adjust ― to new information and events both good and bad ― and return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline ― back up after bad news and back down after good. The euphoria of first love fades, and so does the despair of a break-up. This tendency is best seen with little kids and their toy joy: When they get what they’ve longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids ― like adults ― (…)."},

{"no": 193, "school": "", "pref": "32", "type": "", "diff": "", "stem": "아데노신에 대해 글이 말하는 것은?", "p": "32-193", "choices": ["깨어 있는 시간이 길수록 혈액에 쌓인다", "잠을 자는 동안 혈액에 쌓여 간다", "운동을 할 때만 몸속에서 만들어진다", "음식을 통해서만 몸에 들어오는 물질이다"], "ans": 1, "exp": "아데노신은 깨어 있는 시간이 늘어날수록 혈액에 쌓인다고 했어요. 쌓이는 때는 잠잘 때가 아니라 깨어 있을 때입니다.\n📖 This natural chemical builds up in your blood as <b>time awake increases</b>.\n   이 천연 화학물질은 깨어 있는 시간이 늘어날수록 혈액에 쌓인다.", "b": 1, "bb": "Although you may put off going to sleep in order to squeeze more activities into your day, eventually your need for sleep becomes overwhelming and you are forced to get some sleep. This daily drive for sleep appears to be due, in part, to a compound known as adenosine. This natural chemical builds up in your blood as time awake increases. While you sleep, your body breaks down the adenosine. Thus, this molecule may be what your body uses to keep track of lost sleep and to trigger sleep when needed. An accumulation of adenosine and other factors might explain why, after several nights of less than optimal amounts of sleep, you build up a sleep debt that you must make up by sleeping longer than normal. Because of such built-in molecular feedback, you can’t become accustomed to getting less sleep than your body needs. Eventually, a lack of sleep (…)."},

{"no": 225, "school": "", "pref": "34", "type": "", "diff": "", "stem": "하인버그가 재생에너지 기반 시설을 짓는 일을 어떻게 보는가?", "p": "34-225", "choices": ["효과가 전혀 입증되지 않은 실험으로 본다", "인류 역사상 가장 큰 변화 사업 중 하나로 본다", "이미 거의 끝난 쉬운 공사 가운데 하나로 본다", "비용이 거의 들지 않는 간단한 사업으로 본다"], "ans": 2, "exp": "지구 온난화를 막으려 재생에너지 기반 시설을 짓는 일은 인류 역사상 가장 큰 변화 사업 중 하나라고 했어요.\n📖 we are actually involved in <b>one of the greatest change projects in human history</b>\n   우리는 사실 인류 역사상 가장 큰 변화 사업 가운데 하나에 참여하고 있다.", "b": 1, "bb": "Richard Heinberg, an American journalist, argues that in building the renewable energy infrastructure to stop global warming, we are actually involved in one of the greatest change projects in human history. In addition to solar panels and wind turbines, we have to build an alternative transport infrastructure, farming procedures and industrial processes. This transformation cannot happen without fossil fuels. For instance, production of concrete structures and steel elements require amounts of energy that is only possible to produce with fossil energy. Production of solar panels requires scarce and expensive minerals which must be excavated, again requiring the use of fossil fuels. Thus, the harder we push towards a renewable energy system, the faster (…). This is not only expensive, but also an undermining factor for our efforts to cut global emissions. Heinberg remarks that the cost of building this new energy infrastructure is seldom counted in transition proposals, which tend to focus just on energy supply requirements."},

{"no": 241, "school": "", "pref": "35", "type": "", "diff": "", "stem": "고대 그리스 이래로 있었다고 글이 말하는 것은?", "p": "35-241", "choices": ["로봇과 인공 존재에 대한 신화들", "기계를 금지하는 법률 조항들", "지능 검사를 다룬 수학 논문들", "자동 공장을 세웠다는 기록들"], "ans": 1, "exp": "고대 그리스부터 로봇, 자동 장치, 인공 존재에 대한 신화가 있었다고 했어요.\n📖 There have been <b>myths about robots, automatons, and artificial beings</b> since ancient Greece\n   고대 그리스 이래로 로봇과 자동 장치, 인공 존재에 대한 신화들이 있었다.", "b": 1, "bb": "Humans for centuries have dreamed of machines that could become intelligent and make human-like decisions. There have been myths about robots, automatons, and artificial beings since ancient Greece (e.g., the myth of Pandora, who released ills upon the world). Likewise, literature throughout history has dreamed of creating human-like creatures and thinking machines (e.g., Mary Shelley’s Frankenstein). In 1950, British mathematician Alan Turing asked whether machines could think and reason like humans and then developed the Turing test to measure a machine’s intelligence and whether the machines can think autonomously. A few years later, MIT professor John McCarthy coined “artificial intelligence,” replacing the previously used expression “automata studies.” But artificial intelligence didn’t stop there; its first major appearance was in a movie where feeling artificial intelligence replaced human characters with robots. Since then, artificial intelligence has become the study and practice of “making intelligent machines” that are programmed to think like humans ― endowed by their creators with reasoning and learning."},

{"no": 273, "school": "", "pref": "37", "type": "", "diff": "", "stem": "평평한 길에서 페달 밟기를 멈추면 자전거는 어떻게 되는가?", "p": "37-273", "choices": ["곧바로 멈춰 선다", "서서히 속도가 줄어든다", "속도가 그대로 유지된다", "점점 더 빨라진다"], "ans": 2, "exp": "페달을 멈추면 곧바로 서는 게 아니라 '서서히' 느려진다고 했습니다.\n📖 <b>You gradually slow down.</b>\n   당신은 서서히 속도가 줄어든다.", "b": 1, "bb": "Imagine you are pedalling your bicycle on a level road. You stop pedalling: no force is now acting to move you forward. What happens? (B) You gradually slow down. How could you slow down more suddenly, in a shorter distance? By putting the brakes on. Because the brakes change your movement, making you slow down more suddenly, they must be exerting a force on the bicycle and you, as they grip and rub on the wheel-rims.(C) This is the force called friction, which tends to slow down moving things by acting in the direction opposite to movement, that is backwards. Even without the brakes on, there are other friction forces acting on you and your bicycle, which also slow you down. (A) One of these is friction in the wheels rubbing on the axles. Another is air resistance, which you can feel, pushing you backwards as you and the bicycle move forwards. When you apply these ideas to something around you, like a cart, you can see what could be generating friction: mainly the axles rubbing on the body as they rotate."},

{"no": 289, "school": "", "pref": "38", "type": "", "diff": "", "stem": "비선형 편집을 무엇과 같다고 비유했는가?", "p": "38-289", "choices": ["타이프라이터로 글쓰기", "필름을 가위로 자르기", "사진을 앨범에 붙이기", "워드프로세서 프로그램 사용"], "ans": 4, "exp": "첫 문장에서 비선형 편집은 워드프로세서 프로그램을 쓰는 것과 같다고 했습니다.\n📖 Nonlinear editing, on the other hand, is <b>like using a word processing program</b>.\n   반면에 비선형 편집은 워드프로세서 프로그램을 쓰는 것과 같다.", "b": 1, "bb": "Nonlinear editing, on the other hand, is like using a word processing program. All editing systems are now nonlinear computer-based systems that allow random access to any video shot or scene without having to fast forward or fast reverse to find it. Nonlinear systems can create a range of special effects, such as slow motion, wipes and dissolves. Another highlight of a digital nonlinear system is its random access process that makes it easy for an editor to find desired shots or scenes without having to spend time fast forwarding or rewinding videotape. With nonlinear editing, shots or scenes can be easily added or removed anywhere in the program, and the computer adjusts the program length automatically. Linear editing was like composing a paper on a typewriter. If a mistake was made or new information needed to be added the whole piece had to be retyped. If a mistake is made, it is easily deleted and fixed with a few keystrokes, and new information can be added easily."},

{"no": 305, "school": "", "pref": "39", "type": "", "diff": "", "stem": "늘 해를 막으려 하지만 실제로는 막지 못하는 사람을 글은 어떻게 보는가?", "p": "39-305", "choices": ["도덕적으로 선하다고 보지 않는다", "누구보다 선한 사람으로 본다", "의도만으로 충분히 선하다고 본다", "판단할 수 없는 경우로 둔다"], "ans": 1, "exp": "첫 문장에서 그런 사람은 보통 도덕적으로 선하다고 여겨지지 않는다고 했습니다.\n📖 A person who always tries to prevent harm but never does, is <b>not generally thought of as morally good</b>.\n   늘 해를 막으려 하지만 한 번도 막지 못하는 사람은 보통 도덕적으로 선하다고 여겨지지 않는다.", "b": 1, "bb": "A person who always tries to prevent harm but never does, is not generally thought of as morally good. A morally good person is one who does morally bad actions significantly less often than most and does morally good ones significantly more often than most. In judging a person not only her actions but also her intentions and motives are relevant. A morally good person must intend to do morally good actions and intend to avoid morally bad ones. A person who unintentionally prevents harm to others and does not harm them simply because things do not turn out as she intends is not morally good. Although this kind of situation generally occurs only in slapstick movies, it is worth mentioning to avoid the false impression that it is the actual consequences of a person’s actions that count toward her being judged morally good or bad. But actual consequences are important. Of such a person, it may be said that she means well; but, contrary to Kant, some results are necessary before she is regarded as morally good."},

{"no": 321, "school": "", "pref": "40", "type": "", "diff": "", "stem": "글에 따르면 우리가 머릿속으로 망치를 떠올릴 때 보통 어떤 모습으로 보는가?", "p": "40-321", "choices": ["바로 쓸 수 있는 각도의 옆모습으로", "손잡이가 가려진 위쪽 방향의 모습으로", "색과 모양만 남은 평면적인 모습으로", "실제 크기보다 훨씬 크게 과장해서"], "ans": 1, "exp": "글은 망치를 떠올릴 때 옆모습이나 '바로 쓸 수 있는' 각도로 본다고 했어요. 위에서 본 모습은 잘 떠올리지 않는다고 했지요.\n📖 when visualizing a hammer in our mind’s eye, we tend to <b>“see” it in profile or at some other “ready for use” angle</b>\n   망치를 머릿속으로 떠올릴 때 우리는 옆모습이나 '바로 쓸 수 있는' 다른 각도로 보는 경향이 있다.", "b": 1, "bb": "Vision is influenced by our preconceptions about reality. In viewing a scene, we establish unconscious hierarchies that reflect our functional relationship to objects and our momentary priorities. For example, when visualizing a hammer in our mind’s eye, we tend to “see” it in profile or at some other “ready for use” angle. One would probably not visualize a hammer as seen from the top so that the handle is hidden by the hammer’s head. The functional relationship we have with objects creates visual expectations that interfere with our ability to see “like a camera.” The camera, like the human eye, sees only shapes and colors. It documents the world impartially through a lens that is similar to the eye. When we look at them carefully, photographs are often surprising because they don’t interpret confusing details but simply serve them up to us with a mechanical indifference. And because of their flatness, photographs often contain areas that appear as unrecognizable colors and shapes. Our visual perception is shaped by an established hierarchy based on functional relationships, which (A) our ability to see objects as they truly are, unlike the (B) perspective of a camera."},

{"no": 337, "school": "", "pref": "41-42", "type": "", "diff": "", "stem": "글에 따르면 “May I help you?”가 최악의 네 단어인 이유는?", "p": "41-42-337", "choices": ["고객이 말하게 하지 않고 방어적으로 만들어서", "고객에게 선물 용도를 먼저 묻게 되어서", "직원이 너무 바빠 보이게 만들어서", "가격을 먼저 떠올리게 만들어서"], "ans": 1, "exp": "이 말은 고객이 말을 하도록 이끌지 못하고 오히려 고객을 방어적으로 만든다고 했어요.\n📖 they <b>don’t encourage the customer to talk and put them on the defensive</b>\n   그 말은 고객이 말하도록 이끌지 못하고 고객을 방어적으로 만든다.", "b": 1, "bb": "“May I help you?” are the worst four words that a retail salesperson can utter because they don’t encourage the customer to talk and put them on the defensive. The four words usually draw out a negative response that stops cold a sales transaction. Examples of better questions to use when approaching customers are “Is there anything in particular that you are looking for?” and “Are you shopping for a gift?” If a fashion salesperson approached you with “May I help you?” chances are you would feel the salesperson didn’t care. This line is a rote approach that is so overused by untrained and uninterested salespeople. In fact, most of us shudder in horror on hearing these words. The very meaning of the question “May I help you?” rejects that the customer is in trouble of some sort and needs rescuing. This almost always puts the customer on the defense. “No, thank you” is usually the immediate response, even if the customer is actually in need of assistance. The subconscious thought by the customer is often “I’m smart enough to figure out what I want, and I don’t need your help!” If customers feel pressured or cornered, then salespeople won’t make any sales. The approach has to promote a comfortable environment that makes customers feel there is no rush. Furthermore, if customers just want to look around, they should feel that it is all right to do so. In situations where customers really do want to look around on their own, salespeople should give customers their business cards and keep themselves accessible in case customers have questions or concerns."},

eir business cards and keep themselves accessible in case customers have questions or concerns."},
{"no": 353, "school": "", "pref": "43-45", "type": "", "diff": "", "stem": "데이브가 음료 자동판매기 앞에서 지갑에서 꺼내게 된 것은?", "p": "43-45-353", "choices": ["구겨진 1달러 지폐", "주머니 속 동전 몇 개", "선배가 준 과일 주스", "교실에서 빌린 카드"], "ans": 1, "exp": "동전을 찾아 지갑을 뒤적였지만 나온 것은 구겨진 1달러 지폐였어요.\n📖 He came up with <b>a wrinkled dollar bill</b>, and nervously glanced back at his table\n   그는 구겨진 1달러 지폐를 꺼내 들고는 자기 자리를 불안하게 돌아보았다.", "b": 1, "bb": "While the cafeteria was full of high school students on that afternoon, Dave was thirsty. We sat near yet away from him, fixing our hair and worrying about the test next period we hadn’t studied for. He was far away from our world, yet forced to be a part of it. (D) He stood at the drink machine with purpose, fumbling through his fake leather wallet for some change. He came up with a wrinkled dollar bill, and nervously glanced back at his table where other students in his class were sitting. Dave tried to make the machine accept his money. After he failed a few times, some students began to laugh at him. He started shaking, and tears began to form in his eyes. I saw him turn to sit down, looking like he had given up. (C) But for some reason, he decided against it. He wasn’t leaving until he got a drink. With a determined expression, he kept aimlessly pushing the dollar bill into the machine. Just then a popular senior boy stood up from his seat, and walked over to the boy. He calmly explained how the machine often had trouble accepting dollar bills. After that, he pulled some coins from his pocket and put them into the machine. Dave gave him his dollar and chose a flavor of fruit juice. Then the two walked off in different directions. (B) Although it was clear that they were from very different worlds, for one moment, they’d shared a real understanding. As I walked away from my lunch table that day, I looked at Dave. I thought he and the dollar were very much alike. They both weren’t accepted where the world said they were supposed to be. But just as the dollar had found a place in a warm-hearted senior’s pocket, I was sure he would eventually find his, too."},

(function dropUnmarkedVocab(){
  function bodyOf(q){
    if (q.bb) return q.bb;
    if (q.body) return q.body;
    try { if (typeof PASS !== 'undefined' && PASS && PASS[q.p]) return PASS[q.p]; } catch(e){}
    return '';
  }
  var dropped = 0, i, q, t, first;
  for (i = QUESTIONS.length - 1; i >= 0; i--) {
    q = QUESTIONS[i];
    t = String(q.type || '');
    if (t.indexOf('\uc5b4\ud718') < 0 && t.indexOf('\uc5b4\ubc95') < 0) continue;   // 어휘·어법만
    if (t.indexOf('\uad04\ud638') >= 0) continue;                                     // 괄호(네모)형은 제외
    first = String((q.choices && q.choices[0]) || '');
    if (!/^[\u24d0-\u24d4]/.test(first)) continue;        // ⓐ~ⓔ 보기가 아니면 그대로
    if (bodyOf(q).indexOf('\u24d0') >= 0) continue;        // 지문에 ⓐ가 있으면 정상
    QUESTIONS.splice(i, 1);
    dropped++;
  }
  if (dropped) console.log('밑줄 표시가 없어 제외한 문항: ' + dropped + '개');
})();

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`

      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });

  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function markUPhrase(h, q){
  // 보기(ⓐ~ⓖ)에 적힌 문구와 같은 부분을 지문에서 찾아 문구 전체에 밑줄
  if (!q || !q.choices) return h;
  for (var i = 0; i < q.choices.length; i++) {
    var m = String(q.choices[i]).match(/^([\u24d0-\u24d6])\s*(.+)$/);
    if (!m) continue;
    var sym = m[1], ph = m[2].trim();
    if (!ph || ph.indexOf(':') >= 0 || !/[A-Za-z]/.test(ph)) continue;
    if (ph.split(/\s+/).length > 6) continue;
    var esc = escHTML(ph).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    try {
      var re = new RegExp(sym + '\\s?' + esc);
      if (re.test(h)) h = h.replace(re, '<b class="mk">' + sym + '<u>' + escHTML(ph) + '</u></b>');
    } catch (e) {}
  }
  return h;
}
function markU(h){return h.replace(/([ⓐⓑⓒⓓⓔⓕⓖ])\s?([A-Za-z][A-Za-z'\-]*)/g,'<b class="mk">$1<u>$2</u></b>').replace(/(\((?:A|B|C|D)\)\s?\[[^\]]+\])/g,'<b class="mk">$1</b>').replace(/(_{6,})/g,'<b class="mk">$1</b>').replace(/(\( [①②③④⑤] \))/g,'<b class="mk">$1</b>');}
function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 지문</span>
        ${q.diff ? `<span class="qtype" style="background:${q.diff==='쉬움'?'#e8f5e9':'#fff3e0'};color:${q.diff==='쉬움'?'#2e7d32':'#e65100'}">${q.diff}</span>` : ''}
        ${schoolBadge}
      </div>
      <div class="passage-box">${markU(markUPhrase(escHTML(q.body), q))}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.innerHTML='💡 '+escHTML(q.exp).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/\n/g,'<br>');fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

// ── RESULT ─────────────────────────────────────────
let wrongQs = [];


// === 진행 중 세션 저장 (같은 날 재진입 시 이어서 풀기) ===
const _SESSION_KEY = 'bn_session_' + QUIZ_ID + '_v2';
function _saveSession(){
  if(typeof qs==='undefined' || !qs.length || idx>=qs.length) return;
  try{
    const state = {
      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 25년 9월 지문 깊이 풀기 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고125년9월_지문깊이풀기',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>
<script>
/* 홈 화면에 추가했을 때 주소창 없이 앱처럼 열리게 한다 (안드로이드) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>

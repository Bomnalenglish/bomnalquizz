<script>
// ── DATA ──────────────────────────────────────────
const PASS = {"20-a": "Experts on writing say, \"Get rid of as many words as possible.\" Each word must do something important. If it doesn't, get rid of it. Well, this doesn't work for speaking. It takes more words to introduce, express, and adequately elaborate an idea in speech than it takes in writing. Why is this so? While the reader can reread, the listener cannot rehear. Speakers do not come equipped with a replay button. Because listeners are easily distracted, they will miss many pieces of what a speaker says. If they miss the crucial sentence, they may never catch up. This makes it necessary for speakers to talk longer about their points, using more words on them than would be used to express the same idea in writing.", "21-a": "Is the customer always right? When customers return a broken product to a famous company, which makes kitchen and bathroom fixtures, the company nearly always offers a replacement to maintain good customer relations. Still, \"there are times you've got to say 'no,'\" explains the warranty expert of the company, such as when a product is undamaged or has been abused. Entrepreneur Lauren Thorp, who owns an e-commerce company, says, \"While the customer is 'always' right, sometimes you just have to fire a customer.\" When Thorp has tried everything to resolve a complaint and realizes that the customer will be dissatisfied no matter what, she returns her attention to the rest of her customers, who she says are \"the reason for my success.\"", "22-a": "A recent study from Carnegie Mellon University in Pittsburgh, called \"When Too Much of a Good Thing May Be Bad,\" indicates that classrooms with too much decoration are a source of distraction for young children and directly affect their cognitive performance. Being visually overstimulated, the children have a great deal of difficulty concentrating and end up with worse academic results. On the other hand, if there is not much decoration on the classroom walls, the children are less distracted, spend more time on their activities, and learn more. So it's our job, in order to support their attention, to find the right balance between excessive decoration and the complete absence of it.", "23-a": "For creatures like us, evolution smiled upon those with a strong need to belong. Survival and reproduction are the criteria of success by natural selection, and forming relationships with other people can be beneficial for both survival and reproduction. Groups can share resources, care for sick members, scare off predators, fight together against enemies, divide tasks so as to improve efficiency, and contribute to survival in many other ways. In particular, if an individual and a group want the same resource, the group will generally prevail, so competition for resources would especially favor a need to belong. Belongingness will likewise promote reproduction, such as by bringing potential mates into contact with each other.", "24-a": "Many people make a mistake of only operating along the safe zones, and in the process they miss the opportunity to achieve greater things. They do so because of a fear of the unknown and a fear of treading the unknown paths of life. Those that are brave enough to take those roads less travelled are able to get great returns and derive major satisfaction out of their courageous moves. Being overcautious will mean that you will miss attaining the greatest levels of your potential. You must learn to take those chances that many people around you will not take, because your success will flow from those bold decisions that you will take along the way.", "29-a": "The human brain, it turns out, has shrunk in mass by about 10 percent since it peaked in size 15,000-30,000 years ago. One possible reason is that many thousands of years ago humans lived in a world of dangerous predators where they had to have their wits about them at all times to avoid being killed. Today, we have effectively domesticated ourselves and many of the tasks of survival have been outsourced to the wider society. We are smaller than our ancestors too, and it is a characteristic of domestic animals that they are generally smaller than their wild cousins. None of this may mean we are dumber – brain size is not necessarily an indicator of human intelligence – but it may mean that our brains today are wired up differently, and perhaps more efficiently, than those of our ancestors.", "30-a": "It is widely believed that certain herbs somehow magically improve the work of certain organs, and \"cure\" specific diseases as a result. Such statements are unscientific and groundless. Sometimes herbs appear to work, since they tend to increase your blood circulation in an aggressive attempt by your body to eliminate them from your system. That can create a temporary feeling of a high, which makes it seem as if your health condition has improved. Also, herbs can have a placebo effect, just like any other method, thus helping you feel better. Whatever the case, it is your body that has the intelligence to regain health, and not the herbs.", "31-a": "We worry that the robots are taking our jobs, but just as common a problem is that the robots are taking our judgement. In the large warehouses so common behind the scenes of today's economy, human 'pickers' hurry around grabbing products off shelves and moving them to where they can be packed and dispatched. In their ears are headpieces: the voice of 'Jennifer', a piece of software, tells them where to go and what to do, controlling the smallest details of their movements. Jennifer breaks down instructions into tiny chunks, to minimise error and maximise productivity. Working in such conditions reduces people to machines made of flesh. Rather than asking us to think or adapt, the Jennifer unit takes over the thought process and treats workers as an inexpensive source of some visual processing and a pair of opposable thumbs.", "32-a": "The prevailing view among developmental scientists is that people are active contributors to their own development. People are influenced by the physical and social contexts in which they live, but they also play a role in influencing their development by interacting with, and changing, those contexts. Even infants influence the world around them and construct their own development through their interactions. The infant brings adults into close contact, making one-on-one interactions and creating opportunities for learning. By engaging the world around them, thinking, being curious, and interacting with people, objects, and the world around them, individuals of all ages are \"manufacturers of their own development.\"", "33-a": "The demand for freshness can have hidden environmental costs. While freshness is now being used as a term in food marketing as part of a return to nature, the demand for year-round supplies of fresh produce has led to the widespread use of hot houses in cold climates and increasing reliance on total quality control. The demand for freshness has also contributed to concerns about food wastage. Campaigners have exposed the scandal of over-production and waste. Tristram Stuart argues that over-ordering is standard practice to avoid empty shelf space, leading to high volumes of waste when supply regularly exceeds demand.", "34-a": "In the studies of Colin Cherry at the Massachusetts Institute for Technology back in the 1950s, his participants listened to voices in one ear at a time and then through both ears in an effort to determine whether we can listen to two people talk at the same time. One ear always contained a message that the listener had to repeat back (called \"shadowing\") while the other ear included people speaking. Cherry found it was impossible for his participants to know whether the message in the other ear was spoken by a man or woman, in English or another language, or was even comprised of real words at all. In other words, people could not process two pieces of information at the same time.", "35-a": "The fast-paced evolution of Information and Communication Technologies (ICTs) has radically transformed the dynamics and business models of the tourism and hospitality industry. This leads to new levels/forms of competitiveness among service providers and transforms the customer experience through new services. Creating unique experiences and providing convenient services to customers leads to satisfaction and, eventually, customer loyalty to the service provider or brand. In particular, the most recent technological boost received by the tourism sector is represented by mobile applications. Indeed, empowering tourists with mobile access to services such as hotel reservations, airline ticketing, and recommendations for local attractions generates strong interest and considerable profits.", "36-a": "With nearly a billion hungry people in the world, there is obviously no single cause. However, far and away the biggest cause is poverty. Seventy-nine percent of the world's hungry live in nations that are net exporters of food. The reason people are hungry in those countries is that the products produced there can be sold on the world market for more than the local citizens can afford to pay for them. In the modern age you do not starve because you have no food, you starve because you have no money. So the problem really is that food is, in the grand scheme of things, too expensive and many people are too poor to buy it.", "37-a": "Most people have a perfect time of day when they feel they are at their best, whether in the morning, evening, or afternoon. Some of us are night owls, some early birds, and others in between may feel most active during the afternoon hours. If you are able to organize your day and divide your work, make it a point to deal with tasks that demand attention at your best time of the day. However, if the task you face demands creativity and novel ideas, it's best to tackle it at your \"worst\" time of day! When your mind and body are less alert than at your \"peak\" hours, the muse of creativity awakens and is allowed to roam more freely. In other words, when your mental machinery is loose rather than standing at attention, the creativity flows.", "38-a": "Television is the number one leisure activity in the United States and Europe, consuming more than half of our free time. We generally think of television as a way to relax, tune out, and escape from our troubles for a bit each day. While this is true, there is increasing evidence that we are more motivated to tune in to our favorite shows and characters when we are feeling lonely or have a greater need for social connection. Television watching does satisfy these social needs to some extent, at least in the short run. Unfortunately, it is also likely to crowd out other activities that produce more sustainable social contributions to our social well-being.", "39-a": "We often associate the concept of temperature with how hot or cold an object feels when we touch it. In this way, our senses provide us with a qualitative indication of temperature. Our senses, however, are unreliable and often mislead us. For example, if you stand in bare feet with one foot on carpet and the other on a tile floor, the tile feels colder than the carpet even though both are at the same temperature. The two objects feel different because tile transfers energy by heat at a higher rate than carpet does. Your skin \"measures\" the rate of energy transfer by heat rather than the actual temperature.", "40-a": "My colleagues and I ran an experiment testing two different messages meant to convince thousands of resistant alumni to make a donation. One message emphasized the opportunity to do good: donating would benefit students, faculty, and staff. The other emphasized the opportunity to feel good: donors would enjoy the warm glow of giving. The two messages were equally effective. Then we combined them, because two reasons are better than one. Except they weren't. When we put the two reasons together, the giving rate dropped below 3 percent. The audience was already skeptical. When we gave them different kinds of reasons to donate, we triggered their awareness that someone was trying to persuade them – and they shielded themselves against it.", "42-a": "In a society that rejects the consumption of insects there are some individuals who overcome this rejection, but most will continue with this attitude. However, there are examples where this reversal of attitudes about certain foods has occurred to an entire society. Several examples in the past 120 years from European-American society are: considering lobster a luxury food instead of a food for servants and prisoners; considering sushi a safe and delicious food; and considering pizza not just a food for the rural poor of Sicily. In Latin American countries, where insects are already consumed, a portion of the population hates their consumption and associates it with poverty.", "18-a": "Dear Parents,\nClass parties will be held on the afternoon of Friday, December 16th, 2022. Children may bring in sweets, crisps, biscuits, cakes, and drinks. We are requesting that children do not bring in home-cooked or prepared food. All food should arrive in a sealed packet with the ingredients clearly listed. Fruit and vegetables are welcomed if they are pre-packed in a sealed packet from the shop. Please DO NOT send any food into school containing nuts as we have many children with severe nut allergies. Please check the ingredients of all food your children bring carefully.\nYours sincerely, Lisa Brown, Headteacher", "19-a": "It was two hours before the submission deadline and I still hadn't finished my news article. I sat at the desk, but suddenly, the typewriter didn't work. No matter how hard I tapped the keys, the levers wouldn't move to strike the paper.\n(A) I started to realize that I would not be able to finish the article on time. Desperately, I rested the typewriter on my lap and started hitting each key with as much force as I could manage. Nothing happened.\n(B) The keys moved smoothly again. I breathed deeply and smiled. Now I knew that I could finish my article on time.\n(C) Thinking something might have happened inside of it, I opened the cover, lifted up the keys, and found the problem – a paper clip. The keys had no room to move. After picking it out, I pressed and pulled some parts.", "23-b": "For creatures like us, evolution smiled upon those with a strong need to belong. Survival and reproduction are the criteria of success by natural selection, and forming relationships with other people can be useful for both survival and reproduction. Groups can share resources, care for sick members, scare off predators, fight together against enemies, divide tasks so as to improve efficiency, and contribute to survival in many other ways. In particular, if an individual and a group want the same resource, the group will generally prevail, so competition for resources would especially favor a need to belong. Belongingness will likewise promote reproduction, such as by bringing potential mates into contact with each other, and in particular by keeping parents together to care for their children.", "25-a": "The graph shows the share of the urban population by continent in 1950 and in 2020. For each continent, the share of the urban population in 2020 was larger than that in 1950. Africa saw a considerable rise of urbanization from 1950 to 2020, but it remained largely rural in 2020. The level of urbanization in Asia was the second lowest in both 1950 and 2020. In 1950, the share of the urban population in Latin America and the Caribbean was lower than that in Europe, whereas the reverse was true in 2020. Among the five continents, Northern America was ranked in the top position for the share of the urban population in both 1950 and 2020.", "28-a": "Kenner High School's Water Challenge\nSubmission: How: by email to admin@khswater.edu / When: September 7-25, 2022\nDetails: Participants must enter in teams of three and can only join one team. Submission is limited to one proposal per team. Participants must use the proposal form provided on the website.\nPrizes: 1st: $50 / 2nd: $30 / 3rd: $10 gift certificate", "32-b": "The prevailing view among developmental scientists is that people are active contributors to their own development. People are influenced by the physical and social contexts in which they live, but they also play a role in influencing their development by interacting with, and changing, those contexts. Even infants influence the world around them and construct their own development through their interactions. Consider an infant who smiles at each adult he sees; he influences his world because adults are likely to smile, use \"baby talk,\" and play with him in response. The infant brings adults into close contact, making one-on-one interactions and creating opportunities for learning. By engaging the world around them, thinking, being curious, and interacting with people, objects, and the world around them, individuals of all ages are \"manufacturers of their own development.\"", "33-b": "The demand for freshness can have hidden environmental costs. While freshness is now being used as a term in food marketing, the demand for year-round supplies of fresh produce has led to the widespread use of hot houses in cold climates and increasing reliance on total quality control. The demand for freshness has also contributed to concerns about food wastage. Campaigners have exposed the scandal of over-production and waste. Tristram Stuart argues that over-ordering is standard practice to avoid empty shelf space, leading to high volumes of waste when supply regularly exceeds demand.", "38-b": "Television is the number one leisure activity in the United States and Europe, consuming more than half of our free time. We generally think of television as a way to relax, tune out, and escape from our troubles for a bit each day. While this is true, there is increasing evidence that we are more motivated to tune in to our favorite shows and characters when we are feeling lonely or have a greater need for social connection. Television watching does satisfy these social needs to some extent, at least in the short run. Unfortunately, it is also likely to \"crowd out\" other activities that produce more sustainable social contributions to our social well-being.", "42-b": "In a society that rejects the consumption of insects there are some individuals who overcome this rejection, but most will continue with this attitude. It may be very difficult to convince an entire society that insects are totally suitable for consumption. In Latin American countries, where insects are already consumed, a portion of the population hates their consumption and associates it with poverty. There are also examples of people who have had the habit of consuming them and abandoned that habit due to shame, and because they do not want to be categorized as poor or uncivilized. According to Esther Katz, if the consumption of insects as a food luxury is to be promoted, there would be more chances that some individuals who do not present this habit overcome ideas under which they were educated.", "45-a": "A boy had a place at the best school in town. In the morning, his granddad took him to the school. When he went onto the playground with his grandson, the children surrounded them. \"What a funny old man.\" one boy smirked. Suddenly, the bell rang and the children ran off. The old man took his grandson firmly by the hand, and led him out of the school gate. \"Brilliant, I don't have to go to school!\" the boy exclaimed. \"You do, but not this one,\" his granddad replied. \"I'll find you a school myself.\" The old man went onto playgrounds of various schools. Finally, at a tiny school, children asked if he was all right and offered him water and a bench. The old man said: \"Finally, I've found my grandson the best school in town.\"", "18-b": "Dear Parents/Guardians,\nClass parties will be held on the afternoon December 16th, 2022. Children may bring in sweets, crisps, biscuits, cakes, and drinks. We are ⓐrequesting that children do not bring in home-cooked or prepared food. All food should arrive in a sealed packet with the ingredients clearly listed. Fruit and vegetables are ⓑwelcomed if they are ⓒpre-packing in a sealed packet from the shop. Please DO NOT send any food into school ⓓcontaining nuts. Thank you for your ⓔcontinued support.\nYours sincerely, Lisa Brown, Headteacher", "19-b": "It was two hours before the submission deadline and I still hadn't finished my news article. I sat at the desk, but suddenly, the typewriter didn't work.\n(A) Nothing happened.\n(B) No matter how hard I tapped the keys, the levers wouldn't move to strike the paper. I started to realize that I would not be able to finish the article on time.\n(C) Thinking something might have happened inside of it, I opened the cover, lifted up the keys, and found the problem – a paper clip.\n(D) Desperately, I rested the typewriter on my lap and started hitting each key with as much force as I could manage.\n(E) I breathed deeply and smiled. Now I knew that I could finish my article on time.\n(F) After picking it out, I pressed and pulled some parts. The keys moved smoothly again.", "20-b": "Experts on writing say, \"Get rid of as many words as possible.\" Each word must do something important. If it doesn't, get rid of it. Well, this doesn't work for speaking. It takes more words to introduce, express, and adequately elaborate an idea in speech than it takes in writing. Why is this so? While the reader can reread, the listener cannot rehear. Speakers do not come equipped with a replay button. Because listeners are easily distracted, they will miss many pieces of what a speaker says. If they miss the crucial sentence, they may never catch up. This makes it necessary for speakers to talk longer about their points.", "21-b": "Is the customer always right? When customers return a broken product to a famous company, the company nearly always offers a replacement to maintain good customer relations. Still, \"there are times you've got to say 'no,'\" explains the warranty expert. Entrepreneur Lauren Thorp says, \"While the customer is 'always' right, sometimes you just have to fire a customer.\" When Thorp has tried everything to resolve a complaint and realizes the customer will be dissatisfied no matter what, she returns her attention to the rest of her customers, who she says are \"the reason for my success.\"", "23-c": "For creatures like us, evolution smiled upon those with a strong need to belong. Survival and reproduction are the criteria of success by natural selection, and forming relationships with other people can be useful for both survival and reproduction. Groups can share resources, care for sick members, scare off predators, fight together against enemies, divide tasks so as to improve efficiency, and contribute to survival in many other ways. In particular, if an individual and a group want the same resource, the group will generally prevail. Belongingness will likewise promote reproduction, such as by bringing potential mates into contact with each other.", "25-b": "The graph shows the share of the urban population by continent in 1950 and in 2020. For each continent, the share of the urban population in 2020 was larger than that in 1950. Africa's urbanization increased considerably from 1950 to 2020. The level of urbanization in Asia was the second lowest in both 1950 and 2020. In 1950, the share in Europe was larger than in Latin America and the Caribbean, whereas the reverse was true in 2020. Northern America was ranked in the first (top) position in both 1950 and 2020.", "32-c": "The prevailing view among developmental scientists is that people are active contributors to their own development. People are influenced by the physical and social contexts in which they live, but they also play a role in influencing their development by interacting with, and changing, those contexts. Even infants influence the world around them and construct their own development through their interactions. Consider an infant who smiles at each adult he sees; he influences his world because adults are likely to smile, use \"baby talk,\" and play with him in response. The infant brings adults into close contact, making one-on-one interactions and creating opportunities for learning.", "35-b": "The fast-paced evolution of Information and Communication Technologies (ICTs) has radically transformed the dynamics and business models of the tourism and hospitality industry. This leads to new levels/forms of competitiveness among service providers and transforms the customer experience through new services. Creating unique experiences and providing convenient services to customers leads to satisfaction and, eventually, customer loyalty to the service provider or brand. In particular, the most recent technological boost received by the tourism sector is represented by mobile applications. Indeed, empowering tourists with mobile access generates strong interest and considerable profits.", "36-b": "With nearly a billion hungry people in the world, there is obviously no single cause. However, far and away the biggest cause is poverty. Seventy-nine percent of the world's hungry live in nations that are net exporters of food. The reason people are hungry in those countries is that the products produced there can be sold on the world market for more than the local citizens can afford to pay for them. In the modern age you do not starve because you have no food, you starve because you have no money. So the problem really is that food is too expensive and many people are too poor to buy it.", "37-b": "Most people have a perfect time of day when they feel they are at their best, whether in the morning, evening, or afternoon. Some of us are night owls, some early birds, and others in between may feel most active during the afternoon hours. If you are able to organize your day and divide your work, make it a point to deal with tasks that demand attention at your best time of the day. However, if the task you face demands creativity and novel ideas, it's best to tackle it at your \"worst\" time of day! When your mind and body are less alert than at your \"peak\" hours, the muse of creativity awakens. In other words, when your mental machinery is loose rather than standing at attention, the creativity flows.", "26-a": "Wilbur Smith was a South African novelist specialising in historical fiction. Smith wanted to become a journalist, writing about social conditions in South Africa, but his father was never supportive of his writing and forced him to get a real job. Smith studied further and became a tax accountant, but he finally turned back to his love of writing. He wrote his first novel, The Gods First Make Mad, and had received 20 rejections by 1962. In 1964, Smith published another novel, When the Lion Feeds, and it went on to be successful, selling around the world. A famous actor and film producer bought the film rights for When the Lion Feeds, although no movie resulted. By the time of his death in 2021 he had published 49 novels, selling more than 140 million copies worldwide.", "30-b": "It is widely believed that certain herbs somehow magically improve the work of certain organs, and \"cure\" specific diseases as a result. Such statements are unscientific and groundless. Sometimes herbs appear to work, since they tend to increase your blood circulation in an aggressive attempt by your body to eliminate them from your system. That can create a temporary feeling of a high, which makes it seem as if your health condition has improved. Also, herbs can have a placebo effect, just like any other method, thus helping you feel better. Whatever the case, it is your body that has the intelligence to regain health, and not the herbs. How can herbs have the intelligence needed to direct your body into getting healthier? That is impossible. Try to imagine how herbs might come into your body and intelligently fix your problems. If you try to do that, you will see how impossible it seems. Otherwise, it would mean that herbs are more intelligent than the body, which is truly hard to believe.", "31-b": "We worry that the robots are taking our jobs, but just as common a problem is that the robots are taking our judgement. In the large warehouses so common behind the scenes of today's economy, human 'pickers' hurry around grabbing products off shelves and moving them to where they can be packed and dispatched. In their ears are headpieces: the voice of 'Jennifer', a piece of software, tells them where to go and what to do, controlling the smallest details of their movements. Jennifer breaks down instructions into tiny chunks, to minimise error and maximise productivity — for example, rather than picking eighteen copies of a book off a shelf, the human worker would be politely instructed to pick five. Then another five. Then yet another five. Then another three. Working in such conditions reduces people to machines made of flesh. Rather than asking us to think or adapt, the Jennifer unit takes over the thought process and treats workers as an inexpensive source of some visual processing and a pair of opposable thumbs.", "33-c": "The demand for freshness can have hidden environmental costs. While freshness is now being used as a term in food marketing as part of a return to nature, the demand for year-round supplies of fresh produce such as soft fruit and exotic vegetables has led to the widespread use of hot houses in cold climates and increasing reliance on total quality control — management by temperature control, use of pesticides and computer/satellite-based logistics. The demand for freshness has also contributed to concerns about food wastage. Use of 'best before', 'sell by' and 'eat by' labels has legally allowed institutional waste. Campaigners have exposed the scandal of over-production and waste. Tristram Stuart, one of the global band of anti-waste campaigners, argues that, with freshly made sandwiches, over-ordering is standard practice across the retail sector to avoid the appearance of empty shelf space, leading to high volumes of waste when supply regularly exceeds demand.\n*pesticide: 살충제 **logistics: 물류, 유통", "34-b": "In the studies of Colin Cherry at the Massachusetts Institute for Technology back in the 1950s, his participants listened to voices in one ear at a time and then through both ears in an effort to determine whether we can listen to two people talk at the same time. One ear always contained a message that the listener had to repeat back (called \"shadowing\") while the other ear included people speaking. The trick was to see if you could totally focus on the main message and also hear someone talking in your other ear. Cleverly, Cherry found it was impossible for his participants to know whether the message in the other ear was spoken by a man or woman, in English or another language, or was even comprised of real words at all! In other words, people could not process two pieces of information at the same time.", "35-c": "The fast-paced evolution of Information and Communication Technologies (ICTs) has radically transformed the dynamics and business models of the tourism and hospitality industry. This leads to new levels/forms of competitiveness among service providers and transforms the customer experience through new services. Creating unique experiences and providing convenient services to customers leads to satisfaction and, eventually, customer loyalty to the service provider or brand (i.e., hotels). In particular, the most recent technological boost received by the tourism sector is represented by mobile applications. Indeed, empowering tourists with mobile access to services such as hotel reservations, airline ticketing, and recommendations for local attractions generates strong interest and considerable profits.", "36-c": "With nearly a billion hungry people in the world, there is obviously no single cause. However, far and away the biggest cause is poverty. Seventy-nine percent of the world's hungry live in nations that are net exporters of food. How can this be? The reason people are hungry in those countries is that the products produced there can be sold on the world market for more than the local citizens can afford to pay for them. In the modern age you do not starve because you have no food, you starve because you have no money. So the problem really is that food is, in the grand scheme of things, too expensive and many people are too poor to buy it. The answer will be in continuing the trend of lowering the cost of food.", "37-c": "Most people have a perfect time of day when they feel they are at their best, whether in the morning, evening, or afternoon. Some of us are night owls, some early birds, and others in between may feel most active during the afternoon hours. If you are able to organize your day and divide your work, make it a point to deal with tasks that demand attention at your best time of the day. However, if the task you face demands creativity and novel ideas, it's best to tackle it at your \"worst\" time of day! So if you are an early bird, make sure to attack your creative task in the evening, and vice versa for night owls. When your mind and body are less alert than at your \"peak\" hours, the muse of creativity awakens and is allowed to roam more freely. In other words, when your mental machinery is loose rather than standing at attention, the creativity flows.", "38-c": "Television is the number one leisure activity in the United States and Europe, consuming more than half of our free time. We generally think of television as a way to relax, tune out, and escape from our troubles for a bit each day. While this is true, there is increasing evidence that we are more motivated to tune in to our favorite shows and characters when we are feeling lonely or have a greater need for social connection. Television watching does satisfy these social needs to some extent, at least in the short run. Unfortunately, it is also likely to \"crowd out\" other activities that produce more sustainable social contributions to our social well-being. The more television we watch, the less likely we are to volunteer our time or to spend time with people in our social networks. In other words, the more time we make for Friends, the less time we have for friends in real life.", "39-b": "We often associate the concept of temperature with how hot or cold an object feels when we touch it. In this way, our senses provide us with a qualitative indication of temperature. Our senses, however, are unreliable and often mislead us. For example, if you stand in bare feet with one foot on carpet and the other on a tile floor, the tile feels colder than the carpet even though both are at the same temperature. The two objects feel different because tile transfers energy by heat at a higher rate than carpet does. Your skin \"measures\" the rate of energy transfer by heat rather than the actual temperature. What we need is a reliable and reproducible method for measuring the relative hotness or coldness of objects rather than the rate of energy transfer. Scientists have developed a variety of thermometers for making such quantitative measurements.", "40-b": "My colleagues and I ran an experiment testing two different messages meant to convince thousands of resistant alumni to make a donation. One message emphasized the opportunity to do good: donating would benefit students, faculty, and staff. The other emphasized the opportunity to feel good: donors would enjoy the warm glow of giving. The two messages were equally effective: in both cases, 6.5 percent of the unwilling alumni ended up donating. Then we combined them, because two reasons are better than one. Except they weren't. When we put the two reasons together, the giving rate dropped below 3 percent. Each reason alone was more than twice as effective as the two combined. The audience was already skeptical. When we gave them different kinds of reasons to donate, we triggered their awareness that someone was trying to persuade them — and they shielded themselves against it.", "42-c": "In a society that rejects the consumption of insects there are some individuals who overcome this rejection, but most will continue with this attitude. It may be very difficult to convince an entire society that insects are totally suitable for consumption. However, there are examples in which this reversal of attitudes about certain foods has happened to an entire society. Several examples in the past 120 years from European-American society are: considering lobster a luxury food instead of a food for servants and prisoners; considering sushi a safe and delicious food; and considering pizza not just a food for the rural poor of Sicily. In Latin American countries, where insects are already consumed, a portion of the population hates their consumption and associates it with poverty. There are also examples of people who have had the habit of consuming them and abandoned that habit due to shame, and because they do not want to be categorized as poor or uncivilized. According to Esther Katz, an anthropologist, if the consumption of insects as a food luxury is to be promoted, there would be more chances that some individuals who do not present this habit overcome ideas under which they were educated. And this could also help to revalue the consumption of insects by those people who already eat them.", "28-b": "Kenner High School's Water Challenge\nKenner High School's Water Challenge is a new contest to propose measures against water pollution. Please share your ideas for dealing with water pollution!\nRegistration\n- Registration can be only available on our school website.\n- When: September 15th, 2022 to September 30th, 2022.\nSubmission\n- How: E-mail your proposal with your team name and a contact number to admin@khswater.edu.\n- When: October 1st, 2022 to October 20th, 2022\nDetails\n- Participants must enter in teams of four and can only join one team.\n- Submission is limited to one proposal per team.\n- Participants must use the proposal form provided on the website.\n- All participants will get a free T-shirt.\n- Prize-winning works will be on display until the end of this year.\nPrizes\n- 1st: $50 gift certificate\n- 2nd: $30 certificate\n- 3rd: $10 certificate\nPlease visit www.khswater.edu to learn more about the challenge.", "45-b": "A boy had a place at the best school in town. In the morning, his granddad took him to the school. When he went onto the playground with his grandson, the children surrounded them. \"What a funny old man,\" one boy smirked. A girl with brown hair pointed at the pair and jumped up and down. Suddenly, the bell rang and the children ran off to their first lesson.\n\nThe old man took his grandson firmly by the hand, and led him out of the school gate. \"Brilliant, I don't have to go to school!\" the boy exclaimed. \"You do, but not this one,\" his granddad replied. \"I'll find you a school myself.\" Granddad took his grandson back to his own house, asked grandma to look after him, and went off to look for a teacher himself. Every time he spotted a school, the old man went onto the playground, and waited for the children to come out at break time.\n\nIn some schools the children completely ignored the old man and in others, they made fun of him. When this happened, he would turn sadly and go home. Finally, he went onto the tiny playground of a very small school, and leant against the fence, exhausted. The bell rang, and the crowd of children ran out onto the playground.\n\n\"Sir, are you all right? Shall I bring you a glass of water?\" a voice said. \"We've got a bench in the playground — come and sit down,\" another voice said. Soon a young teacher came out onto the playground. The old man greeted him and said: \"Finally, I've found my grandson the best school in town.\" \"You're mistaken, sir. Our school is not the best — it's small and cramped.\" The old man didn't argue with the teacher. Instead, he made arrangements for his grandson to join the school, and then the old man left. That evening, the boy's mom said to him: \"Dad, you can't even read. How do you know you've found the best teacher of all?\" \"Judge a teacher by his pupils,\" the old man replied."};

{"no": 367, "school": "인항고 (인천시)", "pref": "31", "type": "빈칸", "stem": "다음 빈칸 'the Jennifer unit takes over the thought process and treats workers as ___ of some visual processing and a pair of opposable thumbs'에 들어갈 말로 가장 적절한 것은?", "p": "31-b", "choices": ["a wonderful tool", "an object of admiration", "a removal object", "a good partner", "an inexpensive source"], "ans": 5, "exp": "Jennifer가 사고 과정을 대신하고 노동자를 값싼 자원으로 취급한다는 맥락이므로 an inexpensive source가 적절하다.", "b": 5, "bb": "We worry that the robots are taking our jobs, but just as common a problem is that the robots are taking our judgement. In the large warehouses so common behind the scenes of today's economy, human 'pickers' hurry around grabbing products off shelves and moving them to where they can be packed and dispatched. In their ears are headpieces: the voice of 'Jennifer', a piece of software, tells them where to go and what to do, controlling the smallest details of their movements. Jennifer breaks down instructions into tiny chunks, to minimise error and maximise productivity — for example, rather than picking eighteen copies of a book off a shelf, the human worker would be politely instructed to pick five. Then another five. Then yet another five. Then another three. Working in such conditions reduces people to machines made of flesh. Rather than asking us to think or adapt, the Jennifer unit takes over the thought process and treats workers as __________ of some visual processing and a pair of opposable thumbs."},

{"no": 124, "school": "미림여고 (서울시)", "pref": "32", "type": "문장삽입", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?\n[주어진 문장] Consider an infant who smiles at each adult he sees; he influences his world because adults are likely to smile, use \"baby talk,\" and play with him in response.", "p": "32-a", "choices": ["( ① ) 자리", "( ② ) 자리", "( ③ ) 자리", "( ④ ) 자리", "( ⑤ ) 자리"], "ans": 3, "exp": "", "b": 1, "bb": "The prevailing view among developmental scientists is that people are active contributors to their own development. ( ① ) People are influenced by the physical and social contexts in which they live, but they also play a role in influencing their development by interacting with, and changing, those contexts. ( ② ) Even infants influence the world around them and construct their own development through their interactions. ( ③ ) The infant brings adults into close contact, making one-on-one interactions and creating opportunities for learning. ( ④ ) By engaging the world around them, thinking, being curious, and interacting with people, objects, and the world around them, individuals of all ages are \"manufacturers of their own development.\" ( ⑤ )"},

function goPassageSelect(){

function refInRange(ref, mode){
  if(mode==='all') return true;
  if(mode==='long') return parseInt(ref)>=41;
  if(mode==='18-28'){const n=parseInt(ref);return n>=18&&n<=28;}
  if(mode==='29-40'){const n=parseInt(ref);return n>=29&&n<=40;}
  return true;
}

function renderPassageGrid(){
  const grid = document.getElementById('passageGrid');
  grid.innerHTML='';
  PASSAGE_ORDER.forEach(ref=>{
    if(!refInRange(ref, filterMode)) return;
    if(!PASSAGES_BY_REF[ref]) return;
    const list = PASSAGES_BY_REF[ref].filter(typeOk);
    const count = list.length;
    const d = document.createElement('div');
    d.className='p-card'+(selectedRefs.has(ref)?' sel':'')+(doneRefs.has(ref)?' done':'')+(count===0?' off':'');
    d.onclick=()=>togglePassage(ref, d);
    const solvedN = list.filter(q=>_solved.has(q.no)).length;
    d.innerHTML=`<div class="p-no">${ref}번</div><div class="p-count">${count}문제</div><div class="p-solved">푼 문제 ${solvedN}/${count}</div>`
      +(doneRefs.has(ref)?'<span class="p-badge done-badge">완료✓</span>':'')
      +(selectedRefs.has(ref)&&!doneRefs.has(ref)?'<span class="p-badge" style="background:#f0e6d8;color:#6b4a2b;">선택</span>':'');
    grid.appendChild(d);
  });
}

function togglePassage(ref, el){
  if(selectedRefs.has(ref)){selectedRefs.delete(ref);el.classList.remove('sel');}
  else{selectedRefs.add(ref);el.classList.add('sel');}
  renderPassageGrid();
}

function filterPassage(mode, btn){
  filterMode=mode;
  document.querySelectorAll('.filter-bar .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderPassageGrid();
}

function selectAll(){
  const visible = PASSAGE_ORDER.filter(r=>refInRange(r, filterMode) && PASSAGES_BY_REF[r] && PASSAGES_BY_REF[r].some(typeOk));
  const allSel = visible.every(r=>selectedRefs.has(r));
  visible.forEach(r=>{ if(allSel) selectedRefs.delete(r); else selectedRefs.add(r); });
  renderPassageGrid();
}

function startQuiz(){
  if(selectedRefs.size===0){alert('지문을 하나 이상 선택하세요!');return;}
  qs=[];
  PASSAGE_ORDER.forEach(ref=>{
    if(selectedRefs.has(ref) && PASSAGES_BY_REF[ref]){
      const pool=_shuffle(PASSAGES_BY_REF[ref].filter(typeOk));
      // 안 푼 문제 → 틀렸던 문제 → 맞힌 문제 순
      const rank=q=>!_solved.has(q.no)?0:(_wrongSet.has(q.no)?1:2);
      pool.sort((a,b)=>rank(a)-rank(b));
      (perRef>0?pool.slice(0,perRef):pool).forEach(q=>qs.push(q));
    }
  });
  if(qs.length===0){alert('고른 번호에 해당 유형 문제가 없어요. 유형이나 번호를 다시 골라주세요.');return;}
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('passageScreen').classList.add('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · '+(selectedTypes.size?[...selectedTypes].join('·')+' · ':'')+selectedRefs.size+'개 번호 · '+qs.length+'문제';
  showQ();
}

function escHTML(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function showQ(){
  if(idx>=qs.length){showResult();return;}
  answered=false;
  const q=qs[idx];
  document.getElementById('pf').style.width=(idx/qs.length*100).toFixed(0)+'%';
  document.getElementById('hb').textContent=(idx+1)+'/'+qs.length;
  const area=document.getElementById('quizArea');

  const choiceHTML = q.choices.map((c,i)=>{
    return `<button class="cb" data-idx="${i+1}"><span class="cn">${i+1}</span><span>${escHTML(c)}</span></button>`;
  }).join('');

  const schoolBadge = q.school ? `<span class="qsrc">${escHTML(q.school)}</span>` : '';
  const typeBadge = q.type ? `<span class="qtype">${escHTML(q.type)}</span>` : '';

  area.innerHTML=`
    <div class="qc">
      <div class="q-no-badge">
        <span class="qno">Q${String(q.no).padStart(3,'0')}</span>
        ${typeBadge}
        <span class="passage-tag">${q.pref}번 · ${q.b}차</span>
        ${schoolBadge}
      </div>
      <div class="passage-box">${escHTML(q.body)}</div>
      <div class="q-prompt">❓ ${escHTML(q.stem)}</div>
      <div class="choices" id="qChoices">${choiceHTML}</div>
      <div class="fb-msg" id="fb"></div>
    </div>`;

  document.querySelectorAll('#qChoices .cb').forEach(b=>{
    b.addEventListener('click',()=>selChoice(b, parseInt(b.dataset.idx), q.ans));
  });
}

function selChoice(btn, sel, ans){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb');
  const q=qs[idx];
  if(sel===ans){
    btn.classList.add('correct');
    fb.className='fb-msg ok';fb.innerHTML='✅ 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    cor++;
    _solved.add(q.no); _wrongSet.delete(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:true, my:sel, ans:ans});
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.cb').forEach(b=>{if(parseInt(b.dataset.idx)===ans)b.classList.add('reveal');});
    fb.className='fb-msg no';fb.innerHTML='❌ 내 답: '+sel+'번 — <strong>'+q.choices[sel-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[sel-1]):'')+'<br>📗 정답: '+ans+'번 — <strong>'+q.choices[ans-1]+'</strong>'+(window.formatMeaningHint?window.formatMeaningHint(q.choices[ans-1]):'');
    wrn++;
    wrongs.push({label:'Q'+String(q.no).padStart(3,'0')+' · '+q.pref+'번 ['+q.type+'] '+q.school, my:sel+'번', correct:ans+'번', body:q.choices[ans-1]});
    _solved.add(q.no); _wrongSet.add(q.no); _saveHist();
    allResults.push({no:q.no, pref:q.pref, type:q.type, school:q.school, correct:false, my:sel, ans:ans});
  }
  if(q.exp){const e=document.createElement('div');e.className='fb-exp';e.textContent='💡 '+q.exp;fb.appendChild(e);}
  // 해설을 읽을 수 있도록 '다음' 버튼으로 넘어감
  const nb=document.createElement('button');nb.className='rbtn rbtn-p';nb.style.cssText='display:block;width:100%;margin-top:10px;';
  nb.textContent=(idx+1>=qs.length)?'결과 보기 →':'다음 문제 →';
  nb.onclick=()=>{idx++;_saveSession();showQ();window.scrollTo({top:0});};
  fb.parentNode.appendChild(nb);
}

      day: _DAY_KEY,
      userName: (typeof userName!=='undefined'?userName:''),
      userSchool: (typeof userSchool!=='undefined'?userSchool:''),
      qs, idx,
      cor: (typeof cor!=='undefined'?cor:0),
      wrn: (typeof wrn!=='undefined'?wrn:0),
      wrongs: (typeof wrongs!=='undefined'?wrongs:[]),
      allResults: (typeof allResults!=='undefined'?allResults:[]),
      selectedRefs: (typeof selectedRefs!=='undefined'?Array.from(selectedRefs):[]),
      doneRefs: (typeof doneRefs!=='undefined'?Array.from(doneRefs):[]),
      selectedNos: (typeof selectedNos!=='undefined'?Array.from(selectedNos||[]):[]),
      doneNos: (typeof doneNos!=='undefined'?Array.from(doneNos):[]),
      quizMode: (typeof quizMode!=='undefined'?quizMode:''),
      filterMode: (typeof filterMode!=='undefined'?filterMode:''),
      mode: (typeof mode!=='undefined'?mode:''),
      round: (typeof round!=='undefined'?round:''),
      elapsedMs: (typeof t0!=='undefined' && t0)?(Date.now()-t0):0,
      savedAt: Date.now()
    };
    localStorage.setItem(_SESSION_KEY, JSON.stringify(state));
  }catch(e){}
}
function _loadSession(){
  try{
    const raw = localStorage.getItem(_SESSION_KEY); if(!raw) return null;
    const s = JSON.parse(raw);
    if(s.day !== _DAY_KEY){ localStorage.removeItem(_SESSION_KEY); return null; }
    if(!s.qs || !s.qs.length || s.idx >= s.qs.length){ localStorage.removeItem(_SESSION_KEY); return null; }
    return s;
  }catch(e){ return null; }
}
function _clearSession(){ try{ localStorage.removeItem(_SESSION_KEY); }catch(e){} }
function _restoreSessionState(s){
  if(typeof userName!=='undefined'){ userName = s.userName||''; }
  if(typeof userSchool!=='undefined'){ userSchool = s.userSchool||''; }
  qs = s.qs; idx = s.idx;
  if(typeof cor!=='undefined') cor = s.cor||0;
  if(typeof wrn!=='undefined') wrn = s.wrn||0;
  if(typeof wrongs!=='undefined') wrongs = s.wrongs||[];
  if(typeof allResults!=='undefined') allResults = s.allResults||[];
  if(typeof selectedRefs!=='undefined') selectedRefs = new Set(s.selectedRefs||[]);
  if(typeof doneRefs!=='undefined' && Array.isArray(s.doneRefs)) doneRefs = new Set(s.doneRefs);
  if(typeof selectedNos!=='undefined') selectedNos = new Set(s.selectedNos||[]);
  if(typeof doneNos!=='undefined' && Array.isArray(s.doneNos)) doneNos = new Set(s.doneNos);
  if(typeof quizMode!=='undefined' && s.quizMode) quizMode = s.quizMode;
  if(typeof filterMode!=='undefined' && s.filterMode) filterMode = s.filterMode;
  if(typeof mode!=='undefined' && s.mode) mode = s.mode;
  if(typeof round!=='undefined' && s.round) round = s.round;
  if(typeof t0!=='undefined') t0 = Date.now() - (s.elapsedMs||0);
  if(typeof answered!=='undefined') answered = false;
  if(typeof _loadHist==='function') _loadHist();
}
function _enterQuizScreen(){
  ['startScreen','passageScreen','loginScreen','passages','hubScreen','startView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  ['hdr','pw','quizArea','quizScreen','quizWrap','quizView'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.remove('hidden');
  });
}
function resumeSession(){
  const s = _loadSession(); if(!s){ const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; return; }
  _restoreSessionState(s);
  _enterQuizScreen();
  if(typeof showQ==='function') showQ();
  else if(typeof renderQuestion==='function') renderQuestion();
  else if(typeof drawQ==='function') drawQ();
}
function discardSession(){ _clearSession(); const rb=document.getElementById('resumeBox'); if(rb) rb.style.display='none'; }
function checkResumePrompt(){
  const s = _loadSession(); if(!s) return;
  const rb = document.getElementById('resumeBox'); if(!rb) return;
  const remain = s.qs.length - s.idx;
  const elapsedMin = Math.round((s.elapsedMs||0)/60000);
  const info = document.getElementById('resumeInfo');
  if(info) info.innerHTML =
    '<strong>'+(s.userName||'학생')+'</strong>님 · '+s.qs.length+'문제 중 <strong>'+s.idx+'번째</strong>까지 풀었어요 ('+remain+'문제 남음)<br>'+
    '진행한 시간: '+elapsedMin+'분 · 정답 '+(s.cor||0)+' / 오답 '+(s.wrn||0);
  rb.style.display='block';
}
window.resumeSession = resumeSession;
window.discardSession = discardSession;

function showResult(){
  _clearSession();
  document.getElementById('pf').style.width='100%';
  document.getElementById('quizArea').classList.add('hidden');
  const total=idx, pct=total>0?Math.round(cor/total*100):0;
  const el=Math.round((Date.now()-t0)/60000);
  selectedRefs.forEach(r=>doneRefs.add(r));
  _saveProg();
  // build wrongQs
  const wrongNos = new Set();
  allResults.forEach(r=>{if(!r.correct)wrongNos.add(r.no);});
  wrongQs = qs.filter(q=>wrongNos.has(q.no));

  const wHTML=wrongs.length>0
    ?'<div class="wl"><h3>❌ 오답 ('+wrongs.length+'개)</h3>'+wrongs.map(w=>'<div class="wi"><div class="wie">'+w.label+'</div><div class="wid">내 답: '+w.my+' → 정답: '+w.correct+'</div></div>').join('')+'</div>'
    :'<div style="color:#2e7d32;font-weight:800;padding:14px;text-align:center;">🎉 전부 정답!</div>';

  const retryBtn = wrongs.length>0
    ? `<button class="rbtn" style="background:linear-gradient(135deg,#c62828,#e91e63);color:white;" onclick="retryWrongs()">❌ 오답 다시풀기 (${wrongs.length}개)</button>`
    : '';

  const rs=document.getElementById('resultScreen');
  rs.classList.remove('hidden');
  rs.innerHTML=`<div class="rc">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">고1 25년 6월 총괄 · ${selectedRefs.size}개 지문 · ${total}문제</div>
    <div class="rs">${pct}점</div>
    <div class="rsub">${userName}의 결과</div>
    <div class="sr">
      <div class="si"><div class="sn" style="color:#2e7d32;">${cor}</div><div class="sl">정답</div></div>
      <div class="si"><div class="sn" style="color:#c62828;">${wrn}</div><div class="sl">오답</div></div>
      <div class="si"><div class="sn" style="color:#6b4a2b;">${total}</div><div class="sl">총문제</div></div>
      <div class="si"><div class="sn" style="color:#f57f17;">${el}분</div><div class="sl">소요</div></div>
    </div>
    ${wHTML}
    <div class="rbtns">
      ${retryBtn}
      <button class="rbtn rbtn-p" onclick="goBack()">← 지문 다시 선택</button>
      <button class="rbtn rbtn-s" onclick="bnRestart()">처음부터 🔄</button>
    </div>
  </div>`;

  if(window._fbSave) window._fbSave({
    submittedAt: new Date().toISOString(),
    studentName: userName,
    school: userSchool,
    score: pct,
    correct: cor,
    wrong: wrn,
    total: total,
    elapsedMin: el,
    quizType: '고1_22년9월_총괄_학교기출',
    mockId: QUIZ_ID,
    qids: allResults.map(r=>r.no),
    passages: [...selectedRefs].sort(),
    types: [...selectedTypes],
    details: allResults.map(r=>({
      문제: 'Q'+String(r.no).padStart(3,'0'),
      지문: r.pref+'번',
      학교기출: r.school||'',
      유형: r.type,
      결과: r.correct ? '✅정답' : '❌오답',
      내답: r.my+'번',
      정답: r.ans+'번'
    })),
    wrongList: wrongs.map(w=>({label:w.label, my:w.my, correct:w.correct}))
  });
}

function retryWrongs(){
  if(wrongQs.length===0) return;
  qs=[...wrongQs];
  idx=0; cor=0; wrn=0; wrongs=[]; allResults=[]; answered=false; t0=Date.now();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  document.getElementById('hdr').classList.remove('hidden');
  document.getElementById('pw').classList.remove('hidden');
  document.getElementById('hs').textContent=userName+' · 오답 다시풀기';
  showQ();
}

function goBack(){
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('hdr').classList.add('hidden');
  document.getElementById('pw').classList.add('hidden');
  selectedRefs.clear();
  renderPassageGrid();
  document.getElementById('passageScreen').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded',()=>{
  const n=localStorage.getItem('bomnal_name');
  const s=localStorage.getItem('bomnal_school');
  if(n) document.getElementById('ni').value=n;
  if(s){
    const sel=document.getElementById('si');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value&&s.includes(sel.options[i].value)){sel.value=sel.options[i].value;break;}
    }
  }
  _cleanupOldProgress();
  _loadProg();
  checkResumePrompt();
});
</script>

<script>
// 결과 화면에서 잘못 눌러 처음부터 돌아가는 사고가 잦아 한 번 더 묻는다
function bnRestart(){
  if(confirm('정말 처음부터 다시 푸시겠습니까?\n\n지금까지 푼 내용과 점수가 모두 지워지고 처음으로 돌아갑니다.')) location.reload();
}
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<script src="bn_save.js"></script>
<script src="bn_progress.js?v=1"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#4a6741"/>
<title>봄날 퀴즈 | 영어II 3과 단어시험</title>
<script type="module" src="bn_tracker.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ee;--card:#fffdf8;--ink:#3b352c;--soft:#8a7f74;
  --line:#e6dac4;--gold:#8a6a3e;--gold-d:#5c3d1e;
  --ok:#2f8f6b;--no:#c2543f;--okbg:#e4f5ed;--nobg:#fdeae6;
}
html,body{overscroll-behavior-y:contain}
body{font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:11pt;line-height:1.65;color:var(--ink);
  background:linear-gradient(160deg,#faf7f1,#f2ece1);min-height:100vh}
header{background:linear-gradient(135deg,#fffdf8,#f1e7d5);padding:22px 18px 18px;
  text-align:center;border-bottom:2px solid var(--line)}
.h-title{font-size:1.25rem;font-weight:800;color:var(--gold-d);letter-spacing:-.3px}
.h-sub{font-size:.86rem;color:var(--soft);margin-top:5px}
.h-badge{display:inline-block;margin-top:9px;background:var(--gold-d);color:#fff8ec;
  border-radius:20px;padding:5px 14px;font-size:.8rem;font-weight:700}
main{max-width:560px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:18px 16px;box-shadow:0 3px 14px rgba(120,90,40,.07);margin-bottom:14px}
h2{font-size:1.05rem;color:var(--gold-d);margin-bottom:6px}
.desc{font-size:.86rem;color:var(--soft);margin-bottom:14px;line-height:1.6}
label{display:block;font-size:.85rem;font-weight:700;color:var(--gold);margin:12px 0 6px}
input,select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:1rem;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:1rem;font-weight:800;letter-spacing:-.2px;
  background:linear-gradient(135deg,#8a6a3e,#5c3d1e);color:#fff8ec;margin-top:16px}
.btn.sub{background:#fff;color:var(--gold);border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.range{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:6px}
.range button{padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:#fff;
  font-family:inherit;font-size:.95rem;font-weight:800;color:var(--ink);cursor:pointer;line-height:1.3}
.range button span{display:block;font-size:.72rem;font-weight:400;color:var(--soft);margin-top:3px}
.range button.on{border-color:var(--gold);background:#fdf3df;color:var(--gold-d)}
.range button.on::after{content:'✓';position:absolute;top:5px;right:9px;font-size:.78rem;color:var(--gold)}
.range button{position:relative}
.range button.all{grid-column:1 / -1}
.pickmsg{margin-top:10px;text-align:center;font-size:.85rem;color:var(--soft)}
.pickmsg b{color:var(--gold-d)}
.bar{position:sticky;top:0;z-index:20;background:rgba(250,247,241,.96);
  border-bottom:1px solid var(--line);padding:9px 14px;backdrop-filter:blur(6px)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  max-width:560px;margin:0 auto;font-size:.82rem;color:var(--soft)}
.bar-top b{color:var(--gold-d);font-size:.92rem}
.pbar{max-width:560px;margin:7px auto 0;height:8px;border-radius:9px;background:#ece3d2;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#c9a961,#8a6a3e);transition:width .3s}
.step-tag{display:inline-block;background:#fdf3df;border:1.5px solid #e3d2ae;color:var(--gold-d);
  border-radius:9px;padding:3px 10px;font-size:.76rem;font-weight:800;margin-bottom:12px}
.word{font-size:2rem;font-weight:800;color:var(--gold-d);text-align:center;
  letter-spacing:-.5px;line-height:1.25;word-break:break-word}
.spk{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
  border-radius:50%;border:2px solid var(--line);background:#fff;font-size:1.05rem;
  cursor:pointer;margin:12px auto 0}
.spk.on{background:#fdf3df;border-color:var(--gold)}
.center{text-align:center}
.gl{font-size:.82rem;color:var(--soft);text-align:center;margin-top:10px;line-height:1.55}
.opts{display:grid;gap:9px;margin-top:16px}
.opt{padding:14px 12px;border:2px solid var(--line);border-radius:13px;background:#fff;
  font-family:inherit;font-size:1rem;font-weight:700;color:var(--ink);cursor:pointer;
  text-align:center;line-height:1.45;transition:all .12s}
.opt:hover:not(:disabled){border-color:var(--gold);background:#fffaf0}
.opt.sel{border-color:var(--gold);background:#fdf3df;color:var(--gold-d)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.no{border-color:var(--no);background:var(--nobg);color:var(--no)}
.opt:disabled{cursor:default}
.fb{margin-top:13px;text-align:center;font-size:.92rem;font-weight:800;min-height:24px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.fb small{display:block;font-weight:400;color:var(--soft);font-size:.8rem;margin-top:4px}
.res-score{font-size:2.6rem;font-weight:800;color:var(--gold-d);text-align:center;line-height:1.1}
.res-sub{text-align:center;color:var(--soft);font-size:.9rem;margin-top:6px}
.wrongs{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.wrongs h3{font-size:.9rem;color:var(--gold);margin-bottom:8px}
.wrow{display:flex;gap:8px;align-items:baseline;padding:5px 0;font-size:.88rem;
  border-bottom:1px solid #f1ebdf}
.wrow b{color:var(--gold-d);min-width:34%}
.wrow span{color:var(--soft)}
.send{margin-top:12px;text-align:center;font-size:.84rem;color:var(--soft)}
.send.ok{color:var(--ok);font-weight:700}
.hide{display:none!important}
@media(max-width:380px){.word{font-size:1.7rem}}
</style>
</head>
<body>

<header>
  <div class="h-title">영어II 3과 단어시험</div>
  <div class="h-sub">YBM 박준언 · Lesson 3 The Varied World of Viruses<br>독해가 되는 상세어휘 · 종촌고2 · 고운고2</div>
  <div class="h-badge">1단계 뜻 고르기 · 2단계 유의어 고르기</div>
</header>

<main>
  <!-- 시작 -->
  <section id="s-start">
    <div class="card">
      <h2 id="hello">안녕!</h2>
      <p class="desc">단어 <b id="totN">0</b>개 중에서 범위를 고르면,<br>
        ① 뜻 고르기 → ② 유의어 고르기 순서로 풀어요.</p>
      <div id="nameBox" class="hide">
        <label>이름</label>
        <input id="inName" type="text" placeholder="예) 홍길동" autocomplete="off"/>
        <label>학교</label>
        <select id="inSchool">
          <option value="고운고등학교">고운고등학교</option>
          <option value="종촌고등학교">종촌고등학교</option>
        </select>
      </div>
      <label>범위 <span style="font-weight:400;color:var(--soft)">— 여러 개 골라도 돼요</span></label>
      <div class="range" id="rangeBox"></div>
      <div class="pickmsg" id="pickMsg">고른 단어 0개</div>
      <button class="btn" id="goBtn" onclick="start()">시작하기 →</button>
    </div>
  </section>

  <!-- 푸는 중 -->
  <section id="s-quiz" class="hide">
    <div class="bar">
      <div class="bar-top">
        <span id="stepName">1단계 · 뜻 고르기</span>
        <span><b id="qPos">1 / 20</b></span>
      </div>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
    </div>
    <div class="card">
      <span class="step-tag" id="stepTag">① 뜻 고르기</span>
      <div class="center">
        <div class="word" id="qWord">word</div>
        <button class="spk" id="spkBtn" onclick="say()">🔊</button>
      </div>
      <div class="gl" id="qGloss"></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <button class="btn hide" id="okBtn" onclick="confirmPick()">확인 →</button>
      <button class="btn sub hide" id="nextBtn" onclick="nextQ()">다음 →</button>
    </div>
  </section>

  <!-- 결과 -->
  <section id="s-done" class="hide">
    <div class="card">
      <div class="res-score"><span id="rScore">0</span>점</div>
      <div class="res-sub"><span id="rRight">0</span>문제 맞고 <span id="rWrong">0</span>문제 틀렸어요</div>
      <div class="wrongs hide" id="wrongBox">
        <h3>틀린 것</h3>
        <div id="wrongList"></div>
      </div>
      <button class="btn hide" id="retryBtn" onclick="retryWrong()">틀린 것만 다시 풀기 🔁</button>
      <button class="btn sub" onclick="location.reload()">범위 다시 고르기</button>
      <div class="send" id="send">결과를 선생님께 보내는 중…</div>
    </div>
  </section>
</main>

, "be ready to"], "ant": ["be unable to", "be unprepared to"], "part": "Part IV", "gl": ""}, {"en": "beneficial", "ko": "유익한", "syn": ["helpful", "advantageous"], "ant": ["harmful", "detrimental"], "part": "Part IV", "gl": "producing good, helpful, advantageous, or favorable results"}, {"en": "purpose", "ko": "목적", "syn": ["goal", "objective"], "ant": [], "part": "Part IV", "gl": "the reason for which something is done, created, or exists"}, {"en": "defense against", "ko": "~에 대한 방어", "syn": ["protection against", "safeguard against"], "ant": ["exposure to", "vulnerability to"], "part": "Part IV", "gl": ""}, {"en": "viral diversity", "ko": "바이러스 다양성", "syn": ["virus diversity", "viral variation"], "ant": ["uniformity", "similarity"], "part": "Part IV", "gl": ""}, {"en": "reach an understanding of", "ko": "~을 이해하게 되다", "syn": ["gain an understanding of", "comprehend"], "ant": ["misunderstand", "overlook"], "part": "Part IV", "gl": ""}, {"en": "plague", "ko": "흑사병", "syn": [], "ant": ["health", "wellness"], "part": "Further Study", "gl": "a contagious bacterial disease characterized by fever and delirium; black death"}, {"en": "deadly", "ko": "치명적인", "syn": ["fatal", "lethal"], "ant": ["harmless", "harmless"], "part": "Further Study", "gl": "causing or capable of causing death; fatal"}, {"en": "treat", "ko": "치료하다", "syn": ["heal", "cure"], "ant": ["neglect", "ignore"], "part": "Further Study", "gl": ""}, {"en": "the sick", "ko": "환자들", "syn": ["patients", "the ill"], "ant": ["healthy people", "the well"], "part": "Further Study", "gl": "people who are affected by an illness, disease, or medical condition"}, {"en": "costume", "ko": "복장", "syn": ["outfit", "attire"], "ant": [], "part": "Further Study", "gl": "a set of clothes worn in a particular style, period, or activity"}, {"en": "polish", "ko": "광택제", "syn": [], "ant": [], "part": "Further Study", "gl": "a substance used to rub on a surface to make it smooth and shiny"}, {"en": "attach", "ko": "붙이다", "syn": ["connect", "fasten"], "ant": ["detach", "separate"], "part": "Further Study", "gl": "to join, fasten, or connect one object to another"}, {"en": "fasten", "ko": "잠그다", "syn": ["secure", "tie"], "ant": ["loosen", "unfasten"], "part": "Further Study", "gl": "to close, secure, or join securely together"}, {"en": "goat skin", "ko": "염소 가죽", "syn": [], "ant": [], "part": "Further Study", "gl": ""}, {"en": "stick", "ko": "지팡이", "syn": [], "ant": [], "part": "Further Study", "gl": ""}, {"en": "push away", "ko": "밀어내다", "syn": ["shove away", "drive away"], "ant": ["pull closer", "attract"], "part": "Further Study", "gl": ""}, {"en": "unusual", "ko": "특이한", "syn": ["strange", "uncommon"], "ant": ["ordinary", "common"], "part": "Further Study", "gl": "not habitually or commonly occurring or done; remarkable or strange"}, {"en": "mask", "ko": "가면", "syn": ["face mask", "covering"], "ant": [], "part": "Further Study", "gl": ""}, {"en": "beak", "ko": "부리", "syn": [], "ant": [], "part": "Further Study", "gl": "a bird's horny projecting jaws, or a beak-shaped protective mask component"}, {"en": "be filled with", "ko": "~으로 채워지다", "syn": ["be packed with", "contain"], "ant": ["be empty of", "lack"], "part": "Further Study", "gl": ""}, {"en": "herb", "ko": "약초", "syn": ["medicinal plant"], "ant": [], "part": "Further Study", "gl": "a plant used for flavoring, food, medicine, or perfume"}, {"en": "cause", "ko": "원인이 되다", "syn": ["bring about", "result in"], "ant": ["prevent", "avoid"], "part": "Further Study", "gl": ""}, {"en": "disrupt", "ko": "방해하다", "syn": ["disturb", "interrupt"], "ant": ["maintain", "preserve"], "part": "Further Study", "gl": "to interrupt, disturb, or cause disorder in an event, activity, or process"}, {"en": "internal balance", "ko": "내부 균형", "syn": ["inner balance", "bodily balance"], "ant": ["imbalance", "disorder"], "part": "Further Study", "gl": ""}, {"en": "filter", "ko": "걸러내다", "syn": ["purify", "screen"], "ant": ["contaminate", "pollute"], "part": "Further Study", "gl": "to pass a liquid, gas, or air through a device to remove unwanted impurities"}, {"en": "bacteria", "ko": "박테리아", "syn": ["germs", "microbes"], "ant": [], "part": "Further Study", "gl": ""}, {"en": "spread", "ko": "퍼지다", "syn": ["transmit", "circulate"], "ant": ["disappear", "be contained"], "part": "Further Study", "gl": "to extend, distribute, or reach over a wider area or population"}, {"en": "flea bite", "ko": "벼룩에 물린 상처", "syn": [], "ant": [], "part": "Further Study", "gl": ""}, {"en": "method", "ko": "방법", "syn": ["technique", "approach"], "ant": ["disorder", "randomness"], "part": "Further Study", "gl": ""}, {"en": "modern medicine", "ko": "현대 의학", "syn": ["contemporary medicine", "medical science"], "ant": ["traditional medicine", "ancient medicine"], "part": "Further Study", "gl": ""}, {"en": "detect", "ko": "발견하다", "syn": ["identify", "discover"], "ant": ["overlook", "miss"], "part": "Further Study", "gl": "to discover, identify, or notice the presence or existence of something"}, {"en": "counter", "ko": "대응하다", "syn": ["combat", "resist"], "ant": ["encourage", "support"], "part": "Further Study", "gl": "to respond, react, or act in opposition to something"}, {"en": "swiftly", "ko": "신속하게", "syn": ["rapidly", "quickly"], "ant": ["slowly", "gradually"], "part": "Further Study", "gl": "moving or acting with great speed; quickly or promptly"}, {"en": "protective gear", "ko": "보호 장비", "syn": ["protective equipment", "safety gear"], "ant": [], "part": "Further Study", "gl": ""}, {"en": "virus research", "ko": "바이러스 연구", "syn": [], "ant": [], "part": "Further Study", "gl": ""}, {"en": "patient treatment", "ko": "환자 치료", "syn": ["medical treatment", "patient care"], "ant": ["neglect", "mistreatment"], "part": "Further Study", "gl": ""}, {"en": "reliance on", "ko": "~에 대한 의존", "syn": ["dependence on", "trust in"], "ant": ["independence from", "distrust of"], "part": "Further Study", "gl": ""}, {"en": "remain unchanged", "ko": "변함없이 유지되다", "syn": ["stay the same", "remain constant"], "ant": ["change", "vary"], "part": "Further Study", "gl": ""}, {"en": "combat", "ko": "맞서 싸우다", "syn": ["fight", "battle"], "ant": ["surrender", "yield"], "part": "Further Study", "gl": "to take action to reduce, destroy, or fight against something harmful"}, {"en": "unseen", "ko": "보이지 않는", "syn": ["invisible", "hidden"], "ant": ["visible", "obvious"], "part": "Further Study", "gl": "not seen, noticed, or perceived; invisible"}];
var QUIZ_TYPE = '영어II_3과_단어시험';

var studentName = '', studentSchool = '';
var chosen = [], pool = [], queue = [], qi = 0, step = 1;
var wrongs = [], right = 0, answered = 0, startAt = 0, sent = false;
var cur = null, picked = [], locked = false;

function $(id){ return document.getElementById(id); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── 이름 ── */
(function(){
  try { studentName=(localStorage.getItem('bn_name')||'').trim();
        studentSchool=(localStorage.getItem('bn_school')||'').trim(); } catch(e){}
  if (studentName) $('hello').textContent = studentName + ' 학생, 반가워요! 🌸';
  else $('nameBox').classList.remove('hide');
  $('totN').textContent = WORDS.length;
  var parts = [];
  for (var i=0;i<WORDS.length;i++) if (parts.indexOf(WORDS[i].part)<0) parts.push(WORDS[i].part);
  var html = '<button class="all" data-r="전체">전체<span>' + WORDS.length + '단어</span></button>';
  for (var k=0;k<parts.length;k++){
    var n = WORDS.filter(function(w){ return w.part===parts[k]; }).length;
    html += '<button data-r="'+esc(parts[k])+'">'+esc(parts[k])+'<span>'+n+'단어</span></button>';
  }
  $('rangeBox').innerHTML = html;
  chosen = parts.slice();                       // 처음엔 전체
  paintRange();
  $('rangeBox').onclick = function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    var r = b.dataset.r;
    if (r === '전체') chosen = (chosen.length === parts.length) ? [] : parts.slice();
    else {
      var i = chosen.indexOf(r);
      if (i >= 0) chosen.splice(i, 1); else chosen.push(r);
    }
    paintRange();
  };
  window.__parts = parts;
})();

function paintRange(){
  var parts = window.__parts || [];
  var bs = $('rangeBox').querySelectorAll('button');
  for (var i=0;i<bs.length;i++){
    var r = bs[i].dataset.r;
    var on = (r === '전체') ? (chosen.length === parts.length && parts.length > 0)
                            : chosen.indexOf(r) >= 0;
    bs[i].classList.toggle('on', on);
  }
  var n = WORDS.filter(function(w){ return chosen.indexOf(w.part) >= 0; }).length;
  $('pickMsg').innerHTML = n ? '고른 단어 <b>' + n + '개</b> · 문항 <b>'
      + (n + WORDS.filter(function(w){ return chosen.indexOf(w.part)>=0 && w.syn.length>=2; }).length)
      + '개</b>'
    : '범위를 하나 이상 골라 주세요';
  $('goBtn').disabled = !n;
}

/* ── 발음 ── */
function say(){
  if (!cur || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(cur.w.en);
    u.lang='en-US'; u.rate=.85;
    var vs = speechSynthesis.getVoices();
    for (var i=0;i<vs.length;i++) if (/^en/i.test(vs[i].lang||'')) { u.voice=vs[i]; break; }
    var b = $('spkBtn'); b.classList.add('on');
    u.onend = u.onerror = function(){ b.classList.remove('on'); };
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ── 시작 ── */
function start(){
  if (!studentName){
    var n = $('inName').value.trim();
    if (!n){ $('inName').focus(); return; }
    studentName = n; studentSchool = $('inSchool').value;
    try { localStorage.setItem('bn_name',n); localStorage.setItem('bn_school',studentSchool); } catch(e){}
  }
  pool = WORDS.filter(function(w){ return chosen.indexOf(w.part) >= 0; });
  if (!pool.length) return;
  step = 1; qi = 0; wrongs = []; right = 0; answered = 0; sent = false;
  startAt = Date.now();
  queue = shuffle(pool).map(function(w){ return { w:w, step:1 }; });
  var s2 = shuffle(pool.filter(function(w){ return w.syn.length>=2; }))
             .map(function(w){ return { w:w, step:2 }; });
  queue = queue.concat(s2);
  $('s-start').classList.add('hide');
  $('s-quiz').classList.remove('hide');
  render();
}

/* ── 문항 그리기 ── */
function render(){
  if (qi >= queue.length){ finish(); return; }
  cur = queue[qi]; picked = []; locked = false;
  step = cur.step;
  $('stepName').textContent = step===1 ? '1단계 · 뜻 고르기' : '2단계 · 유의어 고르기';
  $('stepTag').textContent  = step===1 ? '① 알맞은 뜻 고르기' : '② 유의어 2개 모두 고르기';
  $('qPos').textContent = (qi+1) + ' / ' + queue.length;
  $('pfill').style.width = (qi/queue.length*100) + '%';
  $('qWord').textContent = cur.w.en;
  $('qGloss').textContent = (step===1 && cur.w.gl) ? cur.w.gl : '';
  $('fb').textContent = ''; $('fb').className = 'fb';
  $('nextBtn').classList.add('hide');
  $('okBtn').classList.toggle('hide', step===1);
  $('okBtn').disabled = true;
  var box = $('opts'); box.innerHTML = '';

  if (step===1){
    var wrong = shuffle(WORDS.filter(function(w){
      return w.ko !== cur.w.ko && w.en !== cur.w.en; })).slice(0,3);
    cur.opts = shuffle([cur.w.ko].concat(wrong.map(function(w){ return w.ko; })));
    cur.ans = [cur.w.ko];
  } else {
    var syn = cur.w.syn.slice(0,2);
    var ant = cur.w.ant.slice(0,2);
    while (ant.length < 2){                      // 반의어가 모자라면 다른 단어에서 빌린다
      var o = pool[Math.floor(Math.random()*pool.length)];
      var cand = (o.ant.concat(o.syn)).filter(function(x){
        return syn.indexOf(x)<0 && ant.indexOf(x)<0 && x!==cur.w.en; });
      if (cand.length) ant.push(cand[Math.floor(Math.random()*cand.length)]);
      else break;
    }
    cur.opts = shuffle(syn.concat(ant));
    cur.ans = syn;
  }
  for (var i=0;i<cur.opts.length;i++){
    var b = document.createElement('button');
    b.className = 'opt'; b.textContent = cur.opts[i];
    b.setAttribute('data-v', cur.opts[i]);
    b.onclick = (function(v, el){ return function(){ tap(v, el); }; })(cur.opts[i], b);
    box.appendChild(b);
  }
  if (step===1) setTimeout(say, 260);
}

function tap(v, el){
  if (locked) return;
  if (step===1){ picked = [v]; grade(); return; }
  var k = picked.indexOf(v);
  if (k>=0){ picked.splice(k,1); el.classList.remove('sel'); }
  else {
    if (picked.length >= 2) return;              // 유의어는 2개까지
    picked.push(v); el.classList.add('sel');
  }
  $('okBtn').disabled = picked.length !== 2;
}

function confirmPick(){ if (!locked) grade(); }

function grade(){
  locked = true; answered++;
  $('okBtn').classList.add('hide');
  var ok = cur.ans.length === picked.length;
  for (var i=0;i<cur.ans.length;i++) if (picked.indexOf(cur.ans[i])<0) ok = false;
  var bs = $('opts').querySelectorAll('.opt');
  for (var j=0;j<bs.length;j++){
    var v = bs[j].getAttribute('data-v');
    bs[j].disabled = true; bs[j].classList.remove('sel');
    if (cur.ans.indexOf(v)>=0) bs[j].classList.add('ok');
    else if (picked.indexOf(v)>=0) bs[j].classList.add('no');
  }
  if (ok){
    right++;
    $('fb').textContent = '정답이에요! 🌸';
    $('fb').className = 'fb ok';
  } else {
    wrongs.push({ en:cur.w.en, ko:cur.w.ko, step:step, ans:cur.ans.join(', ') });
    $('fb').innerHTML = '아쉬워요 — 정답은 <b>' + esc(cur.ans.join(', ')) + '</b>'
      + (step===2 ? '<small>' + esc(cur.w.en) + ' = ' + esc(cur.w.ko) + '</small>' : '');
    $('fb').className = 'fb no';
  }
  $('nextBtn').classList.remove('hide');
  if (ok && step===1) setTimeout(function(){ if (locked) nextQ(); }, 750);
}

function nextQ(){ qi++; render(); }

/* ── 결과 ── */
function finish(){
  $('s-quiz').classList.add('hide');
  $('s-done').classList.remove('hide');
  var total = answered || 1;
  var pct = Math.round(right/total*100);
  $('rScore').textContent = pct;
  $('rRight').textContent = right;
  $('rWrong').textContent = wrongs.length;
  if (wrongs.length){
    $('wrongBox').classList.remove('hide');
    $('retryBtn').classList.remove('hide');
    var h = '';
    for (var i=0;i<wrongs.length;i++){
      var w = wrongs[i];
      h += '<div class="wrow"><b>' + esc(w.en) + '</b><span>'
         + (w.step===1 ? esc(w.ko) : '유의어 ' + esc(w.ans)) + '</span></div>';
    }
    $('wrongList').innerHTML = h;
  } else {
    $('wrongBox').classList.add('hide');
    $('retryBtn').classList.add('hide');
  }
  save(pct);
}

function retryWrong(){
  var keys = {};
  for (var i=0;i<wrongs.length;i++) keys[wrongs[i].en + '#' + wrongs[i].step] = 1;
  var again = [];
  for (var j=0;j<pool.length;j++){
    if (keys[pool[j].en + '#1']) again.push({ w:pool[j], step:1 });
    if (keys[pool[j].en + '#2']) again.push({ w:pool[j], step:2 });
  }
  if (!again.length) return;
  queue = shuffle(again); qi = 0; wrongs = []; right = 0; answered = 0; sent = false;
  $('s-done').classList.add('hide');
  $('s-quiz').classList.remove('hide');
  render();
}

/* ── 선생님께 보내기 ── */
function save(pct){
  if (sent) return; sent = true;
  var data = {
    studentName: studentName, school: studentSchool,
    quizType: QUIZ_TYPE,
    level: (chosen.length === (window.__parts||[]).length ? '전체' : chosen.join(', ')),
    score: pct, correct: right, wrong: wrongs.length, total: answered,
    elapsedMin: Math.round((Date.now()-startAt)/60000),
    completed: true,
    wrongWords: wrongs.map(function(w){ return { eng:w.en, kor:w.step===1 ? w.ko : '유의어 '+w.ans }; }),
    userAgent: (navigator.userAgent||'').substring(0,100)
  };
  var waited = 0;
  var t = setInterval(function(){
    waited += 200;
    if (window._saveResult){ clearInterval(t); window._saveResult(data); done(); }
    else if (waited >= 2500){
      clearInterval(t);
      if (window._saveQuiz) window._saveQuiz(data);
      done();
    }
  }, 200);
  function done(){
    $('send').textContent = '✅ 선생님께 결과가 전달됐어요!';
    $('send').className = 'send ok';
  }
}

window.addEventListener('beforeunload', function(){
  if (!sent && answered > 0) save(Math.round(right/answered*100));
});
</script>
